missions:
  - id: global-lock-blocks-read
    title:
      en: Block a reader on the one lock
      ru: Заблокируй читателя на едином lock
    goal:
      en: Run the synchronized map so T2 blocks trying to read while T1 holds the single table-wide monitor.
      ru: Запусти synchronized map так, чтобы T2 заблокировался на чтении, пока T1 держит единый monitor всей таблицы.
    event: SYNC_BLOCKED
  - id: parallel-bin-locks
    title:
      en: Lock two different bins at once
      ru: Заблокируй два разных bins сразу
    goal:
      en: Have two threads lock two different bins of a ConcurrentHashMap at the same time without contention.
      ru: Заставь два threads заблокировать два разных bins ConcurrentHashMap одновременно без contention.
    event: CHM_BIN_LOCK_ACQUIRED
  - id: same-bin-contention
    title:
      en: Collide on one bin
      ru: Столкнись в одном bin
    goal:
      en: Make two keys that hash to the same bin contend, so the second writer blocks on just that bin.
      ru: Заставь два ключа из одного bin конкурировать, чтобы второй писатель заблокировался только на этом bin.
    event: CHM_BIN_BLOCKED
  - id: lock-free-read
    title:
      en: Read with no lock
      ru: Прочитай без lock
    goal:
      en: Read from a ConcurrentHashMap while another thread holds a bin lock, showing the read takes no lock.
      ru: Прочитай из ConcurrentHashMap, пока другой thread держит lock на bin, показав, что чтение без lock.
    event: CHM_GET
  - id: atomic-compound
    title:
      en: Use an atomic compound op
      ru: Используй атомарную compound-операцию
    goal:
      en: Use computeIfAbsent so a check-then-put on one key happens atomically instead of as two racy calls.
      ru: Используй computeIfAbsent, чтобы check-then-put по одному ключу выполнился атомарно, а не двумя гоночными вызовами.
    event: CHM_ATOMIC

bossFight:
  - id: core-difference
    en: What is the core difference between Collections.synchronizedMap(new HashMap<>()) and a ConcurrentHashMap?
    ru: В чём главная разница между Collections.synchronizedMap(new HashMap<>()) и ConcurrentHashMap?
  - id: lock-granularity
    en: Compare the lock granularity of the two — what exactly does each lock, and how does that affect throughput under contention?
    ru: Сравни гранулярность lock у обоих — что именно блокирует каждый и как это влияет на throughput при contention?
  - id: reads-locking
    en: Do reads take a lock in each one? Why does that matter for a read-heavy map?
    ru: Берут ли чтения lock в каждом случае? Почему это важно для map с преобладанием чтений?
  - id: iteration-semantics
    en: How does iterating a synchronized map differ from iterating a ConcurrentHashMap (fail-fast vs weakly consistent, external locking)?
    ru: Чем отличается итерация по synchronized map от итерации по ConcurrentHashMap (fail-fast и weakly consistent, внешний locking)?
  - id: compound-atomicity
    en: A single get or put on a synchronized map is atomic — so why is "if absent, put" still unsafe, and what does ConcurrentHashMap give you instead?
    ru: Отдельный get или put на synchronized map атомарен — почему тогда «если отсутствует, положить» всё равно небезопасен и что даёт взамен ConcurrentHashMap?
  - id: null-keys-values
    en: Why does ConcurrentHashMap forbid null keys and values when a synchronized HashMap allows them?
    ru: Почему ConcurrentHashMap запрещает null-ключи и null-значения, а синхронизированный HashMap их допускает?
  - id: when-to-choose
    en: In a high-throughput service with many threads, which would you choose and why? When is a synchronized map still fine?
    ru: В высоконагруженном сервисе с множеством threads что выберешь и почему? Когда synchronized map всё ещё подходит?
