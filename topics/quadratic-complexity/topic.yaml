summary:
  en: >
    O(n²) means the work grows with the square of the input: double the data and
    you do four times the work; grow it tenfold and you do a hundred times the
    work. It is usually fine for tiny inputs but scales terribly — the classic
    source is a loop inside a loop over the same data (compare every pair). This
    topic explains where O(n²) comes from, why it hurts in production, and how to
    turn it into O(n) or O(n log n).
  ru: >
    O(n²) означает, что объём работы растёт как квадрат размера входа: удвоишь
    данные — работы станет вчетверо больше; увеличишь в десять раз — в сто раз
    больше. Для крошечных входов это обычно нормально, но масштабируется ужасно.
    Классический источник — цикл внутри цикла по одним и тем же данным (сравнить
    каждую пару). Тема объясняет, откуда берётся O(n²), почему он бьёт по
    продакшену и как превратить его в O(n) или O(n log n).

