missions:
  - id: show-lost-update
    title:
      en: Show the race
      ru: Покажи race
    goal:
      en: Run an unprotected read-modify-write sequence that emits a lost update.
      ru: Запусти незащищённую последовательность read-modify-write, которая даёт потерянное обновление.
    event: LOST_UPDATE
  - id: avoid-sharing
    title:
      en: Avoid shared state
      ru: Избеги общего состояния
    goal:
      en: Run code where work stays outside the shared critical section.
      ru: Запусти код, где работа остаётся вне общей critical section.
    event: OUTSIDE_WORK
  - id: protect-update
    title:
      en: Protect the update
      ru: Защити обновление
    goal:
      en: Read and write the shared value while the thread owns the lock.
      ru: Прочитай и запиши общее значение, пока thread владеет lock.
    event: SHARED_WRITE
  - id: queue-contender
    title:
      en: Queue a contender
      ru: Поставь конкурента в очередь
    goal:
      en: Make a second thread wait for the same lock instead of entering the shared update.
      ru: Заставь второй thread ждать тот же lock вместо входа в общее обновление.
    event: THREAD_WAITING
  - id: release-lock
    title:
      en: Release promptly
      ru: Освободи вовремя
    goal:
      en: Exit the protected block after the shared update is finished.
      ru: Выйди из защищённого блока после завершения общего обновления.
    event: CRITICAL_SECTION_EXIT

bossFight:
  - id: define-race-condition
    en: What is a race condition, and why is shared mutable state usually involved?
    ru: Что такое состояние гонки и почему обычно в нём участвует общее изменяемое состояние?
  - id: avoidance-checklist
    en: Name the main ways to avoid race conditions in Java code.
    ru: Назови основные способы избежать состояния гонки в Java-коде.
  - id: same-lock-rule
    en: Why must all threads use the same lock for the same shared invariant?
    ru: Почему все threads должны использовать один и тот же lock для одного общего invariant?
  - id: volatile-trap
    en: Why does volatile not make count++ thread-safe?
    ru: Почему volatile не делает count++ thread-safe?
  - id: atomic-tool-choice
    en: When would you prefer AtomicInteger or ConcurrentHashMap over a manual lock?
    ru: Когда стоит предпочесть AtomicInteger или ConcurrentHashMap ручному lock?
  - id: lock-scope
    en: What should and should not be inside a critical section?
    ru: Что должно и что не должно находиться внутри critical section?
