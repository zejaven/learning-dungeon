# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: build-chain
    title:
      en: Build a chain
      ru: Построй цепочку
    goal:
      en: Link at least one handler into the chain with addHandler(...).
      ru: Добавь в цепочку хотя бы один обработчик через addHandler(...).
    event: HANDLER_ADDED
  - id: handle
    title:
      en: Handle a request
      ru: Обработай запрос
    goal:
      en: Send a request that a handler can approve so the chain stops on it.
      ru: Отправь запрос, который сможет одобрить обработчик, чтобы цепочка на нём остановилась.
    event: REQUEST_HANDLED
  - id: pass
    title:
      en: Pass it on
      ru: Передай дальше
    goal:
      en: Send a request too big for the first handler so it escalates to the next.
      ru: Отправь запрос, слишком большой для первого обработчика, чтобы он эскалировал дальше.
    event: HANDLER_PASS
  - id: unhandled
    title:
      en: Fall off the end
      ru: Выпасть из конца
    goal:
      en: Send a request no handler can approve so it leaves the chain unhandled.
      ru: Отправь запрос, который никто не может одобрить, чтобы он покинул цепочку необработанным.
    event: REQUEST_UNHANDLED

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: problem-decouple
    en: What problem does Chain of Responsibility solve, and how does it decouple sender from receiver?
    ru: Какую проблему решает Chain of Responsibility и как он развязывает отправителя и получателя?
  - id: handle-or-pass
    en: How does a handler decide whether to handle a request or pass it on?
    ru: Как обработчик решает, обработать запрос или передать его дальше?
  - id: order-matters
    en: Why does the order of handlers in the chain matter?
    ru: Почему важен порядок обработчиков в цепочке?
  - id: none-handles
    en: What should happen when no handler can process a request?
    ru: Что должно происходить, когда ни один обработчик не может обработать запрос?
  - id: vs-decorator
    en: How is this pattern different from a Decorator, which also wraps a chain of objects?
    ru: Чем этот паттерн отличается от Decorator, который тоже оборачивает цепочку объектов?
  - id: real-frameworks
    en: Where do you see Chain of Responsibility in real frameworks (e.g. Servlet filters, Spring Security)?
    ru: Где Chain of Responsibility встречается в реальных фреймворках (например, фильтры сервлетов, Spring Security)?
