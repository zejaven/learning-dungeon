id: concurrent-synchronized-collections
languages: [en, ru]
title:
  en: Concurrent vs Synchronized Collections
  ru: Concurrent и synchronized коллекции
category:
  en: Java Core / Concurrency
  ru: Java Core / Многопоточность
type: CONCURRENCY
mode: trace
summary:
  en: >
    How synchronized collection wrappers differ from java.util.concurrent
    collections, why one shared monitor limits throughput, why iterators behave
    differently, and when atomic operations such as putIfAbsent matter.
  ru: >
    Чем synchronized wrappers для коллекций отличаются от java.util.concurrent
    collections, почему один общий monitor ограничивает throughput, почему
    iterators ведут себя по-разному и когда важны атомарные операции вроде
    putIfAbsent.
categoryId: concurrency
difficulty: 2
catalogId: concurrency-5
style: Real world
aiProvider: codex
aiModel: gpt-5.5

primitives:
  - ArrayGrid
  - LinkedNodes
  - BoxGroup

defaultExample: synchronized-lock

examples:
  - id: synchronized-lock
    title:
      en: One monitor
      ru: Один monitor
    file: 01-synchronized-lock.java
    explanation:
      en: >
        A synchronized collection protects each method with one monitor. If T1
        owns it, T2 is blocked even when it only wants another simple operation.
      ru: >
        Synchronized collection защищает каждый метод одним monitor. Если T1
        владеет им, T2 блокируется, даже когда хочет выполнить другую простую
        операцию.
  - id: fail-fast-iterator
    title:
      en: Fail-fast iterator
      ru: Fail-fast iterator
    file: 02-fail-fast-iterator.java
    explanation:
      en: >
        A synchronized wrapper does not make iteration atomic. A write from
        another thread invalidates the iterator unless the caller locks around
        the whole traversal.
      ru: >
        Synchronized wrapper не делает iteration атомарной. Запись из другого
        thread инвалидирует iterator, если caller не держит lock вокруг всего
        обхода.
  - id: concurrent-read-write
    title:
      en: Concurrent reads
      ru: Concurrent reads
    file: 03-concurrent-read-write.java
    explanation:
      en: >
        A concurrent collection is built for overlapping operations. Reads and
        writes can progress without one global monitor around the whole map.
      ru: >
        Concurrent collection рассчитана на пересекающиеся операции. Reads и
        writes могут продолжаться без одного общего monitor вокруг всей map.
  - id: atomic-put-if-absent
    title:
      en: Atomic putIfAbsent
      ru: Атомарный putIfAbsent
    file: 04-atomic-put-if-absent.java
    explanation:
      en: >
        ConcurrentHashMap-style APIs provide atomic compound operations. Two
        threads racing for one key do not need a manual check-then-put block.
      ru: >
        API в стиле ConcurrentHashMap дают атомарные compound operations. Двум
        threads, конкурирующим за один key, не нужен ручной блок check-then-put.
  - id: weak-iterator
    title:
      en: Weak iterator
      ru: Weak iterator
    file: 05-weak-iterator.java
    explanation:
      en: >
        ConcurrentHashMap iterators are weakly consistent: they do not throw
        fail-fast exceptions when the map changes during traversal.
      ru: >
        Iterators у ConcurrentHashMap weakly consistent: они не выбрасывают
        fail-fast exceptions, когда map меняется во время обхода.
  - id: copy-on-write
    title:
      en: Copy-on-write snapshot
      ru: Copy-on-write snapshot
    file: 06-copy-on-write.java
    explanation:
      en: >
        CopyOnWriteArrayList-style iteration reads an old array snapshot, while
        each write copies and publishes a new backing array.
      ru: >
        Iteration в стиле CopyOnWriteArrayList читает старый array snapshot, а
        каждая запись копирует и публикует новый backing array.

assistantExample:
  en: 'e.g. When would you choose ConcurrentHashMap instead of Collections.synchronizedMap?'
  ru: 'например: Когда выбрать ConcurrentHashMap вместо Collections.synchronizedMap?'

