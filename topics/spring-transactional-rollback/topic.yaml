id: spring-transactional-rollback
languages: [en, ru]
title:
  en: '@Transactional Rollback Rules'
  ru: 'Правила отката @Transactional'
category:
  en: Spring / Transactions
  ru: Spring / Транзакции
type: TRANSACTION
mode: trace
aiProvider: codex
aiModel: gpt-5.5
categoryId: spring
difficulty: 2
catalogId: spring-10
style: Real world
summary:
  en: >
    How Spring decides whether an @Transactional method commits or rolls back:
    runtime exceptions and Error roll back by default, checked exceptions commit
    unless rollbackFor matches, and a failure after persist rolls back only while
    the transactional proxy is still controlling the method call.
  ru: >
    Как Spring решает, зафиксировать или откатить @Transactional метод:
    runtime exceptions и Error по умолчанию откатывают транзакцию, checked
    exceptions фиксируют её, если не совпал rollbackFor, а ошибка после persist
    откатывает изменения только пока вызовом метода ещё управляет transactional proxy.

primitives:
  - ArrayGrid
  - EventLog

defaultExample: external-runtime

examples:
  - id: happy-commit
    title:
      en: Normal commit
      ru: Нормальная фиксация
    file: 01-happy-commit.java
    explanation:
      en: >
        The method stages one row with persist and exits normally. The
        transaction interceptor commits, so the staged row moves into the
        committed database.
      ru: >
        Метод подготавливает одну строку через persist и завершается нормально.
        Transaction interceptor фиксирует транзакцию, поэтому подготовленная
        строка переходит в зафиксированную базу.
  - id: runtime-rollback
    title:
      en: Runtime exception rolls back
      ru: Runtime exception откатывает
    file: 02-runtime-rollback.java
    explanation:
      en: >
        A propagated unchecked exception makes Spring mark the transaction
        rollback-only by default. The staged row is discarded.
      ru: >
        Вышедший наружу unchecked exception по умолчанию заставляет Spring
        пометить транзакцию rollback-only. Подготовленная строка отбрасывается.
  - id: checked-default
    title:
      en: Checked exception commits
      ru: Checked exception фиксирует
    file: 03-checked-default.java
    explanation:
      en: >
        A checked exception does not trigger rollback by default. If no custom
        rule matches, Spring may still commit the transaction.
      ru: >
        Checked exception по умолчанию не запускает rollback. Если пользовательское
        правило не совпало, Spring может всё равно зафиксировать транзакцию.
  - id: rollback-for-checked
    title:
      en: rollbackFor changes it
      ru: rollbackFor меняет правило
    file: 04-rollback-for-checked.java
    explanation:
      en: >
        Adding rollbackFor for a checked exception makes that checked exception
        roll back just like a runtime exception.
      ru: >
        Добавление rollbackFor для checked exception заставляет этот checked
        exception откатывать транзакцию так же, как runtime exception.
  - id: external-runtime
    title:
      en: External call after persist
      ru: Внешний вызов после persist
    file: 05-external-runtime.java
    explanation:
      en: >
        The external call happens inside the @Transactional method after persist
        but before the proxy commits. Its runtime exception propagates out, so
        the staged row rolls back.
      ru: >
        Внешний вызов происходит внутри @Transactional метода после persist, но
        до commit от proxy. Его runtime exception выходит наружу, поэтому
        подготовленная строка откатывается.
  - id: after-commit
    title:
      en: Failure after commit
      ru: Ошибка после commit
    file: 06-after-commit.java
    explanation:
      en: >
        If the transactional method has already returned and committed, a later
        external failure is outside that transaction and cannot undo the
        committed row.
      ru: >
        Если @Transactional метод уже вернулся и зафиксировался, последующая
        внешняя ошибка находится вне этой транзакции и не может отменить
        зафиксированную строку.

assistantExample:
  en: 'e.g. Will @Transactional roll back if a payment client throws after persist?'
  ru: 'например: Откатится ли @Transactional, если payment client бросит exception после persist?'

missionsFile: quiz.yaml
