missions:
  - id: push-a-frame
    title:
      en: Push a stack frame
      ru: Добавь кадр стека
    goal:
      en: Run any example so a method call pushes a new frame onto the thread's call stack.
      ru: Запусти любой пример, чтобы вызов метода положил новый кадр в стек вызовов потока.
    event: STACK_PUSH
  - id: overflow-the-stack
    title:
      en: Overflow the stack
      ru: Переполни стек
    goal:
      en: Run an unbounded recursion so the stack fills up and the JVM throws StackOverflowError.
      ru: Запусти бесконечную рекурсию, чтобы стек заполнился и JVM бросила StackOverflowError.
    event: STACK_OVERFLOW
  - id: pop-a-frame
    title:
      en: Return and pop a frame
      ru: Вернись и сними кадр
    goal:
      en: Run the correct recursion so a method returns and its frame is popped — the stack never overflows.
      ru: Запусти корректную рекурсию, чтобы метод вернулся и его кадр снялся — стек не переполняется.
    event: STACK_POP

bossFight:
  - id: what-is-stackoverflow
    en: What is a StackOverflowError in Java, and when does the JVM throw it?
    ru: Что такое StackOverflowError в Java и когда JVM его бросает?
  - id: simplest-cause
    en: Write the simplest method that causes a StackOverflowError.
    ru: Напиши простейший метод, который вызывает StackOverflowError.
  - id: error-vs-exception
    en: Is StackOverflowError an Error or an Exception? Should you normally catch it?
    ru: StackOverflowError — это Error или Exception? Стоит ли его обычно ловить?
  - id: stack-vs-heap-limit
    en: How does StackOverflowError differ from OutOfMemoryError? Which memory area fills up in each?
    ru: Чем StackOverflowError отличается от OutOfMemoryError? Какая область памяти переполняется в каждом случае?
  - id: base-case-fix
    en: Your recursion throws StackOverflowError. What are the usual causes and how do you fix it?
    ru: Твоя рекурсия бросает StackOverflowError. Каковы обычные причины и как это исправить?
  - id: stack-size-control
    en: What controls how deep the call stack can get before it overflows?
    ru: Что определяет, насколько глубоким может стать стек вызовов до переполнения?
  - id: deep-but-correct
    en: Can a recursion with a correct base case still overflow? Give an example.
    ru: Может ли рекурсия с корректным базовым случаем всё равно переполнить стек? Приведи пример.
