id: stack-and-queue-lifo-fifo
title:
  en: 'Stack and Queue: LIFO vs FIFO'
  ru: 'Стек и очередь: LIFO vs FIFO'
category:
  en: Algorithms / Data Structures
  ru: Алгоритмы / Структуры данных
type: DATA_STRUCTURE
mode: trace
aiProvider: codex
aiModel: gpt-5.5
categoryId: algorithms
difficulty: 1
catalogId: algorithms-10
style: Real world
summary:
  en: >
    Learn the difference between a stack and a queue: stack operations follow
    LIFO, queue operations follow FIFO, and Java usually models both with Deque
    or Queue APIs backed by ArrayDeque.
  ru: >
    Разберись, чем отличаются stack и queue: операции stack следуют LIFO,
    операции queue следуют FIFO, а в Java оба варианта обычно моделируют через
    Deque или Queue API на базе ArrayDeque.

primitives:
  - LinkedNodes
  - EventLog

defaultExample: stack-lifo

examples:
  - id: stack-lifo
    title:
      en: Stack removes newest first
      ru: Stack удаляет новое первым
    file: 01-stack-lifo.java
    explanation:
      en: >
        Three plates are pushed onto one stack. pop() removes the last pushed
        plate, showing LIFO.
      ru: >
        Три тарелки кладутся в один stack. pop() удаляет тарелку, которую
        положили последней, показывая LIFO.
  - id: queue-fifo
    title:
      en: Queue removes oldest first
      ru: Queue удаляет старое первым
    file: 02-queue-fifo.java
    explanation:
      en: >
        Three tickets enter a queue. poll() removes the ticket that arrived
        first, showing FIFO.
      ru: >
        Три талона попадают в queue. poll() удаляет талон, который пришел
        первым, показывая FIFO.
  - id: peek-without-remove
    title:
      en: Peek without removing
      ru: Peek без удаления
    file: 03-peek-without-remove.java
    explanation:
      en: >
        peek() reads the next stack or queue item without changing the order.
      ru: >
        peek() читает следующий элемент stack или queue, не меняя порядок.
  - id: undo-stack
    title:
      en: Undo stack
      ru: Stack для undo
    file: 04-undo-stack.java
    explanation:
      en: >
        Undo uses stack behavior because the most recent action should be
        reversed first.
      ru: >
        Undo использует поведение stack, потому что самое недавнее действие
        нужно отменить первым.
  - id: worker-queue
    title:
      en: Worker queue
      ru: Queue для worker
    file: 05-worker-queue.java
    explanation:
      en: >
        Print jobs use queue behavior because earlier jobs should be processed
        before later jobs.
      ru: >
        Задания печати используют поведение queue, потому что ранние задания
        должны обрабатываться раньше поздних.

assistantExample:
  en: 'e.g. Why would undo use a stack, but a printer use a queue?'
  ru: 'например: Почему undo использует stack, а принтер использует queue?'

missionsFile: quiz.yaml
