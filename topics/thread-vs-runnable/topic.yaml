id: thread-vs-runnable
title:
  en: Thread vs Runnable
  ru: Thread vs Runnable
category:
  en: Java Core / Concurrency
  ru: Java Core / Многопоточность
type: CONCURRENCY
mode: trace
summary:
  en: >
    The difference between a Runnable task and a Thread execution object, why
    start() is not the same as run(), when subclassing Thread is a poor fit, and
    why passing Runnable keeps work reusable.
  ru: >
    Разница между задачей Runnable и объектом выполнения Thread, почему start()
    не то же самое, что run(), когда наследование от Thread плохо подходит, и
    почему передача Runnable делает работу переиспользуемой.
categoryId: concurrency
difficulty: 1
catalogId: concurrency-2
style: Real world
aiProvider: codex
aiModel: gpt-5.5

primitives:
  - ArrayGrid
  - LinkedNodes
  - EventLog

defaultExample: runnable-task

examples:
  - id: runnable-task
    title:
      en: Runnable as the task
      ru: Runnable как задача
    file: 01-runnable-task.java
    explanation:
      en: >
        A Runnable describes the work. A Thread receives that work and start()
        asks the JVM to run it on a separate Java thread.
      ru: >
        Runnable описывает работу. Thread получает эту работу, а start() просит
        JVM выполнить ее в отдельном Java thread.
  - id: thread-subclass
    title:
      en: Thread subclass
      ru: Подкласс Thread
    file: 02-thread-subclass.java
    explanation:
      en: >
        Extending Thread puts the work inside the worker object. It works, but
        it couples the task to one execution mechanism.
      ru: >
        Наследование от Thread помещает работу внутрь объекта worker. Это
        работает, но связывает задачу с одним способом выполнения.
  - id: reuse-runnable
    title:
      en: Reuse one Runnable
      ru: Переиспользуй один Runnable
    file: 03-reuse-runnable.java
    explanation:
      en: >
        The same Runnable instance can be handed to more than one Thread. That is
        the core benefit of separating the task from the worker.
      ru: >
        Один и тот же экземпляр Runnable можно передать нескольким Thread. Это
        главное преимущество разделения задачи и worker.
  - id: run-vs-start
    title:
      en: run() vs start()
      ru: run() и start()
    file: 04-run-vs-start.java
    explanation:
      en: >
        Calling run() directly is just a normal method call on the current
        thread. Calling start() creates a separate execution path.
      ru: >
        Прямой вызов run() является обычным вызовом метода в текущем thread.
        Вызов start() создает отдельный путь выполнения.
  - id: lambda-runnable
    title:
      en: Lambda Runnable
      ru: Runnable через lambda
    file: 05-lambda-runnable.java
    explanation:
      en: >
        Runnable is a functional interface, so a lambda or method reference is
        the usual modern way to pass work into a Thread or executor.
      ru: >
        Runnable является functional interface, поэтому lambda или method
        reference обычно используют, чтобы передать работу в Thread или executor.

assistantExample:
  en: 'e.g. In Java, what is the difference between Thread and Runnable?'
  ru: 'например: В Java чем отличается Thread от Runnable?'

