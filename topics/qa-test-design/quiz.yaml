bossFight:
  - id: what-is-test-design
    en: 'What is test design, and how does it differ from test analysis?'
    ru: 'Что такое тест-дизайн и чем он отличается от тест-анализа?'
  - id: equivalence-partitioning
    en: 'Explain the equivalence partitioning technique. Why is one check per class considered enough, and why do you need invalid classes too?'
    ru: 'Объясните технику классов эквивалентности. Почему достаточно одной проверки из класса и зачем нужны невалидные классы?'
  - id: boundary-value-analysis
    en: 'A field accepts integers from 1 to 100. Which values would you check using boundary value analysis, and why exactly those?'
    ru: 'Поле принимает целые числа от 1 до 100. Какие значения вы проверите по технике граничных значений и почему именно их?'
  - id: combined-ep-bva-set
    en: 'For the same 1-100 field, give a minimal combined test set using equivalence partitioning and boundary values together.'
    ru: 'Для того же поля 1-100 предложите минимальный объединённый набор проверок по классам эквивалентности и граничным значениям.'
  - id: other-test-design-techniques
    en: 'Name test design techniques other than equivalence classes and boundaries: how do function testing, risk-based testing, and use case testing differ?'
    ru: 'Назовите техники тест-дизайна помимо классов эквивалентности и границ: чем различаются тестирование функций, проверка рисков и проверки по Use Cases?'
  - id: exploratory-testing-role
    en: 'What is exploratory testing, and when would you choose it over scripted test cases?'
    ru: 'Что такое исследовательское тестирование и когда вы предпочтёте его заранее написанным тест-кейсам?'
  - id: traceability-matrix
    en: 'What is a traceability matrix and what problem does it solve? How does it differ from a table of parameter combinations?'
    ru: 'Что такое traceability matrix и какую задачу она решает? Чем она отличается от таблицы комбинаций параметров?'
