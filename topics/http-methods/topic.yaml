# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: anatomy
    title:
      en: A request and a response
      ru: Запрос и ответ
    file: 01-request-and-response.java
    explanation:
      en: >
        The shape of every exchange: a method plus a path going out, a status
        line plus headers and a body coming back. Three GETs — a collection, one
        item, and a URL that is not there — show that the protocol is the same
        each time and only the status differs.
      ru: >
        Форма любого обмена: метод и путь — туда, строка статуса, заголовки и
        тело — обратно. Три GET-запроса (коллекция, один элемент и
        несуществующий URL) показывают, что протокол каждый раз один и тот же и
        различается только статус.
  - id: safe-methods
    title:
      en: 'Safe methods: GET, HEAD, OPTIONS'
      ru: 'Безопасные методы: GET, HEAD, OPTIONS'
    file: 02-safe-methods.java
    explanation:
      en: >
        Safe means "not supposed to change anything", and that promise is what
        the whole caching layer of the web is built on: the second GET never
        reaches the server. HEAD returns the same headers without the body, and
        OPTIONS asks what a URL supports instead of touching it.
      ru: >
        Безопасный — значит «не должен ничего менять», и именно на этом обещании
        держится весь кэширующий слой веба: второй GET до сервера уже не
        доходит. HEAD возвращает те же заголовки без тела, а OPTIONS спрашивает,
        что поддерживает URL, вместо того чтобы его трогать.
  - id: post-creates
    title:
      en: 'POST creates (twice)'
      ru: 'POST создаёт (дважды)'
    file: 03-post-creates.java
    explanation:
      en: >
        POST hands a body to a collection and the server picks the URL of what it
        creates, returning it in Location. Send the identical body again after a
        lost response and you get a second, independent order — the double-charge
        bug behind every "do not press twice" banner.
      ru: >
        POST отдаёт тело коллекции, а URL созданного выбирает сервер и
        возвращает его в Location. Отправьте то же тело ещё раз после потерянного
        ответа — и получите второй, независимый заказ: тот самый баг двойного
        списания за каждым баннером «не нажимайте дважды».
  - id: put-idempotent
    title:
      en: PUT can be repeated
      ru: PUT можно повторять
    file: 04-put-is-idempotent.java
    explanation:
      en: >
        PUT names the URL itself and carries the whole target state, so saying it
        twice describes the same world twice — the repeat changes nothing. The
        same property lets PUT create a resource at a URL the client chose.
      ru: >
        PUT сам называет URL и несёт целиком желаемое состояние, поэтому сказать
        это дважды — дважды описать один и тот же мир: повтор ничего не меняет.
        Это же свойство позволяет PUT создать ресурс по выбранному клиентом URL.
  - id: patch-and-delete
    title:
      en: PATCH and DELETE
      ru: PATCH и DELETE
    file: 05-patch-and-delete.java
    explanation:
      en: >
        PATCH carries only the change, so unmentioned fields survive. DELETE
        removes the resource — and the second DELETE answers 404 instead of 204
        while leaving exactly the same state, which is the clearest illustration
        of what idempotency actually promises.
      ru: >
        PATCH несёт только изменение, поэтому неупомянутые поля выживают. DELETE
        удаляет ресурс — а второй DELETE отвечает 404 вместо 204, оставляя ровно
        то же состояние: нагляднее всего показывает, что именно обещает
        идемпотентность.
  - id: wrong-method
    title:
      en: '405 vs 404'
      ru: '405 против 404'
    file: 06-wrong-method.java
    explanation:
      en: >
        A collection URL and an item URL accept different methods. Aiming a
        method at the wrong one is 405 Method Not Allowed with an Allow header
        that lists what would have worked; a missing URL is 404. Different
        failures, different fixes.
      ru: >
        Коллекция и элемент принимают разные методы. Направить метод не туда —
        это 405 Method Not Allowed с заголовком Allow, перечисляющим то, что
        сработало бы; отсутствующий URL — это 404. Разные ошибки — разные
        исправления.
  - id: unsafe-get
    title:
      en: 'The GET that writes (trap)'
      ru: 'GET, который пишет (ловушка)'
    file: 07-unsafe-get.java
    explanation:
      en: >
        Cancelling was exposed as a link, so it became a GET. The method still
        promises safe, so a link prefetcher follows it — and cancels an order
        nobody clicked. This is why "safe" is a contract your handler has to
        keep, not a description of what your code happens to do.
      ru: >
        Отмену сделали ссылкой, поэтому она стала GET-запросом. Метод по-прежнему
        обещает безопасность, поэтому предзагрузчик ссылок по ней переходит — и
        отменяет заказ, по которому никто не кликал. Вот почему «безопасность» —
        это контракт, который обязан соблюдать ваш обработчик, а не описание
        того, что ваш код случайно делает.

