bossFight:
  # I. Design Foundations and Strategy
  - id: flat-design-risks
    en: 'Why does a flat network design struggle with scalability, and how does it specifically lead to excessive CPU consumption during broadcast events like ARP traffic?'
    ru: 'Почему плоский дизайн сети плохо масштабируется и как именно он приводит к чрезмерному потреблению CPU во время широковещательных событий вроде ARP-трафика?'
  - id: deterministic-frameworks
    en: 'How does the three-tier model transform a "chaotic" infrastructure into a deterministic and predictable system for campus LANs?'
    ru: 'Как трёхуровневая модель превращает «хаотичную» инфраструктуру в детерминированную и предсказуемую систему для кампусных LAN?'
  - id: building-block-modularity
    en: 'In what way does a "building block" design allow an organisation to expand its network — such as adding new floors or buildings — without necessitating a redesign of the core?'
    ru: 'Каким образом дизайн «строительными блоками» позволяет организации расширять сеть — например, добавлять новые этажи или здания — без необходимости переделывать ядро?'
  - id: north-south-vs-east-west
    en: 'How does the traditional hierarchy''s focus on North-South traffic (user-to-internet) differ from the East-West traffic (server-to-server) focus found in modern Leaf-Spine architectures?'
    ru: 'Чем фокус традиционной иерархии на трафике «север–юг» (пользователь–интернет) отличается от фокуса на трафике «запад–восток» (сервер–сервер) в современных архитектурах Leaf-Spine?'
  # II. The Access Layer: Edge Connectivity and Security
  - id: access-front-door
    en: 'Why is the access layer considered the initial entry point for end stations, and what types of devices typically connect at this tier?'
    ru: 'Почему уровень доступа считается первичной точкой входа конечных станций и какие типы устройств обычно подключаются на этом уровне?'
  - id: poe-edge-power
    en: 'How does Power over Ethernet (PoE) simplify the deployment of infrastructure endpoints like VoIP handsets and security cameras?'
    ru: 'Как Power over Ethernet (PoE) упрощает развёртывание инфраструктурных конечных устройств вроде VoIP-трубок и камер видеонаблюдения?'
  - id: edge-admission-control
    en: 'Why is it critical to implement 802.1X authentication and port security at the access layer rather than deeper in the network?'
    ru: 'Почему критически важно внедрять аутентификацию 802.1X и port security именно на уровне доступа, а не глубже в сети?'
  - id: dhcp-snooping-dai
    en: 'How do features like DHCP Snooping and Dynamic ARP Inspection (DAI) build protection against ARP poisoning and spoofing?'
    ru: 'Как функции вроде DHCP Snooping и Dynamic ARP Inspection (DAI) выстраивают защиту от отравления ARP и спуфинга?'
  # III. The Distribution Layer: Policy and Aggregation
  - id: distribution-policy-engine
    en: 'Why is the distribution layer designated as the operational boundary for implementing routing, filtering, and high-level policy enforcement?'
    ru: 'Почему уровень distribution назначен операционной границей для реализации маршрутизации, фильтрации и применения высокоуровневых политик?'
  - id: terminating-broadcast-domains
    en: 'How does the distribution layer facilitate inter-VLAN routing while simultaneously acting as the default gateway to isolate broadcast traffic?'
    ru: 'Как уровень distribution обеспечивает маршрутизацию между VLAN, одновременно выступая шлюзом по умолчанию для изоляции широковещательного трафика?'
  - id: route-summarisation-benefit
    en: 'What is the strategic benefit of configuring route summarisation at the distribution layer before traffic moves toward the core?'
    ru: 'В чём стратегическая выгода настройки суммаризации маршрутов на уровне distribution до того, как трафик направится к ядру?'
  - id: hsrp-vrrp-availability
    en: 'How do protocols like HSRP and VRRP ensure high availability for end-user gateways within the distribution block?'
    ru: 'Как протоколы вроде HSRP и VRRP обеспечивают высокую доступность шлюзов конечных пользователей внутри блока distribution?'
  # IV. The Core Layer: The High-Speed Backbone
  - id: core-policy-exclusion
    en: 'Why are CPU-intensive tasks like Deep Packet Inspection and complex ACLs strictly banned from the core layer?'
    ru: 'Почему CPU-интенсивные задачи вроде Deep Packet Inspection и сложных ACL строго запрещены на уровне core?'
  - id: core-vs-access-hardware
    en: 'If the core''s sole focus is high-speed transport, how does its hardware (e.g., modular chassis switches) differ from hardware found at the access layer?'
    ru: 'Если единственный фокус ядра — высокоскоростной транспорт, чем его оборудование (например, модульные шасси-коммутаторы) отличается от оборудования уровня доступа?'
  - id: sub-second-convergence
    en: 'Why does the core layer rely on advanced routing protocols like OSPF or IS-IS with fast timers rather than traditional spanning tree for path recovery?'
    ru: 'Почему уровень core полагается на продвинутые протоколы маршрутизации вроде OSPF или IS-IS с быстрыми таймерами, а не на традиционный spanning tree для восстановления путей?'
  # V. High Availability and Advanced Resiliency
  - id: sso-nsf-failover
    en: 'How do Stateful Switchover (SSO) and Non-Stop Forwarding (NSF) work together to maintain packet forwarding during a supervisor engine malfunction?'
    ru: 'Как Stateful Switchover (SSO) и Non-Stop Forwarding (NSF) работают вместе, чтобы сохранить пересылку пакетов при сбое supervisor engine?'
  - id: etherchannel-stp-simplification
    en: 'Beyond increasing bandwidth, how does EtherChannel (using LACP or PAgP) simplify the Spanning Tree topology?'
    ru: 'Помимо увеличения полосы, как EtherChannel (с использованием LACP или PAgP) упрощает топологию Spanning Tree?'
  - id: stackwise-logical-unit
    en: 'What are the advantages of using Stacking technologies (like Cisco StackWise) to manage multiple physical switches as a single logical unit?'
    ru: 'Каковы преимущества технологий стекирования (например, Cisco StackWise) для управления несколькими физическими коммутаторами как единым логическим узлом?'
  - id: issu-zero-downtime
    en: 'How does In-Service Software Upgrade (ISSU) allow a network to maintain 100% uptime even during planned maintenance or full OS upgrades?'
    ru: 'Как In-Service Software Upgrade (ISSU) позволяет сети сохранять 100% аптайм даже во время плановых работ или полного обновления ОС?'
  - id: ip-event-dampening
    en: 'Why is IP Event Dampening necessary to protect the stability of the routing table from "flapping" interfaces or poor signalling?'
    ru: 'Почему IP Event Dampening необходим для защиты стабильности таблицы маршрутизации от «флапающих» интерфейсов и плохой сигнализации?'
