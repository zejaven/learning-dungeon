missions:
  - id: open-transaction
    title:
      en: Open a transaction through the proxy
      ru: Открой транзакцию через proxy
    goal:
      en: Call a @Transactional method through the proxy (an external call) so the interceptor opens a transaction.
      ru: Вызови @Transactional-метод через proxy (внешний вызов), чтобы interceptor открыл транзакцию.
    event: SI_TX_BEGIN
  - id: reproduce-self-invoke
    title:
      en: Reproduce the self-invocation
      ru: Воспроизведи self-invocation
    goal:
      en: From inside one method, call another method of the same bean with this.method() and see it skip the proxy.
      ru: Из одного метода вызови другой метод того же bean через this.method() и увидь, как он обходит proxy.
    event: SI_SELF_INVOKE
  - id: see-transaction-lost
    title:
      en: See the transaction get lost
      ru: Увидь, как теряется транзакция
    goal:
      en: Self-invoke a @Transactional method and observe that its annotation is ignored (no new transaction boundary).
      ru: Вызови @Transactional-метод через self и увидь, что его аннотация игнорируется (новой границы транзакции нет).
    event: SI_TX_BYPASSED
  - id: apply-proxy-fix
    title:
      en: Apply the self/proxy fix
      ru: Примени фикс через self/proxy
    goal:
      en: Call the inner method through an injected self/proxy reference so it re-enters the proxy.
      ru: Вызови внутренний метод через инжектированную ссылку на self/proxy, чтобы он снова вошёл в proxy.
    event: SI_PROXY_REENTER
  - id: join-existing-tx
    title:
      en: Join an existing transaction
      ru: Присоединись к существующей транзакции
    goal:
      en: With the fix in place, make an inner propagation=REQUIRED method join the caller's transaction.
      ru: С фиксом сделай так, чтобы внутренний метод с propagation=REQUIRED присоединился к транзакции вызывающего.
    event: SI_TX_JOIN

bossFight:
  - id: what-is-self-invocation
    en: 'What is the self-invocation problem, and why does a this.method() call to a @Transactional method of the same bean usually not start a transaction?'
    ru: 'В чём состоит проблема self-invocation и почему вызов this.method() к @Transactional-методу того же bean обычно не запускает транзакцию?'
  - id: where-interceptor-lives
    en: 'Where does the transaction interceptor actually live — on the target object or on the proxy — and how does that explain the bug?'
    ru: 'Где на самом деле находится transaction interceptor — на target-объекте или на proxy — и как это объясняет баг?'
  - id: requires-new-self-call
    en: 'A @Transactional method self-invokes another method annotated @Transactional(REQUIRES_NEW). Does a new, independent transaction start? Why or why not?'
    ru: 'Метод с @Transactional вызывает через self другой метод с @Transactional(REQUIRES_NEW). Запустится ли новая независимая транзакция? Почему да или нет?'
  - id: list-the-fixes
    en: 'List the ways to fix self-invocation (self-injection, AopContext.currentProxy(), extracting to another bean, AspectJ weaving) and the trade-offs of each.'
    ru: 'Перечисли способы починить self-invocation (self-injection, AopContext.currentProxy(), вынос в другой bean, AspectJ weaving) и компромиссы каждого.'
  - id: why-extract-bean-best
    en: 'Why is moving the method to a separate bean often considered the cleanest fix compared to self-injection?'
    ru: 'Почему перенос метода в отдельный bean часто считают самым чистым фиксом по сравнению с self-injection?'
  - id: other-affected-annotations
    en: 'Besides @Transactional, which other proxy-based annotations (e.g. @Async, @Cacheable, security) suffer from the same self-invocation limitation?'
    ru: 'Кроме @Transactional, какие ещё proxy-аннотации (например @Async, @Cacheable, security) страдают от того же ограничения self-invocation?'
  - id: private-final-methods
    en: 'Why does @Transactional also fail to apply to private or final methods in a proxy-based setup?'
    ru: 'Почему @Transactional также не применяется к private- или final-методам в proxy-based-подходе?'
  - id: how-to-detect
    en: 'How would you detect in a running application that a @Transactional method silently ran without a transaction?'
    ru: 'Как в работающем приложении обнаружить, что @Transactional-метод незаметно выполнился без транзакции?'
