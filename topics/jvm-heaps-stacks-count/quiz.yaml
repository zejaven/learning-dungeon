missions:
  - id: count-the-baseline
    title:
      en: Count the baseline
      ru: Посчитай базовый случай
    goal:
      en: Boot a JVM instance and see it start with exactly one heap and one stack.
      ru: Запусти инстанс JVM и увидь, что он стартует ровно с одной кучей и одним стеком.
    event: RUNTIME_SCENE
  - id: one-stack-per-thread
    title:
      en: One stack per thread
      ru: Один стек на поток
    goal:
      en: Start a thread and watch a brand-new stack appear just for it.
      ru: Запусти поток и увидь, как для него появляется новый стек.
    event: THREAD_STARTED
  - id: allocate-in-the-one-heap
    title:
      en: Allocate in the one heap
      ru: Размести в единственной куче
    goal:
      en: Run new on some thread and see the object land in the single shared heap.
      ru: Выполни new в каком-то потоке и увидь, что объект попадает в единственную общую кучу.
    event: HEAP_ALLOCATE
  - id: finish-a-thread
    title:
      en: Finish a thread
      ru: Заверши поток
    goal:
      en: Let a thread finish and watch its whole stack disappear while the heap stays.
      ru: Дай потоку завершиться и увидь, как исчезает весь его стек, а куча остаётся.
    event: THREAD_EXITED
  - id: push-a-frame
    title:
      en: Push a frame
      ru: Положи кадр
    goal:
      en: Call a method on a thread and push a frame onto that thread's own stack.
      ru: Вызови метод в потоке и положи кадр на стек именно этого потока.
    event: STACK_PUSH

bossFight:
  - id: how-many-heaps-and-stacks
    en: How many heaps and how many stacks are there in one JVM instance?
    ru: Сколько куч и сколько стеков в одном инстансе JVM?
  - id: why-one-heap-many-stacks
    en: Why is there only one heap but one stack per thread?
    ru: Почему куча одна, а стеков — по одному на поток?
  - id: where-does-new-allocate
    en: When two different threads each run new, where do the objects go?
    ru: Когда два разных потока выполняют new, куда попадают объекты?
  - id: what-happens-to-stack-on-exit
    en: What happens to a thread's stack and to its objects when the thread finishes?
    ru: Что происходит со стеком потока и с его объектами, когда поток завершается?
  - id: is-stack-or-heap-thread-safe
    en: Which area needs synchronization for shared access, the stack or the heap, and why?
    ru: Какой области нужна синхронизация при общем доступе — стеку или куче — и почему?
  - id: other-runtime-areas
    en: Besides the heap and the per-thread stacks, what other runtime data areas does the JVM have?
    ru: Кроме кучи и стеков потоков, какие ещё области данных времени выполнения есть у JVM?
