id: sales-api-unreliable-connection
languages: [en, ru]
title:
  en: Registering Sales over an Unreliable Connection
  ru: Регистрация продаж при ненадёжном соединении
category:
  en: Microservices / API Design
  ru: Микросервисы / Проектирование API
type: OTHER
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: microservices
difficulty: 3
catalogId: microservices-12
summary:
  en: >
    When the link between a till (or a courier's phone) and the backend can drop
    mid-request, the client can never tell "the request never arrived" from "the
    sale was registered and the response was lost". The design that survives
    this is offline-first plus idempotent writes: the client mints an
    idempotency key and writes the sale into a durable local queue BEFORE the
    first send, retries the same key with capped exponential backoff and jitter,
    and the server keeps an idempotency store so the first request with a key
    applies the sale and every later one replays the stored response. The result
    is at-least-once delivery with effectively-once registration — no lost
    sales, no double charges.
  ru: >
    Когда связь между кассой (или телефоном курьера) и бэкендом может оборваться
    посреди запроса, клиент никогда не отличит «запрос не дошёл» от «продажа
    зарегистрирована, а ответ потерян». Выживает такой дизайн: offline-first плюс
    идемпотентная запись. Клиент генерирует ключ идемпотентности и записывает
    продажу в надёжную локальную очередь ДО первой отправки, повторяет попытки с
    тем же ключом по экспоненциальному backoff с ограничением и джиттером, а
    сервер держит хранилище идемпотентности: первый запрос с ключом применяет
    продажу, а все последующие возвращают сохранённый ответ. Получается доставка
    at-least-once с регистрацией effectively-once — ни потерянных продаж, ни
    двойных списаний.

