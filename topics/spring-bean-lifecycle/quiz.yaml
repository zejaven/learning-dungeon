# Theory topic: no missions because there is no practice editor.
bossFight:
  - id: lifecycle-main-steps
    en: 'Walk through the main lifecycle steps of a Spring bean from definition to ready object.'
    ru: 'Пройдите по основным шагам жизненного цикла Spring-бина от definition до готового объекта.'
  - id: singleton-context-lifetime
    en: 'Does a singleton Spring bean always live as long as the whole JVM or only as long as its ApplicationContext?'
    ru: 'Singleton-бин Spring всегда живёт столько же, сколько весь JVM, или только столько же, сколько его ApplicationContext?'
  - id: shorter-than-context
    en: 'Which bean scopes can be destroyed before the ApplicationContext closes, and when does that happen?'
    ru: 'Какие scopes бинов могут быть уничтожены до закрытия ApplicationContext и когда это происходит?'
  - id: prototype-destruction
    en: 'What part of the prototype bean lifecycle does Spring manage, and who owns cleanup afterward?'
    ru: 'Какой частью жизненного цикла prototype-бина управляет Spring и кто отвечает за cleanup после этого?'
  - id: init-vs-proxy
    en: 'How do BeanPostProcessor hooks and proxies fit into bean initialization?'
    ru: 'Как хуки BeanPostProcessor и proxies вписываются в инициализацию бина?'
  - id: destroy-callbacks
    en: 'When are @PreDestroy, DisposableBean.destroy(), or custom destroy methods called?'
    ru: 'Когда вызываются @PreDestroy, DisposableBean.destroy() или custom destroy methods?'
  - id: lazy-singletons
    en: 'How does lazy initialization change the lifetime story for singleton beans?'
    ru: 'Как lazy initialization меняет историю жизненного цикла singleton-бинов?'
  - id: smartlifecycle-difference
    en: 'What is the difference between SmartLifecycle start/stop and bean destruction?'
    ru: 'В чём разница между start/stop у SmartLifecycle и destruction бина?'
