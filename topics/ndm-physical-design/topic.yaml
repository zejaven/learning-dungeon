summary:
  en: >
    Translating logical architectures into tangible infrastructure: structured
    cabling subsystems and TIA/EIA standards, media selection (copper
    categories vs single-/multi-mode fibre), pathways and EMI mitigation, fire
    safety ratings, MDF/IDF spatial planning, rack ergonomics, power and UPS
    design, hot/cold aisle cooling, testing/certification, and Layer 1-2
    documentation.
  ru: >
    Перевод логических архитектур в осязаемую инфраструктуру: подсистемы
    структурированной кабельной системы и стандарты TIA/EIA, выбор среды
    передачи (категории меди против single-/multi-mode оптики), кабельные
    трассы и снижение EMI, пожарные классы кабелей, планирование MDF/IDF,
    эргономика стоек, электропитание и UPS, охлаждение hot/cold aisle,
    тестирование и сертификация, документация Layer 1-2.

assistantExample:
  en: "e.g. Why is the copper permanent link limited to 90 metres and the channel to 100?"
  ru: "например: Почему permanent link для меди ограничен 90 метрами, а канал — 100?"

