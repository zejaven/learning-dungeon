bossFight:
  # I. Fundamental Concepts and Frameworks
  - id: accounting-as-science
    en: 'Defining the Science: Why is accounting described as a "comprehensive science" of measurement rather than just a simple billing tool?'
    ru: 'Определение науки: почему учёт (accounting) называют «комплексной наукой» измерения, а не просто инструментом биллинга?'
  - id: fcaps-third-pillar
    en: 'FCAPS Integration: How does Accounting function as the third pillar of the ISO structural model, and what essential tasks does it define for modern network environments?'
    ru: 'Интеграция с FCAPS: как Accounting выступает третьим столпом структурной модели ISO и какие ключевые задачи он определяет для современных сетевых сред?'
  - id: aaa-verified-identity
    en: 'The AAA Relationship: Why is accounting data only considered meaningful when securely linked to a verified identity within the AAA framework?'
    ru: 'Связь с AAA: почему учётные данные считаются значимыми только тогда, когда они надёжно привязаны к проверенной личности в каркасе AAA?'
  - id: electronic-ledger
    en: 'The "Electronic Ledger": Explain the concept of accounting as a continuous camera and ledger. How does this provide an audit trail for security history?'
    ru: '«Электронный гроссбух»: объясните концепцию учёта как непрерывной камеры и журнала. Как это обеспечивает след аудита для истории безопасности?'
  # II. Metrics, Layers, and Granularity
  - id: temporal-vs-resource-metrics
    en: 'Key Metrics: Discuss the differences between Temporal metrics (session duration) and Resource metrics (CPU or storage occupancy). Which is more critical for capacity planning?'
    ru: 'Ключевые метрики: обсудите различия между временными метриками (длительность сессии) и ресурсными метриками (занятость CPU или хранилища). Какие важнее для планирования ёмкости?'
  - id: datalink-vs-network-layer
    en: 'Layered Analysis Trade-offs: Compare accounting at the Data Link Layer versus the Network Layer. Why might protocols like SSH appear more "expensive" at the network layer?'
    ru: 'Компромиссы уровневого анализа: сравните учёт на канальном уровне (Data Link) и на сетевом уровне (Network). Почему протоколы вроде SSH могут выглядеть «дороже» на сетевом уровне?'
  - id: application-layer-fairness
    en: 'Application Layer Fairness: Why is accounting at the Application Layer often considered the "fairest" for users in a proxy environment?'
    ru: 'Справедливость прикладного уровня: почему учёт на прикладном уровне (Application Layer) часто считается «самым справедливым» для пользователей в среде с прокси?'
  - id: granularity-chargebacks
    en: 'Granularity Choices: How does the choice of accounting by Subnet, Host, or Switch Port affect the accuracy of departmental chargebacks?'
    ru: 'Выбор гранулярности: как выбор учёта по Subnet, Host или Switch Port влияет на точность chargebacks по отделам?'
  # III. Protocols and Flow-Based Accounting
  - id: radius-vs-tacacs
    en: 'RADIUS vs. TACACS+: Contrast the use of RADIUS for distributed access (like Wi-Fi) with TACACS+ for core device administration.'
    ru: 'RADIUS против TACACS+: сопоставьте использование RADIUS для распределённого доступа (например, Wi-Fi) с TACACS+ для администрирования устройств ядра.'
  - id: tacacs-command-auditing
    en: 'Command-Level Auditing: Why is the ability of TACACS+ to log every single command typed into a CLI vital for identifying accountability in configuration errors?'
    ru: 'Аудит уровня команд: почему способность TACACS+ логировать каждую команду, введённую в CLI, жизненно важна для установления ответственности за ошибки конфигурации?'
  - id: radius-avps-interim
    en: 'RADIUS Mechanisms: How do Attribute-Value Pairs (AVPs) and status types like "Interim-Update" facilitate session-level metadata tracking?'
    ru: 'Механизмы RADIUS: как пары «атрибут-значение» (AVP) и типы статусов вроде «Interim-Update» обеспечивают отслеживание метаданных уровня сессий?'
  - id: netflow-seven-key-tuple
    en: 'The NetFlow Tuple: Explain how the 7-key tuple (including Source/Dest IP and Ports) allows NetFlow to identify specific unidirectional traffic flows.'
    ru: 'Кортеж NetFlow: объясните, как 7-ключевой кортеж (включая IP и порты источника/назначения) позволяет NetFlow идентифицировать конкретные однонаправленные потоки трафика.'
  - id: exporter-collector-analyser
    en: 'Flow Architecture: Describe the interaction between the Exporter, Collector, and Analyser in a flow-based accounting system.'
    ru: 'Архитектура потоков: опишите взаимодействие Exporter, Collector и Analyser в системе учёта на основе потоков.'
  # IV. Business and Operational Applications
  - id: internal-chargebacks
    en: 'Internal Chargebacks: How can shared IT services use accounting data to prevent one department from monopolising corporate resources?'
    ru: 'Внутренние chargebacks: как общие IT-службы могут использовать учётные данные, чтобы не дать одному отделу монополизировать корпоративные ресурсы?'
  - id: fup-sla-enforcement
    en: 'SLA Enforcement: In what ways do Fair Use Policies (FUP) use accounting data to automate speed throttling or user redirection?'
    ru: 'Обеспечение SLA: какими способами Fair Use Policies (FUP) используют учётные данные для автоматического ограничения скорости или перенаправления пользователей?'
  - id: forensic-breach-vector
    en: 'Forensic Auditing: Discuss the role of accounting logs in pinpointing the vector of unauthorised data breaches.'
    ru: 'Форензик-аудит: обсудите роль учётных журналов в точном определении вектора несанкционированных утечек данных.'
  - id: regulatory-compliance
    en: 'Regulatory Compliance: Why is rigorous accounting mandated by global regulations such as HIPAA, PCI-DSS, and SOX?'
    ru: 'Регуляторный комплаенс: почему строгий учёт требуется глобальными регуляциями, такими как HIPAA, PCI-DSS и SOX?'
  # V. Challenges and Advanced Management
  - id: caching-multicast-fairness
    en: 'The Fairness Debate: What are the logical challenges in determining whether users should be charged for cache hits or multicast streams?'
    ru: 'Спор о справедливости: каковы логические трудности при решении, должны ли пользователи платить за попадания в кэш или multicast-потоки?'
  - id: nml-correlation
    en: 'Hierarchical Correlations: How does the Network Management Layer (NML) correlate raw data from individual elements to identify broader events like router failures?'
    ru: 'Иерархические корреляции: как Network Management Layer (NML) коррелирует сырые данные от отдельных элементов для выявления более широких событий, например отказов маршрутизаторов?'
  - id: remote-survivability
    en: 'Remote Survivability: Why must accounting functions remain operational via remote access (KVM over IP, SSH, VPN) during emergency scenarios like a NOC evacuation?'
    ru: 'Удалённая живучесть: почему функции учёта должны продолжать работать через удалённый доступ (KVM over IP, SSH, VPN) в аварийных сценариях вроде эвакуации NOC?'
