# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: first-match
    title:
      en: Make the two keys meet
      ru: Сведи два ключа вместе
    goal:
      en: Publish a message whose routing key satisfies some binding key of the exchange.
      ru: Опубликуй сообщение, routing key которого удовлетворяет какому-нибудь binding key этого exchange.
    event: BINDING_MATCHED
  - id: unroutable
    title:
      en: Publish into the void
      ru: Опубликуй в никуда
    goal:
      en: Publish a routing key that no binding key matches and watch the message be dropped silently.
      ru: Опубликуй routing key, под который не подходит ни один binding key, и посмотри, как сообщение молча выбросят.
    event: MESSAGE_UNROUTABLE
  - id: literal-wildcard
    title:
      en: Try a wildcard on the wrong side
      ru: Поставь шаблон не на ту сторону
    goal:
      en: 'Publish a routing key containing ''*'' or ''#'' and see it treated as ordinary characters.'
      ru: 'Опубликуй routing key с символом ''*'' или ''#'' и посмотри, как его обработают как обычные символы.'
    event: WILDCARD_IN_ROUTING_KEY
  - id: keys-ignored
    title:
      en: Make both keys irrelevant
      ru: Сделай оба ключа неважными
    goal:
      en: Publish through a fanout exchange, which reads neither the routing key nor any binding key.
      ru: Опубликуй через fanout exchange, который не читает ни routing key, ни binding key.
    event: KEYS_IGNORED
  - id: one-copy-per-queue
    title:
      en: Overlap two bindings
      ru: Пересеки две привязки
    goal:
      en: Give one queue two binding keys that both match a single message, and confirm it still gets one copy.
      ru: Дай одной очереди два binding key, совпадающих с одним сообщением, и убедись, что копия всё равно одна.
    event: BINDING_DUPLICATE

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: core-difference
    en: What is the difference between a binding key and a routing key in RabbitMQ?
    ru: В чём разница между binding key и routing key в RabbitMQ?
  - id: who-sets-what
    en: Who sets each of the two keys, and at what moment in the system's life?
    ru: Кто задаёт каждый из двух ключей и в какой момент жизни системы?
  - id: exchange-type-rule
    en: How does the exchange type change the way the two keys are compared?
    ru: Как тип exchange меняет способ сравнения этих двух ключей?
  - id: wildcards-side
    en: Which key may contain wildcards, and what happens if you put one in the other?
    ru: В каком из ключей допустимы шаблоны и что произойдёт, если поставить шаблон в другой?
  - id: many-to-many
    en: Can several queues share one binding key, and can one queue have several? What does that mean for the number of copies?
    ru: Могут ли несколько очередей делить один binding key и может ли у одной очереди быть несколько? Что это значит для числа копий?
  - id: unroutable-message
    en: What happens to a message whose routing key matches no binding, and how would you notice?
    ru: Что происходит с сообщением, чей routing key не совпал ни с одной привязкой, и как ты об этом узнаешь?
  - id: default-exchange
    en: What really happens when a tutorial publishes with an empty exchange name and the queue name as the routing key?
    ru: Что на самом деле происходит, когда в туториале публикуют с пустым именем exchange и именем очереди в routing key?
  - id: designing-routing-keys
    en: How would you design routing keys for an order service so future consumers can subscribe to what they need?
    ru: Как бы ты спроектировал routing key для сервиса заказов, чтобы будущие потребители могли подписаться на нужное им?
  - id: message-not-arriving
    en: A consumer stopped receiving messages after a deploy, though the producer reports success. How do you debug the routing?
    ru: Потребитель перестал получать сообщения после деплоя, хотя продюсер рапортует об успехе. Как ты будешь отлаживать маршрутизацию?
  - id: rebinding-effect
    en: If you change a binding key while messages are already sitting in the queue, what happens to them?
    ru: Если поменять binding key, когда сообщения уже лежат в очереди, что с ними произойдёт?
  - id: fanout-vs-topic
    en: 'When would you pick a fanout exchange over a topic one with a ''#'' binding?'
    ru: 'Когда ты выберешь fanout exchange вместо topic с привязкой по ''#''?'
