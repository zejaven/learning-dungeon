missions:
  - id: run-before-advice
    title:
      en: 'Run @Before'
      ru: 'Выполни @Before'
    goal:
      en: 'Run code where @Before advice executes before the target method starts.'
      ru: 'Запусти код, где @Before advice выполняется до старта target method.'
    event: AOP_ADVICE_BEFORE
  - id: run-after-advice
    title:
      en: 'Run @After'
      ru: 'Выполни @After'
    goal:
      en: 'Run code where @After advice executes after the target method finishes, even on exception.'
      ru: 'Запусти код, где @After advice выполняется после завершения target method, даже при exception.'
    event: AOP_ADVICE_AFTER
  - id: run-after-returning
    title:
      en: 'Run @AfterReturning'
      ru: 'Выполни @AfterReturning'
    goal:
      en: 'Run code where @AfterReturning advice executes only after a successful return.'
      ru: 'Запусти код, где @AfterReturning advice выполняется только после успешного return.'
    event: AOP_ADVICE_AFTER_RETURNING
  - id: run-after-throwing
    title:
      en: 'Run @AfterThrowing'
      ru: 'Выполни @AfterThrowing'
    goal:
      en: 'Run code where @AfterThrowing advice reacts to an exception from the target method.'
      ru: 'Запусти код, где @AfterThrowing advice реагирует на exception из target method.'
    event: AOP_ADVICE_AFTER_THROWING
  - id: run-around-advice
    title:
      en: 'Wrap with @Around'
      ru: 'Оберни через @Around'
    goal:
      en: 'Run code where @Around advice resumes after proceed(), proving it wraps the whole call.'
      ru: 'Запусти код, где @Around advice продолжает работу после proceed(), показывая, что он оборачивает весь вызов.'
    event: AOP_ADVICE_AROUND_FINISH

bossFight:
  - id: list-five-advice-types
    en: 'Name the five common Spring AOP advice annotations and give one sentence for when each runs.'
    ru: 'Назови пять распространенных аннотаций advice в Spring AOP и в одном предложении скажи, когда каждая выполняется.'
  - id: before-use-case
    en: 'When is @Before a good fit, and what should you avoid doing inside it?'
    ru: 'Когда @Before хорошо подходит и чего не стоит делать внутри него?'
  - id: after-vs-after-returning
    en: 'What is the practical difference between @After and @AfterReturning?'
    ru: 'В чем практическая разница между @After и @AfterReturning?'
  - id: after-throwing-limits
    en: 'What can @AfterThrowing observe, and why is it not the same as catching and continuing normally?'
    ru: 'Что может увидеть @AfterThrowing и почему это не то же самое, что поймать exception и продолжить обычное выполнение?'
  - id: around-power
    en: 'Why is @Around the most powerful advice type, and what mistake can break the target call?'
    ru: 'Почему @Around самый мощный тип advice и какая ошибка может сломать вызов target?'
  - id: choose-advice-type
    en: 'Choose the right advice type for logging success, logging failure, timing a method, and cleaning resources.'
    ru: 'Выбери правильный тип advice для logging успешного результата, logging ошибки, измерения времени метода и очистки ресурсов.'
