bossFight:
  - id: test-pyramid-definition
    en: 'What is the test pyramid? What levels does it have and what determines the ratio between them?'
    ru: 'Что такое пирамида тестирования? Какие у неё уровни и чем определяется соотношение между ними?'
  - id: pyramid-economics
    en: 'Why are E2E/UI tests placed at the top of the pyramid? Explain in terms of cost, speed, and stability of feedback.'
    ru: 'Почему E2E/UI-тесты находятся на вершине пирамиды? Объясните через стоимость, скорость и стабильность обратной связи.'
  - id: pyramid-on-your-project
    en: 'How was the test pyramid applied on your project? What was the actual ratio of unit, API, and UI tests, and why?'
    ru: 'Как пирамида тестирования применялась на вашем проекте? Какое было реальное соотношение unit-, API- и UI-тестов и почему именно такое?'
  - id: inverted-pyramid-antipattern
    en: 'What is the "ice cream cone" (inverted pyramid) anti-pattern, why is it dangerous, and how would you fix it on a project?'
    ru: 'Что такое анти-паттерн «рожок мороженого» (перевёрнутая пирамида), чем он опасен и как бы вы его исправляли на проекте?'
  - id: shift-left-examples
    en: 'What is shift-left testing? Give concrete examples from your project — requirements review, mockup testing, grooming.'
    ru: 'Что такое shift-left тестирование? Приведите конкретные примеры с вашего проекта — ревью требований, тестирование макетов, груминг.'
  - id: shift-right-examples
    en: 'What is shift-right testing? Give examples from practice: monitoring, incident analysis, canary releases, feature flags.'
    ru: 'Что такое shift-right тестирование? Приведите примеры из практики: мониторинг, разбор инцидентов, canary releases, feature flags.'
  - id: process-improvement-business-impact
    en: 'Tell about a process improvement on your project that significantly affected business metrics. How did you measure the effect?'
    ru: 'Расскажите об улучшении процесса на вашем проекте, которое глобально повлияло на бизнес-показатели. Чем измеряли эффект?'
