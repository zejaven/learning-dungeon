# Theory topic: no missions (there is no practice editor) - only a Boss Fight.
bossFight:
  - id: what-is-spring-aop-proxy
    en: What is a proxy in Spring AOP?
    ru: Что такое proxy в Spring AOP?
  - id: why-wrapper-bean
    en: Why does Spring create a wrapper bean around the target bean?
    ru: Зачем Spring создает бин-обертку вокруг target bean?
  - id: call-flow
    en: What happens when a client calls an advised method through a Spring AOP proxy?
    ru: Что происходит, когда клиент вызывает advised method через Spring AOP proxy?
  - id: jdk-vs-cglib
    en: What is the difference between JDK dynamic proxies and CGLIB-style subclass proxies?
    ru: В чем разница между JDK dynamic proxies и CGLIB-style subclass proxies?
  - id: self-invocation-trap
    en: Why does self-invocation bypass proxy-based Spring AOP?
    ru: Почему self-invocation обходит proxy-based Spring AOP?
  - id: proxy-limitations
    en: Which method calls are not intercepted by typical Spring proxy-based AOP?
    ru: Какие вызовы методов обычно не перехватываются Spring proxy-based AOP?
