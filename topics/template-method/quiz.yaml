missions:
  - id: online-workflow-subclass
    type: structure
    title:
      en: Add the online workflow
      ru: Добавь online workflow
    goal:
      en: Create OnlineOrderWorkflow and make it extend OrderWorkflow.
      ru: Создай OnlineOrderWorkflow и сделай так, чтобы он наследовал OrderWorkflow.
    requires:
      - { kind: nodeExists, nodeKind: class, name: OnlineOrderWorkflow }
      - { kind: edge, relation: extends, from: OnlineOrderWorkflow, to: OrderWorkflow }
  - id: pickup-workflow-subclass
    type: structure
    title:
      en: Add the pickup workflow
      ru: Добавь pickup workflow
    goal:
      en: Create StorePickupWorkflow and make it extend OrderWorkflow.
      ru: Создай StorePickupWorkflow и сделай так, чтобы он наследовал OrderWorkflow.
    requires:
      - { kind: nodeExists, nodeKind: class, name: StorePickupWorkflow }
      - { kind: edge, relation: extends, from: StorePickupWorkflow, to: OrderWorkflow }
  - id: client-holds-template-base
    type: structure
    title:
      en: Client holds the abstract workflow
      ru: Client хранит абстрактный workflow
    goal:
      en: Give FulfillmentDesk a field of type OrderWorkflow and delegate handling to it.
      ru: Дай FulfillmentDesk поле типа OrderWorkflow и делегируй ему обработку.
    requires:
      - { kind: edge, relation: association, from: FulfillmentDesk, to: OrderWorkflow }
  - id: template-method-assembled
    type: structure
    title:
      en: Template Method structure assembled
      ru: Структура Template Method собрана
    goal:
      en: The graph shows two concrete workflows extending OrderWorkflow and a client depending on OrderWorkflow.
      ru: Граф показывает два конкретных workflow, наследующих OrderWorkflow, и client, зависящий от OrderWorkflow.
    requires:
      - { kind: edge, relation: extends, from: OnlineOrderWorkflow, to: OrderWorkflow }
      - { kind: edge, relation: extends, from: StorePickupWorkflow, to: OrderWorkflow }
      - { kind: edge, relation: association, from: FulfillmentDesk, to: OrderWorkflow }

bossFight:
  - id: define-template-method
    en: 'What is the Template Method pattern, and which part of the algorithm does the base class control?'
    ru: 'Что такое паттерн Template Method и какую часть алгоритма контролирует базовый класс?'
  - id: final-template-method
    en: 'Why is the template method often marked final in Java?'
    ru: 'Почему template method в Java часто помечают final?'
  - id: primitive-operations-vs-hooks
    en: 'What is the difference between required primitive operations and optional hooks?'
    ru: 'В чём разница между обязательными primitive operations и необязательными hooks?'
  - id: template-method-vs-strategy
    en: 'How is Template Method different from Strategy?'
    ru: 'Чем Template Method отличается от Strategy?'
  - id: inheritance-risk
    en: 'What risks appear when Template Method is overused?'
    ru: 'Какие риски появляются, если злоупотреблять Template Method?'
