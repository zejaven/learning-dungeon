# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: store-object
    title:
      en: Put an object on the heap
      ru: Размести объект в куче
    goal:
      en: Run an example that does `new ...` and watch the object appear on the heap while the variable holds only a reference.
      ru: Запусти пример с `new ...` и увидь, как объект появляется в куче, а переменная хранит лишь ссылку.
    event: MEM_NEW
  - id: copy-value
    title:
      en: Copy a primitive value
      ru: Скопируй значение примитива
    goal:
      en: Copy one primitive into another slot and see that the two values are independent.
      ru: Скопируй один примитив в другой слот и убедись, что значения независимы.
    event: MEM_COPY_PRIMITIVE
  - id: alias
    title:
      en: Make two names for one object
      ru: Сделай два имени для одного объекта
    goal:
      en: Assign one object variable to another and watch both references point at the SAME heap object.
      ru: Присвой одну объектную переменную другой и увидь, что обе ссылки указывают на ОДИН объект в куче.
    event: MEM_COPY_REFERENCE
  - id: shared-mutation
    title:
      en: Mutate a shared object
      ru: Измени общий объект
    goal:
      en: Change a field through one reference and confirm every alias sees the new value.
      ru: Поменяй поле через одну ссылку и убедись, что новое значение видят все алиасы.
    event: MEM_MUTATE
  - id: pass-to-method
    title:
      en: Pass an object to a method
      ru: Передай объект в метод
    goal:
      en: Call a method with an object argument and see the parameter receive a copy of the reference.
      ru: Вызови метод с объектным аргументом и увидь, как параметр получает копию ссылки.
    event: MEM_CALL
  - id: drop-reference
    title:
      en: Drop a reference to null
      ru: Сбрось ссылку в null
    goal:
      en: Set a reference to null and watch the heap object become garbage.
      ru: Присвой ссылке null и увидь, как объект в куче становится мусором.
    event: MEM_NULL

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: where-stored
    en: Where are instances of reference types stored, and where is the reference variable itself stored?
    ru: Где хранятся экземпляры ссылочных типов и где хранится сама ссылочная переменная?
  - id: primitive-vs-reference
    en: How does storing a primitive differ from storing a reference type? Walk through `int x = 5;` vs `Point p = new Point();`.
    ru: Чем хранение примитива отличается от хранения ссылочного типа? Разберите `int x = 5;` против `Point p = new Point();`.
  - id: pass-by-value
    en: Is Java pass-by-value or pass-by-reference? What does that mean when you pass an object to a method?
    ru: Java передаёт аргументы по значению или по ссылке? Что это значит при передаче объекта в метод?
  - id: aliasing
    en: What happens in memory when you write `b = a;` for two object variables, and why can a change through `b` be seen through `a`?
    ru: Что происходит в памяти при `b = a;` для двух объектных переменных и почему изменение через `b` видно через `a`?
  - id: fields-storage
    en: Where are an object's fields stored, including a field that is itself a reference type (e.g. a Person with an Address)?
    ru: Где хранятся поля объекта, включая поле, которое само является ссылочным типом (например, Person с Address)?
  - id: stack-vs-heap
    en: Contrast the stack and the heap — what goes where, and how do their lifetimes differ?
    ru: Сравните стек и кучу — что и где располагается и чем отличается их время жизни?
  - id: garbage
    en: After `p = null;` or reassigning `p` to a new object, what happens to the object it used to point at?
    ru: После `p = null;` или переприсваивания `p` на новый объект, что происходит с объектом, на который оно указывало раньше?
  - id: where-static-and-literals
    en: Where do static fields, class metadata and string literals live, as opposed to ordinary objects?
    ru: Где живут статические поля, метаданные классов и строковые литералы, в отличие от обычных объектов?
