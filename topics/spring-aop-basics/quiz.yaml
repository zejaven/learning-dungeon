missions:
  - id: find-duplication
    title:
      en: Find duplicated concern
      ru: Найди дублирование
    goal:
      en: Run code that shows the same cross-cutting concern repeated across several methods.
      ru: Запусти код, который показывает одну и ту же сквозную логику в нескольких методах.
    event: AOP_DUPLICATION_FOUND
  - id: register-advice
    title:
      en: Register advice
      ru: Зарегистрируй advice
    goal:
      en: Add an advice with a pointcut so cross-cutting behavior has one central place.
      ru: Добавь advice с pointcut, чтобы у сквозного поведения было одно центральное место.
    event: AOP_ADVICE_REGISTERED
  - id: match-pointcut
    title:
      en: Match a pointcut
      ru: Подбери pointcut
    goal:
      en: Call a method through the proxy so at least one pointcut matches it.
      ru: Вызови метод через proxy так, чтобы хотя бы один pointcut к нему подошёл.
    event: AOP_POINTCUT_MATCH
  - id: run-before-advice
    title:
      en: Run before advice
      ru: Выполни before advice
    goal:
      en: Make before advice run before the target business method.
      ru: Сделай так, чтобы before advice выполнился перед target business method.
    event: AOP_ADVICE_BEFORE
  - id: wrap-with-around
    title:
      en: Wrap with around advice
      ru: Оберни через around advice
    goal:
      en: Use around advice so code runs before and after proceed().
      ru: Используй around advice, чтобы код выполнился до и после proceed().
    event: AOP_ADVICE_AROUND_FINISH
  - id: handle-exception
    title:
      en: Handle a thrown exception
      ru: Обработай exception
    goal:
      en: Throw from the target method so after-throwing advice reacts outside the business code.
      ru: Брось exception из target method, чтобы after-throwing advice среагировал вне бизнес-кода.
    event: AOP_ADVICE_AFTER_THROWING
  - id: see-pointcut-miss
    title:
      en: See a pointcut miss
      ru: Увидь промах pointcut
    goal:
      en: Use a pointcut that does not match the called method, so the target runs without that advice.
      ru: Используй pointcut, который не подходит к вызванному методу, чтобы target выполнился без этого advice.
    event: AOP_POINTCUT_MISS
  - id: bypass-proxy
    title:
      en: Bypass the proxy
      ru: Обойди proxy
    goal:
      en: Call the target directly and observe that advice does not run.
      ru: Вызови target напрямую и увидь, что advice не выполняется.
    event: AOP_DIRECT_CALL

bossFight:
  - id: aop-definition
    en: 'What is AOP, and what problem does it solve in a Spring application?'
    ru: 'Что такое AOP и какую проблему оно решает в Spring-приложении?'
  - id: cross-cutting-concern
    en: 'What is a cross-cutting concern? Give three examples from real backend code.'
    ru: 'Что такое cross-cutting concern? Приведи три примера из реального backend-кода.'
  - id: aspect-advice-pointcut
    en: 'Explain the difference between aspect, advice, pointcut, and join point.'
    ru: 'Объясни разницу между aspect, advice, pointcut и join point.'
  - id: proxy-flow
    en: 'What happens when a client calls a Spring bean method that is matched by AOP advice?'
    ru: 'Что происходит, когда клиент вызывает метод Spring bean, подходящий под AOP advice?'
  - id: duplication-removal
    en: 'How does AOP reduce duplicated logging, security, metrics, or transaction code?'
    ru: 'Как AOP уменьшает дублирование logging, security, metrics или transaction code?'
  - id: proxy-limits
    en: 'Why can self-invocation, private methods, or final methods be a problem for proxy-based Spring AOP?'
    ru: 'Почему self-invocation, private methods или final methods могут быть проблемой для proxy-based Spring AOP?'
  - id: when-not-to-use
    en: 'When should you avoid AOP even if it could technically work?'
    ru: 'Когда не стоит использовать AOP, даже если технически оно могло бы сработать?'
  - id: spring-examples
    en: 'How are @Transactional, @Cacheable, @Async, or security annotations related to AOP?'
    ru: 'Как @Transactional, @Cacheable, @Async или security annotations связаны с AOP?'
