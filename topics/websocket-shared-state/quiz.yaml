# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: name-the-two-decisions
    title:
      en: Name the two decisions
      ru: Назови два решения
    goal:
      en: Run any example and read the first step — it states where the registry lives and where the unique value comes from, the two things the question is really asking.
      ru: 'Запусти любой пример и прочитай первый шаг — в нём сказано, где живёт реестр и откуда берётся уникальное значение: две вещи, о которых на самом деле спрашивает вопрос.'
    event: REGISTRY_READY
  - id: count-the-threads
    title:
      en: Count the threads
      ru: Посчитай потоки
    goal:
      en: Open a connection and find the step that says which thread serves it — then work out how many threads are inside your handler at once.
      ru: Открой соединение и найди шаг, где сказано, какой поток его обслуживает, — а затем прикинь, сколько потоков одновременно находится внутри твоего обработчика.
    event: CONNECTION_OPENED
  - id: watch-a-registry-that-is-not-shared
    title:
      en: Find the registry nobody shares
      ru: Найди реестр, который никто не разделяет
    goal:
      en: Register three connections into an instance field and find the step that explains why each map holds exactly one session.
      ru: Зарегистрируй три соединения в поле экземпляра и найди шаг, объясняющий, почему в каждой карте лежит ровно одна сессия.
    event: REGISTRY_PRIVATE
  - id: publish-into-the-registry
    title:
      en: Publish a session
      ru: Опубликуй сессию
    goal:
      en: Put a connection into the registry and read which call was used — put, putIfAbsent, or one taken under a lock.
      ru: 'Помести соединение в реестр и прочитай, каким вызовом это сделано: put, putIfAbsent или вызов под блокировкой.'
    event: REGISTERED
  - id: read-before-you-write
    title:
      en: Read a value nothing reserved
      ru: Прочитай значение, которое ничем не зарезервировано
    goal:
      en: Use a counter field or sessions.size() and find the step where the value is only read — the window where a second thread reads the same one.
      ru: Возьми поле-счётчик или sessions.size() и найди шаг, где значение только читается, — это окно, в котором второй поток прочитает то же самое.
    event: VALUE_READ
  - id: lose-an-entry-to-a-race
    title:
      en: Lose an entry to a data race
      ru: Потеряй запись из-за гонки
    goal:
      en: Let two threads publish into a plain HashMap at the same time and catch the step where one connection silently falls out of the map.
      ru: Дай двум потокам одновременно записать в обычный HashMap и поймай шаг, на котором одно соединение молча выпадает из карты.
    event: ENTRY_LOST
  - id: hand-the-same-number-twice
    title:
      en: Hand the same number to two people
      ru: Выдай один номер двум людям
    goal:
      en: Make two connections on one node end up with the same value, and explain which operation was not atomic.
      ru: Добейся, чтобы два соединения на одном узле получили одно и то же значение, и объясни, какая операция не была атомарной.
    event: DUPLICATE_VALUE
  - id: break-it-with-a-thread-safe-map
    title:
      en: Break it with a thread-safe map
      ru: Сломай это на потокобезопасной карте
    goal:
      en: Collide a value while using a thread-safe collection, and find the step that says what such a collection does and does not promise.
      ru: Получи коллизию значения на потокобезопасной коллекции и найди шаг, где сказано, что такая коллекция обещает, а что — нет.
    event: CHECK_THEN_ACT
  - id: iterate-a-synchronized-map
    title:
      en: Iterate the wrong collection
      ru: Обойди не ту коллекцию
    goal:
      en: Broadcast over a synchronizedMap while another thread is registering, and name the exception that traversal risks.
      ru: Разошли сообщение по synchronizedMap, пока другой поток регистрируется, и назови исключение, которым рискует обход.
    event: ITERATION_RACE
  - id: issue-a-value-atomically
    title:
      en: Issue a value atomically
      ru: Выдай значение атомарно
    goal:
      en: Switch to a lock or an AtomicLong and find the step where reading, adding and writing became one indivisible operation.
      ru: Перейди на блокировку или AtomicLong и найди шаг, на котором чтение, прибавление и запись стали одной неделимой операцией.
    event: VALUE_ISSUED
  - id: fan-one-message-out
    title:
      en: Fan one message out
      ru: Разошли одно сообщение
    goal:
      en: Send one message to everybody and notice that the fan-out is a loop over a collection you maintain yourself.
      ru: Отправь одно сообщение всем и заметь, что рассылка — это цикл по коллекции, которую ты ведёшь сам.
    event: BROADCAST_FANOUT
  - id: miss-somebody-silently
    title:
      en: Miss somebody silently
      ru: Пропусти кого-нибудь молча
    goal:
      en: Produce a broadcast that does not reach a connected client, and find the step that explains why nothing failed.
      ru: Сделай так, чтобы рассылка не дошла до подключённого клиента, и найди шаг, объясняющий, почему при этом ничего не упало.
    event: BROADCAST_MISSED
  - id: write-a-session-from-two-threads
    title:
      en: Write one session from two threads
      ru: Запиши в одну сессию из двух потоков
    goal:
      en: Keep the registry concurrent and still break a send — then name the exception a container throws for it.
      ru: Оставь реестр конкурентным и всё равно сломай отправку — затем назови исключение, которое бросает за это контейнер.
    event: CONCURRENT_WRITE_FAILED
  - id: serialize-the-writes
    title:
      en: Serialize the writes to a session
      ru: Сериализуй записи в сессию
    goal:
      en: Wrap the session so the second writer waits, and work out why this lock is per session rather than global.
      ru: Оберни сессию так, чтобы второй писатель ждал, и разберись, почему эта блокировка живёт на сессию, а не на всё приложение.
    event: WRITE_SERIALIZED
  - id: remove-on-close
    title:
      en: Remove it on close
      ru: Удали при закрытии
    goal:
      en: Close a connection properly and see the entry leave the registry — then think about which close codes must also trigger it.
      ru: Закрой соединение штатно и увидь, как запись уходит из реестра, — а затем подумай, при каких ещё кодах закрытия это должно срабатывать.
    event: UNREGISTERED
  - id: leak-a-session
    title:
      en: Leak a session into the registry
      ru: Оставь сессию в реестре навсегда
    goal:
      en: Let a socket die without removing its entry, and explain why a registry is a GC root that only your code shrinks.
      ru: Дай сокету умереть, не удалив его запись, и объясни, почему реестр — это GC root, который уменьшает только твой код.
    event: REGISTRY_LEAK
  - id: duplicate-across-two-nodes
    title:
      en: Duplicate a value across two nodes
      ru: Продублируй значение на двух узлах
    goal:
      en: Run the correct single-node code on two nodes and find the step where both hand out the same value with no race at all.
      ru: Запусти корректный однопроцессный код на двух узлах и найди шаг, где оба выдают одно значение вообще без гонки.
    event: CROSS_NODE_DUPLICATE
  - id: price-the-value-sources
    title:
      en: Price the value sources
      ru: Оцени источники значений
    goal:
      en: Compare the sources and read the two columns separately — unique in one JVM is not the same guarantee as unique across the cluster.
      ru: 'Сравни источники и прочитай две колонки по отдельности: уникальность в одной JVM — не та же гарантия, что уникальность во всём кластере.'
    event: VALUE_SOURCES_COMPARED
  - id: read-the-audit
    title:
      en: Read the audit
      ru: Прочитай итог
    goal:
      en: Finish a run and compare values handed out with distinct values, entries lost and connections missed.
      ru: Заверши прогон и сравни количество выданных значений с количеством различных, потерянных записей и пропущенных соединений.
    event: UNIQUENESS_AUDIT

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: where-shared-state-lives
    en: How do you share state across all WebSocket connections? Where does that state live, and what makes it visible to every connection's thread?
    ru: Как разделить состояние между всеми WebSocket-соединениями? Где это состояние живёт и что делает его видимым для потока каждого соединения?
  - id: which-collection-for-a-registry
    en: Which collection would you keep the open sessions in, and why not a HashMap, a synchronizedMap or a CopyOnWriteArrayList?
    ru: В какой коллекции ты будешь держать открытые сессии и почему не в HashMap, не в synchronizedMap и не в CopyOnWriteArrayList?
  - id: instance-field-vs-singleton
    en: A colleague keeps the session registry in a field of the endpoint class. When does that work, when does it not, and how do you tell which case you are in?
    ru: Коллега держит реестр сессий в поле класса эндпоинта. Когда это работает, когда нет и как понять, в каком случае ты находишься?
  - id: what-a-plain-hashmap-does
    en: What actually happens when two threads put into the same unsynchronized HashMap? Name more than one failure mode.
    ru: Что на самом деле происходит, когда два потока пишут в один несинхронизированный HashMap? Назови больше одного варианта отказа.
  - id: synchronized-map-limits
    en: Collections.synchronizedMap is thread-safe. Which operation on it is still unsafe, and what does that mean for broadcasting?
    ru: Collections.synchronizedMap потокобезопасен. Какая операция на нём всё равно небезопасна и что это значит для рассылки?
  - id: atomicity-of-a-sequence-of-calls
    en: 'Why is `if (!sessions.containsKey(id)) sessions.put(id, session)` still a race on a ConcurrentHashMap, and what do you write instead?'
    ru: 'Почему `if (!sessions.containsKey(id)) sessions.put(id, session)` всё ещё гонка на ConcurrentHashMap и что нужно написать вместо этого?'
  - id: why-size-plus-one-is-wrong
    en: What is wrong with using sessions.size() + 1 as the id for a new connection? Give a failure that needs no concurrency at all.
    ru: Что не так с использованием sessions.size() + 1 в качестве идентификатора нового соединения? Приведи отказ, для которого конкурентность вообще не нужна.
  - id: why-plus-plus-is-not-atomic
    en: Why is `nextId++` on a shared long not atomic, and what does volatile fix and not fix here?
    ru: Почему `nextId++` на общем long не атомарен и что volatile здесь чинит, а что нет?
  - id: atomiclong-vs-synchronized
    en: AtomicLong or a synchronized block for the counter? What is the difference in how they work and when would you pick each?
    ru: AtomicLong или synchronized-блок для счётчика? В чём разница в их работе и когда ты выберешь каждый?
  - id: globally-unique-across-instances
    en: Your ids are unique on one instance. You deploy two. What breaks, and what are your options for making the value unique across all of them?
    ru: Твои идентификаторы уникальны на одном экземпляре. Ты разворачиваешь два. Что ломается и какие есть варианты сделать значение уникальным для всех?
  - id: uuid-vs-sequence
    en: UUID, a database sequence, Redis INCR or a Snowflake id — what does each cost you, and how would you choose between them?
    ru: UUID, последовательность в базе, Redis INCR или Snowflake-идентификатор — чего стоит каждый вариант и как ты будешь выбирать между ними?
  - id: uuid-collision-risk
    en: Is UUID.randomUUID() safe to call from many threads, and is a collision something you have to plan for? Justify the answer.
    ru: Безопасно ли вызывать UUID.randomUUID() из многих потоков и нужно ли планировать защиту от коллизии? Обоснуй ответ.
  - id: uuid-as-a-primary-key
    en: What is the downside of a random UUID as a database primary key, and which UUID version reduces it?
    ru: В чём минус случайного UUID как первичного ключа в базе и какая версия UUID его уменьшает?
  - id: two-threads-one-session
    en: Two threads call sendMessage on the same WebSocket session at the same time. What happens, and how do you prevent it?
    ru: Два потока одновременно вызывают sendMessage на одной WebSocket-сессии. Что произойдёт и как это предотвратить?
  - id: registry-vs-session-safety
    en: Why does making the session registry concurrent not make the sessions in it safe to use concurrently?
    ru: Почему конкурентность реестра сессий не делает лежащие в нём сессии безопасными для конкурентного использования?
  - id: removing-on-close
    en: What has to happen when a connection closes, and what goes wrong over a week if it does not?
    ru: Что должно произойти при закрытии соединения и что пойдёт не так за неделю, если этого не происходит?
  - id: registry-memory-growth
    en: Your heap grows steadily on a WebSocket service and a dump shows a huge map of sessions. How do you diagnose and fix it?
    ru: Куча на WebSocket-сервисе растёт, и дамп показывает огромную карту сессий. Как ты это диагностируешь и чинишь?
  - id: broadcast-across-instances
    en: How do you broadcast to every connected user when the connections are spread across several instances?
    ru: Как разослать сообщение всем подключённым пользователям, если соединения распределены по нескольким экземплярам?
  - id: sticky-sessions-and-scaling
    en: Do sticky sessions solve the shared-state problem for WebSockets? What do they solve and what do they leave open?
    ru: Решают ли sticky sessions задачу общего состояния для WebSocket? Что они решают и что оставляют нерешённым?
  - id: happens-before-for-shared-state
    en: Beyond mutual exclusion, what does a thread need in order to SEE another thread's write to shared state?
    ru: Помимо взаимного исключения, что нужно потоку, чтобы УВИДЕТЬ запись другого потока в общее состояние?
  - id: static-vs-spring-singleton
    en: A static field or a Spring singleton bean for the registry — is there a practical difference, and which do you choose?
    ru: Статическое поле или singleton-бин Spring для реестра — есть ли практическая разница и что ты выберешь?
  - id: testing-a-shared-registry
    en: How would you write a test that actually catches a lost entry or a duplicate id, given that the bug is intermittent?
    ru: Как написать тест, который действительно поймает потерянную запись или дублирующийся идентификатор, если ошибка плавающая?
  - id: locking-granularity
    en: If you did use locking for the registry, what would you lock and what would happen if you locked the whole thing during a broadcast?
    ru: Если всё же использовать блокировки для реестра, что именно ты будешь блокировать и что случится, если заблокировать всё целиком на время рассылки?
  - id: uniqueness-under-failure
    en: Your unique value comes from a database sequence and the database is briefly unavailable. What do you do about new connections?
    ru: Уникальное значение берётся из последовательности в базе, и база ненадолго недоступна. Что делать с новыми соединениями?
  - id: when-uniqueness-must-be-persisted
    en: When is an in-memory unique value not enough, and where does uniqueness have to be enforced instead?
    ru: Когда уникального значения в памяти недостаточно и где тогда должна обеспечиваться уникальность?
