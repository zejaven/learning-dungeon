id: outbox-pattern
title:
  en: Outbox Pattern
  ru: Паттерн Outbox
category:
  en: Distributed Systems / Messaging
  ru: Распределённые системы / Обмен сообщениями
type: TRANSACTION
summary:
  en: >
    The Outbox pattern (transactional outbox) makes publishing an event reliable
    when a service must both change its database and notify a message broker —
    two different systems that cannot share a transaction. Instead of writing the
    business change and publishing as two separate steps (the dual-write problem,
    where a crash in between loses or duplicates the event), the service writes
    the business change AND inserts an event row into an outbox table in the same
    local database transaction. A separate relay later reads unpublished rows and
    publishes them to the broker. Because the two writes commit together,
    "publish exactly when the database commits" becomes guaranteed.
  ru: >
    Паттерн Outbox (транзакционный outbox) делает публикацию события надёжной,
    когда сервис должен и изменить свою базу данных, и уведомить брокер сообщений
    — две разные системы, которые не могут разделить одну транзакцию. Вместо того
    чтобы выполнять бизнес-изменение и публикацию двумя отдельными шагами
    (проблема двойной записи, когда сбой между ними теряет или дублирует
    событие), сервис записывает бизнес-изменение И вставляет строку события в
    таблицу outbox в одной локальной транзакции базы данных. Отдельный релей
    позже читает неопубликованные строки и публикует их в брокер. Поскольку обе
    записи фиксируются вместе, «публиковать ровно тогда, когда фиксируется база»
    становится гарантией.

