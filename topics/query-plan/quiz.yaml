# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: what-is-query-plan
    en: What is a query plan, and who produces it?
    ru: Что такое план запроса и кто его создаёт?
  - id: why-many-plans
    en: Why can one SQL statement have many possible plans, and how does the optimizer choose one?
    ru: Почему у одного SQL-запроса может быть много возможных планов и как оптимизатор выбирает один?
  - id: explain-vs-analyze
    en: What is the difference between EXPLAIN and EXPLAIN ANALYZE?
    ru: В чём разница между EXPLAIN и EXPLAIN ANALYZE?
  - id: cost-based-statistics
    en: What does it mean that the optimizer is cost-based, and why do statistics matter?
    ru: Что значит, что оптимизатор стоимостный, и почему важна статистика?
  - id: seq-scan-vs-index-scan
    en: When would the optimizer choose a Seq Scan over an Index Scan even though an index exists?
    ru: Когда оптимизатор выберет Seq Scan вместо Index Scan, хотя индекс существует?
  - id: nested-loop-vs-hash-join
    en: What is the difference between a Nested Loop join and a Hash Join, and when is each better?
    ru: В чём разница между соединением Nested Loop и Hash Join и когда лучше каждое?
  - id: read-plan-debug
    en: You have a slow query. How do you use its plan to find and fix the problem?
    ru: У вас медленный запрос. Как с помощью его плана найти и устранить проблему?
  - id: estimated-vs-actual
    en: Why is a large gap between estimated rows and actual rows in a plan a red flag?
    ru: Почему большой разрыв между оценочным и фактическим числом строк в плане - тревожный признак?
