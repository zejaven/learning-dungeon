id: jvm-memory-structures
languages: [en, ru]
title:
  en: 'Memory Structures in Java: the JVM Runtime Data Areas'
  ru: 'Структуры памяти в Java: области данных времени выполнения JVM'
category:
  en: JVM / Memory & GC
  ru: JVM / Память и GC
type: JVM_MEMORY
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: memory-gc
difficulty: 2
catalogId: memory-gc-4
summary:
  en: >
    A running JVM splits memory into runtime data areas of two kinds. Shared by
    the whole instance, exactly one of each: the heap (all objects and arrays,
    managed by the garbage collector), the string pool inside it, Metaspace
    (class metadata, in native memory) and the code cache (JIT-compiled native
    code). Private to each thread, one of each per live thread: the JVM stack of
    frames, the PC register and the native method stack. So an application has
    one heap and as many stacks as it has live threads.
  ru: >
    Работающая JVM делит память на области данных двух видов. Общие для всего
    инстанса, ровно по одной: куча (все объекты и массивы, управляется сборщиком
    мусора), пул строк внутри неё, Metaspace (метаданные классов, в нативной
    памяти) и кэш кода (нативный код после JIT). Приватные для каждого потока, по
    одной на каждый живой поток: JVM-стек кадров, PC-регистр и стек нативных
    методов. Поэтому у приложения одна куча и столько стеков, сколько у него
    живых потоков.

primitives:
  - BoxGroup

defaultExample: runtime-areas-tour

examples:
  - id: runtime-areas-tour
    title:
      en: Tour of the areas
      ru: Обзор областей
    file: 01-runtime-areas-tour.java
    explanation:
      en: >
        One JVM instance boots with one heap, one string pool, one Metaspace and
        one code cache. Class metadata goes to Metaspace, the object itself goes
        to the heap.
      ru: >
        Один инстанс JVM стартует с одной кучей, одним пулом строк, одним
        Metaspace и одним кэшем кода. Метаданные класса идут в Metaspace, сам
        объект — в кучу.
  - id: shared-vs-per-thread
    title:
      en: Shared vs per thread
      ru: Общие и на поток
    file: 02-shared-vs-per-thread.java
    explanation:
      en: >
        Every thread that starts brings its own stack, PC register and native
        method stack. The shared areas never multiply — all threads allocate into
        the same single heap.
      ru: >
        Каждый стартующий поток приносит свои стек, PC-регистр и стек нативных
        методов. Общие области не размножаются — все потоки размещают объекты в
        одной и той же куче.
  - id: frames-and-pc
    title:
      en: Frames and the PC register
      ru: Кадры и PC-регистр
    file: 03-frames-and-pc.java
    explanation:
      en: >
        A call pushes a frame with that call's locals onto the calling thread's
        own stack, and its PC register tracks where inside the current method the
        thread is.
      ru: >
        Вызов кладёт кадр с локальными переменными на стек вызывающего потока, а
        его PC-регистр отслеживает, где именно внутри текущего метода находится
        поток.
  - id: metaspace-and-code-cache
    title:
      en: Metaspace and code cache
      ru: Metaspace и кэш кода
    file: 04-metaspace-and-code-cache.java
    explanation:
      en: >
        Class metadata is stored once in Metaspace no matter how many instances
        exist, and a JIT-compiled method lands in the code cache — neither area
        is the heap.
      ru: >
        Метаданные класса хранятся в Metaspace в одном экземпляре, сколько бы
        объектов ни было создано, а скомпилированный JIT метод попадает в кэш
        кода — обе области не являются кучей.
  - id: string-pool-inside-heap
    title:
      en: String pool inside the heap
      ru: Пул строк внутри кучи
    file: 05-string-pool-inside-heap.java
    explanation:
      en: >
        Equal literals share one pooled instance, and since Java 7 that pool
        lives inside the heap; new String(...) deliberately creates a separate
        heap object outside the pool.
      ru: >
        Одинаковые литералы делят один экземпляр из пула, и с Java 7 этот пул
        находится внутри кучи; new String(...) намеренно создаёт отдельный объект
        в куче вне пула.
  - id: native-method-stack
    title:
      en: Native method stack
      ru: Стек нативных методов
    file: 06-native-method-stack.java
    explanation:
      en: >
        A native call is recorded on the thread's native method stack, a
        different area from its JVM stack — and each thread has its own of both.
      ru: >
        Нативный вызов попадает на стек нативных методов потока — это область,
        отличная от его JVM-стека, и у каждого потока есть свои обе.

