# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: send-the-user-away
    title:
      en: Send the user to the provider
      ru: Отправь пользователя к провайдеру
    goal:
      en: Start a flow and watch the client redirect the browser instead of calling the provider itself.
      ru: Начни поток и увидь, как клиент перенаправляет браузер вместо того, чтобы обращаться к провайдеру самому.
    event: AUTHORIZATION_REQUEST
  - id: password-stays-at-the-provider
    title:
      en: Keep the password out of the app
      ru: Оставь пароль вне приложения
    goal:
      en: Let the user authenticate and see which party the password is actually typed into.
      ru: Дай пользователю аутентифицироваться и посмотри, кому на самом деле вводят пароль.
    event: USER_AUTHENTICATED_AT_PROVIDER
  - id: ask-for-permission
    title:
      en: Get consent
      ru: Получи согласие
    goal:
      en: Have the user approve the requested scopes and see what the grant is limited to.
      ru: Пусть пользователь одобрит запрошенные scope, и посмотри, чем ограничено выданное разрешение.
    event: CONSENT_GRANTED
  - id: get-a-code-not-a-token
    title:
      en: Get a code, not a token
      ru: Получи код, а не токен
    goal:
      en: Watch what comes back through the browser after consent, and why it is nearly worthless on its own.
      ru: Посмотри, что возвращается через браузер после согласия и почему оно само по себе почти бесполезно.
    event: AUTHORIZATION_CODE_RETURNED
  - id: swap-it-on-the-back-channel
    title:
      en: Swap the code for tokens
      ru: Обменяй код на токены
    goal:
      en: Redeem the code on a direct server-to-server call and see what appears only there.
      ru: Обменяй код прямым вызовом сервер — сервер и посмотри, что появляется только там.
    event: TOKENS_ISSUED
  - id: learn-who-the-user-is
    title:
      en: Learn who the user is
      ru: Узнай, кто пользователь
    goal:
      en: Validate an id_token and list what the client checks before believing a single claim.
      ru: Проверь id_token и перечисли, что клиент проверяет, прежде чем поверить хоть одному утверждению.
    event: ID_TOKEN_VERIFIED
  - id: ask-oauth-who
    title:
      en: Ask plain OAuth who the user is
      ru: Спроси у обычного OAuth, кто пользователь
    goal:
      en: Run a flow without the openid scope and try to find the user's identity in the response.
      ru: Прогони поток без scope openid и попробуй найти в ответе личность пользователя.
    event: ID_TOKEN_MISSING
  - id: the-classic-bug
    title:
      en: Log a user in from an access token
      ru: Впусти пользователя по access-токену
    goal:
      en: Treat an access token as proof of who is calling and work out why that check can be faked.
      ru: Прими access-токен за доказательство того, кто вызывает, и разберись, почему такую проверку можно подделать.
    event: ACCESS_TOKEN_MISUSED_AS_IDENTITY
  - id: use-the-access-token
    title:
      en: Call the API
      ru: Вызови API
    goal:
      en: Send the access token to the resource server and see what it checks before serving the call.
      ru: Отправь access-токен серверу ресурсов и посмотри, что он проверяет, прежде чем обслужить вызов.
    event: API_CALL_SERVED
  - id: hit-a-scope-wall
    title:
      en: Run out of scope
      ru: Упрись в границу scope
    goal:
      en: Use a perfectly valid token for something the user never granted, and note the status code.
      ru: Воспользуйся совершенно корректным токеном для того, чего пользователь не разрешал, и посмотри на код ответа.
    event: SCOPE_INSUFFICIENT
  - id: say-no
    title:
      en: Refuse consent
      ru: Откажи в согласии
    goal:
      en: Have the user decline an over-eager scope list and confirm nothing is issued.
      ru: Пусть пользователь отклонит слишком жадный список scope, и убедись, что ничего не выдаётся.
    event: CONSENT_DENIED
  - id: check-the-state
    title:
      en: Verify the state
      ru: Проверь state
    goal:
      en: Watch the client compare the callback's state with the one it stored before the redirect.
      ru: Увидь, как клиент сравнивает state из callback с тем, который сохранил перед редиректом.
    event: STATE_VERIFIED
  - id: block-an-injection
    title:
      en: Block a code injection
      ru: Заблокируй внедрение кода
    goal:
      en: Deliver somebody else's authorization code to a client that checks state.
      ru: Доставь чужой код авторизации клиенту, который проверяет state.
    event: STATE_MISMATCH_BLOCKED
  - id: lose-a-session
    title:
      en: Lose the session to an injection
      ru: Отдай сессию через внедрение кода
    goal:
      en: Do the same against a client that never sends state, and see whose account the app ends up in.
      ru: Сделай то же самое с клиентом, который не отправляет state, и посмотри, в чьём аккаунте окажется приложение.
    event: CODE_INJECTION_ACCEPTED
  - id: steal-a-code
    title:
      en: Steal an authorization code
      ru: Укради код авторизации
    goal:
      en: Copy the code out of the front channel and list the places it can be read from.
      ru: Скопируй код из фронт-канала и перечисли места, откуда его можно прочитать.
    event: AUTHORIZATION_CODE_STOLEN
  - id: pkce-saves-you
    title:
      en: Watch PKCE stop the thief
      ru: Увидь, как PKCE останавливает вора
    goal:
      en: Try to redeem a stolen code against a client that sent a code_challenge.
      ru: Попробуй обменять украденный код у клиента, который отправлял code_challenge.
    event: STOLEN_CODE_BLOCKED
  - id: pkce-missing
    title:
      en: Redeem a stolen code
      ru: Обменяй украденный код
    goal:
      en: Take the same code against a public client with PKCE turned off.
      ru: Возьми тот же код у публичного клиента с выключенным PKCE.
    event: STOLEN_CODE_REDEEMED
  - id: codes-are-single-use
    title:
      en: Use a code twice
      ru: Используй код дважды
    goal:
      en: Redeem the same authorization code a second time and see what the provider does about it.
      ru: Обменяй один и тот же код авторизации второй раз и посмотри, что сделает провайдер.
    event: AUTHORIZATION_CODE_REJECTED
  - id: outlive-a-token
    title:
      en: Outlive an access token
      ru: Переживи access-токен
    goal:
      en: Move the clock past the expiry and call the API again, without touching the provider in between.
      ru: Переведи часы за срок действия и снова вызови API, ничего между этим не трогая у провайдера.
    event: ACCESS_TOKEN_EXPIRED
  - id: renew-without-the-user
    title:
      en: Renew without the user
      ru: Продли без пользователя
    goal:
      en: Exchange a refresh token for a fresh access token and note what did not happen.
      ru: Обменяй refresh-токен на свежий access-токен и отметь, чего при этом не произошло.
    event: TOKENS_REFRESHED
  - id: no-user-at-all
    title:
      en: Get a token with no user
      ru: Получи токен без пользователя
    goal:
      en: Use the machine-to-machine grant and see how much of the protocol disappears.
      ru: Воспользуйся grant «машина — машине» и посмотри, какая часть протокола исчезает.
    event: CLIENT_CREDENTIALS_ISSUED
  - id: nothing-to-refresh
    title:
      en: Find nothing to refresh
      ru: Обнаружь, что обновлять нечего
    goal:
      en: Try to renew a grant that never came with a refresh token.
      ru: Попробуй продлить разрешение, к которому refresh-токен никогда не выдавали.
    event: REFRESH_UNAVAILABLE
  - id: token-in-the-url
    title:
      en: Put a token in the URL
      ru: Положи токен в URL
    goal:
      en: Run the old implicit flow and say where that token now lives besides the app.
      ru: Прогони старый implicit flow и скажи, где теперь живёт этот токен помимо приложения.
    event: IMPLICIT_TOKEN_IN_URL
  - id: hand-over-the-password
    title:
      en: Hand the app your password
      ru: Отдай приложению свой пароль
    goal:
      en: Use the password grant and name everything that stops working because of it.
      ru: Воспользуйся grant с паролем и назови всё, что из-за этого перестаёт работать.
    event: PASSWORD_GRANT_USED

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: walk-the-flow
    en: Walk me through the OAuth 2.0 authorization code flow. Who talks to whom, in what order, and what does each message carry?
    ru: Проведи меня по потоку authorization code в OAuth 2.0. Кто с кем говорит, в каком порядке и что несёт каждое сообщение?
  - id: four-roles
    en: What are the four roles in OAuth, and which of them is the one people usually confuse?
    ru: Какие в OAuth четыре роли и какую из них обычно путают?
  - id: oauth-vs-oidc
    en: What is the difference between OAuth 2.0 and OpenID Connect? What exactly does OIDC add?
    ru: В чём разница между OAuth 2.0 и OpenID Connect? Что именно добавляет OIDC?
  - id: access-vs-id-token
    en: What is the difference between an access token and an id_token? Who is each of them addressed to?
    ru: В чём разница между access-токеном и id_token? Кому адресован каждый из них?
  - id: why-not-log-in-with-access-token
    en: Why can you not use an access token as proof of who the user is? What attack does that enable?
    ru: Почему нельзя использовать access-токен как доказательство того, кто пользователь? Какую атаку это открывает?
  - id: validating-an-id-token
    en: A signed id_token arrives at your backend. Which claims do you check, and what does each check prevent?
    ru: На бэкенд пришёл подписанный id_token. Какие поля ты проверишь и что предотвращает каждая проверка?
  - id: why-a-code
    en: Why does the authorization server return a code through the browser instead of the token itself?
    ru: Почему сервер авторизации возвращает через браузер код, а не сам токен?
  - id: front-vs-back-channel
    en: What is the difference between the front channel and the back channel, and what may travel on each?
    ru: В чём разница между фронт-каналом и бэк-каналом и что можно отправлять по каждому из них?
  - id: what-is-pkce
    en: What is PKCE, what problem does it solve, and why is it now recommended even for confidential clients?
    ru: Что такое PKCE, какую проблему он решает и почему его теперь рекомендуют даже конфиденциальным клиентам?
  - id: what-is-state
    en: What is the `state` parameter for? Describe an attack that works without it.
    ru: Зачем нужен параметр `state`? Опиши атаку, которая работает без него.
  - id: public-vs-confidential
    en: What is the difference between a public and a confidential client? Where would you put a SPA, a mobile app and a server-rendered web app?
    ru: В чём разница между публичным и конфиденциальным клиентом? Куда ты отнесёшь SPA, мобильное приложение и серверное веб-приложение?
  - id: which-grant
    en: Which grant would you pick for a SPA, for a mobile app, for a server-side web app and for a nightly batch job, and why?
    ru: Какой grant ты выберешь для SPA, мобильного приложения, серверного веб-приложения и ночной фоновой задачи и почему?
  - id: client-credentials
    en: When is the client_credentials grant the right answer, and what does it deliberately leave out?
    ru: Когда grant client_credentials — правильный ответ и что он намеренно не включает?
  - id: implicit-and-password-grants
    en: Why were the implicit flow and the password grant deprecated? What replaced each of them?
    ru: Почему отказались от implicit flow и от grant с паролем? Что пришло на смену каждому?
  - id: scopes-vs-permissions
    en: What is a scope, and how is it different from a user's permissions in your own system?
    ru: Что такое scope и чем он отличается от прав пользователя в твоей собственной системе?
  - id: resource-server-checks
    en: An access token arrives at your API. What does the resource server check, and does it have to call the authorization server to do it?
    ru: В твой API пришёл access-токен. Что проверяет сервер ресурсов и обязан ли он ради этого обращаться к серверу авторизации?
  - id: token-lifetimes
    en: What lifetimes would you give an authorization code, an access token and a refresh token, and where would a browser app keep each?
    ru: Какие сроки жизни ты дашь коду авторизации, access-токену и refresh-токену и где браузерное приложение будет хранить каждый?
  - id: revocation
    en: A user revokes their consent, or you need to cut an app off right now. What actually stops working, and when?
    ru: Пользователь отзывает согласие или нужно прямо сейчас отрезать приложение. Что реально перестаёт работать и когда?
  - id: sso-and-logout
    en: How does single sign-on work across several apps of the same provider, and why is single logout so much harder?
    ru: Как работает единый вход через несколько приложений одного провайдера и почему единый выход намного сложнее?
  - id: oauth-inside-microservices
    en: How would you use OAuth or OIDC inside a system of several services? Where is the token validated and what does each service still check itself?
    ru: Как использовать OAuth или OIDC внутри системы из нескольких сервисов? Где проверяется токен и что каждый сервис всё равно проверяет сам?
  - id: redirect-uri-registration
    en: Why must redirect URIs be registered and matched exactly? What goes wrong with a wildcard or an open redirect?
    ru: Почему redirect URI должны быть зарегистрированы и совпадать точно? Что ломается при wildcard или открытом редиректе?
