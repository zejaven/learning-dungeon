id: red-black-tree
title:
  en: 'Red-Black Tree'
  ru: 'Красно-чёрное дерево'
category:
  en: 'Algorithms / Data Structures'
  ru: 'Алгоритмы / Структуры данных'
type: DATA_STRUCTURE
mode: trace
aiProvider: codex
aiModel: gpt-5.5
summary:
  en: >
    A red-black tree is a self-balancing binary search tree. It stores keys in
    sorted order, colors nodes red or black, and repairs inserts with recoloring
    and rotations so search, insert, and delete stay O(log n).
  ru: >
    Красно-чёрное дерево — это самобалансирующееся бинарное дерево поиска. Оно
    хранит ключи в отсортированном порядке, помечает узлы красным или чёрным
    цветом и исправляет вставки перекраской и поворотами, чтобы search, insert
    и delete оставались O(log n).
categoryId: algorithms
difficulty: 2
catalogId: algorithms-8
style: Real world
primitives:
  - TreeView
  - ArrayGrid
defaultExample: insert-basics
examples:
  - id: insert-basics
    title:
      en: 'BST order plus colors'
      ru: 'Порядок BST и цвета'
    file: 01-insert-basics.java
    explanation:
      en: 'Insert three keys and see the tree keep binary-search order while coloring the root black.'
      ru: 'Вставь три ключа и посмотри, как дерево сохраняет порядок binary search tree и делает корень чёрным.'
  - id: recolor-red-uncle
    title:
      en: 'Recolor a red uncle'
      ru: 'Перекраска красного дяди'
    file: 02-recolor-red-uncle.java
    explanation:
      en: 'A red parent with a red uncle is repaired by recoloring before the root is forced black again.'
      ru: 'Красный родитель с красным дядей исправляется перекраской, после чего корень снова принудительно становится чёрным.'
  - id: left-rotation
    title:
      en: 'Left rotation'
      ru: 'Левый поворот'
    file: 03-left-rotation.java
    explanation:
      en: 'Ascending inserts create a right-right shape, so the tree rotates left to keep the height small.'
      ru: 'Вставки по возрастанию создают форму right-right, поэтому дерево делает левый поворот и удерживает высоту маленькой.'
  - id: right-rotation
    title:
      en: 'Right rotation'
      ru: 'Правый поворот'
    file: 04-right-rotation.java
    explanation:
      en: 'Descending inserts create a left-left shape, so the tree rotates right.'
      ru: 'Вставки по убыванию создают форму left-left, поэтому дерево делает правый поворот.'
  - id: search-path
    title:
      en: 'Search path'
      ru: 'Путь поиска'
    file: 05-search-path.java
    explanation:
      en: 'Search follows the same less-than / greater-than branches as a normal BST, but balancing keeps the path short.'
      ru: 'Поиск идёт по тем же веткам less-than / greater-than, что и в обычном BST, но балансировка держит путь коротким.'
assistantExample:
  en: 'e.g. Why do red-black trees use colors and rotations instead of rebuilding the whole tree?'
  ru: 'например: Почему красно-чёрные деревья используют цвета и повороты, а не перестраивают всё дерево?'
missionsFile: quiz.yaml
