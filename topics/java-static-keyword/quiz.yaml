missions:
  - id: initialize-class
    title:
      en: Initialize the class once
      ru: Инициализируй класс один раз
    goal:
      en: Run an example that performs first active use of a class and emits class initialization.
      ru: Запусти пример с первым активным использованием класса, чтобы увидеть инициализацию класса.
    event: STATIC_CLASS_INIT
  - id: write-static-field
    title:
      en: Change shared class state
      ru: Измени общее состояние класса
    goal:
      en: Write a static field so the value is stored in the class area, not in one object.
      ru: Запиши static-поле, чтобы значение оказалось в области класса, а не в одном объекте.
    event: STATIC_FIELD_WRITE
  - id: create-instance
    title:
      en: Create an object instance
      ru: Создай экземпляр объекта
    goal:
      en: Create an object and compare its instance fields with the class-level static fields.
      ru: Создай объект и сравни его instance-поля с static-полями уровня класса.
    event: INSTANCE_CREATED
  - id: call-static-method
    title:
      en: Call a static method
      ru: Вызови static-метод
    goal:
      en: Call a method through the class and observe that it has no object receiver.
      ru: Вызови метод через класс и увидь, что у него нет объектного получателя.
    event: STATIC_METHOD_CALL
  - id: show-constant
    title:
      en: Show a class constant
      ru: Покажи константу класса
    goal:
      en: Add a static final compile-time constant and note that constant-only access may be inlined.
      ru: Добавь static final константу времени компиляции и заметь, что доступ только к ней может быть встроен.
    event: STATIC_CONSTANT
  - id: show-static-nested-class
    title:
      en: Show a static nested class
      ru: Покажи static nested class
    goal:
      en: Add a static nested class and see that it is grouped under the outer class without an outer this.
      ru: Добавь static nested class и увидь, что он сгруппирован внутри внешнего класса без outer this.
    event: STATIC_NESTED_CLASS

bossFight:
  - id: meaning-of-static
    en: What does static mean in Java, and how is it different from an instance member?
    ru: Что означает static в Java и чем static-член отличается от instance-члена?
  - id: where-static-can-be-used
    en: Where can static be used in Java, and where can it not be used?
    ru: Где в Java можно использовать static, а где нельзя?
  - id: static-method-no-this
    en: Why does a static method have no this, and how can it work with instance data if needed?
    ru: Почему у static-метода нет this и как он может работать с instance-данными, если это нужно?
  - id: class-initialization
    en: When does Java initialize a class, and how many times does static initialization run?
    ru: Когда Java инициализирует класс и сколько раз выполняется static-инициализация?
  - id: static-final-constant
    en: What is special about static final compile-time constants?
    ru: Что особенного в static final константах времени компиляции?
  - id: static-field-risks
    en: Why can a mutable static field be dangerous in production code?
    ru: Почему изменяемое static-поле может быть опасным в production-коде?
  - id: static-nested-vs-inner
    en: What is the difference between a static nested class and an inner class?
    ru: Чем static nested class отличается от inner class?
