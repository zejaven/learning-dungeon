summary:
  en: >
    An unsorted array gives only O(n) value search. You can speed it up by
    sorting once and using binary search, or by building an auxiliary HashSet,
    HashMap, or value-to-index map for repeated lookups. This topic explains the
    trade-offs: preprocessing time, extra memory, duplicates, updates, and when a
    plain linear scan is still the right answer.
  ru: >
    В неотсортированном массиве поиск по значению остаётся O(n). Его можно
    ускорить, если один раз отсортировать данные и использовать binary search,
    либо построить вспомогательный HashSet, HashMap или отображение
    value-to-index для повторных поисков. Тема объясняет компромиссы: время
    подготовки, дополнительную память, дубликаты, обновления и ситуации, когда
    простой линейный проход всё ещё лучший ответ.

