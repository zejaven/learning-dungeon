summary:
  en: >
    How to configure Java GC in practice: choose a collector for the service goal,
    size the heap and container headroom, turn on GC logging, test under load, and
    tune only from measurements instead of random flags.
  ru: >
    Как на практике настраивать GC в Java: выбрать сборщик под цель сервиса,
    задать размер heap и запас памяти в контейнере, включить GC logging,
    проверить под нагрузкой и менять флаги только по измерениям, а не случайно.

