id: executor-wait-all
languages: [en, ru]
title:
  en: 'ExecutorService: Run Many Tasks and Wait for All'
  ru: 'ExecutorService: запустить много задач и дождаться всех'
category:
  en: Java Core / Concurrency
  ru: Java Core / Многопоточность
type: CONCURRENCY
mode: trace
summary:
  en: >
    How to run many independent tasks on a limited ExecutorService and make the
    main thread wait for completion using CountDownLatch, invokeAll, and Future
    results without creating one Thread per task.
  ru: >
    Как запускать много независимых задач на ограниченном ExecutorService и
    заставить main дождаться завершения через CountDownLatch, invokeAll и
    результаты Future без создания отдельного Thread на каждую задачу.
categoryId: concurrency
difficulty: 2
catalogId: concurrency-18
style: Real world
aiProvider: codex
aiModel: gpt-5.5

primitives:
  - ArrayGrid
  - LinkedNodes

defaultExample: limited-pool

examples:
  - id: limited-pool
    title:
      en: Limited pool
      ru: Ограниченный pool
    file: 01-limited-pool.java
    explanation:
      en: >
        Three tasks enter a fixed executor with two workers. Two start
        immediately and the extra task waits in the queue.
      ru: >
        Три задачи попадают в fixed executor с двумя workers. Две стартуют сразу,
        а лишняя задача ждет в очереди.
  - id: countdown-latch
    title:
      en: CountDownLatch
      ru: CountDownLatch
    file: 02-countdown-latch.java
    explanation:
      en: >
        Every task calls countDown() when it finishes. main waits in await()
        until the latch count reaches zero.
      ru: >
        Каждая задача вызывает countDown() при завершении. main ждет в await(),
        пока счетчик latch не станет нулем.
  - id: invoke-all
    title:
      en: invokeAll
      ru: invokeAll
    file: 03-invoke-all.java
    explanation:
      en: >
        invokeAll submits a batch of Callables and returns only after all of
        their Futures are done.
      ru: >
        invokeAll отправляет пачку Callable и возвращается только после того,
        как все их Futures стали done.
  - id: future-get
    title:
      en: Future.get
      ru: Future.get
    file: 04-future-get.java
    explanation:
      en: >
        Future.get blocks the caller if the task is not done yet, then returns
        the task result after completion.
      ru: >
        Future.get блокирует вызывающий поток, если задача еще не done, а после
        завершения возвращает результат задачи.
  - id: shutdown
    title:
      en: Shutdown after wait
      ru: Shutdown после ожидания
    file: 05-shutdown.java
    explanation:
      en: >
        After the batch has completed and results are collected, shutdown()
        lets the executor stop instead of keeping worker threads alive.
      ru: >
        После завершения пачки и сбора результатов shutdown() позволяет executor
        остановиться, а не держать worker threads живыми.

assistantExample:
  en: 'e.g. When should I use CountDownLatch instead of invokeAll to wait for a batch of tasks?'
  ru: 'например: Когда использовать CountDownLatch вместо invokeAll, чтобы дождаться пачки задач?'

missionsFile: quiz.yaml
