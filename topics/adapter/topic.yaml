summary:
  en: >
    Adapter solves the problem of incompatible interfaces: existing or external
    code offers one shape, while your application expects another. In this
    structural practice you wrap a legacy payment gateway with a
    LegacyPaymentAdapter that implements the PaymentProcessor interface, so the
    checkout code depends on the target contract instead of the legacy API.
  ru: >
    Adapter решает проблему несовместимых интерфейсов: существующий или внешний
    код предлагает одну форму, а ваше приложение ожидает другую. В этой
    структурной практике вы оборачиваете legacy payment gateway в
    LegacyPaymentAdapter, который реализует интерфейс PaymentProcessor, чтобы
    код оформления заказа зависел от целевого контракта, а не от legacy API.

