missions:
  - id: bounded-timeout
    title:
      en: Bound the wait
      ru: Ограничь ожидание
    goal:
      en: Run a call where an unavailable service stops waiting after a timeout.
      ru: Запусти вызов, где недоступный сервис прекращает ожидание после timeout.
    event: SERVICE_TIMEOUT
  - id: fallback-data
    title:
      en: Use fallback data
      ru: Используй fallback-данные
    goal:
      en: Return a degraded but useful response when optional data is unavailable.
      ru: Верни деградированный, но полезный ответ, когда необязательные данные недоступны.
    event: SERVICE_FALLBACK_USED
  - id: parallel-join
    title:
      en: Join parallel calls
      ru: Собери параллельные вызовы
    goal:
      en: Start independent downstream calls together and join them after the bounded wait.
      ru: Запусти независимые downstream-вызовы вместе и собери их после ограниченного ожидания.
    event: PARALLEL_CALLS_JOINED
  - id: open-circuit
    title:
      en: Open the circuit
      ru: Открой circuit
    goal:
      en: Produce repeated failures so the circuit breaker opens for the broken service.
      ru: Создай повторные сбои, чтобы circuit breaker открылся для сломанного сервиса.
    event: CIRCUIT_OPENED
  - id: fail-fast
    title:
      en: Fail fast
      ru: Ответь быстро при сбое
    goal:
      en: Make the next request skip an already-open circuit without waiting on the service.
      ru: Сделай так, чтобы следующий запрос пропустил уже открытый circuit без ожидания сервиса.
    event: CIRCUIT_SHORT_CIRCUITED

bossFight:
  - id: answer-outline
    en: How would you optimize response wait time when one downstream service is unavailable?
    ru: Как оптимизировать время ожидания ответа, если один downstream service недоступен?
  - id: timeout-vs-retry
    en: Why is an unlimited retry loop dangerous when a service is already unavailable?
    ru: Почему бесконечный цикл retry опасен, когда сервис уже недоступен?
  - id: fallback-design
    en: What makes a fallback safe, and when should you avoid returning fallback data?
    ru: Что делает fallback безопасным и когда не стоит возвращать fallback-данные?
  - id: circuit-breaker
    en: What problem does a circuit breaker solve that a simple timeout does not solve alone?
    ru: Какую проблему решает circuit breaker, которую один простой timeout не решает?
  - id: parallel-vs-sequential
    en: When should calls to downstream services be parallel, and when must they stay sequential?
    ru: Когда вызовы downstream-сервисов стоит делать параллельными, а когда они должны оставаться последовательными?
  - id: critical-vs-optional
    en: How do you decide whether an unavailable service should fail the whole request or only degrade the response?
    ru: Как решить, должен ли недоступный сервис провалить весь запрос или только деградировать ответ?
