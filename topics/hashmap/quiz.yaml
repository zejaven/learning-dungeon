# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: first-put
    title:
      en: Store your first entry
      ru: Сохрани первую запись
    goal:
      en: Run the code and put at least one entry into the map.
      ru: Запусти код и положи в мапу хотя бы одну запись.
    event: HASHMAP_PUT
  - id: collision
    title:
      en: Create a collision
      ru: Создай коллизию
    goal:
      en: Make two keys land in the same bucket (try keys "Aa" and "BB").
      ru: Сделай так, чтобы два ключа попали в один бакет (попробуй "Aa" и "BB").
    event: HASHMAP_COLLISION
  - id: resize
    title:
      en: Trigger a resize
      ru: Вызови resize
    goal:
      en: Insert more than 12 entries so the map doubles its capacity.
      ru: Вставь больше 12 записей, чтобы мапа удвоила ёмкость.
    event: HASHMAP_RESIZE

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: bucket-index
    en: How does HashMap turn a key into a bucket index?
    ru: Как HashMap превращает ключ в индекс бакета?
  - id: collision-java8
    en: What happens on a collision, and what changed in Java 8?
    ru: Что происходит при коллизии и что изменилось в Java 8?
  - id: mutable-key
    en: Why is a mutable key a bad idea?
    ru: Почему изменяемый ключ — плохая идея?
  - id: resize
    en: When and how does a HashMap resize?
    ru: Когда и как HashMap выполняет resize?
  - id: thread-safety
    en: Why is HashMap not thread-safe, and what would you use instead?
    ru: Почему HashMap не потокобезопасен и что использовать вместо него?
