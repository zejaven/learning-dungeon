id: ssl-tls-certificate
title:
  en: 'SSL/TLS Certificates and How HTTPS Encrypts'
  ru: 'SSL/TLS-сертификаты и шифрование в HTTPS'
category:
  en: Security & Authentication
  ru: Безопасность и аутентификация
type: HTTP
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: security
difficulty: 2
catalogId: security-6
summary:
  en: >
    A certificate is not a key and not a cipher: it is a public, signed statement
    that a given public key belongs to a given hostname, and its whole worth is
    the signature at the bottom - a chain of them, ending at a root CA that was
    already installed on your machine. Before sending a byte, a client checks
    five things: the chain reaches a trusted root, the name matches the address
    bar, the dates are current, the certificate is not revoked, and the other
    side can sign with the matching private key - which is why copying a
    certificate gets an attacker nothing. HTTPS is then hybrid: asymmetric
    cryptography authenticates the server and agrees on a key (ephemeral
    Diffie-Hellman in TLS 1.3), and a symmetric AEAD cipher such as AES-256-GCM
    carries every record, giving confidentiality and integrity in one operation.
    The traps are believing the certificate encrypts the traffic, thinking a
    self-signed certificate is 'the same encryption', forgetting that anyone who
    can add a root CA can read everything, and missing that forward secrecy is
    what keeps a recording unreadable after the server's key leaks.
  ru: >
    Сертификат — это не ключ и не шифр: это публичное подписанное утверждение,
    что данный публичный ключ принадлежит данному имени хоста, и вся его
    ценность в подписи внизу — точнее, в цепочке подписей, заканчивающейся на
    корневом CA, который уже был установлен на вашей машине. Прежде чем отправить
    хоть байт, клиент проверяет пять вещей: цепочка ведёт к доверенному корню,
    имя совпадает с адресной строкой, даты актуальны, сертификат не отозван и
    другая сторона умеет подписывать парным приватным ключом — поэтому копия
    сертификата не даёт злоумышленнику ничего. Дальше HTTPS гибриден:
    асимметричная криптография аутентифицирует сервер и договаривается о ключе
    (эфемерный Диффи-Хеллман в TLS 1.3), а симметричный AEAD-шифр вроде
    AES-256-GCM везёт каждую запись, давая конфиденциальность и целостность одной
    операцией. Ловушки: считать, что трафик шифрует сам сертификат; думать, что
    самоподписанный сертификат даёт «то же шифрование»; забывать, что тот, кто
    может добавить корневой CA, читает всё; и упускать, что именно прямая
    секретность оставляет запись нечитаемой после утечки ключа сервера.

