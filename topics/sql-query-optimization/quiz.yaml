# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: general-approach
    en: A query is slow in production. What is your step-by-step approach to making it faster?
    ru: Запрос тормозит в проде. Каков ваш пошаговый подход к его ускорению?
  - id: explain-plan-first
    en: Why read the EXPLAIN plan before changing anything, and what do you look for in it?
    ru: Зачем читать план EXPLAIN до любых изменений и что в нём искать?
  - id: indexes-and-sargable
    en: Which columns are worth indexing, and what makes a predicate "sargable"?
    ru: Какие колонки стоит индексировать и что делает предикат «sargable»?
  - id: index-tradeoffs
    en: What are the downsides of adding indexes, and why not index every column?
    ru: В чём минусы добавления индексов и почему не стоит индексировать каждую колонку?
  - id: select-star
    en: Why can SELECT * hurt performance compared to selecting specific columns?
    ru: Почему SELECT * может вредить производительности по сравнению с выбором конкретных колонок?
  - id: subquery-vs-join
    en: When would you rewrite a correlated subquery as a JOIN, and why?
    ru: Когда вы перепишете коррелированный подзапрос в JOIN и почему?
  - id: round-trips-n-plus-1
    en: What is the N+1 problem, and how do prepared statements and batching help?
    ru: Что такое проблема N+1 и чем помогают prepared statements и пакетная обработка?
