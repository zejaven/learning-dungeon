# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: define-process-thread
    en: Define a process and a thread, and state the relationship between them.
    ru: Дайте определение процесса и потока и назовите связь между ними.
  - id: memory-sharing
    en: What memory do threads of one process share, and what does each thread keep private?
    ru: Какую память разделяют потоки одного процесса, а что каждый поток держит приватно?
  - id: isolation-failure
    en: Why can one bad thread crash a whole process, while one crashing process does not affect others?
    ru: Почему один плохой поток может обрушить весь процесс, а падение одного процесса не влияет на другие?
  - id: creation-switch-cost
    en: Why is creating and switching threads cheaper than creating and switching processes?
    ru: Почему создание и переключение потоков дешевле, чем создание и переключение процессов?
  - id: communication
    en: How do threads communicate versus how processes communicate?
    ru: Как общаются потоки и как общаются процессы?
  - id: threads-risky
    en: Why is sharing memory between threads both an advantage and a risk?
    ru: Почему разделение памяти между потоками — это одновременно и преимущество, и риск?
