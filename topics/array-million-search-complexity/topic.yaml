summary:
  en: >
    "What is the search complexity for an array of 1,000,000 values?" The trap is
    that the concrete length never changes the Big-O class: searching an unsorted
    array by value is O(n) whether n is 10 or 1,000,000. The number just lets you
    translate the class into real work — about a million comparisons for a linear
    scan, about 20 for binary search on a sorted array, about 1 for a hash lookup.
    This topic explains why the answer is a growth class, not a fixed count.
  ru: >
    «Чему равна сложность поиска в массиве из 1 000 000 значений?» Ловушка в том,
    что конкретная длина не меняет класс Big-O: поиск по значению в
    неотсортированном массиве — это O(n), будь n равно 10 или 1 000 000. Число лишь
    позволяет перевести класс в реальную работу — около миллиона сравнений для
    линейного перебора, около 20 для бинарного поиска по отсортированному массиву и
    около 1 для хеш-поиска. Тема объясняет, почему ответ — это класс роста, а не
    фиксированное число.

