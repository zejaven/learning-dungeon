bossFight:
  # I. Fundamentals and Strategic Impact
  - id: cm-source-of-truth
    en: 'Why is Configuration Management (CM) described as the network''s "source of truth," and what happens to a network when this practice is ignored?'
    ru: 'Почему Configuration Management (CM) называют «источником истины» сети и что происходит с сетью, когда этой практикой пренебрегают?'
  - id: cm-strategic-impacts
    en: 'How does robust CM contribute to strategic business impacts such as enhanced security compliance and maximized network availability?'
    ru: 'Как надёжный CM способствует стратегическим бизнес-эффектам, таким как усиленный комплаенс безопасности и максимальная доступность сети?'
  - id: cm-vs-change-management
    en: 'Explain the fundamental difference between Configuration Management (the "what") and Change Management (the "how" and "why").'
    ru: 'Объясните фундаментальное различие между Configuration Management («что») и Change Management («как» и «почему»).'
  - id: cmdb-role
    en: 'Discuss the role of the Configuration Management Database (CMDB) in accounting for IT assets and their complex relationships.'
    ru: 'Обсудите роль Configuration Management Database (CMDB) в учёте IT-активов и их сложных взаимосвязей.'
  - id: cm-tmn-hierarchy
    en: 'How does CM operate across the different layers of the TMN Hierarchy, from individual element settings to strategic business forecasting?'
    ru: 'Как CM действует на разных уровнях иерархии TMN — от настроек отдельных элементов до стратегического бизнес-прогнозирования?'
  # II. Baselines, Drift, and Remediation
  - id: baseline-golden-standard
    en: 'What is a baseline configuration, and why is it considered the "Golden Standard" for every device deployment?'
    ru: 'Что такое базовая конфигурация (baseline) и почему её считают «золотым стандартом» для развёртывания каждого устройства?'
  - id: configuration-drift-risks
    en: 'Define Configuration Drift and explain the specific security and operational risks it introduces over time.'
    ru: 'Дайте определение Configuration Drift и объясните конкретные риски безопасности и эксплуатации, которые он вносит со временем.'
  - id: automated-remediation-lifecycle
    en: 'How does an automated remediation lifecycle use daily auditing and rollback scripts to combat unauthorized changes?'
    ru: 'Как автоматизированный цикл ремедиации использует ежедневный аудит и скрипты отката для борьбы с несанкционированными изменениями?'
  - id: global-drift-concurrency
    en: 'In a massive global network, what are the primary challenges of managing drift and concurrency across tens of thousands of heterogeneous devices?'
    ru: 'Каковы главные вызовы управления дрейфом и конкурентностью в огромной глобальной сети из десятков тысяч гетерогенных устройств?'
  # III. Patch and Software Lifecycle Management
  - id: structured-patch-framework
    en: 'Why is a structured patch management framework (Inventory, Testing, Scheduling, Deployment) necessary to ensure service continuity during updates?'
    ru: 'Почему структурированный каркас управления патчами (инвентаризация, тестирование, планирование, развёртывание) необходим для непрерывности сервиса во время обновлений?'
  - id: testing-phase-importance
    en: 'Discuss the importance of the "Testing" phase in a deployment pipeline and why updates must be validated in an isolated lab first.'
    ru: 'Обсудите важность фазы «тестирования» в конвейере развёртывания и почему обновления сначала должны проверяться в изолированной лаборатории.'
  - id: testing-priority-by-element
    en: 'How should technical teams prioritise testing based on the impact of different network elements, such as Core vs. LAN access devices?'
    ru: 'Как техническим командам приоритизировать тестирование по влиянию разных сетевых элементов, например устройств Core против LAN access?'
  - id: firmware-kernel-panic
    en: 'Describe the scenario of a firmware kernel panic and how pre-planned rollback mechanisms enable rapid business recovery.'
    ru: 'Опишите сценарий kernel panic прошивки и как заранее подготовленные механизмы отката обеспечивают быстрое восстановление бизнеса.'
  # IV. Documentation and Mapping
  - id: physical-vs-logical-diagrams
    en: 'Contrast the operational use cases for Physical Network Diagrams (rack positions, cable types) versus Logical Network Diagrams (IP schemes, VLAN IDs).'
    ru: 'Сопоставьте операционные сценарии использования физических схем сети (позиции в стойках, типы кабелей) и логических схем (схемы IP, идентификаторы VLAN).'
  - id: living-network-diagrams
    en: 'Why is manual diagramming considered impossible in modern, rapidly evolving networks, and how do "Living" Network Diagrams solve this?'
    ru: 'Почему ручное построение схем считается невозможным в современных, быстро меняющихся сетях и как это решают «живые» схемы сети (Living Network Diagrams)?'
  - id: dynamic-maps-best-practices
    en: 'What are the best practices for maintaining dynamic maps, and why must they be synced with a verified Source of Truth (SoT)?'
    ru: 'Каковы лучшие практики поддержания динамических карт и почему они должны синхронизироваться с проверенным Source of Truth (SoT)?'
  - id: documentation-bridges-gap
    en: 'How does high-quality documentation bridge the gap between conceptual architecture and actual day-to-day operations?'
    ru: 'Как качественная документация соединяет концептуальную архитектуру с реальной повседневной эксплуатацией?'
  # V. Protocols, Tools, and Metrics
  - id: cli-snmp-vs-netconf
    en: 'Compare the limitations of the Command-Line Interface (CLI) and SNMP with the advantages of Netconf for large-scale configuration management.'
    ru: 'Сравните ограничения Command-Line Interface (CLI) и SNMP с преимуществами Netconf для масштабного управления конфигурациями.'
  - id: netconf-atomic-transactions
    en: 'Why are "atomic transactions" (all-or-nothing changes) in Netconf critical for maintaining a consistent network state during complex updates?'
    ru: 'Почему «атомарные транзакции» (изменения «всё или ничего») в Netconf критичны для сохранения согласованного состояния сети при сложных обновлениях?'
  - id: cm-effectiveness-metrics
    en: 'Which operational metrics, such as provisioning throughput or time to synchronise, are most indicative of a highly effective CM system?'
    ru: 'Какие операционные метрики, например пропускная способность provisioning или время синхронизации, лучше всего указывают на высокоэффективную систему CM?'
