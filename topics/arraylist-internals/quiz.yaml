# Missions complete when a run emits the matching trace event.
missions:
  - id: append-free-slot
    title:
      en: Append into the next slot
      ru: Добавь в следующую ячейку
    goal:
      en: Run an example where add(value) writes into a free backing-array slot.
      ru: Запусти пример, где add(value) записывает значение в свободную ячейку внутреннего массива.
    event: ARRAYLIST_ADD
  - id: grow-and-copy
    title:
      en: Trigger grow-and-copy
      ru: Вызови рост и копирование
    goal:
      en: Add enough values to fill the backing array and make ArrayList allocate a larger one.
      ru: Добавь достаточно значений, чтобы заполнить внутренний массив и заставить ArrayList выделить массив большего размера.
    event: ARRAYLIST_GROW
  - id: direct-index-read
    title:
      en: Read by index
      ru: Прочитай по индексу
    goal:
      en: Call get(i) and observe direct O(1) access to the array slot.
      ru: Вызови get(i) и посмотри прямой O(1) доступ к ячейке массива.
    event: ARRAYLIST_GET
  - id: insert-shifts
    title:
      en: Shift on insert
      ru: Сдвинь при вставке
    goal:
      en: Insert with add(index, value) and watch following elements shift right.
      ru: Вставь через add(index, value) и посмотри, как следующие элементы сдвигаются вправо.
    event: ARRAYLIST_INSERT
  - id: remove-shifts
    title:
      en: Shift on remove
      ru: Сдвинь при удалении
    goal:
      en: Remove from the middle and watch the tail shift left and the old last slot become empty.
      ru: Удали элемент из середины и посмотри, как хвост сдвигается влево, а старая последняя ячейка становится пустой.
    event: ARRAYLIST_REMOVE

bossFight:
  - id: backing-array
    en: What fields does ArrayList use internally, and how are size and capacity different?
    ru: Какие поля ArrayList использует внутри, и чем size отличается от capacity?
  - id: append-with-capacity
    en: What happens during add(value) when the backing array still has free capacity?
    ru: Что происходит во время add(value), когда во внутреннем массиве ещё есть свободная ёмкость?
  - id: resize-path
    en: What happens during add(value) when the backing array is full?
    ru: Что происходит во время add(value), когда внутренний массив заполнен?
  - id: amortized-o-one
    en: Why is adding to the end of an ArrayList called amortized O(1), not always O(1)?
    ru: Почему добавление в конец ArrayList называют амортизированным O(1), а не всегда O(1)?
  - id: insert-remove-cost
    en: Why are insertions and removals in the middle of an ArrayList O(n)?
    ru: Почему вставка и удаление в середине ArrayList стоят O(n)?
  - id: design-reason
    en: Why was ArrayList implemented as a growing array instead of a linked chain?
    ru: Зачем ArrayList реализован как растущий массив, а не как цепочка узлов?
