bossFight:
  - id: mobile-app-types
    en: 'What types of mobile applications do you know? How do native, web, and hybrid apps differ, and how does the type affect the testing strategy?'
    ru: 'Какие виды мобильных приложений вы знаете? Чем отличаются нативные, веб и гибридные приложения и как тип влияет на стратегию тестирования?'
  - id: emulator-vs-simulator
    en: 'What is the difference between an emulator and a simulator? How do both differ from a real device?'
    ru: 'В чём различия эмулятора и симулятора? Чем они оба отличаются от реального девайса?'
  - id: choosing-test-devices
    en: 'What do you prefer to use in your work: real devices, emulators, or simulators? By what principle would you choose the devices to test on?'
    ru: 'Что вы предпочтёте использовать в работе: живые девайсы, эмуляторы или симуляторы? По какому принципу вы выберете устройства для тестирования?'
  - id: mobile-specific-bugs
    en: 'Describe the specifics of mobile testing: what kinds of bugs can occur only in mobile testing and never on desktop?'
    ru: 'Опишите особенности мобильного тестирования: какие виды ошибок могут встретиться только в мобильном тестировании и не встречаются на десктопе?'
  - id: interrupt-testing
    en: 'What is interrupt testing? Give examples of interruption scenarios you would check in a mobile app.'
    ru: 'Что такое тестирование на прерывания? Приведите примеры сценариев прерывания, которые вы бы проверили в мобильном приложении.'
  - id: network-switching
    en: 'How would you test app behavior when the network changes — switching from Wi-Fi to mobile data or losing connectivity mid-request?'
    ru: 'Как бы вы тестировали поведение приложения при смене сети — переключении с Wi-Fi на мобильный интернет или пропадании соединения посреди запроса?'
  - id: installing-test-builds
    en: 'How do you install a test build on Android and on iOS? What tools and services would you use?'
    ru: 'Как установить тестовую сборку на Android и на iOS? Какие инструменты и сервисы вы бы использовали?'
  - id: ios-vs-android
    en: 'What are the key differences between iOS and Android from a tester''s point of view? Which platform is harder to test and why?'
    ru: 'Каковы ключевые различия между iOS и Android с точки зрения тестировщика? Какую платформу сложнее тестировать и почему?'
