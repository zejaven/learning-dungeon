bossFight:
  - id: severity-vs-priority-difference
    en: 'What is the difference between severity and priority of a defect? Who sets each of them?'
    ru: 'В чём разница между критичностью (severity) и приоритетом (priority) дефекта? Кто выставляет каждый из них?'
  - id: severity-tester-questions
    en: 'What questions should a tester ask themselves before assigning a severity to a bug?'
    ru: 'На какие вопросы тестировщик должен ответить себе, прежде чем выставить критичность бага?'
  - id: severity-scale
    en: 'Name the classic severity levels from Blocker to Minor and give an example for each.'
    ru: 'Назовите классические уровни критичности от Blocker до Minor и приведите пример для каждого.'
  - id: blocker-vs-critical
    en: 'How do Blocker and Critical severities differ? Why does the presence of a workaround matter here?'
    ru: 'Чем отличаются критичности Blocker и Critical? Почему здесь важно наличие обходного пути?'
  - id: priority-management-tool
    en: 'Why is priority called a management tool? What questions does management answer before setting it?'
    ru: 'Почему приоритет называют инструментом менеджмента? На какие вопросы отвечает менеджмент перед его выставлением?'
  - id: high-severity-low-priority
    en: 'Give an example of a bug with high severity but low priority and explain the reasoning.'
    ru: 'Приведите пример бага с высокой критичностью, но низким приоритетом, и объясните логику.'
  - id: low-severity-high-priority
    en: 'Give an example of a bug with low severity but high priority. Why should it be fixed immediately?'
    ru: 'Приведите пример бага с низкой критичностью, но высоким приоритетом. Почему его надо чинить немедленно?'
  - id: disagree-with-priority
    en: 'What would you do as a tester if you disagree with the priority a manager assigned to your bug?'
    ru: 'Что вы будете делать как тестировщик, если не согласны с приоритетом, который менеджер поставил вашему багу?'
