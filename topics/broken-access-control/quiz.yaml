# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: read-someone-elses-order
    title:
      en: Read somebody else's order
      ru: Прочитай чужой заказ
    goal:
      en: On an API without ownership checks, fetch an order that belongs to another user just by its id.
      ru: На API без проверки владельца получи заказ другого пользователя, зная только его id.
    event: OWNERSHIP_CHECK_MISSING
  - id: get-refused-as-not-owner
    title:
      en: Get refused as not the owner
      ru: Получи отказ как не-владелец
    goal:
      en: Enforce an ownership check and request the same foreign order again.
      ru: Включи проверку владельца и снова запроси тот же чужой заказ.
    event: OWNERSHIP_DENIED
  - id: leak-a-list
    title:
      en: Leak rows through a list
      ru: Получи чужие строки через список
    goal:
      en: Call the list endpoint with an ownerId of another user, or with no filter, on an API that trusts the parameter.
      ru: Вызови эндпоинт списка с ownerId другого пользователя или вообще без фильтра на API, которое доверяет параметру.
    event: LIST_LEAKED
  - id: scope-a-list
    title:
      en: Scope the list to the caller
      ru: Ограничь список вызывающим
    goal:
      en: Enforce scoped lists and see the owner come from the session instead of the query.
      ru: Включи ограничение списков и увидь, как владелец берётся из сессии, а не из запроса.
    event: LIST_SCOPED
  - id: reach-admin-as-user
    title:
      en: Reach /admin as a plain user
      ru: Попади в /admin обычным пользователем
    goal:
      en: Call the admin export as a USER on an API whose only protection is a hidden button.
      ru: Вызови админскую выгрузку под ролью USER на API, которое защищено лишь скрытой кнопкой.
    event: ROLE_CHECK_MISSING
  - id: get-a-403-on-admin
    title:
      en: 'Earn a 403 on /admin'
      ru: 'Заработай 403 на /admin'
    goal:
      en: Enforce the server-side role check and call the admin export as a USER again.
      ru: Включи серверную проверку роли и снова вызови админскую выгрузку под ролью USER.
    event: ROLE_DENIED
  - id: promote-yourself
    title:
      en: Promote yourself to ADMIN
      ru: Сделай себя администратором
    goal:
      en: Send a role field in the profile update to an API that binds the body straight onto the entity.
      ru: Отправь поле role в обновлении профиля на API, которое привязывает тело прямо к сущности.
    event: PRIVILEGE_ESCALATED
  - id: set-a-server-field
    title:
      en: Set a field only the server may set
      ru: Выставь поле, которое решает только сервер
    goal:
      en: Update your own order with a price or status in the body, with no field allowlist.
      ru: Обнови свой заказ, передав price или status в теле, без списка разрешённых полей.
    event: MASS_ASSIGNMENT
  - id: redirect-a-write
    title:
      en: Redirect a write past the check
      ru: Перенаправь запись мимо проверки
    goal:
      en: Update your own order by path while the body carries the id of somebody else's order.
      ru: Обнови свой заказ по пути, передав в теле id чужого заказа.
    event: BODY_ID_OVERRIDE
  - id: drop-a-field
    title:
      en: Let the DTO drop a field
      ru: Пусть DTO отбросит поле
    goal:
      en: Enforce the field allowlist and send a server-owned field again.
      ru: Включи список разрешённых полей и снова отправь серверное поле.
    event: FIELD_IGNORED

bossFight:
  - id: authn-vs-authz-layers
    en: 'Every endpoint in your API requires a valid JWT. A pentester still reports Broken Access Control. What three server-side questions does authentication not answer, and which attack class is each one?'
    ru: 'Каждый эндпоинт вашего API требует валидный JWT. Пентестер всё равно сообщает о Broken Access Control. На какие три вопроса на сервере аутентификация не отвечает и какой класс атак соответствует каждому?'
  - id: fix-idor-in-spring
    en: 'GET /orders/{id} calls orderRepository.findById(id). How do you fix the IDOR so it cannot regress when a new handler is added, and what status do you return for an order that belongs to someone else?'
    ru: 'GET /orders/{id} вызывает orderRepository.findById(id). Как исправить IDOR так, чтобы он не вернулся при добавлении нового обработчика, и какой статус вернуть для заказа, принадлежащего другому пользователю?'
  - id: uuid-vs-idor
    en: 'A colleague proposes switching all ids from sequential numbers to UUIDs to fix IDOR. What does that actually change, and why is it not a fix?'
    ru: 'Коллега предлагает исправить IDOR, заменив все последовательные id на UUID. Что это на самом деле меняет и почему это не исправление?'
  - id: mass-assignment-defense
    en: 'Explain mass assignment with a Spring example. How can it lead to vertical escalation, and how do you prevent it?'
    ru: 'Объясните mass assignment на примере Spring. Как он может привести к вертикальному повышению привилегий и как его предотвратить?'
  - id: lists-and-writes
    en: 'The order detail endpoint checks ownership. Where else in the same API do ownership bugs usually hide, and how do you test for them?'
    ru: 'Эндпоинт деталей заказа проверяет владельца. Где ещё в том же API обычно прячутся ошибки проверки владельца и как их тестировать?'
  - id: vertical-escalation-ui
    en: 'The admin panel is visible only to admins in the frontend. Is that access control? What must the backend do, and where do you put the check in Spring?'
    ru: 'Админ-панель во фронтенде видна только администраторам. Это контроль доступа? Что должен делать бэкенд и где в Spring разместить проверку?'
