# Theory topic: no missions (there is no practice editor) - only a Boss Fight.
bossFight:
  - id: reading-order
    en: How do you read the indentation and execution order of a PostgreSQL EXPLAIN plan?
    ru: Как читать отступы и порядок выполнения в плане PostgreSQL EXPLAIN?
  - id: seq-scan-vs-index-scan
    en: What does Seq Scan mean, what does Index Scan mean, and when can each be the right choice?
    ru: Что означает Seq Scan, что означает Index Scan и когда каждый из них может быть правильным выбором?
  - id: cost-fields
    en: What do startup cost, total cost, rows and width mean in a PostgreSQL plan?
    ru: Что означают startup cost, total cost, rows и width в плане PostgreSQL?
  - id: actual-vs-estimated
    en: Why is a large gap between estimated rows and actual rows a red flag?
    ru: Почему большой разрыв между оценочным и фактическим числом строк является тревожным признаком?
  - id: join-nodes
    en: How do you interpret Nested Loop, Hash Join and Merge Join nodes?
    ru: Как интерпретировать узлы Nested Loop, Hash Join и Merge Join?
  - id: explain-analyze-safety
    en: What is the difference between EXPLAIN and EXPLAIN ANALYZE, and what safety issue matters for writes?
    ru: В чём разница между EXPLAIN и EXPLAIN ANALYZE и какая проблема безопасности важна для операций записи?
  - id: plan-red-flags
    en: Name the main red flags you look for in a PostgreSQL EXPLAIN ANALYZE plan.
    ru: Назовите основные тревожные признаки, которые вы ищете в плане PostgreSQL EXPLAIN ANALYZE.
  - id: fixing-plan
    en: After finding a bad plan node, how do you decide whether to add an index, refresh statistics or rewrite SQL?
    ru: После обнаружения плохого узла плана как решить, добавить индекс, обновить статистику или переписать SQL?
