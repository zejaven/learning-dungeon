summary:
  en: >
    Reading an array element by its index is O(1): the address is computed
    directly from base + index * elementSize. Finding an element by its value is
    O(n): with no extra structure you must scan the elements one by one. A sorted
    array lets you binary-search by value in O(log n). This topic explains why the
    two operations differ so much and when each cost applies.
  ru: >
    Чтение элемента массива по индексу — это O(1): адрес вычисляется напрямую как
    base + index * elementSize. Поиск элемента по значению — это O(n): без
    дополнительной структуры приходится перебирать элементы один за другим.
    В отсортированном массиве по значению можно искать бинарным поиском за
    O(log n). Тема объясняет, почему две операции так различаются и когда какая
    стоимость применима.

