# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: ways-overview
    en: 'What are the ways to build an application? Give the axes you would compare them on.'
    ru: 'Какие есть способы сборки приложения? Назовите оси, по которым вы бы их сравнивали.'
  - id: maven-vs-gradle
    en: 'How do Maven and Gradle differ in their build model, and when would you pick each?'
    ru: 'Чем Maven и Gradle различаются по модели сборки и когда вы выберете каждый из них?'
  - id: maven-lifecycle
    en: 'What happens when you run `mvn package`, and how is that different from `install` and `deploy`?'
    ru: 'Что происходит при запуске `mvn package` и чем это отличается от `install` и `deploy`?'
  - id: thin-vs-fat-jar
    en: 'What is the difference between a thin jar and a fat jar, and which one would you build for a service?'
    ru: 'Чем тонкий jar отличается от fat jar и какой из них вы соберёте для сервиса?'
  - id: artifact-choice
    en: 'A war, a fat jar, a container image and a GraalVM native binary — when is each the right output?'
    ru: 'War, fat jar, образ контейнера и нативный бинарник GraalVM — когда уместен каждый вариант?'
  - id: ide-vs-build-tool
    en: 'The code compiles in the IDE but the CI build fails. What kinds of difference cause that?'
    ru: 'В IDE код компилируется, а сборка в CI падает. Из-за каких различий это бывает?'
  - id: where-build-runs
    en: 'Why should the artifact that reaches production come from CI rather than from a developer machine?'
    ru: 'Почему артефакт, попадающий в production, должен приходить из CI, а не с машины разработчика?'
  - id: build-once-promote
    en: 'What does "build once, promote many" mean, and what breaks if you rebuild per environment?'
    ru: 'Что значит «собрать один раз и продвигать дальше» и что ломается, если пересобирать под каждое окружение?'
  - id: reproducible-build
    en: 'What can make two builds of the same commit produce different bytes, and how do you prevent it?'
    ru: 'Из-за чего две сборки одного и того же коммита могут дать разные байты и как этого избежать?'
  - id: slow-build-diagnosis
    en: 'A multi-module build takes 25 minutes on CI. How would you find and cut the time?'
    ru: 'Многомодульная сборка занимает 25 минут на CI. Как вы будете искать и сокращать это время?'
  - id: dependency-management
    en: 'Why proxy dependencies through an internal repository, and what do you pin to keep builds stable?'
    ru: 'Зачем проксировать зависимости через внутренний репозиторий и что фиксируют, чтобы сборки были стабильными?'
  - id: build-supply-chain
    en: 'How would you protect the build itself — dependencies, agents, and the artifacts it produces?'
    ru: 'Как бы вы защитили саму сборку — зависимости, агенты и производимые артефакты?'
