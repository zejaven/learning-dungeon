summary:
  en: >
    final means 'assign exactly once': after the first assignment the binding —
    the link from a name to its value — is locked, and any further assignment is
    a compile error. It can appear in several contexts: a final local variable, a
    static final constant, a blank final field assigned once in the constructor, a
    final method parameter, a final method (cannot be overridden), and a final
    class (cannot be subclassed). The key trap is that on a reference, final locks
    the binding, not the object: the handle cannot move, but a mutable object
    behind it can still change.
  ru: >
    final значит «присвоить ровно один раз»: после первого присваивания связь —
    привязка имени к значению — блокируется, и любое следующее присваивание это
    ошибка компиляции. Оно встречается в нескольких контекстах: final-локальная
    переменная, константа static final, пустое final-поле, присваиваемое один раз
    в конструкторе, final-параметр метода, final-метод (нельзя переопределить) и
    final-класс (нельзя наследовать). Главная ловушка: для ссылки final блокирует
    связь, а не объект — указатель не сдвинуть, но изменяемый объект за ним всё ещё
    можно менять.

# This topic renders its own binding layout, so it composes no shared primitive.
primitives: []

defaultExample: final-local

examples:
  - id: final-local
    title:
      en: A final local variable
      ru: final-локальная переменная
    file: 01-final-local.java
    explanation:
      en: >
        final int x = 10 assigns the value once and locks the binding. Trying to
        reassign x is a compile error, so the value stays 10.
      ru: >
        final int x = 10 присваивает значение один раз и блокирует связь. Попытка
        переприсвоить x — ошибка компиляции, поэтому значение остаётся 10.
  - id: blank-final-field
    title:
      en: A blank final field
      ru: Пустое final-поле
    file: 02-blank-final-field.java
    explanation:
      en: >
        A blank final field is declared without a value and stays unlocked until
        the constructor assigns it exactly once. A second assignment does not
        compile.
      ru: >
        Пустое final-поле объявляется без значения и остаётся незаблокированным,
        пока конструктор не присвоит его ровно один раз. Второе присваивание не
        компилируется.
  - id: final-reference
    title:
      en: final reference vs object
      ru: final-ссылка против объекта
    file: 03-final-reference.java
    explanation:
      en: >
        final on a reference locks the handle, not the object. list.add("b")
        mutates the object and is allowed; re-pointing list to a new list is a
        compile error.
      ru: >
        final у ссылки блокирует указатель, а не объект. list.add("b") изменяет
        объект и разрешён; переназначить list на новый список — ошибка компиляции.
  - id: static-constant
    title:
      en: A static final constant
      ru: Константа static final
    file: 04-static-constant.java
    explanation:
      en: >
        static final makes a class-level constant: one shared value for the whole
        class, fixed once, named in UPPER_SNAKE_CASE by convention.
      ru: >
        static final создаёт константу уровня класса: одно общее значение на весь
        класс, заданное один раз, по соглашению в UPPER_SNAKE_CASE.
  - id: final-parameter
    title:
      en: A final parameter
      ru: final-параметр
    file: 05-final-parameter.java
    explanation:
      en: >
        A final method parameter cannot be reassigned in the body. The method
        still receives the argument value; only re-binding the name is forbidden.
      ru: >
        final-параметр метода нельзя переприсвоить в теле. Метод всё равно
        получает значение аргумента; запрещено лишь переназначение имени.
  - id: final-method-class
    title:
      en: final method and final class
      ru: final-метод и final-класс
    file: 06-final-method-class.java
    explanation:
      en: >
        A final method cannot be overridden by a subclass; a final class cannot be
        subclassed at all. String is a famous final class.
      ru: >
        final-метод нельзя переопределить в подклассе; final-класс нельзя
        наследовать вообще. String — знаменитый final-класс.

assistantExample:
