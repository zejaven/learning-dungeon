summary:
  en: >
    A clustered index defines the physical order of the table rows: the data
    itself lives in the index leaves, so there is at most one per table. A
    non-clustered index is a separate sorted structure that points back to the
    rows, so a table can have many. Learn how each lookup works, why a
    non-clustered lookup often needs a second hop, and how engines like InnoDB
    and PostgreSQL differ.
  ru: >
    Кластерный индекс задаёт физический порядок строк таблицы: сами данные лежат
    в листьях индекса, поэтому он может быть только один на таблицу. Некластерный
    индекс - это отдельная отсортированная структура, которая ссылается на
    строки, поэтому их может быть много. Разбери, как работает каждый поиск,
    почему некластерному поиску часто нужен второй прыжок и чем отличаются движки
    вроде InnoDB и PostgreSQL.

