# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: sign-a-token
    title:
      en: Sign a token
      ru: Подпиши токен
    goal:
      en: Issue a JWT and look at the three dotted segments the client will carry on every request.
      ru: Выпусти JWT и посмотри на три сегмента через точку, которые клиент будет везти с каждым запросом.
    event: TOKEN_ISSUED
  - id: read-it-without-a-key
    title:
      en: Read it without a key
      ru: Прочитай его без ключа
    goal:
      en: Decode a JWT with no key and no server, and see every claim it carries.
      ru: Раскодируй JWT без ключа и без сервера и увидь все claims, которые он несёт.
    event: TOKEN_DECODED
  - id: verify-the-signature
    title:
      en: Verify a signature
      ru: Проверь подпись
    goal:
      en: Have a service recompute the signature over the bytes it received and accept the claims.
      ru: Пусть сервис пересчитает подпись по полученным байтам и примет claims.
    event: SIGNATURE_VERIFIED
  - id: be-served
    title:
      en: Be served
      ru: Добейся обслуживания
    goal:
      en: Present a valid credential and watch a service work out who is calling.
      ru: Предъяви корректные учётные данные и увидь, как сервис устанавливает, кто вызывает.
    event: ACCESS_GRANTED
  - id: break-the-signature
    title:
      en: Break the signature
      ru: Сломай подпись
    goal:
      en: Edit a claim in a signed token and present it, so the recomputed signature stops matching.
      ru: Измени claim в подписанном токене и предъяви его, чтобы пересчитанная подпись перестала совпадать.
    event: SIGNATURE_INVALID
  - id: refuse-alg-none
    title:
      en: 'Refuse ''alg: none'''
      ru: 'Отклони «alg: none»'
    goal:
      en: Present an unsigned token to a verifier that pins the algorithm itself.
      ru: Предъяви неподписанный токен проверяющему, который сам закрепляет алгоритм.
    event: ALG_NONE_REJECTED
  - id: land-the-forgery
    title:
      en: Land the forgery
      ru: Проведи подделку
    goal:
      en: Present the same unsigned token to a verifier that believes the token's own header.
      ru: Предъяви тот же неподписанный токен проверяющему, который верит заголовку самого токена.
    event: ALG_NONE_ACCEPTED
  - id: issue-a-session
    title:
      en: Hand out an opaque id
      ru: Выдай непрозрачный идентификатор
    goal:
      en: Issue a session id instead and note how much of it the client can understand.
      ru: Выдай вместо токена идентификатор сессии и заметь, сколько в нём клиент может понять.
    event: SESSION_ISSUED
  - id: find-nothing-inside
    title:
      en: Find nothing inside
      ru: Не найди внутри ничего
    goal:
      en: Try to decode an opaque session id and see what a thief would actually learn from it.
      ru: Попробуй раскодировать непрозрачный идентификатор сессии и посмотри, что из него на самом деле узнает вор.
    event: NOTHING_TO_READ
  - id: pay-for-a-lookup
    title:
      en: Pay for a lookup
      ru: Заплати обращением к хранилищу
    goal:
      en: Verify a session id and watch the request turn into a hit on the shared store.
      ru: Проверь идентификатор сессии и увидь, как запрос превращается в обращение к общему хранилищу.
    event: STORE_LOOKUP
  - id: refuse-a-dead-session
    title:
      en: Refuse a dead session
      ru: Отклони мёртвую сессию
    goal:
      en: Log out of a session system and make the very next request with the same id.
      ru: Выйди из системы с сессиями и сделай следующий же запрос с тем же идентификатором.
    event: ACCESS_DENIED
  - id: log-out
    title:
      en: Log out
      ru: Выйди из системы
    goal:
      en: End a login and watch what the server has to do about it in each scheme.
      ru: Заверши вход и посмотри, что при этом приходится делать серверу в каждой схеме.
    event: LOGGED_OUT
  - id: survive-a-logout
    title:
      en: Survive a logout
      ru: Переживи выход из системы
    goal:
      en: Log out of a stateless JWT system and use the very same token afterwards.
      ru: Выйди из системы с JWT без состояния и воспользуйся тем же самым токеном после этого.
    event: REVOKED_TOKEN_ACCEPTED
  - id: put-the-state-back
    title:
      en: Put the state back
      ru: Верни состояние
    goal:
      en: Turn on a deny-list, log out, and make the same token get refused.
      ru: Включи список отозванных, выйди из системы и добейся, чтобы тот же токен отклонили.
    event: DENYLIST_HIT
  - id: let-time-end-it
    title:
      en: Let time end it
      ru: Пусть его закончит время
    goal:
      en: Move the clock past 'exp' and present the token again, without touching anything on the server.
      ru: Переведи часы за «exp» и снова предъяви токен, ничего при этом не трогая на сервере.
    event: TOKEN_EXPIRED
  - id: change-the-truth
    title:
      en: Change the truth
      ru: Измени истину
    goal:
      en: Change a user's role in the database while a token they hold is still valid.
      ru: Измени роль пользователя в базе, пока выданный ему токен ещё действителен.
    event: ROLE_CHANGED
  - id: serve-a-stale-claim
    title:
      en: Serve a stale claim
      ru: Обслужи устаревший claim
    goal:
      en: Present a token minted before the role changed and watch the token win.
      ru: Предъяви токен, выпущенный до смены роли, и увидь, как побеждает токен.
    event: STALE_CLAIM_ACCEPTED
  - id: address-the-token
    title:
      en: Address the token
      ru: Адресуй токен
    goal:
      en: Replay a perfectly valid token at a service it was not issued for.
      ru: Переиграй совершенно корректный токен против сервиса, для которого он не выпускался.
    event: AUDIENCE_MISMATCH
  - id: count-the-trade
    title:
      en: Count the trade
      ru: Посчитай обмен
    goal:
      en: Finish a run with report() and read the lookups, the bytes and the breaches together.
      ru: Заверши прогон вызовом report() и прочитай вместе обращения к хранилищу, байты и нарушения.
    event: JWT_AUDIT

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: what-is-a-jwt
    en: What is a JWT? Describe what it is made of and what each part is for.
    ru: Что такое JWT? Опиши, из чего он состоит и для чего нужна каждая часть.
  - id: signed-not-encrypted
    en: Is a JWT encrypted? What can somebody who intercepts one read, and what can they not do with it?
    ru: JWT зашифрован? Что может прочитать перехвативший его и чего он с ним сделать не сможет?
  - id: what-verification-means
    en: What exactly does a server check before it trusts a single claim in a token? Name every check.
    ru: Что именно сервер проверяет, прежде чем поверить хоть одному claim в токене? Назови все проверки.
  - id: session-or-jwt
    en: When would you use a session token and when a JWT? Give me the decision rule you would actually apply.
    ru: Когда ты возьмёшь токен сессии, а когда JWT? Дай правило выбора, которым реально пользуешься.
  - id: client-server-choice
    en: For a browser app talking to your own backend, which would you pick and why?
    ru: Для браузерного приложения, которое общается с твоим же бэкендом, что ты выберешь и почему?
  - id: server-server-choice
    en: For service-to-service calls inside your system, which would you pick and what changes compared to the browser case?
    ru: Для вызовов между сервисами внутри твоей системы что ты выберешь и что меняется по сравнению с браузерным случаем?
  - id: revoking-a-jwt
    en: A user presses "log out", or you must cut off a compromised account right now. What happens to their JWT?
    ru: Пользователь нажимает «выйти», или нужно прямо сейчас отрезать скомпрометированный аккаунт. Что происходит с его JWT?
  - id: access-and-refresh
    en: Why is there both an access token and a refresh token? What lifetimes would you pick for each, and where would you keep them?
    ru: Зачем нужны и access-, и refresh-токен? Какие сроки жизни ты выберешь для каждого и где будешь их хранить?
  - id: stale-claims
    en: A token says role=admin and the database says the user was demoted a minute ago. Which one wins, and how would you design around that?
    ru: В токене написано role=admin, а в базе пользователь минуту назад понижен. Что победит и как ты это спроектируешь?
  - id: what-goes-in-the-payload
    en: What would you put in a JWT payload, and what must never go in it?
    ru: Что ты положишь в payload JWT и что туда не должно попасть никогда?
  - id: alg-none-and-confusion
    en: 'What is the "alg: none" attack, and what is algorithm confusion? How does a correct verifier prevent both?'
    ru: 'Что такое атака «alg: none» и что такое algorithm confusion? Как корректный проверяющий предотвращает и то, и другое?'
  - id: hs256-vs-rs256
    en: HS256 or RS256 for signing? What changes when several services have to verify the token?
    ru: HS256 или RS256 для подписи? Что меняется, когда токен должны проверять несколько сервисов?
  - id: aud-and-iss
    en: What are the 'iss' and 'aud' claims for? What goes wrong if a service ignores them?
    ru: Для чего нужны claims «iss» и «aud»? Что ломается, если сервис их игнорирует?
  - id: where-to-store-in-a-browser
    en: Where should a browser keep a JWT — an HttpOnly cookie or localStorage? What does each choice expose you to?
    ru: Где браузеру хранить JWT — в HttpOnly-куке или в localStorage? Чему подставляет каждый вариант?
  - id: jwt-does-not-stop-csrf
    en: Does switching from a session cookie to a JWT remove the need for CSRF protection? Explain exactly when it does and when it does not.
    ru: Убирает ли переход с cookie сессии на JWT необходимость защиты от CSRF? Объясни точно, когда убирает, а когда нет.
  - id: scaling-argument
    en: '"We need JWTs because sessions do not scale." How would you respond to that in a design review?'
    ru: '«Нам нужны JWT, потому что сессии не масштабируются». Как ты ответишь на это на design review?'
  - id: token-size
    en: What does putting more claims in a token cost you? At what point does it start to matter?
    ru: Чего вам стоит добавление новых claims в токен? С какого момента это начинает иметь значение?
  - id: gateway-and-services
    en: With an API gateway in front, who validates the token and what does each service behind it still have to check?
    ru: Если впереди стоит API-шлюз, кто проверяет токен и что каждый сервис за ним всё равно обязан проверять сам?
  - id: key-rotation
    en: How do you rotate a signing key without logging everybody out?
    ru: Как провести ротацию ключа подписи, не выкинув всех из системы?
  - id: migrating-schemes
    en: You have a session-based system and are asked to move to JWTs. How would you approach it, and what would you push back on?
    ru: У вас система на сессиях, и вас просят перейти на JWT. Как ты подойдёшь к задаче и с чем поспоришь?
