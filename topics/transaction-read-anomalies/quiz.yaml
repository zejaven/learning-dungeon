# Theory topic: no missions, only Boss Fight questions.
bossFight:
  - id: define-four-anomalies
    en: 'Define dirty read, non-repeatable read, phantom read, and lost update.'
    ru: 'Дайте определения dirty read, non-repeatable read, phantom read и lost update.'
  - id: dirty-read-rollback
    en: 'Why is dirty read dangerous when the other transaction later rolls back?'
    ru: 'Почему dirty read опасен, если другая транзакция потом делает rollback?'
  - id: non-repeatable-vs-phantom
    en: 'How is a non-repeatable read different from a phantom read?'
    ru: 'Чем non-repeatable read отличается от phantom read?'
  - id: lost-update-scenario
    en: 'Give a two-transaction example of lost update.'
    ru: 'Приведите пример lost update с двумя транзакциями.'
  - id: isolation-and-prevention
    en: 'Which database mechanisms can prevent these anomalies, and what tradeoffs do they introduce?'
    ru: 'Какие механизмы базы данных могут предотвращать эти аномалии и какие компромиссы они создают?'
  - id: postgres-interview-detail
    en: 'What is the PostgreSQL-specific trap around READ UNCOMMITTED and dirty reads?'
    ru: 'В чем PostgreSQL-ловушка вокруг READ UNCOMMITTED и dirty reads?'
