# Theory topic: explanation + Boss Fight only — no practice editor or missions.
mode: theory
aiProvider: claude
categoryId: rest
difficulty: 2
summary:
  en: >
    A classic interview task: design an API to add an employee, change their
    salary, change their passport data, and fetch them by id. The real subject is
    not CRUD but separation of concerns — salary and passport are changed by
    different departments, which pushes you toward separate commands (CQS),
    separate sub-resources and a DTO that is not the entity. Links out to a
    structural topic where you design the classes and a challenge where you
    implement the command logic.
  ru: >
    Классическая задача с собеседования: спроектировать API для добавления
    сотрудника, изменения его зарплаты и паспортных данных, получения по id.
    Настоящая тема здесь не CRUD, а разделение ответственности — зарплату и
    паспорт меняют разные отделы, что подталкивает к отдельным командам (CQS),
    отдельным под-ресурсам и DTO, который не равен сущности. Со ссылками на
    structural-тему, где вы проектируете классы, и challenge, где реализуете
    логику команд.

assistantExample:
  en: 'e.g. Why split salary and passport updates into separate endpoints instead of one PUT?'
  ru: 'например: Зачем разносить изменение зарплаты и паспорта на отдельные эндпоинты, а не один PUT?'

