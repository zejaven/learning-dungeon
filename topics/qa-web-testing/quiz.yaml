bossFight:
  # Browser engines
  - id: what-is-browser-engine
    en: 'What is a browser engine, and what exactly does it do with an HTML page?'
    ru: 'Что такое браузерный движок и что именно он делает с HTML-страницей?'
  - id: main-browser-engines
    en: 'List the main browser engines. Which engine powers Safari and Firefox, and why is it wrong to call them Chromium-based?'
    ru: 'Перечислите основные браузерные движки. На каком движке работают Safari и Firefox и почему неправильно называть их Chromium-based?'
  - id: chrome-vs-chromium
    en: 'Explain the difference between Chrome, Chromium, and Blink. Why does this distinction matter for cross-browser testing?'
    ru: 'Объясните разницу между Chrome, Chromium и Blink. Почему это различие важно для кросс-браузерного тестирования?'
  # DOM
  - id: what-is-dom
    en: 'What is the DOM, and how does it differ from the page source code shown by View Source?'
    ru: 'Что такое DOM и чем он отличается от исходного кода страницы, который показывает View Source?'
  - id: dom-in-testing
    en: 'How do you use the DOM in testing? Explain how locators (CSS selectors, XPath) are built on top of it.'
    ru: 'Как вы используете DOM при тестировании? Объясните, как поверх него строятся локаторы (CSS-селекторы, XPath).'
  # DevTools
  - id: devtools-panels
    en: 'What can DevTools do? Walk through the Elements, Console, Network, and Application panels and what you inspect in each as a tester.'
    ru: 'Какие есть возможности у DevTools? Расскажите о вкладках Elements, Console, Network и Application и что вы в них смотрите как тестировщик.'
  - id: network-front-vs-back
    en: 'A form shows an error after submit. How do you use the Network panel to decide whether the bug is on the front end or the back end?'
    ru: 'Форма после отправки показывает ошибку. Как с помощью вкладки Network понять, баг на фронтенде или на бэкенде?'
  - id: application-storage
    en: 'What is stored in the Application panel, and how do cookies, Local Storage, and Session Storage differ? When would a tester clear them?'
    ru: 'Что хранится во вкладке Application и чем отличаются cookies, Local Storage и Session Storage? Когда тестировщику нужно их очищать?'
