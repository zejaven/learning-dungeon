id: lambda-as-method-parameter
title:
  en: Lambda as a Method Parameter
  ru: Лямбда как параметр метода
category:
  en: Java Core / Lambdas and Streams
  ru: Java Core / Лямбды и Stream API
type: OTHER
mode: trace
aiProvider: codex
aiModel: gpt-5.5
summary:
  en: >
    How to write a Java method that accepts a lambda expression, why the
    parameter type must be a functional interface, when the lambda body runs,
    and how Runnable, Supplier, Consumer, and Function fit common callback cases.
  ru: >
    Как написать Java-метод, который принимает lambda expression, почему тип
    параметра должен быть functional interface, когда выполняется тело lambda,
    и как Runnable, Supplier, Consumer и Function подходят для типичных callback-сценариев.
categoryId: streams
difficulty: 1
catalogId: streams-1
style: Real world
primitives:
  - ArrayGrid
  - EventLog
defaultExample: runnable-parameter
examples:
  - id: runnable-parameter
    title:
      en: Runnable parameter
      ru: Параметр Runnable
    file: 01-runnable-parameter.java
    explanation:
      en: A method accepts `Runnable`, so `doSomeLogic(() -> System.out.println("Hello"))` compiles.
      ru: Метод принимает `Runnable`, поэтому `doSomeLogic(() -> System.out.println("Hello"))` компилируется.
  - id: deferred-run
    title:
      en: Runs only when called
      ru: Запускается только при вызове
    file: 02-deferred-run.java
    explanation:
      en: Passing the lambda does not execute its body; the method decides when to call `run()`.
      ru: Передача lambda не выполняет ее тело; метод сам решает, когда вызвать `run()`.
  - id: captured-local
    title:
      en: Captured local
      ru: Захваченная локальная переменная
    file: 03-captured-local.java
    explanation:
      en: A lambda may read a surrounding local variable when it is final or effectively final.
      ru: Lambda может читать локальную переменную из внешнего метода, если она final или effectively final.
  - id: supplier-return
    title:
      en: Supplier returns a value
      ru: Supplier возвращает значение
    file: 04-supplier-return.java
    explanation:
      en: Use `Supplier<T>` when the callback has no input but returns a value.
      ru: Используйте `Supplier<T>`, когда callback не принимает входные данные, но возвращает значение.
  - id: consumer-argument
    title:
      en: Consumer receives data
      ru: Consumer получает данные
    file: 05-consumer-argument.java
    explanation:
      en: Use `Consumer<T>` when the method sends one value into the lambda and expects no result.
      ru: Используйте `Consumer<T>`, когда метод передает одно значение в lambda и не ждет результата.
  - id: function-transform
    title:
      en: Function transforms data
      ru: Function преобразует данные
    file: 06-function-transform.java
    explanation:
      en: Use `Function<T, R>` when the lambda accepts a value and returns another value.
      ru: Используйте `Function<T, R>`, когда lambda принимает значение и возвращает другое значение.
assistantExample:
  en: 'e.g. How do I write doSomeLogic(() -> System.out.println("Hello"))?'
  ru: 'например: Как написать doSomeLogic(() -> System.out.println("Hello"))?'
missionsFile: quiz.yaml
