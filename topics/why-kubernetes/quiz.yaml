# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: why-kubernetes-at-all
    en: 'You already package the app as a Docker image and run it on a VM. What does Kubernetes add?'
    ru: 'Вы уже собираете приложение в Docker-образ и запускаете его на виртуалке. Что добавляет Kubernetes?'
  - id: desired-state-reconciliation
    en: What does it mean that Kubernetes is declarative, and how does the reconciliation loop work?
    ru: Что значит, что Kubernetes декларативен, и как работает цикл согласования состояния?
  - id: pod-deployment-service
    en: Explain the relationship between a Pod, a Deployment and a Service.
    ru: Объясните связь между Pod, Deployment и Service.
  - id: liveness-vs-readiness
    en: What is the difference between a liveness probe and a readiness probe, and what breaks if you swap them?
    ru: Чем liveness-проба отличается от readiness-пробы и что сломается, если их перепутать?
  - id: rolling-update-zero-downtime
    en: How does a rolling update work, and what does the application itself have to do for it to be zero-downtime?
    ru: Как работает плавное обновление и что должно сделать само приложение, чтобы оно прошло без простоя?
  - id: requests-vs-limits
    en: What is the difference between resource requests and limits, and what happens to a JVM that exceeds its memory limit?
    ru: Чем requests отличаются от limits и что произойдёт с JVM, которая превысит лимит памяти?
  - id: autoscaling-limits
    en: A service is slow, so you scale it from 3 pods to 20 and nothing improves. What would you look at?
    ru: Сервис медленный, вы масштабируете его с 3 подов до 20, и ничего не меняется. Куда будете смотреть?
  - id: what-k8s-does-not-do
    en: Which reliability problems does Kubernetes NOT solve for you?
    ru: Какие проблемы надёжности Kubernetes за вас НЕ решает?
  - id: when-not-to-use
    en: When would you advise a team against Kubernetes, and what would you suggest instead?
    ru: Когда вы отговорили бы команду от Kubernetes и что предложили бы вместо него?
