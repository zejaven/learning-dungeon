# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: index-to-address
    title:
      en: Index to address
      ru: Индекс в адрес
    file: 01-index-to-address.java
    explanation:
      en: >
        get(2) does not search. It bounds-checks the index, computes one address
        (base + header + 2 * scale), reads the reference stored there, and
        follows it to the object.
      ru: >
        get(2) ничего не ищет. Он проверяет границы индекса, вычисляет один адрес
        (base + header + 2 * scale), читает лежащую там ссылку и переходит по ней
        к объекту.
  - id: any-index-same-cost
    title:
      en: Any index, same cost
      ru: Любой индекс — та же цена
    file: 02-any-index-same-cost.java
    explanation:
      en: >
        get(0) and get(5) both take a single multiply-add. The address math does
        not depend on the index or on the list size, so random access is O(1).
      ru: >
        get(0) и get(5) оба требуют одного умножения со сложением. Вычисление
        адреса не зависит ни от индекса, ни от размера списка, поэтому доступ —
        O(1).
  - id: references-not-objects
    title:
      en: Slots hold references
      ru: Ячейки хранят ссылки
    file: 03-references-not-objects.java
    explanation:
      en: >
        Each slot stores a reference (a pointer), not the object. The objects
        live elsewhere on the heap; the array only holds the addresses that
        point to them.
      ru: >
        Каждая ячейка хранит ссылку (указатель), а не объект. Объекты лежат в
        другом месте кучи; массив хранит только адреса, указывающие на них.
  - id: out-of-bounds
    title:
      en: Out of bounds
      ru: Выход за границы
    file: 04-out-of-bounds.java
    explanation:
      en: >
        Index 5 on a list of size 2 fails the bounds check first, so no address
        is ever computed — the JVM throws ArrayIndexOutOfBoundsException instead
        of reading arbitrary memory.
      ru: >
        Индекс 5 для списка размером 2 сначала не проходит проверку границ,
        поэтому адрес не вычисляется — JVM бросает ArrayIndexOutOfBoundsException
        вместо чтения произвольной памяти.

