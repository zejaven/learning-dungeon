id: context-switch
title:
  en: Context Switch
  ru: Context Switch
category:
  en: Java Core / Concurrency
  ru: Java Core / Многопоточность
type: CONCURRENCY
mode: trace
summary:
  en: >
    What a context switch is, what CPU state the operating system saves and
    restores, why switches happen on time slices or blocking calls, and why too
    many runnable threads can waste CPU on scheduler overhead.
  ru: >
    Что такое context switch, какое состояние CPU операционная система сохраняет
    и восстанавливает, почему переключения происходят из-за кванта времени или
    блокирующих вызовов, и почему слишком много runnable threads может тратить
    CPU на накладные расходы scheduler.
categoryId: concurrency
difficulty: 2
catalogId: concurrency-9
style: Real world
aiProvider: codex
aiModel: gpt-5.5

primitives:
  - ArrayGrid
  - LinkedNodes

defaultExample: time-slice

examples:
  - id: time-slice
    title:
      en: Time slice switch
      ru: Переключение по кванту
    file: 01-time-slice.java
    explanation:
      en: >
        Two runnable threads share one CPU core. When the first thread's time
        slice expires, the kernel saves its context and restores the next thread.
      ru: >
        Два runnable threads делят один CPU core. Когда квант времени первого
        thread истекает, kernel сохраняет его context и восстанавливает следующий
        thread.
  - id: blocking-io
    title:
      en: Blocking I/O switch
      ru: Переключение при blocking I/O
    file: 02-blocking-io.java
    explanation:
      en: >
        A thread that blocks on a database call moves to WAITING, so the CPU can
        run another ready thread instead of sitting idle.
      ru: >
        Thread, который блокируется на database call, переходит в WAITING, поэтому
        CPU может выполнять другой ready thread, а не простаивать.
  - id: switch-overhead
    title:
      en: Switch overhead
      ru: Накладные расходы switch
    file: 03-switch-overhead.java
    explanation:
      en: >
        Very short time slices make the scheduler save and restore context often.
        The useful work still happens, but overhead ticks grow too.
      ru: >
        Очень короткие кванты времени заставляют scheduler часто сохранять и
        восстанавливать context. Полезная работа все еще выполняется, но overhead
        ticks тоже растут.
  - id: no-switch
    title:
      en: No switch while running
      ru: Нет switch во время выполнения
    file: 04-no-switch.java
    explanation:
      en: >
        A normal method call or a few CPU instructions are not a context switch.
        With one runnable thread, the CPU can keep executing it.
      ru: >
        Обычный method call или несколько CPU instructions - это не context
        switch. Если runnable thread один, CPU может продолжать выполнять его.
  - id: finish-and-dispatch
    title:
      en: Finish and dispatch
      ru: Завершение и dispatch
    file: 05-finish-and-dispatch.java
    explanation:
      en: >
        When a thread finishes, the kernel discards that context and dispatches
        another ready thread.
      ru: >
        Когда thread завершается, kernel удаляет этот context и dispatches другой
        ready thread.

