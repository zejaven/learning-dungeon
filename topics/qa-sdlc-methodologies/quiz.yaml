bossFight:
- id: methodologies-which-you-know
  ru: Какие методологии разработки ПО вы знаете и по какой из них работали на практике?
- id: waterfall-essence
  ru: Что такое водопадная (каскадная) модель разработки? Назовите её этапы и главный недостаток для тестирования.
- id: waterfall-when-appropriate
  ru: В каких проектах водопадная модель до сих пор уместна и оправданна?
- id: agile-manifesto-idea
  ru: В чём ключевая идея agile-манифеста? Что agile ставит выше процессов и документации?
- id: scrum-roles
  ru: Какие роли выделяют в scrum? Опишите зону ответственности Product Owner, scrum master и dev team.
- id: scrum-ceremonies
  ru: Перечислите основные церемонии scrum (planning, daily, review, retro) и объясните цель каждой одной фразой.
- id: kanban-principles
  ru: 'Как устроен kanban: что такое доска, WIP-лимиты и непрерывный поток задач?'
