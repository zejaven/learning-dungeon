summary:
  en: >
    Both default (no keyword, "package-private") and protected restrict where a
    member can be touched, but they draw the line differently. default opens a
    member to the same package only; protected adds one more door — subclasses in
    OTHER packages, reached through inheritance. This topic pins down exactly who
    can see what, and the classic trap about accessing protected members across
    packages.
  ru: >
    И default (без ключевого слова, «package-private»), и protected ограничивают,
    откуда можно обратиться к члену класса, но проводят границу по-разному. default
    открывает член только внутри того же пакета; protected добавляет ещё одну дверь
    — подклассам в ДРУГИХ пакетах, через наследование. Здесь мы разбираем, кто что
    видит, и классическую ловушку с доступом к protected-членам между пакетами.

