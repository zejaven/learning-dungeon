# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: what-is-signature
    en: What exactly makes up a method signature in Java?
    ru: Из чего именно состоит сигнатура метода в Java?
  - id: return-type-included
    en: Is the return type part of the signature? What happens if two methods differ only by return type?
    ru: Входит ли тип возвращаемого значения в сигнатуру? Что будет, если два метода отличаются только им?
  - id: not-in-signature
    en: Which parts of a method declaration are NOT part of its signature?
    ru: Какие части объявления метода НЕ входят в его сигнатуру?
  - id: overloading-vs-overriding
    en: How do method signatures relate to overloading and overriding?
    ru: Как сигнатура метода связана с перегрузкой и переопределением?
  - id: param-order-and-names
    en: Do parameter names matter for the signature? Does the order of parameter types matter?
    ru: Важны ли для сигнатуры имена параметров? Важен ли порядок типов параметров?
  - id: generics-erasure
    en: Why can't you have both f(List<String>) and f(List<Integer>) in the same class?
    ru: Почему нельзя иметь сразу f(List<String>) и f(List<Integer>) в одном классе?
