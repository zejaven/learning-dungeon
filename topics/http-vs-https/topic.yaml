summary:
  en: >
    HTTPS is not a different protocol - it is the same HTTP carried inside a TLS
    tunnel, on port 443 instead of 80. TLS adds three things HTTP has none of:
    confidentiality (nobody on the path reads the request), integrity (nobody
    rewrites it undetected) and server authentication (the certificate proves you
    reached the host named in the URL, not an impostor). The URL path, query
    string, headers, cookies and body are all encrypted; the destination IP, the
    port, the DNS lookup and usually the hostname in SNI are not. The traps are
    believing a padlock means the site is trustworthy, assuming the encryption
    reaches your application when TLS actually terminates at the load balancer,
    treating query-string secrets as safe because the wire is encrypted, and
    thinking HTTPS does anything about XSS, CSRF or SQL injection - it protects
    the channel, not the application.
  ru: >
    HTTPS - это не другой протокол, а тот же самый HTTP внутри TLS-туннеля, на
    порту 443 вместо 80. TLS добавляет три вещи, которых у HTTP нет:
    конфиденциальность (никто на пути не прочитает запрос), целостность (никто не
    перепишет его незаметно) и аутентификацию сервера (сертификат доказывает, что
    вы попали на хост из URL, а не к самозванцу). Путь, строка запроса,
    заголовки, куки и тело зашифрованы; IP-адрес назначения, порт, DNS-запрос и
    обычно имя хоста в SNI - нет. Ловушки: считать, что замочек означает
    надёжность сайта; думать, что шифрование доходит до вашего приложения, когда
    TLS на самом деле обрывается на балансировщике; класть секреты в query-строку
    в расчёте на шифрование канала; и полагать, что HTTPS хоть как-то помогает от
    XSS, CSRF или SQL-инъекций - он защищает канал, а не приложение.

