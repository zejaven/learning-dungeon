missions:
  - id: create-anonymous-class
    title:
      en: Create an anonymous class
      ru: Создай анонимный класс
    goal:
      en: Run an example that evaluates a `new Type() { ... }` anonymous class expression.
      ru: Запусти пример, где выполняется выражение анонимного класса `new Type() { ... }`.
    event: ANON_CLASS_CREATED
  - id: call-overridden-method
    title:
      en: Call the override
      ru: Вызови переопределение
    goal:
      en: Call a method implemented inside the anonymous class body.
      ru: Вызови метод, реализованный внутри тела анонимного класса.
    event: ANON_METHOD_CALLED
  - id: capture-local
    title:
      en: Capture a local
      ru: Захвати local
    goal:
      en: Use an effectively final local variable from inside the anonymous class.
      ru: Используй effectively final локальную переменную внутри анонимного класса.
    event: ANON_LOCAL_CAPTURED
  - id: pass-callback
    title:
      en: Pass a callback
      ru: Передай callback
    goal:
      en: Pass an anonymous object into another method as a one-off callback.
      ru: Передай анонимный объект в другой метод как одноразовый callback.
    event: ANON_OBJECT_PASSED
bossFight:
  - id: define-anonymous-class
    en: What is an anonymous class in Java?
    ru: Что такое анонимный класс в Java?
  - id: syntax-target-type
    en: What is the target type in `new Runnable() { ... }`, and why does it matter?
    ru: Что такое целевой тип в `new Runnable() { ... }` и почему он важен?
  - id: generated-class
    en: Does an anonymous class have a real runtime class? How can you see it?
    ru: Есть ли у анонимного класса настоящий runtime-класс? Как это увидеть?
  - id: capture-effectively-final
    en: Which local variables can an anonymous class capture?
    ru: Какие локальные переменные может захватывать анонимный класс?
  - id: lambda-difference
    en: How is an anonymous class different from a lambda expression?
    ru: Чем анонимный класс отличается от lambda expression?
  - id: interview-traps
    en: Name two common traps when using anonymous classes.
    ru: Назови две частые ловушки при использовании анонимных классов.
