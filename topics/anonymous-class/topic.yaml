id: anonymous-class
languages: [en, ru]
title:
  en: Anonymous Classes in Java
  ru: Анонимные классы в Java
category:
  en: Java Core / OOP
  ru: Java Core / ООП
type: OTHER
mode: trace
aiProvider: codex
aiModel: gpt-5.5
summary:
  en: >
    What an anonymous class is, how Java creates a one-off implementation or
    subclass at the point of use, how overridden methods work, and why captured
    local variables must be final or effectively final.
  ru: >
    Что такое анонимный класс, как Java создает одноразовую реализацию или
    подкласс прямо в месте использования, как работают переопределенные методы
    и почему захваченные локальные переменные должны быть final или effectively final.
categoryId: java-core
difficulty: 1
catalogId: java-core-13
style: Real world
primitives:
  - ArrayGrid
  - EventLog
defaultExample: runnable-inline
examples:
  - id: runnable-inline
    title:
      en: Inline Runnable
      ru: Runnable на месте
    file: 01-runnable-inline.java
    explanation:
      en: A `new Runnable() { ... }` expression creates an object whose runtime class is generated by the compiler.
      ru: Выражение `new Runnable() { ... }` создает объект, чей runtime-класс сгенерирован компилятором.
  - id: comparator-override
    title:
      en: Override compare()
      ru: Переопредели compare()
    file: 02-comparator-override.java
    explanation:
      en: An anonymous class can implement an interface method and be used through the interface type.
      ru: Анонимный класс может реализовать метод интерфейса и использоваться через тип интерфейса.
  - id: abstract-subclass
    title:
      en: Extend an abstract class
      ru: Унаследуй абстрактный класс
    file: 03-abstract-subclass.java
    explanation:
      en: The target type may also be an abstract class, so the anonymous class becomes a one-off subclass.
      ru: Целевой тип может быть и абстрактным классом, тогда анонимный класс становится одноразовым подклассом.
  - id: captured-local
    title:
      en: Capture a local variable
      ru: Захвати локальную переменную
    file: 04-captured-local.java
    explanation:
      en: Anonymous classes may read local variables from the surrounding method only when they are final or effectively final.
      ru: Анонимные классы могут читать локальные переменные окружающего метода только когда они final или effectively final.
  - id: one-off-listener
    title:
      en: One-off listener
      ru: Одноразовый listener
    file: 05-one-off-listener.java
    explanation:
      en: A small callback object can be created, passed to an API, and never reused elsewhere.
      ru: Маленький callback-объект можно создать, передать в API и больше нигде не переиспользовать.
assistantExample:
  en: "e.g. How is an anonymous class different from a lambda?"
  ru: "например: Чем анонимный класс отличается от lambda?"
missionsFile: quiz.yaml
