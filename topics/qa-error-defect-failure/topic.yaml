summary:
  en: >
    The classic terminology chain of software problems: how a human mistake
    (error) made while writing code turns into a defect (bug, fault) in the
    program, and how that defect becomes a failure when the end user hits it.
    The theme explains why the same root cause is named differently depending
    on who found it and at which stage, and lists the typical reasons bugs
    appear in software in the first place.
  ru: >
    Классическая терминологическая цепочка проблем в ПО: как человеческая
    ошибка (error), допущенная при написании кода, превращается в дефект
    (bug, fault) в программе, а дефект становится сбоем (failure), когда на
    него натыкается конечный пользователь. Тема объясняет, почему одна и та
    же первопричина называется по-разному в зависимости от того, кто и на
    каком этапе её нашёл, и перечисляет типовые причины появления багов в
    программном обеспечении.

