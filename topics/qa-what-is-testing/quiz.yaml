bossFight:
  # I. Definitions
  - id: two-three-definitions
    en: 'Give 2-3 definitions of software testing from different sources (ISTQB, Kulikov, Savin, Bach). How do they differ in focus?'
    ru: 'Приведите 2-3 определения тестирования ПО из разных источников (ISTQB, Куликов, Савин, Бах). Чем они отличаются по фокусу?'
  - id: popular-definition
    en: 'What is the most popular working definition of testing, and why is "expected vs actual behavior" a useful formula in practice?'
    ru: 'Какое самое популярное рабочее определение тестирования и почему формула «ожидаемое против реального поведения» полезна на практике?'
  - id: james-bach-focus
    en: 'James Bach defines testing as gathering and prioritizing information for decision-makers. How does this change the role of a tester compared to "just finding bugs"?'
    ru: 'Джеймс Бах определяет тестирование как сбор и приоритизацию информации для лиц, принимающих решения. Как это меняет роль тестировщика по сравнению с «просто поиском багов»?'
  # II. QA / QC / Testing
  - id: qa-qc-testing-difference
    en: 'What is the difference between Quality Assurance, Quality Control, and testing? Which level is the broadest and why?'
    ru: 'В чём разница между обеспечением качества (QA), контролем качества (QC) и тестированием? Какой уровень самый широкий и почему?'
  - id: qa-vs-qc-process-product
    en: 'Explain why QA is said to be process-oriented while QC is product-oriented. Give an example of an activity for each.'
    ru: 'Объясните, почему QA считается ориентированным на процесс, а QC — на продукт. Приведите пример активности для каждого.'
  - id: tester-vs-qa-title
    en: 'Why are testers in the industry often called "QA engineers" even though their work is mostly testing? How would you comment on this at an interview?'
    ru: 'Почему в индустрии тестировщиков часто называют «QA-инженерами», хотя их работа — это в основном тестирование? Как бы вы это прокомментировали на собеседовании?'
  # III. Verification / Validation and Goals
  - id: verification-vs-validation
    en: 'What is the difference between verification and validation? Which one answers "are we building the product right" and which "are we building the right product"?'
    ru: 'В чём разница между верификацией и валидацией? Какая из них отвечает на вопрос «правильно ли мы делаем продукт», а какая — «тот ли продукт мы делаем»?'
  - id: validation-failure-example
    en: 'Give an example of a product that passes verification but fails validation. What does this tell us about the limits of specification-based testing?'
    ru: 'Приведите пример продукта, который проходит верификацию, но проваливает валидацию. О чём это говорит с точки зрения ограничений тестирования по спецификации?'
  - id: testing-goals
    en: 'What are the main goals of software testing? Can testing prove the absence of bugs?'
    ru: 'Каковы основные цели тестирования ПО? Может ли тестирование доказать отсутствие багов?'
