summary:
  en: >
    The classic classifications of testing every QA interview expects you to
    recite: by test object (functional vs non-functional, with the main
    non-functional types), by component isolation (unit, integration, system),
    by functionality version (new features vs regression, plus smoke testing),
    by expected result (positive vs negative), by knowledge of the system
    (black, white and grey box), by degree of automation (manual vs automated)
    and by planning level (scripted test cases vs exploratory testing).
  ru: >
    Классические классификации тестирования, которые ждут на любом
    QA-собеседовании: по объекту (функциональное и нефункциональное с основными
    видами нефункционального), по изолированности компонент (модульное,
    интеграционное, системное), по версии функционала (новая функциональность
    и регрессионное, плюс smoke-тестирование), по ожидаемому результату
    (позитивное и негативное), по знанию системы (чёрный, белый и серый ящик),
    по степени автоматизации (ручное и автоматизированное) и по уровню
    планирования (по тест-кейсам и исследовательское).

assistantExample:
