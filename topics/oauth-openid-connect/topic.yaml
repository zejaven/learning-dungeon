# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: the-whole-flow
    title:
      en: 'The whole flow'
      ru: 'Весь поток целиком'
    file: 01-the-whole-flow.java
    explanation:
      en: >
        The authorization code flow end to end, which is the answer to "how does
        OAuth work" in every interview. Watch which party is talking to which,
        and on which channel: everything that goes through the browser is
        visible, so what travels there is a code that is single-use, valid for
        about a minute and useless without a secret the client never sent. The
        valuable things appear only on the direct server-to-server call.
      ru: >
        Поток authorization code от начала до конца — это и есть ответ на вопрос
        «как работает OAuth» на любом собеседовании. Следите за тем, кто с кем
        говорит и по какому каналу: всё, что идёт через браузер, видно, поэтому
        там едет код — одноразовый, живущий около минуты и бесполезный без
        секрета, который клиент никуда не отправлял. Ценное появляется только на
        прямом вызове сервер — сервер.
  - id: oauth-is-not-login
    title:
      en: 'OAuth is not login'
      ru: 'OAuth — это не вход'
    file: 02-oauth-is-not-login.java
    explanation:
      en: >
        The same provider, the same tokens, and one app is authenticating a user
        while the other is only guessing. An access token is addressed to the
        API, carries no audience the client can check, and proves only that
        somebody authorized something — so a token a user gave to another app
        passes this check too. The id_token is the opposite: addressed to this
        client, and validated before a single field of it is believed.
      ru: >
        Тот же провайдер, те же токены — и одно приложение аутентифицирует
        пользователя, а второе просто угадывает. Access-токен адресован API, не
        содержит аудитории, которую клиент мог бы проверить, и доказывает лишь
        то, что кто-то что-то разрешил, — поэтому токен, выданный пользователем
        другому приложению, пройдёт ту же проверку. id_token — ровно наоборот:
        адресован именно этому клиенту и проверяется, прежде чем поверят хоть
        одному его полю.
  - id: scopes-and-consent
    title:
      en: 'Scopes and consent'
      ru: 'Scope и согласие'
    file: 03-scopes-and-consent.java
    explanation:
      en: >
        The user is not asked "do you trust this app" but "may it do exactly
        this", and they can answer partly. Then the same perfectly valid token
        gets a 200 on one call and a 403 on the next, because the resource server
        checks the scopes itself — 401 means "I do not know who you are", 403
        means "I do, and this is not allowed". An app that asks for everything up
        front loses the user on this screen.
      ru: >
        Пользователя спрашивают не «доверяете ли вы этому приложению», а «можно
        ли ему делать вот это», и ответить он может частично. А дальше один и тот
        же совершенно корректный токен получает 200 на одном вызове и 403 на
        следующем, потому что scope проверяет сам сервер ресурсов: 401 — «я не
        знаю, кто ты», 403 — «знаю, и этого нельзя». Приложение, которое сразу
        просит всё, теряет пользователя именно на этом экране.
  - id: why-pkce
    title:
      en: 'Why PKCE exists'
      ru: 'Зачем нужен PKCE'
    file: 04-why-pkce.java
    explanation:
      en: >
        A mobile app cannot keep a client_secret — its code is on the user's
        device — so for years an intercepted authorization code was enough to
        take over the grant. PKCE fixes it with one idea: send only a hash on the
        channel that leaks, and prove the original when redeeming. The same theft
        runs twice here, and the only difference is whether the provider ever
        asked for the verifier.
      ru: >
        Мобильное приложение не может хранить client_secret — его код лежит на
        устройстве пользователя, — и годами перехваченного кода авторизации
        хватало, чтобы забрать выданное разрешение. PKCE решает это одной идеей:
        по каналу, который протекает, отправляем только хеш, а при обмене
        предъявляем оригинал. Одна и та же кража здесь происходит дважды, и
        разница ровно в том, спросил ли провайдер verifier.
  - id: why-state
    title:
      en: 'Why state exists'
      ru: 'Зачем нужен state'
    file: 05-why-state.java
    explanation:
      en: >
        Nothing is stolen in this one. The attacker logs in as themselves, keeps
        their own authorization code, and makes the victim's browser deliver it
        to the app's callback — a link in an email is enough. Without `state` the
        app cheerfully redeems it, and the person sitting at the browser is now
        working inside the attacker's account, where everything they save can be
        read.
      ru: >
        Здесь ничего не крадут. Злоумышленник входит под собой, оставляет себе
        собственный код авторизации и заставляет браузер жертвы доставить его на
        callback приложения — достаточно ссылки в письме. Без `state` приложение
        радостно его обменивает, и человек за браузером оказывается внутри
        аккаунта злоумышленника, где всё сохранённое можно прочитать.
  - id: expiry-and-refresh
    title:
      en: 'Expiry and refresh'
      ru: 'Срок действия и обновление'
    file: 06-expiry-and-refresh.java
    explanation:
      en: >
        Nobody calls anything and nothing changes at the provider — only the
        clock moves, and the access token is finished. That is the point of a
        short lifetime: a stolen token stops working on its own, without anyone
        having to notice the theft. The refresh token buys a new one on the back
        channel, with no redirect and no consent screen, which is why fifteen
        minutes is not a nuisance.
      ru: >
        Никто ничего не вызывает и у провайдера ничего не меняется — движутся
        только часы, и access-токен закончился. В этом и смысл короткого срока:
        украденный токен перестаёт работать сам, и никому не нужно замечать
        кражу. Refresh-токен покупает новый по бэк-каналу, без редиректа и без
        экрана согласия, — поэтому пятнадцать минут никому не мешают.
  - id: no-user-in-sight
    title:
      en: 'When there is no user'
      ru: 'Когда пользователя нет'
    file: 07-no-user-in-sight.java
    explanation:
      en: >
        A nightly job has no browser to redirect and nobody to ask, so the whole
        front half of the protocol disappears: one back-channel call with the
        client's own credentials, and a token comes back. There is no user, no
        consent, no id_token and no refresh token — the app is not acting on
        anyone's behalf, it is acting as itself. Right for service-to-service,
        wrong for anything a person is doing.
      ru: >
        У ночной задачи нет браузера, который можно перенаправить, и некого
        спрашивать — поэтому вся передняя половина протокола исчезает: один вызов
        по бэк-каналу с собственными учётными данными клиента, и токен получен.
        Нет пользователя, нет согласия, нет id_token и нет refresh-токена:
        приложение действует не от чьего-то имени, а от себя. Верно для вызовов
        между сервисами и неверно для всего, что делает человек.
  - id: flows-to-avoid
    title:
      en: 'The flows to avoid'
      ru: 'Потоки, которых избегают'
    file: 08-flows-to-avoid.java
    explanation:
      en: >
        Two flows that still turn up in old code and in interview answers. The
        implicit flow skipped the back channel, so the access token itself came
        back in the URL fragment — history, extensions, referrers, one bad
        redirect. The password grant skipped the redirect entirely and handed the
        app the provider password, which is precisely what OAuth was invented to
        prevent. OAuth 2.1 removes both.
      ru: >
        Два потока, которые всё ещё встречаются в старом коде и в ответах на
        собеседованиях. Implicit flow обходился без бэк-канала, поэтому в
        URL-фрагменте возвращался сам access-токен — история, расширения,
        referer, один неудачный редирект. Grant с паролем обходился без редиректа
        вовсе и отдавал приложению пароль от провайдера — ровно то, ради чего
        OAuth и придумали. В OAuth 2.1 удалены оба.

