summary:
  en: >
    Kafka and RabbitMQ are both messaging systems, but they solve different
    problems. RabbitMQ is a smart broker that routes and pushes messages to
    consumers and deletes them once acknowledged — great for task queues and
    complex routing. Kafka is a durable, replayable log that consumers pull from
    by offset — great for high-throughput event streaming and multiple
    independent readers. This topic contrasts their delivery model, ordering,
    retention, scaling and routing so you can pick the right one.
  ru: >
    Kafka и RabbitMQ — обе системы обмена сообщениями, но решают разные задачи.
    RabbitMQ — это «умный» брокер, который маршрутизирует и проталкивает
    сообщения потребителям и удаляет их после подтверждения — хорош для очередей
    задач и сложной маршрутизации. Kafka — это долговечный, перечитываемый лог,
    из которого потребители читают по смещению (offset) — хорош для
    высоконагруженной потоковой обработки событий и нескольких независимых
    читателей. Тема сравнивает их по модели доставки, упорядочиванию, хранению,
    масштабированию и маршрутизации, чтобы вы могли выбрать подходящее.

