missions:
  - id: start-physical
    title:
      en: Start a physical transaction
      ru: Открой физическую транзакцию
    goal:
      en: Enter a REQUIRED method with no active transaction so a new physical transaction begins.
      ru: Войди в REQUIRED-метод без активной транзакции, чтобы началась новая физическая транзакция.
    event: TX_START_PHYSICAL
  - id: join-existing
    title:
      en: Join an existing transaction
      ru: Присоединись к существующей транзакции
    goal:
      en: Call a REQUIRED method from inside another transaction so it joins the same physical transaction.
      ru: Вызови REQUIRED-метод изнутри другой транзакции, чтобы он присоединился к той же физической транзакции.
    event: TX_JOIN
  - id: suspend-outer
    title:
      en: Suspend with REQUIRES_NEW
      ru: Приостанови через REQUIRES_NEW
    goal:
      en: Call a REQUIRES_NEW method inside a transaction so the outer transaction is suspended.
      ru: Вызови REQUIRES_NEW-метод внутри транзакции, чтобы внешняя транзакция была приостановлена.
    event: TX_SUSPEND
  - id: make-savepoint
    title:
      en: Open a NESTED savepoint
      ru: Создай savepoint через NESTED
    goal:
      en: Call a NESTED method inside a transaction so a savepoint is created in the same physical transaction.
      ru: Вызови NESTED-метод внутри транзакции, чтобы в той же физической транзакции появился savepoint.
    event: TX_SAVEPOINT
  - id: rollback-savepoint
    title:
      en: Roll back to a savepoint
      ru: Откатись к savepoint
    goal:
      en: Make a NESTED block fail so only its savepoint is rolled back and the outer transaction survives.
      ru: Заставь NESTED-блок упасть, чтобы откатился только его savepoint, а внешняя транзакция уцелела.
    event: TX_ROLLBACK_SAVEPOINT
  - id: poison-outer
    title:
      en: Poison the shared transaction
      ru: Отрави общую транзакцию
    goal:
      en: Let an inner REQUIRED method fail so the outer commit throws UnexpectedRollbackException.
      ru: Дай внутреннему REQUIRED-методу упасть, чтобы внешний коммит бросил UnexpectedRollbackException.
    event: TX_UNEXPECTED_ROLLBACK
  - id: propagation-error
    title:
      en: Trigger a propagation error
      ru: Спровоцируй ошибку распространения
    goal:
      en: Call MANDATORY without a transaction (or NEVER inside one) to trigger a propagation error.
      ru: Вызови MANDATORY без транзакции (или NEVER внутри неё), чтобы получить ошибку распространения.
    event: TX_ERROR

bossFight:
  - id: what-is-propagation
    en: 'What is transaction propagation, and what problem does it solve when one @Transactional method calls another?'
    ru: 'Что такое распространение транзакций и какую проблему оно решает, когда один @Transactional-метод вызывает другой?'
  - id: list-propagation-types
    en: 'Name the propagation types you know and explain what each does when a transaction is already active.'
    ru: 'Назови известные тебе типы распространения и объясни, что делает каждый, если транзакция уже активна.'
  - id: required-vs-requires-new
    en: 'Compare REQUIRED and REQUIRES_NEW: how many physical transactions and connections are involved, and when would you choose each?'
    ru: 'Сравни REQUIRED и REQUIRES_NEW: сколько физических транзакций и соединений задействовано и когда выбирать каждый?'
  - id: nested-vs-requires-new
    en: 'How does NESTED differ from REQUIRES_NEW, and what does it rely on at the database and driver level?'
    ru: 'Чем NESTED отличается от REQUIRES_NEW и на что он опирается на уровне базы данных и драйвера?'
  - id: unexpected-rollback
    en: 'An inner REQUIRED method throws an exception that the caller catches, yet the outer commit fails. Why, and how do you avoid it?'
    ru: 'Внутренний REQUIRED-метод бросает исключение, которое вызывающий ловит, но внешний коммит всё равно падает. Почему и как этого избежать?'
  - id: mandatory-supports-never
    en: 'When would you use MANDATORY, SUPPORTS, NOT_SUPPORTED or NEVER instead of REQUIRED?'
    ru: 'Когда стоит использовать MANDATORY, SUPPORTS, NOT_SUPPORTED или NEVER вместо REQUIRED?'
  - id: self-invocation-trap
    en: 'Why might a propagation setting be silently ignored when one method calls another in the same bean?'
    ru: 'Почему настройка propagation может молча игнорироваться, когда один метод вызывает другой в том же бине?'
