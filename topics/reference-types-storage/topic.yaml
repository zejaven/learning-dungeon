id: reference-types-storage
title:
  en: Where Reference Types Are Stored
  ru: Где хранятся ссылочные типы
category:
  en: Java Core / Memory
  ru: Java Core / Память
type: JVM_MEMORY
mode: trace
aiProvider: claude
aiModel: claude-opus-4-8
summary:
  en: >
    A primitive variable stores its value directly in its stack slot, but a
    reference-type variable stores only a reference: the object itself lives on
    the heap. This topic visualizes the stack and the heap side by side — copying
    values vs copying references (aliasing), passing objects to methods
    (pass-by-value of the reference), reassigning, null, and what becomes garbage.
  ru: >
    Переменная примитивного типа хранит своё значение прямо в слоте на стеке, а
    переменная ссылочного типа хранит только ссылку: сам объект живёт в куче.
    Тема показывает стек и кучу рядом — копирование значений против копирования
    ссылок (алиасинг), передачу объектов в методы (передача ссылки по значению),
    переприсваивание, null и то, что становится мусором.

# Visual primitives this topic's visualizer composes (frontend).
primitives:
  - BoxGroup

categoryId: java-core
difficulty: 1
catalogId: java-core-3
style: Real world

defaultExample: primitive-vs-reference

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: primitive-vs-reference
    title:
      en: Primitive vs reference
      ru: Примитив против ссылки
    file: 01-primitive-vs-reference.java
    explanation:
      en: >
        A primitive holds its value directly in its stack slot. A reference type
        is allocated on the heap, and the variable holds only a reference (a
        handle) to that heap object.
      ru: >
        Примитив держит своё значение прямо в слоте на стеке. Ссылочный тип
        размещается в куче, а переменная хранит лишь ссылку (хэндл) на этот
        объект в куче.
  - id: copy-primitive
    title:
      en: Copying a primitive
      ru: Копирование примитива
    file: 02-copy-primitive.java
    explanation:
      en: >
        Assigning one primitive to another copies the value into an independent
        slot. Changing the copy never affects the original — they are separate
        values.
      ru: >
        Присваивание одного примитива другому копирует значение в независимый
        слот. Изменение копии не влияет на оригинал — это отдельные значения.
  - id: copy-reference
    title:
      en: Copying a reference (aliasing)
      ru: Копирование ссылки (алиасинг)
    file: 03-copy-reference.java
    explanation:
      en: >
        Assigning one object variable to another copies only the reference, not
        the object. Both names now point at the SAME heap object, so a change
        through one is visible through the other.
      ru: >
        Присваивание одной объектной переменной другой копирует только ссылку, а
        не объект. Оба имени теперь указывают на ОДИН И ТОТ ЖЕ объект в куче,
        поэтому изменение через одно видно через другое.
  - id: pass-by-value
    title:
      en: Passing an object to a method
      ru: Передача объекта в метод
    file: 04-pass-by-value.java
    explanation:
      en: >
        Java is pass-by-value: the method's parameter gets a COPY of the
        reference. Mutating the shared object is visible to the caller, but
        reassigning the local parameter is not.
      ru: >
        Java передаёт аргументы по значению: параметр метода получает КОПИЮ
        ссылки. Изменение общего объекта видно вызывающему коду, а
        переприсваивание локального параметра — нет.
  - id: reassign-garbage
    title:
      en: Reassign creates garbage
      ru: Переприсваивание создаёт мусор
    file: 05-reassign-garbage.java
    explanation:
      en: >
        Repointing a variable at a new object leaves the previous object
        unreachable. It is not deleted immediately — it stays on the heap until
        the garbage collector reclaims it.
      ru: >
        Перенаправление переменной на новый объект делает прежний объект
        недостижимым. Он не удаляется сразу — он остаётся в куче, пока его не
        соберёт сборщик мусора.
  - id: null-reference
    title:
      en: A null reference
      ru: Ссылка null
    file: 06-null-reference.java
    explanation:
      en: >
        Setting a reference to null means the variable points at no object at
        all. The object it used to reference becomes garbage if nothing else
        reaches it.
      ru: >
        Присвоение ссылке null означает, что переменная не указывает ни на какой
        объект. Объект, на который она ссылалась, становится мусором, если до него
        больше никто не достаёт.

