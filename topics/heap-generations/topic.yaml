id: heap-generations
title:
  en: JVM Heap Generations
  ru: Поколения кучи JVM
category:
  en: JVM / Memory & GC
  ru: JVM / Память и GC
type: JVM_MEMORY
aiProvider: claude
summary:
  en: >
    Why the JVM heap is split into Eden, two Survivor spaces (S0/S1) and the Old
    generation. Objects are born in Eden, a cheap minor GC copies and ages the
    survivors between the two Survivor spaces, and only the long-lived ones are
    promoted ("tenured") to Old, which a rare major GC collects. The split is
    built on the generational hypothesis: most objects die young.
  ru: >
    Зачем куча JVM делится на Eden, два Survivor-пространства (S0/S1) и Old.
    Объекты рождаются в Eden, дешёвый minor GC копирует и старит выживших между
    двумя Survivor-пространствами, и лишь долгоживущие продвигаются («tenured») в
    Old, который собирается редким major GC. Разделение основано на гипотезе о
    поколениях: большинство объектов умирает молодыми.

# Visual primitives this topic's visualizer composes (frontend).
primitives:
  - ArrayGrid
  - BoxGroup
  - EventLog

defaultExample: allocation

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: allocation
    title:
      en: Allocate in Eden
      ru: Выделение в Eden
    file: 01-allocation.java
    explanation:
      en: >
        New objects are born in Eden using a fast bump-the-pointer allocation.
        No GC runs while Eden still has room.
      ru: >
        Новые объекты рождаются в Eden с помощью быстрого bump-the-pointer
        выделения. Пока в Eden есть место, GC не запускается.
  - id: minor-gc
    title:
      en: Minor GC
      ru: Minor GC
    file: 02-minor-gc.java
    explanation:
      en: >
        Filling Eden triggers a minor GC: dead objects are freed for free
        (copying collectors only touch the living), and survivors are copied to
        a Survivor space with their age incremented.
      ru: >
        Заполнение Eden запускает minor GC: мёртвые объекты освобождаются
        бесплатно (копирующий сборщик трогает только живых), а выжившие
        копируются в Survivor с увеличением возраста.
  - id: survivor-spaces
    title:
      en: Two Survivor spaces
      ru: Два Survivor-пространства
    file: 03-survivor-spaces.java
    explanation:
      en: >
        Each minor GC copies the live young objects into the empty Survivor
        space (S0 then S1, alternating) and ages them. One Survivor is always
        empty so the other can be evacuated into it — that is why there are two.
      ru: >
        Каждый minor GC копирует живые молодые объекты в пустое
        Survivor-пространство (S0, затем S1, попеременно) и старит их. Один
        Survivor всегда пуст, чтобы в него можно было эвакуировать другой — вот
        зачем их два.
  - id: promotion
    title:
      en: Promotion to Old
      ru: Продвижение в Old
    file: 04-promotion.java
    explanation:
      en: >
        An object that survives enough minor GCs reaches the tenuring threshold
        and is promoted to the Old generation, which is collected only by a rare
        major GC.
      ru: >
        Объект, переживший достаточно minor GC, достигает порога продвижения и
        перемещается в Old-поколение, которое собирается лишь редким major GC.
  - id: major-gc
    title:
      en: Major (full) GC
      ru: Major (full) GC
    file: 05-major-gc.java
    explanation:
      en: >
        Once an object lives in Old, a minor GC never reclaims it. Only a major
        (full) GC scans the Old generation — much more expensive, so you want it
        to happen rarely.
      ru: >
        Когда объект попал в Old, minor GC его никогда не освобождает. Old
        сканирует только major (full) GC — он гораздо дороже, поэтому он должен
        случаться редко.
  - id: survivor-overflow
    title:
      en: Premature promotion
      ru: Преждевременное продвижение
    file: 06-survivor-overflow.java
    explanation:
      en: >
        If too many objects survive at once, the Survivor space overflows and
        the extra ones are promoted to Old early — even though they may die soon.
        Under-sized survivor spaces cause this and pollute the Old generation.
      ru: >
        Если за раз выживает слишком много объектов, Survivor переполняется и
        лишние продвигаются в Old раньше времени — хотя могут вскоре умереть.
        Маленькие Survivor-пространства вызывают это и засоряют Old-поколение.

# Example question pre-filled as the Ask AI placeholder.
assistantExample:
  en: "e.g. Why are there two Survivor spaces instead of one?"
  ru: "например: Почему Survivor-пространств два, а не одно?"

missionsFile: quiz.yaml
