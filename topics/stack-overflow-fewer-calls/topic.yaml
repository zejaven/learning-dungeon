id: stack-overflow-fewer-calls
title:
  en: StackOverflowError in Fewer Calls
  ru: StackOverflowError за меньшее число вызовов
category:
  en: Java Core / Exceptions
  ru: Java Core / Исключения
type: JVM_MEMORY
mode: trace
aiProvider: codex
aiModel: gpt-5.5
categoryId: exceptions
difficulty: 2
catalogId: exceptions-4
style: Real world
summary:
  en: >
    How to make StackOverflowError appear faster in Java: reduce the available
    thread stack size or make each recursive frame larger. The important
    interview point is that the stack limit is a byte budget, not a magic fixed
    count of method calls, so larger frames overflow after fewer calls.
  ru: >
    Как сделать так, чтобы StackOverflowError в Java появился быстрее: уменьшить
    доступный размер стека потока или сделать каждый рекурсивный кадр крупнее.
    Важная мысль для собеседования: предел стека — это бюджет в байтах, а не
    магическое фиксированное число вызовов, поэтому крупные кадры переполняют
    стек после меньшего числа вызовов.

primitives:
  - ArrayGrid
  - EventLog

defaultExample: large-frame-fewer-calls

examples:
  - id: small-frame-baseline
    title:
      en: Small frame baseline
      ru: База с маленьким кадром
    file: 01-small-frame-baseline.java
    explanation:
      en: >
        A compact recursive method consumes a small stack frame on each call, so
        the same stack budget allows more calls before overflow.
      ru: >
        Компактный рекурсивный метод расходует маленький кадр стека на каждом
        вызове, поэтому тот же бюджет стека выдерживает больше вызовов до
        переполнения.
  - id: large-frame-fewer-calls
    title:
      en: Larger frame, fewer calls
      ru: Крупнее кадр — меньше вызовов
    file: 02-large-frame-fewer-calls.java
    explanation:
      en: >
        The recursive method models many primitive locals. Each frame is larger,
        so the stack reaches StackOverflowError after fewer active calls.
      ru: >
        Рекурсивный метод моделирует много primitive locals. Каждый кадр крупнее,
        поэтому стек доходит до StackOverflowError после меньшего числа активных
        вызовов.
  - id: smaller-stack-budget
    title:
      en: Smaller stack budget
      ru: Меньший бюджет стека
    file: 03-smaller-stack-budget.java
    explanation:
      en: >
        Reducing the thread stack size, like using a smaller -Xss value in a real
        JVM, makes the same frame shape overflow sooner.
      ru: >
        Уменьшение размера стека потока, как меньший -Xss в настоящей JVM,
        заставляет ту же форму кадра переполнить стек раньше.
  - id: heap-reference-trap
    title:
      en: Big heap object trap
      ru: Ловушка большого heap-объекта
    file: 04-heap-reference-trap.java
    explanation:
      en: >
        Passing a large array does not copy the array into every stack frame.
        Recursive frames keep references; the array itself lives on the heap.
      ru: >
        Передача большого массива не копирует массив в каждый кадр стека.
        Рекурсивные кадры хранят ссылки; сам массив живёт в heap.
  - id: return-reuses-stack
    title:
      en: Return reuses stack space
      ru: return переиспользует место
    file: 05-return-reuses-stack.java
    explanation:
      en: >
        A loop calls a helper and returns before the next iteration. The same
        stack space is reused instead of accumulating recursive frames.
      ru: >
        Цикл вызывает helper и возвращается перед следующей итерацией. То же
        место в стеке используется снова вместо накопления рекурсивных кадров.

