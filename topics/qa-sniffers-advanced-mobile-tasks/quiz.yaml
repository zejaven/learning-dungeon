bossFight:
- id: mobile-vs-web-brief
  ru: В чём отличия тестирования мобильного приложения от web? И в чём разница между нативным и веб-приложением? Ответьте кратко, по существу.
- id: ios-vs-android
  ru: Назовите основные различия iOS и Android с точки зрения тестировщика. Что особенного в устройствах Huawei?
- id: charles-map-local-remote
  ru: Чем отличаются Map Local и Map Remote в Charles? Приведите практический пример применения каждой функции.
- id: charles-rewrite-breakpoint
  ru: Для чего нужны Rewrite и Breakpoint в Charles? Как с их помощью навесить 500-ю ошибку на запрос или изменить значение конфига в ответе?
- id: mobile-specific-bugs-priority
  ru: Какие специфичные ошибки обнаруживаются при тестировании на мобильных устройствах? Укажите приоритет таких ошибок.
- id: android-versions-from-8
  ru: Какие версии Android нужно тестировать, если заказчик сказал поддерживать с версии 8.0? Обоснуйте выбор.
- id: failed-to-send-task
  ru: 'Задача: в мессенджере пользователь отправляет файл в чат и видит «Failed to send...». Когда это может быть баг, а когда нет?'
- id: push-one-device-task
  ru: 'Задача: два разных устройства с одинаковой версией приложения, бэкенд и связь стабильны, но пуши приходят только на одно. Назовите возможные причины.'
