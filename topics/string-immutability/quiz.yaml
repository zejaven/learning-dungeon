# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: first-literal
    title:
      en: Create a string
      ru: Создай строку
    goal:
      en: Run the code and assign a string literal to a variable.
      ru: Запусти код и присвой переменной строковый литерал.
    event: STRING_LITERAL
  - id: derive
    title:
      en: '"Change" a string'
      ru: «Поменяй» строку
    goal:
      en: Concatenate, replace or upper-case a string so a NEW object is allocated.
      ru: Сконкатенируй, замени символ или приведи к верхнему регистру — выделится НОВЫЙ объект.
    event: STRING_DERIVE
  - id: compare
    title:
      en: Compare == vs equals
      ru: Сравни == и equals
    goal:
      en: Compare two variables and see when references match and when only content matches.
      ru: Сравни две переменные и увидь, когда совпадают ссылки, а когда только содержимое.
    event: STRING_COMPARE
  - id: intern
    title:
      en: Intern into the pool
      ru: Интернируй в пул
    goal:
      en: Call intern() so a runtime string points at the pooled instance.
      ru: Вызови intern(), чтобы строка из рантайма указывала на объект из пула.
    event: STRING_INTERN
  - id: builder
    title:
      en: Mutate a StringBuilder
      ru: Измени StringBuilder
    goal:
      en: Append to a StringBuilder and watch the SAME object change in place.
      ru: Добавь в StringBuilder и увидь, как ТОТ ЖЕ объект меняется на месте.
    event: BUILDER_APPEND

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: mutable-or-immutable
    en: Are strings in Java mutable or immutable, and how do you know?
    ru: Строки в Java мутабельные или иммутабельные, и почему вы так считаете?
  - id: change-char-memory
    en: What happens at the memory level when you "change a character" in a String?
    ru: Что происходит на уровне памяти, когда вы «меняете символ» в строке?
  - id: why-immutable
    en: Why did the Java designers make String immutable? Name concrete benefits.
    ru: Почему создатели Java сделали String иммутабельным? Назовите конкретные плюсы.
  - id: pool-and-equals
    en: What is the string pool, and how does it relate to == versus equals()?
    ru: Что такое пул строк и как он связан с == и equals()?
  - id: intern
    en: What does String.intern() do, and when would you use it?
    ru: Что делает String.intern() и когда его стоит применять?
  - id: stringbuilder
    en: How do StringBuilder/StringBuffer differ from String, and when do you reach for them?
    ru: Чем StringBuilder/StringBuffer отличаются от String и когда их выбирать?
