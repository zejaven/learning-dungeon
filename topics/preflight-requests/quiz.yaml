# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: send-without-asking
    title:
      en: Send one without asking
      ru: Отправь без вопросов
    goal:
      en: Make a cross-origin call that needs no preflight at all, and note what makes it simple.
      ru: Сделай кросс-доменный вызов, которому предварительный запрос не нужен вовсе, и заметь, что делает его простым.
    event: SIMPLE_CALL
  - id: see-the-options-request
    title:
      en: See the OPTIONS request
      ru: Посмотри на запрос OPTIONS
    goal:
      en: Trigger a preflight and read what the browser puts into it - Origin, the method and the header names.
      ru: Вызови предварительный запрос и прочитай, что браузер в него кладёт - Origin, метод и имена заголовков.
    event: OPTIONS_SENT
  - id: get-permission
    title:
      en: Get permission granted
      ru: Получи разрешение
    goal:
      en: Configure the API so the OPTIONS answer lists both the method and every requested header.
      ru: Настрой API так, чтобы в ответе на OPTIONS были и метод, и все запрошенные заголовки.
    event: PREFLIGHT_APPROVED
  - id: get-denied
    title:
      en: Get a preflight denied
      ru: Добейся отказа
    goal:
      en: Use a method or header the API does not list and watch the browser refuse the call.
      ru: Используй метод или заголовок, которых нет у API, и посмотри, как браузер отклонит вызов.
    event: PREFLIGHT_DENIED
  - id: prove-nothing-ran
    title:
      en: Prove nothing reached the API
      ru: Докажи, что до API ничего не дошло
    goal:
      en: After a denial, confirm the real write was never sent - the opposite of a blocked simple request.
      ru: После отказа убедись, что настоящая запись не отправлялась вовсе - в отличие от заблокированного простого запроса.
    event: REQUEST_NEVER_SENT
  - id: break-it-with-auth
    title:
      en: Break it with a security filter
      ru: Сломай это фильтром безопасности
    goal:
      en: Let an authentication filter answer OPTIONS and see the CORS error that is really an auth bug.
      ru: Позволь фильтру аутентификации ответить на OPTIONS и увидь ошибку CORS, которая на деле является ошибкой аутентификации.
    event: OPTIONS_UNAUTHORIZED
  - id: reuse-a-preflight
    title:
      en: Reuse a remembered answer
      ru: Переиспользуй запомненный ответ
    goal:
      en: Add Access-Control-Max-Age and repeat an identical call so the second one skips the handshake.
      ru: Добавь Access-Control-Max-Age и повтори точно такой же вызов, чтобы второй обошёлся без рукопожатия.
    event: CACHE_HIT
  - id: let-it-expire
    title:
      en: Let a permission expire
      ru: Дай разрешению истечь
    goal:
      en: Move the clock past Access-Control-Max-Age and watch the browser ask all over again.
      ru: Переведи часы за Access-Control-Max-Age и посмотри, как браузер спрашивает заново.
    event: CACHE_EXPIRED

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: what-is-a-preflight
    en: What is a preflight request, and why does the browser send one?
    ru: Что такое предварительный запрос (preflight) и зачем браузер его отправляет?
  - id: which-requests-preflight
    en: Which requests are preflighted and which are not? Give the exact rule.
    ru: Для каких запросов отправляется предварительный, а для каких нет? Сформулируй точное правило.
  - id: why-the-safelist-exists
    en: Why is the safelist exactly GET/HEAD/POST plus three Content-Type values? What is the reasoning behind that list?
    ru: Почему в безопасном списке именно GET/HEAD/POST и три значения Content-Type? Какая логика стоит за этим списком?
  - id: preflight-headers
    en: Which headers does the browser put in the OPTIONS request, and which must the server answer with?
    ru: Какие заголовки браузер кладёт в запрос OPTIONS и какими должен ответить сервер?
  - id: what-options-does-not-carry
    en: What does a preflight NOT carry - body, cookies, Authorization? Why does that matter?
    ru: Чего в предварительном запросе НЕТ - тела, кук, Authorization? Почему это важно?
  - id: denied-vs-blocked
    en: 'A cross-origin call fails. How can you tell from the server logs whether the preflight was denied or a simple request was delivered and only its response blocked?'
    ru: 'Кросс-доменный вызов не удался. Как по логам сервера понять, был ли отклонён предварительный запрос или простой запрос дошёл, а заблокирован был только его ответ?'
  - id: json-content-type
    en: Why does Content-Type application/json trigger a preflight while application/x-www-form-urlencoded does not?
    ru: Почему Content-Type application/json вызывает предварительный запрос, а application/x-www-form-urlencoded — нет?
  - id: authorization-header
    en: Does adding an Authorization header trigger a preflight? Is it covered by Access-Control-Allow-Headers - *?
    ru: Вызывает ли добавление заголовка Authorization предварительный запрос? Покрывает ли его Access-Control-Allow-Headers - *?
  - id: options-401
    en: 'Your API works from Postman but every call from the browser fails with a CORS error, and the logs show 401 on OPTIONS. What is wrong and how do you fix it?'
    ru: 'API работает из Postman, но каждый вызов из браузера падает с ошибкой CORS, а в логах видно 401 на OPTIONS. Что не так и как это чинить?'
  - id: preflight-response-status
    en: What must the preflight response look like - status, body, headers? What happens if it answers 302 or 500?
    ru: Как должен выглядеть ответ на предварительный запрос — статус, тело, заголовки? Что будет, если ответить 302 или 500?
  - id: max-age-caching
    en: What does Access-Control-Max-Age do, and what exactly is the cached entry keyed by?
    ru: Что делает Access-Control-Max-Age и по чему именно строится ключ закешированной записи?
  - id: max-age-limits
    en: Why does setting Access-Control-Max-Age to 24 hours not always give you 24 hours?
    ru: Почему Access-Control-Max-Age со значением 24 часа не всегда даёт вам эти 24 часа?
  - id: reducing-preflights
    en: A screen makes 30 API calls and each one is preflighted. List the ways to cut that cost.
    ru: Экран делает 30 вызовов API, и каждый идёт с предварительным запросом. Перечисли способы снизить эту цену.
  - id: credentials-and-preflight
    en: How does credentials - 'include' change the preflight? What stops being allowed?
    ru: Как credentials - 'include' меняет предварительный запрос? Что перестаёт быть разрешённым?
  - id: preflight-and-auth-design
    en: 'Where should CORS be handled relative to authentication - in Spring Security, in a filter, at the gateway? What breaks if the order is wrong?'
    ru: 'Где обрабатывать CORS относительно аутентификации — в Spring Security, в фильтре, на шлюзе? Что ломается при неправильном порядке?'
  - id: preflight-is-not-security
    en: Does a preflight protect the API from a malicious client? What can and cannot be enforced with it?
    ru: Защищает ли предварительный запрос API от злонамеренного клиента? Что с его помощью можно и чего нельзя обеспечить?
  - id: preflight-diagnosis
    en: 'Walk through diagnosing a failing preflight - what you look at in DevTools, in what order, and what each clue tells you.'
    ru: 'Опиши диагностику падающего предварительного запроса — на что смотришь в DevTools, в каком порядке и о чём говорит каждая подсказка.'
  - id: same-origin-and-proxy
    en: Why does routing the API through the same origin (a dev-server proxy or a gateway path) make preflights disappear entirely?
    ru: Почему если провести API через тот же origin (прокси dev-сервера или путь на шлюзе), предварительные запросы исчезают полностью?
