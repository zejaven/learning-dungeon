bossFight:
  # I. Implementation Strategies and Risk Management
  - id: big-bang-vs-staged
    en: 'Contrast the "Big Bang" migration (Direct Cutover) with a Staged Deployment. Why does the latter significantly reduce the "blast radius" of potential failures despite its increased complexity?'
    ru: 'Сопоставьте миграцию «Big Bang» (Direct Cutover) с поэтапным развёртыванием. Почему последнее значительно уменьшает «радиус поражения» (blast radius) потенциальных сбоев, несмотря на возросшую сложность?'
  - id: coexistence-engineering
    en: 'In a phased rollout, why is co-existence engineering — such as temporary redistribution between different routing protocols like EIGRP and OSPF — necessary?'
    ru: 'Почему при поэтапном развёртывании необходим co-existence engineering — например, временная redistribution между разными протоколами маршрутизации вроде EIGRP и OSPF?'
  - id: operational-continuity
    en: 'How does an effective implementation strategy balance operational continuity against the project risks inherent in high-risk operational phases?'
    ru: 'Как эффективная стратегия внедрения балансирует операционную непрерывность и проектные риски, присущие высокорисковым операционным фазам?'
  - id: planning-without-assessment
    en: 'Discuss the consequences of planning without assessment. What are the long-term impacts of skipping site surveys on post-install rework and capacity bottlenecks?'
    ru: 'Обсудите последствия планирования без обследования. Каковы долгосрочные последствия пропуска site survey для переделок после монтажа и узких мест по ёмкости?'
  - id: ppdioo-implement-phase
    en: 'How does the Implement phase act as a bridge in the Cisco PPDIOO lifecycle, transforming design specifications into a functioning reality?'
    ru: 'Как фаза Implement выполняет роль моста в жизненном цикле Cisco PPDIOO, превращая спецификации дизайна в работающую реальность?'
  # II. The Staging Lab and Device Initialisation
  - id: staging-doa-risks
    en: 'Why is it considered a best practice to pass all hardware through a staging lab to mitigate "Dead on Arrival" (DoA) risks before site installation?'
    ru: 'Почему лучшей практикой считается пропуск всего оборудования через staging-лабораторию для снижения рисков «Dead on Arrival» (DoA) перед установкой на площадке?'
  - id: hardware-burn-in
    en: 'What is the specific objective of a 24-72 hour hardware burn-in, and what components are most likely to fail during this early lifecycle window?'
    ru: 'Какова конкретная цель 24–72-часового прогона оборудования (burn-in) и какие компоненты чаще всего отказывают в этом раннем окне жизненного цикла?'
  - id: gold-star-firmware
    en: 'Why must every device be flashed with a vetted "Gold Star" operating system during the staging process?'
    ru: 'Почему каждое устройство должно быть прошито проверенной «Gold Star» операционной системой в процессе staging?'
  - id: preconfiguration-validation
    en: 'How does applying vetted scripts via console in a lab environment prevent deadlocks or syntax errors from reaching the field?'
    ru: 'Как применение проверенных скриптов через консоль в лабораторной среде предотвращает попадание deadlock и синтаксических ошибок «в поле»?'
  # III. Security Hardening during Deployment
  - id: baking-in-security
    en: 'Discuss the philosophy of "baking in" security during implementation versus "bolting it on" later. How do standardised templates or IaC facilitate this?'
    ru: 'Обсудите философию «запекания» безопасности на этапе внедрения против «прикручивания» её потом. Как стандартизованные шаблоны или IaC этому способствуют?'
  - id: management-plane-hardening
    en: 'Why is it critical to enforce cryptographic access control (SSHv2/HTTPS) and relegate local accounts to "break-glass" mechanisms only?'
    ru: 'Почему критически важно принудительно применять криптографический контроль доступа (SSHv2/HTTPS) и оставлять локальные учётные записи только как механизмы «break-glass»?'
  - id: centralised-aaa-rbac
    en: 'How does integrating TACACS+ or RADIUS during deployment enable effective Role-Based Access Control (RBAC)?'
    ru: 'Как интеграция TACACS+ или RADIUS при развёртывании обеспечивает эффективный Role-Based Access Control (RBAC)?'
  - id: copp-bpdu-guard
    en: 'How do Control Plane Protection (CoPP) and STP defences, such as BPDU Guard, prevent loop-induced collapses or CPU exhaustion?'
    ru: 'Как Control Plane Protection (CoPP) и защита STP, например BPDU Guard, предотвращают коллапсы из-за петель и исчерпание CPU?'
  - id: black-hole-vlan
    en: 'Why should unused physical ports be administratively shut down and assigned to an isolated "black-hole" VLAN?'
    ru: 'Почему неиспользуемые физические порты должны быть административно выключены и назначены в изолированный «black-hole» VLAN?'
  # IV. Structured Testing and Validation
  - id: dvt-vs-nrfu
    en: 'Contrast Design Verification Testing (DVT), which occurs during the design phase, with Network Ready for Use (NRFU) testing performed on greenfield infrastructure.'
    ru: 'Сопоставьте Design Verification Testing (DVT), проводимый на фазе дизайна, с тестированием Network Ready for Use (NRFU), выполняемым на greenfield-инфраструктуре.'
  - id: uat-business-gap
    en: 'While functional testing asks "Does it work?", UAT asks "Does it work for the business?" How does this bridge the gap between technical and operational needs?'
    ru: 'Если функциональное тестирование спрашивает «Работает ли это?», то UAT спрашивает «Работает ли это для бизнеса?». Как это ликвидирует разрыв между техническими и операционными потребностями?'
  - id: interoperability-testing
    en: 'Why is interoperability testing vital when deploying a realistic setup involving elements from different vendors, such as Cisco and Aruba?'
    ru: 'Почему interoperability-тестирование жизненно важно при развёртывании реалистичной конфигурации с элементами разных вендоров, например Cisco и Aruba?'
  - id: backout-plan-testing
    en: 'Why is it essential to test a backout plan alongside the primary migration plan before a scheduled maintenance window?'
    ru: 'Почему необходимо тестировать план отката (backout plan) вместе с основным планом миграции до запланированного окна обслуживания?'
  # V. Performance Benchmarking and Automation
  - id: latency-jitter-kpis
    en: 'Discuss the relationship between Latency and Jitter in real-time interactions. Why are synthetic monitoring tools necessary to measure these proactively?'
    ru: 'Обсудите связь между latency и jitter во взаимодействиях реального времени. Почему для их проактивного измерения необходимы инструменты синтетического мониторинга?'
  - id: iac-cicd-digital-twin
    en: 'How do Infrastructure as Code (IaC) and CI/CD pipelines allow for reliable configuration at scale and the validation of changes against a "digital twin" before production?'
    ru: 'Как Infrastructure as Code (IaC) и CI/CD-пайплайны обеспечивают надёжную конфигурацию в масштабе и валидацию изменений на «цифровом двойнике» до продакшена?'
