summary:
  en: >
    A build turns a source tree into something you can deploy, and every answer to
    'what are the ways' is a choice on four independent axes. Which tool drives it:
    javac by hand, Ant, Maven with its fixed lifecycle, Gradle with an incremental
    task graph and a build cache, or Bazel-style hermetic builds for a monorepo.
    What comes out: a thin library jar, a fat runnable jar, a war for an app
    server, an OCI image, or a GraalVM native binary. Where it runs: the IDE's
    incremental compiler for the inner loop, your machine, inside a multi-stage
    container build, or on a clean CI agent — which is the only one whose output
    should ever reach production. And what makes it trustworthy: pinned versions,
    an internal repository proxy, honest cache keys, reproducible output, and
    provenance such as an SBOM and signatures. The rule that ties them together is
    build once, promote the same artifact everywhere.
  ru: >
    Сборка превращает дерево исходников в то, что можно развернуть, и любой ответ
    на вопрос «какие есть способы» — это выбор по четырём независимым осям. Чем
    собираем: голым javac, Ant, Maven с его фиксированным жизненным циклом, Gradle
    с инкрементальным графом задач и кешем сборки или герметичными сборками уровня
    Bazel для монорепозитория. Что получается на выходе: тонкий jar-библиотека,
    исполняемый fat jar, war для сервера приложений, OCI-образ или нативный
    бинарник GraalVM. Где выполняется: инкрементальный компилятор IDE для быстрого
    цикла разработки, ваша машина, многоэтапная сборка внутри контейнера или
    чистый агент CI — и только его результат должен попадать в production. И что
    делает сборку заслуживающей доверия: зафиксированные версии, внутренний
    прокси-репозиторий, честные ключи кеша, воспроизводимый результат и
    происхождение артефакта — SBOM и подписи. Связывает всё это правило: собрать
    один раз и продвигать один и тот же артефакт дальше.

