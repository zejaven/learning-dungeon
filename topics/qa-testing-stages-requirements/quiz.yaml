bossFight:
  # Testing stages
  - id: seven-stages-in-order
    en: 'Name the seven stages of software testing in order, from documentation analysis to product maintenance.'
    ru: 'Назовите семь этапов тестирования ПО по порядку — от анализа документации до сопровождения продукта.'
  - id: documentation-analysis-stage
    en: 'What exactly does a QA engineer do at the documentation analysis stage, and why does testing start there rather than at execution?'
    ru: 'Что конкретно делает QA-инженер на этапе анализа документации и почему тестирование начинается именно там, а не на этапе выполнения?'
  - id: planning-vs-design
    en: 'How does the "estimation and planning" stage differ from "test scenario design"? What artifacts are produced at each?'
    ru: 'Чем этап «оценка и планирование» отличается от «разработки сценариев тестирования»? Какие артефакты создаются на каждом?'
  - id: post-release-stages
    en: 'Why are production release support and product maintenance considered stages of testing, and what does QA actually do there?'
    ru: 'Почему поддержка установки в прод и сопровождение продукта считаются этапами тестирования и что там реально делает QA?'
  - id: stages-vs-levels-vs-sdlc
    en: 'Explain the difference between testing stages, testing levels (unit, integration, system, acceptance), and SDLC phases.'
    ru: 'Объясните разницу между этапами тестирования, уровнями тестирования (unit, integration, system, acceptance) и фазами SDLC.'
  # Requirements quality criteria
  - id: six-criteria
    en: 'List the six quality criteria for requirements and give a one-sentence definition of each.'
    ru: 'Перечислите шесть критериев качества требований и дайте определение каждого одним предложением.'
  - id: bad-requirement-examples
    en: '"The system must be fast and user-friendly." Which requirements quality criteria does this statement violate, and how would you rewrite it?'
    ru: '«Система должна быть быстрой и удобной». Какие критерии качества требований нарушает эта формулировка и как бы вы её переписали?'
  - id: unambiguity-vs-testability
    en: 'How do the criteria of unambiguity and testability differ? Can a requirement be unambiguous but still untestable?'
    ru: 'Чем отличаются критерии однозначности и тестируемости? Может ли требование быть однозначным, но нетестируемым?'
