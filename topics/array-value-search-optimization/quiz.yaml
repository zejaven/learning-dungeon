# Theory topic: no missions because there is no practice editor.
bossFight:
  - id: unsorted-array-cost
    en: Why is searching by value in an unsorted array O(n)?
    ru: Почему поиск по значению в неотсортированном массиве стоит O(n)?
  - id: sorting-and-binary-search
    en: When does sorting an array and using binary search make sense?
    ru: Когда имеет смысл отсортировать массив и использовать binary search?
  - id: hashset-membership
    en: How does a HashSet speed up repeated membership checks, and what does it cost?
    ru: Как HashSet ускоряет повторные проверки наличия и чем за это приходится платить?
  - id: hashmap-indexes
    en: How would you store indexes if values can repeat?
    ru: Как хранить индексы, если значения могут повторяться?
  - id: choose-approach
    en: Given one lookup, many lookups, frequent updates, and range queries, how would you choose between linear scan, sorting, hashing, and a tree-based structure?
    ru: Как выбрать между линейным проходом, сортировкой, hashing и древовидной структурой для одного поиска, многих поисков, частых обновлений и запросов по диапазону?
