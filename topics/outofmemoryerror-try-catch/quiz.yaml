# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: should-catch-and-continue
    en: 'Does it make sense to catch OutOfMemoryError and continue normal program execution?'
    ru: 'Имеет ли смысл ловить OutOfMemoryError и продолжать обычное выполнение программы?'
  - id: why-continuing-is-dangerous
    en: 'Why is continuing after OutOfMemoryError dangerous even if catch technically works?'
    ru: 'Почему продолжать работу после OutOfMemoryError опасно, даже если catch технически сработал?'
  - id: acceptable-handling
    en: 'When can catching OutOfMemoryError be acceptable, and what should the handler do?'
    ru: 'Когда перехват OutOfMemoryError может быть допустим и что должен делать обработчик?'
  - id: production-recovery
    en: 'How should a production service usually recover from OutOfMemoryError?'
    ru: 'Как production-сервис обычно должен восстанавливаться после OutOfMemoryError?'
  - id: catch-throwable-risk
    en: 'What is the risk of catching Throwable or Error in broad application code?'
    ru: 'В чём риск широкого перехвата Throwable или Error в прикладном коде?'
  - id: diagnostics
    en: 'What diagnostics would you want when OutOfMemoryError happens?'
    ru: 'Какая диагностика нужна при возникновении OutOfMemoryError?'
