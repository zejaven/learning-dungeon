# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: resolve-a-property
    title:
      en: Resolve one property
      ru: Разреши одно свойство
    goal:
      en: Ask the Environment for a key and watch the walk stop at the first source that defines it.
      ru: Запроси у Environment ключ и посмотри, как обход останавливается на первом источнике, где он задан.
    event: PROPERTY_RESOLVED
  - id: let-the-variable-win
    title:
      en: Beat application.properties
      ru: Победи application.properties
    goal:
      en: Set the same key in application.properties and in an environment variable, then see which one the application gets.
      ru: Задай один и тот же ключ в application.properties и в переменной окружения, а затем посмотри, что получит приложение.
    event: PROPERTY_OVERRIDDEN
  - id: bind-a-shouty-name
    title:
      en: Bind SPRING_DATASOURCE_URL
      ru: Свяжи SPRING_DATASOURCE_URL
    goal:
      en: Override a dotted key with an UPPER_SNAKE_CASE variable and watch relaxed binding match the two names.
      ru: Переопредели ключ с точками переменной в UPPER_SNAKE_CASE и посмотри, как relaxed binding сопоставит два имени.
    event: RELAXED_BINDING
  - id: raw-getenv
    title:
      en: Ask the OS directly
      ru: Спроси у ОС напрямую
    goal:
      en: 'Call System.getenv with a dotted key and compare the answer with the Environment''s: relaxed binding is Spring''s, not the JVM''s.'
      ru: 'Вызови System.getenv с ключом через точки и сравни ответ с ответом Environment: relaxed binding принадлежит Spring, а не JVM.'
    event: SYSTEM_GETENV
  - id: switch-a-profile-on
    title:
      en: Switch a profile on
      ru: Включи профиль
    goal:
      en: Activate a profile and watch application-{profile}.properties go from "not read at all" to "above the plain file".
      ru: Активируй профиль и посмотри, как application-{profile}.properties переходит из «не читается вообще» в «выше обычного файла».
    event: PROFILE_ACTIVATED
  - id: miss-a-key
    title:
      en: Ask for a key nobody set
      ru: Запроси ключ, который никто не задал
    goal:
      en: Look up a key no source defines and see what a misspelled variable name really produces.
      ru: Запроси ключ, не заданный ни одним источником, и увидь, к чему на самом деле приводит опечатка в имени переменной.
    event: PROPERTY_MISSING
  - id: read-the-ladder
    title:
      en: Print the whole ladder
      ru: Выведи всю лестницу
    goal:
      en: Report every rank at once, from inlined test properties down to setDefaultProperties.
      ru: Выведи сразу все ранги — от свойств, вписанных в тест, до setDefaultProperties.
    event: PRECEDENCE_REPORT

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: which-wins
    en: Which has higher priority — a value in application.properties or an environment variable? Why is it that way round?
    ru: Что приоритетнее — значение в application.properties или переменная окружения? Почему именно так?
  - id: how-resolution-works
    en: What is a PropertySource, and what exactly does the Environment do when someone calls getProperty("server.port")?
    ru: Что такое PropertySource и что именно делает Environment, когда кто-то вызывает getProperty("server.port")?
  - id: full-order
    en: List the property sources Spring Boot consults, from highest priority to lowest. Which of them can you change at deploy time without touching the artefact?
    ru: Перечисли источники свойств, которые опрашивает Spring Boot, от самого приоритетного к наименее. Какие из них можно изменить при деплое, не трогая артефакт?
  - id: relaxed-binding
    en: How does the variable SPRING_DATASOURCE_URL end up bound to the property spring.datasource.url? What are the exact naming rules?
    ru: Как переменная SPRING_DATASOURCE_URL оказывается связанной со свойством spring.datasource.url? Каковы точные правила именования?
  - id: getenv-vs-getproperty
    en: Why does System.getenv("server.port") return null in a process where environment.getProperty("server.port") returns a value?
    ru: Почему System.getenv("server.port") возвращает null в том же процессе, где environment.getProperty("server.port") возвращает значение?
  - id: per-key-or-per-file
    en: If an environment variable overrides one key from application.properties, what happens to the other keys in that file?
    ru: Если переменная окружения переопределяет один ключ из application.properties, что происходит с остальными ключами этого файла?
  - id: inside-vs-outside-the-jar
    en: You put an application.properties next to the jar as well as inside it. Which one is used, and which locations does Spring Boot search?
    ru: Ты положил application.properties и рядом с jar, и внутрь него. Какой из них используется и какие места ищет Spring Boot?
  - id: profile-priority
    en: Where does application-prod.properties sit in the order relative to application.properties and to environment variables? What happens to it when the profile is not active?
    ru: Где application-prod.properties находится в порядке относительно application.properties и переменных окружения? Что с ним происходит, если профиль не активен?
  - id: property-source-annotation
    en: A colleague adds @PropertySource("classpath:legacy.properties") expecting it to override application.properties. What actually happens?
    ru: Коллега добавляет @PropertySource("classpath:legacy.properties"), рассчитывая переопределить application.properties. Что произойдёт на самом деле?
  - id: command-line-vs-env
    en: Both '--server.port=9000' on the command line and SERVER_PORT=8000 in the environment are set. Which one wins, and can you disable the command line source?
    ru: Заданы и '--server.port=9000' в командной строке, и SERVER_PORT=8000 в окружении. Что победит и можно ли отключить источник аргументов командной строки?
  - id: spring-application-json
    en: What is SPRING_APPLICATION_JSON, where does it sit in the order, and when would you reach for it?
    ru: Что такое SPRING_APPLICATION_JSON, где он стоит в порядке приоритетов и когда его стоит применять?
  - id: value-vs-configurationproperties
    en: Do @Value and @ConfigurationProperties resolve values differently? Does either of them change the precedence?
    ru: Разрешают ли @Value и @ConfigurationProperties значения по-разному? Меняет ли кто-то из них приоритеты?
  - id: debug-an-ignored-override
    en: You set SPRING_DATASOURCE_URL in Kubernetes and the app still uses the URL from application.properties. Walk through how you would find the cause.
    ru: Ты задал SPRING_DATASOURCE_URL в Kubernetes, а приложение всё равно использует URL из application.properties. Опиши, как будешь искать причину.
  - id: inspect-at-runtime
    en: How would you find out, in a running application, which property source a particular value actually came from?
    ru: Как в работающем приложении выяснить, из какого именно источника свойств пришло конкретное значение?
  - id: test-properties
    en: Why does an integration test ignore the environment variables set on the developer's machine? Which mechanisms let a test pin its own configuration?
    ru: Почему интеграционный тест игнорирует переменные окружения, заданные на машине разработчика? Какие механизмы позволяют тесту зафиксировать свою конфигурацию?
  - id: same-image-many-environments
    en: You build one Docker image and deploy it to dev, staging and production. How does each deployment get its own database URL and password?
    ru: Ты собираешь один Docker-образ и деплоишь его в dev, staging и прод. Как каждый деплой получает свои URL базы и пароль?
  - id: secrets-in-env-vars
    en: Is an environment variable a good place for a database password? What are the drawbacks and what would you use instead?
    ru: Хорошее ли место для пароля от базы — переменная окружения? Какие у этого недостатки и что использовать вместо неё?
  - id: yaml-multi-document
    en: In a single application.yaml with several '---' documents and 'spring.config.activate.on-profile', which document wins when two of them set the same key?
    ru: В одном application.yaml с несколькими документами через '---' и 'spring.config.activate.on-profile' — какой документ победит, если два задают один ключ?
  - id: refresh-at-runtime
    en: An environment variable changes after the application has started. Does the running application see the new value? What would make it?
    ru: Переменная окружения изменилась после старта приложения. Увидит ли работающее приложение новое значение? Что нужно, чтобы увидело?
  - id: list-and-map-overrides
    en: How do you override a list property such as 'app.hosts[0]' with an environment variable, and what happens to the other elements of the list?
    ru: Как переопределить свойство-список вроде 'app.hosts[0]' переменной окружения и что произойдёт с остальными элементами списка?
