missions:
  - id: map-the-areas
    title:
      en: Map the areas
      ru: Составь карту областей
    goal:
      en: Boot a JVM instance and see all its runtime data areas at once.
      ru: Запусти инстанс JVM и увидь сразу все его области данных времени выполнения.
    event: AREAS_SCENE
  - id: fill-metaspace
    title:
      en: Fill Metaspace
      ru: Заполни Metaspace
    goal:
      en: Load a class and see its metadata land in Metaspace, outside the heap.
      ru: Загрузи класс и увидь, что его метаданные попадают в Metaspace, вне кучи.
    event: CLASS_LOADED
  - id: allocate-in-the-one-heap
    title:
      en: Allocate in the one heap
      ru: Размести в единственной куче
    goal:
      en: Run new and see the object itself land in the single shared heap.
      ru: Выполни new и увидь, что сам объект попадает в единственную общую кучу.
    event: OBJECT_ALLOCATED
  - id: pool-a-literal
    title:
      en: Pool a literal
      ru: Помести литерал в пул
    goal:
      en: Intern a string literal and find it in the string pool inside the heap.
      ru: Интернируй строковый литерал и найди его в пуле строк внутри кучи.
    event: STRING_INTERNED
  - id: warm-the-code-cache
    title:
      en: Warm the code cache
      ru: Прогрей кэш кода
    goal:
      en: Let the JIT compile a hot method and store its native code in the code cache.
      ru: Дай JIT скомпилировать горячий метод и положить его нативный код в кэш кода.
    event: JIT_COMPILED
  - id: give-a-thread-its-own-areas
    title:
      en: Give a thread its own areas
      ru: Дай потоку свои области
    goal:
      en: Start a thread and watch its own stack, PC register and native method stack appear.
      ru: Запусти поток и увидь, как появляются его собственные стек, PC-регистр и стек нативных методов.
    event: THREAD_STARTED
  - id: push-a-frame
    title:
      en: Push a frame
      ru: Положи кадр
    goal:
      en: Call a method and push a frame with its locals onto that thread's own stack.
      ru: Вызови метод и положи кадр с его локальными переменными на стек именно этого потока.
    event: FRAME_PUSHED
  - id: count-the-areas
    title:
      en: Count the areas
      ru: Посчитай области
    goal:
      en: Count how many of each area this JVM instance has right now.
      ru: Посчитай, сколько областей каждого вида есть у этого инстанса JVM прямо сейчас.
    event: AREA_COUNT

bossFight:
  - id: list-the-runtime-areas
    en: What memory areas does a running JVM have, and what is stored in each?
    ru: Какие области памяти есть у работающей JVM и что хранится в каждой из них?
  - id: how-many-heaps-and-stacks-in-an-app
    en: How many heaps and how many stacks does one running application have?
    ru: Сколько куч и сколько стеков у одного работающего приложения?
  - id: which-areas-are-shared
    en: Which memory areas are shared between threads and which are private to a thread, and why does that split exist?
    ru: Какие области памяти общие для потоков, а какие приватны для потока, и почему существует такое разделение?
  - id: heap-vs-metaspace
    en: What is the difference between the heap and Metaspace, and what happened to PermGen?
    ru: В чём разница между кучей и Metaspace и что стало с PermGen?
  - id: where-do-strings-live
    en: Where does the string pool live, and how is it different from an object created with new String(...)?
    ru: Где находится пул строк и чем он отличается от объекта, созданного через new String(...)?
  - id: areas-and-memory-errors
    en: 'Which memory area is exhausted by StackOverflowError, which by OutOfMemoryError: Java heap space, and which by OutOfMemoryError: Metaspace?'
    ru: 'Какая область памяти исчерпана при StackOverflowError, какая при OutOfMemoryError: Java heap space и какая при OutOfMemoryError: Metaspace?'
  - id: pc-register-and-native-stack
    en: What is the PC register for, and what is the native method stack used for?
    ru: Для чего нужен PC-регистр и для чего используется стек нативных методов?
  - id: sizing-the-areas
    en: Which JVM flags size the heap, a thread stack and Metaspace, and what happens when you start thousands of threads?
    ru: Какие флаги JVM задают размер кучи, стека потока и Metaspace, и что произойдёт, если запустить тысячи потоков?
