# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: stage-event
    title:
      en: Stage your first event
      ru: Запиши первое событие
    goal:
      en: Commit a business change and stage an event in the outbox in one transaction.
      ru: Зафиксируй бизнес-изменение и запиши событие в outbox в одной транзакции.
    event: TRANSACTION_COMMITTED
  - id: publish-event
    title:
      en: Publish via the relay
      ru: Опубликуй через релей
    goal:
      en: Run the relay so a PENDING outbox event is published to the broker.
      ru: Запусти релей, чтобы PENDING-событие из outbox было опубликовано в брокер.
    event: EVENT_PUBLISHED
  - id: dual-write-loss
    title:
      en: See a dual write lose an event
      ru: Увидь, как двойная запись теряет событие
    goal:
      en: Skip the outbox and watch a crash between commit and publish lose the event.
      ru: Откажись от outbox и посмотри, как сбой между фиксацией и публикацией теряет событие.
    event: DUAL_WRITE_LOST
  - id: redelivery-trap
    title:
      en: Trip the redelivery trap
      ru: Сработай на ловушке повторной доставки
    goal:
      en: Crash the relay after sending so it republishes the same event as a duplicate.
      ru: Уроним релей после отправки, чтобы он переотправил то же событие как дубликат.
    event: EVENT_REDELIVERED

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: problem-dualwrite
    en: What problem does the Outbox pattern solve, and what is the dual-write problem?
    ru: Какую проблему решает паттерн Outbox и в чём состоит проблема двойной записи?
  - id: why-not-one-tx
    en: Why can't you just write to the database and publish to the broker in one transaction?
    ru: Почему нельзя просто записать в базу и опубликовать в брокер в одной транзакции?
  - id: same-transaction
    en: Why must the business change and the outbox row be written in the same local transaction?
    ru: Почему бизнес-изменение и строку outbox нужно писать в одной локальной транзакции?
  - id: relay-delivery
    en: How does the relay get events from the outbox to the broker — polling vs change-data-capture?
    ru: Как релей доставляет события из outbox в брокер — опрос или change-data-capture?
  - id: at-least-once
    en: Why is the relay at-least-once, and what must consumers do about duplicates?
    ru: Почему релей работает по принципу at-least-once и что потребители должны делать с дубликатами?
  - id: vs-inbox
    en: How does the Outbox pattern relate to the Inbox pattern?
    ru: Как паттерн Outbox связан с паттерном Inbox?
