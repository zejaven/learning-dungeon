id: critical-section
languages: [en, ru]
title:
  en: Critical Section
  ru: Критическая секция
category:
  en: Java Core / Concurrency
  ru: Java Core / Многопоточность
type: CONCURRENCY
mode: trace
summary:
  en: >
    What a critical section is, why shared mutable state must be protected by the
    same lock, how competing threads wait their turn, and how a lost update
    appears when read-modify-write code runs without synchronization.
  ru: >
    Что такое критическая секция, почему общее изменяемое состояние нужно
    защищать одним и тем же lock, как конкурирующие threads ждут своей очереди и
    как возникает потерянное обновление, если read-modify-write выполняется без
    синхронизации.
categoryId: concurrency
difficulty: 1
catalogId: concurrency-1
style: Real world
aiProvider: codex
aiModel: gpt-5.5

primitives:
  - ArrayGrid
  - LinkedNodes
  - BoxGroup
  - EventLog

defaultExample: one-thread

examples:
  - id: one-thread
    title:
      en: One protected update
      ru: Одно защищённое обновление
    file: 01-one-thread.java
    explanation:
      en: >
        One thread enters the critical section, reads the shared counter, writes
        the new value, and releases the lock.
      ru: >
        Один thread входит в критическую секцию, читает общий counter, записывает
        новое значение и освобождает lock.
  - id: waiting-thread
    title:
      en: Second thread waits
      ru: Второй thread ждёт
    file: 02-waiting-thread.java
    explanation:
      en: >
        T2 tries to enter while T1 owns the lock. T2 is queued until T1 exits,
        then receives the lock and safely updates the counter.
      ru: >
        T2 пытается войти, пока lock принадлежит T1. T2 ждёт в очереди, пока T1
        не выйдет, затем получает lock и безопасно обновляет counter.
  - id: lost-update
    title:
      en: Lost update without lock
      ru: Потерянное обновление без lock
    file: 03-lost-update.java
    explanation:
      en: >
        Two threads read the same old value without synchronization. Their writes
        overwrite each other, so one increment disappears.
      ru: >
        Два threads без синхронизации читают одно и то же старое значение. Их
        записи перезаписывают друг друга, поэтому один increment пропадает.
  - id: small-section
    title:
      en: Keep it small
      ru: Держи её короткой
    file: 04-small-section.java
    explanation:
      en: >
        Work that does not touch shared state stays outside the critical section.
        Only the read-modify-write part holds the lock.
      ru: >
        Работа, которая не трогает общее состояние, остаётся вне критической
        секции. Lock удерживается только на части read-modify-write.
  - id: two-safe-increments
    title:
      en: Two safe increments
      ru: Два безопасных increment
    file: 05-two-safe-increments.java
    explanation:
      en: >
        T1 and T2 both increment the same counter, but the critical section makes
        the final value deterministic.
      ru: >
        T1 и T2 оба увеличивают один counter, но критическая секция делает
        итоговое значение детерминированным.

assistantExample:
  en: 'e.g. What exactly is a critical section, and why does it need a lock?'
  ru: 'например: Что такое критическая секция и зачем ей нужен lock?'

missionsFile: quiz.yaml
