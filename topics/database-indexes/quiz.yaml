# Theory topic: no missions (there is no practice editor) - only a Boss Fight.
bossFight:
  - id: define-index
    en: What is a database index, and what problem does it solve?
    ru: Что такое индекс в базе данных и какую проблему он решает?
  - id: btree-lookup
    en: How does a B-tree index help a database find matching rows?
    ru: Как B-tree индекс помогает базе данных находить подходящие строки?
  - id: selectivity
    en: What is index selectivity, and why might an index on a boolean column be weak?
    ru: Что такое селективность индекса и почему индекс по boolean-колонке может быть слабым?
  - id: composite-order
    en: Why does column order matter in a composite index?
    ru: Почему порядок колонок важен в составном индексе?
  - id: read-write-tradeoff
    en: Why can indexes speed up reads but slow down writes?
    ru: Почему индексы могут ускорять чтение, но замедлять запись?
  - id: covering-index
    en: What is a covering index, and when can it avoid reading the table row?
    ru: Что такое covering index и когда он позволяет не читать строку таблицы?
  - id: explain-not-used
    en: Why might the database choose not to use an index even when one exists?
    ru: Почему база данных может не использовать индекс, даже если он существует?
