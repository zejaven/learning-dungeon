bossFight:
  # I. Foundational Principles and Strategic Importance
  - id: translating-the-abstract
    en: 'How does physical design serve as the process of translating abstract logical architectures (like IP schemas and protocols) into tangible, real-world infrastructure?'
    ru: 'Как физический дизайн выполняет роль процесса перевода абстрактных логических архитектур (например, схем IP и протоколов) в осязаемую инфраструктуру реального мира?'
  - id: cabling-investment-rule
    en: 'If cabling accounts for less than 10% of total network cost but outlives most other components for 16+ years, why is it often overlooked in initial budgeting?'
    ru: 'Если кабельная система составляет менее 10% общей стоимости сети, но переживает большинство остальных компонентов (16+ лет), почему её часто упускают при первоначальном бюджетировании?'
  - id: seventy-percent-problems
    en: 'Discuss the significance of the finding that nearly 70% of network-related problems are attributed to poor cabling techniques or component failures.'
    ru: 'Обсудите значимость вывода о том, что почти 70% сетевых проблем связаны с плохой техникой прокладки кабеля или отказами компонентов.'
  - id: codes-vs-standards
    en: 'Contrast the roles of Codes (the law), which focus on life safety like the National Electrical Code, with Standards (guidelines), which ensure vendor interoperability.'
    ru: 'Сопоставьте роли Codes (закон), сфокусированных на безопасности жизни, как National Electrical Code, и Standards (руководства), обеспечивающих совместимость вендоров.'
  # II. Structured Cabling Subsystems and Constraints
  - id: six-subsystems
    en: 'How does dividing physical design into six modular subsystems (from Entrance Facilities to the Work Area) simplify the management of a large-scale deployment?'
    ru: 'Как разделение физического дизайна на шесть модульных подсистем (от Entrance Facilities до Work Area) упрощает управление крупномасштабным развёртыванием?'
  - id: ninety-metre-rule
    en: 'Why must the permanent link for copper horizontal cabling be strictly limited to 90 metres, and what constitutes the remaining 10 metres of the total channel link?'
    ru: 'Почему permanent link медной горизонтальной кабельной подсистемы должен быть строго ограничен 90 метрами и из чего состоят оставшиеся 10 метров полного channel link?'
  - id: star-topology
    en: 'Why is a star topology mandated for horizontal cabling, and how does it improve troubleshooting compared to other physical layouts?'
    ru: 'Почему для горизонтальной кабельной подсистемы обязательна топология «звезда» и как она улучшает поиск неисправностей по сравнению с другими физическими схемами?'
  - id: entrance-facility-demarc
    en: 'Discuss the role of the Entrance Facility (EF) as the critical interface between the service provider and the internal building backbone.'
    ru: 'Обсудите роль Entrance Facility (EF) как критического интерфейса между провайдером услуг и внутренней магистралью здания.'
  # III. Media Selection and Performance Factors
  - id: fibre-backbone-emi
    en: 'Why is optical fibre the preferred medium for backbone cabling, and what specific advantages does its immunity to Electromagnetic Interference (EMI) provide?'
    ru: 'Почему оптоволокно — предпочтительная среда для магистральной кабельной подсистемы и какие конкретные преимущества даёт его невосприимчивость к электромагнитным помехам (EMI)?'
  - id: cat6-vs-cat6a
    en: 'Compare the use cases for Cat 6 versus Cat 6A. In what scenarios would the 100-metre 10 Gbps support of Cat 6A be required over Cat 6?'
    ru: 'Сравните сценарии применения Cat 6 и Cat 6A. В каких случаях потребуется поддержка 10 Гбит/с на 100 метрах у Cat 6A вместо Cat 6?'
  - id: smf-vs-mmf
    en: 'When designing a campus-wide link, why would an architect choose Single-mode Fibre (SMF) for virtually unlimited bandwidth over long distances?'
    ru: 'Почему при проектировании линка масштаба кампуса архитектор выберет Single-mode Fibre (SMF) ради практически неограниченной полосы на больших расстояниях?'
  - id: crosstalk-delay-skew
    en: 'How do factors like Crosstalk (NEXT) and Delay Skew degrade high-speed protocol performance, and how can proper termination techniques mitigate these?'
    ru: 'Как факторы вроде Crosstalk (NEXT) и Delay Skew ухудшают производительность высокоскоростных протоколов и как правильная техника терминирования может это смягчить?'
  # IV. Spatial Planning and Environmental Controls
  - id: mdf-hub-requirements
    en: 'Why must the Main Distribution Frame (MDF) be a dedicated, locked room, and what are the specific HVAC requirements for maintaining its temperature and humidity?'
    ru: 'Почему Main Distribution Frame (MDF) должен быть выделенным запираемым помещением и каковы конкретные требования HVAC к поддержанию его температуры и влажности?'
  - id: idf-stacking
    en: 'How does the "stacking" of Intermediate Distribution Frames (IDFs) floor-to-floor simplify vertical riser cabling?'
    ru: 'Как размещение Intermediate Distribution Frames (IDF) «в стопку» этаж над этажом упрощает вертикальную магистральную (riser) кабельную подсистему?'
  - id: rack-weight-distribution
    en: 'Why is it a mandatory safety practice to install the heaviest assets (like UPS and battery packs) at the absolute bottom of an equipment rack?'
    ru: 'Почему установка самых тяжёлых активов (например, UPS и батарейных блоков) в самый низ стойки — обязательная практика безопасности?'
  - id: hot-cold-aisle
    en: 'Explain the mechanics of the Hot/Cold Aisle design. How do blanking panels and physical isolation curtains contribute to lowering HVAC operational costs?'
    ru: 'Объясните механику дизайна hot/cold aisle. Как панели-заглушки и физические изолирующие шторы помогают снижать эксплуатационные расходы на HVAC?'
  # V. Installation, Safety, and Documentation
  - id: emi-separation
    en: 'Why is a minimum 5-inch separation required between data cables and high-voltage electrical lines, and why should they only cross at right angles?'
    ru: 'Почему требуется минимум 5 дюймов разнесения между кабелями данных и высоковольтными электрическими линиями и почему пересекаться они должны только под прямым углом?'
  - id: plenum-vs-riser
    en: 'Contrast Plenum-rated (CMP) jackets with Riser-rated (CMR) jackets. Why is CMP required for air-handling spaces?'
    ru: 'Сопоставьте оболочки класса Plenum (CMP) и класса Riser (CMR). Почему CMP обязателен для пространств воздухообмена?'
  - id: third-party-certification
    en: 'Beyond a simple wire-map, why is Third-Party Certification using multifunction scanners essential for validating that an installation meets TIA performance levels?'
    ru: 'Почему, помимо простого wire-map, сторонняя сертификация многофункциональными сканерами необходима для подтверждения того, что монтаж соответствует уровням производительности TIA?'
  - id: documentation-macs
    en: 'How do Rack Elevations and consistent ANSI/TIA-606 labelling for every cable end reduce the time required for future moves, adds, and changes (MACs)?'
    ru: 'Как rack elevations и последовательная маркировка каждого конца кабеля по ANSI/TIA-606 сокращают время будущих перемещений, добавлений и изменений (MAC)?'
