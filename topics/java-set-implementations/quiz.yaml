missions:
  - id: add-values
    title:
      en: 'Add unique values'
      ru: 'Добавь уникальные значения'
    goal:
      en: 'Run code that adds at least one new value and compare where it appears in each Set.'
      ru: 'Запусти код, который добавляет хотя бы одно новое значение, и сравни, где оно появляется в каждом Set.'
    event: SET_ADD
  - id: compare-iteration-order
    title:
      en: 'Compare iteration order'
      ru: 'Сравни порядок итерации'
    goal:
      en: 'Call showIterationOrder() and observe HashSet, LinkedHashSet and TreeSet side by side.'
      ru: 'Вызови showIterationOrder() и посмотри на HashSet, LinkedHashSet и TreeSet рядом.'
    event: SET_ITERATION_ORDER
  - id: duplicate-by-equality
    title:
      en: 'Trigger an equal duplicate'
      ru: 'Вызови равный дубликат'
    goal:
      en: 'Add the same value twice so every Set ignores the second add.'
      ru: 'Добавь одно и то же значение дважды, чтобы каждый Set проигнорировал второй add.'
    event: SET_DUPLICATE
  - id: comparator-duplicate
    title:
      en: 'Expose Comparator uniqueness'
      ru: 'Покажи уникальность Comparator'
    goal:
      en: 'Use a TreeSet Comparator that returns 0 for two different values and see TreeSet reject the second one.'
      ru: 'Используй Comparator для TreeSet, который возвращает 0 для двух разных значений, и посмотри, как TreeSet отвергает второе.'
    event: SET_TREESET_COMPARATOR_DUPLICATE
  - id: null-policy
    title:
      en: 'Check null handling'
      ru: 'Проверь обработку null'
    goal:
      en: 'Add null and compare HashSet, LinkedHashSet and naturally ordered TreeSet behavior.'
      ru: 'Добавь null и сравни поведение HashSet, LinkedHashSet и TreeSet с natural ordering.'
    event: SET_NULL_POLICY
  - id: membership-and-removal
    title:
      en: 'Check membership and removal'
      ru: 'Проверь наличие и удаление'
    goal:
      en: 'Call contains(...) or remove(...) and observe that all Sets answer membership, but use different internals.'
      ru: 'Вызови contains(...) или remove(...) и посмотри, что все Set проверяют наличие, но используют разные внутренние механизмы.'
    event: SET_CONTAINS
bossFight:
  - id: set-implementations
    en: 'Which Set implementations are commonly used in Java, and what is the main promise of HashSet, LinkedHashSet and TreeSet?'
    ru: 'Какие реализации Set часто используют в Java и какое главное обещание дают HashSet, LinkedHashSet и TreeSet?'
  - id: ordering-guarantees
    en: 'How does iteration order differ between HashSet, LinkedHashSet and TreeSet?'
    ru: 'Чем отличается порядок итерации у HashSet, LinkedHashSet и TreeSet?'
  - id: uniqueness-rules
    en: 'How do hash-based Sets decide uniqueness, and how does TreeSet decide it?'
    ru: 'Как хэш-реализации Set определяют уникальность и как это делает TreeSet?'
  - id: null-handling
    en: 'How do these Set implementations handle null values?'
    ru: 'Как эти реализации Set обрабатывают значения null?'
  - id: performance-choice
    en: 'What are the usual add/contains/remove complexities, and how do they affect which Set you choose?'
    ru: 'Какая обычная сложность add/contains/remove и как она влияет на выбор Set?'
  - id: comparator-trap
    en: 'Why can a TreeSet with a Comparator reject an object that is not equal() to the existing element?'
    ru: 'Почему TreeSet с Comparator может отвергнуть объект, который не equal() уже существующему элементу?'
