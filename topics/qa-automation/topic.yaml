summary:
  en: >
    When and why to automate testing, the PageObject pattern, what problem CI
    solves, Appium vs native mobile frameworks with their pros and cons,
    automating payments and analytics, Allure and ReportPortal reporting, the
    checklist of a good automated test (fixtures, atomicity, single assert, no
    flakiness), locator types, the night pizzeria mocking scenario, asserts and
    their kinds, flaky tests, and speeding up runs through parallelization and
    distributed execution.
  ru: >
    Когда и зачем автоматизировать тестирование, паттерн PageObject, какую
    проблему решает CI, Appium против нативных инструментов с плюсами и
    минусами, автоматизация оплаты и аналитики, отчёты Allure и ReportPortal,
    чек-лист хорошего автотеста (фикстуры, атомарность, один assert, без
    флакинесса), виды локаторов, задача про пиццерию ночью и мокирование
    данных, assert и его виды, flaky-тесты, ускорение прогонов —
    параллелизация и распределённый запуск.

