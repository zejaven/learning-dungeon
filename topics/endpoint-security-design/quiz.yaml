# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: serve-one-request
    title:
      en: Get one request served
      ru: Добейся успешного запроса
    goal:
      en: Send a request that satisfies every gate its rule configured and reaches the handler.
      ru: Отправь запрос, который удовлетворяет всем проверкам своего правила и доходит до обработчика.
    event: HANDLER_RAN
  - id: fail-closed
    title:
      en: Fail closed
      ru: Сломайся безопасно
    goal:
      en: Call an endpoint no rule mentions on an API that denies by default, and watch it refuse without anyone having predicted that path.
      ru: Обратись к эндпоинту, о котором не сказано ни в одном правиле, на API с запретом по умолчанию — и увидь отказ, которого никто заранее не предусматривал.
    event: DENIED_BY_DEFAULT
  - id: expose-an-endpoint
    title:
      en: Expose an endpoint by accident
      ru: Случайно открой эндпоинт
    goal:
      en: Call the same unmentioned endpoint on an API that permits by default and see it served with no identity at all.
      ru: Обратись к тому же неупомянутому эндпоинту на API с разрешением по умолчанию и увидь, как его обслуживают вообще без установленной личности.
    event: EXPOSED_BY_DEFAULT
  - id: shadow-a-rule
    title:
      en: Kill a rule with another rule
      ru: Убей правило другим правилом
    goal:
      en: Put a broad path pattern above a stricter one and watch the stricter rule become unreachable.
      ru: Поставь широкий шаблон пути выше более строгого и увидь, как строгое правило становится недостижимым.
    event: RULE_SHADOWED
  - id: get-a-401
    title:
      en: 'Earn a 401'
      ru: 'Заработай 401'
    goal:
      en: Call a protected endpoint with no credential at all and see authentication refuse before authorization is even asked.
      ru: Обратись к защищённому эндпоинту вообще без учётных данных и увидь, как аутентификация отказывает ещё до вопроса об авторизации.
    event: AUTHENTICATION_MISSING
  - id: get-a-403
    title:
      en: 'Earn a 403'
      ru: 'Заработай 403'
    goal:
      en: Call an endpoint with a valid token whose roles do not include the one the rule demands.
      ru: Обратись к эндпоинту с корректным токеном, в ролях которого нет требуемой правилом роли.
    event: ROLE_DENIED
  - id: reject-a-token
    title:
      en: Reject a token
      ru: Отклони токен
    goal:
      en: Send a token that fails one of the four checks — signature, issuer, audience or expiry.
      ru: Отправь токен, который проваливает одну из четырёх проверок — подпись, издателя, аудиторию или срок действия.
    event: TOKEN_REJECTED
  - id: accept-a-forgery
    title:
      en: Accept a forged token
      ru: Прими поддельный токен
    goal:
      en: Let an API decode a token without verifying its signature, and hand it claims the client wrote.
      ru: Позволь API декодировать токен без проверки подписи и передай ему поля, которые вписал клиент.
    event: TOKEN_NOT_VERIFIED
  - id: hit-a-scope-limit
    title:
      en: Run into a scope
      ru: Упрись в scope
    goal:
      en: Use a read-only token on an endpoint that requires a write scope, even though the user themselves is allowed to write.
      ru: Используй токен только для чтения на эндпоинте, требующем scope на запись, хотя сам пользователь писать вправе.
    event: SCOPE_DENIED
  - id: read-another-users-record
    title:
      en: 'Read somebody else''s record'
      ru: 'Прочитай чужую запись'
    goal:
      en: Pass the endpoint check with a valid token and fetch a record that belongs to another user.
      ru: Пройди проверку эндпоинта с корректным токеном и получи запись, принадлежащую другому пользователю.
    event: OWNERSHIP_CHECK_MISSING
  - id: check-the-owner
    title:
      en: Check the owner
      ru: Проверь владельца
    goal:
      en: Add an object-level check and watch the same request refused with 404 instead of served.
      ru: Добавь проверку на уровне объекта и увидь, как тот же запрос отклоняется с кодом 404 вместо обслуживания.
    event: OWNERSHIP_DENIED
  - id: spoof-an-identity
    title:
      en: Become an admin with a header
      ru: Стань админом через заголовок
    goal:
      en: Make an API that trusts X-User-* headers accept an identity the client typed in themselves.
      ru: Заставь API, доверяющий заголовкам X-User-*, принять личность, которую клиент вписал сам.
    event: IDENTITY_HEADER_TRUSTED
  - id: leak-a-credential
    title:
      en: Leak a token on the wire
      ru: Засвети токен в сети
    goal:
      en: Send a credential over plain http and see that refusing the request does not un-send it.
      ru: Отправь учётные данные по обычному http и убедись, что отклонение запроса не отменяет его отправки.
    event: TRANSPORT_INSECURE
  - id: hit-the-rate-limit
    title:
      en: Hit the rate limit
      ru: Упрись в ограничение частоты
    goal:
      en: Repeat a request on a public endpoint until the limiter refuses it with 429.
      ru: Повторяй запрос к публичному эндпоинту, пока ограничитель не откажет с кодом 429.
    event: RATE_LIMITED

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: design-the-scheme
    en: How would you design a security scheme for your endpoints? Walk through it end to end.
    ru: Как бы ты спроектировал схему безопасности своих эндпоинтов? Пройди по ней от начала до конца.
  - id: authn-vs-authz
    en: What is the difference between authentication and authorization, and why must they run in that order?
    ru: В чём разница между аутентификацией и авторизацией и почему они должны выполняться именно в этом порядке?
  - id: status-401-vs-403
    en: When do you return 401 and when 403? What should a client do differently in each case?
    ru: Когда возвращать 401, а когда 403? Что клиент должен делать по-разному в каждом случае?
  - id: default-stance
    en: Should the default be deny or permit, and what does each choice do to the endpoint somebody adds next sprint?
    ru: Что должно быть по умолчанию — запрет или разрешение, и как каждый вариант поведёт себя с эндпоинтом, который добавят в следующем спринте?
  - id: jwt-vs-session
    en: Stateless JWT or a server-side session? What do you gain and what do you give up, and how do you revoke access in each?
    ru: Stateless JWT или серверная сессия? Что выигрываешь и что теряешь и как в каждом случае отзывать доступ?
  - id: token-validation
    en: What exactly do you validate on an incoming JWT before you trust a single claim in it?
    ru: Что именно ты проверяешь во входящем JWT, прежде чем доверять хоть одному его полю?
  - id: roles-vs-scopes
    en: What is the difference between a role and a scope? Give a case where the user is allowed but the token is not.
    ru: В чём разница между ролью и scope? Приведи случай, когда пользователю можно, а токену — нельзя.
  - id: object-level-authorization
    en: A user changes the id in /api/orders/42 to another id and gets someone else's data. Which check is missing and where does it belong?
    ru: Пользователь меняет идентификатор в /api/orders/42 на чужой и получает чужие данные. Какой проверки не хватает и где её место?
  - id: identity-headers
    en: A service takes the caller from an X-User-Id header. When is that acceptable, and what must be true of the network and the gateway?
    ru: Сервис берёт вызывающего из заголовка X-User-Id. Когда это допустимо и что должно быть верно про сеть и шлюз?
  - id: gateway-or-service
    en: In a microservice system, what belongs at the gateway and what must every service still enforce for itself?
    ru: В микросервисной системе что относится к шлюзу, а что каждый сервис обязан обеспечивать сам?
  - id: service-to-service
    en: How do services authenticate to each other? Compare mTLS, service tokens and a shared secret.
    ru: Как сервисы аутентифицируются друг перед другом? Сравни mTLS, сервисные токены и общий секрет.
  - id: where-to-store-tokens
    en: Where should a browser keep an access token — localStorage or a cookie? What does each choice expose you to?
    ru: Где браузеру хранить токен доступа — в localStorage или в куке? Чему тебя подставляет каждый вариант?
  - id: csrf-and-cors
    en: Which parts of your scheme deal with CSRF, and does a CORS policy help? What changes if you authenticate with cookies instead of a header?
    ru: Какие части твоей схемы отвечают за CSRF и помогает ли политика CORS? Что меняется, если аутентификация идёт через куки, а не через заголовок?
  - id: rate-limiting
    en: What does rate limiting protect that authentication and authorization cannot see? Where in the chain do you put it and what do you key it by?
    ru: Что защищает ограничение частоты из того, чего не видят аутентификация и авторизация? Где в цепочке оно стоит и по какому ключу считается?
  - id: rule-ordering
    en: Your security config has a rule for /api/admin/** but any logged-in user reaches it. What would you look at first?
    ru: В конфигурации безопасности есть правило для /api/admin/**, но туда попадает любой залогиненный пользователь. С чего ты начнёшь разбираться?
  - id: input-validation
    en: Which endpoint risks are not solved by authentication and authorization at all — think about the request body?
    ru: Какие риски эндпоинтов вообще не решаются аутентификацией и авторизацией — подумай про тело запроса?
  - id: secrets-and-transport
    en: What does TLS give you here, and what is still exposed after it? Where do the API's own secrets live?
    ru: Что здесь даёт TLS и что остаётся незащищённым после него? Где живут собственные секреты API?
  - id: audit-and-detection
    en: What do you log for every security decision, and what must never appear in those logs?
    ru: Что ты логируешь по каждому решению о доступе и что в этих логах не должно оказаться никогда?
  - id: public-endpoints
    en: Which endpoints are legitimately public, and what protects them instead of authentication?
    ru: Какие эндпоинты законно остаются публичными и что защищает их вместо аутентификации?
  - id: testing-the-scheme
    en: How do you test a security scheme? What would you assert in an automated test so a regression cannot ship?
    ru: Как тестировать схему безопасности? Что бы ты проверял автотестом, чтобы регрессия не уехала в прод?
