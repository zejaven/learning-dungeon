summary:
  en: >
    A coding challenge: implement maxPairProduct(int[]) to return the largest
    product of any two numbers in the array. The trap is negatives — two large
    negative numbers can beat the two largest positives. Your method runs against
    hidden test cases; the mission passes when they all go green.
  ru: >
    Кодовая задача: реализуй maxPairProduct(int[]), чтобы вернуть наибольшее
    произведение любых двух чисел массива. Ловушка — отрицательные числа: два
    больших отрицательных могут обогнать два наибольших положительных. Метод
    прогоняется на скрытых тест-кейсах; миссия зачтена, когда все зелёные.

