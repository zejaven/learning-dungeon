# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: read-a-certificate
    title:
      en: Read a certificate
      ru: Прочитай сертификат
    goal:
      en: Inspect a certificate and see the four things inside it - a name, a public key, a validity window and an issuer's signature.
      ru: 'Изучи сертификат и увидь четыре вещи внутри: имя, публичный ключ, окно действительности и подпись издателя.'
    event: CERT_INSPECTED
  - id: walk-the-chain
    title:
      en: Walk the chain
      ru: Пройди по цепочке
    goal:
      en: Let a client follow leaf → intermediate → root and stop at a name that is already in its trust store.
      ru: Дай клиенту пройти leaf → intermediate → root и остановиться на имени, которое уже есть в его хранилище доверия.
    event: CHAIN_VERIFIED
  - id: prove-the-private-key
    title:
      en: Prove the private key
      ru: Докажи владение ключом
    goal:
      en: Have the server sign the handshake transcript, proving it holds the private key matching the certificate.
      ru: Пусть сервер подпишет стенограмму рукопожатия, доказав, что владеет приватным ключом от сертификата.
    event: POSSESSION_PROVEN
  - id: agree-a-session-key
    title:
      en: Agree a session key
      ru: Договорись о ключе сессии
    goal:
      en: Finish the key agreement and watch the connection switch from asymmetric maths to a symmetric AEAD cipher.
      ru: Заверши согласование ключей и увидь, как соединение переходит от асимметричной математики к симметричному AEAD-шифру.
    event: SESSION_KEYS_DERIVED
  - id: finish-a-handshake
    title:
      en: Finish a handshake
      ru: Заверши рукопожатие
    goal:
      en: Complete a full TLS handshake against a correctly issued certificate.
      ru: Полностью выполни TLS-рукопожатие с корректно выпущенным сертификатом.
    event: HANDSHAKE_DONE
  - id: encrypt-a-request
    title:
      en: Encrypt a request
      ru: Зашифруй запрос
    goal:
      en: Send an HTTP request through the tunnel and see the whole message become one ciphertext plus an authentication tag.
      ru: Отправь HTTP-запрос через туннель и увидь, как всё сообщение превращается в один шифротекст плюс тег аутентичности.
    event: RECORD_ENCRYPTED
  - id: end-at-an-unknown-root
    title:
      en: End at an unknown root
      ru: Упрись в неизвестный корень
    goal:
      en: Present a self-signed certificate, so every signature is fine and the chain still ends outside the trust store.
      ru: Предъяви самоподписанный сертификат, чтобы все подписи были корректны, а цепочка всё равно закончилась вне хранилища доверия.
    event: CHAIN_UNTRUSTED
  - id: lose-the-intermediate
    title:
      en: Lose the intermediate
      ru: Потеряй промежуточный
    goal:
      en: Serve the leaf certificate without its intermediate and watch the client fail to build a path at all.
      ru: Отдай только конечный сертификат без промежуточного и увидь, как клиент вообще не может построить путь.
    event: CHAIN_INCOMPLETE
  - id: present-the-wrong-name
    title:
      en: Present the wrong name
      ru: Предъяви не то имя
    goal:
      en: Connect to one hostname with a valid certificate issued for another one.
      ru: Подключись к одному имени хоста с корректным сертификатом, выпущенным на другое.
    event: HOSTNAME_MISMATCH
  - id: let-it-expire
    title:
      en: Let it expire
      ru: Дай ему истечь
    goal:
      en: Move the calendar past the certificate's notAfter date and take a perfectly healthy site off the air.
      ru: Сдвинь календарь за дату notAfter сертификата и урони совершенно исправный сайт.
    event: CERT_EXPIRED
  - id: copy-a-certificate
    title:
      en: Copy a certificate
      ru: Скопируй сертификат
    goal:
      en: Present a byte-perfect copy of somebody else's certificate and watch the possession check stop it.
      ru: Предъяви побайтовую копию чужого сертификата и увидь, как её останавливает проверка владения ключом.
    event: POSSESSION_FAILED
  - id: install-a-rogue-root
    title:
      en: Install a rogue root
      ru: Установи чужой корень
    goal:
      en: Add an interceptor's CA to the trust store and watch a man-in-the-middle connection pass every check.
      ru: Добавь CA перехватчика в хранилище доверия и увидь, как соединение с человеком посередине проходит все проверки.
    event: MITM_ACCEPTED
  - id: break-the-tag
    title:
      en: Break the tag
      ru: Сломай тег
    goal:
      en: Flip a byte of a record in flight so the AEAD tag stops matching and the connection is torn down.
      ru: Переверни байт записи на лету, чтобы AEAD-тег перестал совпадать и соединение разорвалось.
    event: RECORD_TAMPERED
  - id: keep-the-recording-shut
    title:
      en: Keep the recording shut
      ru: Оставь запись закрытой
    goal:
      en: Leak the server's private key after an ephemeral key exchange and see the recorded traffic stay unreadable.
      ru: Слей приватный ключ сервера после эфемерного обмена ключами и увидь, что записанный трафик остаётся нечитаемым.
    event: FORWARD_SECRECY_HELD
  - id: open-the-recording
    title:
      en: Open the recording
      ru: Открой запись
    goal:
      en: Switch to RSA key transport, then leak the same key, and watch every recorded session decrypt at once.
      ru: Переключись на передачу ключа по RSA, затем слей тот же ключ и увидь, как все записанные сессии расшифровываются разом.
    event: RECORDING_DECRYPTED
bossFight:
  - id: what-a-certificate-is
    en: What is an SSL/TLS certificate? What is actually inside it?
    ru: Что такое SSL/TLS-сертификат? Что внутри него на самом деле?
  - id: what-it-secures
    en: How does a certificate secure a connection - which of the guarantees comes from the certificate itself?
    ru: Как сертификат защищает соединение — какая из гарантий берётся именно от самого сертификата?
  - id: chain-of-trust
    en: Explain the chain of trust. Why does your browser believe a certificate it has never seen before?
    ru: Объясни цепочку доверия. Почему браузер верит сертификату, который видит впервые?
  - id: root-not-sent
    en: The root certificate is not sent by the server. Where does the client get it, and why does that matter?
    ru: Корневой сертификат сервер не присылает. Откуда его берёт клиент и почему это важно?
  - id: what-encryption-https-uses
    en: What encryption does HTTPS actually use - symmetric, asymmetric, or both? Which part does what?
    ru: Какое шифрование реально использует HTTPS — симметричное, асимметричное или оба? Какая часть за что отвечает?
  - id: why-not-only-asymmetric
    en: Why not encrypt the whole conversation with the certificate's key pair and skip the symmetric part?
    ru: Почему бы не шифровать весь разговор ключевой парой из сертификата и обойтись без симметричной части?
  - id: browser-checks
    en: What exactly does a client check about a presented certificate before it sends any data?
    ru: Что именно клиент проверяет в предъявленном сертификате, прежде чем отправить хоть какие-то данные?
  - id: copied-certificate
    en: A certificate is public - the server sends it to everybody. Why can an attacker not just copy it and impersonate the site?
    ru: Сертификат публичен — сервер отдаёт его всем. Почему злоумышленник не может просто скопировать его и выдать себя за сайт?
  - id: self-signed
    en: Is a self-signed certificate as secure as a CA-signed one? What exactly do you lose?
    ru: Самоподписанный сертификат так же безопасен, как подписанный CA? Что именно вы теряете?
  - id: missing-intermediate
    en: The site opens in your browser but curl and the mobile app fail with a certificate error. What is the most likely cause?
    ru: Сайт открывается в браузере, а curl и мобильное приложение падают с ошибкой сертификата. Какая причина наиболее вероятна?
  - id: wildcard-scope
    en: Which hostnames does a certificate for '*.example.com' cover, and which does it not?
    ru: 'Какие имена хостов покрывает сертификат для «*.example.com», а какие нет?'
  - id: expiry-operations
    en: Why do certificates expire at all, and what does that mean for how you run a service?
    ru: Почему у сертификатов вообще есть срок действия и что это означает для эксплуатации сервиса?
  - id: revocation-reality
    en: How is a certificate revoked before it expires, and why is revocation considered the weakest of the checks?
    ru: Как сертификат отзывают до истечения срока и почему отзыв считают самой слабой из проверок?
  - id: aead-integrity
    en: Somebody flips a byte of an HTTPS record in transit. What happens, and which property of the cipher makes that possible?
    ru: Кто-то переворачивает байт в HTTPS-записи на лету. Что произойдёт и какое свойство шифра это обеспечивает?
  - id: forward-secrecy
    en: What is forward secrecy, and how does TLS 1.3 achieve it?
    ru: Что такое прямая секретность и как её обеспечивает TLS 1.3?
  - id: harvest-now-decrypt-later
    en: An attacker records your encrypted traffic today and steals the server's private key a year later. Can they read the recording?
    ru: Злоумышленник записывает ваш зашифрованный трафик сегодня и через год крадёт приватный ключ сервера. Сможет ли он прочитать запись?
  - id: corporate-proxy
    en: How can a corporate proxy read HTTPS traffic without any browser warning, and what does that tell you about the trust store?
    ru: Как корпоративный прокси читает HTTPS-трафик без единого предупреждения браузера и что это говорит о хранилище доверия?
  - id: mtls
    en: What changes when you turn on mutual TLS, and where would you use it?
    ru: Что меняется при включении mutual TLS и где бы вы его применили?
  - id: cert-types-and-issuance
    en: DV, OV and EV certificates - what does a CA actually verify before issuing one, and does the browser treat them differently?
    ru: Сертификаты DV, OV и EV — что именно проверяет CA перед выдачей и относится ли браузер к ним по-разному?
  - id: private-key-leaked
    en: You discover your server's private key has leaked. What do you do, and what is still at risk?
    ru: Вы обнаружили, что приватный ключ вашего сервера утёк. Что вы делаете и что всё равно остаётся под угрозой?
