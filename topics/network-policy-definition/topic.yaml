summary:
  en: >
    A Kubernetes cluster is a flat network by default: every pod can open a
    connection to every other pod, on any port, in any namespace. A NetworkPolicy
    is the namespaced object that replaces that default-allow with an explicit
    allowlist for the pods it selects. Its definition has three moving parts — a
    'podSelector' saying which pods the policy protects, 'policyTypes' saying
    which directions it governs, and ingress/egress rules listing allowed peers
    (pod selectors, namespace selectors, CIDR blocks) with protocols and ports.
    The semantics are where interviews go: policies only allow and never deny,
    several policies on one pod are a union, a pod stays wide open until some
    policy selects it and only then becomes default-deny for that direction, and
    enforcement is connection-tracked so replies need no rule but both ends of a
    call do. It is L3/L4 only — no HTTP paths, no identity, no encryption — and
    it is enforced by the CNI plugin, so on a plugin that does not implement it
    the YAML applies cleanly and blocks absolutely nothing.
  ru: >
    Кластер Kubernetes по умолчанию — плоская сеть: любой под может открыть
    соединение к любому другому поду, на любой порт, в любом пространстве имён.
    NetworkPolicy — это namespace-объект, который заменяет это «по умолчанию
    разрешено» явным списком разрешений для выбранных им подов. В определении три
    подвижные части: 'podSelector' — какие поды политика защищает, 'policyTypes' —
    какие направления она регулирует, и правила ingress/egress со списком
    разрешённых участников (селекторы подов, селекторы пространств имён, блоки
    CIDR) с протоколами и портами. Собеседование обычно уходит в семантику:
    политики только разрешают и никогда не запрещают, несколько политик на одном
    поде объединяются, под остаётся полностью открытым, пока его не выберет хотя
    бы одна политика, и только тогда становится закрытым по умолчанию для этого
    направления, а enforcement отслеживает соединения — ответному трафику правило
    не нужно, но нужно обоим концам вызова. Это только L3/L4 — ни путей HTTP, ни
    идентичности, ни шифрования, — и применяет её CNI-плагин, поэтому на плагине
    без поддержки NetworkPolicy YAML применится без ошибок и не заблокирует
    ровным счётом ничего.

