id: jwt-vs-session-token
title:
  en: 'JWT vs Session Token'
  ru: 'JWT против токена сессии'
category:
  en: Security & Authentication
  ru: Безопасность и аутентификация
type: HTTP
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: security
difficulty: 2
catalogId: security-4
summary:
  en: >
    A JWT is three base64url segments joined by dots — header.payload.signature —
    and the first two are readable by anyone holding it, so it is signed, not
    secret. The signature is the only reason its claims are evidence rather than
    text the client typed, and verifying it means pinning the algorithm yourself,
    then checking 'exp', 'iss' and 'aud' — not merely decoding. The real choice is
    not old versus modern but where the truth lives. A session id is opaque and
    costs one store lookup per request, and that lookup is exactly what buys
    instant logout, instant bans and always-current roles. A JWT costs no lookup
    and any service with the key can verify it alone — and it pays for that by
    being a snapshot: a logged-out token still verifies, and a demoted user keeps
    the old role until 'exp'. So the practical split is client-server versus
    server-server: for a first-party browser app a session cookie is the better
    default, while short-lived audience-scoped JWTs are the natural fit across
    services, where there is no browser, no logout, and no shared session store
    worth building.
  ru: >
    JWT — это три base64url-сегмента, соединённых точками: header.payload.signature,
    — и первые два может прочитать любой, кто держит токен, так что он подписан, а
    не секретен. Подпись — единственная причина, по которой его claims являются
    доказательством, а не текстом, который набрал клиент; проверить её — значит
    самому закрепить алгоритм, а потом сверить 'exp', 'iss' и 'aud', а не просто
    раскодировать. Настоящий выбор не между старым и современным, а в том, где
    живёт истина. Идентификатор сессии непрозрачен и стоит одного обращения к
    хранилищу на запрос — и именно это обращение покупает мгновенный выход,
    мгновенную блокировку и всегда актуальные роли. JWT не стоит ни одного
    обращения, и любой сервис с ключом проверит его в одиночку, — а платит он за
    это тем, что является снимком: токен после выхода по-прежнему проходит
    проверку, а понижённый в правах пользователь сохраняет старую роль до 'exp'.
    Отсюда практическое разделение «клиент-сервер против сервер-сервер»: для
    браузерного приложения своего же домена лучше по умолчанию взять cookie сессии,
    а короткоживущие JWT с указанным 'aud' естественны между сервисами, где нет ни
    браузера, ни выхода из системы, ни общего хранилища сессий, которое стоило бы
    строить.

