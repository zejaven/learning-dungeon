bossFight:
- id: who-can-be-client
  ru: Кто может выступать в роли клиента в клиент-серверной архитектуре? Может ли сервер быть клиентом? Приведите примеры.
  en: Кто может выступать в роли клиента в клиент-серверной архитектуре? Может ли сервер быть клиентом? Приведите примеры.
- id: http-vs-https
  ru: В чём разница между HTTP и HTTPS? Какие порты используются по умолчанию и что даёт TLS-шифрование?
  en: В чём разница между HTTP и HTTPS? Какие порты используются по умолчанию и что даёт TLS-шифрование?
- id: request-response-components
  ru: Из каких частей состоит HTTP-запрос? А HTTP-ответ? Опишите каждую часть.
  en: Из каких частей состоит HTTP-запрос? А HTTP-ответ? Опишите каждую часть.
- id: dns-resolution
  ru: Как браузер узнаёт, куда отправить запрос, если вы ввели только доменное имя? Расскажите про роль DNS.
  en: Как браузер узнаёт, куда отправить запрос, если вы ввели только доменное имя? Расскажите про роль DNS.
- id: user-agent-headers
  ru: Как сервер узнаёт, с какого устройства, браузера, ОС и языка вы открываете сайт? Какие заголовки за это отвечают и можно ли им доверять?
  en: Как сервер узнаёт, с какого устройства, браузера, ОС и языка вы открываете сайт? Какие заголовки за это отвечают и можно ли им доверять?
- id: get-params-and-body
  ru: Как передаются параметры в GET-запросе и с помощью каких символов? Можно ли передать тело GET-запросом?
  en: Как передаются параметры в GET-запросе и с помощью каких символов? Можно ли передать тело GET-запросом?
- id: post-create-user-negative
  ru: 'Задача: сформулируйте негативные сценарии для POST-запроса, создающего нового пользователя. Для каждого сценария назовите ожидаемый результат.'
  en: 'Задача: сформулируйте негативные сценарии для POST-запроса, создающего нового пользователя. Для каждого сценария назовите ожидаемый результат.'
- id: json-validity-task
  ru: 'Задача: даны два JSON, во втором есть запятая после номера телефона, а в первом нет. Какой из них валидный и почему? Что произойдёт при парсинге невалидного?'
  en: 'Задача: даны два JSON, во втором есть запятая после номера телефона, а в первом нет. Какой из них валидный и почему? Что произойдёт при парсинге невалидного?'
