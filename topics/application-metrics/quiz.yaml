# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: what-metrics-do-you-know
    en: What application metrics do you know? Group them rather than listing them.
    ru: Какие метрики приложения ты знаешь? Сгруппируй их, а не просто перечисли.
  - id: metric-vs-log-vs-trace
    en: What is the difference between a metric, a log and a trace, and what is each one good for?
    ru: Чем метрика отличается от лога и трейса и для чего годится каждый из них?
  - id: red-and-use
    en: What are the RED and USE methods, and which of them applies to what?
    ru: Что такое методы RED и USE и какой из них к чему применяется?
  - id: golden-signals
    en: What are the four golden signals, and why those four?
    ru: Какие есть четыре золотых сигнала и почему именно эти четыре?
  - id: instrument-types
    en: 'What kinds of instruments exist — counter, gauge, histogram, timer — and when do you use each?'
    ru: 'Какие бывают типы инструментов — counter, gauge, histogram, timer — и когда применять каждый?'
  - id: histogram-vs-summary
    en: Why is a histogram usually better than client-side quantiles in a service running on many instances?
    ru: Почему гистограмма обычно лучше клиентских квантилей в сервисе, работающем на многих экземплярах?
  - id: average-vs-percentiles
    en: Why is the average response time a bad metric, and what do you read instead?
    ru: Почему среднее время ответа — плохая метрика и что читать вместо него?
  - id: aggregating-percentiles
    en: 'Ten pods each report a p99. How do you get the p99 of the whole service?'
    ru: 'Десять подов сообщают каждый свой p99. Как получить p99 всего сервиса?'
  - id: business-metrics
    en: What business metrics would you add to an ordering service, and why do they matter more than CPU?
    ru: Какие бизнес-метрики ты добавишь сервису заказов и почему они важнее, чем CPU?
  - id: jvm-metrics
    en: Which JVM metrics do you watch, and which one actually indicates a memory leak?
    ru: Какие метрики JVM ты смотришь и какая из них реально указывает на утечку памяти?
  - id: connection-pool-metrics
    en: Which connection-pool metrics matter, and what does a growing number of threads waiting for a connection tell you?
    ru: Какие метрики пула соединений важны и о чём говорит растущее число потоков, ждущих соединение?
  - id: utilisation-vs-saturation
    en: What is the difference between utilisation and saturation, and why can a service be in trouble at 50% CPU?
    ru: Чем utilization отличается от saturation и почему сервису может быть плохо при 50% CPU?
  - id: leading-indicators
    en: Which metrics are leading indicators of a problem, and which ones only tell you afterwards?
    ru: Какие метрики являются опережающими индикаторами проблемы, а какие сообщают о ней только задним числом?
  - id: messaging-metrics
    en: Which metrics would you put on a Kafka or RabbitMQ consumer, and which single one matters most?
    ru: Какие метрики ты повесишь на консьюмера Kafka или RabbitMQ и какая из них важнее всех?
  - id: container-metrics
    en: Which container-level metrics do you track in Kubernetes, and which one do people usually forget?
    ru: Какие метрики уровня контейнера ты отслеживаешь в Kubernetes и о какой обычно забывают?
  - id: cardinality
    en: What is metric cardinality, how does it explode, and what belongs in a label versus in a log?
    ru: Что такое кардинальность метрик, как она взрывается и что уместно в лейбле, а что — в логе?
  - id: what-to-alert-on
    en: Which of these metrics would you actually alert on, and which would you leave on a dashboard?
    ru: На какие из этих метрик ты поставишь алерт, а какие оставишь только на дашборде?
  - id: instrumenting-spring
    en: 'How do you expose metrics from a Spring Boot service, and what do you get without writing any code?'
    ru: 'Как отдавать метрики из сервиса на Spring Boot и что появляется вообще без написания кода?'
  - id: first-metrics-for-new-service
    en: A new service has no metrics at all. Which five would you add first, and why those five?
    ru: У нового сервиса нет метрик вообще. Какие пять ты добавишь первыми и почему именно эти?
  - id: all-green-users-complain
    en: Every dashboard is green and users are complaining. What could be missing from your metrics?
    ru: Все дашборды зелёные, а пользователи жалуются. Чего может не хватать в твоих метриках?
  - id: client-side-metrics
    en: Your server-side p99 is 120ms and the page still feels slow. Which metrics would show why?
    ru: Серверный p99 равен 120мс, а страница всё равно ощущается медленной. Какие метрики покажут причину?
  - id: error-rate-and-latency
    en: Why should you measure the latency of successful and failed requests separately?
    ru: Почему задержку успешных и неуспешных запросов нужно измерять раздельно?
