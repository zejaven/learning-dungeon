# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: leak-vs-high-usage
    en: How do you tell a real memory leak from just high memory usage?
    ru: Как отличить настоящую утечку памяти от просто высокого потребления?
  - id: confirm-trend-first
    en: What do you look at first to confirm memory is leaking, before taking any dump?
    ru: На что вы смотрите в первую очередь, чтобы подтвердить утечку, прежде чем снимать дампы?
  - id: profiler-vs-heap-dump
    en: What is the difference between a profiler and a heap dump, and when do you use each?
    ru: В чём разница между профилировщиком и heap dump, и когда применять каждый?
  - id: capture-heap-dump
    en: How do you capture a heap dump on production, and what is the cost of doing so?
    ru: Как снять heap dump на проде и какова цена этого действия?
  - id: analyze-heap-dump
    en: How do you analyze a heap dump to find the leak (retained size, dominator tree, GC roots)?
    ru: Как анализировать heap dump, чтобы найти утечку (retained size, dominator tree, GC roots)?
  - id: thread-dump-purpose
    en: What is a thread dump for, and how is it different from a heap dump?
    ru: Для чего нужен thread dump и чем он отличается от heap dump?
  - id: common-leak-causes
    en: What are the classic causes of memory leaks in a Java service?
    ru: Каковы классические причины утечек памяти в Java-сервисе?
  - id: compare-two-snapshots
    en: Why is comparing two snapshots taken over time more useful than a single one?
    ru: Почему сравнение двух снимков во времени полезнее, чем один снимок?
