id: jvm-heaps-stacks-count
title:
  en: 'How Many Heaps and Stacks in One JVM Instance'
  ru: 'Сколько куч и стеков в одном инстансе JVM'
category:
  en: JVM / Memory & GC
  ru: JVM / Память и GC
type: JVM_MEMORY
mode: trace
aiProvider: claude
aiModel: claude-opus-4-8
categoryId: memory-gc
difficulty: 2
catalogId: memory-gc-6
style: Real world
summary:
  en: >
    A single JVM instance has exactly one heap, shared by every thread and
    managed by the garbage collector, and one stack per thread. So the heap
    count is always 1; the stack count equals the number of live threads and
    rises and falls as threads start and finish. This topic counts them as
    threads come and go and shows that every new object lands in the one shared
    heap no matter which thread allocates it.
  ru: >
    В одном инстансе JVM ровно одна куча, общая для всех потоков и управляемая
    сборщиком мусора, и по одному стеку на каждый поток. Поэтому куч всегда 1, а
    число стеков равно числу живых потоков и растёт и падает по мере их старта и
    завершения. Тема показывает этот подсчёт, пока потоки появляются и исчезают,
    и то, что каждый новый объект попадает в единственную общую кучу, каким бы
    потоком он ни был создан.

primitives:
  - BoxGroup

defaultExample: one-heap-one-stack

examples:
  - id: one-heap-one-stack
    title:
      en: One heap, one stack
      ru: Одна куча, один стек
    file: 01-one-heap-one-stack.java
    explanation:
      en: >
        A fresh JVM boots with exactly one heap and one stack for the main
        thread. Calls push frames on main's stack; new puts the object in the
        single heap.
      ru: >
        Свежая JVM стартует с ровно одной кучей и одним стеком для потока main.
        Вызовы кладут кадры на стек main; new кладёт объект в единственную кучу.
  - id: one-stack-per-thread
    title:
      en: One stack per thread
      ru: Один стек на поток
    file: 02-one-stack-per-thread.java
    explanation:
      en: >
        Every thread that starts gets its own stack, so the stack count grows
        with the number of live threads. The heap count stays at one.
      ru: >
        Каждый стартующий поток получает собственный стек, поэтому число стеков
        растёт с числом живых потоков. Число куч остаётся равным одному.
  - id: heap-is-shared
    title:
      en: Heap is shared
      ru: Куча общая
    file: 03-heap-is-shared.java
    explanation:
      en: >
        Whichever thread runs new, the object is created in the same single
        heap. Multiple threads do not get multiple heaps — they share the one.
      ru: >
        Каким бы потоком ни выполнялся new, объект создаётся в одной и той же
        единственной куче. У нескольких потоков не появляется несколько куч — они
        делят одну.
  - id: stacks-come-and-go
    title:
      en: Stacks come and go
      ru: Стеки появляются и исчезают
    file: 04-stacks-come-and-go.java
    explanation:
      en: >
        A thread's whole stack is discarded when it finishes, so the stack count
        drops. The objects it created stay in the one heap until the garbage
        collector reclaims them.
      ru: >
        Весь стек потока выбрасывается при его завершении, поэтому число стеков
        падает. Созданные им объекты остаются в единственной куче, пока их не
        соберёт сборщик мусора.
  - id: frames-are-per-thread
    title:
      en: Frames are per thread
      ru: Кадры — на поток
    file: 05-frames-are-per-thread.java
    explanation:
      en: >
        A call pushes a frame onto only the calling thread's stack; another
        thread's stack is untouched. Each thread walks its own stack
        independently.
      ru: >
        Вызов кладёт кадр только на стек вызывающего потока; стек другого потока
        не трогается. Каждый поток работает со своим стеком независимо.

