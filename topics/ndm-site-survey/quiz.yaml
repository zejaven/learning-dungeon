bossFight:
  # I. Strategic Importance and Lifecycle Integration
  - id: terrain-reality-check
    en: 'Why is a site survey described as the crucial "terrain check" that prevents a logical topology from becoming non-functional in a physical space?'
    ru: 'Почему site survey называют критически важной «проверкой местности», не дающей логической топологии стать неработоспособной в физическом пространстве?'
  - id: ppdioo-context
    en: 'Discuss the specific role of site surveys within the Plan and Design phases of the Cisco PPDIOO lifecycle.'
    ru: 'Обсудите конкретную роль site survey в фазах Plan и Design жизненного цикла Cisco PPDIOO.'
  - id: feasibility-risk-mitigation
    en: 'Beyond hardware counts, how does a survey facilitate feasibility assessment and risk mitigation before a single cable is laid?'
    ru: 'Помимо подсчёта оборудования, как обследование помогает оценить осуществимость и снизить риски до прокладки первого кабеля?'
  - id: consequences-of-neglect
    en: 'What are the primary business and technical risks—such as budget overruns or "dead zones"—associated with skipping the site survey phase?'
    ru: 'Каковы основные бизнес- и технические риски пропуска фазы site survey — например, перерасход бюджета или «мёртвые зоны»?'
  - id: truck-roll-economics
    en: 'How can a comprehensive digital site survey reduce unproductive "truck rolls" and improve overall project margins?'
    ru: 'Как полноценное цифровое site survey сокращает непродуктивные «truck rolls» и повышает общую маржу проекта?'
  # II. Architectural and Environmental Mechanics
  - id: blueprint-verification
    en: 'Why is a physical walkthrough necessary even if modern architectural digital floor plans are available?'
    ru: 'Почему физический обход необходим, даже если доступны современные цифровые архитектурные поэтажные планы?'
  - id: rf-attenuation-materials
    en: 'Contrast the impact of different building materials on signal strength, specifically comparing drywall (~3 dB drop) to reinforced concrete (~20+ dB drop).'
    ru: 'Сопоставьте влияние разных строительных материалов на силу сигнала, в частности гипсокартон (~3 dB падения) и железобетон (~20+ dB падения).'
  - id: wired-distance-constraints
    en: 'Why must surveyors measure actual cable pathways rather than "as the crow flies" distances to adhere to the 100-metre structural run limit?'
    ru: 'Почему обследователи должны измерять реальные кабельные трассы, а не расстояния «по прямой», чтобы соблюсти лимит структурной трассы в 100 метров?'
  - id: mdf-idf-framework
    en: 'Explain the relationship between the Main Distribution Frame and Intermediate Distribution Frames. Why must they be linked via fibre-optic backbones?'
    ru: 'Объясните связь между Main Distribution Frame и Intermediate Distribution Frame. Почему они должны соединяться волоконно-оптическими магистралями?'
  - id: hvac-climate-control
    en: 'Discuss the HVAC requirements for network hardware. Why is maintaining a window of 18°C to 24°C critical for equipment longevity?'
    ru: 'Обсудите требования HVAC для сетевого оборудования. Почему поддержание окна 18–24°C критично для долговечности оборудования?'
  # III. Survey Methodologies and Technical Metrics
  - id: predictive-vs-passive
    en: 'Compare the theoretical baseline of a predictive survey (software-based) with the "listening mode" of a passive survey.'
    ru: 'Сравните теоретическую базовую оценку predictive-обследования (программного) с «режимом прослушивания» passive-обследования.'
  - id: active-device-simulation
    en: 'What unique performance data, such as roaming behaviour, can only be gathered through an active survey where a device joins the network?'
    ru: 'Какие уникальные данные о производительности, например поведение роуминга, можно получить только через active-обследование, когда устройство подключается к сети?'
  - id: apos-empirical-proof
    en: 'Why is the APoS method considered the empirical proof of a design? How does it help validate performance against unknown building materials?'
    ru: 'Почему метод APoS считается эмпирическим доказательством дизайна? Как он помогает валидировать производительность на неизвестных строительных материалах?'
  - id: post-installation-validation
    en: 'Why is a final verification survey essential for accountability after the hardware has been installed?'
    ru: 'Почему финальное валидационное обследование необходимо для подотчётности после установки оборудования?'
  - id: noise-floor-spectrum
    en: 'How does mapping the "noise floor" help engineers identify non-Wi-Fi interference sources like microwaves or elevator motors?'
    ru: 'Как картирование «шумового пола» (noise floor) помогает инженерам выявлять источники помех вне Wi-Fi — например, микроволновки или моторы лифтов?'
  # IV. Infrastructure, Power, and Safety
  - id: poe-budgeting
    en: 'With modern switches supporting 48 ports, why is it critical to calculate Power over Ethernet (802.3af/at) requirements for APs and cameras during the survey?'
    ru: 'Почему при современных коммутаторах на 48 портов критично рассчитывать требования Power over Ethernet (802.3af/at) для AP и камер во время обследования?'
  - id: clean-power-integrity
    en: 'Discuss the importance of UPS systems and dedicated electrical circuits in protecting network hardware from voltage spikes.'
    ru: 'Обсудите важность систем UPS и выделенных электрических цепей для защиты сетевого оборудования от скачков напряжения.'
  - id: legacy-audits
    en: 'Why must an engineer audit existing cabling standards (Cat5e vs. Cat6) and rack space before proposing an upgrade?'
    ru: 'Почему инженер должен провести аудит существующих кабельных стандартов (Cat5e против Cat6) и места в стойках до предложения апгрейда?'
  - id: safety-compliance
    en: 'How does a site survey identify hazardous areas or ensure the plan abides by industry safety codes and accessibility standards?'
    ru: 'Как site survey выявляет опасные зоны и гарантирует соответствие плана отраслевым нормам безопасности и стандартам доступности?'
  # V. Workflow, Security, and Design Synthesis
  - id: bridge-to-deployment
    en: 'How does the site survey serve as the bridge to deployment, ensuring that the wired and wireless layers fit together cleanly?'
    ru: 'Как site survey служит мостом к развёртыванию, гарантируя, что проводной и беспроводной уровни чисто стыкуются друг с другом?'
  - id: surveillance-operational-requirements
    en: 'In surveillance surveys, what is the significance of defining operational requirements like Detection vs. Recognition vs. Identification?'
    ru: 'В чём значимость определения операционных требований — Detection, Recognition и Identification — при обследованиях для систем видеонаблюдения?'
  - id: star-vs-daisy-chain
    en: 'Why should designers avoid daisy-chain infrastructure in favour of a redundant Star Topology for enterprise environments?'
    ru: 'Почему проектировщикам следует избегать инфраструктуры daisy-chain в пользу резервированной топологии «звезда» в корпоративных средах?'
  - id: stakeholder-communication
    en: 'How should engineers communicate the value of the upfront time investment required for a digital site survey to project stakeholders?'
    ru: 'Как инженерам доносить до стейкхолдеров проекта ценность стартовых затрат времени, необходимых для цифрового site survey?'
