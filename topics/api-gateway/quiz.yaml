# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: why-gateway-needed
    en: Why is an API gateway needed? Describe what breaks in a multi-service system that has no gateway.
    ru: Зачем нужен API gateway? Опишите, что ломается в системе из многих сервисов, если gateway нет.
  - id: gateway-responsibilities
    en: List the responsibilities of an API gateway and explain why each one belongs at the edge rather than inside every service.
    ru: Перечислите обязанности API gateway и объясните, почему каждая из них уместна на периметре, а не внутри каждого сервиса.
  - id: gateway-vs-load-balancer
    en: How is an API gateway different from a load balancer? Would you use both in the same system?
    ru: Чем API gateway отличается от балансировщика нагрузки? Стали бы вы использовать оба в одной системе?
  - id: gateway-vs-service-mesh
    en: Compare an API gateway with a service mesh. Which traffic does each one see, and can one replace the other?
    ru: Сравните API gateway и service mesh. Какой трафик видит каждый из них и может ли один заменить другой?
  - id: auth-split
    en: Which authentication and authorization decisions would you make in the gateway, and which must stay in the service? Why?
    ru: Какие решения по аутентификации и авторизации вы примете в gateway, а какие обязаны остаться в сервисе? Почему?
  - id: bff-pattern
    en: What is a Backend for Frontend, and when would you run several gateways instead of one?
    ru: Что такое Backend for Frontend и когда вы запустите несколько gateway вместо одного?
  - id: aggregation-tradeoffs
    en: A gateway endpoint aggregates calls to five services into one response. What are the benefits and what can go wrong?
    ru: Эндпоинт gateway агрегирует вызовы пяти сервисов в один ответ. В чём выгода и что может пойти не так?
  - id: single-point-of-failure
    en: 'Someone objects: ''the gateway is a single point of failure''. How do you answer, and how do you actually operate it?'
    ru: 'Вам возражают: «gateway - это единая точка отказа». Что вы ответите и как на самом деле его эксплуатировать?'
  - id: keeping-gateway-thin
    en: What goes wrong when business logic creeps into the gateway, and how do you keep it from happening?
    ru: Что происходит, когда в gateway просачивается бизнес-логика, и как этому помешать?
  - id: gateway-and-discovery
    en: How does a gateway know where to send a request? Does it remove the need for service discovery?
    ru: Откуда gateway знает, куда отправить запрос? Убирает ли он необходимость в service discovery?
  - id: gateway-security-boundary
    en: Is an API gateway a security boundary? What can an attacker who is already inside the network do?
    ru: Является ли API gateway границей безопасности? Что может сделать атакующий, который уже находится внутри сети?
  - id: spring-cloud-gateway
    en: How would you implement an API gateway in a Spring stack, and what does a route with filters look like?
    ru: Как вы реализуете API gateway в стеке Spring и как выглядит маршрут с фильтрами?
