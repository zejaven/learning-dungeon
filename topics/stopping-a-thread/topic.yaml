id: stopping-a-thread
languages: [en, ru]
title:
  en: Stopping a Started Thread
  ru: Остановка запущенного потока
category:
  en: Java Core / Concurrency
  ru: Java Core / Многопоточность
type: CONCURRENCY
mode: trace
summary:
  en: >
    How to stop a Java thread after start(): cooperative cancellation with a
    visible stop flag, interrupting blocking calls, preserving interrupt status,
    waiting with join(), and avoiding unsafe Thread.stop().
  ru: >
    Как остановить Java thread после start(): кооперативная отмена через видимый
    флаг остановки, interrupt для блокирующих вызовов, сохранение interrupt status,
    ожидание через join() и отказ от небезопасного Thread.stop().
categoryId: concurrency
difficulty: 2
catalogId: concurrency-12
style: Real world
aiProvider: codex
aiModel: gpt-5.5

primitives:
  - ArrayGrid
  - LinkedNodes

defaultExample: cooperative-flag

examples:
  - id: cooperative-flag
    title:
      en: Cooperative stop flag
      ru: Кооперативный флаг остановки
    file: 01-cooperative-flag.java
    explanation:
      en: >
        A running loop is stopped by setting a visible request and letting the
        worker check it, exit cleanly, and then be joined by the owner.
      ru: >
        Работающий цикл останавливается через видимый запрос: worker проверяет
        его, аккуратно выходит, а владелец затем ждёт завершения через join().
  - id: interrupt-blocked-worker
    title:
      en: Interrupt a blocked worker
      ru: Прервать заблокированный worker
    file: 02-interrupt-blocked-worker.java
    explanation:
      en: >
        A stop flag alone may not wake a sleeping or waiting thread, so the
        owner combines the request with interrupt().
      ru: >
        Один флаг остановки может не разбудить спящий или ожидающий thread, поэтому
        владелец сочетает запрос с interrupt().
  - id: interrupt-running-loop
    title:
      en: Check interrupt status
      ru: Проверка interrupt status
    file: 03-interrupt-running-loop.java
    explanation:
      en: >
        interrupt() does not kill CPU work; the loop must periodically check
        isInterrupted() or an equivalent cancellation signal.
      ru: >
        interrupt() не убивает вычисления на CPU; цикл должен периодически проверять
        isInterrupted() или эквивалентный сигнал отмены.
  - id: restore-interrupt
    title:
      en: Restore interrupt status
      ru: Восстановить interrupt status
    file: 04-restore-interrupt.java
    explanation:
      en: >
        InterruptedException clears the interrupt status, so code that cannot
        finish handling the cancellation should restore it before returning.
      ru: >
        InterruptedException очищает interrupt status, поэтому код, который не может
        полностью обработать отмену, должен восстановить его перед возвратом.
  - id: reject-thread-stop
    title:
      en: Reject Thread.stop()
      ru: Отказаться от Thread.stop()
    file: 05-reject-thread-stop.java
    explanation:
      en: >
        Thread.stop() is unsafe because it can kill code in the middle of shared
        state updates; use a cooperative request instead.
      ru: >
        Thread.stop() небезопасен, потому что может убить код посреди обновления
        общего состояния; вместо этого используй кооперативный запрос.

assistantExample:
  en: 'e.g. How do you stop a Java thread safely after it has already started?'
  ru: 'например: Как безопасно остановить Java thread после того, как он уже запущен?'

