missions:
  - id: create-map
    title:
      en: Create a map
      ru: Создай мапу
    goal:
      en: Run code that constructs a VisualHashMap and emits HASHMAP_CREATED.
      ru: Запусти код, который создаёт VisualHashMap и выдаёт HASHMAP_CREATED.
    event: HASHMAP_CREATED
  - id: put-entry
    title:
      en: Store an entry
      ru: Сохрани запись
    goal:
      en: Put at least one key-value pair into the map.
      ru: Положи в мапу хотя бы одну пару ключ-значение.
    event: HASHMAP_PUT
  - id: get-entry
    title:
      en: Read by key
      ru: Прочитай по ключу
    goal:
      en: Call get() so the map recomputes the bucket index and emits HASHMAP_GET.
      ru: Вызови get(), чтобы мапа заново вычислила индекс бакета и выдала HASHMAP_GET.
    event: HASHMAP_GET
  - id: collision-chain
    title:
      en: Make a collision
      ru: Создай коллизию
    goal:
      en: Put two different keys into the same bucket, for example "Aa" and "BB".
      ru: Положи два разных ключа в один бакет, например "Aa" и "BB".
    event: HASHMAP_COLLISION
  - id: trigger-resize
    title:
      en: Trigger resize
      ru: Вызови resize
    goal:
      en: Insert 13 entries so size passes the default threshold of 12.
      ru: Вставь 13 записей, чтобы размер превысил стандартный порог 12.
    event: HASHMAP_RESIZE

bossFight:
  - id: what-is-hashmap
    en: What is a HashMap, and what problem does it solve?
    ru: Что такое HashMap и какую задачу он решает?
  - id: put-get-steps
    en: Describe what happens internally during put(key, value) and get(key).
    ru: Опиши, что происходит внутри при put(key, value) и get(key).
  - id: collision-handling
    en: What is a collision in HashMap, and how is it handled?
    ru: Что такое коллизия в HashMap и как она обрабатывается?
  - id: equals-hashcode-contract
    en: Why must equals() and hashCode() be consistent for HashMap keys?
    ru: Почему equals() и hashCode() должны быть согласованы у ключей HashMap?
  - id: resize-load-factor
    en: When does HashMap resize, and why does load factor matter?
    ru: Когда HashMap выполняет resize и почему важен load factor?
  - id: order-and-threads
    en: Is HashMap ordered or thread-safe? What would you use if you need those guarantees?
    ru: Упорядочен ли HashMap и потокобезопасен ли он? Что использовать, если нужны такие гарантии?
