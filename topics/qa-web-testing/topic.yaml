summary:
  en: >
    What a browser engine is and why testers must distinguish Chrome from
    Chromium-based browsers (Blink), WebKit in Safari and Gecko in Firefox;
    what the DOM is and how testers use it to find elements and build locators;
    and the core DevTools panels — Elements, Console, Network and Application —
    with what a tester actually inspects in each of them.
  ru: >
    Что такое браузерный движок и почему тестировщику важно различать Chrome и
    Chromium-based браузеры (Blink), WebKit у Safari и Gecko у Firefox; что
    такое DOM и как он используется при тестировании для поиска элементов и
    построения локаторов; а также основные вкладки DevTools — Elements, Console,
    Network и Application — и что в них смотрит тестировщик.

