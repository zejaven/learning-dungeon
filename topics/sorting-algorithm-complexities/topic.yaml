summary:
  en: >
    Bubble sort, selection sort, insertion sort, and heap sort are often asked
    together because they expose the difference between best, average, and worst
    Big-O. This topic gives the interview table, explains why selection sort stays
    O(n^2) even on sorted input, why insertion sort can be O(n), and why heap sort
    gives O(n log n) worst-case time.
  ru: >
    Пузырьковую сортировку, сортировку выбором, сортировку вставками и
    пирамидальную сортировку часто спрашивают вместе, потому что они хорошо
    показывают разницу между лучшей, средней и худшей сложностью Big-O. Тема дает
    таблицу для собеседования, объясняет, почему сортировка выбором остается
    O(n^2) даже на отсортированном входе, почему сортировка вставками может быть
    O(n), и почему пирамидальная сортировка дает O(n log n) в худшем случае.

