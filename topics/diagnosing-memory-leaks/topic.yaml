summary:
  en: >
    A field guide to finding out why a JVM's memory keeps growing in production:
    first confirm it's a real leak with monitoring and GC logs, then narrow it
    down with a low-overhead profiler (JFR), a heap dump analyzed in Eclipse MAT
    (dominator tree, GC-root paths), and a thread dump for stuck or leaking
    threads. Covers the order to use the tools, the trade-offs of each, and the
    classic leak causes.
  ru: >
    Полевой справочник по поиску причины постоянного роста памяти JVM на проде:
    сначала подтвердить, что это настоящая утечка, с помощью мониторинга и
    GC-логов, затем сузить поиск профилировщиком с малыми накладными расходами
    (JFR), heap dump'ом в Eclipse MAT (dominator tree, пути до GC-root) и thread
    dump'ом для зависших или утекающих потоков. Разбираем порядок применения
    инструментов, компромиссы каждого и классические причины утечек.

assistantExample:
