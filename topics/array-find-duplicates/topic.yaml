summary:
  en: >
    A coding challenge that frames a classic trade-off: find the duplicate values
    in an array. The HashSet approach is O(n) time but O(n) extra memory; sorting
    then scanning neighbours is O(n log n) time but O(1) extra memory (and mutates
    or copies the input). Implement findDuplicates so every hidden test passes,
    then defend which trade-off you'd pick.
  ru: >
    Кодовая задача, иллюстрирующая классический компромисс: найди повторяющиеся
    значения в массиве. Подход через HashSet — это O(n) по времени, но O(n) по
    дополнительной памяти; сортировка с проходом по соседям — O(n log n) по времени,
    но O(1) по дополнительной памяти (и меняет или копирует вход). Реализуй
    findDuplicates, чтобы прошёл каждый скрытый тест, и обоснуй выбор компромисса.

assistantExample:
