id: decorator-vs-proxy
languages: [en, ru]
title:
  en: Decorator vs Proxy
  ru: Decorator против Proxy
category:
  en: Design Patterns
  ru: Паттерны проектирования
type: DESIGN_PATTERN
# Theory topic: the two patterns share an almost identical class structure, so the
# difference is intent, not shape — there is nothing to build, only to discuss.
mode: theory
aiProvider: claude
aiModel: claude-opus-4-8
categoryId: design-patterns
difficulty: 3
catalogId: design-patterns-7
style: Real world
summary:
  en: >
    Decorator and Proxy look almost identical on a class diagram — both wrap an
    object behind the same interface and delegate to it. The difference is intent:
    a Decorator adds behaviour to an object (and you can stack several), while a
    Proxy controls access to it (lazy loading, caching, security, remoting). This
    topic shows the shared shape, the differences that matter, and how to tell them
    apart in real Java code.
  ru: >
    Decorator и Proxy почти неотличимы на диаграмме классов — оба оборачивают
    объект за тем же интерфейсом и делегируют ему. Разница в намерении: Decorator
    добавляет объекту поведение (и их можно складывать в стопку), а Proxy
    управляет доступом к объекту (ленивая загрузка, кэширование, безопасность,
    удалённые вызовы). В теме показана общая форма, важные различия и как отличить
    их в реальном Java-коде.

assistantExample:
  en: "e.g. Decorator and Proxy have the same class diagram — how do you tell them apart?"
  ru: "например: У Decorator и Proxy одинаковая диаграмма классов — как их различить?"

