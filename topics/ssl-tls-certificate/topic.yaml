defaultExample: what-a-certificate-is

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: what-a-certificate-is
    title:
      en: 'What is actually inside one'
      ru: 'Что внутри него на самом деле'
    file: 01-what-a-certificate-is.java
    explanation:
      en: >
        Four fields and a signature. The name it speaks for, the public key it
        binds to that name, the window it is valid in, and who signed all of
        that. Nothing here is secret - the server hands the same bytes to every
        visitor - and nothing here encrypts anything. Compare the two documents:
        the self-signed one has exactly the same contents, and only the last
        line differs.
      ru: >
        Четыре поля и подпись. Имя, за которое он отвечает, публичный ключ,
        привязанный к этому имени, окно, в котором он действителен, и тот, кто
        всё это подписал. Секретного здесь нет ничего — сервер отдаёт те же
        байты каждому посетителю, — и шифрует здесь тоже ничто. Сравните два
        документа: у самоподписанного ровно то же содержимое, отличается только
        последняя строка.
  - id: the-handshake
    title:
      en: 'From certificate to tunnel'
      ru: 'От сертификата к туннелю'
    file: 02-the-handshake.java
    explanation:
      en: >
        The whole sequence in one run: a plaintext hello, the chain, the five
        checks, the key agreement, and the moment the connection switches to
        symmetric encryption. Watch where the certificate is used and where it
        stops being used - it authenticates the server and then plays no part in
        protecting a single byte of the request.
      ru: >
        Вся последовательность за один прогон: приветствие открытым текстом,
        цепочка, пять проверок, согласование ключей и момент, когда соединение
        переходит на симметричное шифрование. Проследите, где сертификат
        используется и где перестаёт: он аутентифицирует сервер, а дальше не
        участвует в защите ни одного байта запроса.
  - id: the-chain-of-trust
    title:
      en: 'Leaf, intermediate, root'
      ru: 'Конечный, промежуточный, корневой'
    file: 03-the-chain-of-trust.java
    explanation:
      en: >
        Three connections that differ only in what leads upward from the same
        leaf. The first walks all the way to a root the client already had; the
        second cannot be walked at all because the intermediate was not sent;
        the third ends at itself. The mathematics is identical in all three -
        what changes is the name the walk stops at.
      ru: >
        Три соединения, которые отличаются только тем, что ведёт вверх от одного
        и того же конечного сертификата. Первое доходит до корня, который у
        клиента уже был; второе пройти вообще нельзя, потому что промежуточный
        не отправили; третье заканчивается на самом себе. Математика во всех
        трёх одинакова — меняется имя, на котором обход останавливается.
  - id: name-dates-and-revocation
    title:
      en: 'The name, the clock, the withdrawal'
      ru: 'Имя, часы, отзыв'
    file: 04-name-dates-and-revocation.java
    explanation:
      en: >
        Four refusals of certificates that are genuine and correctly signed. A
        certificate issued for another host, a wildcard asked to cover two
        labels instead of one, a certificate the CA has withdrawn, and one that
        simply ran out of days. Note the last pair: nothing was deployed between
        the working connection and the broken one.
      ru: >
        Четыре отказа для настоящих и корректно подписанных сертификатов.
        Сертификат, выпущенный на другой хост; wildcard, от которого просят
        покрыть две метки вместо одной; сертификат, отозванный CA; и просто
        закончившийся по датам. Обратите внимание на последнюю пару: между
        рабочим соединением и сломанным ничего не выкатывали.
  - id: why-copying-it-fails
    title:
      en: 'Why copying it gets you nothing'
      ru: 'Почему копия ничего не даёт'
    file: 05-why-copying-it-fails.java
    explanation:
      en: >
        The impostor presents the real certificate - the same bytes, the same CA
        signature - and every check about its content passes. Then the client
        asks for a signature over the handshake transcript, and there is nothing
        to sign with. This is the answer to 'the certificate is public, so why
        is that safe?': it is a lock, and the private key is the key.
      ru: >
        Самозванец предъявляет настоящий сертификат — те же байты, та же подпись
        CA, — и все проверки его содержимого проходят. Затем клиент просит
        подпись под стенограммой рукопожатия, а подписывать нечем. Это и есть
        ответ на вопрос «сертификат публичен — почему это безопасно?»: он замок,
        а приватный ключ — ключ.
  - id: the-man-in-the-middle
    title:
      en: 'One installed root'
      ru: 'Один установленный корень'
    file: 06-the-man-in-the-middle.java
    explanation:
      en: >
        The same rogue chain twice, with one line in between. Before it, the
        connection is refused; after it, every check passes, the padlock appears
        and the password goes to the wrong party. Nothing in TLS broke - the
        client was told to trust a new root, and trust is the only thing a
        certificate ever proves.
      ru: >
        Одна и та же чужая цепочка дважды, между ними одна строка. До неё
        соединение отклоняется; после — все проверки проходят, появляется
        замочек, и пароль уходит не туда. В TLS ничего не сломалось: клиенту
        сказали доверять новому корню, а доверие — единственное, что сертификат
        вообще доказывает.
  - id: what-encryption-https-uses
    title:
      en: 'Asymmetric to agree, symmetric to carry'
      ru: 'Асимметрия — договориться, симметрия — везти'
    file: 07-what-encryption-https-uses.java
    explanation:
      en: >
        The direct answer to the second half of the question. Look at what each
        kind of cryptography does: the key pair in the certificate signs, an
        ephemeral exchange produces a shared secret, and AES-256-GCM carries the
        data. Then a byte is flipped and the authentication tag catches it -
        integrity is not a separate feature, it is the same operation.
      ru: >
        Прямой ответ на вторую половину вопроса. Посмотрите, что делает каждый
        вид криптографии: ключевая пара из сертификата подписывает, эфемерный
        обмен даёт общий секрет, а AES-256-GCM везёт данные. Затем байт
        переворачивают, и тег аутентичности это ловит — целостность не отдельная
        возможность, а та же самая операция.
  - id: forward-secrecy
    title:
      en: 'Record now, decrypt later'
      ru: 'Записать сейчас, расшифровать потом'
    file: 08-forward-secrecy.java
    explanation:
      en: >
        Two connections that look identical from the outside and differ only in
        how the session key was agreed. Both are recorded; both servers then
        lose their private key. Only one of the recordings opens - which is the
        whole reason TLS 1.3 removed RSA key transport and why 'is the key
        ephemeral?' is a question worth asking about any protocol.
      ru: >
        Два соединения, снаружи неотличимые и различающиеся только тем, как был
        согласован ключ сессии. Оба записывают; оба сервера затем теряют
        приватный ключ. Открывается только одна запись — ровно поэтому в TLS 1.3
        убрали передачу ключа по RSA, и поэтому вопрос «ключ эфемерный?» стоит
        задавать про любой протокол.

