summary:
  en: >
    A practical checklist for speeding up a slow SQL query: read the EXPLAIN plan
    first, index the columns you filter and join on (and keep those predicates
    sargable), fetch only the rows and columns you need, choose joins over
    correlated subqueries, and reduce round-trips. Links out to the focused topics
    on indexes, query plans and prepared statements.
  ru: >
    Практический чек-лист для ускорения медленного SQL-запроса: сначала читай план
    EXPLAIN, индексируй колонки фильтрации и соединения (и держи предикаты
    sargable), выбирай только нужные строки и колонки, предпочитай JOIN
    коррелированным подзапросам и сокращай число обращений к БД. Со ссылками на
    отдельные темы об индексах, планах запросов и prepared statements.

