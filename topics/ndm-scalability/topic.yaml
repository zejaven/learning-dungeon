summary:
  en: >
    What makes a network design scalable: vertical vs horizontal scaling, the
    three-layer hierarchical model, pod-based modularity, hierarchical
    addressing and route summarisation, OSPF/EIGRP control-plane scaling,
    software and cloud approaches, capacity planning, and the anti-patterns
    that kill growth.
  ru: >
    Что делает сетевой дизайн масштабируемым: вертикальное и горизонтальное
    масштабирование, трёхуровневая иерархическая модель, модульный pod-дизайн,
    иерархическая адресация и суммаризация маршрутов, масштабирование
    control plane в OSPF/EIGRP, программные и облачные подходы, планирование
    ёмкости и анти-паттерны, убивающие рост.

