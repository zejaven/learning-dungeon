# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: build-an-image
    title:
      en: Build your first image
      ru: Собери первый образ
    goal:
      en: Turn a packaged Spring Boot jar into a runnable image with a base image, a COPY and an ENTRYPOINT.
      ru: Преврати собранный jar Spring Boot в запускаемый образ с помощью базового образа, COPY и ENTRYPOINT.
    event: IMAGE_BUILT
  - id: hit-the-cache
    title:
      en: Hit the layer cache
      ru: Попади в кеш слоёв
    goal:
      en: Rebuild without changing anything and watch a layer be reused instead of written again.
      ru: Пересобери, ничего не меняя, и увидь, как слой переиспользуется вместо повторной записи.
    event: LAYER_CACHED
  - id: break-the-cache
    title:
      en: Break the cache with one line
      ru: Сломай кеш одной строкой
    goal:
      en: Change a class, rebuild, and find the layer that stops matching — plus everything below it.
      ru: Измени класс, пересобери и найди слой, который перестал совпадать, — и всё, что ниже него.
    event: CACHE_INVALIDATED
  - id: push-only-the-change
    title:
      en: Push only what changed
      ru: Залей только изменившееся
    goal:
      en: Push an image twice with a code change in between and compare what the registry actually receives.
      ru: Залей образ дважды с правкой кода между заливками и сравни, что на самом деле получает реестр.
    event: IMAGE_PUSHED
  - id: drop-the-build-tools
    title:
      en: Leave the build tools behind
      ru: Оставь инструменты сборки за бортом
    goal:
      en: Use a multi-stage build so Maven, the JDK and your sources never reach the shipped image.
      ru: Используй многоэтапную сборку, чтобы Maven, JDK и исходники не попали в итоговый образ.
    event: STAGE_DISCARDED
  - id: shrink-the-context
    title:
      en: Shrink the build context
      ru: Уменьши контекст сборки
    goal:
      en: Add a .dockerignore and see how much never leaves your machine on the next build.
      ru: Добавь .dockerignore и посмотри, сколько при следующей сборке вообще не покидает твою машину.
    event: CONTEXT_IGNORED
  - id: catch-the-root-container
    title:
      en: Catch a container running as root
      ru: Поймай контейнер, работающий от root
    goal:
      en: Run an image with no USER instruction and see who PID 1 turns out to be.
      ru: Запусти образ без инструкции USER и посмотри, кем оказывается PID 1.
    event: RUNS_AS_ROOT
  - id: run-with-a-limit
    title:
      en: Run it under a memory limit
      ru: Запусти под лимитом памяти
    goal:
      en: Start the container with a memory limit and check how much heap the JVM decides to take.
      ru: Запусти контейнер с лимитом памяти и проверь, сколько кучи решит взять JVM.
    event: CONTAINER_STARTED

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: how-to-build-an-image
    en: How do you build a Docker image from your Spring Boot application? Walk through the Dockerfile line by line.
    ru: Как собрать Docker-образ из приложения на Spring Boot? Разбери Dockerfile строка за строкой.
  - id: base-image-choice
    en: Which base image would you choose for a Spring Boot service, and why not the JDK one? What about Alpine or a distroless image?
    ru: Какой базовый образ ты выберешь для сервиса на Spring Boot и почему не JDK? Что насчёт Alpine или distroless?
  - id: what-is-a-layer
    en: What is a Docker layer, and what exactly makes the daemon reuse one or rebuild it?
    ru: Что такое слой в Docker и что именно заставляет демон переиспользовать его или пересобрать?
  - id: instruction-order
    en: Why does the ORDER of instructions in a Dockerfile change how long a build takes?
    ru: Почему ПОРЯДОК инструкций в Dockerfile меняет длительность сборки?
  - id: fat-jar-problem
    en: What is wrong with 'COPY target/app.jar app.jar' as the only COPY in an image you deploy ten times a day?
    ru: Что не так с 'COPY target/app.jar app.jar' как единственным COPY в образе, который деплоят десять раз в день?
  - id: layered-jar
    en: What are Spring Boot's jar layers, how do you extract them, and in which order should the Dockerfile copy them?
    ru: Какие слои есть у jar-файла Spring Boot, как их извлечь и в каком порядке Dockerfile должен их копировать?
  - id: does-layering-shrink-the-image
    en: Does a layered jar make the image smaller? If not, what does it actually save?
    ru: Делает ли слоистый jar образ меньше? Если нет, то что он на самом деле экономит?
  - id: multi-stage-build
    en: What is a multi-stage build, and what problem does it solve that a single-stage Dockerfile cannot?
    ru: Что такое многоэтапная сборка и какую проблему она решает, которую одноэтапный Dockerfile решить не может?
  - id: build-context
    en: What is the build context, and what goes wrong when you never write a .dockerignore?
    ru: Что такое контекст сборки и что ломается, если никогда не писать .dockerignore?
  - id: jvm-memory-in-container
    en: How much heap does a JVM take inside a container limited to 512 MB, and how do you change that?
    ru: Сколько кучи возьмёт JVM внутри контейнера с лимитом 512 МБ и как это изменить?
  - id: non-root-user
    en: Why should a container not run as root, and how do you fix it in the Dockerfile?
    ru: Почему контейнер не должен работать от root и как это исправить в Dockerfile?
  - id: config-and-secrets
    en: The same image has to run in staging and production with different databases and passwords. How do you configure it?
    ru: Один и тот же образ должен работать на staging и в проде с разными базами и паролями. Как его конфигурировать?
  - id: tags-and-latest
    en: How would you tag your images, and what is wrong with deploying ':latest'?
    ru: Как ты будешь именовать теги образов и что не так с деплоем ':latest'?
  - id: buildpacks-vs-dockerfile
    en: What do 'mvn spring-boot:build-image' and Jib do, and when would you prefer one of them over a hand-written Dockerfile?
    ru: Что делают 'mvn spring-boot:build-image' и Jib и когда ты предпочтёшь их написанному вручную Dockerfile?
  - id: entrypoint-vs-cmd
    en: What is the difference between ENTRYPOINT and CMD, and between their shell and exec forms? Why does it matter for shutting a Spring Boot app down?
    ru: Чем ENTRYPOINT отличается от CMD и чем shell-форма отличается от exec-формы? Почему это важно для корректной остановки приложения Spring Boot?
  - id: expose-and-ports
    en: Does EXPOSE publish a port? How does the container's port actually become reachable?
    ru: Публикует ли EXPOSE порт? Как порт контейнера на самом деле становится доступным?
  - id: image-size-in-practice
    en: Your image is 800 MB. Walk through how you would find out why and what you would try first.
    ru: Твой образ весит 800 МБ. Опиши, как ты выяснишь причину и что попробуешь в первую очередь.
  - id: ci-cache-problem
    en: 'Builds are fast locally and slow in CI, where every dependency is downloaded again. What is happening and how do you fix it?'
    ru: 'Локально сборка быстрая, а в CI медленная и все зависимости скачиваются заново. Что происходит и как это чинить?'
  - id: secrets-in-layers
    en: A colleague passes a password with '--build-arg' and deletes the file in a later RUN. Is the password safe in the published image?
    ru: Коллега передаёт пароль через '--build-arg' и удаляет файл в следующем RUN. Безопасен ли пароль в опубликованном образе?
  - id: healthcheck-and-actuator
    en: How does an orchestrator find out that your containerized Spring Boot app is alive and ready to receive traffic?
    ru: Как оркестратор узнаёт, что твоё приложение Spring Boot в контейнере живо и готово принимать трафик?
