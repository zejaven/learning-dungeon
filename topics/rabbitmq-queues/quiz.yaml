# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: first-ack
    title:
      en: Complete one delivery
      ru: Доведи одну доставку до конца
    goal:
      en: Publish a message, let it be pushed to a consumer, and acknowledge it.
      ru: Опубликуй сообщение, дай протолкнуть его потребителю и подтверди его.
    event: MESSAGE_ACKED
  - id: unroutable
    title:
      en: Publish into the void
      ru: Опубликуй в никуда
    goal:
      en: Publish with a routing key no binding matches and watch the message vanish.
      ru: Опубликуй с routing key, под который нет привязки, и посмотри, как сообщение исчезнет.
    event: MESSAGE_UNROUTABLE
  - id: fair-dispatch
    title:
      en: Hit the prefetch limit
      ru: Упрись в лимит prefetch
    goal:
      en: Publish more messages than the consumers' prefetch budget so one has to wait in the queue.
      ru: Опубликуй больше сообщений, чем позволяет prefetch потребителей, чтобы одно осталось ждать в очереди.
    event: PREFETCH_BLOCKED
  - id: redelivery
    title:
      en: Lose an ack
      ru: Потеряй ack
    goal:
      en: Kill a consumer that still holds an unacked message and watch the broker redeliver it.
      ru: Убей потребителя с неподтверждённым сообщением и посмотри, как брокер доставит его снова.
    event: CONSUMER_CRASHED
  - id: dead-letter
    title:
      en: Park a poison message
      ru: Отправь ядовитое сообщение в отстойник
    goal:
      en: Reject a message without requeue on a queue that has a dead-letter target.
      ru: Отклони сообщение без requeue на очереди, у которой есть dead-letter очередь.
    event: MESSAGE_DEAD_LETTERED

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: path-of-a-message
    en: Walk me through the path of one message in RabbitMQ, from publish to deletion.
    ru: Проведи меня по пути одного сообщения в RabbitMQ — от публикации до удаления.
  - id: exchange-vs-queue
    en: Why does a producer publish to an exchange instead of to a queue, and what do bindings do?
    ru: Почему продюсер публикует в exchange, а не в очередь, и за что отвечают привязки?
  - id: exchange-types
    en: What exchange types exist and when would you use each?
    ru: Какие бывают типы exchange и когда какой использовать?
  - id: ack-semantics
    en: What exactly does an ack do, and what happens if a consumer never sends one?
    ru: Что именно делает ack и что произойдёт, если потребитель его так и не отправит?
  - id: at-least-once
    en: Why is the practical delivery guarantee at-least-once, and how do you cope with duplicates?
    ru: Почему практическая гарантия доставки — at-least-once и как жить с дубликатами?
  - id: prefetch
    en: What is prefetch (basic.qos) and what goes wrong with an unlimited one?
    ru: Что такое prefetch (basic.qos) и что ломается, если он неограничен?
  - id: dead-letter-queue
    en: What is a dead-letter queue and which situations send a message there?
    ru: Что такое dead-letter очередь и в каких случаях сообщение туда попадает?
  - id: durability
    en: What does it take for a message to survive a broker restart?
    ru: Что нужно, чтобы сообщение пережило перезапуск брокера?
  - id: ordering
    en: Does a queue guarantee ordering? What breaks it?
    ru: Гарантирует ли очередь порядок сообщений? Что его ломает?
  - id: growing-queue
    en: Your queue depth is growing in production. How do you diagnose and fix it?
    ru: В проде растёт глубина очереди. Как ты это диагностируешь и чинишь?
