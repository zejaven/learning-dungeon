summary:
  en: >
    On one server a log is a file and the tools are ssh, tail and grep. With a
    dozen replicas of six services on ephemeral containers that answer collapses:
    the instance that printed the stack trace has already been deleted, and its
    filesystem with it. Kibana is the search-and-dashboard UI that gives you one
    place to ask "what happened at 14:03?" — but it stores nothing and collects
    nothing. The logs get there through a pipeline: the application writes plain
    lines, preferably JSON, to stdout; the container runtime captures that into a
    file on the node; a collector such as Filebeat or Fluent Bit, usually a
    DaemonSet, tails those files, enriches each line with pod, namespace and
    labels, and ships it, sometimes through Logstash or Kafka, into Elasticsearch,
    which indexes it into a time-based index. Kibana then queries Elasticsearch.
    Knowing that chain is the whole answer, because every real problem —
    unparsed stack traces, missing lines, secrets in logs, a retention bill —
    lives at one specific link in it.
  ru: >
    На одном сервере лог — это файл, а инструменты — ssh, tail и grep. С десятком
    реплик шести сервисов в эфемерных контейнерах такой ответ рассыпается:
    экземпляр, напечатавший стектрейс, уже удалён вместе со своей файловой
    системой. Kibana — это интерфейс поиска и дашбордов, дающий одно место, где
    можно спросить «что произошло в 14:03», но сама она ничего не хранит и ничего
    не собирает. Логи попадают туда по конвейеру: приложение пишет строки, лучше
    в JSON, в stdout; среда выполнения контейнеров складывает это в файл на узле;
    коллектор вроде Filebeat или Fluent Bit, обычно DaemonSet, читает эти файлы,
    обогащает каждую строку именем пода, namespace и метками и отправляет —
    иногда через Logstash или Kafka — в Elasticsearch, который кладёт её в
    индекс с привязкой ко времени. А уже Kibana делает запросы к Elasticsearch.
    Знание этой цепочки и есть ответ целиком, потому что каждая реальная
    проблема — неразобранные стектрейсы, пропавшие строки, секреты в логах, счёт
    за хранение — живёт на конкретном её звене.

assistantExample:
  en: 'e.g. A user reports an error at 14:03 but nothing is in Kibana — where in the pipeline would you look?'
  ru: 'например: Пользователь сообщил об ошибке в 14:03, но в Kibana ничего нет — на каком звене конвейера будете искать?'

