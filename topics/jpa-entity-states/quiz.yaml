missions:
  - id: create-transient
    title:
      en: Create a transient entity
      ru: Создай transient-сущность
    goal:
      en: Run code that creates a new entity object before EntityManager tracks it.
      ru: Запусти код, который создаёт новый объект сущности до того, как EntityManager начнёт его отслеживать.
    event: JPA_ENTITY_TRANSIENT
  - id: persist-managed
    title:
      en: Make it managed
      ru: Сделай её managed
    goal:
      en: Call persist() so a transient entity enters the Persistence Context.
      ru: Вызови persist(), чтобы transient-сущность вошла в Persistence Context.
    event: JPA_PERSIST
  - id: detach-entity
    title:
      en: Detach an entity
      ru: Отсоедини сущность
    goal:
      en: Load or persist an entity, then detach it from the Persistence Context.
      ru: Загрузи или сохрани сущность, затем отсоедини её от Persistence Context.
    event: JPA_DETACH
  - id: merge-copy
    title:
      en: Merge a detached object
      ru: Выполни merge detached-объекта
    goal:
      en: Change a detached object and call merge() to copy its state into a managed instance.
      ru: Измени detached-объект и вызови merge(), чтобы скопировать его состояние в managed-экземпляр.
    event: JPA_MERGE
  - id: remove-managed
    title:
      en: Mark as removed
      ru: Пометь как removed
    goal:
      en: Call remove() on a managed entity and then flush the pending DELETE.
      ru: Вызови remove() на managed-сущности, а затем flush для pending DELETE.
    event: JPA_REMOVE

bossFight:
  - id: list-four-states
    en: 'Name the four main JPA entity states and give one sentence for each.'
    ru: 'Назови четыре основных состояния сущности в JPA и дай по одному предложению для каждого.'
  - id: transient-to-managed
    en: 'What exactly changes when you call persist() on a transient entity?'
    ru: 'Что именно меняется, когда вызывают persist() для transient-сущности?'
  - id: find-managed-context
    en: 'Why does find() usually return a managed entity, and what role does the Persistence Context play?'
    ru: 'Почему find() обычно возвращает managed-сущность и какую роль играет Persistence Context?'
  - id: detach-clear-close
    en: 'Compare detach(), clear() and close(): what becomes detached in each case?'
    ru: 'Сравни detach(), clear() и close(): что становится detached в каждом случае?'
  - id: merge-copy
    en: 'Why is merge() dangerous to misunderstand, and why should you use its return value?'
    ru: 'Почему merge() опасно неправильно понимать и почему нужно использовать его возвращаемое значение?'
  - id: removed-flush-delete
    en: 'What happens after remove(), and when is the DELETE sent to the database?'
    ru: 'Что происходит после remove() и когда DELETE отправляется в базу данных?'
  - id: detached-change-no-update
    en: 'If you change a detached entity, why does dirty checking not automatically update the database?'
    ru: 'Если изменить detached-сущность, почему dirty checking не обновит базу автоматически?'
