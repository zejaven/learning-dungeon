# Theory topic: no missions (there is no practice editor) - only a Boss Fight.
bossFight:
  - id: where-to-start
    en: Where do you start when deciding which indexes a slow query needs?
    ru: С чего ты начинаешь, решая, какие индексы нужны медленному запросу?
  - id: which-columns
    en: Which parts of a query supply the columns worth indexing?
    ru: Какие части запроса дают колонки, которые стоит индексировать?
  - id: column-order
    en: 'For "WHERE tenant_id = ? AND status = ? ORDER BY created_at", what index would you create and why that column order?'
    ru: 'Для "WHERE tenant_id = ? AND status = ? ORDER BY created_at" какой индекс ты создашь и почему такой порядок колонок?'
  - id: equality-sort-range
    en: Explain the equality-then-sort-then-range ordering rule for composite index columns.
    ru: Объясни правило порядка «равенство, затем сортировка, затем диапазон» для колонок составного индекса.
  - id: selectivity
    en: What is selectivity, and why might an index on a boolean column not help?
    ru: Что такое селективность и почему индекс по boolean-колонке может не помочь?
  - id: leftmost-prefix
    en: Why can one composite index serve several queries, and which queries can it not help?
    ru: Почему один составной индекс может обслужить несколько запросов и каким запросам он не поможет?
  - id: covering-index
    en: What is a covering index, and when is it worth the extra width?
    ru: Что такое covering-индекс и когда он оправдывает лишнюю ширину?
  - id: over-indexing
    en: What are the costs of adding too many indexes?
    ru: Какова цена добавления слишком большого числа индексов?
  - id: index-not-used
    en: Even after you add the right index, why might the plan still not use it?
    ru: Даже после добавления правильного индекса, почему план всё равно может его не использовать?
