missions:
  - id: compare-two-values
    title:
      en: Compare two values
      ru: Сравни два значения
    goal:
      en: Run an example that calls equals() and displays both hashCode values.
      ru: Запусти пример, который вызывает equals() и показывает оба значения hashCode.
    event: EQUALITY_COMPARE
  - id: prove-contract-ok
    title:
      en: Prove the contract
      ru: Докажи контракт
    goal:
      en: Produce equal objects whose hashCode values also match.
      ru: Получи равные объекты, у которых значения hashCode тоже совпадают.
    event: EQUALITY_CONTRACT_OK
  - id: break-contract
    title:
      en: Break the contract
      ru: Нарушь контракт
    goal:
      en: Show two equal objects with different hashCode values.
      ru: Покажи два равных объекта с разными значениями hashCode.
    event: EQUALITY_CONTRACT_BROKEN
  - id: reject-duplicate
    title:
      en: Reject a duplicate
      ru: Отклони дубликат
    goal:
      en: Add two equal values with the same hashCode and see the second add rejected.
      ru: Добавь два равных значения с одинаковым hashCode и увидь, что второй add отклонён.
    event: EQUALITY_DUPLICATE_REJECTED
  - id: miss-mutated-key
    title:
      en: Miss a mutated key
      ru: Промахнись по изменённому ключу
    goal:
      en: Mutate a field used by hashCode() after insertion so contains() looks in the wrong bucket.
      ru: Измени после вставки поле, участвующее в hashCode(), чтобы contains() посмотрел не в тот бакет.
    event: EQUALITY_LOOKUP_MISSED
  - id: catch-symmetry-break
    title:
      en: Catch symmetry break
      ru: Поймай нарушение симметрии
    goal:
      en: Run the inheritance example where a.equals(b) and b.equals(a) disagree.
      ru: Запусти пример с наследованием, где a.equals(b) и b.equals(a) расходятся.
    event: EQUALITY_SYMMETRY_BROKEN

bossFight:
  - id: contract-rules
    en: What is the contract between equals() and hashCode(), and which equals() rules also matter?
    ru: Какой контракт связывает equals() и hashCode(), и какие правила equals() тоже важны?
  - id: value-class-fields
    en: How do you choose fields for equals() and hashCode() in a value class?
    ru: Как выбирать поля для equals() и hashCode() в классе-значении?
  - id: hashset-failure
    en: What can happen in HashSet or HashMap if equals() is true but hashCode() differs?
    ru: Что может случиться в HashSet или HashMap, если equals() возвращает true, но hashCode() различается?
  - id: mutable-fields
    en: Why should fields used by equals() and hashCode() usually be immutable?
    ru: Почему поля, участвующие в equals() и hashCode(), обычно должны быть неизменяемыми?
  - id: inheritance-symmetry
    en: Why can equals() become dangerous in class hierarchies, and how do getClass() and instanceof differ here?
    ru: Почему equals() опасен в иерархиях классов и чем здесь отличаются getClass() и instanceof?
  - id: records-lombok
    en: When are records or Lombok useful for equals() and hashCode(), and what should you still verify?
    ru: Когда records или Lombok полезны для equals() и hashCode(), и что всё равно нужно проверить?
