summary:
  en: >
    Learn when a single complex SQL query should stay in the database and when it
    is safer to split the work into several clear Java-side steps: data volume,
    query plans, network round-trips, consistency, transactions, maintainability
    and production ownership all matter.
  ru: >
    Разбери, когда один сложный SQL-запрос лучше оставить в базе, а когда
    безопаснее разбить работу на несколько понятных шагов на стороне Java:
    важны объём данных, планы запросов, сетевые обращения, консистентность,
    транзакции, поддерживаемость и ответственность в продакшене.

assistantExample:
  en: 'e.g. When would you split one complex SQL query into several simpler queries handled by Java?'
  ru: 'например: Когда стоит разбить один сложный SQL-запрос на несколько простых запросов, которыми управляет Java?'

