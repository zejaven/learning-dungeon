id: spring-self-invocation
title:
  en: 'Self-Invocation and @Transactional'
  ru: 'Self-Invocation и @Transactional'
category:
  en: Spring / Transactions
  ru: Spring / Транзакции
type: SPRING
mode: trace
aiProvider: claude
aiModel: claude-opus-4-8
categoryId: spring
difficulty: 2
catalogId: manual-15
style: Real world
summary:
  en: >
    What happens when a method of a Spring bean calls another method of the SAME
    bean with this.method(): the internal call goes straight to the target object
    and skips the proxy, so the transaction interceptor never runs. A @Transactional
    inner method then opens no transaction (or silently ignores its propagation).
    Watch the proxy be bypassed, then fix it by calling through an injected
    self/proxy reference or by moving the method to another bean.
  ru: >
    Что происходит, когда метод Spring bean вызывает другой метод ТОГО ЖЕ bean
    через this.method(): внутренний вызов идёт прямо на target-объект и обходит
    proxy, поэтому transaction interceptor не выполняется. @Transactional у
    внутреннего метода тогда не открывает транзакцию (или молча игнорирует свою
    propagation). Посмотрите, как proxy обходится, и почините это вызовом через
    инжектированную ссылку на self/proxy или переносом метода в другой bean.
primitives: [ArrayGrid]
defaultExample: the-bug
examples:
  - id: happy-path
    title:
      en: 'External call (works)'
      ru: 'Внешний вызов (работает)'
    file: 01-happy-path.java
    explanation:
      en: >
        A client calls a @Transactional method through the proxy; the
        interceptor opens and commits a transaction.
      ru: >
        Клиент вызывает @Transactional-метод через proxy; interceptor открывает
        и коммитит транзакцию.
  - id: the-bug
    title:
      en: 'Self-invocation (bug)'
      ru: 'Self-invocation (баг)'
    file: 02-the-bug.java
    explanation:
      en: >
        A plain method self-invokes a @Transactional method via this.method();
        the proxy is skipped and the work runs with no transaction.
      ru: >
        Обычный метод вызывает @Transactional-метод через this.method(); proxy
        пропущен, и работа выполняется без транзакции.
  - id: requires-new-ignored
    title:
      en: 'REQUIRES_NEW ignored'
      ru: 'REQUIRES_NEW игнорируется'
    file: 03-requires-new-ignored.java
    explanation:
      en: >
        A @Transactional method self-invokes a @Transactional(REQUIRES_NEW)
        audit; the expected independent transaction never starts.
      ru: >
        @Transactional-метод вызывает @Transactional(REQUIRES_NEW) audit через
        self; ожидаемая независимая транзакция не стартует.
  - id: fix-self-injection
    title:
      en: 'Fix: self/proxy reference'
      ru: 'Фикс: ссылка на self/proxy'
    file: 04-fix-self-injection.java
    explanation:
      en: >
        Calling through an injected self/proxy reference re-enters the proxy, so
        @Transactional takes effect again.
      ru: >
        Вызов через инжектированную ссылку на self/proxy снова входит в proxy, и
        @Transactional начинает работать.
  - id: fix-extract-bean
    title:
      en: 'Fix: extract to a bean'
      ru: 'Фикс: вынести в bean'
    file: 05-fix-extract-bean.java
    explanation:
      en: >
        Moving the method to a separate bean makes the call cross a real proxy
        boundary, so the interceptor runs.
      ru: >
        Перенос метода в отдельный bean заставляет вызов пересечь реальную
        границу proxy, и interceptor выполняется.
  - id: required-joins
    title:
      en: 'REQUIRED joins outer tx'
      ru: 'REQUIRED входит в внешнюю tx'
    file: 06-required-joins.java
    explanation:
      en: >
        With the fix in place, an inner REQUIRED method correctly joins the
        caller's transaction instead of starting a new one.
      ru: >
        С фиксом внутренний REQUIRED-метод корректно присоединяется к
        транзакции вызывающего, а не открывает новую.
assistantExample:
  en: 'e.g. If a method with @Transactional calls another method of the same class, does a transaction start, and how do I fix it?'
  ru: 'например: Если метод с @Transactional вызывает другой метод этого же класса, начнётся ли транзакция и как это исправить?'
missionsFile: quiz.yaml
