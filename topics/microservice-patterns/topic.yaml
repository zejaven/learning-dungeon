summary:
  en: >
    Microservice patterns are not GoF patterns - they are recurring solutions to
    the problems a distributed system creates, and the useful way to hold them in
    your head is by the question each one answers. Decomposition patterns decide
    where to cut the system (by business capability, by subdomain, Strangler Fig).
    Communication patterns decide how services talk (RPC, messaging, API gateway,
    BFF, service discovery). Data patterns replace the transaction you lost when
    every service got its own database (database per service, Saga, Transactional
    Outbox, Idempotent Consumer, API Composition, CQRS, event sourcing).
    Reliability patterns keep one sick service from taking the system down
    (timeout, retry with backoff, circuit breaker, bulkhead, fallback).
    Cross-cutting patterns industrialise the rest (externalized configuration,
    microservice chassis, sidecar, service mesh, health check API, distributed
    tracing, consumer-driven contract tests). Most of them exist to buy back a
    guarantee that a single database and a single process used to give for free.
  ru: >
    Микросервисные паттерны - это не паттерны GoF, а повторяющиеся решения
    проблем, которые создаёт распределённая система, и держать их в голове удобнее
    всего по вопросу, на который каждый из них отвечает. Паттерны декомпозиции
    решают, где резать систему (по бизнес-возможностям, по поддоменам, Strangler
    Fig). Паттерны коммуникации решают, как сервисы общаются (RPC, обмен
    сообщениями, API gateway, BFF, service discovery). Паттерны данных заменяют
    транзакцию, потерянную в момент, когда у каждого сервиса появилась своя база
    (база на сервис, Saga, Transactional Outbox, идемпотентный потребитель, API
    Composition, CQRS, event sourcing). Паттерны надёжности не дают одному
    больному сервису уронить систему (таймаут, повтор с выдержкой, circuit
    breaker, bulkhead, fallback). Сквозные паттерны ставят на поток всё остальное
    (внешняя конфигурация, microservice chassis, sidecar, service mesh, health
    check API, распределённая трассировка, контрактные тесты со стороны
    потребителя). Большинство из них существует, чтобы выкупить обратно гарантию,
    которую одна база и один процесс давали бесплатно.

