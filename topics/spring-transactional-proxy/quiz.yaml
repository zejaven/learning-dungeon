missions:
  - id: begin-via-proxy
    title:
      en: Open a transaction
      ru: Открой транзакцию
    goal:
      en: Call a @Transactional method through the proxy so it opens a transaction before the body runs.
      ru: Вызови @Transactional метод через proxy, чтобы он открыл транзакцию до выполнения тела.
    event: TX_BEGIN
  - id: commit-on-return
    title:
      en: Commit on normal return
      ru: Зафиксируй при нормальном выходе
    goal:
      en: Let a transactional method return normally so the proxy commits the staged rows.
      ru: Дай транзакционному методу завершиться нормально, чтобы proxy зафиксировал подготовленные строки.
    event: TX_COMMIT
  - id: rollback-on-runtime
    title:
      en: Roll back on a runtime exception
      ru: Откати на runtime exception
    goal:
      en: Throw an unchecked exception out of a transactional method so the proxy rolls the transaction back.
      ru: Брось unchecked exception из транзакционного метода, чтобы proxy откатил транзакцию.
    event: TX_ROLLBACK
  - id: trigger-self-invocation
    title:
      en: Trigger the self-invocation trap
      ru: Запусти ловушку self-invocation
    goal:
      en: Make a method call this.other() internally so the call bypasses the proxy.
      ru: Сделай так, чтобы метод вызвал this.other() внутренне, и вызов обошёл proxy.
    event: TX_SELF_INVOCATION
  - id: see-missing-transaction
    title:
      en: See a method run with no transaction
      ru: Увидь метод без транзакции
    goal:
      en: Observe a @Transactional method running with no active transaction because the proxy was bypassed.
      ru: Понаблюдай, как @Transactional метод выполняется без активной транзакции, потому что proxy был обойдён.
    event: TX_NO_TRANSACTION

bossFight:
  - id: what-and-why
    en: 'What is @Transactional for, and what does Spring do when a @Transactional method is called?'
    ru: 'Для чего нужен @Transactional, и что делает Spring, когда вызывается @Transactional метод?'
  - id: proxy-under-the-hood
    en: 'How is @Transactional implemented under the hood — what is the role of the AOP proxy?'
    ru: 'Как @Transactional реализован под капотом — какова роль AOP proxy?'
  - id: jdk-vs-cglib
    en: 'What is the difference between a JDK dynamic proxy and a CGLIB proxy, and when does Spring use each for @Transactional?'
    ru: 'В чём разница между JDK dynamic proxy и CGLIB proxy, и когда Spring использует каждый для @Transactional?'
  - id: self-invocation-trap
    en: 'Why is @Transactional ignored when a method calls another @Transactional method of the same class through this?'
    ru: 'Почему @Transactional игнорируется, когда метод вызывает другой @Transactional метод того же класса через this?'
  - id: private-and-final
    en: 'Why does @Transactional not work on private (or, for CGLIB, final) methods?'
    ru: 'Почему @Transactional не работает на private (а для CGLIB — на final) методах?'
  - id: commit-rollback-boundary
    en: 'At what point does the proxy decide to commit or roll back, and why must the exception leave the method to cause a rollback?'
    ru: 'В какой момент proxy решает фиксировать или откатывать, и почему exception должен выйти из метода, чтобы вызвать откат?'
