# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: watch-a-duplicate-land
    title:
      en: Watch a duplicate land
      ru: Посмотри, как появляется дубль
    goal:
      en: Run an unguarded endpoint twice with the same sale and see a second row appear in the table.
      ru: Запусти незащищённый эндпоинт дважды с одной продажей и посмотри, как в таблице появляется вторая строка.
    event: DUPLICATE_REGISTERED
  - id: block-the-retry
    title:
      en: Block the retry
      ru: Заблокируй повтор
    goal:
      en: Give the sale an explicit key and make the repeat request apply nothing and replay the stored response.
      ru: Дай продаже явный ключ и добейся, чтобы повторный запрос ничего не применил и вернул сохранённый ответ.
    event: DUPLICATE_BLOCKED
  - id: let-the-database-arbitrate
    title:
      en: Let the database arbitrate
      ru: Пусть решает база
    goal:
      en: Send two overlapping requests with the same key and let a UNIQUE index reject the loser.
      ru: Отправь два пересекающихся запроса с одним ключом и дай UNIQUE-индексу отклонить проигравшего.
    event: CONSTRAINT_VIOLATION
  - id: dont-dedup-by-content
    title:
      en: 'Break payload dedup'
      ru: 'Сломай дедупликацию по телу'
    goal:
      en: Deduplicate by a hash of the body and lose a second customer's real sale of the same item.
      ru: Дедуплицируй по хэшу тела и потеряй настоящую продажу того же товара второму покупателю.
    event: GENUINE_SALE_LOST
  - id: commit-them-together
    title:
      en: Split the transaction
      ru: Раздели транзакцию
    goal:
      en: Commit the dedup row without its sale and watch every retry be answered 'already done' forever.
      ru: Зафиксируй строку дедупликации без продажи и посмотри, как на каждый повтор навсегда отвечают «уже сделано».
    event: SALE_SILENTLY_LOST
  - id: keep-keys-long-enough
    title:
      en: Purge the dedup keys
      ru: Очисти ключи дедупликации
    goal:
      en: Run the retention job with a window shorter than the retry and reopen the duplicate hole.
      ru: Запусти задачу очистки с окном короче повтора и снова открой дыру для дублей.
    event: KEYS_PURGED
  - id: same-key-different-body
    title:
      en: 'Reuse a key for another sale'
      ru: 'Переиспользуй ключ для другой продажи'
    goal:
      en: Send a known key with a different body and make the API answer 409 instead of replaying the old response.
      ru: Отправь известный ключ с другим телом и добейся, чтобы API ответил 409, а не повторил старый ответ.
    event: KEY_CONFLICT

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: sources-of-duplicates
    en: Where do duplicate sales actually come from? Name the paths that can deliver the same sale twice.
    ru: Откуда на самом деле берутся дубли продаж? Назови пути, по которым одна продажа может прийти дважды.
  - id: what-makes-two-requests-the-same-sale
    en: What exactly makes two requests "the same sale"? How do you define that identity, and who assigns it?
    ru: Что именно делает два запроса «одной и той же продажей»? Как определяется эта идентичность и кто её назначает?
  - id: why-check-then-insert-fails
    en: A colleague deduplicates with 'if not exists, then insert'. Why is that not a guard, and what does it take to break it?
    ru: Коллега дедуплицирует через «если нет — вставить». Почему это не защита и что нужно, чтобы её сломать?
  - id: database-level-mechanisms
    en: What are the database-level ways to enforce uniqueness for a sale, and how do they differ in practice?
    ru: Какими средствами базы данных можно обеспечить уникальность продажи и чем они различаются на практике?
  - id: atomicity-of-dedup-and-write
    en: Why must the dedup record and the sale be written in one transaction? Describe what breaks in each order if they are not.
    ru: Почему запись дедупликации и продажа должны писаться в одной транзакции? Опиши, что ломается при каждом порядке, если это не так.
  - id: dedup-key-retention
    en: How long do you keep dedup keys, what does the storage cost you, and what breaks when the window is too short?
    ru: Как долго хранить ключи дедупликации, во что обходится их хранение и что ломается, если окно слишком короткое?
  - id: payload-hash-vs-explicit-key
    en: When, if ever, is deduplicating by a hash of the payload acceptable, and what does it cost you?
    ru: Когда — если вообще — допустима дедупликация по хэшу тела запроса и во что она обходится?
  - id: dedup-across-instances
    en: The service runs on ten instances behind a load balancer. Where does the deduplication state live and why?
    ru: Сервис работает на десяти инстансах за балансировщиком. Где живёт состояние дедупликации и почему?
  - id: broker-redelivery
    en: Sales arrive from a message broker that guarantees at-least-once delivery. How does the consumer avoid duplicates?
    ru: Продажи приходят из брокера сообщений с гарантией at-least-once. Как консьюмер избегает дублей?
  - id: dedup-in-a-distributed-write
    en: Registering a sale also writes to an inventory service. How do you keep a retry from double-decrementing stock?
    ru: Регистрация продажи ещё и пишет в сервис склада. Как не дать повтору дважды списать остаток?
  - id: detecting-duplicates-after-the-fact
    en: Duplicates already reached production. How do you find them and how do you fix the books safely?
    ru: Дубли уже попали в прод. Как их найти и как безопасно исправить учёт?
  - id: cost-of-over-deduplication
    en: Which is worse for a sales system — a duplicate or a lost sale — and how does that shape your defaults?
    ru: Что хуже для системы продаж — дубль или потерянная продажа — и как это влияет на выбираемые по умолчанию решения?
