missions:
  - id: split-the-addition
    title:
      en: Split the addition
      ru: Раздели сложение
    goal:
      en: Run code that reads a shared counter before writing the incremented value back.
      ru: Запусти код, который читает общий counter перед записью увеличенного значения обратно.
    event: UNSAFE_READ
  - id: show-lost-update
    title:
      en: Show a lost update
      ru: Покажи потерянное обновление
    goal:
      en: Run two unprotected increments that both read the same old value and produce a lost update.
      ru: Запусти два незащищённых increment, которые читают одно и то же старое значение и дают потерянное обновление.
    event: LOST_UPDATE
  - id: protect-with-lock
    title:
      en: Protect the write
      ru: Защити запись
    goal:
      en: Read and write the shared counter while the thread owns the lock.
      ru: Прочитай и запиши общий counter, пока thread владеет lock.
    event: SHARED_WRITE
  - id: make-second-thread-wait
    title:
      en: Make the second thread wait
      ru: Заставь второй thread ждать
    goal:
      en: Try to enter the same protected addition from T2 while T1 still owns the lock.
      ru: Попробуй войти в то же защищённое сложение из T2, пока T1 ещё владеет lock.
    event: THREAD_WAITING
  - id: keep-unrelated-work-outside
    title:
      en: Keep other work outside
      ru: Оставь другую работу снаружи
    goal:
      en: Run work that does not touch the shared counter outside the locked addition.
      ru: Выполни работу, которая не трогает общий counter, вне сложения под lock.
    event: OUTSIDE_WORK

bossFight:
  - id: direct-answer
    en: Is numeric addition in Java thread-safe by itself?
    ru: Является ли сложение чисел в Java потокобезопасным само по себе?
  - id: local-vs-shared
    en: Why is adding to a local variable safe, but adding to a shared field can be unsafe?
    ru: Почему сложение с локальной переменной безопасно, а сложение с общим field может быть небезопасным?
  - id: read-modify-write
    en: What are the separate steps inside `count = count + 1`?
    ru: Какие отдельные шаги есть внутри `count = count + 1`?
  - id: lost-update
    en: Explain how two threads can both increment a counter and still leave the final value increased only once.
    ru: Объясни, как два threads могут оба увеличить counter, но итоговое значение увеличится только один раз.
  - id: volatile-trap
    en: Why does `volatile int count` not make `count++` atomic?
    ru: Почему `volatile int count` не делает `count++` атомарным?
  - id: safe-tools
    en: Which Java tools can make shared numeric increments safe, and how do you choose between them?
    ru: Какие инструменты Java могут сделать общий numeric increment безопасным и как выбрать между ними?
