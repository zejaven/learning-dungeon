bossFight:
  # I. Defining Manageability and Economic Impact
  - id: defining-manageability
    en: 'How do the sources define "manageability" in the context of modern infrastructure, and why is it considered a foundational goal alongside scalability, availability, and security?'
    ru: 'Как источники определяют «управляемость» в контексте современной инфраструктуры, и почему она считается фундаментальной целью наряду с масштабируемостью, доступностью и безопасностью?'
  - id: opex-reduction
    en: 'Discuss the economic impact of effective manageability. How does an inherently manageable design specifically reduce Operational Expenditure (OpEx)?'
    ru: 'Обсудите экономический эффект эффективной управляемости. Как изначально управляемый дизайн конкретно снижает операционные расходы (OpEx)?'
  - id: priority-of-management
    en: 'Why is it argued that a network is only as functional as the team''s ability to keep it running, rendering speed and security secondary if the system is unmanageable?'
    ru: 'Почему утверждается, что сеть функциональна ровно настолько, насколько команда способна поддерживать её работу, а скорость и безопасность вторичны, если система неуправляема?'
  - id: proactive-observability
    en: 'Explain the shift from reactive "break-fix" support to proactive observability. What are the key architectural trade-offs involved in this transition?'
    ru: 'Объясните переход от реактивной поддержки «сломалось — чиним» (break-fix) к проактивной наблюдаемости. Каковы ключевые архитектурные компромиссы этого перехода?'
  # II. The Four Pillars of Manageability
  - id: four-pillars-framework
    en: 'List and briefly explain the Four Pillars of Manageability. Why must architects integrate specific protocols across all four?'
    ru: 'Перечислите и кратко объясните четыре столпа управляемости. Почему архитекторы должны интегрировать конкретные протоколы по всем четырём?'
  - id: visibility-mechanics
    en: 'How does the shift from passive polling to active, continuous data streams improve a designer''s ability to monitor a network?'
    ru: 'Как переход от пассивного опроса (polling) к активным непрерывным потокам данных улучшает возможности проектировщика по мониторингу сети?'
  - id: golden-images-entropy
    en: 'Discuss how standardisation and "Golden Images" prevent the creation of "snowflake configurations" where every device is unique.'
    ru: 'Обсудите, как стандартизация и «golden images» предотвращают появление «конфигураций-снежинок», где каждое устройство уникально.'
  - id: iac-automation
    en: 'How do Infrastructure as Code (IaC) frameworks like Ansible reduce manual overhead for tasks such as firmware upgrades and VLAN provisioning?'
    ru: 'Как каркасы Infrastructure as Code (IaC), такие как Ansible, снижают ручные затраты на задачи вроде обновления прошивок и выделения VLAN?'
  - id: fault-isolation-boundaries
    en: 'How does a manageable design use administrative boundaries and modularity to prevent localised failures from escalating into cascading outages?'
    ru: 'Как управляемый дизайн использует административные границы и модульность, чтобы локальные сбои не перерастали в каскадные отказы?'
  # III. Management Access and Monitoring Strategies
  - id: inband-vs-oob
    en: 'Compare the complexity and survivability of In-Band management versus a dedicated, physically isolated OOB network.'
    ru: 'Сравните сложность и живучесть In-Band управления и выделенной, физически изолированной OOB-сети.'
  - id: snmp-vs-streaming-telemetry
    en: 'Why does the sub-second granularity of streaming telemetry (using gRPC or Netconf) eliminate the visibility "blind spots" inherent in traditional 5-minute SNMP intervals?'
    ru: 'Почему субсекундная гранулярность streaming telemetry (через gRPC или Netconf) устраняет «слепые зоны» видимости, присущие традиционным 5-минутным интервалам SNMP?'
  - id: push-vs-pull-models
    en: 'Contrast the traditional architecture of regular polling intervals with modern systems that push structured data models (YANG) to centralised collectors.'
    ru: 'Сопоставьте традиционную архитектуру регулярных интервалов опроса с современными системами, которые отправляют (push) структурированные модели данных (YANG) в централизованные коллекторы.'
  # IV. Architectural Models and Frameworks
  - id: fcaps-model
    en: 'Discuss the five functional areas of the OSI Network Management Model (FCAPS). How does this framework help organise network resources?'
    ru: 'Обсудите пять функциональных областей модели управления сетью OSI (FCAPS). Как этот каркас помогает организовать сетевые ресурсы?'
  - id: hierarchy-troubleshooting
    en: 'How does the hierarchical design model (Core, Distribution, and Access) simplify troubleshooting by ensuring local traffic remains local?'
    ru: 'Как иерархическая модель дизайна (Core, Distribution и Access) упрощает диагностику, гарантируя, что локальный трафик остаётся локальным?'
  - id: access-layer-focus
    en: 'Beyond connectivity, why is the manageability focus of the Access layer centred on high port density, PoE, and port security?'
    ru: 'Помимо подключения устройств, почему фокус управляемости уровня Access сосредоточен на высокой плотности портов, PoE и port security?'
  - id: distribution-summarisation
    en: 'What is the critical role of the Distribution layer in route summarisation, and how does this reduce the complexity of core routing tables?'
    ru: 'В чём критическая роль уровня Distribution в суммаризации маршрутов, и как это снижает сложность таблиц маршрутизации ядра?'
  # V. Automation, Best Practices, and Anti-Patterns
  - id: sdn-intent
    en: 'How does Software-Defined Networking (SDN) allow administrators to translate "intent" to physical devices through centralised controllers?'
    ru: 'Как Software-Defined Networking (SDN) позволяет администраторам транслировать «намерение» (intent) на физические устройства через централизованные контроллеры?'
  - id: pareto-8020-rule
    en: 'Explain the Pareto Principle in design. Why should architects prioritise the top 20% of critical requirements or expensive components?'
    ru: 'Объясните принцип Парето в проектировании. Почему архитекторам следует приоритизировать верхние 20% критических требований или дорогих компонентов?'
  - id: config-drift-antipatterns
    en: 'Discuss common anti-patterns such as "Config Drift" and "Overly Flat Networks." Why are these considered significant management risks?'
    ru: 'Обсудите распространённые анти-паттерны, такие как «Config Drift» и «чрезмерно плоские сети». Почему они считаются серьёзными рисками для управления?'
  - id: documentation-as-tool
    en: 'Why is a design only considered manageable if its state is well-documented through logical diagrams, physical diagrams, and Bills of Materials (BOM)?'
    ru: 'Почему дизайн считается управляемым, только если его состояние хорошо задокументировано через логические схемы, физические схемы и спецификации оборудования (BOM)?'
