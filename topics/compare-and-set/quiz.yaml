missions:
  - id: make-cas-succeed
    title:
      en: Make CAS succeed
      ru: Сделай CAS успешным
    goal:
      en: Run code where expected equals the current value and the slot is updated.
      ru: Запусти код, где expected совпадает с текущим значением и slot обновляется.
    event: CAS_SUCCESS
  - id: block-stale-write
    title:
      en: Block a stale write
      ru: Заблокируй устаревшую запись
    goal:
      en: Run code where another thread changes the value first, so stale CAS fails.
      ru: Запусти код, где другой thread первым меняет значение, поэтому stale CAS завершается неудачей.
    event: CAS_FAILURE
  - id: retry-with-fresh-value
    title:
      en: Retry with a fresh value
      ru: Повтори со свежим значением
    goal:
      en: After a failed CAS, read the latest value and try again with a new expected value.
      ru: После неудачного CAS прочитай последнее значение и попробуй снова с новым expected value.
    event: CAS_RETRY
  - id: reveal-aba
    title:
      en: Reveal ABA risk
      ru: Покажи риск ABA
    goal:
      en: Let the value change away and back before the original thread runs CAS.
      ru: Дай значению измениться туда и обратно до того, как исходный thread выполнит CAS.
    event: CAS_ABA_RISK

bossFight:
  - id: direct-definition
    en: What is compare-and-set, and what values does it compare?
    ru: Что такое compare-and-set, и какие значения он сравнивает?
  - id: atomicity-guarantee
    en: What does AtomicInteger.compareAndSet(expected, update) guarantee atomically?
    ru: Что AtomicInteger.compareAndSet(expected, update) гарантирует атомарно?
  - id: retry-loop
    en: Why is CAS commonly used inside a retry loop?
    ru: Почему CAS часто используют внутри retry loop?
  - id: volatile-vs-cas
    en: Why does volatile visibility not make count++ the same as CAS?
    ru: Почему visibility от volatile не делает count++ тем же самым, что CAS?
  - id: aba-problem
    en: 'Explain ABA: why can a value changing A to B to A fool a plain CAS?'
    ru: 'Объясни ABA: почему изменение значения A -> B -> A может обмануть обычный CAS?'
  - id: when-not-enough
    en: When is CAS not enough, and when would you use a lock instead?
    ru: Когда CAS недостаточно, и когда вместо него стоит использовать lock?
