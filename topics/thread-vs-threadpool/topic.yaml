id: thread-vs-threadpool
title:
  en: Thread vs ThreadPool
  ru: Thread и ThreadPool
category:
  en: Java Core / Concurrency
  ru: Java Core / Многопоточность
type: CONCURRENCY
mode: trace
summary:
  en: >
    The practical difference between creating a new Thread for each task and
    submitting work to a ThreadPool: worker reuse, bounded concurrency, queueing,
    rejection, shutdown, and the trade-offs interviewers expect you to name.
  ru: >
    Практическая разница между созданием нового Thread для каждой задачи и
    отправкой работы в ThreadPool: переиспользование workers, ограниченная
    конкурентность, очередь, отклонение задач, shutdown и trade-offs, которые
    ожидают услышать на собеседовании.
categoryId: concurrency
difficulty: 2
catalogId: concurrency-4
style: Real world
aiProvider: codex
aiModel: gpt-5.5

primitives:
  - ArrayGrid
  - LinkedNodes
  - EventLog

defaultExample: new-thread-per-task

examples:
  - id: new-thread-per-task
    title:
      en: New Thread per task
      ru: Новый Thread на задачу
    file: 01-new-thread-per-task.java
    explanation:
      en: >
        Each task receives a brand-new Thread. The Thread starts, runs one task,
        terminates, and cannot be reused.
      ru: >
        Каждая задача получает новый Thread. Thread запускается, выполняет одну
        задачу, завершается и не может быть переиспользован.
  - id: fixed-pool-reuse
    title:
      en: Fixed pool reuse
      ru: Переиспользование fixed pool
    file: 02-fixed-pool-reuse.java
    explanation:
      en: >
        A fixed ThreadPool creates a small worker set once, then reuses an idle
        worker for later tasks instead of creating another Thread.
      ru: >
        Fixed ThreadPool один раз создает небольшой набор workers, а затем
        переиспользует свободный worker для следующих задач вместо создания еще
        одного Thread.
  - id: queue-when-busy
    title:
      en: Queue when busy
      ru: Очередь при занятости
    file: 03-queue-when-busy.java
    explanation:
      en: >
        When every worker is busy, accepted tasks wait in the pool queue until a
        worker completes its current task.
      ru: >
        Когда все workers заняты, принятые задачи ждут в очереди pool, пока
        worker не завершит текущую задачу.
  - id: reject-when-full
    title:
      en: Reject when full
      ru: Отклонение при заполнении
    file: 04-reject-when-full.java
    explanation:
      en: >
        A bounded pool protects the application: once workers and queue slots
        are full, extra tasks are rejected instead of creating unlimited threads.
      ru: >
        Ограниченный pool защищает приложение: когда workers и места в очереди
        заняты, лишние задачи отклоняются вместо создания неограниченных threads.
  - id: shutdown
    title:
      en: Shutdown behavior
      ru: Поведение shutdown
    file: 05-shutdown.java
    explanation:
      en: >
        shutdown() stops accepting new tasks, but already accepted work can still
        finish in an orderly way.
      ru: >
        shutdown() прекращает прием новых задач, но уже принятая работа все еще
        может корректно завершиться.

assistantExample:
  en: 'e.g. In Java, when should I create a Thread directly and when should I use a ThreadPool?'
  ru: 'например: В Java когда стоит создавать Thread напрямую, а когда использовать ThreadPool?'

missionsFile: quiz.yaml
