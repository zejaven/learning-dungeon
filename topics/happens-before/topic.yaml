id: happens-before
languages: [en, ru]
title:
  en: Happens-Before in Java
  ru: Happens-Before в Java
category:
  en: Java Core / Concurrency
  ru: Java Core / Многопоточность
type: CONCURRENCY
mode: trace
summary:
  en: >
    The Java Memory Model rule that decides when one thread's writes are
    guaranteed to be visible to another thread: program order, volatile,
    synchronized, Thread.start(), Thread.join(), and transitivity.
  ru: >
    Правило Java Memory Model, которое определяет, когда записи одного thread
    гарантированно видны другому thread: program order, volatile, synchronized,
    Thread.start(), Thread.join() и transitivity.
categoryId: concurrency
difficulty: 3
catalogId: concurrency-13
style: Real world
aiProvider: codex
aiModel: gpt-5.5

primitives:
  - ArrayGrid
  - LinkedNodes
  - EventLog

defaultExample: plain-read-stale

examples:
  - id: plain-read-stale
    title:
      en: Plain read can be stale
      ru: Обычное чтение может устареть
    file: 01-plain-read-stale.java
    explanation:
      en: >
        A writer updates a plain field, but the reader has no happens-before
        edge and can keep its old local view.
      ru: >
        Writer обновляет обычное поле, но у reader нет happens-before связи,
        поэтому он может сохранить старый локальный вид.
  - id: volatile-handoff
    title:
      en: Volatile handoff
      ru: Передача через volatile
    file: 02-volatile-handoff.java
    explanation:
      en: >
        The writer stores plain data, then writes a volatile flag. The reader's
        volatile read acquires that write and refreshes the data.
      ru: >
        Writer сохраняет обычные data, затем записывает volatile flag.
        Volatile-чтение reader получает эту запись и обновляет data.
  - id: monitor-handoff
    title:
      en: Same monitor lock
      ru: Тот же monitor lock
    file: 03-monitor-handoff.java
    explanation:
      en: >
        An unlock happens-before a later lock of the same monitor, so the
        consumer sees what the producer wrote inside the synchronized section.
      ru: >
        Unlock happens-before более позднему lock того же monitor, поэтому
        consumer видит то, что producer записал внутри synchronized section.
  - id: thread-start
    title:
      en: Thread.start() publishes setup
      ru: Thread.start() публикует подготовку
    file: 04-thread-start.java
    explanation:
      en: >
        Actions before Thread.start() are visible to the new thread when it
        begins running.
      ru: >
        Действия до Thread.start() видны новому thread, когда он начинает
        выполняться.
  - id: thread-join
    title:
      en: Thread.join() collects result
      ru: Thread.join() забирает результат
    file: 05-thread-join.java
    explanation:
      en: >
        All actions in a terminated thread happen-before another thread returns
        from a successful join().
      ru: >
        Все действия завершённого thread happen-before возврату другого thread
        из успешного join().
  - id: wrong-lock
    title:
      en: Wrong lock gives no edge
      ru: Неправильный lock не даёт связи
    file: 06-wrong-lock.java
    explanation:
      en: >
        Locking a different monitor does not acquire the writer's release, so a
        stale read is still possible.
      ru: >
        Lock другого monitor не получает release от writer, поэтому устаревшее
        чтение всё ещё возможно.

assistantExample:
  en: 'e.g. What does happens-before guarantee, and which Java constructs create it?'
  ru: 'например: Что гарантирует happens-before и какие конструкции Java его создают?'

