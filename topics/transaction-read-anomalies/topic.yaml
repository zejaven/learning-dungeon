id: transaction-read-anomalies
title:
  en: Transaction Read Anomalies and Lost Update
  ru: Аномалии чтения транзакций и lost update
category:
  en: Databases / Transactions
  ru: Базы данных / Транзакции
type: TRANSACTION
mode: theory
aiProvider: codex
aiModel: gpt-5.5
categoryId: databases
difficulty: 2
