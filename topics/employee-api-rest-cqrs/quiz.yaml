# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: design-the-api
    en: How would you design the REST endpoints for adding an employee, getting one by id, and changing salary and passport?
    ru: Как бы вы спроектировали REST-эндпоинты для добавления сотрудника, получения по id и изменения зарплаты и паспорта?
  - id: why-not-one-put
    en: Why split salary and passport updates into separate endpoints instead of a single PUT that overwrites the employee?
    ru: Почему изменение зарплаты и паспорта стоит разнести на отдельные эндпоинты, а не делать один PUT, перезаписывающий сотрудника?
  - id: separation-of-concerns
    en: The task says salary and passport are changed by different departments. How does that affect your architecture?
    ru: В задаче сказано, что зарплату и паспорт меняют разные отделы. Как это влияет на вашу архитектуру?
  - id: split-controllers
    en: Would you split this into separate controllers per department, or keep one EmployeeController with sub-resources? Argue the trade-off.
    ru: Вы бы разнесли это на отдельные контроллеры по отделам или оставили один EmployeeController с под-ресурсами? Обоснуйте компромисс.
  - id: cqs-meaning
    en: What is Command–Query Separation, and how does it apply to this employee API?
    ru: Что такое разделение команд и запросов (CQS) и как оно применимо к этому API сотрудника?
  - id: dto-vs-entity
    en: Why should the response card be a DTO rather than the Employee entity returned directly?
    ru: Почему карточка ответа должна быть DTO, а не возвращаемой напрямую сущностью Employee?
  - id: patch-vs-put
    en: When would you use PATCH versus PUT for the update operations, and why?
    ru: Когда для операций изменения вы выберете PATCH, а когда PUT, и почему?
  - id: status-codes
    en: What HTTP status codes would each of the four endpoints return, including error cases?
    ru: Какие HTTP-статус-коды возвращал бы каждый из четырёх эндпоинтов, включая ошибки?
  - id: validation
    en: What validation would you put on the create, change-salary, and change-passport operations?
    ru: Какую валидацию вы повесите на создание, изменение зарплаты и изменение паспорта?
