summary:
  en: >
    Learn how to design a practical relational schema for requests, products and
    services: clarify cardinalities, separate dictionaries from transactional
    data, model many-to-many links, add constraints and indexes, and preserve
    request history when products or services change.
  ru: >
    Разбери, как спроектировать практичную реляционную схему для заявок,
    продуктов и сервисов: уточнить кардинальности, отделить справочники от
    транзакционных данных, смоделировать many-to-many связи, добавить
    ограничения и индексы и сохранить историю заявки при изменении продуктов или
    сервисов.

assistantExample:
  en: 'e.g. How would you model a request that can include several products and several services?'
