id: bucket-data-structure
languages: [en, ru]
title:
  en: What Data Structure Stores Values in a Bucket
  ru: Какая структура данных хранит значения в бакете
category:
  en: Java Core / Collections
  ru: Java Core / Коллекции
type: DATA_STRUCTURE
aiProvider: claude
aiModel: claude-opus-4-8
categoryId: java-collections
difficulty: 2
catalogId: java-collections-8
style: Real world
summary:
  en: >
    Inside a HashMap bucket, entries are stored as a singly-linked list of Node
    objects by default. Since Java 8, a bucket that grows long (8+ entries while
    the table capacity is at least 64) is converted into a red-black tree of
    TreeNode objects, turning that bucket's lookups from O(n) into O(log n); it
    reverts to a list when it shrinks to 6.
  ru: >
    Внутри бакета HashMap записи по умолчанию хранятся как односвязный список из
    объектов Node. Начиная с Java 8, длинный бакет (8+ записей при ёмкости таблицы
    не меньше 64) превращается в красно-чёрное дерево из объектов TreeNode, что
    меняет сложность поиска в бакете с O(n) на O(log n); при уменьшении до 6 он
    снова становится списком.

# Visual primitives this topic's visualizer composes (frontend).
primitives:
  - ArrayGrid
  - LinkedNodes
  - TreeView
  - EventLog

defaultExample: list

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: list
    title:
      en: Linked list by default
      ru: По умолчанию связный список
    file: 01-list.java
    explanation:
      en: >
        A fresh bucket is a singly-linked list of Node objects. Entries are
        appended to the chain and get() walks it node by node — O(n).
      ru: >
        Новый бакет — это односвязный список из объектов Node. Записи добавляются
        в конец цепочки, а get() идёт по ней узел за узлом — O(n).
  - id: treeify
    title:
      en: Treeify a long bucket
      ru: Treeify длинного бакета
    file: 02-treeify.java
    explanation:
      en: >
        The 9th entry grows the chain past TREEIFY_THRESHOLD (8) while capacity
        is 64, so the bucket is converted from a list into a red-black tree of
        TreeNode. A chain of exactly 8 is still a list.
      ru: >
        9-я запись выводит цепочку за TREEIFY_THRESHOLD (8) при ёмкости 64,
        поэтому бакет превращается из списка в красно-чёрное дерево из TreeNode.
        Цепочка ровно из 8 записей — ещё список.
  - id: tree-get
    title:
      en: Lookup in a tree bucket
      ru: Поиск в бакете-дереве
    file: 03-tree-get.java
    explanation:
      en: >
        Once treeified, the bucket searches by hash through the balanced tree in
        O(log n) comparisons instead of scanning the whole chain.
      ru: >
        После treeify бакет ищет по hash в сбалансированном дереве за O(log n)
        сравнений вместо прохода по всей цепочке.
  - id: untreeify
    title:
      en: Untreeify when it shrinks
      ru: Untreeify при уменьшении
    file: 04-untreeify.java
    explanation:
      en: >
        remove() does not count entries: it converts the tree back into a
        linked list once the tree is too small by shape (the root's left child
        has no left child). For this balanced tree that happens at 6 nodes; a
        real tree of colliding keys can get there anywhere from about 6 to 2.
        UNTREEIFY_THRESHOLD (6) is the count used when a resize splits a bucket.
      ru: >
        remove() записи не считает: он возвращает дерево к связному списку,
        когда дерево слишком маленькое по форме (у левого потомка корня нет
        левого потомка). Для этого сбалансированного дерева это 6 узлов; реальное
        дерево из сталкивающихся ключей может прийти к этому где-то от 6 до 2.
        UNTREEIFY_THRESHOLD (6) — это счётчик для деления бакета при resize.
  - id: small-capacity
    title:
      en: Small table resizes instead
      ru: Маленькая таблица делает resize
    file: 05-small-capacity.java
    explanation:
      en: >
        With capacity below MIN_TREEIFY_CAPACITY (64), a long bucket does not
        treeify — the map resizes first, spreading the colliding entries instead.
      ru: >
        При ёмкости меньше MIN_TREEIFY_CAPACITY (64) длинный бакет не делает
        treeify — мапа сначала делает resize, распределяя столкнувшиеся записи.

