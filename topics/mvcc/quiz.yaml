# Theory topic: no missions, only Boss Fight questions.
bossFight:
  - id: define-mvcc
    en: 'What is MVCC, and what problem does it solve?'
    ru: 'Что такое MVCC и какую проблему он решает?'
  - id: row-versions-and-snapshots
    en: 'How do row versions and snapshots work together in MVCC?'
    ru: 'Как версии строк и snapshot работают вместе в MVCC?'
  - id: readers-vs-writers
    en: 'Why do MVCC readers usually not block writers, and writers usually not block readers?'
    ru: 'Почему в MVCC читатели обычно не блокируют писателей, а писатели обычно не блокируют читателей?'
  - id: isolation-levels
    en: 'How does MVCC relate to transaction isolation levels such as READ COMMITTED and REPEATABLE READ?'
    ru: 'Как MVCC связан с уровнями изоляции транзакций, такими как READ COMMITTED и REPEATABLE READ?'
  - id: dirty-read-prevention
    en: 'Why does MVCC help prevent dirty reads?'
    ru: 'Почему MVCC помогает предотвращать dirty reads?'
  - id: writer-conflicts
    en: 'Does MVCC remove all write conflicts? Explain what still has to be checked.'
    ru: 'Устраняет ли MVCC все конфликты записи? Объясните, что все равно нужно проверять.'
  - id: cleanup-and-bloat
    en: 'Why do MVCC databases need cleanup processes such as VACUUM or garbage collection?'
    ru: 'Почему базам данных с MVCC нужны процессы очистки, такие как VACUUM или garbage collection?'
  - id: common-traps
    en: 'What are the common misconceptions about MVCC in interviews?'
    ru: 'Какие типичные заблуждения про MVCC встречаются на собеседованиях?'
