bossFight:
  # I. Foundational Concepts and Mathematical Modelling
  - id: reliability-vs-availability
    en: 'Discuss the distinction between reliability (the probability of no failure over time) and availability (the probability a system is operational at any given point).'
    ru: 'Обсудите различие между надёжностью (вероятностью отсутствия отказа за период времени) и доступностью (вероятностью того, что система работоспособна в любой заданный момент).'
  - id: mtbf-mttr-formula
    en: 'How do the variables MTBF (Mean Time Between Failures) and MTTR (Mean Time To Repair) interact in the steady-state availability formula?'
    ru: 'Как переменные MTBF (Mean Time Between Failures) и MTTR (Mean Time To Repair) взаимодействуют в формуле установившейся (steady-state) доступности?'
  - id: five-nines-gold-standard
    en: 'Why is "Five Nines" (99.999%) considered the gold standard for carrier-grade networks, and what are the operational implications of only achieving "Two Nines"?'
    ru: 'Почему «пять девяток» (99.999%) считаются золотым стандартом для сетей операторского класса, и каковы эксплуатационные последствия достижения лишь «двух девяток»?'
  - id: serial-erosion
    en: 'Explain why total availability in a serial topology is always lower than the availability of its weakest individual component.'
    ru: 'Объясните, почему суммарная доступность в последовательной топологии всегда ниже доступности её самого слабого отдельного компонента.'
  - id: power-of-parallelism
    en: 'How does converting a serial dependency into a parallel redundant block theoretically allow a network to jump from three nines to six nines of availability?'
    ru: 'Как преобразование последовательной зависимости в параллельный резервный блок теоретически позволяет сети подняться с трёх девяток доступности до шести?'
  # II. Structural Design and Hierarchy
  - id: fault-domain-isolation
    en: 'How does the three-tier hierarchical model (Access, Distribution, and Core) simplify troubleshooting and allow for modular maintenance without system-wide impact?'
    ru: 'Как трёхуровневая иерархическая модель (Access, Distribution и Core) упрощает поиск неисправностей и позволяет проводить модульное обслуживание без влияния на всю систему?'
  - id: fmea-spof
    en: 'Discuss the role of Failure Mode and Effect Analysis (FMEA) in identifying Single Points of Failure within a network''s dependency chain.'
    ru: 'Обсудите роль Failure Mode and Effect Analysis (FMEA) в выявлении единых точек отказа (SPOF) в цепочке зависимостей сети.'
  - id: redundancy-paradox
    en: 'Why can adding duplicate hardware sometimes increase the risk of outages through architectural complexity and human error?'
    ru: 'Почему дублирование оборудования иногда может увеличивать риск сбоев из-за архитектурной сложности и человеческих ошибок?'
  - id: triangles-vs-squares
    en: 'In the context of convergence tuning, why is building Layer 3 triangles considered superior to building squares for achieving sub-second recovery?'
    ru: 'В контексте тюнинга конвергенции: почему построение «треугольников» Layer 3 считается лучше «квадратов» для достижения восстановления быстрее секунды?'
  # III. Resilience Across the OSI Layers
  - id: physical-layer-diversity
    en: 'Beyond redundant hardware, why are geographic route diversity and isolated power domains critical for preventing "backhoe fade"?'
    ru: 'Помимо резервного оборудования, почему географическое разнесение трасс и изолированные домены питания критичны для предотвращения «backhoe fade»?'
  - id: link-aggregation-lacp
    en: 'How does LACP/EtherChannel provide bandwidth benefits while ensuring traffic is redistributed in microseconds if a physical wire fails?'
    ru: 'Как LACP/EtherChannel даёт выигрыш в полосе пропускания и при этом обеспечивает перераспределение трафика за микросекунды при обрыве физического провода?'
  - id: loop-prevention-rstp
    en: 'Discuss the necessity of Rapid Spanning Tree Protocol (RSTP) and tools like Root Guard in protecting a redundant network from catastrophic broadcast storms.'
    ru: 'Обсудите необходимость Rapid Spanning Tree Protocol (RSTP) и инструментов вроде Root Guard для защиты избыточной сети от катастрофических broadcast-штормов.'
  - id: layer3-keepalives
    en: 'How do dynamic routing protocols like OSPF and EIGRP use neighbour adjacencies to sense link degradation and execute recalculations?'
    ru: 'Как динамические протоколы маршрутизации, такие как OSPF и EIGRP, используют соседские adjacency, чтобы отслеживать деградацию линков и выполнять пересчёты?'
  - id: fhrp-comparison
    en: 'Compare the active-standby nature of HSRP/VRRP with the active-active load balancing capabilities of GLBP.'
    ru: 'Сравните active-standby природу HSRP/VRRP с возможностями active-active балансировки нагрузки у GLBP.'
  # IV. Hardware States and Failover Operations
  - id: sso-nsf-safeguard
    en: 'Explain how Stateful Switchover (SSO) and Non-Stop Forwarding (NSF) work together to prevent routing adjacency resets during a supervisor engine failure.'
    ru: 'Объясните, как Stateful Switchover (SSO) и Non-Stop Forwarding (NSF) работают вместе, предотвращая сброс маршрутных adjacency при отказе Supervisor Engine.'
  - id: standby-states
    en: 'Contrast the recovery times and operational requirements of Cold, Warm, and Hot standby models.'
    ru: 'Сопоставьте времена восстановления и эксплуатационные требования моделей Cold, Warm и Hot standby.'
  - id: active-active-capacity
    en: 'Why is it vital that individual components in an active-active system never exceed 50% load under normal conditions?'
    ru: 'Почему жизненно важно, чтобы отдельные компоненты в active-active системе никогда не превышали 50% загрузки в нормальных условиях?'
  - id: issu-planned-maintenance
    en: 'Why is ISSU considered essential for maintaining high availability during planned maintenance and patches?'
    ru: 'Почему ISSU считается необходимым для поддержания высокой доступности во время планового обслуживания и установки патчей?'
  # V. Advanced Metrics and Resilience Strategies
  - id: watermelon-effect
    en: 'How can a network report high statistical uptime while hidden capacity issues cause stress failures for users?'
    ru: 'Как сеть может показывать высокий статистический uptime, в то время как скрытые проблемы с ёмкостью вызывают стрессовые сбои у пользователей?'
  - id: self-healing-shared-nothing
    en: 'Discuss how self-healing clusters and shared-nothing architectures (like Aerospike) eliminate centralised masters to enhance resilience.'
    ru: 'Обсудите, как самовосстанавливающиеся кластеры и shared-nothing архитектуры (например, Aerospike) устраняют централизованные master-узлы, повышая отказоустойчивость.'
