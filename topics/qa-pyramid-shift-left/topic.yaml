# Theory topic: explanation + Boss Fight only — no practice editor or missions.
mode: theory
aiProvider: kimi
categoryId: qa-process
categoryName: 'QA Process'
difficulty: 3
summary:
  en: >
    Senior-level process topics: the test pyramid (unit, integration/API, E2E)
    and why the ratio of levels is driven by cost, speed and stability of
    feedback; the inverted "ice cream cone" anti-pattern; shift-left testing
    (getting QA involved before development — requirements and mockup review)
    and shift-right testing (post-release monitoring, incident analysis,
    canary releases); plus how process improvements translate into business
    metrics. With typical project examples expected at an interview.
  ru: >
    Процессные темы уровня senior: пирамида тестирования (unit,
    integration/API, E2E) и почему соотношение уровней определяется
    стоимостью, скоростью и стабильностью обратной связи; анти-паттерн
    «перевёрнутой пирамиды»; shift-left тестирование (подключение QA до
    разработки — тестирование требований и макетов) и shift-right
    тестирование (мониторинг после релиза, разбор инцидентов, canary
    releases); а также как улучшения процессов влияют на бизнес-показатели.
    С типичными примерами «с проекта», которые ждут на собеседовании.

assistantExample:
  en: "e.g. What is shift-left testing and how did you apply it on your project?"
  ru: "например: Что такое shift-left тестирование и как вы применяли его на проекте?"

