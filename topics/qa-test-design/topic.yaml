summary:
  en: >
    What test design is and how it differs from test analysis. The core
    techniques every QA engineer is asked about: equivalence partitioning and
    boundary value analysis on a numeric example (a field accepting 1-100),
    testing software functions, risk-based testing, use case testing,
    exploratory testing, and the traceability matrix that ties checks back to
    requirements.
  ru: >
    Что такое тест-дизайн и чем он отличается от тест-анализа. Основные
    техники, которые спрашивают у каждого QA: классы эквивалентности и
    граничные значения на числовом примере (поле со значениями 1-100),
    тестирование функций ПО, проверка основных рисков, проверки по сценариям
    использования (Use Cases), исследовательское тестирование и матрица
    трассируемости (traceability matrix), связывающая проверки с требованиями.

assistantExample:
  en: "e.g. A field accepts values from 1 to 100. Which values would you check using boundary value analysis?"
  ru: "например: Поле принимает значения от 1 до 100. Какие значения вы проверите по технике граничных значений?"

