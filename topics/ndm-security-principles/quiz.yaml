bossFight:
  # I. Security Paradigms and Architectural Strategy
  - id: security-functional-requirement
    en: 'Why do modern design principles assert that a network that is not secure is fundamentally non-functional?'
    ru: 'Почему современные принципы проектирования утверждают, что небезопасная сеть фундаментально нефункциональна?'
  - id: security-by-design-hairpinning
    en: 'How does "Security by Design" prevent the performance bottlenecks, such as "hairpinning," often found in reactive, added-on security models?'
    ru: 'Как «Security by Design» предотвращает узкие места производительности, такие как «hairpinning», типичные для реактивных, добавленных задним числом моделей безопасности?'
  - id: castle-and-moat-obsolete
    en: 'Why is the traditional "Castle-and-Moat" model now considered obsolete in the face of insider threats and distributed cloud environments?'
    ru: 'Почему традиционная модель «замок и ров» (Castle-and-Moat) теперь считается устаревшей на фоне инсайдерских угроз и распределённых облачных сред?'
  - id: defense-in-depth-redundancy
    en: 'How does the principle of redundancy in a multi-layered DiD strategy ensure that the failure of a single control, like a firewall, does not lead to total system compromise?'
    ru: 'Как принцип избыточности в многоуровневой стратегии Defense in Depth гарантирует, что отказ одного контроля, например firewall, не приведёт к полной компрометации системы?'
  # II. Zero Trust and Access Control
  - id: zero-trust-pillars
    en: 'Discuss the three core pillars of the Zero Trust framework: Verify explicitly, Use least privileged access, and Assume breach.'
    ru: 'Обсудите три ключевых принципа каркаса Zero Trust: проверяй явно (Verify explicitly), используй наименьшие привилегии, предполагай взлом (Assume breach).'
  - id: least-privilege
    en: 'How does restricting identities to the absolute bare minimum network routes required for their jobs enhance overall security?'
    ru: 'Как ограничение идентичностей абсолютным минимумом сетевых маршрутов, необходимых для их работы, повышает общую безопасность?'
  - id: mfa-factors
    en: 'Beyond passwords, how does the combination of possession (tokens) and inherence (biometrics) block the vast majority of identity-based attacks?'
    ru: 'Помимо паролей, как сочетание владения (токены) и неотъемлемого свойства (биометрия) блокирует подавляющее большинство атак на основе идентичности?'
  - id: conditional-access
    en: 'How can Conditional Access use real-time factors like device health and session risk levels to dynamically enforce security policies?'
    ru: 'Как условный доступ (Conditional Access) может использовать факторы реального времени, такие как состояние устройства и уровень риска сессии, для динамического применения политик безопасности?'
  - id: rbac-separation-of-duties
    en: 'Contrast Static vs. Dynamic Separation of Duties (SoD) in preventing fraud within Role-Based Access Control hierarchies.'
    ru: 'Сопоставьте статическое и динамическое разделение обязанностей (SoD) в предотвращении мошенничества внутри иерархий Role-Based Access Control.'
  # III. Network Segmentation and Isolation
  - id: blast-radius-segmentation
    en: 'Why are large, flat subnets considered a major security risk for malware propagation, and how does segmentation contain these breaches?'
    ru: 'Почему большие плоские подсети считаются серьёзным риском безопасности с точки зрения распространения вредоносного ПО, и как сегментация сдерживает такие взломы?'
  - id: vlans-vs-vrfs
    en: 'Compare the use of Layer 2 VLANs for isolating broadcast domains with Layer 3 VRFs for achieving multi-tenant isolation on a single device.'
    ru: 'Сравните использование VLAN (Layer 2) для изоляции широковещательных доменов с VRF (Layer 3) для мультиарендной изоляции на одном устройстве.'
  - id: microsegmentation-vnics
    en: 'How does applying firewall rules directly to virtual network interface cards (vNICs) prevent lateral movement between servers residing in the same VLAN?'
    ru: 'Как применение правил firewall напрямую к виртуальным сетевым картам (vNIC) предотвращает горизонтальное перемещение между серверами, находящимися в одном VLAN?'
  - id: dmz-buffer
    en: 'How does a Demilitarised Zone (DMZ) function as a strategic buffer between the untrusted internet and sensitive internal assets?'
    ru: 'Как демилитаризованная зона (DMZ) работает стратегическим буфером между недоверенным интернетом и чувствительными внутренними активами?'
  # IV. Defensive Technologies and Encryption
  - id: firewall-evolution
    en: 'Trace the transition from stateless filters to Next-Generation Firewalls (NGFW) that provide Layer 7 visibility into specific software applications.'
    ru: 'Проследите переход от stateless-фильтров к Next-Generation Firewall (NGFW), дающим видимость Layer 7 вплоть до конкретных программных приложений.'
  - id: dpi-signature-vs-anomaly
    en: 'Discuss the differences between signature-based analysis and protocol anomaly detection in modern DPI engines.'
    ru: 'Обсудите различия между сигнатурным анализом и обнаружением аномалий протокола в современных движках DPI.'
  - id: hybrid-cryptography
    en: 'Why is it architecturally superior to use asymmetric encryption for key exchange and symmetric encryption for high-speed bulk data transfer?'
    ru: 'Почему архитектурно лучше использовать асимметричное шифрование для обмена ключами, а симметричное — для высокоскоростной передачи основного объёма данных?'
  - id: confidential-computing-tees
    en: 'How do hardware-based Trusted Execution Environments (TEEs) protect "data in use" while it is being processed in the CPU and memory?'
    ru: 'Как аппаратные Trusted Execution Environment (TEE) защищают «данные в использовании» в момент их обработки в CPU и памяти?'
  # V. Monitoring, Management, and Future Trends
  - id: ids-ips-sensor-placement
    en: 'Where are the "natural bottlenecks" in a network that serve as the most effective locations for IDS/IPS sensors?'
    ru: 'Где находятся «естественные узкие места» сети, служащие самыми эффективными точками размещения сенсоров IDS/IPS?'
  - id: monitoring-infrastructure-security
    en: 'Why must monitoring systems and SIEM tools be placed behind their own firewalls and kept on an isolated management network?'
    ru: 'Почему системы мониторинга и инструменты SIEM должны находиться за собственными firewall и в изолированной management-сети?'
  - id: generative-ai-security
    en: 'What are the primary risks of data leakage via public AI tools, and how can granular access policies control what data an AI can access?'
    ru: 'Каковы основные риски утечки данных через публичные AI-инструменты, и как гранулярные политики доступа могут контролировать, к каким данным AI имеет доступ?'
