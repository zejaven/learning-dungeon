id: string-concatenation
languages: [en, ru]
title:
  en: Concatenating a Million Strings
  ru: Конкатенация миллиона строк
category:
  en: Java Core / Strings
  ru: Java Core / Строки
type: DATA_STRUCTURE
aiProvider: claude
aiModel: claude-opus-4-8
style: Real world
summary:
  en: >
    Joining many small strings with + in a loop is a memory trap: because String
    is immutable, every result = result + piece allocates a brand-new String and
    copies all characters seen so far, so the work is O(n^2) and the loop leaves a
    trail of dead objects. StringBuilder reuses one mutable char[] buffer, copying
    only the new piece and growing the buffer occasionally, which keeps the work
    O(n). Pre-sizing the builder removes even those reallocations. This topic
    visualizes the copies and garbage of each strategy.
  ru: >
    Склеивать много мелких строк через + в цикле — ловушка по памяти: так как
    String иммутабелен, каждое result = result + piece выделяет новую строку и
    копирует все накопленные символы, поэтому работа растёт как O(n^2), а цикл
    оставляет за собой кучу мёртвых объектов. StringBuilder переиспользует один
    изменяемый буфер char[], копируя лишь новый кусок и изредка увеличивая буфер,
    что делает работу линейной, O(n). Предварительный размер билдера убирает даже
    эти перевыделения. Тема показывает копирование и мусор каждой стратегии.

primitives:
  - BoxGroup

categoryId: java-core
difficulty: 1
catalogId: java-core-15

defaultExample: naive-concat

examples:
  - id: naive-concat
    title:
      en: '+ in a loop (the trap)'
      ru: '+ в цикле (ловушка)'
    file: 01-naive-concat.java
    explanation:
      en: >
        result = result + piece looks innocent, but each iteration allocates a NEW
        String and copies every character so far; the previous String becomes
        garbage. Watch "chars copied" and "garbage" grow as O(n^2).
      ru: >
        result = result + piece выглядит безобидно, но каждая итерация выделяет
        НОВУЮ строку и копирует все накопленные символы; предыдущая строка
        становится мусором. Смотрите, как «скопировано символов» и «мусор» растут
        как O(n^2).
  - id: stringbuilder
    title:
      en: StringBuilder (the fix)
      ru: StringBuilder (решение)
    file: 02-stringbuilder.java
    explanation:
      en: >
        One mutable char[] buffer is reused for every append(): only the new piece
        is copied into the SAME object, so almost no garbage is produced and the
        work stays O(n).
      ru: >
        Один изменяемый буфер char[] переиспользуется для каждого append(): в ТОТ
        ЖЕ объект копируется лишь новый кусок, поэтому мусора почти нет, а работа
        остаётся линейной, O(n).
  - id: capacity-grow
    title:
      en: Buffer capacity grows
      ru: Рост ёмкости буфера
    file: 03-capacity-grow.java
    explanation:
      en: >
        A StringBuilder starts at capacity 16 and grows ((cap << 1) + 2) when full,
        reallocating once and copying the existing chars. Growth happens only
        O(log n) times, so the total work is still O(n).
      ru: >
        StringBuilder начинает с ёмкости 16 и растёт ((cap << 1) + 2) при
        заполнении, перевыделяя буфер один раз и копируя накопленные символы. Рост
        происходит лишь O(log n) раз, поэтому суммарная работа остаётся O(n).
  - id: presize
    title:
      en: Pre-size to avoid growth
      ru: Задать размер заранее
    file: 04-presize.java
    explanation:
      en: >
        new StringBuilder(capacity) allocates a buffer big enough for the whole
        result up front, so it never grows and leaves zero garbage buffers — ideal
        when you can estimate the final size.
      ru: >
        new StringBuilder(capacity) сразу выделяет буфер под весь результат, поэтому
        он никогда не растёт и не оставляет мусорных буферов — идеально, когда можно
        оценить итоговый размер.
  - id: compare
    title:
      en: Compare the cost
      ru: Сравнить стоимость
    file: 05-compare.java
    explanation:
      en: >
        The same workload built both ways. Compare the "chars copied" and "garbage"
        counters in the DONE events: the builder does a fraction of the work and
        leaves almost nothing for the garbage collector.
      ru: >
        Одна и та же задача, собранная двумя способами. Сравните счётчики
        «скопировано символов» и «мусор» в событиях DONE: билдер делает долю работы
        и почти ничего не оставляет сборщику мусора.

