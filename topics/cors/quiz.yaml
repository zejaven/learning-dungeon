# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: see-a-same-origin-call
    title:
      en: Call your own origin
      ru: Обратись к своему origin
    goal:
      en: Make a call where the page and the API share scheme, host and port, and watch CORS stay out of it.
      ru: Сделай вызов, в котором у страницы и API совпадают схема, хост и порт, и увидь, что CORS вообще не участвует.
    event: SAME_ORIGIN_OK
  - id: get-a-response-blocked
    title:
      en: Get a response blocked
      ru: Добейся блокировки ответа
    goal:
      en: Call a cross-origin API that sends no Access-Control-Allow-Origin and watch the browser withhold the answer.
      ru: Обратись к кросс-доменному API без Access-Control-Allow-Origin и посмотри, как браузер не отдаёт ответ.
    event: RESPONSE_BLOCKED
  - id: prove-the-server-ran
    title:
      en: Prove the server still ran
      ru: Докажи, что сервер всё равно отработал
    goal:
      en: Send a blocked cross-origin write and confirm the handler executed it anyway.
      ru: Отправь заблокированную кросс-доменную запись и убедись, что обработчик всё равно её выполнил.
    event: SERVER_ALREADY_RAN
  - id: read-the-response
    title:
      en: Read a cross-origin response
      ru: Прочитай кросс-доменный ответ
    goal:
      en: Configure Access-Control-Allow-Origin so the browser hands the body to JavaScript.
      ru: Настрой Access-Control-Allow-Origin так, чтобы браузер отдал тело JavaScript.
    event: RESPONSE_READABLE
  - id: trigger-a-preflight
    title:
      en: Trigger a preflight
      ru: Вызови предварительный запрос
    goal:
      en: Send a request a plain HTML form could not have made and watch the browser ask OPTIONS first.
      ru: Отправь запрос, который не смогла бы отправить обычная HTML-форма, и посмотри, как браузер сначала шлёт OPTIONS.
    event: PREFLIGHT_SENT
  - id: fail-a-preflight
    title:
      en: Fail a preflight
      ru: Провали предварительный запрос
    goal:
      en: Use a method or header the policy does not list and see the real request never leave the browser.
      ru: Используй метод или заголовок, которых нет в политике, и увидь, что настоящий запрос так и не уходит из браузера.
    event: PREFLIGHT_BLOCKED
  - id: reuse-a-preflight
    title:
      en: Reuse a preflight
      ru: Переиспользуй предварительный запрос
    goal:
      en: Add Access-Control-Max-Age and repeat the same call so the second one skips the OPTIONS round trip.
      ru: Добавь Access-Control-Max-Age и повтори тот же вызов, чтобы второй обошёлся без обращения OPTIONS.
    event: PREFLIGHT_CACHED
  - id: break-credentials
    title:
      en: 'Send cookies to a wildcard'
      ru: 'Отправь куки при звёздочке'
    goal:
      en: Make a credentialed call against Access-Control-Allow-Origin - * and see why the two cannot be combined.
      ru: Сделай вызов с куками при Access-Control-Allow-Origin - * и пойми, почему это сочетание невозможно.
    event: CREDENTIALS_BLOCKED
  - id: hide-a-header
    title:
      en: Lose a response header
      ru: Потеряй заголовок ответа
    goal:
      en: Read a custom response header on a successful cross-origin call and find it missing.
      ru: Прочитай нестандартный заголовок ответа при успешном кросс-доменном вызове и обнаружь, что его нет.
    event: HEADER_HIDDEN

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: what-is-cors
    en: What is CORS, and what problem does it solve?
    ru: Что такое CORS и какую задачу он решает?
  - id: same-origin-policy
    en: What is the same-origin policy, and what exactly counts as an origin?
    ru: Что такое правило одного источника (same-origin policy) и что именно считается origin?
  - id: who-enforces-cors
    en: Who enforces CORS — the browser or the server? Why does curl ignore it entirely?
    ru: Кто применяет CORS — браузер или сервер? Почему curl его полностью игнорирует?
  - id: request-still-sent
    en: A cross-origin POST fails with a CORS error, yet the network tab shows a 200 response. Was the request sent, and did the server process it?
    ru: Кросс-доменный POST падает с ошибкой CORS, но во вкладке Network видно ответ 200. Был ли запрос отправлен и обработал ли его сервер?
  - id: simple-vs-preflight
    en: Which requests are sent straight away and which are preflighted? What exactly makes a request "simple"?
    ru: Какие запросы уходят сразу, а для каких сначала шлётся предварительный запрос? Что именно делает запрос «простым»?
  - id: preflight-mechanics
    en: Describe the preflight exchange — which method, which request headers, and which response headers matter?
    ru: Опиши обмен при предварительном запросе — какой метод, какие заголовки запроса и какие заголовки ответа важны?
  - id: json-content-type
    en: Why does sending Content-Type application/json trigger a preflight while application/x-www-form-urlencoded does not?
    ru: Почему Content-Type application/json вызывает предварительный запрос, а application/x-www-form-urlencoded — нет?
  - id: credentials-and-wildcard
    en: Why can a request with credentials not be answered with Access-Control-Allow-Origin - *? What must the server send instead?
    ru: Почему на запрос с куками нельзя ответить Access-Control-Allow-Origin - *? Что сервер должен прислать вместо этого?
  - id: expose-headers
    en: A cross-origin response contains X-Total-Count, but response.headers.get returns null. Why, and how do you fix it?
    ru: Кросс-доменный ответ содержит X-Total-Count, но response.headers.get возвращает null. Почему и как это исправить?
  - id: cors-vs-security
    en: Does CORS protect your API from attackers? Whom is it actually protecting, and from what?
    ru: Защищает ли CORS твой API от злоумышленников? Кого и от чего он на самом деле защищает?
  - id: cors-vs-csrf
    en: How do CORS and CSRF relate? Does a strict CORS policy prevent CSRF?
    ru: Как связаны CORS и CSRF? Предотвращает ли строгая политика CORS атаку CSRF?
  - id: fixing-cors-in-practice
    en: Your frontend on localhost:5173 cannot call your API on localhost:8080. List the ways to fix it and the trade-offs of each.
    ru: Фронтенд на localhost:5173 не может обратиться к API на localhost:8080. Перечисли способы это исправить и компромиссы каждого.
  - id: dynamic-origin-echo
    en: Some servers echo the incoming Origin header back in Access-Control-Allow-Origin. When is that fine and when is it a vulnerability?
    ru: Некоторые серверы возвращают пришедший заголовок Origin обратно в Access-Control-Allow-Origin. Когда это нормально, а когда это уязвимость?
  - id: preflight-performance
    en: What does a preflight cost, and how do you reduce the number of preflights an application sends?
    ru: Во что обходится предварительный запрос и как уменьшить их количество в приложении?
  - id: gateway-and-cors
    en: Where should CORS be configured in a microservice system — in each service or at the gateway? What goes wrong either way?
    ru: Где настраивать CORS в микросервисной системе — в каждом сервисе или на шлюзе? Что ломается в каждом из вариантов?
  - id: cors-error-diagnosis
    en: 'You see the console error about no Access-Control-Allow-Origin header being present on the requested resource. Walk through how you diagnose it.'
    ru: 'В консоли видно ошибку о том, что на запрошенном ресурсе нет заголовка Access-Control-Allow-Origin. Опиши, как ты это диагностируешь.'
  - id: opaque-and-no-cors
    en: 'What is an opaque response, and what happens when you use fetch with mode ''no-cors''?'
    ru: 'Что такое непрозрачный (opaque) ответ и что происходит при вызове fetch с mode ''no-cors''?'
  - id: what-is-not-restricted
    en: Which cross-origin loads are NOT restricted by the same-origin policy — images, scripts, stylesheets, forms — and why does that matter?
    ru: Какие кросс-доменные загрузки НЕ ограничены правилом одного источника — картинки, скрипты, стили, формы — и почему это важно?
