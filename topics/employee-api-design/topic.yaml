  ru: 'API сотрудника: Дизайн'
category:
  en: REST / API Design
  ru: REST / Проектирование API
type: REST
# Structural topic: a multi-file project analyzed into a class diagram (no run).
mode: structural
aiProvider: claude
categoryId: rest
difficulty: 2
summary:
  en: >
    Design the classes behind the employee API so that the department split from
    the task runs through every layer: salary and passport are exposed by SEPARATE
    controllers, each over its own service, all sharing one repository. You build
    the two department stacks in the file tree, press Analyze, and the class
    diagram + missions confirm the separation of responsibility end to end. Pairs
    with the theory and the implementation challenge.
  ru: >
    Спроектируй классы за API сотрудника так, чтобы разнесение по отделам из
    задачи прошло через каждый слой: зарплату и паспорт выставляют РАЗНЫЕ
    контроллеры, каждый над своим сервисом, и все делят один репозиторий. Ты
    собираешь два стека отделов в дереве файлов, жмёшь Analyze, и диаграмма
    классов + миссии подтверждают разделение ответственности насквозь. В паре с
    теорией и challenge на реализацию.

assistantExample:
  en: 'e.g. Why split salary and passport into separate controllers AND services, not just one of the two?'
  ru: 'например: Зачем разносить зарплату и паспорт на отдельные контроллеры И сервисы, а не только по одному из слоёв?'

missionsFile: quiz.yaml
