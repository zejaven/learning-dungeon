missions:
  - id: publish-inside-transaction
    title:
      en: Publish inside a transaction
      ru: Опубликуй внутри транзакции
    goal:
      en: 'Run code that publishes a domain event while a @Transactional method is still active.'
      ru: 'Запусти код, который публикует domain event, пока @Transactional метод ещё активен.'
    event: TX_EVENT_PUBLISHED
  - id: after-commit-listener
    title:
      en: Run after commit
      ru: Запусти после commit
    goal:
      en: 'Register an AFTER_COMMIT listener and commit the transaction so the listener runs only after the row is durable.'
      ru: 'Зарегистрируй listener AFTER_COMMIT и зафиксируй транзакцию, чтобы listener запустился только после сохранения строки.'
    event: TX_EVENT_AFTER_COMMIT
  - id: after-rollback-listener
    title:
      en: Run after rollback
      ru: Запусти после rollback
    goal:
      en: 'Roll back a transaction and observe an AFTER_ROLLBACK listener run instead of the AFTER_COMMIT listener.'
      ru: 'Откати транзакцию и посмотри, как listener AFTER_ROLLBACK запускается вместо listener AFTER_COMMIT.'
    event: TX_EVENT_AFTER_ROLLBACK
  - id: before-commit-veto
    title:
      en: Veto before commit
      ru: Останови перед commit
    goal:
      en: 'Make a BEFORE_COMMIT listener throw so the transaction rolls back before the commit is finalized.'
      ru: 'Сделай так, чтобы listener BEFORE_COMMIT бросил exception и транзакция откатилась до финального commit.'
    event: TX_EVENT_BEFORE_COMMIT_FAILED
  - id: no-transaction-skipped
    title:
      en: See no-transaction skip
      ru: Увидь пропуск без транзакции
    goal:
      en: 'Publish an event without an active transaction and observe that a normal @TransactionalEventListener is skipped.'
      ru: 'Опубликуй event без активной транзакции и посмотри, что обычный @TransactionalEventListener пропускается.'
    event: TX_EVENT_NO_TRANSACTION_SKIPPED
  - id: fallback-execution
    title:
      en: Enable fallback execution
      ru: Включи fallback execution
    goal:
      en: 'Use fallbackExecution=true so a listener runs immediately when there is no transaction.'
      ru: 'Используй fallbackExecution=true, чтобы listener выполнился сразу, когда транзакции нет.'
    event: TX_EVENT_FALLBACK_EXECUTED
  - id: after-commit-failure
    title:
      en: Fail after commit
      ru: Ошибка после commit
    goal:
      en: 'Make an AFTER_COMMIT listener fail and observe that the original transaction is already committed.'
      ru: 'Сделай так, чтобы listener AFTER_COMMIT упал, и посмотри, что исходная транзакция уже зафиксирована.'
    event: TX_EVENT_AFTER_COMMIT_FAILED

bossFight:
  - id: default-phase
    en: 'What phase does @TransactionalEventListener use by default, and why is that useful for side effects?'
    ru: 'Какую фазу @TransactionalEventListener использует по умолчанию и почему это полезно для побочных действий?'
  - id: event-listener-difference
    en: 'What is the practical difference between @EventListener and @TransactionalEventListener when an event is published inside a transaction?'
    ru: 'В чём практическая разница между @EventListener и @TransactionalEventListener, когда event публикуется внутри транзакции?'
  - id: no-active-transaction
    en: 'What happens when a @TransactionalEventListener receives an event but no transaction is active?'
    ru: 'Что происходит, когда @TransactionalEventListener получает event, но активной транзакции нет?'
  - id: rollback-phase
    en: 'When would you use phase = AFTER_ROLLBACK instead of AFTER_COMMIT?'
    ru: 'Когда стоит использовать phase = AFTER_ROLLBACK вместо AFTER_COMMIT?'
  - id: before-commit-risk
    en: 'Why can a BEFORE_COMMIT listener still roll back the transaction, and why should that phase be used carefully?'
    ru: 'Почему listener BEFORE_COMMIT всё ещё может откатить транзакцию и почему эту фазу нужно использовать осторожно?'
  - id: after-commit-new-transaction
    en: 'Why should database writes from an AFTER_COMMIT listener usually use REQUIRES_NEW if they must be saved?'
    ru: 'Почему записи в базу из listener AFTER_COMMIT обычно требуют REQUIRES_NEW, если их нужно сохранить?'
  - id: external-message-reliability
    en: 'Why is @TransactionalEventListener not a complete replacement for the Outbox pattern when publishing reliable external messages?'
    ru: 'Почему @TransactionalEventListener не является полной заменой Outbox pattern для надёжной отправки внешних сообщений?'
  - id: async-caveat
    en: 'What changes if the transactional event listener is also asynchronous?'
    ru: 'Что меняется, если transactional event listener ещё и асинхронный?'
