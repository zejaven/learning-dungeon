summary:
  en: >
    Learn how normalization organizes facts into tables and normal forms to reduce
    duplication, how denormalization intentionally adds controlled redundancy for
    faster reads, and how to explain the trade-off in an interview.
  ru: >
    Разбери, как нормализация раскладывает факты по таблицам и нормальным формам,
    чтобы уменьшить дублирование, как денормализация осознанно добавляет
    контролируемую избыточность ради быстрых чтений, и как объяснить этот
    компромисс на собеседовании.

