# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: feel-the-pain
    title:
      en: Feel the O(n^2) pain
      ru: Почувствуй боль O(n^2)
    goal:
      en: Run the naive + loop and watch a new String be allocated every iteration.
      ru: Запусти наивный цикл с + и посмотри, как каждую итерацию выделяется новая строка.
    event: CONCAT_STEP
  - id: use-builder
    title:
      en: Switch to StringBuilder
      ru: Перейди на StringBuilder
    goal:
      en: Append into one reusable buffer instead of reallocating a String each time.
      ru: Дописывай в один переиспользуемый буфер вместо перевыделения строки каждый раз.
    event: BUILDER_APPEND
  - id: trigger-grow
    title:
      en: Trigger a capacity grow
      ru: Вызови рост ёмкости
    goal:
      en: Append enough characters (more than 16) to make the buffer reallocate.
      ru: Допиши достаточно символов (больше 16), чтобы буфер перевыделился.
    event: BUILDER_GROW
  - id: presize-buffer
    title:
      en: Pre-size the buffer
      ru: Задай размер буфера заранее
    goal:
      en: Construct the builder with an explicit capacity so it never has to grow.
      ru: Создай билдер с явной ёмкостью, чтобы ему не пришлось расти.
    event: BUILDER_PRESIZE

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: why-plus-is-slow
    en: Why is concatenating strings with + in a loop slow and memory-hungry?
    ru: Почему конкатенация строк через + в цикле медленна и прожорлива по памяти?
  - id: builder-fix
    en: How does StringBuilder avoid that cost, and what is its time complexity?
    ru: Как StringBuilder избегает этой стоимости и какова его временная сложность?
  - id: capacity-growth
    en: What is a StringBuilder's default capacity and how does it grow?
    ru: Какова ёмкость StringBuilder по умолчанию и как она растёт?
  - id: presize-benefit
    en: When and why would you pre-size a StringBuilder?
    ru: Когда и зачем задавать размер StringBuilder заранее?
  - id: builder-vs-buffer
    en: When would you reach for StringBuffer instead of StringBuilder?
    ru: Когда стоит взять StringBuffer вместо StringBuilder?
  - id: compiler-optimization
    en: Does the compiler optimize a + b + c, and why doesn't that help inside a loop?
    ru: Оптимизирует ли компилятор a + b + c и почему это не помогает внутри цикла?
  - id: other-options
    en: What other options exist for joining many strings (String.join, Collectors.joining)?
    ru: Какие ещё есть способы склеить много строк (String.join, Collectors.joining)?
