missions:
  - id: back-off
    title:
      en: Back off before retrying
      ru: Сделай паузу перед повтором
    goal:
      en: Retry a transient failure after an exponential backoff wait.
      ru: Повтори временную ошибку после паузы exponential backoff.
    event: BACKOFF_SCHEDULED
  - id: spread-herd
    title:
      en: Break up the herd
      ru: Разбей толпу
    goal:
      en: Add jitter so that many clients failing together no longer retry in the same window.
      ru: Добавь jitter, чтобы много одновременно упавших клиентов не повторяли в одном окне.
    event: HERD_RETRIES_SPREAD
  - id: skip-permanent
    title:
      en: Do not retry a permanent error
      ru: Не повторяй постоянную ошибку
    goal:
      en: Make a call fail with a 4xx error that the client refuses to retry.
      ru: Получи 4xx-ошибку, которую клиент отказывается повторять.
    event: RETRY_SKIPPED_NON_RETRYABLE
  - id: protect-post
    title:
      en: Protect a non-idempotent call
      ru: Защити неидемпотентный вызов
    goal:
      en: Let a POST without an idempotency key time out and see the client refuse to retry it.
      ru: Дай POST без idempotency key упасть по timeout и посмотри, как клиент отказывается его повторять.
    event: RETRY_SKIPPED_NOT_IDEMPOTENT
  - id: honor-retry-after
    title:
      en: Honor Retry-After
      ru: Учти Retry-After
    goal:
      en: Get a 429 with Retry-After and wait as long as the server asked.
      ru: Получи 429 с Retry-After и подожди столько, сколько попросил сервер.
    event: RETRY_AFTER_HONORED
  - id: respect-deadline
    title:
      en: Respect the deadline
      ru: Уложись в deadline
    goal:
      en: Stop retrying because the next wait would cross the request deadline.
      ru: Прекрати повторы, потому что следующая пауза пересечёт deadline запроса.
    event: DEADLINE_EXCEEDED
  - id: contain-retries
    title:
      en: Retry at one layer only
      ru: Retry только на одном уровне
    goal:
      en: Run a call stack where only one layer retries, so the failing dependency is not flooded.
      ru: Запусти стек вызовов, где повторяет только один уровень, чтобы упавшая зависимость не захлебнулась.
    event: RETRY_CONTAINED

bossFight:
  - id: answer-outline
    en: How do you retry failed calls to another service safely? Walk through backoff, jitter, which errors you retry, and where in the stack the retry lives.
    ru: Как безопасно повторять неудачные вызовы другого сервиса? Расскажите про backoff, jitter, какие ошибки повторять и на каком уровне стека делать retry.
  - id: why-jitter
    en: Exponential backoff already spreads retries over time. Why do you still need jitter?
    ru: Exponential backoff уже растягивает повторы во времени. Зачем тогда ещё нужен jitter?
  - id: retryable-errors
    en: Which failures are worth retrying and which are not? Give examples of HTTP statuses and exceptions for each group.
    ru: Какие сбои стоит повторять, а какие нет? Приведите примеры HTTP-статусов и исключений для каждой группы.
  - id: timeout-post
    en: A POST that creates a payment times out. Can you retry it? What has to be true for the retry to be safe?
    ru: POST, создающий платёж, упал по timeout. Можно ли его повторить? Что должно быть верно, чтобы повтор был безопасен?
  - id: retry-amplification
    en: Why is it dangerous when every layer of a call chain has its own retries, and where should the retry live instead?
    ru: Чем опасно, когда у каждого уровня цепочки вызовов свои retry, и где их стоит делать вместо этого?
  - id: retries-and-breaker
    en: How do retries interact with timeouts, a request deadline, a retry budget and a circuit breaker?
    ru: Как retry взаимодействуют с timeouts, deadline запроса, retry budget и circuit breaker?
