id: kotlin-coroutines
languages: [en, ru]
title:
  en: 'How Kotlin Coroutines Work'
  ru: 'Как работают корутины Kotlin'
category:
  en: Kotlin / Concurrency
  ru: Kotlin / Конкурентность
type: CONCURRENCY
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: kotlin
difficulty: 2
catalogId: kotlin-1
summary:
  en: >
    A coroutine is not a thread and not a lightweight thread — it is an object.
    The Kotlin compiler rewrites every suspend fun into a state machine class
    with an int label, one field per local that must survive a suspension, and a
    hidden Continuation parameter; a suspension point either returns a value or
    returns the marker COROUTINE_SUSPENDED, in which case invokeSuspend returns,
    the JVM stack unwinds, and the thread is free while the coroutine lives on in
    the heap. Resuming is calling invokeSuspend on that same object again, and
    when (label) jumps straight back to the statement it stopped at. Everything
    else follows from that: a dispatcher decides which thread runs a resumed
    continuation, so suspending is cheap and blocking is not — a JDBC call on
    Dispatchers.Default holds a core hostage and no exception tells you. Scopes
    make the Job tree explicit: a scope cannot return before its children, a
    failing child cancels its siblings unless the scope is a supervisorScope, and
    cancellation is cooperative — instant at a suspension point, invisible inside
    a loop that never suspends.
  ru: >
    Корутина — не поток и не «лёгкий поток», а объект. Компилятор Kotlin
    переписывает каждую suspend fun в класс-машину состояний с полем int label,
    по полю на каждую локальную переменную, которая должна пережить приостановку,
    и скрытым параметром Continuation; точка приостановки либо возвращает
    значение, либо возвращает маркер COROUTINE_SUSPENDED — и тогда invokeSuspend
    возвращается, стек JVM разматывается, поток свободен, а корутина продолжает
    жить в куче. Возобновление — это повторный вызов invokeSuspend на том же
    объекте, и when (label) прыгает ровно к тому оператору, на котором
    остановились. Всё остальное следует отсюда: диспетчер решает, какой поток
    выполнит возобновлённый continuation, поэтому приостановка дёшева, а
    блокировка нет — вызов JDBC на Dispatchers.Default забирает ядро в заложники,
    и ни одно исключение об этом не скажет. Области делают дерево Job явным:
    область не может вернуться раньше своих детей, упавший ребёнок отменяет
    соседей (если это не supervisorScope), а отмена кооперативна — мгновенна в
    точке приостановки и невидима внутри цикла, который никогда не
    приостанавливается.

