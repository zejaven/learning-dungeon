id: symmetric-vs-asymmetric-encryption
languages: [en, ru]
title:
  en: 'Symmetric vs Asymmetric Encryption'
  ru: 'Симметричное и асимметричное шифрование'
category:
  en: Security & Authentication
  ru: Безопасность и аутентификация
type: HTTP
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: security
difficulty: 2
catalogId: security-7
summary:
  en: >
    The difference is one number: how many keys. Symmetric encryption uses ONE
    key that both sides must already have - fast, unlimited in size, and unable
    to bootstrap itself, because delivering that key to the other side is the
    hard part and a group of n parties needs n(n-1)/2 of them. Asymmetric
    encryption uses a linked PAIR where one half is meant to be published, which
    kills the distribution problem outright: anyone can encrypt to you, only you
    can decrypt; use the pair the other way round - sign with the private half,
    verify with the public one - and you get authenticity instead of secrecy.
    The price is that it is thousands of times slower and bounded by the key
    size (190 bytes for RSA-2048), so nothing bulky is ever encrypted with it
    directly. Every real system is therefore hybrid: one asymmetric operation
    establishes a fresh symmetric key, and that key carries the data. The traps
    are calling one 'more secure' than the other, thinking a signature encrypts
    anything, believing the public key can decrypt what it encrypted, and
    forgetting that a symmetric key can never prove WHO wrote a message.
  ru: >
    Разница в одном числе — сколько ключей. Симметричное шифрование использует
    ОДИН ключ, который уже должен быть у обеих сторон: быстрый, без ограничений
    на размер и не способный запустить сам себя, ведь доставка этого ключа
    другой стороне и есть самое трудное, а группе из n участников их нужно
    n(n-1)/2. Асимметричное шифрование использует связанную ПАРУ, одну половину
    которой специально публикуют, и это снимает проблему распространения
    начисто: зашифровать вам может кто угодно, расшифровать — только вы;
    используйте пару наоборот (подписать приватным, проверить публичным) — и
    вместо секретности получите подлинность. Плата — в тысячи раз меньшая
    скорость и потолок размера, заданный ключом (190 байт для RSA-2048),
    поэтому напрямую им ничего объёмного не шифруют. Отсюда любая реальная
    система гибридна: одна асимметричная операция устанавливает свежий
    симметричный ключ, а данные везёт уже он. Ловушки: называть один вид
    «безопаснее» другого; считать, что подпись что-то шифрует; думать, что
    публичный ключ расшифрует зашифрованное им же; и забывать, что симметричный
    ключ не способен доказать, КТО написал сообщение.

