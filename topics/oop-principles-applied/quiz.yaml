# Structural missions: checked against the analyzed class graph (not trace events).
# A mission passes when EVERY predicate in `requires` holds. Predicate kinds:
#   interfaceWithImpls { minImplementations, name? }
#   composition        { targetKind, ownerKind?, name? }
#   edge               { relation: extends|implements|association, from?, to? }
#   nodeExists         { nodeKind, name? }
missions:
  - id: oop-abstraction-polymorphism
    type: structure
    title:
      en: Abstraction + Polymorphism
      ru: Абстракция + Полиморфизм
    goal:
      en: >
        Make the Notifier interface polymorphic: add at least two classes that
        implement it (e.g. EmailNotifier, SmsNotifier). The interface is the
        abstraction; the many implementations are polymorphism.
      ru: >
        Сделай интерфейс Notifier полиморфным: добавь минимум два класса, которые
        его реализуют (например, EmailNotifier, SmsNotifier). Интерфейс — это
        абстракция; множество реализаций — это полиморфизм.
    requires:
      - { kind: interfaceWithImpls, name: Notifier, minImplementations: 2 }
  - id: oop-inheritance
    type: structure
    title:
      en: Inheritance
      ru: Наследование
    goal:
      en: >
        Specialize one implementation with a subclass that `extends` it
        (e.g. UrgentEmailNotifier extends EmailNotifier). The "is-a" edge is
        inheritance.
      ru: >
        Специализируй одну из реализаций подклассом, который её `extends`
        (например, UrgentEmailNotifier extends EmailNotifier). Связь "is-a" —
        это наследование.
    requires:
      - { kind: edge, relation: extends }
  - id: oop-composition
    type: structure
    title:
      en: Composition (encapsulation in action)
      ru: Композиция (инкапсуляция в действии)
    goal:
      en: >
        Give NotificationService a private Notifier field and delegate to it.
        The service "has-a" notifier and hides how the message is delivered —
        composition over inheritance, with encapsulated state.
      ru: >
        Дай NotificationService приватное поле Notifier и делегируй ему. Сервис
        "has-a" notifier и скрывает, как доставляется сообщение, — композиция
        вместо наследования с инкапсулированным состоянием.
    requires:
      - { kind: composition, targetKind: interface, name: Notifier }
  - id: oop-all-applied
    type: structure
    title:
      en: All four pillars assembled
      ru: Все четыре столпа собраны
    goal:
      en: >
        The full design: an interface with two or more implementations
        (abstraction + polymorphism), a subclass that extends one of them
        (inheritance), and a service that composes the interface (composition
        + encapsulation).
      ru: >
        Полный дизайн: интерфейс с двумя и более реализациями (абстракция +
        полиморфизм), подкласс, который наследует одну из них (наследование), и
        сервис, который композирует интерфейс (композиция + инкапсуляция).
    requires:
      - { kind: interfaceWithImpls, name: Notifier, minImplementations: 2 }
      - { kind: edge, relation: extends }
      - { kind: composition, targetKind: interface, name: Notifier }

bossFight:
  - id: oop-four-pillars
    en: What are the four pillars of OOP, and what does each one mean?
    ru: Каковы четыре столпа ООП, и что означает каждый из них?
  - id: oop-abstraction-vs-encapsulation
    en: What is the difference between abstraction and encapsulation?
    ru: В чём разница между абстракцией и инкапсуляцией?
  - id: oop-inheritance-vs-composition
    en: When would you prefer composition over inheritance, and why?
    ru: Когда вы предпочтёте композицию наследованию и почему?
  - id: oop-polymorphism-kinds
    en: What kinds of polymorphism exist in Java, and how does each work?
    ru: Какие виды полиморфизма существуют в Java и как работает каждый из них?
  - id: oop-encapsulation-why
    en: Why is encapsulation valuable, and how do you enforce it in Java?
    ru: Почему инкапсуляция полезна и как вы обеспечиваете её в Java?
