id: spring-aop-advice-types
title:
  en: 'Spring AOP Advice Types'
  ru: 'Типы Advice в Spring AOP'
category:
  en: 'Spring / AOP'
  ru: 'Spring / AOP'
type: SPRING
mode: trace
aiProvider: codex
aiModel: 'gpt-5.5'
categoryId: spring
difficulty: 2
catalogId: manual-12
style: Real world
summary:
  en: >
    The five Spring AOP advice types: when @Before, @After, @AfterReturning,
    @AfterThrowing, and @Around run, what each one can observe or control, and
    which production concerns they fit.
  ru: >
    Пять типов advice в Spring AOP: когда выполняются @Before, @After,
    @AfterReturning, @AfterThrowing и @Around, что каждый из них может увидеть
    или контролировать и для каких production-задач подходит.

primitives:
  - ArrayGrid
  - LinkedNodes

defaultExample: before-advice

examples:
  - id: before-advice
    title:
      en: '@Before'
      ru: '@Before'
    file: 01-before-advice.java
    explanation:
      en: >
        @Before runs after the pointcut matches but before the target method
        starts. It is good for validation, security checks, and simple logging.
      ru: >
        @Before выполняется после совпадения pointcut, но до старта target
        method. Он подходит для validation, security checks и простого logging.
  - id: after-advice
    title:
      en: '@After'
      ru: '@After'
    file: 02-after-advice.java
    explanation:
      en: >
        @After is finally-style advice: it runs after the target finishes even
        when the target throws an exception.
      ru: >
        @After похож на finally: он выполняется после завершения target даже
        тогда, когда target бросает exception.
  - id: after-returning
    title:
      en: '@AfterReturning'
      ru: '@AfterReturning'
    file: 03-after-returning.java
    explanation:
      en: >
        @AfterReturning runs only on a successful return, so it can audit the
        returned result or record success metrics.
      ru: >
        @AfterReturning выполняется только при успешном return, поэтому может
        audit возвращенный результат или записать success metrics.
  - id: after-throwing
    title:
      en: '@AfterThrowing'
      ru: '@AfterThrowing'
    file: 04-after-throwing.java
    explanation:
      en: >
        @AfterThrowing runs only when an exception leaves the target method,
        which fits error logging, alerts, and failure audit.
      ru: >
        @AfterThrowing выполняется только когда exception выходит из target
        method, что подходит для error logging, alerts и failure audit.
  - id: around-advice
    title:
      en: '@Around'
      ru: '@Around'
    file: 05-around-advice.java
    explanation:
      en: >
        @Around wraps proceed(), so it can run before and after the target,
        measure time, replace the result, retry, or skip the call.
      ru: >
        @Around оборачивает proceed(), поэтому может выполниться до и после
        target, измерить время, заменить result, повторить или пропустить вызов.

assistantExample:
  en: 'e.g. When would you choose @Around instead of @Before plus @AfterReturning?'
  ru: 'например: Когда выбрать @Around вместо @Before плюс @AfterReturning?'

missionsFile: quiz.yaml
