id: event-carried-state-transfer
languages: [en, ru]
title:
  en: Async Data at a Synchronous Decision Point
  ru: Асинхронные данные в точке синхронного решения
category:
  en: Microservices / Data Distribution
  ru: Микросервисы / Распределение данных
type: OTHER
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: microservices
difficulty: 3
catalogId: microservices-14
summary:
  en: >
    A checkout has to be priced now, but the exchange rate belongs to another
    service that publishes it asynchronously. Calling that service inside the
    decision is the honest baseline and it multiplies latency and availability;
    a local copy — a read-through cache with a TTL, or a replica kept up to date
    by the owner's events (event-carried state transfer) — turns the decision
    into a local read. What you buy is availability, what you pay is staleness,
    and the design is only finished when you say out loud how old the data may
    be and what happens beyond that. The rest is the machinery that makes a local
    copy trustworthy: versioned, idempotent event application, a rebuildable
    replica for cold starts, monitoring of feed lag rather than errors, and
    pinning the value that was used onto the decision it produced.
  ru: >
    Заказ нужно рассчитать сейчас, но курс принадлежит другому сервису, который
    публикует его асинхронно. Вызвать этот сервис прямо внутри решения — честная
    отправная точка, которая перемножает задержки и доступности; локальная копия
    — read-through кэш с TTL или реплика, которую поддерживают события владельца
    (event-carried state transfer), — превращает решение в локальное чтение.
    Покупаете вы доступность, платите устареванием данных, и проект не закончен,
    пока не сказано вслух, насколько старыми данные быть могут и что происходит
    за этой границей. Остальное — механика, которая делает локальную копию
    надёжной: применение событий по версии и идемпотентно, восстановимая реплика
    для холодного старта, мониторинг отставания потока вместо ошибок и фиксация
    использованного значения в самом решении.

