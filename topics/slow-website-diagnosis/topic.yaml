id: slow-website-diagnosis
languages: [en, ru]
title:
  en: 'The Site Is Slow: How Do You Find the Cause?'
  ru: 'Сайт тормозит: как найти причину?'
category:
  en: Performance / Diagnostics
  ru: Производительность / Диагностика
type: HTTP
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: performance
difficulty: 2
catalogId: performance-1
summary:
  en: >
    "Slow" is a feeling that something measurable caused, and the whole answer is
    refusing to jump from the feeling to a fix. Turn the complaint into a page, a
    percentile and a target — the average is the one number that describes nobody,
    and the person complaining lives at p95. Then measure the end-to-end total and
    split it: DNS, connect, TLS, waiting for the first byte, download, render. The
    parts must add up to what the user experiences, and the gap is itself a finding.
    Follow the biggest slice down — first byte into queueing, application code,
    database and outbound calls; a slow query into what its plan actually does —
    and stop when the remainder is small enough to be a cause. One comparison
    decides which half of the world you are in: the same request when the site is
    idle and at peak. Slow when idle means slow work and the fix is in a file; slow
    only when busy means a queue, and profiling the handler will show you nothing.
    Before building anything, price it: making a 95ms segment four times faster
    removes 71ms of a 3100ms page, which nobody can perceive — the ceiling on an
    optimisation is the size of the slice it touches. Then take the same
    measurement again, because a change with no before-number is a belief. The
    traps are optimising on a hunch, reading the average, profiling code that is
    waiting rather than working, and calling it fixed without re-measuring.
  ru: >
    «Медленно» — это ощущение, вызванное чем-то измеримым, и весь ответ состоит в
    отказе прыгнуть от ощущения сразу к исправлению. Превратите жалобу в страницу,
    перцентиль и цель: среднее — единственное число, которое не описывает никого, а
    жалующийся живёт на p95. Затем измерьте сквозное время и разбейте его: DNS,
    соединение, TLS, ожидание первого байта, загрузка, рендеринг. Части обязаны
    складываться в то, что переживает пользователь, а разрыв — сам по себе находка.
    Идите за самым большим срезом вниз: первый байт распадается на очередь, код
    приложения, базу и исходящие вызовы, медленный запрос — на то, что реально
    делает его план, — и остановитесь, когда остаток станет достаточно мал, чтобы
    быть причиной. Одно сравнение решает, в какой половине мира вы находитесь: тот
    же запрос на пустом сайте и на пике. Медленно при простое — медленна работа, и
    исправление лежит в файле; медленно только под нагрузкой — это очередь, и
    профилирование обработчика не покажет ничего. Прежде чем что-то строить,
    посчитайте цену: ускорение 95-миллисекундного сегмента вчетверо убирает 71мс из
    3100мс страницы, чего никто не заметит, — потолок оптимизации равен размеру
    среза, которого она касается. Затем снимите то же измерение снова: изменение
    без числа «до» — это вера. Ловушки: оптимизировать по наитию, читать среднее,
    профилировать код, который ждёт, а не работает, и объявлять починенным без
    повторного замера.

# Visual primitives this topic's visualizer composes (frontend).
primitives:
  - BoxGroup

defaultExample: slow-is-not-a-number

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: slow-is-not-a-number
    title:
      en: '"Slow" is not a measurement'
      ru: '«Медленно» — это не измерение'
    file: 01-slow-is-not-a-number.java
    explanation:
      en: >
        The same complaint handled twice. First by the reflex — two days spent
        rewriting a mapper that nobody ever measured, which is the default
        failure mode of this entire question. Then by five questions that turn a
        mood into a page, a number, a slope and a frequency, plus the budget that
        gives the hunt an end condition and the percentiles that show why the
        average was describing nobody.
      ru: >
        Одна и та же жалоба, обработанная дважды. Сначала рефлексом — два дня на
        переписывание маппера, который никто не измерял: это режим отказа по
        умолчанию для всего вопроса. Затем пятью вопросами, превращающими
        настроение в страницу, число, наклон и частоту, плюс бюджет, дающий охоте
        условие остановки, и перцентили, показывающие, почему среднее не
        описывало никого.
  - id: where-does-the-time-go
    title:
      en: 'Split the wait into parts that add up'
      ru: 'Разбей ожидание на складывающиеся части'
    file: 02-where-does-the-time-go.java
    explanation:
      en: >
        The first screen of any web performance investigation, and it needs no
        setup: the browser already decomposes the wait into DNS, connect, TLS,
        first byte, download and render. Five measurements that sum to the 3100ms
        the user actually feels, two segments closed with numbers rather than
        reputations, and one slice left holding 77% of the page.
      ru: >
        Первый экран любого расследования веб-производительности, и настраивать
        для него ничего не нужно: браузер уже раскладывает ожидание на DNS,
        соединение, TLS, первый байт, загрузку и рендеринг. Пять измерений,
        складывающихся в те 3100мс, которые реально ощущает пользователь, два
        сегмента, закрытых числами, а не репутацией, и один срез, держащий 77%
        страницы.
  - id: follow-the-biggest-slice
    title:
      en: 'Follow the biggest slice down'
      ru: 'Иди за самым большим срезом вниз'
    file: 03-follow-the-biggest-slice.java
    explanation:
      en: >
        The method applied recursively, which is the whole answer to the
        interview question. The first byte splits into queueing, the query, an
        outbound call and rendering; the query splits into what its plan actually
        does. Three levels, three tools, and "the site is slow" ends up as one
        missing index — with the arithmetic to prove it accounts for the time.
      ru: >
        Метод, применённый рекурсивно, — и это весь ответ на вопрос
        собеседования. Первый байт распадается на очередь, запрос, исходящий
        вызов и рендеринг; запрос — на то, что реально делает его план. Три
        уровня, три инструмента, и «сайт тормозит» превращается в один
        отсутствующий индекс, с арифметикой, доказывающей, что он объясняет
        время.
  - id: the-ceiling-on-a-fix
    title:
      en: 'Price the fix before you build it'
      ru: 'Оцени исправление до того, как его писать'
    file: 04-the-ceiling-on-a-fix.java
    explanation:
      en: >
        Three proposals priced against the whole request in one line each, and
        the ranking they produce is not the ranking anyone's instinct produces.
        Then the pleasant-sounding one gets built anyway: a template engine made
        four times faster, shipped with no confirmed cause, and a page that comes
        back 2% quicker — which is measurement noise wearing a sprint's clothes.
      ru: >
        Три предложения, оценённых относительно всего запроса одной строкой
        каждое, и получившийся порядок — не тот, который выдаёт чутьё. А затем
        приятно звучащее всё-таки строят: движок шаблонов, ускоренный вчетверо,
        выкаченный без подтверждённой причины, и страница, вернувшаяся быстрее на
        2%, — то есть шум измерения, переодетый в спринт.
  - id: slow-work-or-a-long-queue
    title:
      en: 'Slow work, or a long queue?'
      ru: 'Медленная работа или длинная очередь?'
    file: 05-slow-work-or-a-long-queue.java
    explanation:
      en: >
        The same click: 240ms at night, 2900ms at 20:15. That one comparison
        moves the whole investigation from "which code is slow" to "what are we
        waiting in line for" — and the walk through CPU, GC, the connection pool
        and the database finds a pool of ten in front of a database that is 82%
        idle. Nothing here is slow code, which is why a profiler would show
        nothing.
      ru: >
        Один и тот же клик: 240мс ночью и 2900мс в 20:15. Это единственное
        сравнение переносит всё расследование из «какой код медленный» в «в
        очереди за чем мы стоим» — а обход процессора, GC, пула соединений и базы
        находит пул из десяти соединений перед базой, простаивающей на 82%.
        Медленного кода здесь нет вообще, поэтому профилировщик не показал бы
        ничего.
  - id: the-half-that-is-the-browser
    title:
      en: 'When the backend is innocent'
      ru: 'Когда бэкенд ни при чём'
    file: 06-the-half-that-is-the-browser.java
    explanation:
      en: >
        A 180ms first byte and a page that still takes four seconds to appear,
        because the wait a user experiences did not end when your response did.
        The same split, applied on the other side of the wire: a render-blocking
        bundle, a third-party script on the critical path, an unoptimised image —
        and 78% of the JavaScript that this page never executes.
      ru: >
        Первый байт за 180мс — и страница, которая всё равно появляется четыре
        секунды, потому что ожидание пользователя не закончилось вместе с вашим
        ответом. То же разбиение по другую сторону провода: блокирующий рендеринг
        бандл, сторонний скрипт на критическом пути, неоптимизированная картинка
        — и 78% JavaScript, который эта страница никогда не выполняет.
  - id: nothing-is-measured
    title:
      en: 'Nothing is measured. Now what?'
      ru: 'Ничего не измеряется. Что теперь?'
    file: 07-nothing-is-measured.java
    explanation:
      en: >
        The most common state of a real system, and the honest first answer:
        three blind spots named out loud, then the cheapest measurement in the
        world — the access log has had per-request durations all along. Meanwhile
        the reflex fix gets deployed anyway, and doubling the instances moves a
        request that was slow with nobody on the site by exactly 3%.
      ru: >
        Самое обычное состояние настоящей системы и честный первый ответ: три
        слепых пятна, названные вслух, а затем самое дешёвое измерение на свете —
        в логе доступа всё это время лежали длительности каждого запроса. Тем
        временем рефлекторное исправление всё равно выкатывают, и удвоение числа
        экземпляров сдвигает запрос, который был медленным на пустом сайте, ровно
        на 3%.
  - id: fix-verify-prevent
    title:
      en: 'Fix, verify, and leave a graph behind'
      ru: 'Исправить, проверить и оставить график'
    file: 08-fix-verify-prevent.java
    explanation:
      en: >
        The whole hunt in one run, ending the way real ones do: 3100ms becomes
        1180ms, which is a 61% win and still over the agreed budget — so the
        answer is not "done", it is "split the new total and go again". Plus the
        three follow-ups that are the only permanent output, because the same
        page will get slow again for a different reason.
      ru: >
        Вся охота за один прогон, заканчивающаяся так, как заканчиваются
        настоящие: 3100мс превращаются в 1180мс — выигрыш 61% и всё ещё выше
        согласованного бюджета, поэтому ответ не «готово», а «разбивай новую сумму
        и иди по кругу». Плюс три последующие задачи — единственный постоянный
        результат, потому что та же страница снова станет медленной, только по
        другой причине.

# Example question pre-filled as the Ask AI placeholder.
