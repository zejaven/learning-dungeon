bossFight:
  # I. Coverage assessment
  - id: coverage-assessment
    en: 'How would you assess that everything is covered by tests? Why is "we have 90% code coverage" not a sufficient answer?'
    ru: 'Как вы оцените, что всё покрыто тестами? Почему ответ «у нас 90% покрытия кода» недостаточен?'
  - id: traceability-matrix
    en: 'What is a requirements traceability matrix (RTM), what questions does it answer, and how do you keep it from turning into bureaucracy?'
    ru: 'Что такое матрица трассировки требований (RTM), на какие вопросы она отвечает и как не дать ей превратиться в бюрократию?'
  # II. Strategy vs plan
  - id: strategy-vs-plan
    en: 'What is a test strategy and how does it differ from a test plan? Give examples of what belongs to each document.'
    ru: 'Что такое тестовая стратегия и чем она отличается от тест-плана? Приведите примеры, что относится к каждому документу.'
  - id: strategy-lifetime
    en: 'Why is a test strategy a long-lived company-level document while a test plan is written per project or release? What happens if you mix them up?'
    ru: 'Почему тестовая стратегия — долгоживущий документ уровня компании, а тест-план пишется под проект или релиз? Что будет, если их перепутать?'
  # III. Process improvement
  - id: process-improvement-example
    en: 'Have you participated in process improvements? Give a concrete example in the "problem — action — measurable result" format.'
    ru: 'Участвовали ли вы в улучшении процессов? Приведите конкретный пример в формате «проблема — действие — измеримый результат».'
  # IV. Email validation trap
  - id: email-validation-trap
    en: 'How would you check that an email address is valid? Why is sending a verification message the only truly reliable way?'
    ru: 'Как проверить валидность email-адреса? Почему отправка проверочного письма — единственный по-настоящему надёжный способ?'
  - id: email-regex-vs-rfc
    en: 'Why does even a perfect regex fail to validate an email address in practice? What should client-side validation actually do?'
    ru: 'Почему даже идеальный regex на практике не проверяет валидность email? Что на самом деле должна делать клиентская валидация?'
  # V. Building a process from scratch
  - id: testing-process-new-team
    en: 'You join a new team with no established testing. How would you build the testing process step by step, and where would you start?'
    ru: 'Вы пришли в новую команду, где тестирование не выстроено. Как вы шаг за шагом построите процесс тестирования и с чего начнёте?'
