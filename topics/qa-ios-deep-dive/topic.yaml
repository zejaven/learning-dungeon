summary:
  en: >
    The senior-level iOS block for QA interviews: supported devices and iOS/iPadOS
    versions, what happens on app launch and in the background, APNs push
    notifications, the app sandbox (caches/documents/tmp), storage options
    (UserDefaults, Keychain, SQLite, CoreData, Realm, Firebase) and what survives
    uninstall, UIKit vs SwiftUI testing specifics, dark/light theme testing,
    url-schemes, two UIWindow cases, and the 60 fps / 16 ms performance rule.
  ru: >
    Senior-блок про iOS для собеседований QA: поддерживаемые устройства и версии
    iOS/iPadOS, что происходит при запуске приложения и в фоне, push-нотификации
    через APNs, сэндбокс приложения (caches/documents/tmp), способы хранения
    данных (UserDefaults, Keychain, SQLite, CoreData, Realm, Firebase) и что
    остаётся после удаления, особенности тестирования UIKit и SwiftUI, светлая и
    тёмная тема, url-схемы, случаи двух UIWindow и правило 60 fps / 16 ms.

assistantExample:
  en: "e.g. Which data survives after an iOS app is uninstalled, and why?"
  ru: "например: Какие данные остаются после удаления iOS-приложения и почему?"

