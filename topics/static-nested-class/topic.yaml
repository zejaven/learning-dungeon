id: static-nested-class
languages: [en, ru]
title:
  en: Static Nested Classes in Java
  ru: Static nested class в Java
category:
  en: Java Core
  ru: Java Core
type: OTHER
mode: trace
aiProvider: codex
aiModel: gpt-5.5
summary:
  en: >
    What interviewers usually mean by a "static class" in Java: a static nested
    class. It belongs to the enclosing type's namespace, can be created without
    an enclosing object, has no hidden outer-instance reference, and can access
    outer instance state only through an explicit object reference.
  ru: >
    Что обычно имеют в виду на собеседовании под «static-классом» в Java:
    static nested class. Он принадлежит пространству имён внешнего типа, может
    создаваться без объекта внешнего класса, не хранит скрытую ссылку на внешний
    объект и может обращаться к состоянию внешнего объекта только через явную
    ссылку.
categoryId: java-core
difficulty: 1
catalogId: java-core-12
style: Real world

primitives:
  - BoxGroup
  - EventLog

defaultExample: static-without-outer

examples:
  - id: static-without-outer
    title:
      en: Create without outer
      ru: Создать без внешнего объекта
    file: 01-static-without-outer.java
    explanation:
      en: >
        A static nested class is instantiated with Outer.Nested and does not
        need new Outer() first.
      ru: >
        Static nested class создаётся как Outer.Nested и не требует сначала
        создавать new Outer().
  - id: inner-uses-outer
    title:
      en: Inner keeps outer
      ru: Inner хранит внешний объект
    file: 02-inner-uses-outer.java
    explanation:
      en: >
        A regular non-static inner class is different: each object is tied to a
        specific outer instance.
      ru: >
        Обычный non-static inner class отличается: каждый его объект связан с
        конкретным экземпляром внешнего класса.
  - id: static-members
    title:
      en: Shared static member
      ru: Общий static member
    file: 03-static-members.java
    explanation:
      en: >
        Static members belong to the class itself and are normally accessed
        through the type name, not through a nested object.
      ru: >
        Static members принадлежат самому классу и обычно доступны через имя
        типа, а не через объект вложенного класса.
  - id: explicit-outer-parameter
    title:
      en: Explicit outer access
      ru: Явный доступ к внешнему объекту
    file: 04-explicit-outer-parameter.java
    explanation:
      en: >
        A static nested class can read outer instance fields only when an outer
        object is passed explicitly.
      ru: >
        Static nested class может читать поля внешнего объекта только когда этот
        внешний объект передан явно.
  - id: name-scope
    title:
      en: Namespace, not inheritance
      ru: Пространство имён, не наследование
    file: 05-name-scope.java
    explanation:
      en: >
        Outer.Nested is a qualified name and a packaging choice; it does not mean
        Nested extends Outer.
      ru: >
        Outer.Nested — это квалифицированное имя и способ группировки кода; это
        не означает, что Nested extends Outer.

assistantExample:
  en: "e.g. Can a static nested class access fields of the outer class?"
  ru: "например: Может ли static nested class обращаться к полям внешнего класса?"

