# Structural missions: checked against the analyzed class graph (not trace events).
# A mission passes when EVERY predicate in `requires` holds. Predicate kinds:
#   interfaceWithImpls { minImplementations, name? }
#   composition        { targetKind, ownerKind?, name? }
#   edge               { relation: extends|implements|association, from?, to? }
#   nodeExists         { nodeKind, name? }
missions:
  - id: salary-service
    type: structure
    title:
      en: Separate SalaryService
      ru: Отдельный SalaryService
    goal:
      en: Create a SalaryService class with an EmployeeRepository field (it owns changeSalary).
      ru: Создай класс SalaryService с полем типа EmployeeRepository (он владеет changeSalary).
    requires:
      - { kind: edge, relation: association, from: SalaryService, to: EmployeeRepository }
  - id: passport-service
    type: structure
    title:
      en: Separate PassportService
      ru: Отдельный PassportService
    goal:
      en: Create a PassportService class with an EmployeeRepository field (it owns changePassport).
      ru: Создай класс PassportService с полем типа EmployeeRepository (он владеет changePassport).
    requires:
      - { kind: edge, relation: association, from: PassportService, to: EmployeeRepository }
  - id: read-side
    type: structure
    title:
      en: Separate read side
      ru: Отдельная сторона чтения
    goal:
      en: Create an EmployeeQueryService class with an EmployeeRepository field (it returns the card).
      ru: Создай класс EmployeeQueryService с полем типа EmployeeRepository (он возвращает карточку).
    requires:
      - { kind: edge, relation: association, from: EmployeeQueryService, to: EmployeeRepository }
  - id: controller-wires-both
    type: structure
    title:
      en: Controller wires both write services
      ru: Контроллер связывает оба сервиса записи
    goal:
      en: EmployeeController must hold fields for BOTH SalaryService and PassportService.
      ru: EmployeeController должен держать поля И для SalaryService, И для PassportService.
    requires:
      - { kind: edge, relation: association, from: EmployeeController, to: SalaryService }
      - { kind: edge, relation: association, from: EmployeeController, to: PassportService }

bossFight:
  - id: why-two-services
    en: Why put salary and passport changes in two separate services instead of one EmployeeService with two methods?
    ru: Почему изменение зарплаты и паспорта стоит положить в два отдельных сервиса, а не в один EmployeeService с двумя методами?
  - id: single-responsibility
    en: How does splitting these services follow the Single Responsibility Principle?
    ru: Как разделение этих сервисов следует принципу единственной ответственности?
  - id: read-side-separate
    en: Why model the read side (getCard) as its own query service rather than reusing a write service?
    ru: Зачем моделировать сторону чтения (getCard) отдельным query-сервисом, а не переиспользовать сервис записи?
  - id: controller-role
    en: What is the controller's responsibility once the services are split, and what should it NOT do?
    ru: В чём ответственность контроллера после разделения сервисов и чего он делать НЕ должен?
  - id: shared-repository
    en: Both write services share one EmployeeRepository here. When might you split the storage too?
    ru: Здесь оба сервиса записи делят один EmployeeRepository. Когда стоит разделить и хранилище?
