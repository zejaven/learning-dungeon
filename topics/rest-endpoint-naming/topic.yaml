id: rest-endpoint-naming
languages: [en, ru]
title:
  en: 'Naming REST Endpoints'
  ru: 'Именование REST-эндпоинтов'
category:
  en: REST / API Design
  ru: REST / Проектирование API
type: HTTP
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: rest
difficulty: 1
catalogId: rest-3
summary:
  en: >
    An endpoint is two halves: the path names the thing, the method names what
    happens to it. So the URL is a noun — a collection (`/employees`), one item
    inside it (`/employees/{id}`), or a part of that item
    (`/employees/{id}/documents`) — and reading, creating, replacing and deleting
    are GET, POST, PUT/PATCH and DELETE on those same URLs, not five different
    names. Filtering, sorting and paging select part of the same collection, so
    they live in the query string. The traps are verbs in the path
    (`/getEmployeeById`), a read hidden behind POST, a GET that changes data,
    mixed singular and plural, and nesting so deep that an item can only be
    reached through its whole family tree.
  ru: >
    Эндпоинт состоит из двух половин: путь называет вещь, метод — то, что с ней
    произойдёт. Поэтому URL — это существительное: коллекция (`/employees`), один
    элемент в ней (`/employees/{id}`) или часть этого элемента
    (`/employees/{id}/documents`), а чтение, создание, замена и удаление — это
    GET, POST, PUT/PATCH и DELETE по тем же самым URL, а не пять разных имён.
    Фильтрация, сортировка и постраничность выбирают часть той же коллекции,
    поэтому им место в query string. Ловушки: глаголы в пути
    (`/getEmployeeById`), чтение, спрятанное за POST, GET, который меняет данные,
    смешение единственного и множественного числа и такая глубокая вложенность,
    что до элемента можно добраться только через всё его генеалогическое древо.

# Visual primitives this topic's visualizer composes (frontend).
primitives:
  - BoxGroup

defaultExample: nouns-and-methods

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: nouns-and-methods
    title:
      en: Nouns in the path, verbs as methods
      ru: Существительные в пути, глаголы — методы
    file: 01-nouns-and-methods.java
    explanation:
      en: >
        The whole answer in one screen. Two URLs name the two things this API
        talks about — the collection and one employee in it — and the five
        operations are five methods on those two URLs. Nothing in the path says
        what is being done.
      ru: >
        Весь ответ на одном экране. Два URL называют две вещи, о которых говорит
        этот API, — коллекцию и одного сотрудника в ней, — а пять операций
        оказываются пятью методами по этим двум URL. Ничто в пути не говорит, что
        именно делается.
  - id: verbs-in-the-path
    title:
      en: 'Verbs in the path (the trap)'
      ru: 'Глаголы в пути (ловушка)'
    file: 02-verbs-in-the-path.java
    explanation:
      en: >
        The same API named as remote procedure calls. Every operation invents its
        own URL, so there is nothing to guess: a client that knows how to read an
        employee learns nothing about how to delete one. Watch the surface grow
        one name per action.
      ru: >
        Тот же API, названный как набор удалённых вызовов процедур. Каждая
        операция изобретает собственный URL, поэтому угадать нельзя ничего:
        клиент, который умеет прочитать сотрудника, ничего не узнаёт о том, как
        его удалить. Смотрите, как поверхность растёт по имени на действие.
  - id: rename-to-resources
    title:
      en: Move the verb into the method
      ru: Перенеси глагол в метод
    file: 03-rename-to-resources.java
    explanation:
      en: >
        The mechanical fix. Split each name into "what" and "to which thing",
        keep the thing in the path and hand the what to the method — and the six
        URLs collapse onto two that answer five methods between them.
      ru: >
        Механическое исправление. Раздели каждое имя на «что» и «с какой вещью»,
        оставь вещь в пути, а «что» отдай методу — и шесть URL схлопываются в
        два, отвечающих на пять методов.
  - id: one-url-many-methods
    title:
      en: '404 vs 405'
      ru: '404 против 405'
    file: 04-one-url-many-methods.java
    explanation:
      en: >
        Why the split is worth anything. Because the URL names a thing and the
        method names an action, the server can say "that thing does not exist"
        (404) and "it exists, but it does not do that" (405) as two different
        answers. An RPC surface only ever has one of them.
      ru: >
        Зачем вообще это разделение. Раз URL называет вещь, а метод — действие,
        сервер может дать два разных ответа: «такой вещи нет» (404) и «она есть,
        но так с ней нельзя» (405). У RPC-поверхности есть только первый.
  - id: filters-in-the-query
    title:
      en: Filters belong in the query string
      ru: Фильтрам место в query string
    file: 05-filters-in-the-query.java
    explanation:
      en: >
        A filtered list is not a new resource — it is the same collection, seen
        through a window. Put the window in the query string and one URL serves
        every combination; put it in the path and each combination needs a URL of
        its own.
      ru: >
        Отфильтрованный список — не новый ресурс, а та же коллекция, увиденная
        через окно. Помести окно в query string — и один URL обслужит любые
        комбинации; помести его в путь — и каждой комбинации понадобится
        собственный URL.
  - id: get-that-deletes
    title:
      en: 'A GET that deletes'
      ru: 'GET, который удаляет'
    file: 06-a-get-that-deletes.java
    explanation:
      en: >
        The naming mistake that becomes an outage. GET is defined as safe, so
        browsers prefetch it, crawlers follow it and clients retry it — and this
        URL deletes a row. The fix is not a better word in the path; it is the
        right method on the item itself.
      ru: >
        Ошибка именования, которая превращается в аварию. GET по определению
        безопасен, поэтому браузеры его предзагружают, краулеры по нему ходят, а
        клиенты его повторяют — а этот URL удаляет строку. Исправление — не
        слово поудачнее в пути, а правильный метод по самому элементу.
  - id: spelling-and-nesting
    title:
      en: Spelling and nesting
      ru: Написание и вложенность
    file: 07-spelling-and-nesting.java
    explanation:
      en: >
        The small rules, all at once: paths are case-sensitive, a collection is
        spelled one way, the format is a header and not a file extension, and a
        trailing slash makes a second URL. Plus the nesting question — how many
        ids deep before an item deserves its own address.
      ru: >
        Мелкие правила разом: пути чувствительны к регистру, коллекция пишется
        одним способом, формат — это заголовок, а не расширение файла, а
        завершающий слэш создаёт второй URL. И вопрос вложенности: на скольких id
        элемент заслуживает собственного адреса.

