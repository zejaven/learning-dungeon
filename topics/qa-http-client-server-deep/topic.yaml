summary: >
  Углублённые вопросы собеседований по HTTP и клиент-серверной архитектуре:
  кто может выступать в роли клиента, разница между HTTP и HTTPS, состав
  HTTP-запроса и ответа по частям, как браузер узнаёт, куда отправить запрос
  (DNS), как сервер узнаёт устройство, браузер, ОС и язык клиента (User-Agent
  и другие заголовки), зачем тестировать API, передача параметров в GET через
  «?» и «&» и вопрос про тело в GET-запросе, эталонный список негативных
  сценариев для POST, создающего пользователя, и задача на определение
  валидного JSON.

assistantExample: 'например: Как браузер узнаёт, куда отправить запрос, если вы ввели только доменное имя?'

