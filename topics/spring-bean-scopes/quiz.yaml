# Theory topic: no missions because there is no practice editor.
bossFight:
  - id: list-core-scopes
    en: 'Which bean scopes does Spring provide, and which ones are web-specific?'
    ru: 'Какие скоупы бинов предоставляет Spring и какие из них относятся к web-приложениям?'
  - id: singleton-meaning
    en: 'What does singleton mean in Spring, and how is it different from the GoF Singleton pattern?'
    ru: 'Что означает singleton в Spring и чем он отличается от паттерна Singleton из GoF?'
  - id: prototype-lifecycle
    en: 'How does prototype scope change instance creation and lifecycle ownership?'
    ru: 'Как scope prototype меняет создание экземпляров и владение их жизненным циклом?'
  - id: scoped-bean-in-singleton
    en: 'What happens when a request-scoped or prototype bean is injected directly into a singleton?'
    ru: 'Что происходит, когда request-scoped или prototype-бин напрямую внедряют в singleton?'
  - id: scoped-proxy-provider
    en: 'How do scoped proxies and ObjectProvider solve shorter-lived bean injection?'
    ru: 'Как scoped proxies и ObjectProvider решают внедрение бинов с более коротким сроком жизни?'
  - id: web-scope-differences
    en: 'Compare request, session, application, and websocket scopes.'
    ru: 'Сравните скоупы request, session, application и websocket.'
  - id: singleton-thread-safety
    en: 'Does singleton scope make a bean thread-safe? Explain the trap.'
    ru: 'Делает ли scope singleton бин потокобезопасным? Объясните ловушку.'
  - id: choosing-scope
    en: 'How would you choose a scope for a service, helper object, shopping cart, or per-request context?'
    ru: 'Как выбрать scope для сервиса, вспомогательного объекта, корзины покупок или контекста одного запроса?'
