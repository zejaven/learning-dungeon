# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: core-difference
    en: What is the core architectural difference between Kafka and RabbitMQ?
    ru: В чём основное архитектурное различие между Kafka и RabbitMQ?
  - id: push-vs-pull
    en: How does message delivery differ — who decides when a consumer gets a message?
    ru: Чем отличается доставка сообщений — кто решает, когда потребитель получит сообщение?
  - id: retention-replay
    en: What happens to a message after it is consumed in each system, and can it be re-read?
    ru: Что происходит с сообщением после получения в каждой системе и можно ли перечитать его?
  - id: ordering
    en: What ordering guarantees does each system give, and what is the role of a Kafka partition?
    ru: Какие гарантии порядка даёт каждая система и какова роль партиции в Kafka?
  - id: routing
    en: How does RabbitMQ routing (exchanges, bindings) compare to Kafka topics and partitions?
    ru: Чем маршрутизация в RabbitMQ (exchange, binding) отличается от топиков и партиций в Kafka?
  - id: scaling-consumers
    en: How does each system scale out consumers for higher throughput?
    ru: Как каждая система масштабирует потребителей для повышения пропускной способности?
  - id: when-to-use
    en: Give a concrete use case where you would pick Kafka, and one where you would pick RabbitMQ.
    ru: Приведите конкретный сценарий, где вы выбрали бы Kafka, и где — RabbitMQ.
  - id: delivery-semantics
    en: What delivery semantics (at-most-once / at-least-once / exactly-once) can each provide?
    ru: Какие семантики доставки (at-most-once / at-least-once / exactly-once) обеспечивает каждая?
