summary:
  en: >
    CI/CD is one automated path from a commit to running software, and "what
    variants exist" is a choice on several independent axes. How far the
    automation goes: CI only, continuous delivery with a human gate before
    production, or continuous deployment with no gate at all. What starts a run:
    a push, a merge request, a tag, a schedule, a manual click, or a finished
    upstream build. The shape of the pipeline: one long build, or a chain of
    small configurations that fan out into parallel tests and fan back in — which
    is exactly what TeamCity models with snapshot and artifact dependencies. How
    the deploy is driven: the pipeline pushing with kubectl or Helm, or a GitOps
    agent pulling the desired state from Git. And how the new version reaches
    users: recreate, rolling, blue-green, or canary. Underneath all of it sit two
    invariants — build the artifact once and promote the same bytes through every
    environment, and keep the pipeline definition in the repository as code.
  ru: >
    CI/CD — это один автоматизированный путь от коммита до работающего софта, и
    вопрос «какие есть варианты» распадается на несколько независимых осей. До
    какого предела доведена автоматизация: только CI, continuous delivery с
    ручным подтверждением перед production или continuous deployment вообще без
    подтверждения. Что запускает прогон: push, merge request, тег, расписание,
    ручной запуск или завершившаяся вышестоящая сборка. Форма пайплайна: одна
    длинная сборка или цепочка небольших конфигураций, которая расходится в
    параллельные тесты и снова сходится, — именно это TeamCity описывает
    snapshot- и artifact-зависимостями. Как выполняется деплой: пайплайн сам
    push-ит через kubectl или Helm, либо GitOps-агент забирает желаемое состояние
    из Git. И как новая версия доезжает до пользователей: recreate, rolling,
    blue-green или canary. Под всем этим лежат два инварианта — собрать артефакт
    один раз и продвигать одни и те же байты по всем окружениям, а описание
    пайплайна хранить в репозитории как код.

