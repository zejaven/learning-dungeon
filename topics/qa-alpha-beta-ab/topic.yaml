summary:
  en: >
    Three practices that interviewers love to mix up: alpha testing inside the
    company on early builds, beta testing with real users outside the company,
    and A/B testing as a product experiment (the classic button-color vs
    conversion example). Where each sits in the release lifecycle, who performs
    it, and why A/B tests measure user behaviour rather than hunt for bugs.
  ru: >
    Три практики, которые интервьюеры любят путать: альфа-тестирование внутри
    компании на ранних сборках, бета-тестирование на реальных пользователях
    вне компании и A/B-тестирование как продуктовый эксперимент (классический
    пример про цвет кнопки и конверсию). Где каждая находится в жизненном
    цикле релиза, кто её выполняет и почему A/B-тесты измеряют поведение
    пользователей, а не ищут баги.

assistantExample:
