# SQL missions compare the user's result to each reference query. Rows are
# compared as a multiset; columns are compared by position.
missions:
  - id: inner-join-employees-departments
    type: sql
    title:
      en: Match employees to departments
      ru: Сопоставь сотрудников с отделами
    goal:
      en: Return only employees that have a matching department (employee_name, department_name).
      ru: Верни только сотрудников, у которых есть совпадающий отдел (employee_name, department_name).
    requires:
      - kind: sqlResult
        expectedSql: >
          SELECT e.name, d.name
          FROM employees e
          JOIN departments d ON d.id = e.department_id
  - id: left-join-all-employees
    type: sql
    title:
      en: Keep all employees
      ru: Сохрани всех сотрудников
    goal:
      en: Return every employee and the department name when it exists (employee_name, department_name).
      ru: Верни каждого сотрудника и название отдела, если оно существует (employee_name, department_name).
    requires:
      - kind: sqlResult
        expectedSql: >
          SELECT e.name, d.name
          FROM employees e
          LEFT JOIN departments d ON d.id = e.department_id
  - id: anti-join-empty-departments
    type: sql
    title:
      en: Find empty departments
      ru: Найди пустые отделы
    goal:
      en: Return department names that have no employees (department_name).
      ru: Верни названия отделов, в которых нет сотрудников (department_name).
    requires:
      - kind: sqlResult
        expectedSql: >
          SELECT d.name
          FROM departments d
          LEFT JOIN employees e ON e.department_id = d.id
          WHERE e.id IS NULL
  - id: self-join-mentors
    type: sql
    title:
      en: Show mentors
      ru: Покажи наставников
    goal:
      en: Return employees that have a mentor and the mentor's name (employee_name, mentor_name).
      ru: Верни сотрудников, у которых есть наставник, и имя наставника (employee_name, mentor_name).
    requires:
      - kind: sqlResult
        expectedSql: >
          SELECT e.name, m.name
          FROM employees e
          JOIN employees m ON m.id = e.mentor_id
  - id: cross-join-shift-options
    type: sql
    title:
      en: Build shift options
      ru: Собери варианты смен
    goal:
      en: Return every combination of Anna or Boris with each shift template (employee_name, shift_name).
      ru: Верни каждую комбинацию Anna или Boris с каждым шаблоном смены (employee_name, shift_name).
    requires:
      - kind: sqlResult
        expectedSql: >
          SELECT e.name, s.name
          FROM employees e
          CROSS JOIN shift_templates s
          WHERE e.name IN ('Anna', 'Boris')

bossFight:
  - id: define-join
    en: What does JOIN do in SQL, and what is usually written in the ON condition?
    ru: Что делает JOIN в SQL и что обычно пишут в условии ON?
  - id: inner-vs-left
    en: What is the difference between INNER JOIN and LEFT JOIN?
    ru: В чём разница между INNER JOIN и LEFT JOIN?
  - id: right-join-use
    en: How is RIGHT JOIN related to LEFT JOIN, and why do many teams avoid RIGHT JOIN?
    ru: Как RIGHT JOIN связан с LEFT JOIN и почему многие команды избегают RIGHT JOIN?
  - id: full-outer-join
    en: What rows does FULL OUTER JOIN return?
    ru: Какие строки возвращает FULL OUTER JOIN?
  - id: where-after-left-join
    en: Why can a WHERE condition on the right table accidentally turn a LEFT JOIN into an INNER JOIN?
    ru: Почему условие WHERE по правой таблице может случайно превратить LEFT JOIN в INNER JOIN?
  - id: cross-and-self
    en: When would you use CROSS JOIN or SELF JOIN?
    ru: Когда стоит использовать CROSS JOIN или SELF JOIN?
