# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: array-access
    title:
      en: Index into an ArrayList
      ru: Доступ по индексу в ArrayList
    goal:
      en: Run the ArrayList access example and read an element with get(i) — O(1).
      ru: Запусти пример доступа к ArrayList и прочитай элемент через get(i) — O(1).
    event: ARRAYLIST_GET
  - id: array-grow
    title:
      en: Trigger a grow & copy
      ru: Вызови рост и копирование
    goal:
      en: Add enough elements to fill the backing array so ArrayList reallocates.
      ru: Добавь столько элементов, чтобы массив заполнился и ArrayList пересоздал его.
    event: ARRAYLIST_GROW
  - id: array-shift
    title:
      en: Shift elements on insert
      ru: Сдвинь элементы при вставке
    goal:
      en: Insert at the front with add(0, x) and watch every element shift right.
      ru: Вставь в начало через add(0, x) и посмотри, как все элементы сдвигаются вправо.
    event: ARRAYLIST_INSERT
  - id: linked-ends
    title:
      en: Add at a LinkedList end
      ru: Добавь по краю LinkedList
    goal:
      en: Use addFirst or addLast to add in O(1) without walking the chain.
      ru: Используй addFirst или addLast, чтобы добавить за O(1) без обхода цепочки.
    event: LINKEDLIST_ADD
  - id: linked-walk
    title:
      en: Walk to an index
      ru: Дойди до индекса обходом
    goal:
      en: Call get(i) on a LinkedList and count the hops it takes — O(n).
      ru: Вызови get(i) у LinkedList и посчитай, сколько шагов он делает — O(n).
    event: LINKEDLIST_GET

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  en:
    - What is the fundamental difference between ArrayList and LinkedList internally?
    - Why is ArrayList.get(i) O(1) but LinkedList.get(i) O(n)?
    - What happens when an ArrayList's backing array fills up?
    - Why is ArrayList append only *amortised* O(1)?
    - When is LinkedList actually faster than ArrayList, and why is it still rarely used?
    - How does LinkedList.get(i) decide which end to walk from?
  ru:
    - В чём принципиальная разница между ArrayList и LinkedList внутри?
    - Почему ArrayList.get(i) — это O(1), а LinkedList.get(i) — O(n)?
    - Что происходит, когда внутренний массив ArrayList заполняется?
    - Почему добавление в ArrayList — лишь *амортизированный* O(1)?
    - Когда LinkedList реально быстрее ArrayList и почему его всё равно редко используют?
    - Как LinkedList.get(i) решает, с какого конца идти?
