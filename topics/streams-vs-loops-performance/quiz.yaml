missions:
  - id: loop-baseline
    title:
      en: Run the loop baseline
      ru: Запусти базовый цикл
    goal:
      en: Run an example where a plain loop visits source elements directly.
      ru: Запусти пример, где обычный цикл напрямую проходит по элементам источника.
    event: LOOP_ITERATION
  - id: lazy-pipeline
    title:
      en: See stream laziness
      ru: Увидь laziness у Stream
    goal:
      en: Declare a Stream pipeline and observe that work starts only after a terminal operation.
      ru: Объяви Stream pipeline и посмотри, что работа начинается только после terminal operation.
    event: STREAM_PIPELINE_DECLARED
  - id: intermediate-stage
    title:
      en: Trigger an intermediate stage
      ru: Запусти intermediate stage
    goal:
      en: Produce a filter event inside a sequential Stream pipeline.
      ru: Получи событие filter внутри sequential Stream pipeline.
    event: STREAM_FILTER
  - id: boxing-cost
    title:
      en: Notice boxing
      ru: Заметь boxing
    goal:
      en: Run the boxed numeric stream and produce a boxing/unboxing event.
      ru: Запусти boxed числовой stream и получи событие boxing/unboxing.
    event: STREAM_BOXING
  - id: parallel-split
    title:
      en: Split parallel-style work
      ru: Раздели parallel-style работу
    goal:
      en: Run the parallel overhead example and observe input split before merge.
      ru: Запусти пример overhead parallel stream и увидь разделение входа перед merge.
    event: PARALLEL_SPLIT
bossFight:
  - id: streams-faster-default
    en: Are Java Streams automatically faster than ordinary loops? Explain the usual tradeoff.
    ru: Java Streams автоматически быстрее обычных циклов? Объясни типичный компромисс.
  - id: stream-overhead-sources
    en: What overhead can a sequential Stream pipeline add compared with a simple loop?
    ru: Какой overhead может добавить sequential Stream pipeline по сравнению с простым циклом?
  - id: primitive-streams
    en: Why can IntStream be a better fit than Stream<Integer> for hot numeric code?
    ru: Почему IntStream может быть лучше Stream<Integer> для горячего числового кода?
  - id: laziness-short-circuit
    en: When can Stream laziness or short-circuiting make less work happen?
    ru: Когда laziness или short-circuiting у Stream позволяют выполнить меньше работы?
  - id: parallel-stream-decision
    en: When might a parallel stream help, and when can it make performance worse?
    ru: Когда parallel stream может помочь, а когда способен ухудшить производительность?
  - id: measuring-performance
    en: How would you fairly measure loops versus Streams in Java?
    ru: Как честно измерить производительность циклов и Streams в Java?
