# Theory topic: no missions, only Boss Fight questions.
bossFight:
  - id: core-difference
    en: What is the difference between HTTP and HTTPS?
    ru: В чём отличие HTTP от HTTPS?
  - id: what-tls-adds
    en: Which three guarantees does TLS add on top of HTTP, and which of them makes the other two worth anything?
    ru: Какие три гарантии TLS добавляет поверх HTTP и какая из них делает две другие осмысленными?
  - id: handshake-steps
    en: Walk through what happens between the TCP connection and the first encrypted HTTP request.
    ru: Опиши, что происходит между установкой TCP-соединения и первым зашифрованным HTTP-запросом.
  - id: what-is-encrypted
    en: In an HTTPS request, what exactly is encrypted - is the URL path and query string included?
    ru: Что именно зашифровано в HTTPS-запросе — входят ли туда путь URL и query-строка?
  - id: what-stays-visible
    en: What can someone sniffing the network still learn about your HTTPS traffic?
    ru: Что человек, слушающий сеть, всё равно узнает о вашем HTTPS-трафике?
  - id: secrets-in-url
    en: 'The URL is encrypted in transit, so is it safe to pass an API token as a query parameter over HTTPS?'
    ru: 'URL шифруется при передаче — значит, можно передавать API-токен в query-параметре по HTTPS?'
  - id: certificate-validation
    en: What does the browser check about a certificate, and what happens when one of those checks fails?
    ru: Что браузер проверяет в сертификате и что происходит, если одна из проверок не проходит?
  - id: self-signed
    en: Is a self-signed certificate as secure as a CA-signed one? Which guarantee do you lose?
    ru: Самоподписанный сертификат так же безопасен, как подписанный CA? Какую гарантию вы теряете?
  - id: padlock-meaning
    en: A phishing site shows a valid padlock in the address bar. How is that possible, and what does the padlock actually promise?
    ru: Фишинговый сайт показывает валидный замочек в адресной строке. Как такое возможно и что замочек на самом деле обещает?
  - id: tls-termination
    en: Where does TLS usually terminate in a production deployment, and what does that mean for the traffic behind it?
    ru: Где обычно терминируется TLS в продакшене и что это означает для трафика за этой точкой?
  - id: forwarded-proto
    en: Your Spring Boot app behind a load balancer generates 'http://' redirect URLs on an HTTPS site. Why, and how do you fix it?
    ru: 'Spring Boot приложение за балансировщиком генерирует редиректы на http:// на HTTPS-сайте. Почему и как это исправить?'
  - id: ssl-vs-tls
    en: People say 'SSL certificate' and 'SSL/TLS' interchangeably. What is the actual relationship between SSL and TLS today?
    ru: 'Говорят и «SSL-сертификат», и «SSL/TLS». Какова реальная связь между SSL и TLS сегодня?'
  - id: performance-cost
    en: What does HTTPS actually cost in performance, and how do you reduce it?
    ru: Во что HTTPS реально обходится по производительности и как это уменьшить?
  - id: https-and-app-security
    en: Does HTTPS protect you from XSS, CSRF or SQL injection? Explain why or why not.
    ru: Защищает ли HTTPS от XSS, CSRF или SQL-инъекций? Объясни почему.
  - id: redirect-and-hsts
    en: A site redirects http to https with a 301. What attack is still possible, and what closes the gap?
    ru: Сайт редиректит http на https через 301. Какая атака всё ещё возможна и что закрывает эту щель?
  - id: mixed-content
    en: What is mixed content, and why do browsers block it instead of just warning?
    ru: Что такое mixed content и почему браузеры его блокируют, а не просто предупреждают?
  - id: secure-cookie-flag
    en: If the whole site is HTTPS, is the Secure cookie flag still needed?
    ru: Если весь сайт на HTTPS, нужен ли ещё флаг Secure у куки?
  - id: scheme-and-origin
    en: Are 'http://example.com' and 'https://example.com' the same origin? What does that imply during a migration?
    ru: 'Являются ли http://example.com и https://example.com одним origin? Что это означает при миграции?'
  - id: internal-service-traffic
    en: Should service-to-service calls inside your network also use TLS? What are the options and trade-offs?
    ru: Должны ли вызовы между сервисами внутри сети тоже идти по TLS? Какие есть варианты и компромиссы?
  - id: cert-expiry-operations
    en: What operational risks come with running HTTPS, and how do you manage them?
    ru: Какие эксплуатационные риски появляются при работе по HTTPS и как ими управлять?
