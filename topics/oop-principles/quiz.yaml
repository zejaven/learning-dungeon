# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: name-the-four
    en: What are the four principles of OOP, and what does each one mean?
    ru: Какие четыре принципа ООП и что означает каждый из них?
  - id: encapsulation-purpose
    en: What problem does encapsulation solve, beyond just writing getters and setters?
    ru: Какую проблему решает инкапсуляция, помимо простого написания геттеров и сеттеров?
  - id: abstraction-vs-encapsulation
    en: How is abstraction different from encapsulation?
    ru: Чем абстракция отличается от инкапсуляции?
  - id: inheritance-vs-composition
    en: When should you use inheritance, and when is composition the better choice?
    ru: Когда стоит использовать наследование, а когда лучше композиция?
  - id: polymorphism-kinds
    en: What is the difference between runtime and compile-time polymorphism in Java?
    ru: В чём разница между полиморфизмом времени выполнения и времени компиляции в Java?
  - id: principles-together
    en: How do the four OOP principles work together in a single design?
    ru: Как четыре принципа ООП работают вместе в одном дизайне?
