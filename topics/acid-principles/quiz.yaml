# Theory topic: no missions, only a Boss Fight.
bossFight:
  - id: define-acid
    en: What does ACID stand for, and what problem does it solve?
    ru: Что означает ACID и какую проблему он решает?
  - id: atomicity-rollback
    en: Explain Atomicity using a transaction that updates two records.
    ru: Объясните Atomicity на примере транзакции, которая обновляет две записи.
  - id: consistency-invariants
    en: What does Consistency mean, and how is it different from business correctness?
    ru: Что означает Consistency и чем она отличается от бизнес-корректности?
  - id: isolation-concurrency
    en: What can go wrong when two transactions run without enough Isolation?
    ru: Что может пойти не так, если две транзакции выполняются без достаточной Isolation?
  - id: durability-after-commit
    en: What does Durability promise after COMMIT returns successfully?
    ru: Что обещает Durability после успешного возврата COMMIT?
  - id: acid-limits
    en: Does ACID automatically make a distributed workflow reliable? Explain the limitation.
    ru: Делает ли ACID распределенный workflow надежным автоматически? Объясните ограничение.
