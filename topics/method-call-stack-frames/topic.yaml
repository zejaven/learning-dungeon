id: method-call-stack-frames
title:
  en: Method Calls and Stack Frames
  ru: Вызовы методов и кадры стека
category:
  en: JVM / Memory & GC
  ru: JVM / Память и GC
type: JVM_MEMORY
mode: trace
aiProvider: codex
aiModel: gpt-5.5
categoryId: memory-gc
difficulty: 1
catalogId: memory-gc-1
style: Real world
summary:
  en: >
    What happens to local variables when one Java method calls another: the same
    thread keeps one call stack, each call pushes a new stack frame, and that
    frame holds the callee's parameters and local variables until the method
    returns.
  ru: >
    Что происходит с локальными переменными, когда один Java-метод вызывает
    другой: у того же потока остаётся один стек вызовов, каждый вызов добавляет
    новый кадр стека, и этот кадр хранит параметры и локальные переменные
    вызванного метода до его возврата.

primitives:
  - ArrayGrid
  - EventLog

defaultExample: same-thread-frame

examples:
  - id: same-thread-frame
    title:
      en: Same stack, new frame
      ru: Тот же стек, новый кадр
    file: 01-same-thread-frame.java
    explanation:
      en: >
        main() calls validateOrder(). The callee's parameters and locals appear
        in a new frame above main(), not in a separate stack.
      ru: >
        main() вызывает validateOrder(). Параметры и локальные переменные
        вызванного метода появляются в новом кадре над main(), а не в отдельном
        стеке.
  - id: nested-calls
    title:
      en: Nested method calls
      ru: Вложенные вызовы методов
    file: 02-nested-calls.java
    explanation:
      en: >
        controller() calls service(), then service() calls repository(). Each
        call pushes one more frame on the same thread's call stack.
      ru: >
        controller() вызывает service(), затем service() вызывает repository().
        Каждый вызов добавляет ещё один кадр в стек вызовов того же потока.
  - id: callee-locals
    title:
      en: Callee locals are separate
      ru: Локальные переменные метода отдельны
    file: 03-callee-locals.java
    explanation:
      en: >
        The caller and callee have their own local slots. Updating a local
        variable inside applyDiscount() changes that frame only.
      ru: >
        У вызывающего и вызванного методов свои локальные слоты. Изменение
        локальной переменной внутри applyDiscount() затрагивает только этот кадр.
  - id: return-removes-frame
    title:
      en: Return pops the frame
      ru: return снимает кадр
    file: 04-return-removes-frame.java
    explanation:
      en: >
        When parsePayload() returns, its frame disappears. Any object that is no
        longer reachable from another frame becomes garbage.
      ru: >
        Когда parsePayload() возвращается, его кадр исчезает. Объект, который
        больше не достижим из другого кадра, становится мусором.
  - id: heap-object-shared
    title:
      en: Stack frames can share heap objects
      ru: Кадры могут делить объекты в heap
    file: 05-heap-object-shared.java
    explanation:
      en: >
        A callee frame gets its own parameter slot, but that slot can hold a copy
        of a reference to the same heap object the caller uses.
      ru: >
        Кадр вызванного метода получает свой слот параметра, но в этом слоте
        может лежать копия ссылки на тот же heap-объект, который использует
        вызывающий метод.

assistantExample:
  en: 'e.g. When one method calls another, do the callee''s variables go into the same stack or another one?'
  ru: 'например: При вызове одного метода из другого переменные нового метода попадут в тот же стек или в другой?'

