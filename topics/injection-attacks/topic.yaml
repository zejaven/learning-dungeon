id: injection-attacks
title:
  en: 'Injection Attacks: SQL Injection and XXE'
  ru: 'Инъекции: SQL Injection и XXE'
category:
  en: Security & Authentication
  ru: Безопасность и аутентификация
type: SQL
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: security
difficulty: 2
catalogId: security-9
summary:
  en: >
    An injection is what happens when a string somebody else typed is pasted
    into a language an interpreter is about to parse: the parser cannot tell
    your instructions from their data, so it obeys both. SQL injection rewrites
    the statement — a quote closes the literal, a comment deletes the
    'AND active = TRUE' guard, a UNION adds a table nobody mentioned; XXE is the
    same bug in an XML parser, where the document declares an entity and the
    parser reads a file or calls an internal address on the attacker's behalf.
    A prepared statement fixes SQL injection for one structural reason: the SQL
    text is parsed before the value exists, and the value travels beside the
    statement rather than inside it, so it can never become grammar. It stops
    helping wherever that is not true — an identifier that cannot be a
    placeholder (ORDER BY, table names), a 'prepared' statement whose text was
    concatenated first, a value bound on write and concatenated on read, and
    dynamic SQL built inside a stored procedure. And it does nothing at all for
    XXE, command or LDAP injection, which need their own parser turned down.
  ru: >
    Инъекция — это то, что происходит, когда строку, напечатанную посторонним,
    подставляют в язык, который вот-вот разберёт интерпретатор: парсер не
    отличает ваши инструкции от их данных и подчиняется и тем и другим. SQL
    injection переписывает запрос — кавычка закрывает литерал, комментарий
    удаляет проверку 'AND active = TRUE', UNION добавляет таблицу, которую
    никто не упоминал; XXE — та же ошибка в XML-парсере, где документ объявляет
    сущность, а парсер по поручению злоумышленника читает файл или обращается
    на внутренний адрес. Prepared statement чинит SQL injection по одной
    структурной причине: текст SQL разбирается до того, как появится значение,
    а само значение едет рядом с запросом, а не внутри него, и потому никогда
    не может стать грамматикой. Помогать он перестаёт там, где это не так: для
    идентификатора, который не может быть плейсхолдером (ORDER BY, имена
    таблиц), для «подготовленного» запроса, текст которого сначала
    сконкатенировали, для значения, привязанного при записи и
    сконкатенированного при чтении, и для динамического SQL внутри хранимой
    процедуры. А против XXE, командной и LDAP-инъекции он не делает вообще
    ничего — там нужно настраивать их собственный парсер.

