id: treeset
title:
  en: 'TreeSet: Sorted Unique Set'
  ru: 'TreeSet: отсортированное множество'
category:
  en: 'Java Core / Collections'
  ru: 'Java Core / Коллекции'
type: DATA_STRUCTURE
mode: trace
aiProvider: codex
aiModel: gpt-5.5
summary:
  en: >
    TreeSet stores unique elements in sorted order, uses natural ordering or a
    Comparator, supports nearest-neighbor and range queries through NavigableSet,
    and treats compareTo()/Comparator result 0 as a duplicate.
  ru: >
    TreeSet хранит уникальные элементы в отсортированном порядке, использует
    natural ordering или Comparator, поддерживает запросы ближайших элементов и
    диапазонов через NavigableSet и считает дубликатом результат
    compareTo()/Comparator, равный 0.
categoryId: java-collections
difficulty: 1
catalogId: java-collections-5
style: Real world
primitives:
  - ArrayGrid
defaultExample: sorted-order
examples:
  - id: sorted-order
    title:
      en: 'Sorted iteration'
      ru: 'Отсортированная итерация'
    file: 01-sorted-order.java
    explanation:
      en: 'Values are added in random order, but TreeSet iterates them in sorted order.'
      ru: 'Значения добавляются в случайном порядке, но TreeSet итерируется по ним в отсортированном порядке.'
  - id: duplicate-natural
    title:
      en: 'Duplicate by natural order'
      ru: 'Дубликат по natural order'
    file: 02-duplicate-natural.java
    explanation:
      en: 'Adding the same value twice keeps one element because comparison returns 0.'
      ru: 'Повторное добавление того же значения оставляет один элемент, потому что сравнение возвращает 0.'
  - id: comparator-uniqueness
    title:
      en: 'Comparator defines uniqueness'
      ru: 'Comparator задаёт уникальность'
    file: 03-comparator-uniqueness.java
    explanation:
      en: 'A Comparator by length treats two different strings of the same length as one set element.'
      ru: 'Comparator по длине считает две разные строки одинаковой длины одним элементом множества.'
  - id: navigable-queries
    title:
      en: 'Nearest values'
      ru: 'Ближайшие значения'
    file: 04-navigable-queries.java
    explanation:
      en: 'NavigableSet methods lower(), ceiling(), and higher() find neighbors without scanning the whole set.'
      ru: 'Методы NavigableSet lower(), ceiling() и higher() находят соседей без полного прохода по множеству.'
  - id: range-slice
    title:
      en: 'Range query'
      ru: 'Запрос диапазона'
    file: 05-range-slice.java
    explanation:
      en: 'A sorted set can return a bounded range in order, which is the idea behind subSet(), headSet(), and tailSet().'
      ru: 'Отсортированное множество может вернуть ограниченный диапазон по порядку; на этом основаны subSet(), headSet() и tailSet().'
assistantExample:
  en: 'e.g. Why can TreeSet ignore a value that is not equal() to an existing value?'
  ru: 'например: Почему TreeSet может проигнорировать значение, которое не equal() уже существующему?'
missionsFile: quiz.yaml
