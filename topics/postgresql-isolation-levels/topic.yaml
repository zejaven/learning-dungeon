summary:
  en: >
    PostgreSQL supports the standard isolation level names, but its MVCC
    implementation gives them PostgreSQL-specific behavior. Learn why
    READ UNCOMMITTED behaves like READ COMMITTED, what the default level sees,
    how REPEATABLE READ uses a transaction snapshot, and when SERIALIZABLE needs
    retry logic.
  ru: >
    PostgreSQL поддерживает стандартные названия уровней изоляции, но его MVCC
    дает им поведение со спецификой PostgreSQL. Разберись, почему
    READ UNCOMMITTED ведет себя как READ COMMITTED, что видит уровень по
    умолчанию, как REPEATABLE READ использует снимок транзакции и когда
    SERIALIZABLE требует логики повторной попытки.

