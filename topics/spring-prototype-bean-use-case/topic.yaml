summary:
  en: >
    When a Spring prototype bean is useful: short-lived, stateful helper objects
    created per operation, how singleton services should request a fresh instance,
    and why prototype scope is not a magic fix for request state or thread safety.
  ru: >
    Когда prototype-бин в Spring действительно полезен: короткоживущие stateful
    helper-объекты, создаваемые под одну операцию, как singleton-сервису получать
    свежий экземпляр и почему prototype scope не является магическим решением для
    request-state или потокобезопасности.

