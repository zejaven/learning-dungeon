summary:
  en: >
    Setting up communication between services is not one choice but a stack of
    independent ones: the interaction style, the transport and protocol (REST
    over HTTP, gRPC, GraphQL, WebSocket, AMQP, Kafka), the payload format and
    contract, how a service is addressed and discovered, where load balancing
    happens, where the reliability policy lives (client library, API gateway or
    service mesh sidecar), and the concrete timeouts, retries, circuit breakers,
    security and tracing settings. In Java this lands as RestClient, WebClient,
    Feign or declarative HTTP interfaces for synchronous calls and Spring AMQP,
    Spring for Apache Kafka or Spring Cloud Stream for messaging.
  ru: >
    Настройка взаимодействия между сервисами - это не один выбор, а набор
    независимых: стиль взаимодействия, транспорт и протокол (REST поверх HTTP,
    gRPC, GraphQL, WebSocket, AMQP, Kafka), формат данных и контракт, способ
    адресации и обнаружения сервиса, место балансировки нагрузки, место, где
    живёт политика надёжности (клиентская библиотека, API gateway или sidecar
    service mesh), и конкретные таймауты, повторы, circuit breaker, безопасность
    и трассировка. В Java это выражается в RestClient, WebClient, Feign или
    декларативных HTTP-интерфейсах для синхронных вызовов и Spring AMQP, Spring
    for Apache Kafka или Spring Cloud Stream для сообщений.

