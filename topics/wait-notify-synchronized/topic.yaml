id: wait-notify-synchronized
languages: [en, ru]
title:
  en: wait(), notify(), notifyAll() inside synchronized
  ru: wait(), notify(), notifyAll() внутри synchronized
category:
  en: Java Core / Concurrency
  ru: Java Core / Многопоточность
type: CONCURRENCY
mode: trace
summary:
  en: >
    How Java object monitors connect synchronized, wait(), notify() and
    notifyAll(), why wait() releases the monitor, why notify() does not release
    it immediately, and why waiting code must re-check the condition in a loop.
  ru: >
    Как object monitor в Java связывает synchronized, wait(), notify() и
    notifyAll(), почему wait() освобождает monitor, почему notify() не
    освобождает его сразу и почему ожидающий код должен заново проверять
    condition в цикле.
categoryId: concurrency
difficulty: 3
catalogId: concurrency-17
style: Real world
aiProvider: codex
aiModel: gpt-5.5

primitives:
  - ArrayGrid
  - LinkedNodes
  - EventLog

defaultExample: wait-releases-monitor

examples:
  - id: wait-releases-monitor
    title:
      en: wait() releases monitor
      ru: wait() освобождает monitor
    file: 01-wait-releases-monitor.java
    explanation:
      en: >
        A consumer enters synchronized, sees that the condition is false, calls
        wait(), and releases the monitor so a producer can enter.
      ru: >
        Consumer входит в synchronized, видит, что condition false, вызывает
        wait() и освобождает monitor, чтобы producer мог войти.
  - id: notify-keeps-monitor
    title:
      en: notify() keeps ownership
      ru: notify() сохраняет ownership
    file: 02-notify-keeps-monitor.java
    explanation:
      en: >
        notify() wakes one waiting thread, but the notifier still owns the
        monitor until it exits synchronized.
      ru: >
        notify() пробуждает один waiting thread, но notifier всё ещё владеет
        monitor, пока не выйдет из synchronized.
  - id: notify-all-waiters
    title:
      en: notifyAll() wakes all
      ru: notifyAll() будит всех
    file: 03-notify-all-waiters.java
    explanation:
      en: >
        Two consumers wait on the same monitor. notifyAll() moves both toward
        re-acquisition, but they still re-enter one at a time.
      ru: >
        Два consumer ждут на одном monitor. notifyAll() переводит обоих к
        повторному захвату, но входят они всё равно по одному.
  - id: while-not-if
    title:
      en: while, not if
      ru: while, не if
    file: 04-while-not-if.java
    explanation:
      en: >
        A spurious wakeup shows why code must re-check the guard condition after
        wait() returns.
      ru: >
        Spurious wakeup показывает, почему код должен заново проверить guard
        condition после возврата из wait().
  - id: notify-no-waiters
    title:
      en: notify() is not stored
      ru: notify() не сохраняется
    file: 05-notify-no-waiters.java
    explanation:
      en: >
        Calling notify() when nobody is waiting does not save a signal for a
        future waiter.
      ru: >
        Вызов notify(), когда никто не ждёт, не сохраняет сигнал для будущего
        waiter.
  - id: must-own-monitor
    title:
      en: Must own the monitor
      ru: Нужно владеть monitor
    file: 06-must-own-monitor.java
    explanation:
      en: >
        wait() and notify() only make sense while the current thread owns the
        same monitor through synchronized.
      ru: >
        wait() и notify() имеют смысл только когда текущий thread владеет тем же
        monitor через synchronized.

assistantExample:
  en: 'e.g. Does wait() release the monitor, and why does notify() not let the waiter run immediately?'
  ru: 'например: Освобождает ли wait() monitor и почему notify() не даёт waiter продолжить сразу?'

