# Theory topic: no missions because there is no practice editor.
bossFight:
  - id: configuration-purpose
    en: 'What does @Configuration mean in Spring?'
    ru: 'Что означает @Configuration в Spring?'
  - id: bean-outside-configuration
    en: 'Can @Bean methods be declared outside a @Configuration class?'
    ru: 'Можно ли объявлять @Bean-методы вне класса с @Configuration?'
  - id: full-vs-lite
    en: 'What is the difference between full @Configuration mode and lite @Bean mode?'
    ru: 'В чём разница между full @Configuration mode и lite @Bean mode?'
  - id: proxy-bean-methods
    en: 'Why does @Configuration(proxyBeanMethods = true) proxy calls between @Bean methods?'
    ru: 'Зачем @Configuration(proxyBeanMethods = true) проксирует вызовы между @Bean-методами?'
  - id: direct-call-trap
    en: 'What can go wrong when a @Bean method in a @Component directly calls another @Bean method?'
    ru: 'Что может пойти не так, если @Bean-метод в @Component напрямую вызывает другой @Bean-метод?'
  - id: parameter-dependencies
    en: 'Why are @Bean method parameters safer than direct calls between @Bean methods?'
    ru: 'Почему параметры @Bean-методов безопаснее, чем прямые вызовы между @Bean-методами?'
  - id: proxy-false-use-case
    en: 'When is @Configuration(proxyBeanMethods = false) a good choice?'
    ru: 'Когда @Configuration(proxyBeanMethods = false) будет хорошим выбором?'
