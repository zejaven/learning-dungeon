id: string-immutability
languages: [en, ru]
title:
  en: String Immutability
  ru: Иммутабельность строк
category:
  en: Java Core / Strings
  ru: Java Core / Строки
type: DATA_STRUCTURE
aiProvider: claude
summary:
  en: >
    Java strings are immutable: a String object never changes after creation.
    "Changing a character" does not edit the existing object — it allocates a
    brand-new String with a new backing array and re-points your variable. This
    topic visualizes the heap, the string pool, intern(), == vs equals, and the
    mutable StringBuilder contrast.
  ru: >
    Строки в Java иммутабельны: объект String не меняется после создания.
    «Поменять символ» не редактирует существующий объект — выделяется новая
    строка с новым внутренним массивом, а переменная переуказывается. Тема
    показывает кучу, пул строк, intern(), == против equals и контраст с
    изменяемым StringBuilder.

# Visual primitives this topic's visualizer composes (frontend).
primitives:
  - BoxGroup

categoryId: java-core
difficulty: 1
catalogId: java-core-1

defaultExample: immutability

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: immutability
    title:
      en: Strings are immutable
      ru: Строки иммутабельны
    file: 01-immutability.java
    explanation:
      en: >
        Concatenation looks like a mutation but allocates a brand-new String
        (with a new backing array) and re-points the variable. The original
        object is untouched.
      ru: >
        Конкатенация выглядит как изменение, но выделяет совершенно новую строку
        (с новым внутренним массивом) и переуказывает переменную. Исходный объект
        не меняется.
  - id: change-char
    title:
      en: Change a character
      ru: Поменять символ
    file: 02-change-char.java
    explanation:
      en: >
        replace() and toUpperCase() never edit the existing chars: each returns a
        NEW String. The old object stays in memory until the garbage collector
        reclaims it.
      ru: >
        replace() и toUpperCase() не редактируют существующие символы: каждый
        возвращает НОВУЮ строку. Старый объект остаётся в памяти, пока его не
        соберёт сборщик мусора.
  - id: string-pool
    title:
      en: String pool & ==
      ru: Пул строк и ==
    file: 03-string-pool.java
    explanation:
      en: >
        Equal literals share one pooled object, so == is true. new String("...")
        forces a separate object, so == is false while equals() is true.
      ru: >
        Одинаковые литералы делят один объект из пула, поэтому == истинно.
        new String("...") создаёт отдельный объект, поэтому == ложно, а equals()
        истинно.
  - id: intern
    title:
      en: intern() into the pool
      ru: intern() в пул
    file: 04-intern.java
    explanation:
      en: >
        intern() returns the canonical pooled instance for a string's content,
        so a runtime-built string can be made == to the matching literal.
      ru: >
        intern() возвращает канонический объект из пула для содержимого строки,
        поэтому собранную в рантайме строку можно сделать == соответствующему
        литералу.
  - id: stringbuilder
    title:
      en: StringBuilder mutates
      ru: StringBuilder меняется
    file: 05-stringbuilder.java
    explanation:
      en: >
        Unlike String, StringBuilder is mutable: append() changes the SAME object
        in place. That is why you build long strings in a loop with a builder, not
        with + concatenation.
      ru: >
        В отличие от String, StringBuilder изменяемый: append() меняет ТОТ ЖЕ
        объект на месте. Поэтому длинные строки в цикле собирают билдером, а не
        конкатенацией через +.

