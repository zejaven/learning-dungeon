# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: why-kibana-at-all
    en: 'You can already ssh into a server and grep the log file. Why does a team add Kibana?'
    ru: 'Вы и так можете зайти по ssh на сервер и сделать grep по файлу лога. Зачем команде Kibana?'
  - id: kibana-vs-elasticsearch
    en: What is the division of responsibility between Kibana, Elasticsearch and a collector like Filebeat?
    ru: Как распределяются обязанности между Kibana, Elasticsearch и коллектором вроде Filebeat?
  - id: log-path-to-kibana
    en: Trace one log line from a log.error() call in a container to a document you can find in Kibana.
    ru: Проследите путь одной строки от вызова log.error() в контейнере до документа, который вы находите в Kibana.
  - id: why-stdout-not-file
    en: Why should a containerized application write logs to stdout instead of its own file?
    ru: Почему контейнеризованное приложение должно писать логи в stdout, а не в собственный файл?
  - id: daemonset-collector
    en: How does a log collector in Kubernetes get logs from every pod, and what does it add to each line?
    ru: Как коллектор логов в Kubernetes получает логи со всех подов и что он добавляет к каждой строке?
  - id: structured-logging-value
    en: What does structured JSON logging give you that a plain text line does not, and what happens to a multiline stack trace?
    ru: Что даёт структурированное JSON-логирование по сравнению с обычной текстовой строкой и что происходит с многострочным стектрейсом?
  - id: correlation-id-across-services
    en: A request fails after passing through four services. How do you find all of its log lines?
    ru: Запрос упал, пройдя через четыре сервиса. Как найти все его строки в логах?
  - id: kubectl-logs-vs-kibana
    en: 'When would kubectl logs show you something Kibana does not, and when is it the other way around?'
    ru: 'Когда kubectl logs покажет то, чего нет в Kibana, и когда — наоборот?'
  - id: missing-logs-diagnosis
    en: A user reports an error at 14:03 but you find nothing in Kibana. What could have gone wrong, step by step?
    ru: Пользователь сообщает об ошибке в 14:03, но в Kibana ничего нет. Что могло пойти не так, по шагам?
  - id: logs-vs-metrics-vs-traces
    en: Which questions should you answer with logs, and which with metrics or traces?
    ru: На какие вопросы отвечают логи, а на какие — метрики или трейсы?
  - id: logging-cost-and-secrets
    en: What are the risks of logging too much, and what must never end up in a log line?
    ru: Чем рискует команда, логирующая слишком много, и что не должно попадать в строку лога никогда?
  - id: logs-not-source-of-truth
    en: Why is it a mistake to treat the log pipeline as a reliable delivery channel for business events?
    ru: Почему считать конвейер логов надёжным каналом доставки бизнес-событий — ошибка?
