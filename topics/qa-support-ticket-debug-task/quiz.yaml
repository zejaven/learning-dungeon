bossFight:
- id: task-statement
  ru: 'Веб-форма заявки: номер формата «две буквы + 5 цифр» автозаполняется сервисом генерации, вводится текст «Ничего не работает!», при сохранении приходит «Ошибка сохранения». С чего начнёте разбираться?'
- id: localization-chain
  ru: 'Опишите цепочку локализации проблемы: какие инструменты примените и в каком порядке, чтобы понять, на каком слое ошибка?'
- id: devtools-first
  ru: Что именно вы смотрите в панели разработчика браузера при нажатии «Сохранить» и какие выводы делаете из каждого варианта увиденного?
- id: sniffer-and-logs
  ru: Зачем нужен сниффер, если есть DevTools, и что ищете в логах сервера? Что даст дебаг бэкенда при наличии доступа к коду?
- id: failure-map-by-layers
  ru: 'Перечислите, где в этой связке могут быть баги — по слоям: данные, фронтенд, сеть, сервер, база данных.'
- id: generator-suspicion
  ru: Почему сервис генерации номеров — первый подозреваемый? Какие два конкретных дефекта он может посадить в номер заявки?
- id: cyrillic-cases
  ru: Как кириллица может сломать сохранение заявки и в номере, и в тексте? Как бы вы это проверили?
- id: infrastructure-causes
  ru: Какие инфраструктурные причины (база, сеть, нагрузка, таймауты) дают ту же ошибку «Ошибка сохранения» и как их отличить друг от друга?
- id: frontend-causes
  ru: 'Какие дефекты на фронтенде приводят к ошибке сохранения: что может быть не так с запросом, адресом или версией API?'
