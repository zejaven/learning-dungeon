bossFight:
- id: search-positive-first
  ru: Назовите первые позитивные проверки строки поиска на главной странице маркетплейса — с чего начнёте приёмочное тестирование?
  en: Назовите первые позитивные проверки строки поиска на главной странице маркетплейса — с чего начнёте приёмочное тестирование?
- id: search-by-substring
  ru: Что проверяет кейс "поиск по подстроке" и чем он отличается от поиска по полному названию товара?
  en: Что проверяет кейс "поиск по подстроке" и чем он отличается от поиска по полному названию товара?
- id: search-layout-and-language
  ru: Зачем проверять поиск на другом языке и в неправильной раскладке клавиатуры? Что ожидаете от системы в этих кейсах?
  en: Зачем проверять поиск на другом языке и в неправильной раскладке клавиатуры? Что ожидаете от системы в этих кейсах?
- id: search-submit-ways
  ru: Какими способами пользователь может запустить поиск и почему каждый из них нужно проверить отдельно?
  en: Какими способами пользователь может запустить поиск и почему каждый из них нужно проверить отдельно?
- id: search-negative-cases
  ru: 'Перечислите негативные кейсы для строки поиска: пустая строка, пробел, спецсимволы, очень длинная строка. Что проверяет каждый?'
  en: 'Перечислите негативные кейсы для строки поиска: пустая строка, пробел, спецсимволы, очень длинная строка. Что проверяет каждый?'
- id: search-sql-injection
  ru: Почему в список проверок поисковой строки входит SQL-инъекция и что именно вы проверяете таким кейсом?
  en: Почему в список проверок поисковой строки входит SQL-инъекция и что именно вы проверяете таким кейсом?
- id: search-page-code-change
  ru: Что за проверка "попытаться изменить код страницы" при тестировании поиска и какой класс дефектов она ловит?
  en: Что за проверка "попытаться изменить код страницы" при тестировании поиска и какой класс дефектов она ловит?
- id: search-positive-before-negative
  ru: Почему интервьюер просит сначала назвать позитивные кейсы и только потом негативные? Что он этим проверяет?
  en: Почему интервьюер просит сначала назвать позитивные кейсы и только потом негативные? Что он этим проверяет?
- id: search-desktop-vs-mobile
  ru: Чем отличается тестирование поисковой строки в десктопном вебе и в мобильном вебе?
  en: Чем отличается тестирование поисковой строки в десктопном вебе и в мобильном вебе?
