summary:
  en: >
    Turning a network design into functioning reality: "Big Bang" vs staged
    migration strategies, the staging lab with firmware standardisation and
    hardware burn-in, security hardening of the management/control/data
    planes, structured testing (DVT, migration, NRFU, UAT, conformance and
    interoperability), performance KPIs and failover validation, IaC and
    CI/CD automation, baselining, as-built documentation, and handover.
  ru: >
    Превращение сетевого дизайна в работающую реальность: стратегии миграции
    «Big Bang» и поэтапная, staging-лаборатория со стандартизацией прошивок и
    прогоном оборудования (burn-in), укрепление безопасности management/
    control/data plane, структурированное тестирование (DVT, миграция, NRFU,
    UAT, conformance и interoperability), KPI производительности и проверка
    failover, автоматизация IaC и CI/CD, базлайны, as-built документация и
    передача в эксплуатацию.

assistantExample:
  en: "e.g. Why does a staged deployment reduce the \"blast radius\" compared to a Big Bang cutover?"
  ru: "например: Почему поэтапное развёртывание уменьшает «радиус поражения» по сравнению с Big Bang cutover?"

