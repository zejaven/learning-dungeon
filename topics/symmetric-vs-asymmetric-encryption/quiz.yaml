# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: make-one-shared-key
    title:
      en: Make one shared key
      ru: Сделай один общий ключ
    goal:
      en: Generate a symmetric key and see it copied to every party that has to read - the same key encrypts and decrypts.
      ru: 'Сгенерируй симметричный ключ и увидь, как он копируется каждому, кто должен читать: один и тот же ключ и шифрует, и расшифровывает.'
    event: SECRET_KEY_GENERATED
  - id: make-a-key-pair
    title:
      en: Make a key pair
      ru: Сделай ключевую пару
    goal:
      en: Generate two mathematically linked keys and see that the private half cannot be derived from the public one.
      ru: Сгенерируй два математически связанных ключа и увидь, что приватную половину нельзя вывести из публичной.
    event: KEY_PAIR_GENERATED
  - id: publish-half-a-key-pair
    title:
      en: Publish half a key pair
      ru: Опубликуй половину пары
    goal:
      en: Hand the public half to everybody - including the attacker - and watch nothing bad happen.
      ru: Отдай публичную половину всем, включая злоумышленника, и увидь, что ничего плохого не произошло.
    event: PUBLIC_KEY_PUBLISHED
  - id: encrypt-with-one-key
    title:
      en: Encrypt with one key
      ru: Зашифруй одним ключом
    goal:
      en: Run a symmetric encryption and look at what the cost depends on - the amount of data, not the key.
      ru: 'Выполни симметричное шифрование и посмотри, от чего зависит его стоимость: от объёма данных, а не от ключа.'
    event: SYMMETRIC_ENCRYPT
  - id: decrypt-with-the-same-key
    title:
      en: Decrypt with the same key
      ru: Расшифруй тем же ключом
    goal:
      en: Recover the plaintext with the identical key that sealed it - and notice that this proves nothing about who wrote it.
      ru: Восстанови открытый текст тем же самым ключом, которым его запечатали, — и заметь, что это ничего не говорит об авторе.
    event: SYMMETRIC_DECRYPT
  - id: try-a-different-key
    title:
      en: Try a different key
      ru: Попробуй другой ключ
    goal:
      en: Decrypt with another key of the same strength and see a rejection rather than garbled output.
      ru: Расшифруй другим ключом той же стойкости и увидь отказ, а не искажённый результат.
    event: WRONG_KEY
  - id: send-the-key-in-the-open
    title:
      en: Send the key in the open
      ru: Отправь ключ открыто
    goal:
      en: Deliver a shared secret over the same channel it was meant to protect, which is the key distribution problem in one step.
      ru: Доставь общий секрет по тому же каналу, который он должен был защищать, — это и есть проблема распространения ключей за один шаг.
    event: KEY_SHARED_IN_THE_OPEN
  - id: let-the-attacker-read
    title:
      en: Let the attacker read
      ru: Дай злоумышленнику прочитать
    goal:
      en: Reach a state where a third party can recover a message, and check which failed - the cipher or the key.
      ru: 'Доведи дело до состояния, когда сообщение восстанавливает третья сторона, и проверь, что подвело: шифр или ключ.'
    event: ATTACKER_READS
  - id: count-the-keys
    title:
      en: Count the keys
      ru: Посчитай ключи
    goal:
      en: Compare how many keys a group needs under each scheme - n(n-1)/2 shared secrets against n key pairs.
      ru: 'Сравни, сколько ключей нужно группе в каждой схеме: n(n-1)/2 общих секретов против n ключевых пар.'
    event: KEY_DISTRIBUTION_COST
  - id: encrypt-to-a-public-key
    title:
      en: Encrypt to a public key
      ru: Зашифруй на публичный ключ
    goal:
      en: Seal a message with a key everybody has, without ever agreeing a shared secret first.
      ru: Запечатай сообщение ключом, который есть у всех, ни разу не согласовав перед этим общий секрет.
    event: ASYMMETRIC_ENCRYPT
  - id: block-the-attacker
    title:
      en: Block the attacker
      ru: Останови злоумышленника
    goal:
      en: Let the attacker hold the very public key that produced the ciphertext and still be unable to open it.
      ru: Пусть у злоумышленника будет ровно тот публичный ключ, которым получен шифротекст, и он всё равно не сможет его открыть.
    event: ATTACKER_STUCK
  - id: open-with-the-private-half
    title:
      en: Open with the private half
      ru: Открой приватной половиной
    goal:
      en: Decrypt with the only key that never moved and see that the key which closed the envelope cannot open it.
      ru: Расшифруй единственным ключом, который никуда не уходил, и увидь, что закрывший конверт ключ открыть его не может.
    event: ASYMMETRIC_DECRYPT
  - id: sign-a-message
    title:
      en: Sign a message
      ru: Подпиши сообщение
    goal:
      en: Use the pair the other way round - private to produce - and get authorship instead of secrecy.
      ru: Используй пару в обратную сторону — приватным ключом создай — и получи авторство вместо секретности.
    event: MESSAGE_SIGNED
  - id: verify-a-signature
    title:
      en: Verify a signature
      ru: Проверь подпись
    goal:
      en: Confirm authorship with the public half, which is why anybody at all can check a signature.
      ru: Подтверди авторство публичной половиной — поэтому проверить подпись может кто угодно.
    event: SIGNATURE_VERIFIED
  - id: break-a-signature
    title:
      en: Break a signature
      ru: Сломай подпись
    goal:
      en: Change one character of a signed message and watch verification fail, because repairing it needs the key that never moved.
      ru: 'Измени один символ подписанного сообщения и увидь, как проверка проваливается: починить подпись можно лишь ключом, который никуда не уходил.'
    event: SIGNATURE_INVALID
  - id: hit-the-size-ceiling
    title:
      en: Hit the size ceiling
      ru: Упрись в потолок размера
    goal:
      en: Push a payload bigger than 190 bytes into an RSA-2048 operation and find out that the key size is also the message size.
      ru: Затолкай в операцию RSA-2048 нагрузку больше 190 байт и обнаружь, что размер ключа заодно задаёт и размер сообщения.
    event: PAYLOAD_TOO_LARGE
  - id: measure-the-gap
    title:
      en: Measure the gap
      ru: Измерь разрыв
    goal:
      en: Put a number on how much slower the asymmetric route would be for the same file.
      ru: Получи число, во сколько раз медленнее был бы асимметричный путь для того же файла.
    event: PERFORMANCE_COMPARED
  - id: wrap-a-session-key
    title:
      en: Wrap a session key
      ru: Оберни ключ сессии
    goal:
      en: Spend one expensive asymmetric operation on a freshly generated symmetric key instead of on the data.
      ru: Потрать одну дорогую асимметричную операцию на свежесгенерированный симметричный ключ, а не на данные.
    event: SESSION_KEY_WRAPPED
  - id: send-a-hybrid-envelope
    title:
      en: Send a hybrid envelope
      ru: Отправь гибридный конверт
    goal:
      en: Deliver the payload asymmetric encryption refused, in the shape TLS, PGP and JWE all use.
      ru: Доставь нагрузку, которую отвергло асимметричное шифрование, в той же форме, что применяют TLS, PGP и JWE.
    event: HYBRID_SENT
  - id: unwrap-a-session-key
    title:
      en: Unwrap a session key
      ru: Разверни ключ сессии
    goal:
      en: Recover the session key with one private-key operation and finish the rest with the cheap symmetric cipher.
      ru: Восстанови ключ сессии одной операцией приватного ключа и доделай остальное дешёвым симметричным шифром.
    event: SESSION_KEY_UNWRAPPED
  - id: lose-the-private-half
    title:
      en: Lose the private half
      ru: Потеряй приватную половину
    goal:
      en: Leak the key that must never move and see it open a message intercepted long before the leak.
      ru: Слей ключ, который не должен двигаться, и увидь, как он открывает сообщение, перехваченное задолго до утечки.
    event: PRIVATE_KEY_LEAKED
  - id: read-the-audit
    title:
      en: Read the audit
      ru: Прочитай сводку
    goal:
      en: Finish a run and read the operation counts - many cheap symmetric ones on data, a handful of expensive asymmetric ones on keys.
      ru: 'Заверши прогон и прочитай счётчики операций: много дешёвых симметричных над данными и несколько дорогих асимметричных над ключами.'
    event: CRYPTO_AUDIT
bossFight:
  - id: core-difference
    en: What is the difference between symmetric and asymmetric encryption?
    ru: В чём разница между симметричным и асимметричным шифрованием?
  - id: which-is-more-secure
    en: Which of the two is more secure, and why is that question the wrong one?
    ru: Какое из двух безопаснее и почему этот вопрос поставлен неверно?
  - id: key-distribution-problem
    en: What is the key distribution problem, and how does a key pair solve it?
    ru: В чём состоит проблема распространения ключей и как её решает ключевая пара?
  - id: key-count-scaling
    en: How many keys does a group of n parties need under each scheme, and why does that matter operationally?
    ru: Сколько ключей нужно группе из n участников в каждой схеме и почему это важно для эксплуатации?
  - id: why-not-only-asymmetric
    en: If asymmetric encryption solves key distribution, why is bulk data never encrypted with it?
    ru: Если асимметричное шифрование решает распространение ключей, почему им никогда не шифруют объёмные данные?
  - id: payload-size-limit
    en: Why can RSA-2048 only encrypt about 190 bytes at a time? What does the key size have to do with the message size?
    ru: Почему RSA-2048 может зашифровать за раз только около 190 байт? При чём тут размер ключа к размеру сообщения?
  - id: hybrid-encryption
    en: Describe hybrid encryption. Walk through what happens when a client sends an encrypted 10 MB file.
    ru: Опиши гибридное шифрование. Разбери по шагам, что происходит, когда клиент отправляет зашифрованный файл на 10 МБ.
  - id: https-uses-which
    en: Which kind of encryption does HTTPS use, and what does each part do?
    ru: Какое шифрование использует HTTPS и за что отвечает каждая часть?
  - id: which-half-encrypts
    en: You encrypt something with somebody's public key. Who can decrypt it, and can you read your own message back?
    ru: Вы шифруете что-то чужим публичным ключом. Кто может это расшифровать и сможете ли вы прочитать собственное сообщение?
  - id: signing-vs-encrypting
    en: What changes when you use a key pair for signing instead of encrypting? Which half does what?
    ru: Что меняется, когда ключевая пара используется для подписи, а не для шифрования? Какая половина что делает?
  - id: signature-is-not-encryption
    en: Is a signed message confidential? Explain what a signature actually guarantees.
    ru: Является ли подписанное сообщение конфиденциальным? Объясни, что подпись гарантирует на самом деле.
  - id: symmetric-cannot-prove-authorship
    en: Why can a shared symmetric key never prove who wrote a message, and what do you use instead?
    ru: Почему общий симметричный ключ не может доказать, кто написал сообщение, и что используют вместо него?
  - id: mac-vs-signature
    en: How do an HMAC and a digital signature differ? When would you pick each?
    ru: Чем HMAC отличается от цифровой подписи? Когда выбрать каждый вариант?
  - id: key-size-comparison
    en: A 256-bit AES key and a 2048-bit RSA key - is the RSA one eight times stronger? Explain.
    ru: Ключ AES на 256 бит и ключ RSA на 2048 бит — RSA в восемь раз стойче? Объясни.
  - id: diffie-hellman
    en: What does a Diffie-Hellman key exchange do, and how is it different from encrypting a key with a public key?
    ru: Что делает обмен ключами Диффи-Хеллмана и чем он отличается от шифрования ключа публичным ключом?
  - id: consequences-of-a-leak
    en: Compare the blast radius of leaking a shared secret, a private key, and a public key.
    ru: Сравни масштаб последствий утечки общего секрета, приватного ключа и публичного ключа.
  - id: authenticated-encryption
    en: What is AEAD, and why does an encrypted message need an authentication tag at all?
    ru: Что такое AEAD и зачем зашифрованному сообщению вообще нужен тег аутентичности?
  - id: kerckhoffs
    en: Should the algorithm be secret? What exactly is supposed to be the secret in a cryptosystem?
    ru: Должен ли алгоритм быть секретным? Что именно обязано быть секретом в криптосистеме?
  - id: where-in-a-java-app
    en: Where does each family show up in a typical Java service - what would you actually use for what?
    ru: Где каждое семейство встречается в типичном Java-сервисе — что и для чего вы реально применили бы?
  - id: elliptic-curves
    en: Why do modern systems prefer elliptic-curve keys over RSA? What changes in practice?
    ru: Почему современные системы предпочитают ключи на эллиптических кривых вместо RSA? Что меняется на практике?
