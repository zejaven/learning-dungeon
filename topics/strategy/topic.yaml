summary:
  en: >
    Strategy makes a family of algorithms interchangeable behind a common
    interface, so a context object can swap behaviour at runtime without
    changing its own code. Here you build a checkout that pays via swappable
    PaymentStrategy implementations; the class diagram and missions track that
    you wired the interface, its implementations and the context correctly.
  ru: >
    Strategy делает семейство алгоритмов взаимозаменяемыми за общим интерфейсом,
    чтобы объект-контекст мог менять поведение во время выполнения, не меняя свой
    код. Здесь вы собираете оформление заказа, которое платит через
    взаимозаменяемые реализации PaymentStrategy; диаграмма классов и миссии
    отслеживают, что вы правильно связали интерфейс, его реализации и контекст.

