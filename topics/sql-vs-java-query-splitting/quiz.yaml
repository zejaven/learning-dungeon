# Theory topic: no missions (there is no practice editor) - only a Boss Fight.
bossFight:
  - id: default-answer
    en: When is it better to keep complex data work inside one SQL query, and when is it reasonable to split it into Java steps?
    ru: Когда сложную работу с данными лучше оставить в одном SQL-запросе, а когда разумно разбить её на шаги в Java?
  - id: set-based-vs-procedural
    en: Which kinds of work are usually stronger in SQL, and which kinds may belong in Java?
    ru: Какие виды работы обычно сильнее выполнять в SQL, а какие могут относиться к Java?
  - id: data-volume-risk
    en: Why is moving a large intermediate result from the database to Java often a bad trade-off?
    ru: Почему перенос большого промежуточного результата из базы в Java часто является плохим компромиссом?
  - id: round-trips-and-n-plus-one
    en: How can splitting one query accidentally create an N+1 problem or too many network round-trips?
    ru: Как разбиение одного запроса может случайно создать проблему N+1 или слишком много сетевых обращений?
  - id: consistency-transaction
    en: What consistency and transaction risks appear when several SQL statements replace one query?
    ru: Какие риски консистентности и транзакций появляются, когда один запрос заменяют несколькими SQL-операторами?
  - id: maintainability-threshold
    en: What signs show that a SQL query is too complex to maintain as a single statement?
    ru: Какие признаки показывают, что SQL-запрос стал слишком сложным для поддержки как один оператор?
  - id: database-bottleneck
    en: When can moving part of the work to Java help with database CPU pressure, and what must you measure first?
    ru: Когда перенос части работы в Java может помочь при нагрузке на CPU базы данных, и что сначала нужно измерить?
  - id: safe-splitting-pattern
    en: Describe a safe way to split a complex query without loading too much data or losing correctness.
    ru: Опишите безопасный способ разбить сложный запрос, не загружая слишком много данных и не теряя корректность.
