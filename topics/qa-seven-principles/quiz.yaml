bossFight:
  # I. Enumeration and core principles
  - id: name-seven-principles
    en: 'Name all seven testing principles and explain each in one or two sentences.'
    ru: 'Назовите все 7 принципов тестирования и объясните каждый одним-двумя предложениями.'
  - id: black-swan-presence
    en: 'Why can testing show the presence of defects but never prove their absence? Explain using the black swan analogy.'
    ru: 'Почему тестирование может показать наличие дефектов, но никогда не докажет их отсутствие? Объясните на аналогии с чёрным лебедем.'
  - id: exhaustive-impossible
    en: 'Why is exhaustive testing impossible? Estimate how many tests a screen with 15 input fields of 5 values each would require, and explain what we do instead.'
    ru: 'Почему исчерпывающее тестирование невозможно? Оцените, сколько тестов потребуется для экрана с 15 полями по 5 значений, и объясните, что мы делаем вместо этого.'
  # II. Cost, clustering, and the pesticide paradox
  - id: early-testing-cost
    en: 'What is the "cost of defect" and how does it justify starting testing before any code is written?'
    ru: 'Что такое «цена дефекта» и как она оправдывает начало тестирования до появления первой строчки кода?'
  - id: defect-clustering-pareto
    en: 'What does the defect clustering principle state, and how should it influence your test planning?'
    ru: 'Что утверждает принцип скопления дефектов и как он должен влиять на планирование тестирования?'
  - id: pesticide-paradox-beizer
    en: 'Explain the pesticide paradox (Beizer, 1983). Why does a constantly "green" regression suite not guarantee quality, and what is the antidote?'
    ru: 'Объясните парадокс пестицидов (Бейзер, 1983). Почему постоянно «зелёный» регрессионный пакет не гарантирует качество и какое есть противоядие?'
  # III. Context and the absence-of-errors fallacy
  - id: context-risk-crossing
    en: 'Testing is context dependent: what two aspects define a risk, and how does the road-crossing example illustrate risk-based testing?'
    ru: 'Тестирование зависит от контекста: какие два аспекта определяют риск и как пример с переходом дороги иллюстрирует риск-ориентированное тестирование?'
  - id: verification-vs-validation
    en: 'Explain the absence-of-errors fallacy. What is the difference between verification and validation, and why can a defect-free system still fail?'
    ru: 'Объясните заблуждение об отсутствии ошибок. В чём разница между верификацией и валидацией и почему система без дефектов всё равно может провалиться?'
