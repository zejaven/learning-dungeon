missions:
  - id: create-adaptee
    type: structure
    title:
      en: Create the adaptee
      ru: Создай adaptee
    goal:
      en: Add a LegacyPaymentGateway class that represents the incompatible existing API.
      ru: Добавь класс LegacyPaymentGateway, который представляет несовместимый существующий API.
    requires:
      - { kind: nodeExists, nodeKind: class, name: LegacyPaymentGateway }
  - id: adapter-implements-target
    type: structure
    title:
      en: Adapter implements the target
      ru: Adapter реализует target
    goal:
      en: Add LegacyPaymentAdapter and make it implement PaymentProcessor.
      ru: Добавь LegacyPaymentAdapter и сделай так, чтобы он реализовал PaymentProcessor.
    requires:
      - { kind: nodeExists, nodeKind: class, name: LegacyPaymentAdapter }
      - { kind: edge, relation: implements, from: LegacyPaymentAdapter, to: PaymentProcessor }
  - id: adapter-wraps-adaptee
    type: structure
    title:
      en: Adapter wraps the legacy class
      ru: Adapter оборачивает legacy-класс
    goal:
      en: Give LegacyPaymentAdapter a field of type LegacyPaymentGateway.
      ru: Дай LegacyPaymentAdapter поле типа LegacyPaymentGateway.
    requires:
      - { kind: edge, relation: association, from: LegacyPaymentAdapter, to: LegacyPaymentGateway }
  - id: client-uses-target
    type: structure
    title:
      en: Client uses the target interface
      ru: Client использует target interface
    goal:
      en: Give CheckoutService a field of type PaymentProcessor, not LegacyPaymentGateway.
      ru: Дай CheckoutService поле типа PaymentProcessor, а не LegacyPaymentGateway.
    requires:
      - { kind: edge, relation: association, from: CheckoutService, to: PaymentProcessor }
  - id: adapter-assembled
    type: structure
    title:
      en: Adapter structure assembled
      ru: Структура Adapter собрана
    goal:
      en: The adapter implements PaymentProcessor, wraps LegacyPaymentGateway, and the client holds PaymentProcessor.
      ru: Adapter реализует PaymentProcessor, оборачивает LegacyPaymentGateway, а client хранит PaymentProcessor.
    requires:
      - { kind: edge, relation: implements, from: LegacyPaymentAdapter, to: PaymentProcessor }
      - { kind: edge, relation: association, from: LegacyPaymentAdapter, to: LegacyPaymentGateway }
      - { kind: edge, relation: association, from: CheckoutService, to: PaymentProcessor }

bossFight:
  - id: problem-solved
    en: What problem does the Adapter pattern solve?
    ru: Какую проблему решает паттерн Adapter?
  - id: adapter-roles
    en: Name the Adapter pattern roles and explain how a call flows through them.
    ru: Назови роли паттерна Adapter и объясни, как через них проходит вызов.
  - id: adapter-vs-changing-legacy
    en: Why can Adapter be better than changing the legacy or third-party class directly?
    ru: Почему Adapter может быть лучше прямого изменения legacy- или стороннего класса?
  - id: adapter-vs-strategy
    en: How is Adapter different from Strategy?
    ru: Чем Adapter отличается от Strategy?
  - id: object-vs-class-adapter
    en: What is the difference between an object adapter and a class adapter in Java?
    ru: В чём разница между object adapter и class adapter в Java?
