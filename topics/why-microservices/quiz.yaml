# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: main-purpose
    en: Why do teams use microservices instead of one monolith?
    ru: Зачем команды используют микросервисы вместо одного монолита?
  - id: independent-deployment
    en: How does independent deployment change team work and release risk?
    ru: Как независимое развёртывание меняет работу команд и риск релизов?
  - id: scaling-boundaries
    en: When is scaling one service separately a real advantage?
    ru: Когда отдельное масштабирование одного сервиса действительно даёт преимущество?
  - id: data-and-consistency
    en: Why is data ownership in microservices difficult, and how does it affect transactions?
    ru: Почему владение данными в микросервисах сложно и как оно влияет на транзакции?
  - id: tradeoffs
    en: What new costs do microservices add compared with a modular monolith?
    ru: Какие новые издержки добавляют микросервисы по сравнению с модульным монолитом?
  - id: when-not-to-use
    en: When would you avoid microservices?
    ru: Когда вы бы не стали использовать микросервисы?
