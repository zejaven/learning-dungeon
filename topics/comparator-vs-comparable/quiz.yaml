missions:
  - id: natural-compareto
    title:
      en: 'Use natural ordering'
      ru: 'Используй natural ordering'
    goal:
      en: 'Run an example where Comparable.compareTo() decides the order.'
      ru: 'Запусти пример, где порядок определяет Comparable.compareTo().'
    event: ORDERING_COMPARE_TO
  - id: external-comparator
    title:
      en: 'Use an external Comparator'
      ru: 'Используй внешний Comparator'
    goal:
      en: 'Run an example where Comparator.compare() provides an order outside the class.'
      ru: 'Запусти пример, где Comparator.compare() задаёт порядок снаружи класса.'
    event: ORDERING_COMPARATOR_COMPARE
  - id: zero-is-same-position
    title:
      en: 'Observe result 0'
      ru: 'Увидь результат 0'
    goal:
      en: 'Produce a comparison result of 0 and notice that it means the same sort position.'
      ru: 'Получи результат сравнения 0 и заметь, что он означает одну позицию сортировки.'
    event: ORDERING_COMPARE_ZERO
  - id: safe-integer-compare
    title:
      en: 'Avoid subtraction overflow'
      ru: 'Избеги overflow при вычитании'
    goal:
      en: 'Run the safe integer comparison example and compare Integer.compare(...) with subtraction.'
      ru: 'Запусти пример безопасного сравнения int и сравни Integer.compare(...) с вычитанием.'
    event: ORDERING_SAFE_COMPARE

bossFight:
  - id: difference-comparable-comparator
    en: 'What is the difference between Comparable and Comparator?'
    ru: 'В чём разница между Comparable и Comparator?'
  - id: compareto-result-signs
    en: 'What do negative, zero, and positive return values from compareTo() mean?'
    ru: 'Что означают отрицательное, нулевое и положительное значения, возвращаемые compareTo()?'
  - id: compareto-contract
    en: 'What rules should a correct compareTo() implementation follow?'
    ru: 'Каким правилам должна следовать корректная реализация compareTo()?'
  - id: zero-result-trap
    en: 'Why can returning 0 for different objects be dangerous in TreeSet or TreeMap?'
    ru: 'Почему return 0 для разных объектов опасен в TreeSet или TreeMap?'
  - id: safe-integer-comparison
    en: 'Why is this.age - other.age a bad compareTo() implementation, and what should you use instead?'
    ru: 'Почему this.age - other.age - плохая реализация compareTo(), и что лучше использовать?'
  - id: comparator-chaining
    en: 'How do comparing(), thenComparing(), reversed(), nullsFirst(), and nullsLast() help build Comparators?'
    ru: 'Как comparing(), thenComparing(), reversed(), nullsFirst() и nullsLast() помогают строить Comparator?'
