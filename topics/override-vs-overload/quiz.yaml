# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: declare-variable
    title:
      en: Bind a subclass to a base reference
      ru: Свяжи подкласс с базовой ссылкой
    goal:
      en: Create a variable like Animal a = new Dog() (a static type with a different runtime type).
      ru: Создай переменную вида Animal a = new Dog() (статический тип с другим типом во время выполнения).
    event: DISPATCH_VAR
  - id: override
    title:
      en: Resolve an overridden call
      ru: Разреши переопределённый вызов
    goal:
      en: Call an overridden method and watch it bind at runtime to the actual object's type.
      ru: Вызови переопределённый метод и посмотри, как он связывается во время выполнения с типом фактического объекта.
    event: DISPATCH_OVERRIDE
  - id: overload
    title:
      en: Resolve an overloaded call
      ru: Разреши перегруженный вызов
    goal:
      en: Call an overloaded method and watch the compiler pick by the static type of the argument.
      ru: Вызови перегруженный метод и посмотри, как компилятор выбирает по статическому типу аргумента.
    event: DISPATCH_OVERLOAD

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: definition
    en: What is the difference between overriding and overloading?
    ru: Чем переопределение отличается от перегрузки?
  - id: binding-time
    en: When is each one resolved — compile time or runtime — and what type drives the choice?
    ru: Когда разрешается каждое — во время компиляции или выполнения — и какой тип определяет выбор?
  - id: static-type-trap
    en: Given Object o = "hi", which of print(Object) / print(String) is called and why?
    ru: Дано Object o = "hi"; какой из print(Object) / print(String) вызовется и почему?
  - id: signature-rules
    en: What can and cannot change in an overriding method (return type, access, exceptions)?
    ru: Что может и не может меняться в переопределяющем методе (тип возврата, доступ, исключения)?
  - id: static-private
    en: Can you override a static or private method? What actually happens?
    ru: Можно ли переопределить static- или private-метод? Что происходит на самом деле?
  - id: polymorphism
    en: Which of the two gives you runtime polymorphism, and why does the other not?
    ru: Какое из двух даёт полиморфизм во время выполнения и почему второе — нет?
