# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: core-difference
    en: What is the difference between final, finally and finalize?
    ru: В чём разница между final, finally и finalize?
  - id: final-uses
    en: What can the final keyword be applied to, and what does it mean for a variable, a method and a class?
    ru: К чему можно применять ключевое слово final и что оно означает для переменной, метода и класса?
  - id: final-reference-immutable
    en: Does declaring a reference as final make the object it points to immutable? Why or why not?
    ru: Делает ли объявление ссылки как final неизменяемым объект, на который она указывает? Почему да или нет?
  - id: finally-always-runs
    en: Does the finally block always execute? Name cases where it does not run.
    ru: Всегда ли выполняется блок finally? Назовите случаи, когда он не выполняется.
  - id: finally-with-return
    en: What happens if the try block has a return statement — does finally still run, and what if finally also returns?
    ru: Что произойдёт, если в блоке try есть return — выполнится ли finally, и что если finally тоже делает return?
  - id: finalize-deprecated
    en: Why is finalize() discouraged and deprecated, and what should you use instead?
    ru: Почему finalize() не рекомендуют и объявили устаревшим, и что использовать вместо него?
