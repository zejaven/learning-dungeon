missions:
  - id: show-single-monitor
    title:
      en: Show the single monitor
      ru: Покажи единый monitor
    goal:
      en: Run code where T2 is blocked because T1 already owns the synchronized collection monitor.
      ru: Запусти код, где T2 блокируется, потому что T1 уже владеет monitor synchronized collection.
    event: SYNC_THREAD_BLOCKED
  - id: break-fail-fast-iterator
    title:
      en: Invalidate an iterator
      ru: Инвалидируй iterator
    goal:
      en: Create a fail-fast iterator, write through the synchronized collection, then continue iteration.
      ru: Создай fail-fast iterator, выполни запись через synchronized collection, затем продолжи iteration.
    event: FAIL_FAST_ITERATOR_INVALIDATED
  - id: read-concurrently
    title:
      en: Read without a global lock
      ru: Прочитай без общего lock
    goal:
      en: Read from a concurrent map while other operations can still proceed.
      ru: Прочитай из concurrent map, пока другие операции тоже могут продолжаться.
    event: CONCURRENT_READ
  - id: use-atomic-operation
    title:
      en: Use putIfAbsent
      ru: Используй putIfAbsent
    goal:
      en: Use an atomic putIfAbsent-style operation instead of manual check-then-put.
      ru: Используй атомарную операцию в стиле putIfAbsent вместо ручного check-then-put.
    event: ATOMIC_PUT_IF_ABSENT
  - id: keep-weak-iterator-going
    title:
      en: Continue weak iteration
      ru: Продолжи weak iteration
    goal:
      en: Mutate a concurrent map while a weakly consistent iterator keeps going.
      ru: Измени concurrent map, пока weakly consistent iterator продолжает обход.
    event: WEAK_ITERATOR_CONTINUES
  - id: copy-on-write-snapshot
    title:
      en: Publish a copied array
      ru: Опубликуй скопированный array
    goal:
      en: Add to a copy-on-write list so the write copies and publishes a new backing array.
      ru: Добавь элемент в copy-on-write list, чтобы запись скопировала и опубликовала новый backing array.
    event: COPY_ON_WRITE_WRITE

bossFight:
  - id: basic-difference
    en: What is the core difference between a synchronized collection and a concurrent collection?
    ru: В чём главная разница между synchronized collection и concurrent collection?
  - id: synchronized-wrapper-lock
    en: What does Collections.synchronizedList or Collections.synchronizedMap synchronize, and what does that imply for contention?
    ru: Что синхронизирует Collections.synchronizedList или Collections.synchronizedMap и что это значит для contention?
  - id: iteration-locking
    en: Why do synchronized collection wrappers still require external locking during iteration?
    ru: Почему synchronized wrappers для collections всё равно требуют внешнего locking во время iteration?
  - id: fail-fast-vs-weak
    en: Compare fail-fast iterators with weakly consistent iterators.
    ru: Сравни fail-fast iterators и weakly consistent iterators.
  - id: compound-actions
    en: Why is check-then-put unsafe with a synchronized wrapper unless callers use the same lock, and what concurrent API would you prefer?
    ru: Почему check-then-put небезопасен с synchronized wrapper без общего lock у callers и какой concurrent API лучше выбрать?
  - id: copy-on-write-use-case
    en: When is CopyOnWriteArrayList a good fit, and when is it a bad fit?
    ru: Когда CopyOnWriteArrayList хорошо подходит, а когда плохо?
  - id: null-values
    en: Why does ConcurrentHashMap reject null keys and values?
    ru: Почему ConcurrentHashMap запрещает null keys и null values?
  - id: choosing-collection
    en: In a highly concurrent service, when would you choose ConcurrentHashMap over Collections.synchronizedMap?
    ru: В highly concurrent service когда выбрать ConcurrentHashMap вместо Collections.synchronizedMap?
