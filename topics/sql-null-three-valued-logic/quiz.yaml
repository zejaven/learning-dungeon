# SQL missions compare the user's result to each reference query. Rows are
# compared as a multiset unless ordered: true; columns are compared by position.
missions:
  - id: null-arithmetic
    type: sql
    title:
      en: Let NULL affect arithmetic
      ru: Покажи влияние NULL на арифметику
    goal:
      en: Return each parcel label and known_items + extra_items, ordered by id (label, total_items).
      ru: Верни метку посылки и known_items + extra_items, отсортировав по id (label, total_items).
    requires:
      - kind: sqlResult
        expectedSql: >
          SELECT label, known_items + extra_items AS total_items
          FROM parcel_checks
          ORDER BY id
        ordered: true
  - id: null-or-true
    type: sql
    title:
      en: Check NULL OR TRUE
      ru: Проверь NULL OR TRUE
    goal:
      en: Return each parcel label and scan_passed OR TRUE, ordered by id (label, result).
      ru: Верни метку посылки и scan_passed OR TRUE, отсортировав по id (label, result).
    requires:
      - kind: sqlResult
        expectedSql: >
          SELECT label, scan_passed OR TRUE AS result
          FROM parcel_checks
          ORDER BY id
        ordered: true
  - id: null-or-false
    type: sql
    title:
      en: Check NULL OR FALSE
      ru: Проверь NULL OR FALSE
    goal:
      en: Return each parcel label and scan_passed OR FALSE, ordered by id (label, result).
      ru: Верни метку посылки и scan_passed OR FALSE, отсортировав по id (label, result).
    requires:
      - kind: sqlResult
        expectedSql: >
          SELECT label, scan_passed OR FALSE AS result
          FROM parcel_checks
          ORDER BY id
        ordered: true
  - id: where-null-filters
    type: sql
    title:
      en: See WHERE reject UNKNOWN
      ru: Увидь, как WHERE отбрасывает UNKNOWN
    goal:
      en: Return labels using a WHERE condition that is NULL for every row; the result has column (label) and no rows.
      ru: Верни метки через условие WHERE, которое равно NULL для каждой строки; результат имеет колонку (label) и ни одной строки.
    requires:
      - kind: sqlResult
        expectedSql: >
          SELECT label
          FROM parcel_checks
          WHERE CAST(NULL AS BOOLEAN)
  - id: where-keeps-true
    type: sql
    title:
      en: Keep only TRUE rows
      ru: Оставь только строки с TRUE
    goal:
      en: Return labels that pass scan_passed OR FALSE, ordered by id (label).
      ru: Верни метки, которые проходят scan_passed OR FALSE, отсортировав по id (label).
    requires:
      - kind: sqlResult
        expectedSql: >
          SELECT label
          FROM parcel_checks
          WHERE scan_passed OR FALSE
          ORDER BY id
        ordered: true
  - id: find-missing-notes
    type: sql
    title:
      en: Find missing notes
      ru: Найди отсутствующие заметки
    goal:
      en: Return labels where courier_note is NULL, ordered by id (label).
      ru: Верни метки, у которых courier_note равен NULL, отсортировав по id (label).
    requires:
      - kind: sqlResult
        expectedSql: >
          SELECT label
          FROM parcel_checks
          WHERE courier_note IS NULL
          ORDER BY id
        ordered: true

bossFight:
  - id: null-meaning
    en: What does NULL mean in SQL, and why is it not the same as zero, an empty string, or false?
    ru: Что означает NULL в SQL и почему это не то же самое, что ноль, пустая строка или false?
  - id: arithmetic-with-null
    en: What is the result of 1 + NULL, and why?
    ru: Каков результат 1 + NULL и почему?
  - id: or-truth-table
    en: What do NULL OR TRUE and NULL OR FALSE evaluate to in SQL three-valued logic?
    ru: Во что превращаются NULL OR TRUE и NULL OR FALSE в трёхзначной логике SQL?
  - id: where-unknown
    en: Why does WHERE NULL filter out the row?
    ru: Почему WHERE NULL отсеивает строку?
  - id: null-comparison
    en: Why is column = NULL wrong, and what should you use instead?
    ru: Почему column = NULL — ошибка и что нужно использовать вместо этого?
  - id: production-null-trap
    en: How can NULL values from a LEFT JOIN or optional column make production queries silently drop rows?
    ru: Как NULL из LEFT JOIN или необязательной колонки может незаметно выбросить строки из production-запроса?
