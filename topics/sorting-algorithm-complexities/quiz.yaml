# Theory topic: no missions (there is no practice editor) - only a Boss Fight.
bossFight:
  - id: list-sort-complexities
    en: 'State the best, average, and worst Big-O time for bubble sort, selection sort, insertion sort, and heap sort.'
    ru: 'Назовите лучшую, среднюю и худшую сложность Big-O для пузырьковой сортировки, сортировки выбором, сортировки вставками и пирамидальной сортировки.'
  - id: bubble-best-case
    en: 'When is bubble sort O(n), and why is that not true for every implementation?'
    ru: 'Когда пузырьковая сортировка имеет O(n), и почему это верно не для каждой реализации?'
  - id: selection-sorted-input
    en: 'Why does selection sort remain O(n^2) even when the input is already sorted?'
    ru: 'Почему сортировка выбором остается O(n^2), даже если вход уже отсортирован?'
  - id: insertion-nearly-sorted
    en: 'Why is insertion sort efficient on already sorted or nearly sorted data?'
    ru: 'Почему сортировка вставками эффективна на уже отсортированных или почти отсортированных данных?'
  - id: heap-n-log-n
    en: 'Explain why heap sort is O(n log n) in the worst case.'
    ru: 'Объясните, почему пирамидальная сортировка имеет O(n log n) в худшем случае.'
  - id: stability-and-space
    en: 'Which of these algorithms are stable, and what extra space do their classic in-place versions use?'
    ru: 'Какие из этих алгоритмов стабильны, и сколько дополнительной памяти используют их классические in-place версии?'
