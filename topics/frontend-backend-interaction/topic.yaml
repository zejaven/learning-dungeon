id: frontend-backend-interaction
title:
  en: 'How the Frontend and the Backend Talk'
  ru: 'Как взаимодействуют фронтенд и бэкенд'
category:
  en: REST / API Design
  ru: REST / Проектирование API
type: HTTP
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: rest
difficulty: 1
catalogId: rest-5
summary:
  en: >
    Two programs in two processes that share no memory: the browser has the
    screen, the server has the data. Between them there is only a text message —
    an HTTP request (method, path, headers, body) and an HTTP response (status
    code, headers, body), with JSON as the shared type system. Everything else
    follows from that: the call is asynchronous, so every screen has loading and
    error states; HTTP remembers nothing, so identity rides in a header on every
    request; the status code is the machine-readable outcome; and only the client
    can start a conversation, so pushing from the server needs polling, SSE or a
    WebSocket. The traps are treating a remote call like a local one — retries
    that duplicate a write, no response confused with 500, a renamed field that
    turns into 'undefined' behind a green 200.
  ru: >
    Две программы в двух процессах, у которых нет общей памяти: у браузера
    экран, у сервера данные. Между ними только текстовое сообщение — HTTP-запрос
    (метод, путь, заголовки, тело) и HTTP-ответ (код состояния, заголовки, тело),
    а общая система типов — JSON. Всё остальное следует отсюда: вызов
    асинхронный, поэтому у каждого экрана есть состояния загрузки и ошибки; HTTP
    ничего не помнит, поэтому личность едет в заголовке каждого запроса; код
    состояния — машиночитаемый исход; и разговор может начать только клиент,
    поэтому для отправки с сервера нужны опрос, SSE или WebSocket. Ловушки — это
    отношение к удалённому вызову как к локальному: повтор, который создаёт
    дубль, отсутствие ответа, спутанное с 500, и переименованное поле,
    превращающееся в «undefined» за зелёным 200.

# Visual primitives this topic's visualizer composes (frontend).
primitives:
  - BoxGroup

defaultExample: one-round-trip

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: one-round-trip
    title:
      en: One round trip, end to end
      ru: Один обмен, от начала до конца
    file: 01-one-round-trip.java
    explanation:
      en: >
        The whole answer in one run. The frontend cannot call a method on the
        backend, so it writes a text request; the promise goes pending and the
        screen shows a spinner; a router maps the text onto one handler; the
        answer comes back as text, is parsed, and only then is there anything
        to render.
      ru: >
        Весь ответ за один запуск. Фронтенд не может вызвать метод на бэкенде,
        поэтому он пишет текстовый запрос; промис уходит в ожидание, и экран
        показывает индикатор загрузки; маршрутизатор сопоставляет текст с одним
        обработчиком; ответ возвращается текстом, разбирается — и только тогда
        появляется что рисовать.
  - id: json-on-the-wire
    title:
      en: What actually crosses the wire
      ru: Что на самом деле летит по проводу
    file: 02-json-on-the-wire.java
    explanation:
      en: >
        No object was sent — an object cannot leave a JVM. The entity was
        serialized to text and parsed back into a brand-new plain JavaScript
        object with no methods. Watch the types get flattened: LocalDate becomes
        a string because JSON has no date, BigDecimal becomes a double-precision
        number, and null is not the same as a missing key.
      ru: >
        Никакой объект не отправлялся — объект не может покинуть JVM. Сущность
        сериализовали в текст и разобрали обратно в совершенно новый обычный
        JavaScript-объект без методов. Смотрите, как сплющиваются типы:
        LocalDate становится строкой, потому что в JSON нет даты, BigDecimal —
        числом двойной точности, а null и отсутствующий ключ — разные вещи.
  - id: sending-data
    title:
      en: Sending data the other way
      ru: Отправка данных в обратную сторону
    file: 03-sending-data.java
    explanation:
      en: >
        Writing needs three things a read did not: a body, a Content-Type and
        proof of who is asking. The first attempt is anonymous and gets a 401;
        after one sign-in the frontend holds a token and attaches it itself. The
        id in the 201 answer is invented by the server, so the response is the
        only way the frontend can ever learn it.
      ru: >
        Записи нужно то, что чтению не требовалось: тело, Content-Type и
        доказательство того, кто спрашивает. Первая попытка анонимна и получает
        401; после одного входа фронтенд держит токен и прикрепляет его сам.
        Идентификатор в ответе 201 придумал сервер, поэтому ответ — единственный
        способ для фронтенда его узнать.
  - id: nothing-is-remembered
    title:
      en: 'The server remembers nothing'
      ru: 'Сервер ничего не помнит'
    file: 04-nothing-is-remembered.java
    explanation:
      en: >
        Signing in did not put the user "into" the server: there are zero
        sessions stored, and the token has to ride along on every single call —
        leave it off once and the request is anonymous again. Then press F5: the
        frontend's memory is wiped and has to re-fetch everything, and the server
        does not even notice.
      ru: >
        Вход не поместил пользователя «внутрь» сервера: сессий хранится ноль, и
        токен должен ехать с каждым вызовом — стоит один раз его не приложить,
        и запрос снова анонимен. Затем нажмите F5: память фронтенда стирается и
        всё приходится запрашивать заново, а сервер этого даже не замечает.
  - id: the-answer-is-a-number
    title:
      en: 'The answer is a number'
      ru: 'Ответ — это число'
    file: 05-the-answer-is-a-number.java
    explanation:
      en: >
        Four things go wrong and the protocol says which is which: 400 — the
        request was understood and refused, with a machine-readable field and
        code; 404 on a real route — the thing is absent; 404 with nothing
        matched — that URL is not an endpoint at all; 500 — the server broke.
        The frontend branches on the number, never on the wording.
      ru: >
        Четыре разных сбоя, и протокол говорит, какой именно: 400 — запрос
        поняли и отклонили, с машиночитаемыми полем и кодом; 404 на настоящем
        маршруте — вещи нет; 404 без совпадения — такого эндпоинта вообще нет;
        500 — сломался сервер. Фронтенд ветвится по числу, а не по формулировке.
  - id: when-the-answer-never-comes
    title:
      en: 'When the answer never comes'
      ru: 'Когда ответ так и не приходит'
    file: 06-when-the-answer-never-comes.java
    explanation:
      en: >
        The failure a local method call cannot have. First no connection at all:
        a rejected promise and no status code — which is not the same as a 500.
        Then the nastier one: the request arrives, the row is written, and the
        answer is lost — so the retry hires a second person. The fix is to name
        the write with an Idempotency-Key and let the server recognise the repeat.
      ru: >
        Поломка, которой не бывает у локального вызова. Сначала связи нет вовсе:
        отклонённый промис и никакого кода состояния — это не то же самое, что
        500. Потом хуже: запрос дошёл, строка записана, а ответ потерялся — и
        повтор нанимает второго человека. Лечится тем, что запись называют через
        Idempotency-Key, и сервер узнаёт повтор.
  - id: who-speaks-first
    title:
      en: Who is allowed to speak first
      ru: Кому позволено заговорить первым
    file: 07-who-speaks-first.java
    explanation:
      en: >
        The backend has news and no way to deliver it: a browser tab is not a
        server and has no address to be called back on. Workaround one is to ask
        again and again, paying for a round trip per "nothing yet"; workaround
        two is to upgrade the connection once and keep it open, after which
        either side may send — at the cost of a connection that is now state.
      ru: >
        У бэкенда есть новость и нет способа её доставить: вкладка браузера — не
        сервер, у неё нет адреса для обратного вызова. Обходной путь первый —
        спрашивать снова и снова, платя обменом за каждое «пока ничего»; второй —
        один раз повысить соединение и держать его открытым, после чего слать
        может любая сторона, — ценой того, что соединение стало состоянием.
  - id: the-shape-is-the-contract
    title:
      en: 'The response shape is a contract'
      ru: 'Форма ответа — это контракт'
    file: 08-the-shape-is-the-contract.java
    explanation:
      en: >
        A field is renamed on the backend and every server test still passes —
        inside one process the rename is invisible. But the frontend already
        running in someone's browser was not redeployed: it asks the same
        question, gets a clean 200, and reads a property that no longer exists.
        JavaScript does not throw; the screen just says "undefined".
      ru: >
        На бэкенде переименовали поле, и все серверные тесты по-прежнему зелёные —
        внутри одного процесса переименование незаметно. Но фронтенд, уже
        работающий у кого-то в браузере, никто не передеплоил: он задаёт тот же
        вопрос, получает чистый 200 и читает свойство, которого больше нет.
        JavaScript не падает — на экране просто «undefined».

