summary:
  en: >
    The logical design phase as the "decision layer" of a network: structured
    IP addressing with VLSM and IPAM, hierarchical addressing and route
    summarisation, VLAN segmentation and inter-VLAN routing, static vs dynamic
    routing and IGP/EGP strategy, QoS design, high-availability frameworks
    (VSS/StackWise, NSF/SSO), IP multicast, and common design pitfalls.
  ru: >
    Фаза логического дизайна как «слой решений» сети: структурированная
    IP-адресация с VLSM и IPAM, иерархическая адресация и суммаризация
    маршрутов, сегментация VLAN и inter-VLAN маршрутизация, статическая и
    динамическая маршрутизация и стратегия IGP/EGP, дизайн QoS, каркасы
    высокой доступности (VSS/StackWise, NSF/SSO), IP multicast и типичные
    ошибки проектирования.

assistantExample:
  en: "e.g. Why should VLSM allocations always leave room for 20-50% growth?"
  ru: "например: Почему при выделении подсетей по VLSM всегда закладывают запас роста 20-50%?"

