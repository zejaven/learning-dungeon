summary: >
  Эталонный разбор задачи с собеседования: приёмочное тестирование строки поиска
  на главной странице маркетплейса. Позитивные кейсы (отображение, ввод, поиск
  по названию, по нескольким словам, по подстроке, другой язык, неправильная
  раскладка, Enter, иконка поиска, Ctrl+V), негативные (пустая строка, пробел,
  спецсимволы, очень длинная строка, SQL-инъекция, изменение кода страницы),
  почему важен порядок «сначала позитив, потом негатив» и отличия десктопного
  и мобильного веба.

assistantExample:
  'например: Какие критичные тест-кейсы вы бы проверили при приёмочном тестировании строки поиска на главной?'

