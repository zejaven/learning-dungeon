id: rest-controller-endpoint-design
languages: [en, ru]
title:
  en: 'Designing Endpoints in a REST Controller'
  ru: 'Проектирование эндпоинтов в REST-контроллере'
category:
  en: REST / API Design
  ru: REST / Проектирование API
type: HTTP
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: rest
difficulty: 2
catalogId: rest-6
summary:
  en: >
    Naming the URL is the first decision, not the whole job. Designing a
    controller means writing four decisions down per operation: what binds out of
    the request (path variable, query parameter, body), which types cross the
    HTTP boundary (a request DTO and a response DTO, never the entity), which
    status answers (201 with `Location` for a create, 204 with no body for a
    delete), and what the method actually does — bind, validate the shape,
    delegate to a service, map the result to a status. One controller owns one
    resource; collections are paged with a capped page size; errors are turned
    into statuses in a single `@RestControllerAdvice` instead of a try/catch per
    method. The traps are the entity as the API type, a create that answers 200,
    a 204 that returns a body, an unbounded list, and business rules living in
    the class that speaks HTTP.
  ru: >
    Назвать URL — первое решение, а не вся работа. Спроектировать контроллер
    значит записать четыре решения на операцию: что извлекается из запроса
    (переменная пути, параметр строки запроса, тело), какие типы пересекают
    границу HTTP (DTO запроса и DTO ответа, но не сущность), какой статус
    отвечает (201 с `Location` на создание, 204 без тела на удаление) и что
    именно делает метод — извлечь, проверить форму, делегировать сервису,
    отобразить результат в статус. Один контроллер владеет одним ресурсом;
    коллекции отдаются страницами с ограниченным размером страницы; ошибки
    превращаются в статусы в едином `@RestControllerAdvice`, а не в try/catch в
    каждом методе. Ловушки: сущность как тип API, создание, отвечающее 200, 204 с
    телом, список без ограничения и бизнес-правила в классе, который говорит по
    HTTP.

# Visual primitives this topic's visualizer composes (frontend).
primitives:
  - BoxGroup

defaultExample: controller-surface

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: controller-surface
    title:
      en: One resource, one controller
      ru: Один ресурс — один контроллер
    file: 01-controller-surface.java
    explanation:
      en: >
        The finished design on one screen. Six operations become six handler
        methods over one resource, and each row is the same four decisions:
        what binds in, what type goes out, which status, and a page size for the
        collection. Read the derived Java signatures — they are what the design
        actually forces you to write.
      ru: >
        Готовый дизайн на одном экране. Шесть операций становятся шестью
        методами-обработчиками над одним ресурсом, и каждая строка — это одни и
        те же четыре решения: что извлекается, какой тип уходит, какой статус и
        какой размер страницы у коллекции. Прочитайте выведенные Java-сигнатуры —
        именно их дизайн и заставляет написать.
  - id: status-codes
    title:
      en: 'The status is part of the design'
      ru: 'Статус — часть дизайна'
    file: 02-status-codes.java
    explanation:
      en: >
        A create that answers 200 and a delete that answers 204 with a body in
        it. Both work, and both make every client guess. Watch the model name the
        code each method promises, then fix the two declarations in place.
      ru: >
        Создание, отвечающее 200, и удаление, отвечающее 204 с телом внутри. Оба
        работают и оба заставляют каждого клиента гадать. Смотрите, как модель
        называет код, который обещает каждый метод, и как обе декларации
        исправляются на месте.
  - id: dto-not-entity
    title:
      en: 'DTO in, DTO out'
      ru: 'DTO на вход, DTO на выход'
    file: 03-dto-not-entity.java
    explanation:
      en: >
        The shortcut everyone takes once: let the JPA entity be the request and
        the response type. Then the JSON is whatever the table holds, a rename is
        a breaking change, and a client can set fields it was never meant to
        touch. Two small classes undo all of it.
      ru: >
        Короткий путь, по которому каждый проходит однажды: пусть JPA-сущность
        будет и типом запроса, и типом ответа. Тогда JSON — это то, что лежит в
        таблице, переименование колонки ломает контракт, а клиент может выставить
        поля, которые ему трогать не полагалось. Два маленьких класса всё это
        отменяют.
  - id: request-pipeline
    title:
      en: 'What a handler method actually does'
      ru: 'Что на самом деле делает обработчик'
    file: 04-request-pipeline.java
    explanation:
      en: >
        A request going through the four stages of a controller method: binding
        happens before your code runs, validation decides whether it runs at all,
        the service does the work, and the last line turns a result into a status.
        Nothing else belongs in the method.
      ru: >
        Запрос проходит четыре стадии метода-контроллера: привязка происходит до
        вашего кода, валидация решает, выполнится ли он вообще, работу делает
        сервис, а последняя строка превращает результат в статус. Больше в методе
        ничего быть не должно.
  - id: validation-and-errors
    title:
      en: '400 and 404 without a try/catch'
      ru: '400 и 404 без try/catch'
    file: 05-validation-and-errors.java
    explanation:
      en: >
        Two unhappy paths. A body that breaks a constraint stops at the edge —
        no service call, no transaction, and the answer still names the field. A
        missing row is the service's answer, and one advice turns that domain
        exception into 404 for the whole API.
      ru: >
        Два несчастливых пути. Тело, нарушающее ограничение, останавливается на
        границе: без вызова сервиса, без транзакции — и в ответе всё равно
        названо поле. Отсутствующая строка — это ответ сервиса, и один advice
        превращает доменное исключение в 404 для всего API.
  - id: collections-and-paging
    title:
      en: 'Collections have a size'
      ru: 'У коллекций есть размер'
    file: 06-collections-and-paging.java
    explanation:
      en: >
        `List<EmployeeView>` is fine on twenty rows and an outage on two million.
        Paging with a default and a hard cap, sorting and filters are one
        endpoint's parameters, not new endpoints — and the cap exists because the
        client chooses the page size.
      ru: >
        `List<EmployeeView>` нормален на двадцати строках и превращается в аварию
        на двух миллионах. Постраничность со значением по умолчанию и жёстким
        максимумом, сортировка и фильтры — это параметры одного эндпоинта, а не
        новые эндпоинты; максимум нужен потому, что размер страницы выбирает
        клиент.
  - id: thin-controller
    title:
      en: 'Thin controller, real service'
      ru: 'Тонкий контроллер, настоящий сервис'
    file: 07-thin-controller.java
    explanation:
      en: >
        A salary change as a sub-resource, and the rule about who may raise what
        parked inside the controller. A rule that lives there can only be reached
        by an HTTP request — no scheduler, no consumer, no test without MockMvc.
        Moving it down restores all three.
      ru: >
        Изменение зарплаты как под-ресурс и правило о том, кто кому может поднять
        зарплату, поселившееся в контроллере. До правила, живущего там, можно
        добраться только HTTP-запросом: ни планировщиком, ни консьюмером, ни
        тестом без MockMvc. Перенос вниз возвращает все три возможности.

