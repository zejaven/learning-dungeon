missions:
  - id: make-thread-ready
    title:
      en: Put a thread in the ready queue
      ru: Помести thread в ready queue
    goal:
      en: Create at least one runnable thread so the scheduler has work to choose from.
      ru: Создай хотя бы один runnable thread, чтобы scheduler мог выбрать работу.
    event: THREAD_READY
  - id: restore-context
    title:
      en: Restore a saved context
      ru: Восстанови сохраненный context
    goal:
      en: Dispatch a ready thread so the kernel restores its PC, SP and registers onto the CPU.
      ru: Выполни dispatch ready thread, чтобы kernel восстановил его PC, SP и registers на CPU.
    event: CONTEXT_RESTORED
  - id: save-context
    title:
      en: Save the running context
      ru: Сохрани running context
    goal:
      en: Make the running thread stop because of a time slice or blocking call, so its CPU state is saved.
      ru: Останови running thread из-за кванта времени или blocking call, чтобы его CPU state сохранился.
    event: CONTEXT_SAVED
  - id: switch-to-another-thread
    title:
      en: Switch to another thread
      ru: Переключись на другой thread
    goal:
      en: Run two ready threads and expire a time slice so the scheduler moves the CPU from one thread to another.
      ru: Запусти два ready threads и заверши квант времени, чтобы scheduler переключил CPU с одного thread на другой.
    event: CONTEXT_SWITCHED
  - id: block-and-wake
    title:
      en: Block a thread on I/O
      ru: Заблокируй thread на I/O
    goal:
      en: Make a running thread wait for I/O so another ready thread can use the CPU.
      ru: Заставь running thread ждать I/O, чтобы другой ready thread мог использовать CPU.
    event: THREAD_BLOCKED

bossFight:
  - id: definition
    en: What is a context switch?
    ru: Что такое context switch?
  - id: saved-state
    en: What pieces of CPU and thread state are typically saved and restored during a context switch?
    ru: Какие части состояния CPU и thread обычно сохраняются и восстанавливаются при context switch?
  - id: common-causes
    en: Name common reasons a context switch happens in a Java application.
    ru: Назови частые причины context switch в Java-приложении.
  - id: overhead-cost
    en: Why is a context switch not free, even if it happens very quickly?
    ru: Почему context switch не бесплатный, даже если он происходит очень быстро?
  - id: method-call-trap
    en: Why is an ordinary Java method call not a context switch?
    ru: Почему обычный Java method call не является context switch?
  - id: too-many-threads
    en: How can too many runnable threads hurt throughput on a small number of CPU cores?
    ru: Как слишком много runnable threads может ухудшить throughput на малом числе CPU cores?
  - id: thread-pool-connection
    en: How can a ThreadPool reduce unnecessary context switching compared with creating many uncontrolled threads?
    ru: Как ThreadPool может уменьшить лишние context switches по сравнению с созданием множества неконтролируемых threads?
