# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: what-data-generates
    en: What does @Data generate, and which Lombok annotations does it bundle?
    ru: Что генерирует @Data и какие аннотации Lombok она объединяет?
  - id: required-args-constructor
    en: Which constructor does @Data add, and which fields go into it?
    ru: Какой конструктор добавляет @Data и какие поля в него попадают?
  - id: compile-time-mechanism
    en: At what stage does Lombok generate the code, and is there a runtime cost?
    ru: На каком этапе Lombok генерирует код и есть ли затраты во время выполнения?
  - id: data-vs-record-vs-value
    en: When would you use @Data versus a record or Lombok's @Value?
    ru: Когда выбрать @Data, а когда record или @Value от Lombok?
  - id: data-on-jpa-entity
    en: Why is putting @Data on a JPA entity considered dangerous?
    ru: Почему ставить @Data на JPA-сущность считается опасным?
  - id: mutable-key-trap
    en: What goes wrong if a mutable @Data object is used as a key in a HashMap or HashSet?
    ru: Что пойдёт не так, если изменяемый @Data-объект использовать как ключ в HashMap или HashSet?
