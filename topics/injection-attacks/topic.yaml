primitives:
  - BoxGroup

defaultExample: what-injection-is

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: what-injection-is
    title:
      en: 'Data that turns into grammar'
      ru: 'Данные, которые становятся грамматикой'
    file: 01-what-injection-is.java
    explanation:
      en: >
        The whole vulnerability in one query. The endpoint does not change, the
        template does not change, the code path does not change — only the
        characters do, and one of the two inputs contains a character the SQL
        grammar treats as structure. Watch the token row: the safe input
        produces one literal, the payload produces a keyword.
      ru: >
        Вся уязвимость в одном запросе. Эндпоинт не меняется, шаблон не
        меняется, путь исполнения не меняется — меняются только символы, и в
        одном из двух вводов есть символ, который грамматика SQL считает
        структурой. Посмотрите на ряд токенов: безопасный ввод даёт один
        литерал, нагрузка — ключевое слово.
  - id: binding-fixes-it
    title:
      en: 'Parse first, then bind'
      ru: 'Сначала разбор, потом привязка'
    file: 02-binding-fixes-it.java
    explanation:
      en: >
        The same two inputs through a statement with a '?' in it. Note what
        actually changes: nothing is escaped and nothing is filtered — the SQL
        text is a constant, it is parsed before the value exists, and the value
        arrives afterwards through a different part of the protocol. There is
        no moment at which the payload could have become grammar.
      ru: >
        Те же два ввода через запрос с «?». Обратите внимание, что именно
        меняется: ничего не экранируется и ничего не фильтруется — текст SQL
        является константой, он разбирается до появления значения, а значение
        приходит потом, другой частью протокола. Момента, в который нагрузка
        могла бы стать грамматикой, просто нет.
  - id: what-it-buys-the-attacker
    title:
      en: 'Bypass, theft, and a dropped table'
      ru: 'Обход, кража и удалённая таблица'
    file: 03-what-it-buys-the-attacker.java
    explanation:
      en: >
        Three payloads against the same endpoint. A comment marker deletes the
        rest of the statement, so the 'AND active = TRUE' guard disappears and a
        locked account logs in; a UNION returns rows from a table this endpoint
        never mentions; a semicolon starts a second command. Injection is an
        authentication bug as often as it is a data bug.
      ru: >
        Три нагрузки против одного и того же эндпоинта. Маркер комментария
        удаляет остаток запроса, поэтому проверка «AND active = TRUE» исчезает и
        заблокированный аккаунт входит; UNION возвращает строки из таблицы,
        которую этот эндпоинт вообще не упоминает; точка с запятой начинает
        вторую команду. Инъекция — ошибка аутентификации не реже, чем ошибка
        доступа к данным.
  - id: escaping-is-not-the-fix
    title:
      en: 'Why escaping is not the fix'
      ru: 'Почему экранирование — не решение'
    file: 04-escaping-is-not-the-fix.java
    explanation:
      en: >
        Doubling the quotes really does hold inside a quoted literal — and the
        rule is about that one context, so it evaporates the moment the value
        moves. A numeric column is written without quotes, so there is no quote
        to close and nothing for the escaper to do: the payload is already
        standing next to the operators.
      ru: >
        Удвоение кавычек внутри литерала в кавычках действительно работает — но
        правило относится к этому одному контексту и испаряется, как только
        значение переезжает. Числовая колонка пишется без кавычек, поэтому
        закрывать нечего и экранировать нечего: нагрузка уже стоит рядом с
        операторами.
  - id: prepared-in-name-only
    title:
      en: 'A PreparedStatement that binds nothing'
      ru: 'PreparedStatement, который ничего не привязывает'
    file: 05-prepared-in-name-only.java
    explanation:
      en: >
        The trap that survives code review: prepareStatement really is called,
        and the string handed to it was built with a '+' first. Order of
        operations decides everything — by the time the driver sees the
        statement, the value is already SQL text. The protection comes from the
        placeholder, not from the class name.
      ru: >
        Ловушка, которая переживает ревью: prepareStatement действительно
        вызывается, а строку для него сначала собрали через «+». Всё решает
        порядок операций — к моменту, когда драйвер видит запрос, значение уже
        является текстом SQL. Защиту даёт плейсхолдер, а не имя класса.
  - id: identifiers-cannot-be-bound
    title:
      en: 'ORDER BY ? does not exist'
      ru: 'ORDER BY ? не бывает'
    file: 06-identifiers-cannot-be-bound.java
    explanation:
      en: >
        The honest limit of placeholders: a '?' stands for a value, and a column
        name is part of the plan the database needs in order to parse the
        statement at all. So this one is concatenated — and the fix is an
        allowlist, which never repairs the input, it just uses it to choose a
        constant you wrote yourself.
      ru: >
        Честная граница плейсхолдеров: «?» обозначает значение, а имя колонки —
        часть плана, без которого база вообще не разберёт запрос. Поэтому здесь
        действительно конкатенация — а чинится это белым списком, который ввод
        не исправляет, а лишь использует его, чтобы выбрать константу,
        написанную вами.
  - id: bound-and-still-injected
    title:
      en: 'Bound on write, concatenated later'
      ru: 'Привязано при записи, склеено потом'
    file: 07-bound-and-still-injected.java
    explanation:
      en: >
        Two ways a real bind parameter still ends in an injection. The value is
        stored correctly and a later query concatenates the row back out of your
        own database (second-order); and a parameter bound perfectly at the JDBC
        layer is concatenated again inside a stored procedure, one layer deeper
        than anything the driver can see.
      ru: >
        Два способа получить инъекцию при настоящей привязке параметра.
        Значение корректно сохранено, а более поздний запрос склеивает строку,
        прочитанную из вашей же базы (второго порядка); и параметр, идеально
        привязанный на уровне JDBC, снова конкатенируется внутри хранимой
        процедуры — на слой глубже всего, что видит драйвер.
  - id: xxe-same-bug-other-parser
    title:
      en: 'XXE: the same bug in XML'
      ru: 'XXE: та же ошибка в XML'
    file: 08-xxe-same-bug-other-parser.java
    explanation:
      en: >
        No SQL here at all, and it is the same shape: the untrusted document
        declares an entity, and a parser with DTD support switched on goes and
        fetches whatever it points at — a file off disk, or an address only
        reachable from inside your network. The fix is not escaping and not
        binding; it is turning off a parser feature the application never used.
      ru: >
        SQL здесь нет вовсе, а форма та же самая: недоверенный документ
        объявляет сущность, и парсер с включённой поддержкой DTD идёт и
        забирает то, на что она указывает, — файл с диска или адрес, доступный
        только изнутри вашей сети. Чинится это не экранированием и не
        привязкой, а отключением возможности парсера, которой приложение
        никогда не пользовалось.

