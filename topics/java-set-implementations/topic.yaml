id: java-set-implementations
languages: [en, ru]
title:
  en: 'HashSet vs LinkedHashSet vs TreeSet'
  ru: 'HashSet, LinkedHashSet и TreeSet'
category:
  en: 'Java Core / Collections'
  ru: 'Java Core / Коллекции'
type: DATA_STRUCTURE
mode: trace
aiProvider: codex
aiModel: gpt-5.5
summary:
  en: >
    Compare the main Java Set implementations: HashSet for fast membership,
    LinkedHashSet for predictable insertion-order iteration, and TreeSet for
    sorted unique values with Comparator-based rules.
  ru: >
    Сравнение основных реализаций Set в Java: HashSet для быстрого поиска,
    LinkedHashSet для предсказуемой итерации в порядке вставки и TreeSet для
    отсортированных уникальных значений с правилами на основе Comparator.
categoryId: java-collections
difficulty: 2
catalogId: java-collections-12
style: Real world
primitives:
  - ArrayGrid
  - LinkedNodes
defaultExample: basic-order
examples:
  - id: basic-order
    title:
      en: 'Same adds, different order'
      ru: 'Одинаковые add, разный порядок'
    file: 01-basic-order.java
    explanation:
      en: >
        The same values are added to all three Sets. HashSet gives no iteration
        promise, LinkedHashSet keeps insertion order, and TreeSet sorts.
      ru: >
        Одни и те же значения добавляются во все три Set. HashSet не обещает
        порядок итерации, LinkedHashSet сохраняет порядок вставки, а TreeSet
        сортирует.
  - id: duplicate-equality
    title:
      en: 'Duplicate by equality'
      ru: 'Дубликат по equality'
    file: 02-duplicate-equality.java
    explanation:
      en: >
        Adding the exact same value twice leaves one element in every Set.
        HashSet and LinkedHashSet use equals()/hashCode(); TreeSet uses comparison.
      ru: >
        Повторное добавление того же значения оставляет один элемент в каждом
        Set. HashSet и LinkedHashSet используют equals()/hashCode(); TreeSet
        использует сравнение.
  - id: linked-order
    title:
      en: 'LinkedHashSet order'
      ru: 'Порядок LinkedHashSet'
    file: 03-linked-order.java
    explanation:
      en: >
        LinkedHashSet is useful when the caller must see values in insertion
        order while still getting Set uniqueness.
      ru: >
        LinkedHashSet полезен, когда вызывающий код должен видеть значения в
        порядке вставки и при этом получать уникальность Set.
  - id: comparator-duplicate
    title:
      en: 'TreeSet Comparator duplicate'
      ru: 'Дубликат TreeSet по Comparator'
    file: 04-comparator-duplicate.java
    explanation:
      en: >
        A TreeSet with a length Comparator treats two different two-letter
        strings as one element because the Comparator returns 0.
      ru: >
        TreeSet с Comparator по длине считает две разные строки из двух букв
        одним элементом, потому что Comparator возвращает 0.
  - id: null-policy
    title:
      en: 'null handling'
      ru: 'Обработка null'
    file: 05-null-policy.java
    explanation:
      en: >
        HashSet and LinkedHashSet can store one null. A naturally ordered TreeSet
        rejects null because it cannot compare it.
      ru: >
        HashSet и LinkedHashSet могут хранить один null. TreeSet с natural
        ordering отвергает null, потому что не может его сравнить.
  - id: membership-remove
    title:
      en: 'contains and remove'
      ru: 'contains и remove'
    file: 06-membership-remove.java
    explanation:
      en: >
        All Sets answer membership with contains(...) and remove an equivalent
        value with remove(...), but their internal search paths differ.
      ru: >
        Все Set отвечают на вопрос о наличии через contains(...) и удаляют
        эквивалентное значение через remove(...), но внутренние пути поиска
        отличаются.
assistantExample:
  en: 'e.g. When would you choose LinkedHashSet over HashSet or TreeSet?'
  ru: 'например: Когда стоит выбрать LinkedHashSet вместо HashSet или TreeSet?'
missionsFile: quiz.yaml
