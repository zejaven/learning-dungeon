summary:
  en: >
    An unsorted array can only be searched by scanning every element — O(n). Once
    the array is sorted, you can use binary search, which halves the range each
    step and finds (or rejects) any element in O(log n). This topic explains why,
    what sorting itself costs (O(n log n)), and when paying that cost up front
    actually pays off.
  ru: >
    В неотсортированном массиве искать можно только перебором всех элементов — O(n).
    Как только массив отсортирован, можно применить бинарный поиск: он вдвое
    сокращает диапазон на каждом шаге и находит (или отвергает) любой элемент за
    O(log n). Тема объясняет, почему это так, во сколько обходится сама сортировка
    (O(n log n)) и когда платить за неё наперёд действительно выгодно.

