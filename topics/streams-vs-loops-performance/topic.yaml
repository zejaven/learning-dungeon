id: streams-vs-loops-performance
languages: [en, ru]
title:
  en: Streams vs Loops Performance
  ru: Производительность Streams и циклов
category:
  en: Java Core / Streams
  ru: Java Core / Streams
type: OTHER
mode: trace
aiProvider: codex
aiModel: gpt-5.5
categoryId: streams
difficulty: 2
catalogId: streams-2
style: Real world
summary:
  en: >
    Whether Java Streams are faster than ordinary loops, where stream overhead
    comes from, why primitive streams matter, when laziness helps, and why
    parallel streams need measurement instead of faith.
  ru: >
    Становятся ли Java Streams быстрее обычных циклов, откуда берётся overhead
    у stream pipeline, зачем нужны primitive streams, когда laziness помогает и
    почему parallel streams требуют измерений, а не веры.
primitives:
  - ArrayGrid
defaultExample: loop-baseline
examples:
  - id: loop-baseline
    title:
      en: Loop baseline
      ru: Базовый цикл
    file: 01-loop-baseline.java
    explanation:
      en: >
        A plain loop visits each element directly and keeps the control flow in
        one method body.
      ru: >
        Обычный цикл напрямую проходит по каждому элементу и держит весь control
        flow в одном теле метода.
  - id: sequential-stream
    title:
      en: Sequential stream
      ru: Sequential stream
    file: 02-sequential-stream.java
    explanation:
      en: >
        The Stream pipeline is lazy: filter, map, and reduce start only when the
        terminal operation asks for elements.
      ru: >
        Stream pipeline ленивый: filter, map и reduce начинают работать только
        тогда, когда terminal operation запрашивает элементы.
  - id: short-circuit
    title:
      en: Short-circuit
      ru: Short-circuit
    file: 03-short-circuit.java
    explanation:
      en: >
        A terminal operation like findFirst can stop the pipeline early, so not
        every source element has to be processed.
      ru: >
        Terminal operation вроде findFirst может остановить pipeline раньше, и
        обрабатывать все элементы источника не придётся.
  - id: boxing-vs-primitive
    title:
      en: Boxing vs primitive
      ru: Boxing и primitive
    file: 04-boxing-vs-primitive.java
    explanation:
      en: >
        Stream<Integer> carries boxed objects; IntStream keeps numeric work on
        primitive int values.
      ru: >
        Stream<Integer> переносит boxed объекты; IntStream держит числовую
        работу на primitive int значениях.
  - id: parallel-overhead
    title:
      en: Parallel overhead
      ru: Overhead parallel stream
    file: 05-parallel-overhead.java
    explanation:
      en: >
        Parallel-style work must split input and merge partial results, so small
        jobs can lose before useful work starts.
      ru: >
        Parallel-style работа должна разделить вход и объединить partial
        results, поэтому маленькие задачи могут проиграть ещё до полезной
        работы.
assistantExample:
  en: "e.g. Should I replace loops with Streams to make code faster?"
  ru: "например: Нужно ли заменять циклы на Streams, чтобы код стал быстрее?"
missionsFile: quiz.yaml
