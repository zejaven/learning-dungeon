difficulty: 2
catalogId: hibernate-4
style: Real world
summary:
  en: >
    How to map a one-to-many association in JPA for a Person and Cat model:
    the usual child foreign key with @ManyToOne and @OneToMany(mappedBy), a
    unidirectional parent collection with @JoinColumn, and a join-table mapping
    that keeps each child attached to only one parent by adding a UNIQUE
    constraint on the child id in the link table.
  ru: >
    Как замапить связь one-to-many в JPA на примере Person и Cat:
    обычный внешний ключ в дочерней таблице через @ManyToOne и
    @OneToMany(mappedBy), однонаправленную коллекцию родителя через
    @JoinColumn и вариант с промежуточной таблицей, где каждый ребёнок
    остаётся привязан только к одному родителю благодаря UNIQUE-ограничению
    на id ребёнка в link table.

assistantExample:
  en: "e.g. How would you map Person to many Cats through a join table without allowing one Cat to belong to two Persons?"
  ru: "например: Как замапить Person с несколькими Cat через join table, не позволяя одному Cat принадлежать двум Person?"

