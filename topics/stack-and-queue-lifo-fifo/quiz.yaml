missions:
  - id: push-on-stack
    title:
      en: Push onto a stack
      ru: Добавь в stack
    goal:
      en: Run a stack example and add at least one item with push().
      ru: Запусти пример со stack и добавь хотя бы один элемент через push().
    event: STACK_PUSH
  - id: pop-from-stack
    title:
      en: Pop newest item
      ru: Забери новый элемент
    goal:
      en: Run a stack example and remove the newest item with pop().
      ru: Запусти пример со stack и удали самый новый элемент через pop().
    event: STACK_POP
  - id: offer-to-queue
    title:
      en: Offer into a queue
      ru: Добавь в queue
    goal:
      en: Run a queue example and append at least one item with offer().
      ru: Запусти пример с queue и добавь хотя бы один элемент через offer().
    event: QUEUE_OFFER
  - id: poll-from-queue
    title:
      en: Poll oldest item
      ru: Забери старый элемент
    goal:
      en: Run a queue example and remove the oldest item with poll().
      ru: Запусти пример с queue и удали самый старый элемент через poll().
    event: QUEUE_POLL
  - id: peek-next-item
    title:
      en: Peek without removing
      ru: Посмотри без удаления
    goal:
      en: Use peek() to read the next item while keeping it in the structure.
      ru: Используй peek(), чтобы прочитать следующий элемент и оставить его в структуре.
    event: STACK_PEEK

bossFight:
  - id: lifo-vs-fifo
    en: What is the difference between LIFO and FIFO?
    ru: В чем разница между LIFO и FIFO?
  - id: stack-operations
    en: What are the basic stack operations, and which end do they use?
    ru: Какие базовые операции есть у stack и с каким концом они работают?
  - id: queue-operations
    en: What are the basic queue operations, and which ends do they use?
    ru: Какие базовые операции есть у queue и с какими концами они работают?
  - id: practical-uses
    en: Give two real examples where a stack fits and two where a queue fits.
    ru: Приведи два реальных примера, где подходит stack, и два, где подходит queue.
  - id: java-api-choice
    en: Which Java API would you usually use for stack and queue behavior, and why avoid legacy Stack?
    ru: Какой Java API обычно используют для поведения stack и queue и почему стоит избегать legacy Stack?
  - id: complexity-and-traps
    en: What are the usual complexities of push/pop/offer/poll/peek, and what common traps should you mention?
    ru: Какая обычная сложность у push/pop/offer/poll/peek и какие частые ловушки стоит назвать?
