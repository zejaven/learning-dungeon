id: service-stopped-responding
languages: [en, ru]
title:
  en: 'A Service Stops Responding in Production'
  ru: 'Сервис в проде перестал отвечать'
category:
  en: Performance / Diagnostics
  ru: Производительность / Диагностика
type: OTHER
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: performance
difficulty: 3
catalogId: performance-4
summary:
  en: >
    "Not responding" is four different failures wearing the same shirt, and the
    first minute is spent finding out which one you have. Probe outside in with
    the dumbest tools available — DNS, a TCP connect, one curl with an explicit
    timeout, then the same curl from inside the container. A refused connection
    means nothing is listening, so read the exit code and the restart count. An
    accepted connection with no bytes back means the process is alive and no
    thread finishes your handler, which a thread dump answers in one screen. A
    green health endpoint in front of a hanging one is a defect in the check
    itself. Then the hardest habit in the topic: a hung JVM is a crime scene, and
    a restart is simultaneously the correct mitigation and the destruction of all
    the evidence — three thread dumps five seconds apart, a heap histogram and
    the pool gauges cost twenty seconds and are the difference between an answer
    and a rumour. Read the dump by counting, not by reading: the biggest group of
    identical top frames IS the outage — a crowd in a socket read means a missing
    timeout, a crowd BLOCKED on one monitor means contention or a deadlock, a
    crowd waiting on a pool means you ran out of connections, and a crowd RUNNABLE
    with the CPU pinned usually means GC. The arithmetic explains the rest:
    concurrency equals arrival rate times service time, so a dependency going from
    50ms to 8s multiplies the threads you need by 160 while your pool stays at 200.
    Restore service with something reversible, fix both the thing that broke and
    the mechanism that let it take everything with it, verify with the request that
    failed, and leave behind an alert on successful requests rather than on whether
    the process exists. The traps are restarting before capturing, raising limits
    instead of adding timeouts, trusting a health check that touches nothing, and
    closing the incident when the graph turns green.
  ru: >
    «Не отвечает» — это четыре разных сбоя в одной рубашке, и первая минута уходит
    на то, чтобы выяснить, какой из них у вас. Пробуйте снаружи внутрь самыми
    тупыми инструментами: DNS, TCP-соединение, один curl с явным таймаутом, затем
    тот же curl изнутри контейнера. Отказ в соединении означает, что на порту
    никого нет, — читайте код выхода и счётчик перезапусков. Принятое соединение
    без единого байта в ответ означает, что процесс жив и ни один поток не
    доводит до конца ваш обработчик, а это дамп потоков закрывает одним экраном.
    Зелёный health-эндпоинт перед висящим настоящим — дефект самой проверки.
    Дальше самая трудная привычка темы: зависшая JVM — это место преступления, а
    перезапуск одновременно является правильным смягчением и уничтожением всех
    улик; три дампа потоков с интервалом в пять секунд, гистограмма кучи и
    показания пулов стоят двадцати секунд и отделяют ответ от слуха. Дамп читают
    счётом, а не построчно: самая большая группа одинаковых верхних кадров И ЕСТЬ
    авария — толпа в чтении сокета означает отсутствующий таймаут, толпа в BLOCKED
    на одном мониторе — конкуренцию за блокировку или взаимоблокировку, толпа в
    ожидании пула — что кончились соединения, а толпа RUNNABLE с загруженным
    процессором обычно означает GC. Остальное объясняет арифметика: параллелизм
    равен интенсивности прихода, умноженной на время обслуживания, поэтому
    зависимость, ушедшая с 50мс на 8с, умножает нужное число потоков на 160, а ваш
    пул остался равен 200. Восстановите сервис чем-то обратимым, почините и то,
    что сломалось, и механизм, позволивший этому утащить всё остальное, проверьте
    тем запросом, который падал, и оставьте после себя алерт на успешные запросы,
    а не на существование процесса. Ловушки: перезапустить до сбора артефактов,
    поднимать лимиты вместо таймаутов, доверять проверке, которая ничего не
    трогает, и закрывать инцидент, когда график позеленел.

