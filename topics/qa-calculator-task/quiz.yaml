bossFight:
- id: calc-clarifying-questions
  ru: Вам дали задачу «протестируй калькулятор, который только складывает». Какие уточняющие вопросы по требованиям вы зададите до начала написания проверок?
- id: calc-positive-first
  ru: С каких проверок вы начнёте тестирование калькулятора и почему старт с негативных кейсов (-100, +100) оценивается плохо?
- id: calc-boundary-values
  ru: Какие граничные значения вы проверите для входа от -99 до +99? Обоснуйте выбор каждого значения.
- id: calc-minus-one-zero-one
  ru: Проверка -1, 0, 1 — хорошая или плохая? Почему ответ зависит от того, как вы её обосновываете?
- id: calc-single-prod-check
  ru: Если функционал катится в прод, а сделать можно только одну проверку — какую выберете и почему именно позитивную?
- id: calc-x-plus-zero
  ru: Почему проверка X+0 — плохая, если оценивать её как единственную проверку функции сложения?
- id: calc-negative-invalid-input
  ru: Какие проверки невалидного ввода вы предложите и почему «дробь + дробь» в одном кейсе — плохая проверка?
- id: calc-ui-button-and-output
  ru: Какие проверки нужны отдельно для кнопки «равно» и для поля вывода — помимо того, что выводится правильная цифра?
- id: calc-three-vs-four-symbols
  ru: Объясните деталь «3 символа на ввод против 4 на вывод» в задаче про калькулятор и почему за неё плюсуют на собесе.
