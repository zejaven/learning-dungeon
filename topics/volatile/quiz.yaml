missions:
  - id: publish-with-volatile
    title:
      en: Publish with volatile
      ru: Опубликуй через volatile
    goal:
      en: Write ordinary data first, then publish it by writing the volatile ready flag.
      ru: Сначала запиши обычное data, затем опубликуй его записью volatile ready flag.
    event: VOLATILE_WRITE
  - id: acquire-happens-before
    title:
      en: Create happens-before
      ru: Создай happens-before
    goal:
      en: Read the volatile ready flag so the writer's earlier data write becomes visible.
      ru: Прочитай volatile ready flag, чтобы предыдущая запись data у writer стала видимой.
    event: HAPPENS_BEFORE_ESTABLISHED
  - id: show-plain-stale-read
    title:
      en: Show a stale plain read
      ru: Покажи устаревшее обычное чтение
    goal:
      en: Use a non-volatile ready flag and let the reader keep seeing the old local value.
      ru: Используй не-volatile ready flag и дай reader продолжить видеть старое локальное значение.
    event: PLAIN_READ_STALE
  - id: read-data-before-acquire
    title:
      en: Read before acquire
      ru: Прочитай до acquire
    goal:
      en: Read plain data before the volatile read, then compare it with the refreshed value.
      ru: Прочитай обычное data до volatile-чтения, затем сравни с обновлённым значением.
    event: PLAIN_DATA_READ_STALE
  - id: prove-not-atomic
    title:
      en: Prove it is not atomic
      ru: Докажи, что это не atomic
    goal:
      en: Make two threads perform a volatile counter increment from the same old value.
      ru: Сделай так, чтобы два threads выполнили increment volatile counter из одного старого значения.
    event: LOST_UPDATE

bossFight:
  - id: volatile-definition
    en: What does volatile mean in Java?
    ru: Что означает volatile в Java?
  - id: visibility-vs-ordering
    en: Which two main guarantees does volatile give for reads and writes?
    ru: Какие две основные гарантии volatile даёт для чтений и записей?
  - id: happens-before-edge
    en: How does a volatile write relate to a later volatile read of the same variable?
    ru: Как volatile-запись связана с последующим volatile-чтением той же переменной?
  - id: volatile-counter-trap
    en: Why does volatile int count not make count++ thread-safe?
    ru: Почему volatile int count не делает count++ thread-safe?
  - id: volatile-vs-synchronized
    en: When would you use synchronized or AtomicInteger instead of volatile?
    ru: Когда стоит использовать synchronized или AtomicInteger вместо volatile?
  - id: stop-flag-use-case
    en: Why is a simple stop flag a good volatile use case?
    ru: Почему простой stop flag — хороший сценарий для volatile?
  - id: object-publication
    en: What can go wrong if a reference is volatile but the object's later mutations are not protected?
    ru: Что может пойти не так, если reference volatile, но последующие изменения объекта не защищены?
