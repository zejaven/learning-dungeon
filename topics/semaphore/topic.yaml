id: semaphore
languages: [en, ru]
title:
  en: Semaphore in Java
  ru: Семафор в Java
category:
  en: Java Core / Concurrency
  ru: Java Core / Многопоточность
type: CONCURRENCY
mode: trace
summary:
  en: >
    What a Semaphore is, how permits limit concurrent access, how acquire(),
    release(), tryAcquire() and fairness work, why it differs from Lock, and
    when it is useful for throttling or bounded resources.
  ru: >
    Что такое Semaphore, как permits ограничивают одновременный доступ, как
    работают acquire(), release(), tryAcquire() и fairness, чем Semaphore
    отличается от Lock и когда он полезен для throttling или ограниченных
    ресурсов.
categoryId: concurrency
difficulty: 2
catalogId: concurrency-14
style: Real world
aiProvider: codex
aiModel: gpt-5.5

primitives:
  - ArrayGrid
  - LinkedNodes
  - EventLog

defaultExample: two-permits

examples:
  - id: two-permits
    title:
      en: Two available permits
      ru: Два доступных permit
    file: 01-two-permits.java
    explanation:
      en: >
        Two workers acquire two separate permits, so both can enter the guarded
        resource at the same time.
      ru: >
        Два worker получают два отдельных permit, поэтому оба могут одновременно
        войти к защищённому ресурсу.
  - id: queue-when-full
    title:
      en: Queue when full
      ru: Очередь при заполнении
    file: 02-queue-when-full.java
    explanation:
      en: >
        With one permit, T2 cannot enter while T1 holds it. T2 waits until T1
        releases the permit, then receives it.
      ru: >
        При одном permit T2 не может войти, пока его держит T1. T2 ждёт, пока
        T1 освободит permit, а затем получает его.
  - id: try-acquire
    title:
      en: tryAcquire does not wait
      ru: tryAcquire не ждёт
    file: 03-try-acquire.java
    explanation:
      en: >
        tryAcquire() returns immediately. If no permit is available, it fails
        without joining the waiting queue.
      ru: >
        tryAcquire() возвращается сразу. Если доступного permit нет, он
        завершается неудачей и не встаёт в очередь ожидания.
  - id: release-no-owner
    title:
      en: No ownership check
      ru: Нет проверки ownership
    file: 04-release-no-owner.java
    explanation:
      en: >
        Semaphore does not remember a legal owner like Lock does. A different
        thread can call release(), which can accidentally create an extra permit.
      ru: >
        Semaphore не запоминает законного владельца, как Lock. Другой thread
        может вызвать release(), из-за чего случайно появляется лишний permit.
  - id: bulk-permits
    title:
      en: Multiple permits
      ru: Несколько permits
    file: 05-bulk-permits.java
    explanation:
      en: >
        One job can acquire more than one permit. A waiting job is granted only
        when enough permits become available.
      ru: >
        Одна задача может получить больше одного permit. Ожидающая задача
        получает доступ только когда доступно достаточно permits.

assistantExample:
  en: 'e.g. When would you use Semaphore instead of synchronized or Lock?'
  ru: 'например: Когда использовать Semaphore вместо synchronized или Lock?'

missionsFile: quiz.yaml
