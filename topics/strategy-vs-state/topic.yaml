  en: Strategy vs State
  ru: Strategy против State
category:
  en: Design Patterns / Behavioral
  ru: Паттерны проектирования / Поведенческие
type: DESIGN_PATTERN
# Theory topic: a conceptual comparison — explanation + Boss Fight only, no editor.
