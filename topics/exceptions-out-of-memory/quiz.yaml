missions:
  - id: classify-throwable
    title:
      en: Classify Throwable types
      ru: Классифицируй типы Throwable
    goal:
      en: Run an example that shows Error, checked Exception, and unchecked RuntimeException.
      ru: Запусти пример, который показывает Error, checked Exception и unchecked RuntimeException.
    event: TYPE_INFO
  - id: catch-normal-exception
    title:
      en: Catch a normal exception
      ru: Поймай обычное исключение
    goal:
      en: Let a matching catch handle a RuntimeException.
      ru: Дай подходящему catch обработать RuntimeException.
    event: CATCH
  - id: finally-cleanup
    title:
      en: Run cleanup
      ru: Выполни cleanup
    goal:
      en: Trigger a finally block while an exception or Error is leaving a frame.
      ru: Запусти finally, пока исключение или Error покидает фрейм.
    event: FINALLY
  - id: trigger-out-of-memory
    title:
      en: Trigger OutOfMemoryError
      ru: Вызови OutOfMemoryError
    goal:
      en: Use the simulated heap budget to exceed available memory.
      ru: Используй симулированный бюджет heap, чтобы превысить доступную память.
    event: OUT_OF_MEMORY
  - id: release-cache
    title:
      en: Release optional memory
      ru: Освободи необязательную память
    goal:
      en: Release cache memory before retrying bounded work.
      ru: Освободи cache-память перед повтором ограниченной работы.
    event: CACHE_RELEASED
  - id: fail-fast
    title:
      en: Fail fast after fatal Error
      ru: Fail fast после fatal Error
    goal:
      en: Record the decision to stop serving and restart after a fatal Error.
      ru: Зафиксируй решение прекратить обслуживание и перезапуститься после fatal Error.
    event: FAIL_FAST

bossFight:
  - id: throwable-hierarchy
    en: How is Throwable split into Error, checked Exception, and unchecked RuntimeException?
    ru: Как Throwable разделяется на Error, checked Exception и unchecked RuntimeException?
  - id: checked-vs-unchecked-use
    en: When would you choose a checked exception, and when would you choose an unchecked exception?
    ru: Когда выбрать checked exception, а когда unchecked exception?
  - id: error-vs-exception
    en: Why is OutOfMemoryError an Error rather than a regular Exception?
    ru: Почему OutOfMemoryError является Error, а не обычным Exception?
  - id: catch-error-policy
    en: Should application code catch Error or Throwable? Describe the rare boundary case.
    ru: Должен ли прикладной код ловить Error или Throwable? Опиши редкий граничный случай.
  - id: oom-production-response
    en: What should a production Java service do after OutOfMemoryError?
    ru: Что должен сделать production Java-сервис после OutOfMemoryError?
  - id: oom-diagnosis
    en: How would you investigate whether OutOfMemoryError came from a leak, a spike, or too small a heap?
    ru: Как выяснить, пришёл ли OutOfMemoryError из-за утечки, всплеска нагрузки или слишком маленького heap?
