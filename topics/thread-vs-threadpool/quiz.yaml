missions:
  - id: create-new-thread
    title:
      en: Create a new Thread
      ru: Создай новый Thread
    goal:
      en: Run code that creates a brand-new Thread for a single task.
      ru: Запусти код, который создает новый Thread для одной задачи.
    event: THREAD_CREATED_PER_TASK
  - id: create-pool
    title:
      en: Create a pool
      ru: Создай pool
    goal:
      en: Create a fixed ThreadPool with reusable workers and a bounded queue.
      ru: Создай fixed ThreadPool с переиспользуемыми workers и ограниченной очередью.
    event: THREAD_POOL_CREATED
  - id: submit-task
    title:
      en: Submit work
      ru: Отправь работу
    goal:
      en: Submit a task to the ThreadPool instead of constructing a Thread yourself.
      ru: Отправь задачу в ThreadPool вместо ручного создания Thread.
    event: POOL_TASK_SUBMITTED
  - id: queue-task
    title:
      en: Fill the workers
      ru: Займи workers
    goal:
      en: Submit more accepted tasks than there are idle workers, so one task waits in the queue.
      ru: Отправь больше принятых задач, чем есть свободных workers, чтобы одна задача ждала в очереди.
    event: POOL_TASK_QUEUED
  - id: reuse-worker
    title:
      en: Reuse a worker
      ru: Переиспользуй worker
    goal:
      en: Complete one pool task and then observe the same worker taking another task.
      ru: Заверши одну задачу pool и увидь, как тот же worker берет другую задачу.
    event: POOL_WORKER_REUSED
  - id: reject-overload
    title:
      en: Reject overload
      ru: Отклони перегрузку
    goal:
      en: Fill all workers and queue slots, then submit one more task so the pool rejects it.
      ru: Заполни всех workers и места в очереди, затем отправь еще одну задачу, чтобы pool ее отклонил.
    event: POOL_TASK_REJECTED
  - id: shutdown-pool
    title:
      en: Shut down the pool
      ru: Останови pool
    goal:
      en: Call shutdown() so the pool stops accepting new tasks but can finish accepted work.
      ru: Вызови shutdown(), чтобы pool перестал принимать новые задачи, но мог завершить принятую работу.
    event: THREAD_POOL_SHUTDOWN

bossFight:
  - id: core-difference
    en: What is the core difference between creating a Thread directly and submitting work to a ThreadPool?
    ru: В чем главное отличие между прямым созданием Thread и отправкой работы в ThreadPool?
  - id: lifecycle-cost
    en: Why can creating a new Thread for every request become expensive under load?
    ru: Почему создание нового Thread для каждого запроса может стать дорогим под нагрузкой?
  - id: worker-reuse
    en: How does worker reuse in a ThreadPool change throughput and resource usage?
    ru: Как переиспользование workers в ThreadPool влияет на throughput и использование ресурсов?
  - id: queue-and-rejection
    en: What happens when all pool workers are busy, and why should the queue usually be bounded?
    ru: Что происходит, когда все workers в pool заняты, и почему очередь обычно должна быть ограниченной?
  - id: sizing
    en: How would you think about pool size for CPU-bound work versus I/O-bound work?
    ru: Как ты будешь думать о размере pool для CPU-bound работы и I/O-bound работы?
  - id: shutdown
    en: Why is it important to shut down an ExecutorService, and how is shutdown() different from shutdownNow()?
    ru: Почему важно останавливать ExecutorService, и чем shutdown() отличается от shutdownNow()?
  - id: shared-state
    en: Does using a ThreadPool remove the need to protect shared mutable state? Explain.
    ru: Убирает ли использование ThreadPool необходимость защищать общее изменяемое состояние? Объясни.
