# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: what-is-jmm
    en: What does the Java Memory Model define, and why is it needed?
    ru: Что определяет модель памяти Java и зачем она нужна?
  - id: visibility-problem
    en: Explain the visibility problem. Why can a thread keep reading a stale value forever?
    ru: Объясните проблему видимости. Почему поток может бесконечно читать устаревшее значение?
  - id: reordering-problem
    en: What is instruction reordering and how can it surprise another thread?
    ru: Что такое переупорядочивание инструкций и чем оно может удивить другой поток?
  - id: atomicity-problem
    en: Why is count++ not thread-safe, and why doesn't volatile fix it?
    ru: Почему count++ не потокобезопасен и почему volatile его не чинит?
  - id: unsafe-publication
    en: What is unsafe publication, and how can another thread see a half-built object?
    ru: Что такое небезопасная публикация и как другой поток может увидеть недостроенный объект?
  - id: happens-before-fix
    en: How does happens-before solve these problems, and what relationships establish it?
    ru: Как happens-before решает эти проблемы и какие отношения его устанавливают?
  - id: long-double-tearing
    en: Why can a non-volatile long or double be read as a torn value?
    ru: Почему не-volatile long или double может быть прочитан как разорванное значение?
