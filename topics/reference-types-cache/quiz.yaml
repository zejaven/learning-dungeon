# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: strong-ref
    title:
      en: Hold an object strongly
      ru: Удержи объект сильно
    goal:
      en: Create a strong reference to an allocated object.
      ru: Создай сильную ссылку на выделенный объект.
    event: REF_STRONG
  - id: soft-cache
    title:
      en: Build a soft cache
      ru: Сделай мягкий кэш
    goal:
      en: Cache a value behind a soft reference (try the soft-cache example).
      ru: Закэшируй значение за мягкой ссылкой (попробуй пример с мягким кэшем).
    event: REF_SOFT
  - id: collect-it
    title:
      en: Let GC reclaim an object
      ru: Дай GC собрать объект
    goal:
      en: Drop the strong reference and run GC so a weakly-held object is collected.
      ru: Сбрось сильную ссылку и запусти GC, чтобы слабо удерживаемый объект собрался.
    event: REF_COLLECT
  - id: memory-pressure
    title:
      en: Clear the cache under pressure
      ru: Очисти кэш при нехватке памяти
    goal:
      en: Simulate low memory so the soft cache is cleared by the JVM.
      ru: Сымитируй нехватку памяти, чтобы JVM очистил мягкий кэш.
    event: REF_GC_PRESSURE
  - id: phantom-hook
    title:
      en: Register a phantom hook
      ru: Зарегистрируй фантомный хук
    goal:
      en: Create a phantom reference and watch it get enqueued after collection.
      ru: Создай фантомную ссылку и посмотри, как она встаёт в очередь после сборки.
    event: REF_PHANTOM

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: four-strengths
    en: Name the four reference strengths in Java and say what each is for.
    ru: Назови четыре силы ссылок в Java и скажи, для чего нужна каждая.
  - id: soft-cache
    en: How would you build a cache the JVM clears automatically when memory runs low?
    ru: Как сделать кэш, который JVM сам очистит при нехватке памяти?
  - id: soft-vs-weak
    en: What is the difference between a SoftReference and a WeakReference?
    ru: В чём разница между SoftReference и WeakReference?
  - id: weakhashmap
    en: How does WeakHashMap use weak references, and when would you reach for it?
    ru: Как WeakHashMap использует слабые ссылки и когда его стоит применять?
  - id: phantom-vs-finalize
    en: Why prefer a PhantomReference and ReferenceQueue over finalize() for cleanup?
    ru: Почему для очистки лучше PhantomReference с ReferenceQueue, чем finalize()?
  - id: reachability-order
    en: If an object has both a strong and a weak reference, when is it collected?
    ru: Если на объект есть и сильная, и слабая ссылка, когда он будет собран?
