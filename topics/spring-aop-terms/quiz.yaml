# Theory topic: no missions (there is no practice editor) - only a Boss Fight.
bossFight:
  - id: define-six-terms
    en: Explain Aspect, Join Point, Advice, Pointcut, Introduction, and Weaving in Spring AOP.
    ru: Объясните Aspect, Join Point, Advice, Pointcut, Introduction и Weaving в Spring AOP.
  - id: join-point-vs-pointcut
    en: What is the difference between a Join Point and a Pointcut?
    ru: Чем отличается Join Point от Pointcut?
  - id: advice-types
    en: What are the main advice types in Spring AOP, and what makes around advice special?
    ru: Какие основные типы advice есть в Spring AOP и чем особенен around advice?
  - id: spring-method-execution
    en: Why do people say Spring AOP mainly works with method execution join points?
    ru: Почему говорят, что Spring AOP в основном работает с join point выполнения методов?
  - id: introduction-meaning
    en: What does Introduction mean in AOP, and why is it different from advice?
    ru: Что означает Introduction в AOP и почему это не то же самое, что advice?
  - id: weaving-in-spring
    en: What does Weaving mean, and how is Spring AOP weaving different from AspectJ compile-time weaving?
    ru: Что означает Weaving и чем weaving в Spring AOP отличается от compile-time weaving в AspectJ?
  - id: proxy-limitation
    en: How does proxy-based AOP affect self-invocation and direct calls to the target object?
    ru: Как proxy-based AOP влияет на self-invocation и прямые вызовы target object?
