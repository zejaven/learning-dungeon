missions:
  - id: enter-method-frame
    title:
      en: Push a callee frame
      ru: Добавь кадр вызванного метода
    goal:
      en: Run an example that calls another method so a new frame appears on the current thread's stack.
      ru: Запусти пример с вызовом другого метода, чтобы новый кадр появился в стеке текущего потока.
    event: MEM_CALL
  - id: create-callee-local
    title:
      en: Create a local in the callee
      ru: Создай локальную переменную в вызванном методе
    goal:
      en: Add or run code where the called method has its own local variable in its own frame.
      ru: Добавь или запусти код, где у вызванного метода есть своя локальная переменная в своём кадре.
    event: MEM_PRIMITIVE
  - id: return-removes-frame
    title:
      en: Return from the method
      ru: Вернись из метода
    goal:
      en: Let the called method return so its frame and local slots disappear.
      ru: Дай вызванному методу завершиться, чтобы его кадр и локальные слоты исчезли.
    event: MEM_RETURN
  - id: allocate-heap-object
    title:
      en: Keep objects off the stack
      ru: Не помещай объекты в стек
    goal:
      en: Create an object and notice that the stack frame holds only a reference, while the object is on the heap.
      ru: Создай объект и заметь, что кадр стека хранит только ссылку, а сам объект находится в heap.
    event: MEM_NEW
  - id: mutate-shared-object
    title:
      en: Share one heap object
      ru: Раздели один heap-объект
    goal:
      en: Mutate an object through a callee parameter and see that the caller's reference points to the same heap object.
      ru: Измени объект через параметр вызванного метода и увидь, что ссылка вызывающего метода указывает на тот же heap-объект.
    event: MEM_MUTATE

bossFight:
  - id: same-thread-stack
    en: When one Java method calls another on the same thread, do the callee's local variables go into the same stack or a different stack?
    ru: Когда один Java-метод вызывает другой в том же потоке, локальные переменные вызванного метода попадают в тот же стек или в другой?
  - id: new-frame
    en: What is a stack frame, and what is created for every method call?
    ru: Что такое кадр стека и что создаётся при каждом вызове метода?
  - id: frame-contents
    en: What does a method's stack frame usually contain in the JVM mental model?
    ru: Что обычно содержит кадр метода в ментальной модели JVM?
  - id: return-cleanup
    en: What happens to a method's parameters and local variables when the method returns?
    ru: Что происходит с параметрами и локальными переменными метода, когда метод возвращается?
  - id: objects-vs-locals
    en: If a method creates an object with new, is the object itself stored in that method's stack frame?
    ru: Если метод создаёт объект через new, хранится ли сам объект в кадре стека этого метода?
  - id: per-thread-stack
    en: How does the answer change when another Java thread is running code at the same time?
    ru: Как меняется ответ, если другой Java-поток одновременно выполняет код?
