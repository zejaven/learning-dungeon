id: concurrenthashmap-vs-synchronized-map
languages: [en, ru]
title:
  en: ConcurrentHashMap vs synchronized HashMap
  ru: ConcurrentHashMap и синхронизированный HashMap
category:
  en: Java Core / Collections
  ru: Java Core / Коллекции
type: CONCURRENCY
mode: trace
summary:
  en: >
    Why Collections.synchronizedMap guards the whole table with one monitor (so
    even reads serialize), how ConcurrentHashMap instead locks a single bin per
    write and lets reads run lock-free, and when that lock granularity decides
    throughput.
  ru: >
    Почему Collections.synchronizedMap защищает всю таблицу одним monitor (так что
    даже чтения сериализуются), как ConcurrentHashMap вместо этого блокирует один
    bin на запись и пропускает чтения без lock, и когда эта гранулярность lock
    решает throughput.
categoryId: java-collections
difficulty: 2
catalogId: java-collections-9
style: Real world
aiProvider: claude
aiModel: claude-opus-4-8

primitives:
  - ArrayGrid
  - BoxGroup
  - LinkedNodes

defaultExample: sync-global-lock

examples:
  - id: sync-global-lock
    title:
      en: One table-wide lock
      ru: Один lock на всю таблицу
    file: 01-synchronized-global-lock.java
    explanation:
      en: >
        Collections.synchronizedMap wraps every method in one monitor. While T1
        writes, T2 cannot even read a different key — it blocks on the same lock.
      ru: >
        Collections.synchronizedMap оборачивает каждый метод в один monitor. Пока
        T1 пишет, T2 не может даже прочитать другой ключ — он блокируется на том
        же lock.
  - id: parallel-bins
    title:
      en: Parallel writes to different bins
      ru: Параллельные записи в разные bins
    file: 02-parallel-bins.java
    explanation:
      en: >
        ConcurrentHashMap locks one bin per write. "alice" (bin 1) and "bob"
        (bin 4) are written by two threads at the same time, with no contention.
      ru: >
        ConcurrentHashMap блокирует один bin на запись. "alice" (bin 1) и "bob"
        (bin 4) пишутся двумя threads одновременно, без contention.
  - id: same-bin
    title:
      en: Same-bin contention
      ru: Contention в одном bin
    file: 03-same-bin-contention.java
    explanation:
      en: >
        Striping is not free parallelism: "alice" and "carol" both hash to bin 1,
        so the second writer waits — but only for that one bin, not the whole map.
      ru: >
        Striping — это не бесплатная параллельность: "alice" и "carol" попадают в
        bin 1, поэтому второй писатель ждёт — но только этот bin, а не всю map.
  - id: lock-free-read
    title:
      en: Lock-free read
      ru: Чтение без lock
    file: 04-lock-free-read.java
    explanation:
      en: >
        ConcurrentHashMap.get() takes no lock. T2 and T3 read while T1 still
        holds bin 1 — a reader never blocks behind a writer.
      ru: >
        ConcurrentHashMap.get() не берёт lock. T2 и T3 читают, пока T1 ещё держит
        bin 1 — читатель никогда не блокируется за писателем.
  - id: atomic-compute
    title:
      en: Atomic computeIfAbsent
      ru: Атомарный computeIfAbsent
    file: 05-atomic-compute.java
    explanation:
      en: >
        A synchronized map makes single calls atomic, not check-then-put.
        computeIfAbsent locks the bin once around the whole step, so two threads
        racing for one key never lose an update.
      ru: >
        Synchronized map делает атомарными отдельные вызовы, но не check-then-put.
        computeIfAbsent блокирует bin один раз вокруг всего шага, поэтому два
        threads, конкурирующих за один ключ, не теряют update.

assistantExample:
  en: 'e.g. Why does Collections.synchronizedMap serialize reads while ConcurrentHashMap does not?'
  ru: 'например: Почему Collections.synchronizedMap сериализует чтения, а ConcurrentHashMap нет?'

