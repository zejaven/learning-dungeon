# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: interaction-types-overview
    en: What types of interaction between microservices exist? Classify them rather than just listing protocols.
    ru: Какие типы взаимодействия между микросервисами существуют? Классифицируйте их, а не просто перечислите протоколы.
  - id: two-classification-axes
    en: Which two axes classify service interactions, and why is there no natural "synchronous one-to-many" style?
    ru: По каким двум осям классифицируются взаимодействия сервисов и почему естественного стиля «синхронно один ко многим» не существует?
  - id: async-request-reply
    en: How does asynchronous request/reply work over a message broker, and what does correlationId solve?
    ru: Как работает асинхронный request/reply через брокер сообщений и какую задачу решает correlationId?
  - id: queue-vs-pubsub
    en: What is the difference between sending a message to a work queue and publishing to subscribers?
    ru: В чём разница между отправкой сообщения в рабочую очередь и публикацией для подписчиков?
  - id: command-vs-event
    en: How does a command differ from an event, and what goes wrong when a command is published as an event?
    ru: Чем команда отличается от события и что ломается, когда команду публикуют как событие?
  - id: notification-vs-state-transfer
    en: Compare event notification with event-carrying state transfer. When would you pick each?
    ru: Сравните event notification и event-carrying state transfer. Когда выбирать каждый из них?
  - id: streaming-interaction
    en: When is streaming the right interaction style, and how does a replayable log differ from a queue?
    ru: Когда стриминг — правильный стиль взаимодействия и чем перечитываемый лог отличается от очереди?
  - id: shared-database-integration
    en: Is integration through a shared database a valid interaction type? Explain your answer.
    ru: Является ли интеграция через общую базу данных допустимым типом взаимодействия? Обоснуйте ответ.
  - id: orchestration-vs-choreography
    en: What is the difference between orchestration and choreography, and what are the trade-offs of each?
    ru: В чём разница между оркестрацией и хореографией и в чём компромиссы каждого подхода?
  - id: choosing-interaction-style
    en: A service must confirm an order, notify the warehouse, and send an email. Which interaction style would you use for each step and why?
    ru: Сервис должен подтвердить заказ, уведомить склад и отправить письмо. Какой тип взаимодействия вы выберете для каждого шага и почему?
