categoryId: qa-process
categoryName: 'QA Process'
difficulty: 1
summary:
  en: >
    How to write a bug report that actually gets fixed: structure of a good
    report (summary, steps to reproduce, expected vs actual result,
    environment, screenshots, screencasts, logs and stack traces), severity
    and priority fields, defect prioritization, the bug life cycle, and how to
    answer the classic situational question "a critical bug reached
    production — who is to blame and what do we do?"
  ru: >
    Как писать баг-репорт, который реально чинят: структура хорошего репорта
    (заголовок, шаги воспроизведения, ожидаемый и фактический результат,
    окружение, скриншоты, скринкасты, логи и стектрейсы), поля severity и
    priority, приоритизация дефектов, жизненный цикл бага и как отвечать на
    классический ситуационный вопрос «на прод ушёл критический баг — кто
    виноват и что делать?»

assistantExample:
  en: "e.g. What should a good bug report contain, and how do you answer when a critical bug reaches production?"
  ru: "например: Из чего состоит хороший баг-репорт и что отвечать, если на прод ушёл критический баг?"

