id: preflight-requests
title:
  en: 'What Are Preflight Requests'
  ru: 'Что такое предварительные запросы (preflight)'
category:
  en: REST / API Design
  ru: REST / Проектирование API
type: HTTP
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: rest
difficulty: 2
catalogId: rest-9
summary:
  en: >
    A preflight is an extra 'OPTIONS' request the browser sends before a
    cross-origin call it is not already allowed to make. Anything an ordinary
    HTML form could have sent — 'GET', 'HEAD' or 'POST' with only safelisted
    headers — goes straight out; a JSON 'Content-Type', an 'Authorization' or
    custom header, or 'PUT'/'PATCH'/'DELETE' is asked about first. The browser
    sends 'Origin', 'Access-Control-Request-Method' and
    'Access-Control-Request-Headers' (names only, no body, no cookies) and
    demands a 2xx answer listing the method and the headers. If it does not get
    one, the real request is never sent — so unlike a blocked simple request,
    nothing reaches the handler. 'Access-Control-Max-Age' lets one answer serve
    many calls, keyed by path, method, header set and credentials mode. The
    traps: a security filter that answers 'OPTIONS' with 401 produces a CORS
    error that is really an auth bug, and the '*' wildcard covers neither
    'Authorization' nor a request that carries cookies.
  ru: >
    Предварительный запрос (preflight) — это дополнительный запрос 'OPTIONS',
    который браузер отправляет перед кросс-доменным вызовом, на который у него
    ещё нет разрешения. Всё, что могла бы отправить обычная HTML-форма — 'GET',
    'HEAD' или 'POST' только с заголовками из безопасного списка, — уходит
    сразу; про 'Content-Type' с JSON, про 'Authorization' или свой заголовок,
    про 'PUT'/'PATCH'/'DELETE' браузер сначала спрашивает. Он шлёт 'Origin',
    'Access-Control-Request-Method' и 'Access-Control-Request-Headers' (только
    имена, без тела и без кук) и требует ответа 2xx, в котором перечислены
    метод и заголовки. Если ответа нет, настоящий запрос не отправляется вовсе —
    поэтому, в отличие от заблокированного простого запроса, до обработчика не
    доходит ничего. 'Access-Control-Max-Age' позволяет одному ответу обслужить
    много вызовов; ключ — путь, метод, набор заголовков и режим кук. Ловушки:
    фильтр безопасности, отвечающий на 'OPTIONS' кодом 401, даёт ошибку CORS,
    которая на самом деле является ошибкой аутентификации, а подстановочный знак
    '*' не покрывает ни 'Authorization', ни запрос с куками.

