id: spring-aop-basics
title:
  en: Spring AOP and Cross-Cutting Code
  ru: Spring AOP и сквозной код
category:
  en: Spring / AOP
  ru: Spring / AOP
type: SPRING
mode: trace
aiProvider: codex
aiModel: 'gpt-5.5'
categoryId: spring
difficulty: 2
catalogId: manual-10
style: Real world
summary:
  en: >
    What AOP is, why it is useful in Spring, and how an AOP proxy removes
    repeated cross-cutting code such as logging, security checks, metrics, and
    transaction boundaries from business methods.
  ru: >
    Что такое AOP, зачем он нужен в Spring и как AOP proxy убирает повторяющийся
    сквозной код вроде logging, security checks, metrics и transaction boundaries
    из бизнес-методов.

primitives:
  - ArrayGrid
  - LinkedNodes

defaultExample: duplicated-concern

examples:
  - id: duplicated-concern
    title:
      en: Repeated concern
      ru: Повторяющаяся логика
    file: 01-duplicated-concern.java
    explanation:
      en: >
        The same logging concern appears in several service methods. This is the
        duplication AOP is designed to pull out into one reusable advice.
      ru: >
        Один и тот же logging concern появляется в нескольких service methods.
        Именно такое дублирование AOP выносит в один переиспользуемый advice.
  - id: before-advice
    title:
      en: Before advice
      ru: Before advice
    file: 02-before-advice.java
    explanation:
      en: >
        A before advice matches placeOrder, runs first, and then the target
        method keeps only its business steps.
      ru: >
        Before advice подходит к placeOrder, выполняется первым, а target method
        оставляет внутри только бизнес-шаги.
  - id: around-advice
    title:
      en: Around advice
      ru: Around advice
    file: 03-around-advice.java
    explanation:
      en: >
        Around advice wraps the target call, which is how timing, retries, and
        similar logic can run before and after proceed().
      ru: >
        Around advice оборачивает target call: так timing, retries и похожая
        логика могут выполниться до и после proceed().
  - id: after-throwing
    title:
      en: Exception advice
      ru: Advice на exception
    file: 04-after-throwing.java
    explanation:
      en: >
        After-throwing advice reacts when the target method throws, so alerting
        or auditing does not have to be copied into every catch block.
      ru: >
        After-throwing advice реагирует, когда target method бросает exception,
        поэтому alerting или auditing не нужно копировать в каждый catch block.
  - id: pointcut-miss
    title:
      en: Pointcut miss
      ru: Pointcut не подошёл
    file: 05-pointcut-miss.java
    explanation:
      en: >
        A narrow pointcut does not match placeOrder, so the proxy calls the
        target without running that advice.
      ru: >
        Узкий pointcut не подходит к placeOrder, поэтому proxy вызывает target
        без выполнения этого advice.
  - id: direct-bypass
    title:
      en: Bypass the proxy
      ru: Обход proxy
    file: 06-direct-bypass.java
    explanation:
      en: >
        A direct call on the target object bypasses the proxy. Registered advice
        exists, but it never gets a chance to intercept the call.
      ru: >
        Прямой вызов target object обходит proxy. Зарегистрированный advice
        существует, но не получает шанса перехватить вызов.

assistantExample:
  en: 'e.g. How does AOP remove duplicated logging code without changing every service method?'
  ru: 'например: Как AOP убирает дублирующийся logging-код без изменения каждого service method?'

missionsFile: quiz.yaml
