id: java-data-types
title:
  en: Java Data Types and How They Work
  ru: Типы данных в Java и как они работают
category:
  en: Java Core
  ru: Java Core
type: DATA_STRUCTURE
mode: trace
aiProvider: claude
aiModel: claude-opus-4-8
categoryId: java-core
difficulty: 1
catalogId: java-core-8
style: Real world
summary:
  en: >
    Java has two families of types: eight primitives (byte, short, int, long,
    float, double, char, boolean) that store a value directly with a fixed size
    and range, and reference types that hold a handle to a heap object and can be
    null. From that split follow integer overflow, char as a number, inexact
    floating point, widening vs narrowing conversions, autoboxing, the Integer
    cache, and default values.
  ru: >
    В Java два семейства типов: восемь примитивов (byte, short, int, long, float,
    double, char, boolean), которые хранят значение напрямую с фиксированным
    размером и диапазоном, и ссылочные типы, которые держат указатель на объект в
    куче и могут быть null. Отсюда следуют переполнение целых, char как число,
    неточная плавающая точка, расширение против сужения, автоупаковка, кэш Integer
    и значения по умолчанию.

# Visual primitives this topic's visualizer composes (frontend).
# This topic renders its own typed-slot layout, so it composes no shared primitive.
primitives: []

defaultExample: primitive-types

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: primitive-types
    title:
      en: The eight primitives
      ru: Восемь примитивов
    file: 01-primitive-types.java
    explanation:
      en: >
        Declares all eight primitive types plus one reference type. Each
        primitive carries a fixed size in bits and a value range; a reference
        (String) holds a handle to a heap object instead.
      ru: >
        Объявляет все восемь примитивных типов плюс один ссылочный. Каждый
        примитив несёт фиксированный размер в битах и диапазон значений; ссылка
        (String) вместо этого держит указатель на объект в куче.
  - id: overflow
    title:
      en: Integer overflow
      ru: Переполнение int
    file: 02-overflow.java
    explanation:
      en: >
        An int is a fixed 32-bit box. At Integer.MAX_VALUE adding 1 has nowhere
        to go, so it wraps around to Integer.MIN_VALUE instead of growing.
      ru: >
        int — это фиксированный 32-битный ящик. На Integer.MAX_VALUE прибавление 1
        некуда деть, поэтому значение заворачивается в Integer.MIN_VALUE, а не
        растёт.
  - id: char-is-a-number
    title:
      en: char is a number
      ru: char — это число
    file: 03-char-is-a-number.java
    explanation:
      en: >
        char is an unsigned 16-bit code, not a letter: 'A' is 65. Arithmetic on a
        char promotes it to int, so 'A' + 1 is the int 66.
      ru: >
        char — это беззнаковый 16-битный код, а не буква: 'A' равно 65. Арифметика
        над char повышает его до int, поэтому 'A' + 1 — это int 66.
  - id: floating-point
    title:
      en: Inexact floating point
      ru: Неточная плавающая точка
    file: 04-floating-point.java
    explanation:
      en: >
        double stores numbers in binary, and 0.1 has no exact binary form. So
        0.1 + 0.2 is 0.30000000000000004, not 0.3 — never use double for money.
      ru: >
        double хранит числа в двоичном виде, а у 0.1 нет точной двоичной формы.
        Поэтому 0.1 + 0.2 даёт 0.30000000000000004, а не 0.3 — никогда не считайте
        деньги в double.
  - id: widening-narrowing
    title:
      en: Widening vs narrowing
      ru: Расширение против сужения
    file: 05-widening-narrowing.java
    explanation:
      en: >
        Widening (int -> long) is implicit and lossless. Narrowing (long -> byte)
        needs an explicit cast and can silently lose data: (byte) 300 is 44.
      ru: >
        Расширение (int -> long) неявное и без потерь. Сужение (long -> byte)
        требует явного приведения и может тихо потерять данные: (byte) 300 — это 44.
  - id: autoboxing
    title:
      en: Autoboxing and the Integer cache
      ru: Автоупаковка и кэш Integer
    file: 06-autoboxing.java
    explanation:
      en: >
        Autoboxing wraps an int into an Integer object on the heap. Integer.valueOf
        caches -128..127, so == is true there but false for larger values — compare
        wrappers with equals().
      ru: >
        Автоупаковка оборачивает int в объект Integer в куче. Integer.valueOf
        кэширует -128..127, поэтому == там true, но false для больших значений —
        сравнивайте обёртки через equals().
  - id: default-values
    title:
      en: Default values
      ru: Значения по умолчанию
    file: 07-default-values.java
    explanation:
      en: >
        An unassigned field gets a default: primitives are zero/false, reference
        types are null. (Local variables get no default and must be assigned.)
      ru: >
        Неинициализированное поле получает значение по умолчанию: примитивы —
        ноль/false, ссылочные типы — null. (Локальные переменные значения по
        умолчанию не получают и должны быть присвоены.)

