# Theory topic: no missions because there is no practice editor.
bossFight:
  - id: core-difference
    en: 'What is the core difference between @Bean and @Component?'
    ru: 'В чём основное отличие между @Bean и @Component?'
  - id: registration-path
    en: 'How does Spring discover a @Component, and how does it register a @Bean method result?'
    ru: 'Как Spring находит @Component и как он регистрирует результат метода @Bean?'
  - id: choosing-component
    en: 'When is @Component the better choice?'
    ru: 'Когда @Component будет лучшим выбором?'
  - id: choosing-bean
    en: 'When is @Bean the better choice?'
    ru: 'Когда @Bean будет лучшим выбором?'
  - id: lifecycle-and-injection
    en: 'After registration, do @Bean and @Component objects differ in lifecycle or dependency injection?'
    ru: 'После регистрации отличаются ли объекты из @Bean и @Component по lifecycle или dependency injection?'
  - id: common-traps
    en: 'What common mistakes happen when developers mix @Bean and @Component?'
    ru: 'Какие частые ошибки возникают, когда разработчики смешивают @Bean и @Component?'
