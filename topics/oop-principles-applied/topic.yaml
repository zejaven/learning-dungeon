id: oop-principles-applied
languages: [en, ru]
title:
  en: OOP Principles in Practice
  ru: Принципы ООП на практике
category:
  en: OOP / Design
  ru: OOP / Проектирование
type: OTHER
# Structural topic: a multi-file project analyzed into a class diagram (no run).
mode: structural
aiProvider: claude
aiModel: claude-opus-4-8
categoryId: oop-design
difficulty: 1
catalogId: oop-design-2
style: Real world
summary:
  en: >
    Show your understanding of OOP by building a tiny notification system instead
    of just naming the four pillars. You define an abstraction (a Notifier
    interface), make it polymorphic with two implementations, specialize one with
    inheritance, and let a service compose the abstraction. The class diagram and
    missions track that each principle is actually expressed in the design.
  ru: >
    Покажи понимание ООП, собрав крошечную систему уведомлений, а не просто назвав
    четыре столпа. Ты задаёшь абстракцию (интерфейс Notifier), делаешь её
    полиморфной двумя реализациями, специализируешь одну через наследование и даёшь
    сервису композировать абстракцию. Диаграмма классов и миссии следят за тем, что
    каждый принцип действительно выражен в дизайне.

# Example question pre-filled as the Ask AI placeholder.
assistantExample:
  en: "e.g. Which OOP principle does each class in this design demonstrate?"
  ru: "например: Какой принцип ООП демонстрирует каждый класс в этом дизайне?"

missionsFile: quiz.yaml
