id: concurrent-modification
languages: [en, ru]
title:
  en: ConcurrentModificationException and Safe Collection Changes
  ru: ConcurrentModificationException и безопасное изменение коллекций
category:
  en: Java Core / Concurrency
  ru: Java Core / Многопоточность
type: CONCURRENCY
mode: trace
summary:
  en: >
    Why a fail-fast iterator throws ConcurrentModificationException when a
    collection changes structurally during iteration, how modCount detects it,
    and how to modify a shared collection safely with Iterator.remove and
    CopyOnWriteArrayList.
  ru: >
    Почему fail-fast iterator бросает ConcurrentModificationException, когда
    коллекция структурно меняется во время итерации, как modCount это
    обнаруживает и как безопасно изменять разделяемую коллекцию через
    Iterator.remove и CopyOnWriteArrayList.
categoryId: concurrency
difficulty: 2
catalogId: concurrency-15
style: Real world
aiProvider: claude
aiModel: claude-opus-4-8

primitives:
  - ArrayGrid
  - EventLog

defaultExample: concurrent-modification

examples:
  - id: build-and-iterate
    title:
      en: Iterate cleanly
      ru: Чистая итерация
    file: 01-build-and-iterate.java
    explanation:
      en: >
        A fail-fast ArrayList iterated from start to finish without any
        structural change. modCount stays equal to expectedModCount the whole way.
      ru: >
        Fail-fast ArrayList, который итерируется от начала до конца без
        структурных изменений. modCount всё время равен expectedModCount.
  - id: concurrent-modification
    title:
      en: Trigger the exception
      ru: Вызови исключение
    file: 02-concurrent-modification.java
    explanation:
      en: >
        Adding an element while an iterator is active bumps modCount. The next
        call to next() sees the mismatch and throws ConcurrentModificationException.
      ru: >
        Добавление элемента при активном iterator увеличивает modCount.
        Следующий next() видит расхождение и бросает ConcurrentModificationException.
  - id: iterator-remove
    title:
      en: Remove safely (single thread)
      ru: Удаляй безопасно (один поток)
    file: 03-iterator-remove.java
    explanation:
      en: >
        Iterator.remove() removes the current element AND updates expectedModCount,
        so the iterator stays valid. This is the correct single-threaded way to
        delete while looping.
      ru: >
        Iterator.remove() удаляет текущий элемент И обновляет expectedModCount,
        поэтому iterator остаётся валидным. Это правильный способ удалять во
        время цикла в одном потоке.
  - id: copy-on-write
    title:
      en: CopyOnWriteArrayList
      ru: CopyOnWriteArrayList
    file: 04-copy-on-write.java
    explanation:
      en: >
        A CopyOnWriteArrayList iterator reads a frozen snapshot. A write copies
        the whole backing array, so iteration never throws even though the list
        changed underneath it.
      ru: >
        Iterator у CopyOnWriteArrayList читает замороженный snapshot. Запись
        копирует весь backing array, поэтому итерация не бросает исключение,
        хотя список под ней изменился.
  - id: shared-between-threads
    title:
      en: Shared between threads
      ru: Разделяемый между потоками
    file: 05-shared-between-threads.java
    explanation:
      en: >
        A Writer thread mutates a CopyOnWriteArrayList while a Reader thread
        iterates it. The reader sees a stable snapshot and never needs a lock.
      ru: >
        Поток Writer изменяет CopyOnWriteArrayList, пока поток Reader его
        итерирует. Reader видит стабильный snapshot и не нуждается в блокировке.

