id: observer
languages: [en, ru]
title:
  en: Observer Pattern
  ru: Паттерн Observer
category:
  en: Design Patterns / Behavioral
  ru: Паттерны проектирования / Поведенческие
type: DESIGN_PATTERN
mode: structural
aiProvider: codex
aiModel: gpt-5.5
categoryId: design-patterns
difficulty: 2
catalogId: design-patterns-6
style: Real world
summary:
  en: >
    Observer defines a one-to-many relationship: a publisher keeps subscribers
    through an interface and notifies them when something changes. In this
    structural practice you build a news publisher, two subscriber
    implementations, and the association that lets the publisher broadcast
    updates without depending on concrete subscriber classes.
  ru: >
    Observer задаёт связь «один ко многим»: publisher хранит subscribers через
    интерфейс и уведомляет их, когда что-то меняется. В этой структурной
    практике вы строите news publisher, две реализации subscriber и связь,
    которая позволяет publisher рассылать updates без зависимости от конкретных
    классов subscriber.

