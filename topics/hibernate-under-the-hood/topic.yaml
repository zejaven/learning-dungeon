summary:
  en: >
    What Hibernate does beyond mapping Java classes to tables: the JPA provider
    implementation, metadata model, persistence context, first-level cache,
    dirty checking, flush, lazy proxies, SQL generation, transaction integration,
    optional caches, batching, and production risks such as N+1 queries.
  ru: >
    Что Hibernate делает кроме маппинга Java-классов на таблицы: реализация JPA
    provider, модель метаданных, Persistence Context, кэш первого уровня,
    dirty checking, flush, lazy proxies, генерация SQL, интеграция с
    транзакциями, опциональные кэши, batching и производственные риски вроде N+1.

