summary:
  en: >
    There is no universally preferable interaction style between services.
    Synchronous calls fit immediate reads and decisions, while asynchronous
    messaging fits delayed work, event fan-out, buffering and resilience. The
    real interview answer is to choose by business timing, consistency needs,
    failure handling and operational complexity.
  ru: >
    Универсально предпочтительного способа взаимодействия между сервисами нет.
    Синхронные вызовы подходят для немедленных чтений и решений, а асинхронные
    сообщения - для отложенной работы, рассылки событий, сглаживания нагрузки и
    устойчивости. Правильный ответ на интервью - выбирать по бизнес-срокам,
    требованиям к согласованности, обработке сбоев и операционной сложности.

