# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: jdk-proxy
    title:
      en: Build a JDK dynamic proxy
      ru: Сделай JDK dynamic proxy
    goal:
      en: Proxy a bean that implements an interface and watch Spring pick a JDK dynamic proxy.
      ru: Создай proxy для bean с interface и увидь, как Spring выбирает JDK dynamic proxy.
    event: PROXY_JDK_SELECTED
  - id: cglib-proxy
    title:
      en: Build a CGLIB proxy
      ru: Сделай CGLIB proxy
    goal:
      en: Proxy a bean with no interface so Spring falls back to a CGLIB subclass.
      ru: Создай proxy для bean без interface, чтобы Spring переключился на подкласс CGLIB.
    event: PROXY_CGLIB_SELECTED
  - id: invoke-through-proxy
    title:
      en: Call through the proxy
      ru: Вызови через proxy
    goal:
      en: Invoke a method so the proxy intercepts the call, runs advice, and delegates to the target.
      ru: Вызови метод, чтобы proxy перехватил вызов, выполнил advice и делегировал target.
    event: PROXY_DELEGATE
  - id: final-method-trap
    title:
      en: Hit the final-method trap
      ru: Поймай ловушку final-метода
    goal:
      en: Make a CGLIB proxy invoke a final method and see it run unadvised.
      ru: Заставь CGLIB proxy вызвать final-метод и увидь, что он выполняется без advice.
    event: PROXY_FINAL_METHOD_SKIPPED

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: jdk-vs-cglib-difference
    en: What is the core difference between a JDK dynamic proxy and a CGLIB proxy?
    ru: В чём принципиальная разница между JDK dynamic proxy и CGLIB proxy?
  - id: when-spring-picks-each
    en: When does Spring use a JDK dynamic proxy and when does it use CGLIB?
    ru: Когда Spring использует JDK dynamic proxy, а когда CGLIB?
  - id: proxy-target-class
    en: What does proxyTargetClass=true do, and what is the Spring Boot default?
    ru: Что делает proxyTargetClass=true и какое поведение по умолчанию в Spring Boot?
  - id: final-limitations
    en: Why can a final class or final method break a CGLIB proxy?
    ru: Почему final-класс или final-метод могут сломать CGLIB proxy?
  - id: jdk-interface-cast
    en: Why does casting a JDK-proxied bean to its concrete class throw a ClassCastException?
    ru: Почему приведение JDK-проксированного bean к конкретному классу бросает ClassCastException?
  - id: self-invocation
    en: Both proxy types share one limitation around self-invocation — what is it?
    ru: У обоих типов proxy есть общее ограничение с self-invocation — какое?
