id: spring-config-property-precedence
title:
  en: 'application.properties vs Environment Variables: Which Wins'
  ru: 'application.properties или переменные окружения: что победит'
category:
  en: DevOps / Configuration
  ru: DevOps / Конфигурация
type: SPRING
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: devops
difficulty: 2
catalogId: devops-2
summary:
  en: >
    The environment variable wins. The reason is worth more than the answer: a
    Spring Boot Environment is an ordered list of property sources, and
    'getProperty' returns the FIRST value it finds walking that list from the
    top. Environment variables sit above both copies of application.properties
    (the one packaged in the jar and the one next to it), so a variable
    overrides the file without editing, rebuilding or redeploying anything —
    which is exactly why the same image can run in staging and production.
    Above the environment there are three more rungs you can reach at deploy
    time — command line arguments, 'SPRING_APPLICATION_JSON' and '-D' system
    properties — and below the files there are two that surprise people:
    '@PropertySource' and 'setDefaultProperties' both lose to
    application.properties. The details that turn a right answer into a good
    one are relaxed binding ('SPRING_DATASOURCE_URL' binds to
    'spring.datasource.url', which is why 'System.getenv' behaves differently
    from the Environment), the fact that overriding is per KEY and not per
    file, and that a profile-specific file is not a lower-priority file but one
    that does not exist until its profile is active.
  ru: >
    Побеждает переменная окружения. Причина здесь важнее самого ответа:
    Environment в Spring Boot — это упорядоченный список источников свойств, а
    'getProperty' возвращает ПЕРВОЕ значение, найденное при обходе списка
    сверху. Переменные окружения стоят выше обеих копий application.properties
    (той, что упакована в jar, и той, что лежит рядом), поэтому переменная
    перебивает файл, ничего не редактируя, не пересобирая и не передеплоивая —
    именно поэтому один и тот же образ работает и на staging, и в проде. Выше
    окружения есть ещё три ступени, доступные при запуске: аргументы командной
    строки, 'SPRING_APPLICATION_JSON' и системные свойства '-D'. Ниже файлов
    есть две, которые всех удивляют: и '@PropertySource', и
    'setDefaultProperties' проигрывают application.properties. Детали, которые
    превращают верный ответ в хороший, — это relaxed binding
    ('SPRING_DATASOURCE_URL' связывается с 'spring.datasource.url', поэтому
    'System.getenv' ведёт себя иначе, чем Environment), тот факт, что
    переопределение работает по КЛЮЧУ, а не по файлу, и то, что файл профиля —
    это не файл с меньшим приоритетом, а файл, которого не существует, пока
    профиль не активен.

