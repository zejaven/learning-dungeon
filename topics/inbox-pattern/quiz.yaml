# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: process-first
    title:
      en: Process your first message
      ru: Обработай первое сообщение
    goal:
      en: Run the code and process at least one new message into the inbox.
      ru: Запусти код и обработай хотя бы одно новое сообщение в inbox.
    event: MESSAGE_PROCESSED
  - id: catch-duplicate
    title:
      en: Catch a redelivery
      ru: Поймай повторную доставку
    goal:
      en: Deliver the same message id twice so the second one is deduplicated.
      ru: Доставь один и тот же id сообщения дважды, чтобы второй был отброшен.
    event: DUPLICATE_SKIPPED
  - id: retention-trap
    title:
      en: Trip the retention trap
      ru: Сработай на ловушке ретенции
    goal:
      en: Purge the inbox and watch a late redelivery get reprocessed.
      ru: Очисти inbox и посмотри, как поздняя повторная доставка снова обработается.
    event: INBOX_CLEANUP

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  en:
    - What problem does the Inbox pattern solve, and what delivery guarantee does it assume?
    - Why must the dedup record and the business work share one local transaction?
    - What is the right idempotency key — the message id or the payload, and why?
    - How does the Inbox pattern relate to the Outbox pattern?
    - How do you stop the inbox table from growing forever, and what is the risk?
    - The Inbox pattern gives "effectively-once" — why is true exactly-once delivery impossible?
  ru:
    - Какую проблему решает паттерн Inbox и какую гарантию доставки он предполагает?
    - Почему запись дедупликации и бизнес-работа должны быть в одной локальной транзакции?
    - Какой ключ идемпотентности правильный — id сообщения или payload, и почему?
    - Как паттерн Inbox связан с паттерном Outbox?
    - Как не дать таблице inbox расти бесконечно и в чём риск?
    - Inbox даёт «effectively-once» — почему настоящая доставка exactly-once невозможна?
