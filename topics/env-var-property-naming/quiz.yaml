# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: derive-the-name
    title:
      en: Derive the variable name
      ru: Выведи имя переменной
    goal:
      en: Convert a property name into the environment variable that overrides it, one rule at a time.
      ru: Преобразуй имя свойства в переменную окружения, которая его переопределяет, по одному правилу за шаг.
    event: ENV_NAME_DERIVED
  - id: beat-the-file
    title:
      en: Beat application.properties
      ru: Победи application.properties
    goal:
      en: Export the derived name and watch the application read the variable instead of the file.
      ru: Экспортируй выведенное имя и посмотри, как приложение читает переменную вместо файла.
    event: BINDING_MATCHED
  - id: write-it-down
    title:
      en: Write the variable down
      ru: Запиши переменную
    goal:
      en: 'Show the same variable in a shell, in docker run, in Compose and in a Kubernetes manifest.'
      ru: 'Покажи одну и ту же переменную в оболочке, в docker run, в Compose и в манифесте Kubernetes.'
    event: DEPLOYMENT_FORMS
  - id: miss-with-a-typo
    title:
      en: Get the name wrong
      ru: Ошибись в имени
    goal:
      en: Export a name that is nearly right and see how loudly the application complains.
      ru: Экспортируй почти правильное имя и посмотри, насколько громко приложение возмутится.
    event: BINDING_MISSED
  - id: spot-the-near-miss
    title:
      en: Spot the near miss
      ru: Найди почти совпадение
    goal:
      en: Leave a variable in the environment that a human reads as correct and Spring reads as absent.
      ru: Оставь в окружении переменную, которую человек читает как правильную, а Spring — как отсутствующую.
    event: NEAR_MISS
  - id: index-a-list
    title:
      en: Override one list element
      ru: Переопредели элемент списка
    goal:
      en: 'Name the variable for job.targets[0].url and find out what happens to the rest of the list.'
      ru: 'Назови переменную для job.targets[0].url и выясни, что произойдёт с остальным списком.'
    event: LIST_BINDING
  - id: ask-the-os
    title:
      en: Ask the OS directly
      ru: Спроси у ОС напрямую
    goal:
      en: 'Call System.getenv with the dotted key and compare it with what Spring returns: the conversion belongs to the framework, not to the JVM.'
      ru: 'Вызови System.getenv с ключом через точки и сравни с тем, что вернёт Spring: преобразование принадлежит фреймворку, а не JVM.'
    event: SYSTEM_GETENV
  - id: draw-the-table
    title:
      en: Print the whole table
      ru: Выведи всю таблицу
    goal:
      en: Report every property with its canonical variable name and the place its value came from.
      ru: Выведи каждое свойство с его каноническим именем переменной и местом, откуда пришло значение.
    event: NAMING_REPORT

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: name-for-job-timeout
    en: You need to override the property job.timeout without rebuilding the application. What will the environment variable look like, and what is the rule you applied?
    ru: Нужно переопределить свойство job.timeout, не пересобирая приложение. Как будет выглядеть переменная окружения и по какому правилу ты её получил?
  - id: why-not-dots
    en: Why can the variable not simply be called job.timeout? What restricts the name?
    ru: Почему переменную нельзя просто назвать job.timeout? Что ограничивает имя?
  - id: dash-rule
    en: What is the variable name for spring.jpa.hibernate.ddl-auto? Explain what happens to the dash and why it is not turned into an underscore.
    ru: Как называется переменная для spring.jpa.hibernate.ddl-auto? Объясни, что происходит с дефисом и почему он не превращается в подчёркивание.
  - id: direction-of-conversion
    en: Does Spring convert the variable name into a property name, or the property name into a variable name? What follows from the direction you chose?
    ru: Spring преобразует имя переменной в имя свойства или имя свойства в имя переменной? Что следует из выбранного тобой направления?
  - id: getenv-null
    en: In a running application environment.getProperty("job.timeout") returns a value while System.getenv("job.timeout") returns null. Explain.
    ru: В работающем приложении environment.getProperty("job.timeout") возвращает значение, а System.getenv("job.timeout") — null. Объясни почему.
  - id: silent-typo
    en: A colleague set JOB_TIMOUT instead of JOB_TIMEOUT in the deployment. What does the application do at startup, and how would you find the problem?
    ru: Коллега задал в деплое JOB_TIMOUT вместо JOB_TIMEOUT. Что сделает приложение при старте и как ты будешь искать проблему?
  - id: list-element
    en: How do you override job.targets[0].url with an environment variable, and what happens to job.targets[1] afterwards?
    ru: Как переопределить job.targets[0].url переменной окружения и что после этого произойдёт с job.targets[1]?
  - id: value-conversion
    en: The variable holds the string "30s" and the field is a Duration. Who converts the value, and when does that conversion fail?
    ru: В переменной лежит строка «30s», а поле имеет тип Duration. Кто преобразует значение и в какой момент это преобразование падает?
  - id: needs-a-key-first
    en: Does the key have to exist in application.properties before an environment variable can set it? Does the answer differ for @Value and @ConfigurationProperties?
    ru: Должен ли ключ существовать в application.properties, чтобы переменная окружения могла его задать? Отличается ли ответ для @Value и @ConfigurationProperties?
  - id: not-env-vars
    en: How do --job.timeout=30s and -Djob.timeout=30s differ from JOB_TIMEOUT=30s in spelling and in priority?
    ru: Чем --job.timeout=30s и -Djob.timeout=30s отличаются от JOB_TIMEOUT=30s по написанию и по приоритету?
  - id: k8s-manifest
    en: Write the Kubernetes fragment that overrides job.timeout for one deployment. What is easy to get wrong in that YAML?
    ru: Напиши фрагмент Kubernetes, который переопределяет job.timeout для одного деплоя. В чём в этом YAML легко ошибиться?
  - id: verify-it-worked
    en: You have set the variable and the application is running. How do you check that the value actually arrived, and which source it came from?
    ru: Ты задал переменную, приложение работает. Как проверить, что значение действительно доехало, и из какого источника оно пришло?
  - id: changed-after-start
    en: The variable is changed while the application is running. Does the application see the new value? What would make it?
    ru: Переменную изменили, пока приложение работает. Увидит ли оно новое значение? Что нужно, чтобы увидело?
  - id: awkward-keys
    en: A key contains characters an environment variable name cannot express, for example a map key like app.headers.x-trace-id. What do you do?
    ru: В ключе есть символы, которые нельзя выразить в имени переменной окружения, например ключ map вроде app.headers.x-trace-id. Что делать?
  - id: name-collisions
    en: Can two different property names produce the same environment variable name? What does that mean for how you name your own properties?
    ru: Могут ли два разных имени свойств дать одно и то же имя переменной окружения? Что это значит для того, как называть собственные свойства?
  - id: prefix-conventions
    en: Why do teams prefix their own properties (job.*, app.*) instead of using bare names like timeout? Answer in terms of environment variables.
    ru: Почему команды делают собственным свойствам префикс (job.*, app.*) вместо голых имён вроде timeout? Ответь с точки зрения переменных окружения.
  - id: secrets-in-variables
    en: A database password arrives as an environment variable. What are the drawbacks of that, and what would you use instead?
    ru: Пароль от базы приходит в переменной окружения. Какие у этого недостатки и что бы ты использовал вместо неё?
  - id: local-vs-deployment
    en: How do you set the same override on your laptop for one run, in docker-compose and in a CI pipeline? Which of them survives a restart of the process?
    ru: Как задать то же переопределение на ноутбуке для одного запуска, в docker-compose и в CI? Какое из них переживёт перезапуск процесса?
