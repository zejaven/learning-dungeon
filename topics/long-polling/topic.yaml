id: long-polling
title:
  en: 'Long Polling vs a Regular HTTP Request'
  ru: 'Длинный опрос против обычного HTTP-запроса'
category:
  en: Networking / Real-Time
  ru: Сети / Реальное время
type: HTTP
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: networking
difficulty: 2
catalogId: networking-2
summary:
  en: >
    A regular HTTP request is a closed loop: the client asks, the handler runs,
    the response is written, the request is over — and "nothing new" is an answer
    too, paid for with a full round trip. Long polling changes exactly one thing
    about that loop: when the response is written. Same method, same URL, same
    headers, same status codes, same proxies; the handler just does not return
    while it has nothing to say. It parks the request and completes it the instant
    news exists, or answers empty on purpose before its hold window outlives
    somebody else''s idle timeout. Nothing new appears on the wire — the waiting
    moves from the client''s timer to the server, and that is where the bill
    arrives: a parked request is server-side state, so written with a blocking
    handler it costs a thread per idle client, and written with a DeferredResult
    it costs a socket. The subtler half is the gap: a response ends its request,
    so anything happening before the next one is opened is only recoverable if the
    client sends a cursor.
  ru: >
    Обычный HTTP-запрос — замкнутый цикл: клиент спросил, обработчик отработал,
    ответ записан, запрос завершён, — и «ничего нового» тоже ответ, оплаченный
    полным обменом. Длинный опрос меняет в этом цикле ровно одно: момент, когда
    записывается ответ. Тот же метод, тот же URL, те же заголовки, те же коды
    состояния, те же прокси; обработчик просто не возвращает управление, пока ему
    нечего сказать. Он паркует запрос и завершает его в момент появления новости —
    или намеренно отвечает пустым, чтобы его окно удержания не пережило чей-то
    таймаут простоя. На проводе не появляется ничего нового: ожидание переезжает с
    таймера клиента на сервер, и именно там приходит счёт. Припаркованный запрос —
    это состояние на сервере: с блокирующим обработчиком он стоит потока на каждого
    простаивающего клиента, а с DeferredResult — сокета. Более тонкая половина
    темы — промежуток: ответ завершает свой запрос, поэтому всё, что произошло до
    открытия следующего, восстановимо только если клиент присылает курсор.

