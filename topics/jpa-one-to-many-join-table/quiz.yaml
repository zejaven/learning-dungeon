# Theory topic: no missions, only a Boss Fight.
bossFight:
  - id: normal-fk-mapping
    en: 'How do you map a normal one-to-many association between Person and Cat when the foreign key lives in the cat table?'
    ru: 'Как замапить обычную связь one-to-many между Person и Cat, когда внешний ключ лежит в таблице cat?'
  - id: owning-side
    en: 'What is the owning side in a bidirectional @OneToMany and @ManyToOne mapping, and what does mappedBy mean?'
    ru: 'Какая сторона является owning side в bidirectional-маппинге @OneToMany и @ManyToOne, и что означает mappedBy?'
  - id: unidirectional-join-column
    en: 'When can you use @OneToMany with @JoinColumn on the parent collection, and what are its trade-offs?'
    ru: 'Когда можно использовать @OneToMany с @JoinColumn на коллекции родителя, и какие у этого варианта компромиссы?'
  - id: join-table-one-to-many
    en: 'How do you map a one-to-many association through a join table in JPA?'
    ru: 'Как замапить связь one-to-many через промежуточную таблицу в JPA?'
  - id: unique-child-link
    en: 'Why must cat_id be UNIQUE in the join table if every Cat may belong to only one Person?'
    ru: 'Почему cat_id должен быть UNIQUE в join table, если каждый Cat может принадлежать только одному Person?'
  - id: join-table-vs-many-to-many
    en: 'What turns a join-table mapping into a real many-to-many relation by accident?'
    ru: 'Что случайно превращает маппинг через join table в настоящую связь many-to-many?'
  - id: cascades-orphan-removal
    en: 'How do cascade and orphanRemoval relate to database ownership in a Person to Cat mapping?'
    ru: 'Как cascade и orphanRemoval связаны с владением данными в маппинге Person to Cat?'
  - id: fetch-and-production
    en: 'What fetch and production risks should you mention for a one-to-many collection in Hibernate?'
    ru: 'Какие fetch- и production-риски нужно упомянуть для one-to-many коллекции в Hibernate?'
