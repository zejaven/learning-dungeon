id: equals-inheritance
languages: [en, ru]
title:
  en: equals() and Inheritance
  ru: equals() и наследование
category:
  en: Java Core / OOP
  ru: Java Core / ООП
type: OTHER
mode: trace
aiProvider: codex
aiModel: gpt-5.5
categoryId: java-core
difficulty: 3
catalogId: java-core-21
style: Real world
summary:
  en: >
    Why equals() becomes dangerous in an inheritance hierarchy: a base class that
    accepts subclasses with instanceof can ignore new subclass state, break
    symmetry, break transitivity, and surprise collections. The topic contrasts
    instanceof with getClass(), canEqual, and composition.
  ru: >
    Почему equals() становится опасным в иерархии наследования: базовый класс,
    который принимает подклассы через instanceof, может игнорировать новое
    состояние подкласса, нарушать симметрию, нарушать транзитивность и удивлять
    коллекции. Тема сравнивает instanceof с getClass(), canEqual и композицией.

primitives:
  - ArrayGrid
  - EventLog

defaultExample: symmetry-break

examples:
  - id: symmetry-break
    title:
      en: instanceof breaks symmetry
      ru: instanceof ломает симметрию
    file: 01-instanceof-symmetry.java
    explanation:
      en: >
        Point.equals accepts any Point subtype by x/y, while Point3D.equals only
        accepts Point3D by x/y/z. The two directions disagree.
      ru: >
        Point.equals принимает любой подкласс Point по x/y, а Point3D.equals
        принимает только Point3D по x/y/z. Два направления дают разные ответы.
  - id: transitivity-trap
    title:
      en: The transitivity trap
      ru: Ловушка транзитивности
    file: 02-transitivity-trap.java
    explanation:
      en: >
        A subclass tries to be friendly to Point and compares only x/y when the
        other object is 2D. That repairs symmetry for one pair but breaks
        transitivity across three objects.
      ru: >
        Подкласс пытается быть дружелюбным к Point и сравнивает только x/y, когда
        другой объект двумерный. Это чинит симметрию для одной пары, но ломает
        транзитивность на трех объектах.
  - id: getclass-boundary
    title:
      en: getClass() draws a boundary
      ru: getClass() проводит границу
    file: 03-getclass-boundary.java
    explanation:
      en: >
        getClass() requires the exact same runtime class, so Point and Point3D
        are never equal to each other. Symmetry is simple, but cross-class value
        equality disappears.
      ru: >
        getClass() требует один и тот же runtime-класс, поэтому Point и Point3D
        никогда не равны друг другу. Симметрия проста, но межклассовое value
        equality исчезает.
  - id: hashset-surprise
    title:
      en: HashSet direction surprise
      ru: Сюрприз направления в HashSet
    file: 04-hashset-surprise.java
    explanation:
      en: >
        With asymmetric equals(), contains() can depend on which class was stored
        and which class is used as the probe key.
      ru: >
        При асимметричном equals() contains() может зависеть от того, объект
        какого класса уже лежит в коллекции и объект какого класса используется
        для поиска.
  - id: canequal-guard
    title:
      en: canEqual guard
      ru: Защита canEqual
    file: 05-canequal-guard.java
    explanation:
      en: >
        The canEqual pattern lets a subclass refuse equality with the base class
        while still using instanceof for same-family checks.
      ru: >
        Шаблон canEqual позволяет подклассу отказаться от равенства с базовым
        классом, но все еще использовать instanceof для проверок внутри одной
        семейной иерархии.
  - id: composition
    title:
      en: Composition instead of inheritance
      ru: Композиция вместо наследования
    file: 06-composition-instead.java
    explanation:
      en: >
        Point3D owns a Point instead of extending it. Equality stays local to each
        value type, so the inheritance contract problem disappears.
      ru: >
        Point3D хранит Point внутри себя вместо наследования. Равенство остается
        локальным для каждого value type, поэтому проблема контракта наследования
        исчезает.

assistantExample:
  en: 'e.g. Why can Point.equals(Object) with instanceof break symmetry when Point3D extends Point?'
  ru: 'например: Почему Point.equals(Object) с instanceof может нарушить симметрию, если Point3D наследует Point?'

missionsFile: quiz.yaml
