id: inbox-pattern
title:
  en: Inbox Pattern
  ru: Паттерн Inbox
category:
  en: Distributed Systems / Messaging
  ru: Распределённые системы / Обмен сообщениями
type: TRANSACTION
# Catalog placement: a standalone entry in the Microservices & Architecture tree
# (not attached to the broad "avoid duplicates when registering sales?" question).
categoryId: microservices
difficulty: 3
summary:
  en: >
    The Inbox pattern (transactional inbox / idempotent consumer) makes message
    consumption safe under at-least-once delivery. The consumer keeps an inbox
    table of message ids it has already processed; for each incoming message it
    deduplicates by the unique message id and, only for a new id, records the id
    and applies the business effect together in one local transaction. That
    turns at-least-once delivery into effectively-once processing, so a
    redelivered message never applies its effect twice.
  ru: >
    Паттерн Inbox (транзакционный inbox / идемпотентный потребитель) делает
    обработку сообщений безопасной при доставке at-least-once. Потребитель
    хранит таблицу inbox с id уже обработанных сообщений; для каждого входящего
    сообщения он дедуплицирует по уникальному id и только для нового id
    записывает id и применяет бизнес-эффект вместе, в одной локальной
    транзакции. Это превращает доставку at-least-once в обработку
    effectively-once, поэтому повторно доставленное сообщение не применяет свой
    эффект дважды.

# Visual primitives this topic's visualizer composes (frontend).
primitives:
  - BoxGroup
  - EventLog

defaultExample: duplicate

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: basic
    title:
      en: Process a message once
      ru: Обработать сообщение один раз
    file: 01-basic.java
    explanation:
      en: >
        A brand-new message id is not in the inbox, so it is recorded and its
        effect is applied — both in the same local transaction. This is the
        happy path: one delivery, one effect.
      ru: >
        Новый id сообщения отсутствует в inbox, поэтому он записывается и его
        эффект применяется — всё в одной локальной транзакции. Это счастливый
        путь: одна доставка, один эффект.
  - id: duplicate
    title:
      en: Redelivery is deduplicated
      ru: Повтор дедуплицируется
    file: 02-duplicate.java
    explanation:
      en: >
        At-least-once delivery sends the same id twice. The first delivery is
        processed; the second finds the id already in the inbox and is skipped,
        so the card is charged exactly once. This is the whole point of the
        pattern.
      ru: >
        Доставка at-least-once присылает один и тот же id дважды. Первая доставка
        обрабатывается; вторая находит id уже в inbox и пропускается, поэтому
        карта списывается ровно один раз. В этом весь смысл паттерна.
  - id: distinct-messages
    title:
      en: Distinct ids all apply
      ru: Разные id применяются все
    file: 03-distinct-messages.java
    explanation:
      en: >
        Three different message ids are three different messages. Each is new, so
        each is recorded and applied, and the inbox table grows. Dedup never
        gets in the way of legitimate, distinct events.
      ru: >
        Три разных id сообщений — это три разных сообщения. Каждое новое, поэтому
        каждое записывается и применяется, а таблица inbox растёт. Дедупликация
        не мешает законным, различным событиям.
  - id: payload-not-key
    title:
      en: Dedup by id, not payload (trap)
      ru: Дедуп по id, не по payload (ловушка)
    file: 04-payload-not-key.java
    explanation:
      en: >
        Two messages with identical payloads but different ids are both
        processed. The idempotency key must be the stable, unique message id —
        deduplicating by body would silently drop a real repeat purchase.
      ru: >
        Два сообщения с одинаковым payload, но разными id оба обрабатываются.
        Ключ идемпотентности — это стабильный уникальный id сообщения;
        дедупликация по телу молча отбросила бы реальную повторную покупку.
  - id: cleanup-trap
    title:
      en: Retention window (trap)
      ru: Окно ретенции (ловушка)
    file: 05-cleanup-trap.java
    explanation:
      en: >
        The inbox is purged too aggressively, so a forgotten id looks new when a
        late redelivery arrives and its effect is applied a second time. The
        retention window must outlast the broker's maximum redelivery delay.
      ru: >
        Inbox очищается слишком агрессивно, поэтому забытый id выглядит новым,
        когда приходит поздняя повторная доставка, и его эффект применяется
        второй раз. Окно ретенции должно превышать максимальную задержку
        повторной доставки у брокера.

# Example question pre-filled as the Ask AI placeholder.
assistantExample:
  en: "e.g. Why deduplicate by message id and not by the payload?"
  ru: "например: Почему дедуплицировать по id сообщения, а не по payload?"

