id: websocket-connection
languages: [en, ru]
title:
  en: 'How a WebSocket Connection Works'
  ru: 'Как работает WebSocket-соединение'
category:
  en: Networking / Real-Time
  ru: Сети / Реальное время
type: HTTP
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: networking
difficulty: 2
catalogId: networking-3
summary:
  en: >
    A WebSocket does not start as a WebSocket. It starts as one ordinary HTTP GET
    with Upgrade: websocket and a Sec-WebSocket-Key, answered with 101 Switching
    Protocols and a Sec-WebSocket-Accept computed from that key — and 101 means
    not "here is your response" but "this connection stops being HTTP". The same
    TCP connection stays open and both ends write frames into it whenever they
    like: that is what bidirectional means, and it is the reason there are no more
    status codes, no cookies per message and no request/response pairing. The
    transport is TCP and only TCP — never UDP, so you inherit ordered, reliable,
    exactly-once delivery and head-of-line blocking with it. The third question is
    the one that bites in production: who serves the connection. A Jakarta
    @ServerEndpoint POJO is instantiated once per connection, so a field is
    private per client; a Spring WebSocketHandler is a singleton bean shared by
    every connection, so the same field is global mutable state written from every
    client's thread. That is why every callback takes the Session — per-connection
    state belongs there, where the answer is the same in both models.
  ru: >
    WebSocket начинается не как WebSocket. Он начинается как один обычный
    HTTP-запрос GET с Upgrade: websocket и Sec-WebSocket-Key, на который отвечают
    101 Switching Protocols и Sec-WebSocket-Accept, вычисленным из этого ключа, —
    и 101 означает не «вот твой ответ», а «это соединение перестаёт быть HTTP».
    То же самое TCP-соединение остаётся открытым, и оба конца пишут в него фреймы
    когда захотят: это и есть двусторонность, и именно поэтому дальше нет ни кодов
    состояния, ни кук на каждое сообщение, ни привязки ответа к запросу. Транспорт
    — TCP и только TCP, никогда не UDP, поэтому вместе с ним наследуются
    упорядоченная надёжная доставка ровно один раз и head-of-line blocking. Третий
    вопрос — тот, что бьёт в продакшене: кто обслуживает соединение. POJO с
    @ServerEndpoint из Jakarta создаётся по экземпляру на соединение, поэтому поле
    приватно для клиента; Spring WebSocketHandler — singleton-бин, общий для всех
    соединений, поэтому то же самое поле становится глобальным изменяемым
    состоянием, в которое пишут потоки всех клиентов. Поэтому каждый колбэк
    принимает Session: состояние соединения место именно там, где ответ одинаков в
    обеих моделях.

