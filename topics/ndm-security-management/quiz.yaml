bossFight:
  # I. Fundamental Objectives and Strategy
  - id: cia-triad-balance
    en: 'How do the core objectives of Confidentiality, Integrity, and Availability balance one another, and what are the primary technical tools (e.g., encryption, hashes, redundancy) used to achieve each?'
    ru: 'Как ключевые цели Confidentiality, Integrity и Availability уравновешивают друг друга и какие основные технические инструменты (например, шифрование, хеши, резервирование) используются для достижения каждой из них?'
  - id: security-continuous-cycle
    en: 'Why is Security Management defined as a continuous cycle of risk identification and incident response rather than a one-time configuration?'
    ru: 'Почему управление безопасностью определяется как непрерывный цикл выявления рисков и реагирования на инциденты, а не как разовая настройка?'
  - id: defence-in-depth-logic
    en: 'Explain the logic behind a layered architectural approach. How do redundant security controls protect the network if the perimeter layer is breached?'
    ru: 'Объясните логику многослойного архитектурного подхода. Как избыточные средства защиты оберегают сеть, если периметровый слой прорван?'
  - id: immune-system-analogy
    en: 'In what ways does security management function as a network''s immune system through constant traffic monitoring and safeguard implementation?'
    ru: 'Каким образом управление безопасностью работает как «иммунная система» сети через постоянный мониторинг трафика и внедрение защитных мер?'
  # II. The AAA Framework and Access Control
  - id: aaa-gatekeeping
    en: 'Contrast the roles of Authentication, Authorisation, and Accounting. Why is it critical to have a chronological audit trail of all user actions?'
    ru: 'Сопоставьте роли Authentication, Authorisation и Accounting. Почему критически важно иметь хронологический аудиторский след всех действий пользователей?'
  - id: centralised-aaa-servers
    en: 'What are the operational advantages of using dedicated servers like TACACS+ or RADIUS to consolidate access across thousands of devices?'
    ru: 'Каковы эксплуатационные преимущества использования выделенных серверов вроде TACACS+ или RADIUS для консолидации доступа на тысячах устройств?'
  - id: least-privilege-enable
    en: 'How does the Principle of Least Privilege minimise the potential impact of a compromised account, and what is the role of "enable" commands in this strategy?'
    ru: 'Как принцип наименьших привилегий минимизирует потенциальный ущерб от компрометации учётной записи и какова роль команд «enable» в этой стратегии?'
  - id: encrypted-aaa-transport
    en: 'Why is it vital to use encrypted protocols like RadSec or LDAPS for AAA communications to prevent credential sniffing?'
    ru: 'Почему жизненно важно использовать шифрованные протоколы вроде RadSec или LDAPS для коммуникаций AAA, чтобы предотвратить перехват учётных данных?'
  # III. Network Perimeter and Segmentation
  - id: firewall-evolution
    en: 'Compare the speed and efficiency of Packet-Filtering (Layers 3 and 4) with the Deep Packet Inspection capabilities of Next-Generation Firewalls (Layer 7).'
    ru: 'Сравните скорость и эффективность Packet-Filtering (уровни 3 и 4) с возможностями Deep Packet Inspection у Next-Generation Firewall (уровень 7).'
  - id: dmz-dual-firewall
    en: 'Why is a dual-firewall layer from different vendors recommended for protecting publicly accessible servers in a Demilitarised Zone?'
    ru: 'Почему для защиты публично доступных серверов в демилитаризованной зоне (DMZ) рекомендуются два слоя файрволов от разных вендоров?'
  - id: lateral-movement-prevention
    en: 'How does logical and physical segmentation (using VLANs and strict ACLs) prevent the spread of malware across similar systems?'
    ru: 'Как логическая и физическая сегментация (с помощью VLAN и строгих ACL) предотвращает распространение вредоносного ПО между похожими системами?'
  - id: dot1x-vs-mac-filtering
    en: 'Discuss the security benefits of 802.1X and NAC over simple MAC filtering for authenticating devices before granting network access.'
    ru: 'Обсудите преимущества 802.1X и NAC по сравнению с простой фильтрацией по MAC при аутентификации устройств до предоставления доступа к сети.'
  # IV. Threat Detection and Incident Response
  - id: ids-vs-ips
    en: 'Contrast the passive monitoring of an IDS with the active, in-line placement of an IPS. How do designers mitigate the risk of "False Positives" in an IPS?'
    ru: 'Сопоставьте пассивный мониторинг IDS с активным размещением IPS «в разрыв». Как проектировщики снижают риск «ложных срабатываний» (False Positives) в IPS?'
  - id: signature-vs-anomaly
    en: 'Explain the difference between Signature-based detection (explicit patterns) and Anomaly-based detection (baseline deviations).'
    ru: 'Объясните разницу между сигнатурным обнаружением (явные шаблоны) и обнаружением на аномалиях (отклонения от базовой линии).'
  - id: automated-alarm-triage
    en: 'How can automated alarm validation check a target''s OS and patch level to reduce the time administrators spend on triage?'
    ru: 'Как автоматическая валидация тревог проверяет ОС и уровень патчей цели, сокращая время, которое администраторы тратят на триаж?'
  - id: root-cause-after-intrusion
    en: 'After an intrusion is contained, why is it mandatory to perform a root cause analysis and update security policies?'
    ru: 'Почему после сдерживания вторжения обязательно выполнять анализ первопричин (root cause analysis) и обновлять политики безопасности?'
  # V. Hardening, Data Protection, and Future Trends
  - id: snmpv3-usm-protection
    en: 'Why are SNMP v1 and v2c considered vulnerable, and how does SNMPv3 provide better protection through the User-based Security Model (USM)?'
    ru: 'Почему SNMP v1 и v2c считаются уязвимыми и как SNMPv3 обеспечивает лучшую защиту через User-based Security Model (USM)?'
  - id: ssh-over-telnet
    en: 'Why should clear-text protocols like Telnet be disabled in favour of SSH version 2 and strong asymmetric keys?'
    ru: 'Почему протоколы с открытым текстом вроде Telnet следует отключать в пользу SSH версии 2 и сильных асимметричных ключей?'
  - id: data-rest-vs-transit
    en: 'Compare the use of VPNs for protecting data traversing untrusted pathways with encryption for protecting configuration backups and hard drives.'
    ru: 'Сравните использование VPN для защиты данных, проходящих по недоверенным путям, с шифрованием для защиты резервных копий конфигураций и жёстких дисков.'
  - id: zero-trust-and-ai
    en: 'How does the Zero Trust Architecture differ from traditional perimeter boundaries, and how can AI and Machine Learning enable "self-healing" networks?'
    ru: 'Чем Zero Trust Architecture отличается от традиционных границ периметра и как AI и машинное обучение делают возможными «самовосстанавливающиеся» сети?'
