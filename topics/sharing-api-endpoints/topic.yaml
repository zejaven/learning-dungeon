id: sharing-api-endpoints
title:
  en: Sharing API Endpoints Across an Organization
  ru: Как делиться эндпоинтами внутри организации
category:
  en: REST / API Design
  ru: REST / Проектирование API
type: REST
# Theory topic: explanation + Boss Fight only - no practice editor or missions.
mode: theory
aiProvider: claude
aiModel: claude-opus-5
categoryId: rest
difficulty: 1
catalogId: rest-1
summary:
  en: >
    Sharing an endpoint is not sending someone a URL - it is publishing a
    contract another team can integrate against without talking to you. The
    working answer is a machine-readable spec (OpenAPI for REST, .proto for
    gRPC, AsyncAPI plus a schema registry for events) that is generated or
    validated in the same pipeline that deploys the service, published to a
    searchable catalog with owner, environments and changelog, and surrounded by
    the things a URL does not carry: how to authenticate, what the errors look
    like, the rate limits, and the versioning and deprecation policy. The traps
    are documentation that drifts from the code, a Postman collection with
    someone's real token in it, Swagger UI open in production, and calling a new
    path segment "versioning".
  ru: >
    Поделиться эндпоинтом - это не отправить кому-то URL, а опубликовать
    контракт, по которому другая команда сможет интегрироваться, не обращаясь к
    вам. Рабочий ответ - машиночитаемая спецификация (OpenAPI для REST, .proto
    для gRPC, AsyncAPI плюс schema registry для событий), которая генерируется
    или проверяется в том же пайплайне, что деплоит сервис, публикуется в
    поисковый каталог с владельцем, окружениями и списком изменений и дополняется
    тем, чего нет в URL: как аутентифицироваться, как выглядят ошибки, какие
    лимиты запросов, какова политика версионирования и вывода из эксплуатации.
    Ловушки - документация, разошедшаяся с кодом, Postman-коллекция с чьим-то
    настоящим токеном, открытый в проде Swagger UI и вера в то, что новый сегмент
    пути и есть версионирование.

assistantExample:
  en: 'e.g. Another team wants to call my service - what exactly do I hand them besides the URL?'
  ru: 'например: Другая команда хочет вызывать мой сервис - что именно я им передаю, кроме URL?'

