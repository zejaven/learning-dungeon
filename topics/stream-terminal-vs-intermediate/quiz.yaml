# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: build-pipeline
    title:
      en: Build a lazy pipeline
      ru: Построй ленивый конвейер
    goal:
      en: Add an intermediate operation (filter or map) to a stream.
      ru: Добавь промежуточную операцию (filter или map) к стриму.
    event: STREAM_PIPELINE_OP
  - id: run-terminal
    title:
      en: Trigger execution
      ru: Запусти выполнение
    goal:
      en: Call a terminal operation so the pipeline actually runs.
      ru: Вызови терминальную операцию, чтобы конвейер действительно заработал.
    event: STREAM_TERMINAL_START
  - id: drop-element
    title:
      en: Drop an element
      ru: Отбрось элемент
    goal:
      en: Use a filter that rejects at least one element.
      ru: Используй filter, который отбрасывает хотя бы один элемент.
    event: STREAM_FILTER_DROP
  - id: short-circuit
    title:
      en: Short-circuit the stream
      ru: Замкни стрим
    goal:
      en: Use findFirst, anyMatch or limit so the stream stops early.
      ru: Используй findFirst, anyMatch или limit, чтобы стрим остановился досрочно.
    event: STREAM_SHORT_CIRCUIT
  - id: consume-stream
    title:
      en: Consume the stream
      ru: Потреби стрим
    goal:
      en: Finish a terminal operation so the stream becomes consumed.
      ru: Заверши терминальную операцию, чтобы стрим стал потреблённым.
    event: STREAM_CONSUMED

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: intermediate-vs-terminal
    en: What is the difference between an intermediate and a terminal Stream operation?
    ru: В чём разница между промежуточной и терминальной операцией Stream?
  - id: laziness
    en: Why are intermediate operations called lazy, and what triggers the actual work?
    ru: Почему промежуточные операции называют ленивыми и что запускает реальную работу?
  - id: return-types
    en: What does an intermediate operation return versus a terminal one?
    ru: Что возвращает промежуточная операция и что — терминальная?
  - id: short-circuiting
    en: What are short-circuiting operations? Give an intermediate and a terminal example.
    ru: Что такое замыкающие операции? Приведи пример промежуточной и терминальной.
  - id: single-use
    en: Why can a stream be used only once, and what happens if you reuse it?
    ru: Почему стрим можно использовать только один раз и что будет при повторном использовании?
  - id: peek-vs-foreach
    en: How does peek differ from forEach, and why is peek a trap for side effects?
    ru: Чем peek отличается от forEach и почему peek — ловушка для побочных эффектов?
