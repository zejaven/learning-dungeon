bossFight:
  - id: classification-axes
    en: 'Which axes are used to classify types of testing? Name as many classifications as you can with one example each.'
    ru: 'По каким основаниям классифицируют виды тестирования? Назовите как можно больше классификаций с одним примером на каждую.'
  - id: functional-vs-non-functional
    en: 'What is the difference between functional and non-functional testing? Which types of non-functional testing do you know?'
    ru: 'В чём разница между функциональным и нефункциональным тестированием? Какие виды нефункционального тестирования вы знаете?'
  - id: isolation-levels
    en: 'Explain unit, integration and system testing. How do they differ in scale and who usually performs each of them?'
    ru: 'Объясните модульное, интеграционное и системное тестирование. Чем они отличаются по масштабу и кто обычно выполняет каждое из них?'
  - id: smoke-vs-regression
    en: 'What is the difference between smoke and regression testing? When is each of them run and what happens if smoke fails?'
    ru: 'В чём отличия смоука от регресса? Когда запускается каждый из них и что происходит, если смоук упал?'
  - id: regression-purpose
    en: 'Why is regression testing needed at all? What kinds of changes can break previously working functionality?'
    ru: 'Зачем вообще нужно регрессионное тестирование? Какие изменения могут сломать ранее работавший функционал?'
  - id: black-white-grey-box
    en: 'Describe black box, white box and grey box testing. Which of them does a manual QA engineer typically use and why?'
    ru: 'Опишите тестирование методом чёрного, белого и серого ящика. Каким из них обычно пользуется ручной тестировщик и почему?'
  - id: automation-tradeoffs
    en: 'When is test automation beneficial, and when is it unprofitable or even impossible? Give examples for both cases.'
    ru: 'Когда автоматизация тестирования выгодна, а когда невыгодна или даже невозможна? Приведите примеры для обоих случаев.'
  - id: scripted-vs-exploratory
    en: 'What is the difference between scripted testing by test cases and exploratory testing? Is exploratory testing just chaotic clicking?'
    ru: 'Чем отличается тестирование по тестовым кейсам от исследовательского? Правда ли, что исследовательское тестирование — это хаотичный кликинг?'
