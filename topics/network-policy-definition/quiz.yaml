# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: what-is-a-network-policy
    en: What is a NetworkPolicy in Kubernetes, and which problem does it exist to solve?
    ru: Что такое NetworkPolicy в Kubernetes и какую проблему она решает?
  - id: default-network-model
    en: 'What is the network default in a cluster with no policies at all, and what exactly changes for a pod the moment one policy selects it?'
    ru: 'Каково сетевое поведение по умолчанию в кластере вообще без политик и что именно меняется для пода в момент, когда его выбирает первая политика?'
  - id: policy-anatomy
    en: 'Walk me through the fields of a NetworkPolicy: podSelector, policyTypes, ingress/egress, from/to and ports. Which of them is the protected pod and which is the peer?'
    ru: 'Разберите поля NetworkPolicy: podSelector, policyTypes, ingress/egress, from/to и ports. Что из этого — защищаемый под, а что — участник соединения?'
  - id: additive-no-deny
    en: 'There is no deny rule. How do several policies selecting the same pod combine, and how would you express "allow everyone except the dev namespace"?'
    ru: 'Правила deny не существует. Как объединяются несколько политик, выбравших один и тот же под, и как выразить «разрешить всем, кроме пространства имён dev»?'
  - id: default-deny-recipe
    en: Write a default-deny policy for a namespace. What is the first thing that breaks after you apply it, and why does the error not look like a network error?
    ru: Напишите default-deny политику для пространства имён. Что сломается первым после её применения и почему ошибка не выглядит сетевой?
  - id: and-vs-or-selectors
    en: What is the difference between a namespaceSelector and a podSelector inside one `from` item versus the same two selectors as two separate items?
    ru: Чем отличается namespaceSelector и podSelector внутри одного элемента `from` от тех же двух селекторов как двух отдельных элементов списка?
  - id: stateful-both-ends
    en: 'Service A calls service B in another namespace. Which policies have to exist on each side, and does the response traffic need a rule of its own?'
    ru: 'Сервис A вызывает сервис B в другом пространстве имён. Какие политики должны быть с каждой стороны и нужно ли отдельное правило для ответного трафика?'
  - id: cni-enforcement
    en: You applied a NetworkPolicy, kubectl shows the object with your rules, but nothing is blocked. What would you check first?
    ru: Вы применили NetworkPolicy, kubectl показывает объект с вашими правилами, но ничего не блокируется. Что проверите первым делом?
  - id: l4-vs-l7-limits
    en: 'What can a NetworkPolicy not express, and which layer would you use for those requirements instead?'
    ru: 'Что NetworkPolicy выразить не может и на каком уровне вы будете закрывать такие требования?'
  - id: service-port-vs-pod-port
    en: 'A Service exposes port 80 and forwards to targetPort 8080. Which port belongs in the NetworkPolicy, and why?'
    ru: 'Service открывает порт 80 и пробрасывает на targetPort 8080. Какой порт должен быть в NetworkPolicy и почему?'
  - id: debugging-blocked-traffic
    en: After a rollout one service can no longer reach another. How do you work out whether a NetworkPolicy is the cause?
    ru: После выката один сервис перестал доставать до другого. Как вы определите, виновата ли в этом NetworkPolicy?
