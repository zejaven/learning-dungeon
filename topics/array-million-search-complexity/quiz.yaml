# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: complexity-of-million-array
    en: What is the search complexity for an array of 1,000,000 values?
    ru: Чему будет равна сложность поиска для массива длиной в 1 000 000 значений?
  - id: does-number-change-bigo
    en: Does the number 1,000,000 change the Big-O class of the search? Why or why not?
    ru: Меняет ли число 1 000 000 класс Big-O поиска? Почему да или почему нет?
  - id: linear-operation-count
    en: For a linear scan of a 1,000,000-element array, how many comparisons happen in the best, average, and worst case?
    ru: При линейном переборе массива из 1 000 000 элементов сколько сравнений будет в лучшем, среднем и худшем случае?
  - id: sorted-binary-search
    en: If the 1,000,000-element array is sorted, what is the search complexity and roughly how many comparisons does it take?
    ru: Если массив из 1 000 000 элементов отсортирован, какова сложность поиска и сколько примерно сравнений потребуется?
  - id: o1-without-sorting
    en: How could you get O(1) average lookup for a million values without sorting, and what is the trade-off?
    ru: Как получить поиск в среднем за O(1) среди миллиона значений без сортировки и какова плата за это?
  - id: index-vs-search
    en: Why is reading arr[i] O(1) regardless of length, while searching by value is not?
    ru: Почему чтение arr[i] — это O(1) независимо от длины, а поиск по значению — нет?
