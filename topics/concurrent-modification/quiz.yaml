missions:
  - id: build-list
    title:
      en: Fill the list
      ru: Заполни список
    goal:
      en: Add elements to a fail-fast list and watch modCount increase with each structural change.
      ru: Добавь элементы в fail-fast список и посмотри, как modCount растёт с каждым структурным изменением.
    event: LIST_ADD
  - id: trigger-cme
    title:
      en: Trigger the exception
      ru: Вызови исключение
    goal:
      en: Modify the list while an iterator is active so the next next() throws ConcurrentModificationException.
      ru: Измени список при активном iterator, чтобы следующий next() бросил ConcurrentModificationException.
    event: CONCURRENT_MODIFICATION
  - id: remove-safely
    title:
      en: Remove safely
      ru: Удали безопасно
    goal:
      en: Delete the current element through Iterator.remove() so iteration stays valid and no CME is thrown.
      ru: Удали текущий элемент через Iterator.remove(), чтобы итерация осталась валидной и CME не возникло.
    event: ITERATOR_REMOVE
  - id: cow-write
    title:
      en: Copy on write
      ru: Копирование при записи
    goal:
      en: Write to a CopyOnWriteArrayList and see it copy the whole backing array.
      ru: Запиши в CopyOnWriteArrayList и увидь, как он копирует весь backing array.
    event: COW_WRITE_COPY
  - id: stable-snapshot
    title:
      en: Read a stable snapshot
      ru: Прочитай стабильный snapshot
    goal:
      en: Keep iterating a CopyOnWriteArrayList from its frozen snapshot after the live list was changed.
      ru: Продолжи итерацию CopyOnWriteArrayList по замороженному snapshot после изменения живого списка.
    event: COW_SNAPSHOT_READ

bossFight:
  - id: what-causes-cme
    en: What exactly causes a ConcurrentModificationException?
    ru: Что именно вызывает ConcurrentModificationException?
  - id: modcount-mechanism
    en: How does a fail-fast iterator detect a concurrent modification (what is modCount and expectedModCount)?
    ru: Как fail-fast iterator обнаруживает конкурентное изменение (что такое modCount и expectedModCount)?
  - id: single-thread-cme
    en: Can a ConcurrentModificationException happen in a single thread? Give an example.
    ru: Может ли ConcurrentModificationException возникнуть в одном потоке? Приведи пример.
  - id: safe-remove-single-thread
    en: How do you remove elements while looping over a list without a CME in a single thread?
    ru: Как удалять элементы во время цикла по списку без CME в одном потоке?
  - id: copy-on-write-how
    en: How does CopyOnWriteArrayList avoid ConcurrentModificationException, and what does its iterator see?
    ru: Как CopyOnWriteArrayList избегает ConcurrentModificationException и что видит его iterator?
  - id: cow-tradeoffs
    en: What are the trade-offs of CopyOnWriteArrayList, and when is it a good or bad choice?
    ru: Каковы компромиссы CopyOnWriteArrayList и когда он хороший или плохой выбор?
  - id: alternatives
    en: Besides CopyOnWriteArrayList, what other ways exist to safely share and modify a collection across threads?
    ru: Кроме CopyOnWriteArrayList, какие ещё есть способы безопасно разделять и изменять коллекцию между потоками?
  - id: fail-fast-vs-fail-safe
    en: What is the difference between a fail-fast and a weakly consistent (fail-safe) iterator?
    ru: В чём разница между fail-fast и слабо согласованным (fail-safe) iterator?
