# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: declare-a-handler
    title:
      en: Write one decision down
      ru: Запиши одно решение
    goal:
      en: Declare a handler method and read the Java signature the design implies — what binds in, what goes out, which status.
      ru: 'Объяви метод-обработчик и прочитай Java-сигнатуру, которую задаёт дизайн: что извлекается, что уходит, какой статус.'
    event: HANDLER_ADDED
  - id: status-that-fits
    title:
      en: 'Catch a status that lies'
      ru: 'Поймай статус, который врёт'
    goal:
      en: Declare an operation whose success code contradicts its method — a create that answers 200, for instance — and see what the client loses.
      ru: Объяви операцию, чей код успеха противоречит методу (например, создание, отвечающее 200), и посмотри, что теряет клиент.
    event: STATUS_MISMATCH
  - id: body-where-none-belongs
    title:
      en: 'Put a body in the wrong place'
      ru: 'Помести тело не туда'
    goal:
      en: Declare a body on a method that has none defined, or a write with no body at all, and see why the pair method+body is a design decision.
      ru: Объяви тело у метода, для которого оно не определено, или запись вообще без тела, и пойми, почему пара «метод + тело» — проектное решение.
    event: BODY_MISMATCH
  - id: entity-on-the-wire
    title:
      en: 'Let the entity out'
      ru: 'Выпусти сущность наружу'
    goal:
      en: Use the persistence entity as a request or response type and see what the API promises by accident.
      ru: Используй сущность персистентности как тип запроса или ответа и посмотри, что API пообещал случайно.
    event: ENTITY_EXPOSED
  - id: list-without-a-limit
    title:
      en: 'Return the whole table'
      ru: 'Верни всю таблицу'
    goal:
      en: Review a controller whose collection endpoint returns a plain list with no page size.
      ru: Проверь контроллер, у которого эндпоинт коллекции возвращает обычный список без размера страницы.
    event: UNBOUNDED_COLLECTION
  - id: page-and-filter
    title:
      en: Bound the collection
      ru: Ограничь коллекцию
    goal:
      en: Add paging with a default and a capped page size, plus the filters the collection accepts in the query string.
      ru: Добавь постраничность со значением по умолчанию и ограниченным максимумом плюс фильтры, которые коллекция принимает в строке запроса.
    event: PAGING_ADDED
  - id: hand-the-work-over
    title:
      en: Delegate the work
      ru: Передай работу дальше
    goal:
      en: Send a request that succeeds and watch the controller do nothing but call the service.
      ru: Отправь успешный запрос и посмотри, как контроллер не делает ничего, кроме вызова сервиса.
    event: SERVICE_CALLED
  - id: reject-at-the-edge
    title:
      en: 'Reject before the service'
      ru: 'Откажи до сервиса'
    goal:
      en: Send a body that breaks a declared constraint and see the request stop at the edge with the field named.
      ru: Отправь тело, нарушающее объявленное ограничение, и увидь, как запрос останавливается на границе с указанием поля.
    event: VALIDATION_FAILED
  - id: exception-to-status
    title:
      en: 'Turn an exception into a status'
      ru: 'Преврати исключение в статус'
    goal:
      en: Ask for something that is not there and watch a domain exception become an HTTP status in one place, without a try/catch in the handler.
      ru: Запроси то, чего нет, и посмотри, как доменное исключение превращается в HTTP-статус в одном месте, без try/catch в обработчике.
    event: ERROR_MAPPED
  - id: fat-controller
    title:
      en: 'Park a rule in the controller'
      ru: 'Оставь правило в контроллере'
    goal:
      en: Move a business rule into a handler method and see what can no longer reach it.
      ru: Перенеси бизнес-правило в метод-обработчик и посмотри, кто теперь до него не дотянется.
    event: LOGIC_IN_CONTROLLER

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: how-you-design-endpoints
    en: How do you design the endpoints of a REST controller? Walk through the decisions you make for one resource, in order.
    ru: Как ты проектируешь эндпоинты REST-контроллера? Пройди по решениям, которые принимаешь для одного ресурса, по порядку.
  - id: what-belongs-in-a-handler
    en: What is allowed inside a controller method, and what is not? Where exactly do you draw the line with the service?
    ru: Что можно держать внутри метода контроллера, а что нельзя? Где именно проходит граница с сервисом?
  - id: controller-per-resource
    en: How do you decide how many controllers a service needs, and what belongs in one class?
    ru: Как решить, сколько контроллеров нужно сервису и что относится к одному классу?
  - id: dto-vs-entity
    en: Would you return the JPA entity from a controller? Give the concrete costs, in and out.
    ru: Ты будешь возвращать JPA-сущность из контроллера? Назови конкретные издержки — и на вход, и на выход.
  - id: status-codes-per-operation
    en: Which status code does each operation answer with — list, read, create, replace, partial update, delete — and why that one?
    ru: Каким статусом отвечает каждая операция — список, чтение, создание, замена, частичное изменение, удаление — и почему именно им?
  - id: created-and-location
    en: What exactly does a successful create return, beyond the status code?
    ru: Что именно возвращает успешное создание, помимо кода статуса?
  - id: path-query-body-header
    en: A request carries an id, a filter, a page number, the new data and the caller's token. Where does each of those go, and why?
    ru: Запрос несёт id, фильтр, номер страницы, новые данные и токен вызывающего. Куда идёт каждое из этого и почему?
  - id: validation-placement
    en: Where do you validate — controller, service, or both? Which rules go where?
    ru: Где ты валидируешь — в контроллере, в сервисе или в обоих? Какие правила куда?
  - id: error-contract
    en: How does your API report errors, and how do you keep every endpoint reporting them the same way?
    ru: Как твой API сообщает об ошибках и как добиться, чтобы все эндпоинты делали это одинаково?
  - id: collection-endpoint-design
    en: Design the endpoint behind a screen that lists employees with filters, sorting and paging. What does the request and the response look like?
    ru: Спроектируй эндпоинт для экрана со списком сотрудников с фильтрами, сортировкой и постраничностью. Как выглядят запрос и ответ?
  - id: sub-resource-or-field
    en: Changing an employee's salary — a PATCH on the employee, or a PUT on a salary sub-resource? Defend your choice.
    ru: Изменение зарплаты сотрудника — PATCH по сотруднику или PUT по под-ресурсу зарплаты? Обоснуй выбор.
  - id: responseentity-or-not
    en: When do you return ResponseEntity and when the DTO itself? Does it change the design or only the code?
    ru: Когда возвращать ResponseEntity, а когда сам DTO? Это меняет дизайн или только код?
  - id: idempotency-of-writes
    en: A client retries a create after a timeout. What does your endpoint design do about it?
    ru: Клиент повторяет создание после таймаута. Что твой дизайн эндпоинта с этим делает?
  - id: versioning-and-evolution
    en: You need to add a required field to a request body that other teams already call. How do you evolve the endpoint?
    ru: Нужно добавить обязательное поле в тело запроса, который уже вызывают другие команды. Как ты будешь развивать эндпоинт?
  - id: testing-a-controller
    en: How do you test a controller, and what does that test cover that a service test does not?
    ru: Как ты тестируешь контроллер и что этот тест покрывает такого, чего не покрывает тест сервиса?
  - id: bulk-and-long-operations
    en: An operation takes 40 seconds and touches thousands of rows. How do you design that endpoint?
    ru: Операция длится 40 секунд и затрагивает тысячи строк. Как спроектировать такой эндпоинт?
