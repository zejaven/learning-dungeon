# Theory topic: no missions because there is no practice editor.
bossFight:
  - id: self-invocation-starts-transaction
    en: 'If a non-transactional method calls a @Transactional method of the same Spring bean, will Spring start a transaction? Explain the exact call path.'
    ru: 'Если нетранзакционный метод вызывает @Transactional-метод того же Spring bean, начнёт ли Spring транзакцию? Объясните точный путь вызова.'
  - id: proxy-boundary
    en: 'Why is the Spring AOP proxy the real transaction boundary, not the @Transactional annotation by itself?'
    ru: 'Почему реальной границей транзакции является Spring AOP proxy, а не сама аннотация @Transactional?'
  - id: existing-outer-transaction
    en: 'What changes if the outer same-bean method is already transactional, and which inner annotation settings can still be skipped?'
    ru: 'Что меняется, если внешний метод того же bean уже transactional, и какие настройки внутренней аннотации всё равно могут быть пропущены?'
  - id: clean-refactor
    en: 'What is the cleanest refactoring for a self-invoked @Transactional helper, and why does it work?'
    ru: 'Какой самый чистый рефакторинг для @Transactional helper, вызываемого через self-invocation, и почему он работает?'
  - id: outer-method-transactional
    en: 'When is putting @Transactional on the outer method the right fix, and when is it not enough?'
    ru: 'Когда поставить @Transactional на внешний метод — правильное исправление, а когда этого недостаточно?'
  - id: self-injection-tradeoffs
    en: 'How can self-injection or AopContext.currentProxy() make the call cross the proxy, and what are the trade-offs?'
    ru: 'Как self-injection или AopContext.currentProxy() могут заставить вызов пройти через proxy, и какие у этого компромиссы?'
  - id: transaction-template-aspectj
    en: 'Compare TransactionTemplate and AspectJ weaving as alternatives when a same-class transaction boundary is unavoidable.'
    ru: 'Сравните TransactionTemplate и AspectJ weaving как альтернативы, когда transaction boundary внутри того же класса неизбежна.'
