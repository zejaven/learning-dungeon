summary:
  en: >
    How to engineer "Five Nines" availability: MTBF/MTTR mathematics, serial vs
    parallel reliability, eliminating single points of failure, redundancy at
    Layers 1-3 (dual PSUs, LACP, RSTP, FHRPs like HSRP/VRRP/GLBP), SSO/NSF,
    failover standby states, the redundancy paradox, DPM, the "watermelon
    effect", and self-healing clusters.
  ru: >
    Как инженерно достичь доступности «пять девяток»: математика MTBF/MTTR,
    последовательная и параллельная надёжность, устранение единых точек отказа,
    избыточность на уровнях 1-3 (дублированные PSU, LACP, RSTP, FHRP —
    HSRP/VRRP/GLBP), SSO/NSF, состояния standby при failover, парадокс
    избыточности, DPM, «эффект арбуза» и самовосстанавливающиеся кластеры.

assistantExample:
