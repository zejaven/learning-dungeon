id: memory-leaks
title:
  en: Memory Leaks in Java
  ru: Утечки памяти в Java
category:
  en: Java Core / Memory
  ru: Java Core / Память
type: JVM_MEMORY
mode: trace
summary:
  en: >
    When a Java memory leak happens even with a garbage collector: objects you no
    longer need stay reachable from a GC root — a static collection, a forgotten
    listener, a ThreadLocal in a pooled thread, an unclosed resource — so the GC
    is not allowed to free them and the heap grows until OutOfMemoryError.
  ru: >
    Когда в Java происходит утечка памяти даже при наличии сборщика мусора:
    ненужные объекты остаются достижимыми от GC root — статическая коллекция,
    забытый listener, ThreadLocal в потоке из пула, незакрытый ресурс — поэтому
    GC не имеет права их освободить, и куча растёт до OutOfMemoryError.
categoryId: memory-gc
difficulty: 2
catalogId: memory-gc-7
style: Real world
aiProvider: claude
aiModel: claude-opus-4-8

primitives:
  - ArrayGrid
  - EventLog

defaultExample: static-collection-leak

examples:
  - id: healthy-collect
    title:
      en: Healthy lifecycle
      ru: Здоровый жизненный цикл
    file: 01-healthy-collect.java
    explanation:
      en: >
        A method allocates a temporary object and returns. With no GC root left
        referencing it, the next GC reclaims it — the normal, leak-free case.
      ru: >
        Метод создаёт временный объект и возвращается. Раз на него больше не
        ссылается ни один GC root, ближайший GC его освобождает — обычный случай
        без утечки.
  - id: static-collection-leak
    title:
      en: Static collection leak
      ru: Утечка через статическую коллекцию
    file: 02-static-collection-leak.java
    explanation:
      en: >
        A static cache keeps a reference to every entry. After the request ends
        the entry is no longer used, but the static root still holds it, so the
        GC cannot free it and the heap grows with every request.
      ru: >
        Статический кэш держит ссылку на каждую запись. После завершения запроса
        запись больше не нужна, но статический root всё ещё держит её, поэтому GC
        не может её освободить и куча растёт с каждым запросом.
  - id: fix-static-leak
    title:
      en: Fix the static leak
      ru: Чиним утечку кэша
    file: 03-fix-static-leak.java
    explanation:
      en: >
        The same scenario, but the entry is evicted from the cache when it is no
        longer needed. Now no GC root references it, so the GC reclaims it.
      ru: >
        Тот же сценарий, но запись удаляется из кэша, когда больше не нужна.
        Теперь на неё не ссылается ни один GC root, и GC её освобождает.
  - id: listener-leak
    title:
      en: Forgotten listener
      ru: Забытый listener
    file: 04-listener-leak.java
    explanation:
      en: >
        A short-lived view subscribes to a long-lived publisher and forgets to
        unsubscribe. The publisher pins the dead view until it is unregistered.
      ru: >
        Короткоживущий view подписывается на долгоживущий publisher и забывает
        отписаться. Publisher держит мёртвый view, пока его не отрегистрируют.
  - id: threadlocal-leak
    title:
      en: ThreadLocal in a pool
      ru: ThreadLocal в пуле
    file: 05-threadlocal-leak.java
    explanation:
      en: >
        A pooled thread is reused across tasks. A value left in a ThreadLocal is
        pinned by that long-lived thread until ThreadLocal.remove() detaches it.
      ru: >
        Поток из пула переиспользуется между задачами. Значение, оставленное в
        ThreadLocal, держится этим долгоживущим потоком, пока ThreadLocal.remove()
        его не отвяжет.

assistantExample:
  en: 'e.g. How can a memory leak happen in Java if it has a garbage collector?'
  ru: 'например: Как в Java может произойти утечка памяти, если есть сборщик мусора?'

