bossFight:
  # I. Fundamentals of Logical Design
  - id: decision-layer
    en: 'How does the logical design phase function as the "decision layer" of a network, and why is it essential to establish this conceptual framework before any hardware implementation?'
    ru: 'Как фаза логического дизайна выполняет роль «слоя решений» сети и почему важно выстроить этот концептуальный каркас до какой-либо аппаратной реализации?'
  - id: logical-vs-physical
    en: 'Discuss the concept of designing for "logical complexity within physical simplicity." How can a single physical switch stack support multiple distinct logical zones?'
    ru: 'Обсудите концепцию проектирования «логической сложности внутри физической простоты». Как один физический стек коммутаторов может обслуживать несколько отдельных логических зон?'
  - id: business-centricity
    en: 'Why is it critical for network infrastructure to fit the business requirements rather than forcing the business to adapt to the limitations of existing infrastructure?'
    ru: 'Почему критически важно, чтобы сетевая инфраструктура соответствовала требованиям бизнеса, а не заставляла бизнес подстраиваться под ограничения существующей инфраструктуры?'
  - id: industry-requirements
    en: 'How do the specific needs of different industries (e.g., healthcare vs. retail) dictate varying expectations for uptime, latency, and security during the design process?'
    ru: 'Как специфические потребности разных отраслей (например, здравоохранение против розницы) диктуют разные ожидания по uptime, задержке и безопасности в процессе проектирования?'
  # II. IP Addressing and Management
  - id: addressing-blueprint
    en: 'Why is a structured IP addressing plan considered the foundation of network communication, and how does it prevent unmanageable routing tables?'
    ru: 'Почему структурированный план IP-адресации считается фундаментом сетевой коммуникации и как он предотвращает неуправляемые таблицы маршрутизации?'
  - id: postal-analogy-summarisation
    en: 'Explain the "postal system analogy" for hierarchical addressing. How does advertising broad prefixes stabilise the network core during local link failures?'
    ru: 'Объясните «аналогию с почтовой системой» для иерархической адресации. Как анонсирование широких префиксов стабилизирует ядро сети при локальных сбоях линков?'
  - id: vlsm-growth
    en: 'When using Variable Length Subnet Masking (VLSM), why should designers always allocate for 20% to 50% growth over a 3-to-5-year horizon?'
    ru: 'Почему при использовании Variable Length Subnet Masking (VLSM) проектировщики всегда должны закладывать рост на 20%–50% на горизонте 3–5 лет?'
  - id: ipv6-logic-shift
    en: 'How does the transition to IPv6 represent a shift from address conservation to clean, hierarchical grouping?'
    ru: 'Почему переход на IPv6 означает сдвиг от экономии адресов к чистой иерархической группировке?'
  # III. Logical Segmentation and VLANs
  - id: vlan-compliance
    en: 'Beyond just grouping devices, how do VLANs address specific business needs like regulatory compliance (e.g., PCI-DSS or HIPAA)?'
    ru: 'Помимо простой группировки устройств, как VLAN решают конкретные бизнес-задачи вроде регуляторного соответствия (например, PCI-DSS или HIPAA)?'
  - id: native-vlan-security
    en: 'Why is it a best practice to implement unused or unique native VLANs on trunks, and what specific security risks like "VLAN-hopping" does this mitigate?'
    ru: 'Почему лучшая практика — использовать неиспользуемые или уникальные native VLAN на транках и какие конкретные риски безопасности вроде «VLAN-hopping» это снижает?'
  - id: inter-vlan-routing-models
    en: 'Compare the use of "Router-on-a-Stick" with Layer 3 switches using Switch Virtual Interfaces (SVIs). In what scenarios is hardware-speed routing preferred?'
    ru: 'Сравните «Router-on-a-Stick» с коммутаторами Layer 3, использующими Switch Virtual Interfaces (SVI). В каких сценариях предпочтительна маршрутизация на аппаратной скорости?'
  - id: hierarchy-tags
    en: 'How can using tags and pre-defined properties at different levels of a logical hierarchy simplify large-scale network deployments?'
    ru: 'Как использование тегов и предопределённых свойств на разных уровнях логической иерархии упрощает крупномасштабные развёртывания сети?'
  # IV. Routing Strategies and Protocols
  - id: static-vs-dynamic
    en: 'Discuss the trade-offs between static routing''s high security and low overhead versus dynamic routing''s ability to adapt to failures in redundant paths.'
    ru: 'Обсудите компромисс между высокой безопасностью и низкими накладными расходами статической маршрутизации и способностью динамической маршрутизации адаптироваться к сбоям на избыточных путях.'
  - id: bellman-ford-vs-dijkstra
    en: 'Contrast the convergence times and loop-prevention capabilities of the Bellman-Ford (Distance Vector) and Dijkstra (Link State) algorithms.'
    ru: 'Сопоставьте времена сходимости и способность предотвращать петли у алгоритмов Bellman-Ford (Distance Vector) и Dijkstra (Link State).'
  - id: single-igp-strategy
    en: 'Why is it a strategic goal for an enterprise to deploy a single Interior Gateway Protocol (IGP) rather than a mix of protocols across the organisation?'
    ru: 'Почему стратегическая цель предприятия — развернуть единый Interior Gateway Protocol (IGP), а не смесь протоколов по всей организации?'
  - id: passive-interfaces
    en: 'How does implementing "Passive Interfaces" on ports connected to end-devices enhance both security and router performance?'
    ru: 'Как применение «Passive Interfaces» на портах, подключённых к конечным устройствам, повышает и безопасность, и производительность маршрутизатора?'
  # V. Performance, Availability, and Resiliency
  - id: qos-12-class-model
    en: 'Why is it necessary to prioritise time-sensitive traffic like voice and video over "elastic" data flows, and what is the role of the 12-Class Model (RFC 4594) in this?'
    ru: 'Почему необходимо приоритизировать чувствительный ко времени трафик вроде голоса и видео над «эластичными» потоками данных и какова роль 12-классовой модели (RFC 4594) в этом?'
  - id: vss-vs-stackwise
    en: 'Contrast Virtual Switching System (VSS) and StackWise. How do these clustering technologies simplify the Spanning Tree Protocol (STP) topology?'
    ru: 'Сопоставьте Virtual Switching System (VSS) и StackWise. Как эти технологии кластеризации упрощают топологию Spanning Tree Protocol (STP)?'
  - id: nsf-sso-failover
    en: 'Explain how Non-Stop Forwarding (NSF) and Stateful Switchover (SSO) enable transparent supervisor failover without dropping traffic.'
    ru: 'Объясните, как Non-Stop Forwarding (NSF) и Stateful Switchover (SSO) обеспечивают прозрачное переключение supervisor без потери трафика.'
  - id: design-pitfalls
    en: 'What are the dangers of overcomplicating a logical design or assuming redundancy exists without performing rigorous implementation testing?'
    ru: 'Чем опасны переусложнение логического дизайна и предположение о наличии избыточности без строгого тестирования при внедрении?'
