# Theory topic: no missions (there is no practice editor) - only a Boss Fight.
bossFight:
  - id: define-candidate-query
    en: What makes a query a good candidate for optimization?
    ru: Что делает запрос хорошим кандидатом для оптимизации?
  - id: metrics-to-check
    en: Which production metrics would you check before deciding to optimize a query?
    ru: Какие производственные метрики вы проверите перед решением оптимизировать запрос?
  - id: latency-vs-total-time
    en: Why is the slowest single query not always the first one to optimize?
    ru: Почему самый медленный одиночный запрос не всегда нужно оптимизировать первым?
  - id: slow-log-vs-apm
    en: How do slow-query logs and APM traces complement each other?
    ru: Как slow-query logs и APM traces дополняют друг друга?
  - id: plan-evidence
    en: Why should you inspect the query plan before changing SQL or adding an index?
    ru: Почему перед изменением SQL или добавлением индекса нужно посмотреть план запроса?
  - id: business-impact
    en: How does business impact change the priority of query optimization work?
    ru: Как бизнес-влияние меняет приоритет работы по оптимизации запросов?
  - id: avoid-premature-optimization
    en: What are signs that optimizing a query now would be premature?
    ru: Какие признаки говорят, что оптимизировать запрос сейчас преждевременно?
  - id: validate-improvement
    en: After optimizing a query, how do you prove that the change helped?
    ru: Как после оптимизации запроса доказать, что изменение помогло?
