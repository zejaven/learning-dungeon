# Theory topic: no missions because there is no practice editor.
bossFight:
  - id: real-use-case
    en: 'Name a real use case for a Spring prototype bean.'
    ru: 'Назови реальный use case для prototype-бина в Spring.'
  - id: why-stateful-helper
    en: 'Why is a short-lived stateful helper a better prototype candidate than a stateless service?'
    ru: 'Почему короткоживущий stateful helper лучше подходит для prototype, чем stateless-сервис?'
  - id: singleton-injection-trap
    en: 'What happens if a prototype bean is injected directly into a singleton service?'
    ru: 'Что произойдёт, если prototype-бин напрямую внедрить в singleton-сервис?'
  - id: fresh-instance
    en: 'How should a singleton service obtain a fresh prototype instance for each operation?'
    ru: 'Как singleton-сервис должен получать свежий prototype-экземпляр для каждой операции?'
  - id: lifecycle-ownership
    en: 'Which parts of the prototype lifecycle does Spring manage, and what remains the caller''s responsibility?'
    ru: 'Какими частями lifecycle prototype-бина управляет Spring, и что остаётся ответственностью caller?'
  - id: request-scope-thread-safety
    en: 'Why is prototype scope not a replacement for request scope or a complete thread-safety solution?'
    ru: 'Почему prototype scope не заменяет request scope и не является полноценным решением thread-safety?'
