missions:
  - id: stage-persist
    title:
      en: Stage a row
      ru: Подготовь строку
    goal:
      en: Run a @Transactional method that calls persist before the transaction is committed.
      ru: Запусти @Transactional метод, который вызывает persist до фиксации транзакции.
    event: SPRING_ENTITY_PERSISTED
  - id: default-runtime-rollback
    title:
      en: See default runtime rollback
      ru: Увидь default rollback для runtime
    goal:
      en: Make an unchecked exception leave the method so Spring chooses rollback by default.
      ru: Сделай так, чтобы unchecked exception вышел из метода и Spring выбрал rollback по умолчанию.
    event: SPRING_TX_DEFAULT_ROLLBACK
  - id: checked-commits
    title:
      en: Compare checked exception
      ru: Сравни checked exception
    goal:
      en: Throw a checked exception without rollbackFor and observe that Spring may commit.
      ru: Брось checked exception без rollbackFor и посмотри, что Spring может зафиксировать транзакцию.
    event: SPRING_TX_CHECKED_COMMIT
  - id: rollback-for-checked
    title:
      en: Add rollbackFor
      ru: Добавь rollbackFor
    goal:
      en: Configure rollbackFor for a checked exception and make that checked exception roll back.
      ru: Настрой rollbackFor для checked exception и заставь этот checked exception откатить транзакцию.
    event: SPRING_TX_ROLLBACK_FOR_MATCH
  - id: external-call-inside-tx
    title:
      en: Fail after persist
      ru: Ошибка после persist
    goal:
      en: Call an external system after persist but before the @Transactional method exits.
      ru: Вызови внешнюю систему после persist, но до выхода из @Transactional метода.
    event: SPRING_EXTERNAL_CALL_FAILED
  - id: failure-after-commit
    title:
      en: Fail after commit
      ru: Ошибка после commit
    goal:
      en: Commit first, then fail in an external call outside that transaction.
      ru: Сначала зафиксируй транзакцию, затем получи ошибку во внешнем вызове вне этой транзакции.
    event: SPRING_EXTERNAL_EXCEPTION_AFTER_COMMIT

bossFight:
  - id: default-rollback-rule
    en: 'On which exceptions does Spring @Transactional roll back by default?'
    ru: 'На каких исключениях Spring @Transactional откатывается по умолчанию?'
  - id: checked-exception-default
    en: 'What happens by default when a checked exception propagates out of a @Transactional method?'
    ru: 'Что по умолчанию происходит, когда checked exception выходит из @Transactional метода?'
  - id: rollback-for-use
    en: 'How do rollbackFor and noRollbackFor change the rollback decision?'
    ru: 'Как rollbackFor и noRollbackFor меняют решение об откате?'
  - id: persist-before-external-failure
    en: 'If a @Transactional method calls persist and then an external client throws RuntimeException before the method returns, does the persisted entity commit?'
    ru: 'Если @Transactional метод вызывает persist, а затем внешний клиент бросает RuntimeException до возврата метода, зафиксируется ли entity?'
  - id: after-commit-boundary
    en: 'Why can an exception thrown after the transactional method already returned no longer roll back that transaction?'
    ru: 'Почему exception, брошенный после возврата transactional метода, уже не может откатить эту транзакцию?'
  - id: common-traps
    en: 'Name two traps that make developers expect rollback but get commit instead.'
    ru: 'Назови две ловушки, из-за которых разработчики ожидают rollback, а получают commit.'
