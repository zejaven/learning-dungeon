summary:
  en: >
    The question sounds like it wants a list, and a list is the weakest answer
    available. A metric is a cheap number over time with low cardinality: it tells
    you whether something is wrong, how bad it is and since when, and it never
    tells you why — that is what logs, traces and a profiler are for. Organise the
    answer instead of enumerating it: RED (rate, errors, duration) for anything
    that serves requests, USE (utilisation, saturation, errors) for anything that
    is a resource, and the four golden signals as the shortlist you alert on. Then
    walk the layers, top down, because that is the order in which they matter:
    business counters that are the only proof the system is doing its job,
    per-endpoint request metrics read as percentiles rather than averages,
    dependency metrics with timeouts and circuit-breaker state, connection-pool
    wait time and query duration, JVM heap and GC pauses with the post-GC live set
    as the real leak signal, thread-pool queue depth as a leading indicator,
    consumer lag and DLQ size, cache hit ratio, host and container metrics
    including the CPU throttling everyone forgets, and real-user timings from the
    browser. Know the four instrument types (counter, gauge, histogram, timer) and
    why a histogram aggregates across instances while a client-side quantile does
    not. The traps are reading the average, averaging p99 across pods, mistaking
    utilisation for saturation, putting a user id in a label and exploding
    cardinality, alerting on causes instead of symptoms, and believing a wall of
    dashboards is observability.
  ru: >
    Вопрос звучит так, будто ему нужен список, а список — самый слабый из
    возможных ответов. Метрика — это дешёвое число во времени с низкой
    кардинальностью: она говорит, что что-то не так, насколько плохо и с какого
    момента, и никогда не говорит почему — для этого есть логи, трейсы и
    профилировщик. Ответ надо организовать, а не перечислить: RED (rate, errors,
    duration) для всего, что обслуживает запросы, USE (utilization, saturation,
    errors) для всего, что является ресурсом, и четыре золотых сигнала как
    короткий список для алертов. Затем пройти по слоям сверху вниз, потому что
    именно в этом порядке они важны: бизнес-счётчики — единственное доказательство,
    что система делает свою работу; метрики запросов по эндпоинтам, читаемые как
    перцентили, а не как среднее; метрики зависимостей с таймаутами и состоянием
    circuit breaker; время ожидания соединения из пула и длительность запросов;
    heap и паузы GC, где настоящий признак утечки — live set после полной сборки;
    глубина очереди пула потоков как опережающий индикатор; consumer lag и размер
    DLQ; hit ratio кэша; метрики хоста и контейнера, включая забываемый всеми
    CPU throttling; и реальные тайминги у пользователя в браузере. Плюс четыре типа
    инструментов (counter, gauge, histogram, timer) и понимание, почему histogram
    агрегируется между экземплярами, а посчитанный на клиенте квантиль — нет.
    Ловушки: читать среднее, усреднять p99 по подам, путать utilization с
    saturation, класть user id в лейбл и взрывать кардинальность, алертить на
    причины вместо симптомов и считать стену дашбордов наблюдаемостью.

