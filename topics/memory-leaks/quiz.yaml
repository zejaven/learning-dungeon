missions:
  - id: allocate-object
    title:
      en: Allocate an object
      ru: Создай объект
    goal:
      en: Allocate an object on the heap referenced by a holder.
      ru: Создай объект в куче, на который ссылается holder.
    event: ALLOCATE
  - id: collect-unreferenced
    title:
      en: Let the GC reclaim it
      ru: Дай GC его освободить
    goal:
      en: Drop the last reference and run a GC so the object is collected.
      ru: Убери последнюю ссылку и запусти GC, чтобы объект был собран.
    event: GC_COLLECTED
  - id: store-in-long-lived-root
    title:
      en: Store into a long-lived root
      ru: Сохрани в долгоживущий root
    goal:
      en: Add a reference from a long-lived root (static cache, listener, ThreadLocal).
      ru: Добавь ссылку от долгоживущего root (статический кэш, listener, ThreadLocal).
    event: REFERENCE_ADDED
  - id: cause-a-leak
    title:
      en: Cause a memory leak
      ru: Вызови утечку памяти
    goal:
      en: Let a long-lived root keep an object you no longer need across a GC.
      ru: Сделай так, чтобы долгоживущий root удержал ненужный объект через GC.
    event: LEAK_DETECTED
  - id: fix-the-leak
    title:
      en: Release the reference
      ru: Отпусти ссылку
    goal:
      en: Drop the long-lived reference (evict / unregister / remove) so the GC can free the object.
      ru: Убери долгоживущую ссылку (evict / unregister / remove), чтобы GC мог освободить объект.
    event: REFERENCE_REMOVED

bossFight:
  - id: leak-with-gc
    en: How can a memory leak happen in Java if it has a garbage collector?
    ru: Как в Java может произойти утечка памяти, если есть сборщик мусора?
  - id: common-leak-sources
    en: Name several common sources of memory leaks in Java.
    ru: Назови несколько типичных источников утечек памяти в Java.
  - id: static-collection-trap
    en: Why does an ever-growing static collection cause a leak?
    ru: Почему постоянно растущая статическая коллекция вызывает утечку?
  - id: threadlocal-leak-pool
    en: Why are ThreadLocals dangerous in a thread pool, and how do you avoid the leak?
    ru: Почему ThreadLocal опасны в пуле потоков и как избежать утечки?
  - id: listener-leak
    en: How do unregistered listeners or callbacks leak memory?
    ru: Как незарегистрированные обратно listener или callback приводят к утечке памяти?
  - id: leak-vs-reachable
    en: What is the difference between an object being garbage and an object being unreachable?
    ru: В чём разница между тем, что объект — мусор, и тем, что объект недостижим?
  - id: detect-leaks
    en: How would you detect and diagnose a memory leak in a running Java application?
    ru: Как бы ты обнаружил и диагностировал утечку памяти в работающем Java-приложении?
