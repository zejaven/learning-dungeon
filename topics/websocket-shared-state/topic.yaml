id: websocket-shared-state
languages: [en, ru]
title:
  en: 'Shared State Across WebSocket Connections'
  ru: 'Общее состояние на все WebSocket-соединения'
category:
  en: Networking / Real-Time
  ru: Сети / Реальное время
type: CONCURRENCY
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: networking
difficulty: 3
catalogId: networking-4
summary:
  en: >
    Two questions that fail in different ways. First, where the registry of open
    connections lives: an instance field on a per-connection endpoint is not
    shared at all, a static HashMap is shared but loses entries under two
    threads, Collections.synchronizedMap makes each call atomic but throws while
    you iterate it, and ConcurrentHashMap on a singleton bean is the answer for
    one process. Second, where the value that must be unique comes from:
    nextId++ and sessions.size() + 1 are read-then-write, so two threads hand out
    the same number, and no thread-safe map fixes that because a thread-safe
    collection promises one atomic call, never an atomic sequence of calls.
    AtomicLong and synchronized do fix it — and stop exactly at the edge of the
    JVM, so a second node behind the load balancer starts counting at 1 again.
    Past that edge there are only two shapes: generate something wide enough that
    nobody has to be asked (UUID), or ask the one authority everybody shares (a
    database sequence, Redis INCR). And a concurrent registry still says nothing
    about two threads writing into one session, which needs mutual exclusion per
    session, not concurrency.
  ru: >
    Два вопроса, которые ломаются по-разному. Первый — где живёт реестр открытых
    соединений: поле экземпляра эндпоинта, создаваемого на соединение, не является
    общим вообще, статический HashMap общий, но под двумя потоками теряет записи,
    Collections.synchronizedMap делает атомарным каждый вызов, но бросает
    исключение при обходе, а ConcurrentHashMap в singleton-бине — ответ для одного
    процесса. Второй — откуда берётся значение, которое обязано быть уникальным:
    nextId++ и sessions.size() + 1 — это «прочитать, потом записать», поэтому два
    потока выдают один и тот же номер, и никакая потокобезопасная карта этого не
    чинит, потому что потокобезопасная коллекция обещает атомарность одного
    вызова, а не последовательности вызовов. AtomicLong и synchronized это чинят —
    и заканчиваются ровно на границе JVM, поэтому второй узел за балансировщиком
    снова начинает счёт с единицы. За этой границей форм всего две: сгенерировать
    настолько широкое значение, что спрашивать не у кого (UUID), либо спросить у
    единственного общего авторитета (последовательность в базе, Redis INCR). А
    конкурентный реестр по-прежнему ничего не говорит про два потока, пишущих в
    одну сессию: там нужно взаимное исключение на сессию, а не конкурентность.

