bossFight:
  - id: alpha-vs-beta
    en: 'What is the difference between alpha and beta testing? Who performs each of them and in what environment?'
    ru: 'В чём различия альфа- и бета-тестирования? Кто выполняет каждое из них и в каком окружении?'
  - id: alpha-beta-order
    en: 'Which comes first in the release lifecycle — alpha or beta testing — and why is that order important?'
    ru: 'Что идёт раньше в жизненном цикле релиза — альфа- или бета-тестирование — и почему важен именно такой порядок?'
  - id: closed-vs-open-beta
    en: 'What is the difference between closed beta and open beta? When would you choose each approach?'
    ru: 'Чем closed beta отличается от open beta? В каких случаях вы бы выбрали каждый из подходов?'
  - id: ab-testing-example
    en: 'What is A/B testing? Give an example, for instance how a button color change can affect purchase conversion.'
    ru: 'Что такое A/B-тестирование? Приведи пример — например, как изменение цвета кнопки может повлиять на конверсию в покупку.'
  - id: ab-not-bug-hunting
    en: 'Why is A/B testing considered a product experiment rather than a way to find bugs? Who typically owns A/B tests in a company?'
    ru: 'Почему A/B-тестирование считается продуктовым экспериментом, а не способом поиска багов? Кто обычно владеет A/B-тестами в компании?'
  - id: ab-one-factor
    en: 'Why should an A/B test change only one factor at a time? What is multivariate testing and when is it needed?'
    ru: 'Почему в A/B-тесте нужно менять только один фактор за раз? Что такое многовариантное (multivariate) тестирование и когда оно нужно?'
  - id: ab-statistical-significance
    en: 'Why is statistical significance critical when interpreting A/B test results? What can go wrong with a small sample?'
    ru: 'Почему статистическая значимость критична при интерпретации результатов A/B-теста? Что может пойти не так при маленькой выборке?'
  - id: beta-critical-bug
    en: 'What would you do if beta testing revealed a critical bug one day before the planned release?'
    ru: 'Что будешь делать, если бета-тестирование выявило критичный баг за день до запланированного релиза?'
