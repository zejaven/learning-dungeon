missions:
  - id: create-task
    title:
      en: Create work
      ru: Создай работу
    goal:
      en: Run code that creates a Runnable task before a Java thread starts.
      ru: Запусти код, который создает задачу Runnable до старта Java thread.
    event: RUNNABLE_CREATED
  - id: start-worker
    title:
      en: Start a worker
      ru: Запусти worker
    goal:
      en: Call start() so the JVM runs the task on a separate Java thread.
      ru: Вызови start(), чтобы JVM выполнила задачу в отдельном Java thread.
    event: THREAD_STARTED
  - id: execute-task
    title:
      en: Execute the task
      ru: Выполни задачу
    goal:
      en: Let the Runnable body execute on a Java thread.
      ru: Дай телу Runnable выполниться в Java thread.
    event: RUNNABLE_EXECUTED
  - id: terminate-worker
    title:
      en: Finish the worker
      ru: Заверши worker
    goal:
      en: Let a started Thread finish and reach TERMINATED.
      ru: Дай запущенному Thread завершиться и перейти в TERMINATED.
    event: THREAD_TERMINATED
  - id: compare-run-start
    title:
      en: Compare run() and start()
      ru: Сравни run() и start()
    goal:
      en: Call run() directly and observe that it does not start a separate thread.
      ru: Вызови run() напрямую и увидь, что он не запускает отдельный thread.
    event: THREAD_RUN_CALLED_DIRECTLY
  - id: reuse-runnable
    title:
      en: Reuse a task
      ru: Переиспользуй задачу
    goal:
      en: Attach the same Runnable instance to more than one Thread object.
      ru: Привяжи один экземпляр Runnable к нескольким объектам Thread.
    event: RUNNABLE_REUSED

bossFight:
  - id: process-vs-thread
    en: What is the difference between a JVM process and Java threads running inside it?
    ru: В чем разница между процессом JVM и Java threads, которые выполняются внутри него?
  - id: start-vs-run
    en: What exactly happens when you call start(), and why is direct run() different?
    ru: Что именно происходит при вызове start(), и почему прямой вызов run() отличается?
  - id: thread-memory
    en: Which memory is private to each thread, and which memory is shared between threads?
    ru: Какая память приватна для каждого thread, а какая общая между threads?
  - id: scheduler
    en: Why can two correct-looking multithreaded programs behave differently from run to run?
    ru: Почему две внешне правильные многопоточные программы могут вести себя по-разному от запуска к запуску?
  - id: shared-state-risk
    en: Why does shared mutable state need synchronization or another concurrency control?
    ru: Почему общее изменяемое состояние требует synchronized или другого контроля concurrency?
  - id: higher-level-tools
    en: When would you prefer ExecutorService, CompletableFuture, or parallel streams over creating Thread manually?
    ru: Когда лучше выбрать ExecutorService, CompletableFuture или parallel streams вместо ручного создания Thread?
