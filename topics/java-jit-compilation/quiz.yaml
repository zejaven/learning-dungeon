missions:
  - id: interpret-first
    title:
      en: Start in the interpreter
      ru: Начни с интерпретатора
    goal:
      en: Run code that calls a method before it is hot, so the JVM interprets bytecode.
      ru: Запусти код, который вызывает метод до того, как он стал hot, чтобы JVM интерпретировала bytecode.
    event: JIT_INTERPRET
  - id: find-hot-method
    title:
      en: Make code hot
      ru: Сделай код hot
    goal:
      en: Repeat a method call until the profiler marks it as hot.
      ru: Повторяй вызов метода, пока profiler не отметит его как hot.
    event: JIT_PROFILE_HOT
  - id: compile-hot-method
    title:
      en: Trigger JIT compilation
      ru: Запусти JIT compilation
    goal:
      en: Reach the compile threshold so the JIT compiler produces native machine code.
      ru: Достигни compile threshold, чтобы JIT compiler создал native machine code.
    event: JIT_COMPILE
  - id: run-optimized
    title:
      en: Use optimized code
      ru: Используй optimized code
    goal:
      en: Call an already compiled method and run through optimized machine code.
      ru: Вызови уже скомпилированный метод и выполни его через optimized machine code.
    event: JIT_OPTIMIZED_CALL
  - id: inline-helper
    title:
      en: Inline a helper
      ru: Встрой helper
    goal:
      en: Inline a small helper method into a compiled caller.
      ru: Встрой маленький helper method в скомпилированный caller.
    event: JIT_INLINE
  - id: remove-allocation
    title:
      en: Remove an allocation
      ru: Убери аллокацию
    goal:
      en: Use escape analysis to remove a temporary allocation from compiled code.
      ru: Используй escape analysis, чтобы убрать временную аллокацию из compiled code.
    event: JIT_ESCAPE_ELIMINATION
  - id: deoptimize-code
    title:
      en: Deoptimize
      ru: Выполни deoptimization
    goal:
      en: Break a runtime assumption so the JVM falls back from optimized code to the interpreter.
      ru: Сломай runtime assumption, чтобы JVM вернулась из optimized code к интерпретатору.
    event: JIT_DEOPTIMIZE

bossFight:
  - id: java-python-speed
    en: Why is Java often faster than Python on CPU-bound workloads?
    ru: Почему Java часто быстрее Python на CPU-bound нагрузках?
  - id: warmup-and-threshold
    en: What is JVM warmup and why does JIT compilation usually happen only after repeated calls?
    ru: Что такое прогрев JVM и почему JIT compilation обычно происходит только после повторных вызовов?
  - id: jit-optimizations
    en: Name three optimizations a JVM JIT compiler can apply and explain one of them.
    ru: Назови три оптимизации, которые может применить JVM JIT compiler, и объясни одну из них.
  - id: deoptimization
    en: Why can optimized JVM code be deoptimized at runtime?
    ru: Почему оптимизированный JVM code может быть deoptimized во время выполнения?
  - id: speed-caveats
    en: When would Python not be slower than Java in practice?
    ru: Когда Python на практике не будет медленнее Java?
