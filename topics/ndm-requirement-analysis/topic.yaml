summary:
  en: >
    The most critical phase of network design: top-down vs bottom-up
    methodology, business goals, constraints and workplace politics,
    application profiling with real-time metrics (latency < 150 ms,
    jitter < 30 ms, loss < 1%), "Five Nines" availability maths, Zero Trust,
    device density, NetFlow/SNMP/DPI analysis, trade-off matrices, and the
    Requirements Specification Document.
  ru: >
    Самая критичная фаза проектирования сети: методология top-down против
    bottom-up, бизнес-цели, ограничения и офисная политика, профилирование
    приложений с метриками реального времени (задержка < 150 мс,
    jitter < 30 мс, потери < 1%), математика доступности «пять девяток»,
    Zero Trust, плотность устройств, анализ через NetFlow/SNMP/DPI, матрицы
    компромиссов и документ спецификации требований.

assistantExample:
  en: "e.g. Why does a bottom-up design approach often lead to expensive gold-plating?"
  ru: "например: Почему подход bottom-up в проектировании часто приводит к дорогому «gold-plating»?"

