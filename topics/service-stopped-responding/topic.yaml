primitives:
  - BoxGroup

defaultExample: which-kind-of-not-responding

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: restart-and-lose-the-cause
    title:
      en: 'Restart first, learn nothing'
      ru: 'Сначала перезапустить, не узнать ничего'
    file: 01-restart-and-lose-the-cause.java
    explanation:
      en: >
        The reflex, run to its conclusion. Traffic is back in two minutes, which
        is why this habit is so hard to argue with — and then the two commands
        that would have explained everything are attempted twenty minutes too
        late, against a process that no longer exists. A hung JVM is the only
        copy of the cause, and a restart is the one action that both fixes the
        outage and deletes it.
      ru: >
        Рефлекс, доведённый до конца. Трафик возвращается за две минуты, и именно
        поэтому с этой привычкой так трудно спорить, — а затем две команды,
        которые всё бы объяснили, выполняются на двадцать минут позже, против
        процесса, которого больше нет. Зависшая JVM — единственная копия причины,
        а перезапуск — единственное действие, которое одновременно чинит аварию и
        стирает её.
  - id: which-kind-of-not-responding
    title:
      en: 'Which kind of "not responding"?'
      ru: 'Какое именно «не отвечает»?'
    file: 02-which-kind-of-not-responding.java
    explanation:
      en: >
        The first minute, done properly: six commands from DNS down to a curl
        against localhost inside the container, each one deleting a whole family
        of hypotheses. Then the same sentence from three different reporters
        classified into three failure modes with nothing in common — a live
        process answering nobody, an empty port, and two sick pods standing next
        to three healthy ones.
      ru: >
        Первая минута, сделанная правильно: шесть команд от DNS до curl на
        localhost изнутри контейнера, и каждая вычёркивает целое семейство
        гипотез. Затем одна и та же фраза от трёх разных людей раскладывается на
        три режима сбоя, у которых нет ничего общего: живой процесс, не
        отвечающий никому, пустой порт и два больных пода рядом с тремя
        здоровыми.
  - id: capture-before-you-restart
    title:
      en: 'Twenty seconds that keep the cause'
      ru: 'Двадцать секунд, сохраняющие причину'
    file: 03-capture-before-you-restart.java
    explanation:
      en: >
        The capture list, in order, taken while the process is still hung: three
        thread dumps five seconds apart (one shows where threads are, three show
        whether they move), a heap histogram, the GC log that was already being
        written, and the pool gauges. Then service is restored the way it should
        be — and one hung pod is deliberately kept alive out of the load
        balancer.
      ru: >
        Список артефактов по порядку, снятый пока процесс ещё висит: три дампа
        потоков с интервалом в пять секунд (один показывает, где потоки, три —
        движутся ли они), гистограмма кучи, лог GC, который и так писался, и
        показания пулов. Затем сервис восстанавливают как положено — и один
        зависший под намеренно оставляют живым вне балансировки.
  - id: read-the-thread-dump
    title:
      en: 'Read the dump by counting'
      ru: 'Читай дамп счётом'
    file: 04-read-the-thread-dump.java
    explanation:
      en: >
        Two hundred stacks are not read line by line; they are grouped by top
        frame and counted, and the biggest group is the outage. Here 198 of 200
        workers sit in the same socket read against the same host in all three
        dumps, while the database pool is 3 of 20 in use with nobody queueing —
        which is how the database gets cleared by evidence instead of by
        reputation.
      ru: >
        Двести стеков не читают построчно: их группируют по верхнему кадру и
        считают, и самая большая группа и есть авария. Здесь 198 воркеров из 200
        сидят в одном и том же чтении сокета к одному и тому же хосту во всех
        трёх дампах, а пул базы занят на 3 из 20 и без очереди — именно так базу
        снимают с подозрения уликой, а не репутацией.
  - id: why-the-pool-vanished
    title:
      en: 'Why the pool vanished in 1.6s'
      ru: 'Почему пул исчез за 1,6 секунды'
    file: 05-why-the-pool-vanished.java
    explanation:
      en: >
        One line of arithmetic makes the whole failure feel inevitable instead of
        mysterious: capacity is threads divided by service time. The same 200
        workers are 4000 req/s of capacity at 50ms and 25 req/s at 8s, so a
        dependency that slowed down took the service with it. Doubling the pool
        buys 1.6 seconds and doubles the load on the thing that is already dying;
        a 1s timeout multiplies capacity by eight.
      ru: >
        Одна строчка арифметики превращает весь сбой из загадочного в
        неизбежный: пропускная способность равна числу потоков, делённому на
        время обслуживания. Те же 200 воркеров — это 4000 запр/с при 50мс и 25
        запр/с при 8с, поэтому замедлившаяся зависимость утащила сервис за собой.
        Удвоение пула покупает 1,6 секунды и вдвое увеличивает нагрузку на то,
        что и так умирает; таймаут в 1с умножает способность на восемь.
  - id: the-other-three-suspects
    title:
      en: 'GC, deadlock, and below the JVM'
      ru: 'GC, взаимоблокировка и то, что ниже JVM'
    file: 06-the-other-three-suspects.java
    explanation:
      en: >
        Three services that all "stopped responding" and share no cause. A JVM at
        100% CPU spending 78% of the clock in GC pauses with a heap still 97%
        full after a collection; a JVM at 2% CPU with two threads holding what
        each other needs, which the dump proves itself; and a service whose last
        log line is six minutes old because the disk is full, so the exception it
        would have logged is the write that fails.
      ru: >
        Три сервиса, которые все «перестали отвечать» и не имеют ни одной общей
        причины. JVM со 100% CPU, проводящая 78% времени в паузах GC, с кучей,
        заполненной на 97% сразу после сборки; JVM с 2% CPU, где два потока
        держат нужное друг другу, — и это доказывает сам дамп; и сервис, у
        которого последняя строка лога шестиминутной давности, потому что диск
        полон и падает как раз запись того исключения, которое всё бы объяснило.
  - id: fix-verify-prevent
    title:
      en: 'Fix, verify, and leave a guard'
      ru: 'Исправить, проверить и оставить защиту'
    file: 07-fix-verify-prevent.java
    explanation:
      en: >
        The whole incident in one run, including the wrong turn. The
        plausible-sounding change — double the pool, add pods — ships with
        nothing confirmed and produces 396 stuck workers instead of 198. Then
        service is restored with a flag, the cause is confirmed from the
        evidence, and the real fix has two halves: the timeout and bulkhead that
        make somebody else's outage survivable, plus the alert that would have
        noticed before a human did.
      ru: >
        Весь инцидент за один прогон, вместе с неверным поворотом.
        Правдоподобно звучащее изменение — удвоить пул, добавить подов —
        выкатывается без единого подтверждения и даёт 396 застрявших воркеров
        вместо 198. Затем сервис восстанавливают флагом, причину подтверждают по
        уликам, а у настоящего исправления две половины: таймаут и переборка,
        делающие чужую аварию переживаемой, плюс алерт, который заметил бы
        раньше человека.

