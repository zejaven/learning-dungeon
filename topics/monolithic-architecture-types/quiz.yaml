# Theory topic: no missions because there is no practice editor, only Boss Fight.
bossFight:
  - id: define-monolith
    en: 'What makes an architecture monolithic: the code layout, the deployment unit, or the database?'
    ru: 'Что делает архитектуру монолитной: структура кода, единица развертывания или база данных?'
  - id: name-main-types
    en: 'Name the main types of monolithic architectures and the key difference between them.'
    ru: 'Назовите основные виды монолитных архитектур и ключевое различие между ними.'
  - id: layered-vs-modular
    en: 'How is a layered monolith different from a modular monolith?'
    ru: 'Чем слоистый monolith отличается от modular monolith?'
  - id: modular-benefits
    en: 'Why can a modular monolith be a good choice before extracting microservices?'
    ru: 'Почему modular monolith может быть хорошим выбором перед выделением microservices?'
  - id: ntier-trap
    en: 'Why does an N-tier deployment not automatically mean microservices?'
    ru: 'Почему N-tier deployment не означает автоматически microservices?'
  - id: distributed-monolith
    en: 'What is a distributed monolith, and why is it usually an anti-pattern?'
    ru: 'Что такое distributed monolith и почему это обычно anti-pattern?'
  - id: migration-signals
    en: 'What signs suggest that a monolith is ready to split into separate services?'
    ru: 'Какие признаки показывают, что monolith готов к разделению на отдельные services?'
