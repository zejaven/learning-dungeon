plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Keep this library dependency-free: the resulting jar is placed on the
// classpath of *user-written* Java code when it is compiled and run in the
// sandbox. Trace events are emitted as hand-rolled JSON so no third-party
// runtime is dragged into the sandbox.

test {
    useJUnitPlatform()
}

jar {
    archiveBaseName = 'visual-runtime'
}
