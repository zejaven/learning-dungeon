summary:
  en: >
    The "reality check" of network design within the PPDIOO lifecycle: RF
    attenuation by building materials, the 100-metre copper limit, MDF/IDF
    frameworks, PoE budgets and clean power, HVAC windows, the four wireless
    survey methodologies (predictive, passive, active, AP-on-a-Stick),
    spectrum analysis, legacy audits, truck-roll economics, and safety,
    security, and topology considerations.
  ru: >
    «Проверка реальностью» сетевого дизайна в жизненном цикле PPDIOO:
    затухание RF в строительных материалах, лимит меди в 100 метров,
    структура MDF/IDF, бюджеты PoE и «чистое» питание, климатические окна
    HVAC, четыре методологии wireless-обследования (predictive, passive,
    active, AP-on-a-Stick), спектральный анализ, аудит legacy-инфраструктуры,
    экономика «truck rolls», а также безопасность, охранные системы и выбор
    топологии.

