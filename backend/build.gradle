plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.interviewlearning'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.yaml:snakeyaml:2.2'
    // visual-runtime is also needed as a built jar on the *sandbox* classpath
    // (see RunnerProperties / JavaCodeRunner). The project dependency makes
    // Gradle build it before the backend runs.
    implementation project(':visual-runtime')

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// Run the backend from the repository root so that relative paths to topics/
// and the visual-runtime jar resolve consistently in dev.
bootRun {
    workingDir = rootProject.projectDir
    // Allow passing a question/prompt etc. through if ever needed.
    systemProperty 'app.repo-root', rootProject.projectDir.absolutePath
}
