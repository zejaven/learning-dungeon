# Theory topic: no missions (there is no practice editor) - only a Boss Fight.
bossFight:
  - id: define-normalization
    en: 'What is database normalization, and what problem does it solve?'
    ru: 'Что такое нормализация базы данных и какую проблему она решает?'
  - id: define-normal-form
    en: 'What is a normal form? Give examples of 1NF, 2NF and 3NF.'
    ru: 'Что такое нормальная форма? Приведите примеры 1NF, 2NF и 3NF.'
  - id: normalization-vs-denormalization
    en: 'How does denormalization differ from normalization?'
    ru: 'Чем денормализация отличается от нормализации?'
  - id: anomalies
    en: 'What are insert, update and delete anomalies, and how does normalization reduce them?'
    ru: 'Что такое аномалии вставки, обновления и удаления, и как нормализация их уменьшает?'
  - id: when-to-denormalize
    en: 'When is denormalization justified in a production system?'
    ru: 'Когда денормализация оправдана в промышленной системе?'
  - id: tradeoffs
    en: 'What risks does denormalization add to writes, storage and data consistency?'
    ru: 'Какие риски денормализация добавляет для записи, хранения и согласованности данных?'
  - id: indexes-vs-denormalization
    en: 'Why should you usually consider indexes and query design before denormalizing?'
    ru: 'Почему обычно стоит сначала рассмотреть индексы и дизайн запросов, а уже потом денормализацию?'
