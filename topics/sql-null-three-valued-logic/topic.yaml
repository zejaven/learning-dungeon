summary:
  en: >
    Practice how SQL treats NULL as unknown rather than zero, an empty string, or
    false. The seeded playground shows arithmetic with NULL, boolean expressions
    such as NULL OR TRUE and NULL OR FALSE, why WHERE keeps only TRUE rows, and why
    IS NULL is required for missing values.
  ru: >
    Разберите на практике, почему SQL трактует NULL как неизвестное значение, а
    не как ноль, пустую строку или false. Засеянная песочница показывает
    арифметику с NULL, булевы выражения вроде NULL OR TRUE и NULL OR FALSE, почему
    WHERE оставляет только строки с TRUE и зачем для пропусков нужен IS NULL.

assistantExample:
