bossFight:
- id: sit-release-day-critical-bug
  ru: 'Критический баг найден в день релиза: тимлид в отпуске, разработчик заболел. Опишите ваши действия по шагам.'
- id: sit-dev-cannot-reproduce
  ru: У вас баг воспроизводится, у разработчика — нет, и он регулярно возвращает баг со статусом «не воспроизводится». Как будете действовать?
- id: sit-unknown-feature-demo-tomorrow
  ru: Новую фичу вы в глаза не видели, а завтра — показ заказчику. Что будете тестировать в первую очередь и почему?
- id: sit-site-without-mouse
  ru: Как протестировать сайт без использования мышки? И что на самом деле проверяет интервьюер этим заданием?
- id: sit-all-bugs-in-five-minutes
  ru: 'Интервьюер просит найти все баги на сайте за 5 минут, а потом спрашивает: «А ещё?» Что он проверяет и как правильно отвечать?'
- id: sit-regression-two-days-left
  ru: Кодинг фичи закончился позже плана, и на регресс осталось 2 дня вместо недели. Как выстроить регрессионное тестирование?
- id: sit-bisect-binary-search
  ru: Известно, что в версии 110123 всё работает, а в версии 112123 есть баг. Как найти первую сломанную версию?
- id: sit-bisect-clarifying-questions
  ru: Какие уточняющие вопросы стоит задать перед тем, как начать поиск сломанной версии, и почему за них дают «бонус»?
- id: sit-production-only-feature
  ru: Есть функционал, который можно протестировать только на продакшене. Ваши действия?
