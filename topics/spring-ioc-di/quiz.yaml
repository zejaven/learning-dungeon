# Theory topic: no missions because there is no practice editor.
bossFight:
  - id: spring-core-purpose
    en: 'What is Spring, and what role does ApplicationContext play?'
    ru: 'Что такое Spring и какую роль играет ApplicationContext?'
  - id: define-ioc
    en: 'What does Inversion of Control mean in a Spring application?'
    ru: 'Что означает Inversion of Control в Spring-приложении?'
  - id: define-di
    en: 'What is Dependency Injection, and how does it implement IoC?'
    ru: 'Что такое Dependency Injection и как он реализует IoC?'
  - id: constructor-injection
    en: 'Why is constructor injection usually preferred over field injection?'
    ru: 'Почему constructor injection обычно предпочитают field injection?'
  - id: bean-definition
    en: 'What makes an object a Spring bean rather than just a Java object?'
    ru: 'Что делает объект Spring bean, а не просто Java object?'
  - id: multiple-candidates
    en: 'How does Spring choose a dependency when multiple beans implement the same interface?'
    ru: 'Как Spring выбирает dependency, когда несколько beans реализуют один interface?'
  - id: boot-vs-spring
    en: 'How does Spring Boot relate to Spring IoC and Dependency Injection?'
    ru: 'Как Spring Boot связан со Spring IoC и Dependency Injection?'
  - id: common-misconceptions
    en: 'Name two common misconceptions about Spring IoC or Dependency Injection.'
    ru: 'Назовите два частых заблуждения о Spring IoC или Dependency Injection.'
