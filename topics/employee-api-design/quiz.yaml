# Structural missions: checked against the analyzed class graph (not trace events).
# A mission passes when EVERY predicate in `requires` holds. Predicate kinds:
#   interfaceWithImpls { minImplementations, name? }
#   composition        { targetKind, ownerKind?, name? }
#   edge               { relation: extends|implements|association, from?, to? }
#   nodeExists         { nodeKind, name? }
missions:
  - id: salary-stack
    type: structure
    title:
      en: Salary department stack
      ru: Стек расчётного отдела
    goal:
      en: Build SalaryController that delegates to a SalaryService which holds an EmployeeRepository field.
      ru: Собери SalaryController, который делегирует SalaryService, а тот держит поле EmployeeRepository.
    requires:
      - { kind: edge, relation: association, from: SalaryController, to: SalaryService }
      - { kind: edge, relation: association, from: SalaryService, to: EmployeeRepository }
  - id: passport-stack
    type: structure
    title:
      en: Passport department stack
      ru: Стек кадрового отдела
    goal:
      en: Build PassportController that delegates to a PassportService which holds an EmployeeRepository field.
      ru: Собери PassportController, который делегирует PassportService, а тот держит поле EmployeeRepository.
    requires:
      - { kind: edge, relation: association, from: PassportController, to: PassportService }
      - { kind: edge, relation: association, from: PassportService, to: EmployeeRepository }
  - id: separate-controllers
    type: structure
    title:
      en: Two separate controllers
      ru: Два отдельных контроллера
    goal:
      en: Salary and passport must be exposed by SEPARATE controllers, not one shared class.
      ru: Зарплата и паспорт должны выставляться РАЗНЫМИ контроллерами, а не одним общим классом.
    requires:
      - { kind: nodeExists, nodeKind: class, name: SalaryController }
      - { kind: nodeExists, nodeKind: class, name: PassportController }
  - id: separation-end-to-end
    type: structure
    title:
      en: Separation end to end
      ru: Разделение насквозь
    goal:
      en: Both department stacks present at once — controller to service to repository, per department.
      ru: Оба стека отделов сразу — контроллер → сервис → репозиторий, по каждому отделу.
    requires:
      - { kind: edge, relation: association, from: SalaryController, to: SalaryService }
      - { kind: edge, relation: association, from: PassportController, to: PassportService }
      - { kind: edge, relation: association, from: SalaryService, to: EmployeeRepository }
      - { kind: edge, relation: association, from: PassportService, to: EmployeeRepository }

bossFight:
  - id: why-split-controllers
    en: Why split salary and passport into separate controllers instead of one EmployeeController with two endpoints?
    ru: Почему зарплату и паспорт стоит разнести на отдельные контроллеры, а не один EmployeeController с двумя эндпоинтами?
  - id: why-two-services
    en: Why also split the services, not just the controllers? What does the service layer add?
    ru: Почему разделять ещё и сервисы, а не только контроллеры? Что добавляет слой сервисов?
  - id: single-responsibility
    en: How does this layered split follow the Single Responsibility Principle at each layer?
    ru: Как это послойное разделение следует принципу единственной ответственности на каждом слое?
  - id: controller-role
    en: What is each controller's responsibility, and what should it NOT do?
    ru: В чём ответственность каждого контроллера и чего он делать НЕ должен?
  - id: shared-repository
    en: All stacks share one EmployeeRepository here. When might you split the storage per department too?
    ru: Здесь все стеки делят один EmployeeRepository. Когда стоит разделить и хранилище по отделам?
