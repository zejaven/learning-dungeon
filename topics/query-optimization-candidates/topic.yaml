summary:
  en: >
    Learn how to decide which database queries deserve optimization first:
    combine production metrics, slow-query logs, frequency, user impact, total
    database time, query plans and change risk instead of tuning the loudest
    single query blindly.
  ru: >
    Разбери, как выбирать запросы к базе данных для первоочередной оптимизации:
    соединяй производственные метрики, slow-query logs, частоту выполнения,
    влияние на пользователей, суммарное время работы базы, планы запросов и риск
    изменений, а не ускоряй вслепую самый заметный одиночный запрос.

