summary:
  en: >
    A method signature in Java is the method name plus the number, types and order
    of its parameters — and nothing else. The return type, access modifiers,
    parameter names and the throws clause are NOT part of it. This single rule
    explains overloading, overriding, and the classic "cannot have two methods
    that differ only by return type" error.
  ru: >
    Сигнатура метода в Java — это имя метода плюс количество, типы и порядок его
    параметров, и больше ничего. Тип возвращаемого значения, модификаторы доступа,
    имена параметров и блок throws в неё НЕ входят. Это единственное правило
    объясняет перегрузку, переопределение и классическую ошибку «нельзя иметь два
    метода, отличающихся только типом возвращаемого значения».

