summary:
  en: >
    A container image makes one process reproducible; it says nothing about what
    happens when the host dies, how twelve replicas find each other, or how v2
    replaces v1 without dropping requests. Kubernetes is the layer that owns
    those questions. You submit desired state — this image, three replicas, this
    much memory, this health check — and a set of controllers keeps comparing it
    with reality and correcting the difference: scheduling containers onto nodes,
    restarting crashed ones, replacing pods from a dead node, keeping a stable
    DNS name in front of changing pod IPs, rolling out a new version only as new
    pods report ready, and scaling the hot service instead of the whole system.
    The price is a real one: YAML, ingress, RBAC, cluster upgrades and a much
    larger surface to observe, which is why a single small service is usually
    better off on a managed platform than on a cluster you now have to operate.
  ru: >
    Образ контейнера делает воспроизводимым один процесс, но ничего не говорит
    о том, что произойдёт при отказе хоста, как двенадцать реплик найдут друг
    друга и как v2 заменит v1, не теряя запросы. Kubernetes — это слой, который
    берёт такие вопросы на себя. Вы описываете желаемое состояние — этот образ,
    три реплики, столько памяти, такая проверка здоровья, — а набор контроллеров
    постоянно сравнивает его с реальностью и устраняет расхождение: размещает
    контейнеры по узлам, перезапускает упавшие, пересоздаёт поды с умершего узла,
    держит стабильное DNS-имя перед меняющимися IP подов, выкатывает новую
    версию по мере готовности новых подов и масштабирует нагруженный сервис, а не
    систему целиком. Цена вполне реальна: YAML, ingress, RBAC, обновления
    кластера и заметно большая поверхность для наблюдения — поэтому одному
    небольшому сервису обычно лучше на управляемой платформе, чем в кластере,
    который теперь нужно эксплуатировать самому.

