summary:
  en: >
    A process is an isolated program instance with its own memory; a thread is a
    unit of execution that lives inside a process and shares that memory with the
    other threads there. This topic contrasts their memory, isolation, cost,
    communication and failure model, and shows why threads are cheap but risky
    while processes are safe but heavy.
  ru: >
    Процесс — это изолированный экземпляр программы со своей памятью; поток — это
    единица исполнения внутри процесса, разделяющая эту память с другими его
    потоками. Тема сравнивает их память, изоляцию, стоимость, общение и модель
    сбоев и показывает, почему потоки дёшевы, но рискованны, а процессы безопасны,
    но тяжелы.

assistantExample:
  en: "e.g. Why can two threads corrupt shared data but two processes cannot?"
  ru: "например: Почему два потока могут испортить общие данные, а два процесса — нет?"

