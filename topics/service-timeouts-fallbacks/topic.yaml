id: service-timeouts-fallbacks
title:
  en: Service Timeouts, Fallbacks, and Circuit Breakers
  ru: Timeouts, fallbacks и circuit breakers для сервисов
category:
  en: Microservices / Resilience
  ru: Микросервисы / Устойчивость
type: OTHER
mode: trace
aiProvider: codex
aiModel: gpt-5.5
categoryId: microservices
difficulty: 2
catalogId: microservices-6
style: Real world
summary:
  en: >
    How to keep a user request from waiting forever when one downstream service
    is unavailable: set bounded timeouts and an end-to-end deadline, call
    independent services in parallel, use fallbacks for non-critical data, and
    open a circuit breaker so repeated failures fail fast.
  ru: >
    Как не заставлять пользовательский запрос ждать бесконечно, когда один
    downstream service недоступен: задавать ограниченные timeouts и общий
    deadline, вызывать независимые сервисы параллельно, использовать fallbacks
    для некритичных данных и открывать circuit breaker, чтобы повторные сбои
    завершались быстро.

primitives:
  - ArrayGrid

defaultExample: timeout-budget

examples:
  - id: timeout-budget
    title:
      en: Bounded timeout
      ru: Ограниченный timeout
    file: 01-timeout-budget.java
    explanation:
      en: >
        The client gives the unavailable inventory service only 120 ms, then
        stops waiting and still returns a response inside the request deadline.
      ru: >
        Клиент дает недоступному inventory service только 120 ms, затем
        перестает ждать и все равно возвращает ответ в пределах deadline запроса.
  - id: fallback
    title:
      en: Fallback data
      ru: Fallback-данные
    file: 02-fallback.java
    explanation:
      en: >
        A non-critical recommendations service times out, so the page uses a
        safe cached fallback instead of blocking the whole response.
      ru: >
        Некритичный recommendations service уходит в timeout, поэтому страница
        использует безопасный cached fallback вместо блокировки всего ответа.
  - id: parallel-calls
    title:
      en: Parallel fan-out
      ru: Параллельный fan-out
    file: 03-parallel-calls.java
    explanation:
      en: >
        Independent calls start together, so the user waits for the slowest
        bounded call rather than the sum of every service wait.
      ru: >
        Независимые вызовы стартуют вместе, поэтому пользователь ждет самый
        медленный ограниченный вызов, а не сумму ожиданий всех сервисов.
  - id: circuit-breaker
    title:
      en: Circuit breaker
      ru: Circuit breaker
    file: 04-circuit-breaker.java
    explanation:
      en: >
        After repeated timeouts the circuit opens; the next request skips the
        broken service immediately and uses fallback data.
      ru: >
        После повторных timeouts circuit открывается; следующий запрос сразу
        пропускает сломанный сервис и использует fallback-данные.

assistantExample:
  en: 'e.g. How would you reduce user-visible latency when one downstream service is unavailable?'
  ru: 'например: Как уменьшить видимую пользователю задержку, если один downstream service недоступен?'

missionsFile: quiz.yaml
