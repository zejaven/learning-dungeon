missions:
  - id: show-stale-read
    title:
      en: Show a stale read
      ru: Покажи устаревшее чтение
    goal:
      en: Run a plain write followed by a plain read from another thread without a happens-before edge.
      ru: Запусти обычную запись и обычное чтение из другого thread без happens-before связи.
    event: PLAIN_READ_STALE
  - id: volatile-edge
    title:
      en: Create a volatile edge
      ru: Создай volatile связь
    goal:
      en: Write a volatile flag and then read the same volatile flag from another thread.
      ru: Запиши volatile flag, а затем прочитай тот же volatile flag из другого thread.
    event: VOLATILE_HAPPENS_BEFORE
  - id: monitor-edge
    title:
      en: Acquire the same monitor
      ru: Получи тот же monitor
    goal:
      en: Unlock a monitor in one thread, then lock that same monitor in another thread.
      ru: Выполни unlock monitor в одном thread, затем lock того же monitor в другом thread.
    event: MONITOR_HAPPENS_BEFORE
  - id: start-edge
    title:
      en: Publish through start()
      ru: Опубликуй через start()
    goal:
      en: Write setup data before Thread.start() so the new thread begins with it visible.
      ru: Запиши подготовительные data до Thread.start(), чтобы новый thread начал с видимыми data.
    event: THREAD_START_EDGE
  - id: join-edge
    title:
      en: Collect through join()
      ru: Забери через join()
    goal:
      en: Let a worker finish, then join it so the owner sees the worker's result.
      ru: Дай worker завершиться, затем выполни join, чтобы owner увидел результат worker.
    event: THREAD_JOIN_EDGE
  - id: transitive-visibility
    title:
      en: Show transitive visibility
      ru: Покажи transitive visibility
    goal:
      en: Make a plain write visible through a synchronization edge and then read that plain value.
      ru: Сделай обычную запись видимой через synchronization edge, затем прочитай это обычное значение.
    event: TRANSITIVE_VISIBILITY

bossFight:
  - id: definition
    en: What does happens-before mean in the Java Memory Model?
    ru: Что означает happens-before в Java Memory Model?
  - id: visibility-not-clock-time
    en: Why is happens-before not the same as real clock time or line execution order across threads?
    ru: Почему happens-before не то же самое, что реальное время на часах или порядок строк между threads?
  - id: core-rules
    en: Name the main Java constructs that create happens-before relationships.
    ru: Назови основные конструкции Java, которые создают happens-before relationships.
  - id: volatile-rule
    en: How does a volatile write relate to a later volatile read of the same variable?
    ru: Как volatile-запись связана с более поздним volatile-чтением той же переменной?
  - id: monitor-rule
    en: Why must synchronized code use the same monitor to get a happens-before guarantee?
    ru: Почему synchronized code должен использовать тот же monitor, чтобы получить happens-before гарантию?
  - id: start-join-rules
    en: What do Thread.start() and Thread.join() guarantee for visibility?
    ru: Что Thread.start() и Thread.join() гарантируют для visibility?
  - id: transitivity
    en: What does transitivity mean for a chain of happens-before relationships?
    ru: Что означает transitivity для цепочки happens-before relationships?
  - id: data-race
    en: What can happen when two threads access the same mutable state and there is no happens-before edge?
    ru: Что может произойти, когда два threads обращаются к одному mutable state и между ними нет happens-before связи?
