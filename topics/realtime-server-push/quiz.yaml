# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: watch-news-with-nowhere-to-go
    title:
      en: Find the news with nowhere to go
      ru: Найди новость, которой некуда идти
    goal:
      en: Make something happen on the server while nothing is open, and see it stuck in the queue.
      ru: Сделай так, чтобы событие произошло на сервере, когда ничего не открыто, и увидь, как оно застревает в очереди.
    event: EVENT_WAITING
  - id: pay-for-nothing
    title:
      en: Pay for an answer of 'nothing'
      ru: 'Заплати за ответ «ничего»'
    goal:
      en: Run a poll that finds no news and look at what that round trip still cost both sides.
      ru: Запусти опрос, который не находит новостей, и посмотри, во что этот обмен всё равно обошёлся обеим сторонам.
    event: POLL_EMPTY
  - id: measure-polling-lateness
    title:
      en: Measure how late polling is
      ru: Измерь опоздание опроса
    goal:
      en: Let a poll deliver an event and read how many ticks it waited before the timer went off.
      ru: Дай опросу доставить событие и прочитай, сколько тиков оно ждало, прежде чем сработал таймер.
    event: POLL_DELIVERED
  - id: park-a-request
    title:
      en: Park a request on the server
      ru: Припаркуй запрос на сервере
    goal:
      en: Open a long poll and find the step where the client has asked and the server has deliberately not answered.
      ru: Открой длинный опрос и найди шаг, на котором клиент спросил, а сервер намеренно не ответил.
    event: LONGPOLL_HELD
  - id: answer-the-instant-it-happens
    title:
      en: Answer the instant it happens
      ru: Ответь в момент события
    goal:
      en: Make an event arrive while a request is parked and confirm the delay is zero.
      ru: Сделай так, чтобы событие пришло, пока запрос припаркован, и убедись, что задержка нулевая.
    event: LONGPOLL_DELIVERED
  - id: expire-the-hold
    title:
      en: Let the hold expire on purpose
      ru: Дай удержанию истечь намеренно
    goal:
      en: Leave a long poll quiet long enough that the server answers empty, and find out why it must.
      ru: Оставь длинный опрос без новостей достаточно надолго, чтобы сервер ответил пустым, и выясни, почему он обязан это сделать.
    event: LONGPOLL_TIMEOUT
  - id: mind-the-gap
    title:
      en: Find the gap between two long polls
      ru: Найди промежуток между двумя длинными опросами
    goal:
      en: Watch the client re-open its request after an answer and think about what lands in between.
      ru: Посмотри, как клиент переоткрывает запрос после ответа, и подумай, что попадает в промежуток.
    event: LONGPOLL_REOPENED
  - id: open-a-never-ending-response
    title:
      en: Open a response that never ends
      ru: Открой ответ, который не заканчивается
    goal:
      en: Start an SSE stream and see what one ordinary GET turns into.
      ru: Запусти поток SSE и увидь, во что превращается один обычный GET.
    event: SSE_STREAM_OPENED
  - id: push-without-a-request
    title:
      en: Deliver without a request
      ru: Доставь без запроса
    goal:
      en: Have the server write an event into an open stream and check how many HTTP requests it took.
      ru: Заставь сервер записать событие в открытый поток и проверь, сколько HTTP-запросов на это ушло.
    event: SSE_MESSAGE
  - id: resume-from-last-event-id
    title:
      en: Resume from Last-Event-ID
      ru: Продолжи с Last-Event-ID
    goal:
      en: Drop the stream, let events pile up, reconnect, and watch the protocol replay the gap for you.
      ru: Оборви поток, дай событиям накопиться, переподключись и посмотри, как протокол сам досылает пропущенное.
    event: SSE_REPLAYED
  - id: upgrade-the-connection
    title:
      en: 'Upgrade to 101'
      ru: 'Сделай апгрейд до 101'
    goal:
      en: Open a WebSocket and find the last HTTP message the conversation will ever contain.
      ru: Открой WebSocket и найди последнее HTTP-сообщение, которое вообще будет в этом разговоре.
    event: WS_HANDSHAKE
  - id: send-back-on-the-same-wire
    title:
      en: Send back on the same wire
      ru: Отправь обратно по тому же проводу
    goal:
      en: Send a client message over an open socket and compare that with sending one over SSE.
      ru: Отправь сообщение клиента по открытому сокету и сравни это с отправкой при SSE.
    event: WS_FRAME_UP
  - id: pay-for-the-way-back
    title:
      en: Pay for the way back
      ru: Заплати за обратный путь
    goal:
      en: Send something from the client over a one-way transport and count the extra request it needs.
      ru: Отправь что-нибудь от клиента по одностороннему транспорту и посчитай, во сколько лишних запросов это обошлось.
    event: CLIENT_MESSAGE_POSTED
  - id: lose-frames-in-a-drop
    title:
      en: Lose messages in a reconnect
      ru: Потеряй сообщения при переподключении
    goal:
      en: Break a WebSocket while events happen and see what a raw socket does NOT replay for you.
      ru: Оборви WebSocket во время событий и увидь, чего «голый» сокет НЕ досылает за тебя.
    event: MESSAGES_MISSED
  - id: miss-a-client-on-another-instance
    title:
      en: Miss a client on another instance
      ru: Промахнись мимо клиента на другом экземпляре
    goal:
      en: Let an event happen on the instance that does not hold the connection, and note that nothing errors.
      ru: Сделай так, чтобы событие произошло на экземпляре, который не держит соединение, и заметь, что ошибки нет.
    event: FANOUT_MISS
  - id: route-it-through-a-bus
    title:
      en: Route it through a shared bus
      ru: Проведи его через общую шину
    goal:
      en: Add the fan-out layer and watch the event reach a connection held by a different process.
      ru: Добавь слой веерной рассылки и посмотри, как событие доходит до соединения, которое держит другой процесс.
    event: FANOUT_ROUTED
  - id: price-all-four
    title:
      en: Price all four transports
      ru: Оцени все четыре транспорта
    goal:
      en: Run the same timeline through every transport and find the column that decides your choice.
      ru: Прогони одну и ту же шкалу времени через каждый транспорт и найди колонку, которая решает выбор.
    event: TRANSPORT_COMPARED
  - id: read-the-bill
    title:
      en: Read the bill
      ru: Прочитай счёт
    goal:
      en: Finish a run and compare requests, empty answers, delay and lost messages for that transport.
      ru: Заверши прогон и сравни запросы, пустые ответы, задержку и потерянные сообщения для этого транспорта.
    event: CHANNEL_AUDIT

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: how-does-a-server-notify-a-browser
    en: How does a server notify a browser client about an event in real time? Name the options and say what each one really is.
    ru: Как сервер уведомляет браузерного клиента о событии в реальном времени? Назови варианты и скажи, чем каждый является на самом деле.
  - id: why-cant-the-server-just-call
    en: Why can a backend not simply call the browser when something happens?
    ru: Почему бэкенд не может просто «позвонить» в браузер, когда что-то произошло?
  - id: polling-cost-model
    en: What does polling every N seconds actually cost, and how do you choose N?
    ru: Во что на самом деле обходится опрос раз в N секунд и как выбрать N?
  - id: long-polling-mechanics
    en: How does long polling work, and what has to be true of your server for it not to fall over?
    ru: Как работает длинный опрос и каким должен быть сервер, чтобы он не лёг под ним?
  - id: long-polling-vs-polling
    en: Long polling uses the same HTTP as short polling. Where exactly does the difference show up?
    ru: Длинный опрос использует тот же HTTP, что и короткий. В чём именно проявляется разница?
  - id: sse-mechanics
    en: What is Server-Sent Events at the protocol level? What does the response look like?
    ru: Что такое Server-Sent Events на уровне протокола? Как выглядит ответ?
  - id: sse-vs-websocket
    en: When would you pick SSE over a WebSocket, and when the other way round?
    ru: Когда выбрать SSE вместо WebSocket и когда наоборот?
  - id: websocket-handshake
    en: How does a WebSocket connection start, and what stops being true after the upgrade?
    ru: Как начинается WebSocket-соединение и что перестаёт быть верным после апгрейда?
  - id: reconnect-and-missed-messages
    en: A client is offline for thirty seconds. For each technology, what happens to the events it missed?
    ru: Клиент был офлайн тридцать секунд. Что происходит с пропущенными событиями в каждой из технологий?
  - id: last-event-id
    en: What is Last-Event-ID, and what does the server have to do for it to be useful?
    ru: Что такое Last-Event-ID и что должен делать сервер, чтобы он был полезен?
  - id: scaling-push-connections
    en: You run three instances behind a load balancer. What breaks about push, and how do you fix it?
    ru: У тебя три экземпляра за балансировщиком. Что ломается в push и как это чинить?
  - id: connection-limits
    en: What limits how many clients one server can keep connected, and how does that differ between long polling and SSE?
    ru: Что ограничивает число клиентов, которых один сервер держит подключёнными, и чем в этом смысле отличаются длинный опрос и SSE?
  - id: proxies-and-timeouts
    en: Which infrastructure between the browser and your app can kill a long-lived connection, and how do you cope?
    ru: Какая инфраструктура между браузером и приложением может оборвать долгоживущее соединение и как с этим жить?
  - id: choosing-for-a-notification-bell
    en: You need a notification bell that updates within a few seconds for a few thousand users. What do you build and why?
    ru: Нужен «колокольчик» уведомлений, который обновляется за несколько секунд, для нескольких тысяч пользователей. Что ты построишь и почему?
  - id: choosing-for-a-chat
    en: Now it is a chat with typing indicators. Does your answer change, and what exactly forces the change?
    ru: Теперь это чат с индикаторами набора текста. Меняется ли ответ и что именно его меняет?
  - id: ordering-and-duplicates
    en: Can a real-time channel deliver events out of order or twice? What do you do about it on the client?
    ru: Может ли канал реального времени доставить события не по порядку или дважды? Что с этим делать на клиенте?
  - id: auth-on-a-long-lived-connection
    en: How do you authenticate an SSE stream or a WebSocket, and what happens when the token expires mid-connection?
    ru: Как аутентифицировать поток SSE или WebSocket и что происходит, когда токен истекает посреди соединения?
  - id: push-vs-source-of-truth
    en: Why do experienced teams treat a pushed message as a hint rather than as data? What does the client do with it?
    ru: Почему опытные команды считают push-сообщение подсказкой, а не данными? Что клиент с ним делает?
  - id: backpressure
    en: A client is slow or a burst of events arrives. What happens to the connection, and how do you protect the server?
    ru: Клиент медленный или пришёл всплеск событий. Что происходит с соединением и как защитить сервер?
  - id: http2-and-polling
    en: 'Does HTTP/2 or HTTP/3 change the polling calculation? What gets cheaper and what does not?'
    ru: 'Меняют ли HTTP/2 или HTTP/3 расчёт для опроса? Что становится дешевле, а что нет?'
  - id: when-polling-is-right
    en: When is boring old polling the correct engineering decision, despite everything above?
    ru: Когда скучный старый опрос — правильное инженерное решение, несмотря на всё сказанное выше?
