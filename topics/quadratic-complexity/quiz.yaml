# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: what-is-quadratic
    en: What does O(n²) complexity mean, and how does the work grow when the input doubles?
    ru: Что означает сложность O(n²) и как растёт объём работы при удвоении входа?
  - id: why-bad
    en: Why is O(n²) considered bad? Give concrete numbers for a large input.
    ru: Почему O(n²) считается плохой сложностью? Приведите конкретные числа для большого входа.
  - id: where-it-comes-from
    en: Where does O(n²) typically come from in code? Give two examples, including a hidden one without two visible loops.
    ru: Откуда обычно берётся O(n²) в коде? Приведите два примера, включая скрытый — без двух видимых циклов.
  - id: fix-to-linear
    en: How would you rewrite an O(n²) duplicate-finder to be O(n)? What data structure helps and why?
    ru: Как переписать поиск дубликатов с O(n²) на O(n)? Какая структура данных помогает и почему?
  - id: n2-vs-nlogn
    en: Compare O(n²) and O(n log n). Why do interviewers care about getting an algorithm below n²?
    ru: Сравните O(n²) и O(n log n). Почему интервьюеров волнует, удастся ли опустить алгоритм ниже n²?
  - id: when-acceptable
    en: When is an O(n²) algorithm perfectly acceptable, and why isn't 'two loops' always O(n²)?
    ru: Когда алгоритм O(n²) вполне приемлем и почему «два цикла» не всегда означают O(n²)?
