bossFight:
  # Lifecycle and system behavior
  - id: app-launch-sequence
    en: 'Walk through what happens when an iOS app launches: from loading the binary to the app becoming Active. Which delegate method is the key initialization point?'
    ru: 'Расскажите, что происходит при запуске iOS-приложения: от загрузки бинарника до перехода в Active. Какой метод делегата — ключевая точка инициализации?'
  - id: background-execution-limits
    en: 'How do iOS apps work in the background? What background modes exist, and what is the difference between the Background and Suspended states?'
    ru: 'Как iOS-приложения работают в фоне? Какие существуют background modes и в чём разница между состояниями Background и Suspended?'
  - id: apns-push-flow
    en: 'Describe the full delivery path of a push notification in iOS through APNs. What is a silent push and why can you not rely on it for critical logic?'
    ru: 'Опишите полный путь доставки push-нотификации в iOS через APNs. Что такое silent push и почему на нём нельзя строить критичную логику?'
  - id: memory-limit-kill
    en: 'How much RAM can an iOS app use, and what happens when it exceeds the limit? How would you test that this does not look like a "mystery crash" to users?'
    ru: 'Сколько ОЗУ может использовать iOS-приложение и что происходит при превышении лимита? Как проверить, что для пользователя это не выглядит «вылетом без причины»?'
  # Storage and sandbox
  - id: data-after-uninstall
    en: 'Which data remains on the device after an iOS app is uninstalled, and why does the Keychain survive while the sandbox does not?'
    ru: 'Какие данные остаются на устройстве после удаления iOS-приложения и почему Keychain переживает удаление, а sandbox — нет?'
  - id: sandbox-directories
    en: 'Explain the iOS app sandbox structure: Documents, Library/Caches, tmp. Where would you store a large offline map, and how do you find the sandbox path on a simulator?'
    ru: 'Расскажите про устройство sandbox iOS-приложения: Documents, Library/Caches, tmp. Куда положите большую офлайн-карту и как узнать путь до sandbox на симуляторе?'
  # UI specifics
  - id: native-app-detection
    en: 'How can you tell whether an iOS app is native or cross-platform/WebView-based just by using it?'
    ru: 'Как, просто пользуясь приложением, определить, нативное оно или кроссплатформенное/на WebView?'
  - id: uikit-vs-swiftui-testing
    en: 'Is there a difference in testing UIKit vs SwiftUI apps? What happens with Dynamic Type font scaling in each?'
    ru: 'Есть ли разница в тестировании приложений на UIKit и SwiftUI? Что происходит с масштабированием шрифтов через Dynamic Type в каждом случае?'
  - id: two-uiwindow-cases
    en: 'In which cases can an iOS app have two UIWindows, and why does this matter for UI test automation?'
    ru: 'В каких случаях у iOS-приложения может быть два UIWindow и почему это важно для UI-автотестов?'
  # Performance
  - id: sixty-fps-budget
    en: 'How do you verify that an app does not lag? What is the 16 ms frame budget for 60 fps, and why must performance be checked on the oldest supported devices?'
    ru: 'Как проверить, что приложение не тормозит? Что такое бюджет 16 мс на кадр для 60 fps и почему производительность нужно проверять на самых старых поддерживаемых устройствах?'
