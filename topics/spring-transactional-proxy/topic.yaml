id: spring-transactional-proxy
title:
  en: 'How @Transactional Works (Proxy / AOP)'
  ru: 'Как работает @Transactional (Proxy / AOP)'
category:
  en: Spring / Transactions
  ru: Spring / Транзакции
type: TRANSACTION
mode: trace
aiProvider: claude
aiModel: claude-opus-4-8
categoryId: spring
difficulty: 2
catalogId: spring-13
style: Real world
summary:
  en: >
    What @Transactional is for and how Spring implements it under the hood: at
    startup Spring wraps the bean in an AOP proxy that intercepts incoming
    calls, opens a transaction before the method body, and commits on normal
    return or rolls back on a runtime exception. Because the magic lives in the
    proxy, an internal self-invocation or a call on a hand-created object
    bypasses it and the annotation is silently ignored.
  ru: >
    Зачем нужен @Transactional и как Spring реализует его под капотом: на старте
    Spring оборачивает бин в AOP proxy, который перехватывает входящие вызовы,
    открывает транзакцию перед телом метода и фиксирует её при нормальном выходе
    или откатывает при runtime exception. Поскольку вся магия живёт в proxy,
    внутренний self-invocation или вызов на «голом» объекте обходят его, и
    аннотация молча игнорируется.

primitives:
  - ArrayGrid

defaultExample: proxy-basics

examples:
  - id: proxy-basics
    title:
      en: Proxy opens and commits
      ru: Proxy открывает и фиксирует
    file: 01-proxy-basics.java
    explanation:
      en: >
        An external caller invokes a @Transactional method through the proxy.
        The proxy intercepts the call, opens a transaction, runs the body, and
        commits the staged row when the method returns normally.
      ru: >
        Внешний вызывающий обращается к @Transactional методу через proxy. Proxy
        перехватывает вызов, открывает транзакцию, выполняет тело и фиксирует
        подготовленную строку, когда метод завершается нормально.
  - id: rollback
    title:
      en: Runtime exception rolls back
      ru: Runtime exception откатывает
    file: 02-rollback.java
    explanation:
      en: >
        The body stages a row and then throws an unchecked exception. As it
        propagates out through the proxy, the proxy rolls the transaction back
        and the staged row is discarded.
      ru: >
        Тело подготавливает строку и затем бросает unchecked exception. Когда он
        выходит наружу через proxy, proxy откатывает транзакцию, и подготовленная
        строка отбрасывается.
  - id: self-invocation
    title:
      en: Self-invocation trap
      ru: Ловушка self-invocation
    file: 03-self-invocation.java
    explanation:
      en: >
        A non-transactional method calls this.saveUser() directly. The internal
        call bypasses the proxy, so the @Transactional on saveUser() is ignored
        and the write runs with no transaction.
      ru: >
        Нетранзакционный метод вызывает this.saveUser() напрямую. Внутренний
        вызов обходит proxy, поэтому @Transactional на saveUser() игнорируется, и
        запись выполняется без транзакции.
  - id: call-through-proxy
    title:
      en: Call through the proxy
      ru: Вызов через proxy
    file: 04-call-through-proxy.java
    explanation:
      en: >
        The fix: invoke the @Transactional method through the proxy reference
        instead of internally. Now the proxy intercepts it, opens a transaction,
        and commits as expected.
      ru: >
        Исправление: вызывай @Transactional метод через ссылку на proxy, а не
        внутренне. Теперь proxy перехватывает его, открывает транзакцию и
        фиксирует как ожидается.
  - id: new-instance-no-proxy
    title:
      en: new object has no proxy
      ru: new-объект без proxy
    file: 05-new-instance-no-proxy.java
    explanation:
      en: >
        Calling a @Transactional method on a hand-created object (new, not from
        the container) has no proxy to intercept it, so the annotation is inert
        and the write is not transactional.
      ru: >
        Вызов @Transactional метода на созданном вручную объекте (через new, а не
        из контейнера) некому перехватить, поэтому аннотация бездействует, а
        запись не транзакционна.

assistantExample:
  en: 'e.g. Why is @Transactional ignored when one method of a service calls another @Transactional method of the same class?'
  ru: 'например: Почему @Transactional игнорируется, когда один метод сервиса вызывает другой @Transactional метод того же класса?'

