id: factory-method-vs-abstract-factory
title:
  en: Factory Method vs Abstract Factory
  ru: Factory Method и Abstract Factory
category:
  en: Design Patterns / Creational
  ru: Паттерны проектирования / Порождающие
type: DESIGN_PATTERN
mode: structural
aiProvider: codex
aiModel: gpt-5.5
categoryId: design-patterns
difficulty: 2
catalogId: design-patterns-3
style: Real world
summary:
  en: >
    Factory Method lets subclasses decide which single product to create by
    overriding a creation method. Abstract Factory gives a client one factory
    interface that creates a whole compatible family of related products. In
    this structural practice you build both shapes and compare where the
    extension point lives.
  ru: >
    Factory Method позволяет подклассам решать, какой один продукт создавать,
    переопределяя метод создания. Abstract Factory даёт клиенту один интерфейс
    фабрики, который создаёт целое совместимое семейство связанных продуктов.
    В этой структурной практике вы соберёте обе формы и сравните, где находится
    точка расширения.

