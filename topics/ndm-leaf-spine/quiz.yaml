bossFight:
  # I. Historical Context and Theoretical Foundations
  - id: telephone-non-blocking-origin
    en: 'Why was the original Clos network designed for telephone switching systems, and how did it aim to achieve "non-blocking" connections?'
    ru: 'Почему изначально сеть Клоза была разработана для телефонных коммутационных систем и как она стремилась достичь «неблокируемых» соединений?'
  - id: n2-crosspoint-problem
    en: 'Why is connecting thousands of subscribers using a traditional single-stage crossbar switch considered a physical and economic impossibility?'
    ru: 'Почему подключение тысяч абонентов через традиционный одноступенчатый crossbar-коммутатор считается физически и экономически невозможным?'
  - id: strict-sense-clos-condition
    en: 'Explain the Clos Condition (m ≥ 2n - 1). Why are 2n - 1 middle switches required to guarantee a free path in a three-stage network?'
    ru: 'Объясните условие Клоза (m ≥ 2n - 1). Почему для гарантии свободного пути в трёхступенчатой сети требуется 2n - 1 средних коммутаторов?'
  - id: rearrangeably-non-blocking
    en: 'How does the condition m ≥ n differ from strict-sense non-blocking, and why is this model commonly used in data centres to balance performance and economics?'
    ru: 'Чем условие m ≥ n отличается от strict-sense неблокируемости и почему эта модель широко используется в дата-центрах как баланс производительности и экономики?'
  # II. Architectural Evolution and 2-Tier Rules
  - id: traffic-gravity-shift
    en: 'Why has the shift from 80% North-South traffic to 80% East-West traffic rendered traditional 3-tier hierarchical models ineffective?'
    ru: 'Почему сдвиг от 80% North-South трафика к 80% East-West трафика сделал традиционные трёхуровневые иерархические модели неэффективными?'
  - id: structural-constraints
    en: 'Discuss the two primary rules of a 2-tier fabric: Why are horizontal links prohibited, and why is a complete bipartite interconnection mandatory?'
    ru: 'Обсудите два основных правила двухуровневой фабрики: почему запрещены горизонтальные линки и почему обязательна полная двудольная связность (complete bipartite interconnection)?'
  - id: spine-vs-leaf-roles
    en: 'Contrast the responsibilities of the Spine Layer (backbone) with the Leaf Layer (access). Why are no servers permitted to connect directly to a spine switch?'
    ru: 'Сопоставьте обязанности уровня Spine (магистраль) и уровня Leaf (доступ). Почему серверам запрещено подключаться напрямую к spine-коммутатору?'
  - id: l3-over-stp-benefits
    en: 'Beyond flattening the network, how does moving from Layer 2 switching/STP to Layer 3 routing reduce complexity and improve link utilisation?'
    ru: 'Помимо «уплощения» сети, как переход от коммутации Layer 2 со STP к маршрутизации Layer 3 снижает сложность и повышает утилизацию линков?'
  # III. Performance, Latency, and Scaling
  - id: two-hop-guarantee
    en: 'How does the Leaf-Spine architecture ensure predictable latency, and why is this "two-hop" path critical for GPU clusters and distributed databases?'
    ru: 'Как архитектура Leaf-Spine обеспечивает предсказуемую задержку и почему этот путь «в два хопа» критичен для GPU-кластеров и распределённых баз данных?'
  - id: scale-out-vs-scale-up
    en: 'Contrast the "scale-out" approach of Clos with the "scale-up" approach of 3-tier models. How does adding a single leaf or spine switch impact capacity and bandwidth?'
    ru: 'Сопоставьте подход «scale-out» в Clos с подходом «scale-up» трёхуровневых моделей. Как добавление одного leaf- или spine-коммутатора влияет на ёмкость и полосу?'
  - id: port-density-limits
    en: 'How do the physical port counts on a leaf and spine switch define the maximum size of a two-tier fabric?'
    ru: 'Как физическое число портов на leaf- и spine-коммутаторах определяет максимальный размер двухуровневой фабрики?'
  - id: hyperscale-5-stage-clos
    en: 'Under what circumstances must an organisation move from a 2-tier design to a 5-stage Clos architecture involving "Super-Spines"?'
    ru: 'При каких обстоятельствах организация должна перейти от двухуровневого дизайна к 5-стадийной архитектуре Clos с «Super-Spine»?'
  # IV. Load Balancing and Congestion Management
  - id: stp-demise-ecmp
    en: 'Why is Spanning Tree Protocol considered inefficient in modern data centres, and how does Equal-Cost Multi-Path (ECMP) replace it?'
    ru: 'Почему Spanning Tree Protocol считается неэффективным в современных дата-центрах и как его заменяет Equal-Cost Multi-Path (ECMP)?'
  - id: five-tuple-flow-integrity
    en: 'How does deterministic hashing of the 5-tuple prevent out-of-order packet delivery while still distributing traffic across all available paths?'
    ru: 'Как детерминированное хеширование 5-tuple предотвращает доставку пакетов вне порядка, при этом распределяя трафик по всем доступным путям?'
  - id: oversubscription-ratios
    en: 'What is the performance difference between a 1:1 non-blocking ratio and the more common 3:1 ratio used to balance cost?'
    ru: 'В чём разница по производительности между неблокируемым коэффициентом 1:1 и более распространённым коэффициентом 3:1, применяемым ради баланса стоимости?'
  - id: ecmp-fatal-flaw
    en: 'Discuss the risks of localised hashing decisions. How can "elephant flows" create hot spots and reduce delivered traffic by up to 40%?'
    ru: 'Обсудите риски локальных решений на основе хеширования. Как «слоновьи» потоки (elephant flows) могут создавать горячие точки и снижать доставленный трафик до 40%?'
  - id: conga-congestion-awareness
    en: 'How does the CONGA mechanism improve upon static ECMP by providing real-time "leaf-to-leaf" feedback?'
    ru: 'Как механизм CONGA превосходит статический ECMP, обеспечивая обратную связь «leaf-to-leaf» в реальном времени?'
  # V. Protocol Selection and Implementation
  - id: underlay-vs-overlay
    en: 'Define the roles of the physical L3 underlay (routed links) and the virtual L2 overlay (VXLAN) in a modern data centre.'
    ru: 'Определите роли физического L3 underlay (маршрутизируемые линки) и виртуального L2 overlay (VXLAN) в современном дата-центре.'
  - id: ebgp-asn-strategy
    en: 'Why is eBGP recommended as the primary protocol for the data centre fabric, and how does the use of discrete ASNs for each leaf simplify troubleshooting?'
    ru: 'Почему eBGP рекомендуется как основной протокол фабрики дата-центра и как использование отдельных ASN для каждого leaf упрощает поиск неисправностей?'
  - id: mlag-redundancy
    en: 'How does Multi-chassis Link Aggregation (MLAG) allow servers to be dual-homed for redundancy without introducing Layer 2 loops into the Clos fabric?'
    ru: 'Как Multi-chassis Link Aggregation (MLAG) позволяет подключать серверы к двум коммутаторам ради резервирования, не внося петли Layer 2 в фабрику Clos?'
