server:
  port: 8080

spring:
  application:
    name: interview-learning-backend

  # DB credentials (username/password) live in config/secret.yml, which is
  # git-ignored. Copy config/secret.example.yml to config/secret.yml locally.
  config:
    import: optional:file:./config/secret.yml

  datasource:
    url: jdbc:postgresql://localhost:5432/java-interview-dungeon
    username: ${db.username:postgres}
    password: ${db.password:}
    # The progress tables are created/migrated on startup by DbInitializer
    # (not spring.sql.init, which can't parse the PL/pgSQL migration block).

app:
  # Repository root. bootRun sets this system property; otherwise the process
  # working directory is used. The topics/ folder and the built visual-runtime
  # jar are resolved relative to this.
  repo-root: ${app.repo-root:}
  runner:
    timeout-seconds: 5
    max-heap: 128m
  claude:
    # Path/command for the Claude Code CLI used by the add-topic and assistant
    # features. Override if 'claude' is not on PATH.
    command: claude
    # Model used to answer topic questions (Ask AI) — lighter/faster.
    assistant-model: claude-sonnet-4-6
    # Model used to generate a whole new topic (Add topic) — most capable.
    generate-model: claude-opus-4-8
  usage:
    # Header meter showing Claude session/weekly usage. Reads the OAuth token from
    # ~/.claude/.credentials.json and calls Anthropic's usage endpoint (the same
    # one /usage uses). That endpoint rate-limits hard, so refresh-seconds is
    # floored at 180s internally regardless of what's set here.
    enabled: true
    refresh-seconds: 180
    # Sent as User-Agent; must start with "claude-code/" to avoid instant 429s.
    user-agent: claude-code/2.1.177
    # To point at a non-default credentials file, set app.usage.credentials-file
    # via env/system property; it defaults to ~/.claude/.credentials.json.

logging:
  level:
    com.interviewlearning: INFO
