# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: build-hierarchy
    title:
      en: Build the loader hierarchy
      ru: Построй иерархию загрузчиков
    goal:
      en: Run the code and create the Bootstrap -> Platform -> Application chain.
      ru: Запусти код и создай цепочку Bootstrap -> Platform -> Application.
    event: CLASSLOADER_CREATED
  - id: delegate
    title:
      en: Delegate to the parent
      ru: Делегируй родителю
    goal:
      en: Load any class so the request is delegated up to a parent loader.
      ru: Загрузи любой класс, чтобы запрос делегировался родительскому загрузчику.
    event: DELEGATE_UP
  - id: define
    title:
      en: Define a class
      ru: Определи класс
    goal:
      en: Load a class some loader actually knows, so it gets defined.
      ru: Загрузи класс, который какой-то загрузчик действительно знает, чтобы он определился.
    event: CLASS_DEFINED
  - id: cache-hit
    title:
      en: Hit the cache
      ru: Попади в кэш
    goal:
      en: Load the same class twice so the second request is served from the cache.
      ru: Загрузи один и тот же класс дважды, чтобы второй запрос пришёл из кэша.
    event: ALREADY_LOADED
  - id: not-found
    title:
      en: Trigger ClassNotFoundException
      ru: Вызови ClassNotFoundException
    goal:
      en: Ask for a class no loader knows and watch the chain come back empty.
      ru: Запроси класс, который не знает ни один загрузчик, и увидь пустой ответ цепочки.
    event: CLASS_NOT_FOUND

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: what-is-classloader
    en: What is a ClassLoader and what is it responsible for?
    ru: Что такое ClassLoader и за что он отвечает?
  - id: builtin-loaders
    en: Which built-in class loaders does the JVM have, and what does each load?
    ru: Какие встроенные загрузчики есть в JVM и что грузит каждый из них?
  - id: parent-delegation
    en: How does the parent-delegation model work, and why is it designed that way?
    ru: Как работает модель делегирования родителю и зачем она так устроена?
  - id: class-identity
    en: What makes two classes "the same" at runtime, and how do class loaders affect that?
    ru: Что делает два класса «одинаковыми» в рантайме и как на это влияют загрузчики?
  - id: cnfe-vs-ncdfe
    en: What is the difference between ClassNotFoundException and NoClassDefFoundError?
    ru: В чём разница между ClassNotFoundException и NoClassDefFoundError?
  - id: custom-loader-use
    en: When would you write a custom ClassLoader?
    ru: Когда стоит писать собственный ClassLoader?
