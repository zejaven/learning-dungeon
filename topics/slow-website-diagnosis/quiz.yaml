# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: optimize-before-measuring
    title:
      en: 'Optimise on a hunch'
      ru: 'Оптимизируй по наитию'
    goal:
      en: Pick an optimisation before a single measurement exists, and see what it costs besides two days.
      ru: Выбери оптимизацию до единственного измерения и посмотри, во что это обходится помимо двух дней.
    event: GUESS_MADE
  - id: turn-slow-into-a-page
    title:
      en: 'Ask what "slow" means'
      ru: 'Спроси, что значит «медленно»'
    goal:
      en: 'Get one answer that narrows the complaint: which page, who, how slow, since when, how often.'
      ru: 'Получи один ответ, сужающий жалобу: какая страница, у кого, насколько медленно, с какого момента, как часто.'
    event: SCOPE_NARROWED
  - id: agree-on-fast-enough
    title:
      en: 'Agree what "fast enough" is'
      ru: 'Договорись, что такое «достаточно быстро»'
    goal:
      en: Write down the target the page has to hit, so the hunt has an end condition instead of a mood.
      ru: Запиши цель, в которую должна укладываться страница, чтобы у охоты было условие остановки, а не настроение.
    event: BUDGET_SET
  - id: read-the-tail
    title:
      en: 'Read the distribution'
      ru: 'Прочитай распределение'
    goal:
      en: Read p50, p95 and p99 next to the average, and see which of them the complaining user lives in.
      ru: Прочитай p50, p95 и p99 рядом со средним и посмотри, в каком из них живёт жалующийся пользователь.
    event: PERCENTILES_READ
  - id: name-a-blind-spot
    title:
      en: 'Name a missing measurement'
      ru: 'Назови отсутствующее измерение'
    goal:
      en: Look for a timing nobody records, and see why "I could not find out" is an honest first answer.
      ru: Поищи тайминг, который никто не пишет, и пойми, почему «я не смог выяснить» — честный первый ответ.
    event: SIGNAL_MISSING
  - id: measure-one-slice
    title:
      en: 'Measure one segment'
      ru: 'Измерь один сегмент'
    goal:
      en: Measure one part of the wait with a real tool, so the parts can be made to add up to the whole.
      ru: Измерь одну часть ожидания настоящим инструментом, чтобы части складывались в целое.
    event: SEGMENT_MEASURED
  - id: where-the-time-is
    title:
      en: 'Split the time'
      ru: 'Разбей время'
    goal:
      en: Read a level back and let it name the segment holding most of the milliseconds.
      ru: Прочитай уровень обратно и позволь ему назвать сегмент, держащий большую часть миллисекунд.
    event: TIME_SPLIT
  - id: clear-with-a-number
    title:
      en: 'Clear a segment with evidence'
      ru: 'Закрой сегмент уликой'
    goal:
      en: Close a part of the budget with a number, not with its reputation for being fine.
      ru: Закрой часть бюджета числом, а не репутацией «там всё в порядке».
    event: SEGMENT_CLEARED
  - id: one-level-down
    title:
      en: 'Drill into the hotspot'
      ru: 'Углубись в горячую точку'
    goal:
      en: Open the biggest slice into its own split and ask the same question one level down.
      ru: Раскрой самый большой срез в собственное разбиение и задай тот же вопрос уровнем ниже.
    event: DRILL_DOWN
  - id: idle-versus-peak
    title:
      en: 'Compare idle with peak'
      ru: 'Сравни простой и пик'
    goal:
      en: Time the same request with nobody on the site and at peak, and find out whether you are chasing work or a queue.
      ru: Замерь тот же запрос на пустом сайте и на пике и выясни, за чем ты гонишься — за работой или за очередью.
    event: LOAD_COMPARED
  - id: who-is-waiting-in-line
    title:
      en: 'Read a resource'
      ru: 'Прочитай ресурс'
    goal:
      en: 'Check one resource the request needs: how busy it is, and whether anything is queued behind it.'
      ru: 'Проверь один ресурс, нужный запросу: насколько он занят и не стоит ли кто-то за ним в очереди.'
    event: RESOURCE_CHECKED
  - id: price-it-first
    title:
      en: 'Price an optimisation'
      ru: 'Оцени оптимизацию'
    goal:
      en: Compute what a proposed fix can possibly save as a share of the whole request, before writing it.
      ru: Посчитай, сколько предлагаемое исправление вообще способно сэкономить в доле от всего запроса, до того как его писать.
    event: CEILING_COMPUTED
  - id: a-cause-explains-the-time
    title:
      en: 'Confirm a cause'
      ru: 'Подтверди причину'
    goal:
      en: Confirm a cause whose milliseconds actually add up to the milliseconds you are missing.
      ru: Подтверди причину, чьи миллисекунды действительно складываются в те, которых недостаёт.
    event: CAUSE_CONFIRMED
  - id: change-without-a-cause
    title:
      en: 'Ship a blind change'
      ru: 'Выкати изменение вслепую'
    goal:
      en: Change the system with nothing confirmed, and count what you cannot learn from the result.
      ru: Измени систему, ничего не подтвердив, и посчитай, чего ты не сможешь узнать из результата.
    event: BLIND_OPTIMIZATION
  - id: smallest-change-that-pays
    title:
      en: 'Fix a confirmed cause'
      ru: 'Исправь подтверждённую причину'
    goal:
      en: Ship one change against the confirmed cause, with the milliseconds you expect written down first.
      ru: Выкати одно изменение против подтверждённой причины, заранее записав ожидаемые миллисекунды.
    event: FIX_APPLIED
  - id: the-graph-that-did-not-move
    title:
      en: 'Watch a fix change nothing'
      ru: 'Посмотри, как исправление ничего не меняет'
    goal:
      en: Re-measure after a change that misses, and read the three reasons a graph refuses to move.
      ru: Перемерь после мимо бьющего изменения и прочитай три причины, по которым график отказывается двигаться.
    event: NO_IMPROVEMENT
  - id: same-measurement-again
    title:
      en: 'Verify with the same measurement'
      ru: 'Проверь тем же измерением'
    goal:
      en: Take the same measurement after the fix and compare it to the number you started from.
      ru: Сними то же измерение после исправления и сравни с числом, с которого начинал.
    event: IMPROVEMENT_VERIFIED
  - id: leave-a-graph-behind
    title:
      en: 'Leave monitoring behind'
      ru: 'Оставь после себя мониторинг'
    goal:
      en: Add the graph, the alert or the request id that makes the next hunt start from data.
      ru: Добавь график, алерт или идентификатор запроса, с которого следующая охота начнётся с данных.
    event: MONITORING_ADDED
  - id: read-the-worksheet-back
    title:
      en: 'Review the hunt'
      ru: 'Разбери охоту'
    goal:
      en: Read the whole hunt back — the levels, the cause, the missteps and what the clock says.
      ru: Прочитай всю охоту обратно — уровни, причину, промахи и то, что показывают часы.
    event: HUNT_REVIEW

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: first-hour-walkthrough
    en: A user says the site is slow. Walk me through what you do, in order, from that sentence to a fix.
    ru: Пользователь говорит, что сайт тормозит. Проведи меня по своим действиям по порядку — от этой фразы до исправления.
  - id: questions-you-ask-first
    en: What exactly do you ask before you open any code or dashboard, and why those questions?
    ru: Что именно ты спросишь, прежде чем открыть код или дашборд, и почему именно эти вопросы?
  - id: average-versus-percentiles
    en: The average response time looks fine and users still complain. How is that possible, and what do you look at instead?
    ru: Среднее время ответа выглядит нормально, а пользователи всё равно жалуются. Как такое возможно и на что ты посмотришь вместо него?
  - id: browser-waterfall-segments
    en: Which parts does a page load split into, and what does each part tell you about where the problem is?
    ru: На какие части распадается загрузка страницы и что каждая часть говорит о том, где проблема?
  - id: frontend-or-backend
    en: How do you decide whether the problem is in the backend, in the network, or in the browser?
    ru: Как ты определишь, где проблема — в бэкенде, в сети или в браузере?
  - id: ttfb-breakdown
    en: Time to first byte is 2.4 seconds. What are the possible causes, and how do you narrow them down?
    ru: Время до первого байта — 2,4 секунды. Какие могут быть причины и как ты их сузишь?
  - id: slow-only-under-load
    en: It is fast at night and slow at 8pm. What does that tell you, and how does it change what you investigate?
    ru: Ночью быстро, а в 20:00 медленно. О чём это говорит и как это меняет то, что ты будешь исследовать?
  - id: tools-you-would-use
    en: Which tools would you actually use at each level — browser, server, application, database?
    ru: Какими инструментами ты реально воспользуешься на каждом уровне — браузер, сервер, приложение, база?
  - id: no-monitoring-at-all
    en: There is no monitoring and no tracing. What can you still measure today, and what would you add first?
    ru: Нет ни мониторинга, ни трассировки. Что ты всё равно можешь измерить сегодня и что добавишь первым?
  - id: amdahl-ceiling
    en: 'You can make one function four times faster. How do you decide whether it is worth doing at all?'
    ru: 'Ты можешь ускорить одну функцию вчетверо. Как ты решишь, стоит ли это делать вообще?'
  - id: database-suspects
    en: The time is inside the database. What are the usual causes, and how do you tell them apart?
    ru: Время уходит внутри базы данных. Какие тут обычные причины и как ты их различишь?
  - id: gradual-versus-sudden
    en: What is the difference between a page that got slower gradually and one that got slower on Tuesday at 14:20?
    ru: Чем отличается страница, которая замедлялась постепенно, от той, что замедлилась во вторник в 14:20?
  - id: proving-the-fix
    en: What counts as proof that you fixed it? What would you refuse to accept?
    ru: Что считается доказательством, что ты это починил? Что ты откажешься принять?
  - id: profiler-shows-nothing
    en: You profile the handler and every method is fast, but the request takes three seconds. What is happening?
    ru: Ты профилируешь обработчик, и каждый метод быстрый, а запрос идёт три секунды. Что происходит?
  - id: caching-as-an-answer
    en: 'Someone says: just add a cache. When is that the right answer, and when is it hiding the problem?'
    ru: 'Кто-то говорит: просто добавь кэш. Когда это правильный ответ, а когда он прячет проблему?'
  - id: one-user-is-slow
    en: Only one customer reports it and it is fast for everyone else. How do you investigate that?
    ru: Жалуется только один клиент, у всех остальных быстро. Как ты будешь это расследовать?
  - id: what-you-leave-behind
    en: The page is fast again. What do you leave behind so the next regression is found by a machine, not a customer?
    ru: Страница снова быстрая. Что ты оставишь после себя, чтобы следующую регрессию нашла машина, а не клиент?
  - id: bottleneck-moves
    en: You removed the bottleneck and the page is still slower than the target. What now?
    ru: Ты убрал узкое место, а страница всё ещё медленнее цели. Что теперь?
