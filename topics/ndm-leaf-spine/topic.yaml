summary:
  en: >
    From Charles Clos's 1953 telephone-switching maths to the modern data
    centre fabric: non-blocking conditions (m ≥ 2n − 1 vs m ≥ n), the
    East-West traffic shift, the two-tier leaf-spine rules and two-hop
    guarantee, ECMP hashing and its flaws, oversubscription ratios, 5-stage
    Clos, eBGP underlay, EVPN-VXLAN overlay, and MLAG redundancy.
  ru: >
    От телефонной математики Чарльза Клоза 1953 года до современной фабрики
    дата-центра: условия неблокируемости (m ≥ 2n − 1 против m ≥ n), сдвиг
    трафика в East-West, правила двухуровневой leaf-spine топологии и гарантия
    двух хопов, хеширование ECMP и его недостатки, коэффициенты
    oversubscription, 5-стадийный Clos, underlay на eBGP, overlay EVPN-VXLAN
    и резервирование через MLAG.

