# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: core-difference
    en: Decorator and Proxy have nearly identical class diagrams. What is the real difference between them?
    ru: У Decorator и Proxy почти одинаковые диаграммы классов. В чём настоящая разница между ними?
  - id: same-structure
    en: Why can't you tell Decorator and Proxy apart by structure alone?
    ru: Почему Decorator и Proxy нельзя различить только по структуре?
  - id: stacking
    en: Decorators are designed to be stacked, while a Proxy is usually a single stand-in. Why?
    ru: Декораторы спроектированы для стопки, а Proxy обычно одна подмена. Почему?
  - id: proxy-kinds
    en: Name the common kinds of Proxy and what each one controls access for.
    ru: Назовите распространённые виды Proxy и для чего каждый контролирует доступ.
  - id: java-examples
    en: Give a real Java example of a Decorator and a real Java example of a Proxy.
    ru: Приведите реальный пример Decorator и реальный пример Proxy в Java.
  - id: proxy-vs-adapter
    en: How does a Proxy differ from an Adapter, given both wrap an object?
    ru: Чем Proxy отличается от Adapter, если оба оборачивают объект?
  - id: who-creates-subject
    en: Who typically supplies the wrapped object in a Decorator versus in a Proxy?
    ru: Кто обычно передаёт обёрнутый объект в Decorator и кто — в Proxy?
