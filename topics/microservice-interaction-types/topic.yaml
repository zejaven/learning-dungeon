summary:
  en: >
    Interactions between microservices are classified by two independent axes:
    whether the sender waits for an answer (synchronous request/response versus
    asynchronous messaging) and how many receivers there are (one-to-one versus
    one-to-many publish/subscribe). That matrix gives request/response, one-way
    commands, asynchronous request/reply, event publishing and streaming, plus
    indirect interaction through shared data or batch transfer. On top of the
    style sits the coordination shape - orchestration or choreography - and the
    transport (REST, gRPC, GraphQL, AMQP, Kafka), which is a separate decision.
  ru: >
    Взаимодействия между микросервисами классифицируются по двум независимым
    осям: ждёт ли отправитель ответ (синхронный request/response против
    асинхронного обмена сообщениями) и сколько у сообщения получателей (один к
    одному против один ко многим, publish/subscribe). Эта матрица даёт
    request/response, односторонние команды, асинхронный request/reply,
    публикацию событий и стриминг, а также косвенное взаимодействие через общие
    данные или пакетную передачу. Поверх стиля лежит форма координации -
    оркестрация или хореография - и транспорт (REST, gRPC, GraphQL, AMQP,
    Kafka), который выбирается отдельно.

