summary:
  en: >
    What the software development life cycle (SDLC) is and where testing lives
    in it: the classic stages from concept to retirement, why testing should
    start as early as possible (the earlier a defect is found, the cheaper it
    is to fix), static testing before the software even exists, and the
    crucial difference between stopping testing (a pause caused by blockers)
    and finishing it (meeting the exit criteria).
  ru: >
    Что такое жизненный цикл ПО (SDLC) и где в нём находится тестирование:
    классические этапы от концепции до вывода из эксплуатации, почему
    тестирование стоит начинать как можно раньше (чем раньше найден дефект,
    тем дешевле его исправить), статическое тестирование до появления самого
    ПО и принципиальная разница между остановкой тестирования (паузой из-за
    блокеров) и его завершением (выполнением критериев выхода).

