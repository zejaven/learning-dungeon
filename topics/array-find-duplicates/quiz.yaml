# Challenge mission: passes when every test case in the hidden harness is green.
missions:
  - id: all-tests
    type: challenge
    title:
      en: Pass all tests
      ru: Пройди все тесты
    goal:
      en: Implement findDuplicates so every hidden test case passes.
      ru: Реализуй findDuplicates, чтобы прошёл каждый скрытый тест-кейс.
    requires:
      - kind: tests

bossFight:
  - id: two-approaches
    en: How can you find the duplicates in an array, and what are the two classic approaches?
    ru: Как найти дубликаты в массиве и какие есть два классических подхода?
  - id: tradeoffs
    en: Compare the HashSet approach and the sort-and-scan approach by time and space complexity.
    ru: Сравни подход через HashSet и подход «отсортировать и пройтись» по времени и памяти.
  - id: when-sorting
    en: When would you prefer sorting over a HashSet, and when the other way around?
    ru: Когда предпочесть сортировку, а не HashSet, и когда наоборот?
  - id: hashset-cost
    en: Why is the HashSet lookup considered O(1), and what can make it degrade?
    ru: Почему поиск в HashSet считается O(1) и что может его ухудшить?
  - id: side-effects
    en: What hidden cost does the sorting approach have besides time complexity?
    ru: Какая скрытая цена есть у сортировки помимо временной сложности?
