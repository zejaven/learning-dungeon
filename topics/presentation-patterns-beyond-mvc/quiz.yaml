# Theory topic: no missions (there is no practice editor) - only a Boss Fight.
bossFight:
  - id: name-patterns-beyond-mvc
    en: Which presentation-layer patterns exist besides MVC?
    ru: Какие паттерны презентационного уровня существуют кроме MVC?
  - id: mvp-vs-mvvm
    en: How do MVP and MVVM differ in the way they connect presentation logic to the view?
    ru: Чем MVP и MVVM отличаются в способе связи презентационной логики с view?
  - id: passive-view-purpose
    en: Why does Passive View make UI code easier to test, and what is the trade-off?
    ru: Почему Passive View упрощает тестирование UI-кода и какова цена этого подхода?
  - id: front-controller-purpose
    en: What problem does Front Controller solve in a web application?
    ru: Какую проблему Front Controller решает в web-приложении?
  - id: choose-pattern
    en: How would you choose between MVC, MVP, MVVM, Page Controller and Front Controller for a real system?
    ru: Как выбрать между MVC, MVP, MVVM, Page Controller и Front Controller для реальной системы?
