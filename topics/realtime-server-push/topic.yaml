id: realtime-server-push
title:
  en: 'Notifying a Browser in Real Time'
  ru: 'Уведомление браузера в реальном времени'
category:
  en: Networking / Real-Time
  ru: Сети / Реальное время
type: HTTP
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: networking
difficulty: 2
catalogId: networking-1
summary:
  en: >
    A browser tab is not a server: it has no address to be called back on, and
    an HTTP connection is opened by the client and closed once the response is
    finished. So a server that knows something interesting has no wire to send
    it down. Every real-time technology is a different answer to that one
    problem. Short polling asks on a timer and pays a round trip per 'nothing
    yet'. Long polling asks once and lets the server hold the request until it
    has news. SSE is a single GET whose response never ends, one-way, with
    automatic reconnect and Last-Event-ID replay. A WebSocket upgrades one
    handshake into a two-way frame tunnel and gives you nothing above it. The
    real decision is direction, message rate and how much connection state you
    are willing to run — plus the fan-out problem every push transport inherits
    the moment there are two instances behind a load balancer.
  ru: >
    Вкладка браузера — не сервер: у неё нет адреса для обратного вызова, а
    HTTP-соединение открывает клиент, и оно закрывается сразу после ответа.
    Поэтому серверу, который узнал что-то важное, попросту некуда это отправить.
    Каждая технология реального времени — свой ответ на эту одну проблему.
    Короткий опрос спрашивает по таймеру и платит обменом за каждое «пока
    ничего». Длинный опрос спрашивает один раз и позволяет серверу придержать
    запрос до появления новости. SSE — один GET, ответ на который никогда не
    заканчивается: односторонний, с автоматическим переподключением и повтором
    по Last-Event-ID. WebSocket превращает одно рукопожатие в двусторонний
    туннель кадров и не даёт поверх него ничего. Выбор на самом деле про
    направление, частоту сообщений и то, сколько состояния соединений вы готовы
    держать, — плюс проблема веерной рассылки, которую любой push наследует, как
    только за балансировщиком оказывается два экземпляра.

# Visual primitives this topic's visualizer composes (frontend).
primitives:
  - BoxGroup

defaultExample: who-may-speak-first

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: who-may-speak-first
    title:
      en: Who is allowed to speak first
      ru: Кому позволено заговорить первым
    file: 01-who-may-speak-first.java
    explanation:
      en: >
        The problem before any of the solutions. The server learns something,
        and there is simply no wire to send it down: a tab has no address, and
        the last HTTP connection closed when the last response finished. The
        news sits in a queue until the client's timer next asks — and the poll
        after that pays for a full round trip to learn nothing at all.
      ru: >
        Проблема, которая предшествует любым решениям. Сервер что-то узнал, и
        отправить это просто некуда: у вкладки нет адреса, а последнее
        HTTP-соединение закрылось вместе с последним ответом. Новость лежит в
        очереди, пока не сработает таймер клиента, — а следующий опрос платит
        полным обменом за то, чтобы не узнать ничего.
  - id: what-polling-costs
    title:
      en: 'The interval is the trade-off'
      ru: 'Интервал — это и есть компромисс'
    file: 02-what-polling-costs.java
    explanation:
      en: >
        The same event and the same 12 ticks, polled every 3 ticks and every 12.
        The fast one delivers in 2 ticks and pays 4 requests, 3 of them empty;
        the slow one pays a single request and shows the news 11 ticks late.
        There is no setting that is good at both, which is exactly why the other
        three technologies exist.
      ru: >
        Одно и то же событие и те же 12 тиков, опрос раз в 3 тика и раз в 12.
        Быстрый доставляет за 2 тика и платит 4 запроса, 3 из них пустые;
        медленный платит один запрос и показывает новость с опозданием в 11
        тиков. Настройки, хорошей сразу в обоих смыслах, нет — именно поэтому и
        существуют остальные три технологии.
  - id: long-polling
    title:
      en: 'Let the server hold the request'
      ru: 'Пусть сервер придержит запрос'
    file: 03-long-polling.java
    explanation:
      en: >
        Exactly the same protocol, with the waiting moved to the other side: the
        client asks once and the server does not answer until it has news. The
        delay drops to zero over ordinary HTTP with no upgrade — at the price of
        one parked request per connected client, a deliberate timeout before a
        proxy kills the connection, and a re-open after every single message.
      ru: >
        Тот же самый протокол, но ожидание переехало на другую сторону: клиент
        спрашивает один раз, а сервер не отвечает, пока нет новостей. Задержка
        падает до нуля по обычному HTTP без всякого апгрейда — ценой одного
        припаркованного запроса на клиента, намеренного таймаута раньше, чем
        соединение оборвёт прокси, и переоткрытия после каждого сообщения.
  - id: server-sent-events
    title:
      en: 'A response that never ends'
      ru: 'Ответ, который не заканчивается'
    file: 04-server-sent-events.java
    explanation:
      en: >
        One GET, answered with text/event-stream and a body the server keeps
        writing into. Delivery is instant and costs nothing per message. Then
        the connection drops: EventSource reconnects on its own and sends
        Last-Event-ID, so the server replays exactly what was missed. The catch
        is the direction — sending anything back needs a separate request.
      ru: >
        Один GET, ответ на который имеет тип text/event-stream и тело, в которое
        сервер продолжает писать. Доставка мгновенна и не стоит ничего за
        сообщение. Затем соединение обрывается: EventSource переподключается сам
        и отправляет Last-Event-ID, поэтому сервер досылает ровно то, что было
        пропущено. Подвох — в направлении: чтобы отправить что-то обратно, нужен
        отдельный запрос.
  - id: websocket
    title:
      en: 'One handshake, then no more HTTP'
      ru: 'Одно рукопожатие — и HTTP больше нет'
    file: 05-websocket.java
    explanation:
      en: >
        After 101 Switching Protocols the connection carries frames both ways
        and has no notion of request, response, status code or caching left. The
        client can answer on the same wire for a few bytes. But nothing is
        replayed for you: the socket drops, the frames written into it are gone,
        and recovering from that is code you write yourself.
      ru: >
        После 101 Switching Protocols соединение несёт кадры в обе стороны, и в
        нём не остаётся ни запросов, ни ответов, ни кодов состояния, ни
        кэширования. Клиент может ответить по тому же проводу за несколько байт.
        Но ничего не досылается: сокет оборвался — записанные в него кадры
        исчезли, и восстановление после этого пишете вы сами.
  - id: scaling-push-out
    title:
      en: 'Push behind a load balancer'
      ru: 'Push за балансировщиком нагрузки'
    file: 06-scaling-push-out.java
    explanation:
      en: >
        The problem nobody mentions until the second instance is deployed. An
        open connection is state, and it lives in exactly one process: an event
        handled by instance B cannot reach a client attached to instance A. No
        error, no log line, just a screen that stays wrong. The fix is a shared
        bus underneath. Polling never had the problem at all.
      ru: >
        Проблема, о которой никто не вспоминает до выката второго экземпляра.
        Открытое соединение — это состояние, и живёт оно ровно в одном процессе:
        событие, обработанное экземпляром B, не может дойти до клиента,
        подключённого к A. Ни ошибки, ни строчки в логе — просто экран, который
        остался неверным. Лечится общей шиной снизу. У опроса такой проблемы не
        было вовсе.
  - id: compare-the-four
    title:
      en: 'The same events, priced four ways'
      ru: 'Одни события, четыре ценника'
    file: 07-compare-the-four.java
    explanation:
      en: >
        24 ticks, 3 events, four transports, one table. Short polling pays 4
        requests and is up to 6 ticks late; long polling delivers instantly for
        5 requests but parks one per client; SSE and WebSocket both deliver
        instantly over a single connection and differ only in whether the client
        also needs to send. There is no winner — there is a column you care
        about.
      ru: >
        24 тика, 3 события, четыре транспорта, одна таблица. Короткий опрос
        платит 4 запроса и опаздывает до 6 тиков; длинный опрос доставляет
        мгновенно за 5 запросов, но паркует по одному на клиента; SSE и WebSocket
        доставляют мгновенно по одному соединению и отличаются лишь тем, нужно ли
        клиенту ещё и отправлять. Победителя нет — есть колонка, которая важна
        именно вам.

