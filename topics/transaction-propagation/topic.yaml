id: transaction-propagation
title:
  en: Transaction Propagation
  ru: Распространение транзакций (Transaction Propagation)
category:
  en: Spring / Transactions
  ru: Spring / Транзакции
type: TRANSACTION
mode: trace
aiProvider: claude
aiModel: claude-opus-4-8
categoryId: spring
difficulty: 2
catalogId: manual-17
style: Real world
summary:
  en: >
    What transaction propagation means when one @Transactional method calls
    another: the difference between a logical boundary and a physical database
    transaction, and how REQUIRED, REQUIRES_NEW, NESTED, SUPPORTS, NOT_SUPPORTED,
    MANDATORY and NEVER each decide to start, join, suspend, savepoint or forbid a
    transaction — plus why an inner REQUIRED rollback poisons the whole thing.
  ru: >
    Что такое распространение транзакций, когда один @Transactional-метод вызывает
    другой: разница между логической границей и физической транзакцией БД, и как
    REQUIRED, REQUIRES_NEW, NESTED, SUPPORTS, NOT_SUPPORTED, MANDATORY и NEVER
    решают открыть, присоединить, приостановить транзакцию, сделать savepoint или
    запретить её — а также почему откат внутреннего REQUIRED «отравляет» всё.

primitives:
  - ArrayGrid
  - EventLog

defaultExample: required-join

examples:
  - id: required-join
    title:
      en: REQUIRED joins
      ru: REQUIRED присоединяется
    file: 01-required-join.java
    explanation:
      en: >
        The default. An outer REQUIRED method starts one physical transaction; an
        inner REQUIRED method finds it active and joins it. There is a single
        commit at the outer boundary.
      ru: >
        По умолчанию. Внешний REQUIRED-метод открывает одну физическую транзакцию;
        внутренний REQUIRED видит её активной и присоединяется. Коммит один — на
        внешней границе.
  - id: requires-new-suspend
    title:
      en: REQUIRES_NEW suspends
      ru: REQUIRES_NEW приостанавливает
    file: 02-requires-new-suspend.java
    explanation:
      en: >
        REQUIRES_NEW suspends the current transaction and opens a brand-new
        physical transaction that commits or rolls back on its own. The outer
        transaction resumes afterwards.
      ru: >
        REQUIRES_NEW приостанавливает текущую транзакцию и открывает совершенно
        новую физическую транзакцию, которая коммитится или откатывается сама по
        себе. Затем внешняя транзакция возобновляется.
  - id: nested-savepoint
    title:
      en: NESTED savepoint
      ru: NESTED savepoint
    file: 03-nested-savepoint.java
    explanation:
      en: >
        NESTED reuses the same physical transaction but marks a savepoint. Rolling
        back the inner block undoes only the work after the savepoint; the outer
        transaction still commits everything before it.
      ru: >
        NESTED использует ту же физическую транзакцию, но ставит savepoint. Откат
        внутреннего блока отменяет только работу после savepoint; внешняя транзакция
        всё равно коммитит всё, что было до него.
  - id: required-rollback
    title:
      en: Inner rollback poisons
      ru: Внутренний откат отравляет
    file: 04-required-rollback.java
    explanation:
      en: >
        The classic trap. An inner REQUIRED method that throws marks the shared
        transaction rollback-only. When the outer method tries to commit, Spring
        raises UnexpectedRollbackException.
      ru: >
        Классическая ловушка. Внутренний REQUIRED-метод, бросивший исключение,
        помечает общую транзакцию как rollback-only. Когда внешний метод пытается
        закоммитить, Spring бросает UnexpectedRollbackException.
  - id: mandatory-never
    title:
      en: MANDATORY / NEVER errors
      ru: Ошибки MANDATORY / NEVER
    file: 05-mandatory-never.java
    explanation:
      en: >
        MANDATORY requires an existing transaction and fails when there is none;
        NEVER forbids running inside one and fails when a transaction is active.
        Both throw before any business code runs.
      ru: >
        MANDATORY требует уже открытую транзакцию и падает, когда её нет; NEVER
        запрещает работу внутри транзакции и падает, когда транзакция активна. Оба
        бросают исключение ещё до бизнес-кода.
  - id: supports-not-supported
    title:
      en: SUPPORTS / NOT_SUPPORTED
      ru: SUPPORTS / NOT_SUPPORTED
    file: 06-supports-not-supported.java
    explanation:
      en: >
        SUPPORTS joins a transaction if one exists but happily runs without one.
        NOT_SUPPORTED suspends any active transaction and runs the method on a
        non-transactional connection.
      ru: >
        SUPPORTS присоединяется к транзакции, если она есть, но спокойно работает и
        без неё. NOT_SUPPORTED приостанавливает любую активную транзакцию и
        выполняет метод на нетранзакционном соединении.

assistantExample:
  en: 'e.g. Why does an inner REQUIRED method throwing cause UnexpectedRollbackException in the caller?'
  ru: 'например: Почему исключение во внутреннем REQUIRED-методе приводит к UnexpectedRollbackException у вызывающего?'

