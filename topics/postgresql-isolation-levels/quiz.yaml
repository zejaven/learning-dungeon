# Theory topic: no missions, only Boss Fight questions.
bossFight:
  - id: list-levels
    en: Which transaction isolation levels can you set in PostgreSQL?
    ru: Какие уровни изоляции транзакций можно установить в PostgreSQL?
  - id: read-uncommitted-behavior
    en: How does READ UNCOMMITTED behave in PostgreSQL, and why is that a common interview trap?
    ru: Как ведет себя READ UNCOMMITTED в PostgreSQL и почему это частая ловушка на собеседовании?
  - id: read-committed-default
    en: What does READ COMMITTED see in PostgreSQL, and why can two SELECT statements in one transaction return different results?
    ru: Что видит READ COMMITTED в PostgreSQL и почему два SELECT в одной транзакции могут вернуть разные результаты?
  - id: repeatable-read-snapshot
    en: What does REPEATABLE READ guarantee in PostgreSQL, and what anomaly can still remain?
    ru: Что гарантирует REPEATABLE READ в PostgreSQL и какая аномалия все еще может остаться?
  - id: serializable-ssi
    en: How does PostgreSQL SERIALIZABLE differ from REPEATABLE READ?
    ru: Чем SERIALIZABLE в PostgreSQL отличается от REPEATABLE READ?
  - id: retry-serialization-failure
    en: Why must application code be ready to retry SERIALIZABLE transactions?
    ru: Почему код приложения должен быть готов повторять транзакции SERIALIZABLE?
