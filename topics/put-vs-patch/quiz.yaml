# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: replace-the-whole-thing
    title:
      en: Replace the whole representation
      ru: Замени представление целиком
    goal:
      en: Send a complete body with PUT and watch the server swap the stored representation for it.
      ru: Отправь полное тело методом PUT и посмотри, как сервер меняет хранимое представление на него.
    event: PUT_REPLACED
  - id: lose-a-field-with-put
    title:
      en: Lose a field with PUT
      ru: Потеряй поле через PUT
    goal:
      en: Send a partial body with PUT and watch the fields you left out disappear from the resource.
      ru: Отправь неполное тело методом PUT и посмотри, как пропущенные поля исчезают из ресурса.
    event: FIELD_LOST
  - id: change-only-what-you-name
    title:
      en: Change only what you name
      ru: Измени только то, что назвал
    goal:
      en: Use PATCH to change one member and leave every field the body never mentioned untouched.
      ru: Измени одно поле через PATCH так, чтобы все неупомянутые поля остались нетронутыми.
    event: PATCH_MERGED
  - id: repeat-without-effect
    title:
      en: Repeat without effect
      ru: Повтори без последствий
    goal:
      en: Send the identical request twice and end up with exactly the same resource and ETag.
      ru: Отправь один и тот же запрос дважды и получи ровно тот же ресурс и тот же ETag.
    event: IDEMPOTENT_REPEAT
  - id: break-idempotency
    title:
      en: Break idempotency
      ru: Сломай идемпотентность
    goal:
      en: Send a PATCH that carries an operation rather than a target value, twice, and see it applied twice.
      ru: Отправь дважды PATCH, несущий операцию, а не желаемое значение, и увидь, как её применят дважды.
    event: NON_IDEMPOTENT_REPEAT
  - id: delete-with-null
    title:
      en: 'Delete a member with null'
      ru: 'Удали поле через null'
    goal:
      en: Send an explicit null in a merge patch and watch the member be removed rather than emptied.
      ru: Отправь явный null в merge patch и посмотри, как поле удаляется, а не обнуляется.
    event: MERGE_PATCH_NULL
  - id: patch-what-is-not-there
    title:
      en: 'PATCH what is not there'
      ru: 'Пропатчи то, чего нет'
    goal:
      en: Send a PATCH to a URL that holds nothing and see why the server has nothing to merge into.
      ru: Отправь PATCH на URL, где ничего не лежит, и пойми, почему серверу не с чем сливать тело.
    event: PATCH_NOT_FOUND
  - id: refuse-a-stale-write
    title:
      en: Refuse a stale write
      ru: Отклони устаревшую запись
    goal:
      en: Attach If-Match to a full-body write built from an old copy and have the server reject it.
      ru: Добавь If-Match к записи полного тела, собранного по старой копии, и добейся отказа сервера.
    event: PRECONDITION_FAILED

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: put-vs-patch-core
    en: What is the difference between PUT and PATCH?
    ru: В чём разница между методами PUT и PATCH?
  - id: partial-put-consequences
    en: A client sends PUT /users/7 with only {"role":"admin"}. What should the server store, and why is that a problem?
    ru: Клиент отправляет PUT /users/7 с телом только {"role":"admin"}. Что сервер должен сохранить и почему это проблема?
  - id: idempotency-meaning
    en: What does it mean for a method to be idempotent, and why is PUT idempotent while PATCH is not guaranteed to be?
    ru: Что значит, что метод идемпотентен, и почему PUT идемпотентен, а PATCH — не обязательно?
  - id: non-idempotent-patch-example
    en: Give a concrete PATCH body that is not idempotent, and one that is. What makes the difference?
    ru: Приведи конкретное тело PATCH, которое не идемпотентно, и такое, которое идемпотентно. В чём разница?
  - id: patch-formats
    en: What formats can a PATCH body have, and how do JSON Merge Patch and JSON Patch differ?
    ru: В каких форматах может быть тело PATCH и чем JSON Merge Patch отличается от JSON Patch?
  - id: merge-patch-null-semantics
    en: In JSON Merge Patch, what does an explicit null mean? How do you set a field to null then?
    ru: Что означает явный null в JSON Merge Patch? Как тогда установить полю значение null?
  - id: put-creates-resource
    en: Can PUT create a resource that does not exist? What status code do you return, and what does PATCH do in the same situation?
    ru: Может ли PUT создать несуществующий ресурс? Какой статус вернуть и что в той же ситуации делает PATCH?
  - id: status-codes
    en: Which status codes does a well-behaved PUT or PATCH endpoint return, and when is each one right?
    ru: Какие коды состояния возвращает корректный эндпоинт PUT или PATCH и когда уместен каждый из них?
  - id: safe-and-idempotent-table
    en: Which HTTP methods are safe and which are idempotent? Where do PUT, PATCH, POST and DELETE sit?
    ru: Какие HTTP-методы безопасны, а какие идемпотентны? Где в этой таблице PUT, PATCH, POST и DELETE?
  - id: concurrency-and-lost-updates
    en: Two clients edit the same resource at once. How do PUT and PATCH differ in the risk of a lost update, and how do you prevent one?
    ru: Два клиента одновременно редактируют один ресурс. Чем PUT и PATCH различаются по риску потери обновления и как её предотвратить?
  - id: retries-and-network-failures
    en: A PUT times out and the client does not know whether it was applied. Is a retry safe? What changes if it was a PATCH?
    ru: PUT завис по таймауту, и клиент не знает, применился ли он. Безопасен ли повтор? Что меняется, если это был PATCH?
  - id: choosing-in-practice
    en: You are designing an endpoint to update a user profile. Would you expose PUT, PATCH, or both — and how would you justify it?
    ru: Ты проектируешь эндпоинт обновления профиля пользователя. Что откроешь — PUT, PATCH или оба — и как это обоснуешь?
  - id: validating-a-patch
    en: How do you validate a PATCH request server-side, given the body only carries part of the resource?
    ru: Как валидировать PATCH-запрос на сервере, если тело содержит лишь часть ресурса?
  - id: patch-caching-and-content-type
    en: What Content-Type does a PATCH request use, and why does sending application/json for a patch cause trouble?
    ru: Какой Content-Type используется у PATCH-запроса и почему отправка application/json для патча создаёт проблемы?
