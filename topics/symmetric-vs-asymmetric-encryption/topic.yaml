defaultExample: one-key-or-two

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: one-key-or-two
    title:
      en: 'One key, or two'
      ru: 'Один ключ или два'
    file: 01-one-key-or-two.java
    explanation:
      en: >
        The entire distinction, in four lines. Watch the key inventory: the
        symmetric key appears once and is immediately copied to two holders,
        because a key nobody else has is useless. The pair appears as two
        separate entries with one owner, and then one of them is deliberately
        handed to the whole world. Ask of every key you meet afterwards: who has
        to have it, and may it be published?
      ru: >
        Всё различие в четырёх строках. Следите за инвентарём ключей:
        симметричный ключ появляется один раз и тут же копируется двум
        владельцам, потому что ключ, которого нет ни у кого другого,
        бесполезен. Пара появляется двумя отдельными записями с одним
        владельцем, и затем одну из них намеренно отдают всему миру. Про любой
        встреченный дальше ключ спрашивайте: у кого он обязан быть и можно ли
        его публиковать?
  - id: symmetric-round-trip
    title:
      en: 'The same key both ways'
      ru: 'Один ключ в обе стороны'
    file: 02-symmetric-round-trip.java
    explanation:
      en: >
        Encrypt, decrypt, and then try a different key of exactly the same
        strength. Two things to take away: the operation is cheap and the size
        of the data is irrelevant, and decryption is not a best-effort attempt -
        the wrong key produces a rejection, not garbage. Also note what the
        successful round trip did NOT prove: with a shared key either holder
        could have written the message.
      ru: >
        Зашифровать, расшифровать, а потом попробовать другой ключ ровно той же
        стойкости. Два вывода: операция дёшева и размер данных не имеет
        значения, а расшифровка — не попытка «разобрать как получится»: не тот
        ключ даёт отказ, а не мусор. Обратите внимание и на то, чего успешный
        круг НЕ доказал: с общим ключом сообщение мог написать любой из
        владельцев.
  - id: the-key-distribution-problem
    title:
      en: 'Getting the key to the other side'
      ru: 'Как доставить ключ другой стороне'
    file: 03-the-key-distribution-problem.java
    explanation:
      en: >
        The reason asymmetric cryptography was invented. Bob cannot read
        anything until he has the key, so the key goes over the same channel the
        messages do - and it is now everybody's key. Then the arithmetic: two
        parties need one key, fifty parties need 1225, and each one has to be
        generated, delivered, stored and rotated.
      ru: >
        Причина, по которой изобрели асимметричную криптографию. Боб ничего не
        прочитает, пока у него нет ключа, поэтому ключ идёт по тому же каналу,
        что и сообщения, — и теперь он общий для всех. Дальше арифметика: двум
        участникам нужен один ключ, пятидесяти — 1225, и каждый нужно создать,
        доставить, хранить и ротировать.
  - id: asymmetric-round-trip
    title:
      en: 'Public closes, private opens'
      ru: 'Публичный закрывает, приватный открывает'
    file: 04-asymmetric-round-trip.java
    explanation:
      en: >
        The same round trip with a pair, and the moment worth pausing on is the
        interception: Mallory holds the very key that produced the ciphertext
        and still cannot read it. Nothing was agreed in advance and nothing
        secret crossed the wire. Note the side effect - the sender cannot read
        their own message back either.
      ru: >
        Тот же круг, но с парой, и остановиться стоит на перехвате: у Мэллори
        есть ровно тот ключ, которым получен шифротекст, и прочитать она его всё
        равно не может. Заранее ничего не согласовывали, и секретного по проводу
        не шло. Обратите внимание на побочный эффект: отправитель тоже больше не
        может прочитать собственное сообщение.
  - id: signing-is-the-other-direction
    title:
      en: 'The pair used the other way'
      ru: 'Пара в обратную сторону'
    file: 05-signing-is-the-other-direction.java
    explanation:
      en: >
        Swap which half you start with and the guarantee flips from secrecy to
        authorship. Watch two things: the message stays fully readable on the
        wire - a signature encrypts nothing - and after one character is changed
        nobody can repair the signature, because repairing it needs the key that
        never moved. This is what a shared secret can never do: single out an
        author.
      ru: >
        Поменяйте местами, с какой половины начинать, и гарантия сменится с
        секретности на авторство. Смотрите на две вещи: сообщение остаётся
        полностью читаемым на проводе — подпись ничего не шифрует, — и после
        изменения одного символа починить подпись не может никто, потому что для
        этого нужен ключ, который никуда не уходил. Вот чего общий секрет не
        умеет в принципе: выделить автора.
  - id: why-not-only-asymmetric
    title:
      en: 'Why not use only the pair'
      ru: 'Почему не только пара'
    file: 06-why-not-only-asymmetric.java
    explanation:
      en: >
        The obvious follow-up question, answered with two numbers. First the
        hard ceiling - RSA encrypts one number smaller than the modulus, so a
        2048-bit key cannot swallow more than 190 bytes at a time. Then the
        cost of doing it anyway, block by block, against a single symmetric pass
        over the same file.
      ru: >
        Очевидный следующий вопрос, отвеченный двумя числами. Сначала жёсткий
        потолок: RSA шифрует одно число, меньшее модуля, поэтому 2048-битный
        ключ не проглотит больше 190 байт за раз. Затем стоимость того, чтобы
        всё-таки сделать это поблочно, против одного симметричного прохода по
        тому же файлу.
  - id: hybrid-encryption
    title:
      en: 'Hybrid: what everything actually does'
      ru: 'Гибрид: как это работает на самом деле'
    file: 07-hybrid-encryption.java
    explanation:
      en: >
        The file asymmetric encryption refused, now delivered. A fresh symmetric
        key is generated, the expensive algorithm is spent once on those 32
        bytes, and the payload rides the cheap cipher. Count the operations in
        the audit at the end: two asymmetric and two symmetric, and that count
        would not change if the file were a hundred times larger.
      ru: >
        Файл, который асимметричное шифрование отвергло, теперь доставлен.
        Генерируется свежий симметричный ключ, дорогой алгоритм тратится один
        раз на эти 32 байта, а нагрузку везёт дешёвый шифр. Посчитайте операции
        в итоговой сводке: две асимметричные и две симметричные, и это число не
        изменилось бы, будь файл в сто раз больше.
  - id: which-key-must-stay-secret
    title:
      en: 'Publish one half, lose the other'
      ru: 'Одну половину опубликовать, другую потерять'
    file: 08-which-key-must-stay-secret.java
    explanation:
      en: >
        The same pair, two opposite events. Handing the public half to the world
        changes nothing an attacker can use. Losing the private half opens
        everything ever addressed to it, including a message intercepted long
        before the leak - because the session key inside it was wrapped to that
        one key. This is the argument that pushed protocols towards ephemeral
        key agreement.
      ru: >
        Одна и та же пара, два противоположных события. Отдать публичную
        половину всему миру — ничего из этого злоумышленник использовать не
        сможет. Потерять приватную — открывается всё, что когда-либо на неё
        адресовали, включая перехваченное задолго до утечки сообщение, ведь
        ключ сессии внутри был обёрнут именно этим ключом. Это и есть довод,
        толкнувший протоколы к эфемерному согласованию ключей.

