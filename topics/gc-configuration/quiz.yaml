# Theory topic: no missions, only Boss Fight questions.
bossFight:
  - id: gc-tuning-goal
    en: 'What question should you answer before changing any GC flag?'
    ru: 'На какой вопрос нужно ответить перед изменением любого GC-флага?'
  - id: choose-collector
    en: 'How would you choose between G1, ZGC, Parallel GC, and Serial GC?'
    ru: 'Как выбрать между G1, ZGC, Parallel GC и Serial GC?'
  - id: heap-sizing
    en: 'How do -Xms, -Xmx, and container memory limits affect GC behavior?'
    ru: 'Как -Xms, -Xmx и лимиты памяти контейнера влияют на поведение GC?'
  - id: gc-logging
    en: 'Which GC logging option would you enable on Java 9+ and what would you look for in the log?'
    ru: 'Какую опцию GC logging вы включите в Java 9+ и что будете искать в логе?'
  - id: pause-target
    en: 'Why is -XX:MaxGCPauseMillis a goal rather than a guaranteed pause limit?'
    ru: 'Почему -XX:MaxGCPauseMillis является целью, а не гарантированным лимитом паузы?'
  - id: tuning-traps
    en: 'Name two common mistakes people make when configuring GC.'
    ru: 'Назовите две типичные ошибки при настройке GC.'
