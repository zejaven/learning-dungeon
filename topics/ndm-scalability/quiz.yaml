bossFight:
  # I. Fundamentals and Dimensions of Scaling
  - id: defining-scalability
    en: 'Beyond just "growing," how do the sources define scalability in terms of structural, mathematical, and algorithmic capabilities?'
    ru: 'Помимо простого «роста», как источники определяют масштабируемость в терминах структурных, математических и алгоритмических способностей?'
  - id: linear-cost-growth
    en: 'Why is maintaining a linear, predictable cost-to-growth ratio considered a critical focus for a successful design?'
    ru: 'Почему поддержание линейного, предсказуемого соотношения затрат к росту считается ключевым фокусом успешного дизайна?'
  - id: three-dimensions
    en: 'Contrast the challenges of Administrative, Data Plane, and Control Plane scalability. Which is most affected by the growth of IT headcount?'
    ru: 'Сопоставьте проблемы административной масштабируемости, масштабируемости data plane и control plane. Какая из них сильнее всего связана с ростом штата IT?'
  - id: architectural-collapse
    en: 'What are the specific risks of allowing a network to exhibit exponential curves in resource consumption as it grows?'
    ru: 'Каковы конкретные риски того, что сеть по мере роста демонстрирует экспоненциальные кривые потребления ресурсов?'
  # II. Scaling Methodologies (Scale-Up vs. Scale-Out)
  - id: vertical-scaling-mechanisms
    en: 'Discuss the mechanisms for vertical scaling, such as modular chassis expansion. What are its primary physical limitations?'
    ru: 'Обсудите механизмы вертикального масштабирования, например расширение модульного шасси. Каковы его основные физические ограничения?'
  - id: hard-scaling-wall
    en: 'Why does vertical scaling eventually lead to a disruptive "forklift upgrade"?'
    ru: 'Почему вертикальное масштабирование в итоге приводит к разрушительному «forklift upgrade» — полной замене системы?'
  - id: horizontal-decoupling
    en: 'How does the horizontal approach decouple expansion from single-device physical constraints?'
    ru: 'Как горизонтальный подход отвязывает расширение от физических ограничений одного устройства?'
  - id: scale-out-mechanisms
    en: 'In what ways do technologies like access switch stacks or Anycast routing facilitate a scale-out architecture?'
    ru: 'Каким образом технологии вроде стеков коммутаторов доступа или Anycast-маршрутизации способствуют scale-out архитектуре?'
  # III. Hierarchical Design and Modularity
  - id: three-layer-roles
    en: 'How does each layer (Access, Distribution, and Core) specifically contribute to the overall scalability of the network?'
    ru: 'Как каждый уровень (Access, Distribution и Core) конкретно вносит вклад в общую масштабируемость сети?'
  - id: lean-core
    en: 'Why is heavy processing (like ACLs or DPI) strictly prohibited at the Core layer in a scalable design?'
    ru: 'Почему тяжёлая обработка (например, ACL или DPI) строго запрещена на уровне Core в масштабируемом дизайне?'
  - id: repeatable-pods
    en: 'Explain the "cookie-cutter" approach of pod-based design. How does it simplify CapEx predictions?'
    ru: 'Объясните подход «под копирку» в pod-дизайне. Как он упрощает прогнозирование CapEx?'
  - id: fault-isolation
    en: 'How do Layer 3 boundaries in a modular design serve to isolate fault domains and contain hardware anomalies?'
    ru: 'Как границы Layer 3 в модульном дизайне помогают изолировать домены отказа и сдерживать аппаратные аномалии?'
  # IV. Logical Efficiency and Routing Scalability
  - id: hierarchical-addressing
    en: 'The sources state that physical hardware scalability is useless without logical scalability. Why is contiguous IP block allocation essential for this?'
    ru: 'Источники утверждают, что физическая масштабируемость железа бесполезна без логической. Почему выделение непрерывных блоков IP-адресов критично для этого?'
  - id: summarisation-efficiency
    en: 'How does route summarisation conserve TCAM memory and CPU cycles in the network backbone?'
    ru: 'Как суммаризация маршрутов экономит память TCAM и циклы CPU в магистрали сети?'
  - id: ospf-multi-area
    en: 'How do Area Border Routers (ABRs) prevent local failures from triggering global SPF recalculations in an OSPF environment?'
    ru: 'Как Area Border Router (ABR) предотвращают запуск глобальных пересчётов SPF из-за локальных сбоев в среде OSPF?'
  - id: eigrp-stub-routers
    en: 'Discuss how the use of Stub Routers in EIGRP eliminates "Stuck-in-Active" (SIA) errors across large-scale WANs.'
    ru: 'Обсудите, как использование Stub Router в EIGRP устраняет ошибки «Stuck-in-Active» (SIA) в крупных WAN.'
  # V. Modern Operations and Anti-Patterns
  - id: statelessness
    en: 'Why is statelessness considered a critical principle for scaling modern web-based network services and APIs?'
    ru: 'Почему statelessness (отсутствие состояния) считается критическим принципом масштабирования современных веб-сервисов сети и API?'
  - id: scalability-killers
    en: 'Discuss the dangers of "Anti-Patterns" like flat Layer 2 topologies and hardcoded IP addresses.'
    ru: 'Обсудите опасности «анти-паттернов» — плоских топологий Layer 2 и жёстко зашитых IP-адресов.'
  - id: oversubscription-ratios
    en: 'Why must designers adhere to specific ratios, such as 20:1 for Access-to-Distribution, to prevent core congestion?'
    ru: 'Почему проектировщики должны придерживаться конкретных коэффициентов переподписки, например 20:1 для Access→Distribution, чтобы избежать перегрузки ядра?'
  - id: capacity-planning-netflow
    en: 'How can designers use NetFlow data to find a balance between high CapEx over-provisioning and maintaining performance during spikes?'
    ru: 'Как проектировщики могут использовать данные NetFlow, чтобы найти баланс между дорогим over-provisioning и сохранением производительности при пиках нагрузки?'
