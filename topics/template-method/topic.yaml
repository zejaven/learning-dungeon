summary:
  en: >
    Template Method defines the skeleton of an algorithm in an abstract base
    class and lets subclasses fill in selected steps. In this structural
    practice you build an order-processing workflow where OrderWorkflow fixes
    the process order, while OnlineOrderWorkflow and StorePickupWorkflow provide
    concrete step implementations.
  ru: >
    Template Method задаёт скелет алгоритма в абстрактном базовом классе и
    позволяет подклассам заполнить отдельные шаги. В этой структурной практике
    вы собираете workflow обработки заказа, где OrderWorkflow фиксирует порядок
    процесса, а OnlineOrderWorkflow и StorePickupWorkflow дают конкретные
    реализации шагов.

