# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: communication-options-overview
    en: What options do you have for configuring communication between services? Structure the answer by layers instead of listing technologies.
    ru: Какие есть варианты настройки взаимодействия между сервисами? Постройте ответ по уровням, а не списком технологий.
  - id: rest-vs-grpc-choice
    en: When would you choose gRPC over REST for an internal call, and what does that choice cost you?
    ru: Когда вы выберете gRPC вместо REST для внутреннего вызова и чего этот выбор будет стоить?
  - id: contract-and-versioning
    en: How do you define and evolve the contract between two services so a change does not break consumers?
    ru: Как задать и развивать контракт между двумя сервисами, чтобы изменение не сломало потребителей?
  - id: service-discovery-options
    en: What ways are there for one service to find another, and how do they differ in operational cost?
    ru: Какими способами один сервис может найти другой и чем эти способы отличаются по стоимости эксплуатации?
  - id: load-balancing-placement
    en: Compare server-side and client-side load balancing. Where does load balancing happen when the transport is a message broker?
    ru: Сравните балансировку на стороне сервера и на стороне клиента. Где происходит балансировка, если транспорт — брокер сообщений?
  - id: policy-library-mesh-gateway
    en: Timeouts, retries and mTLS can live in a client library, a service mesh sidecar, or an API gateway. What are the trade-offs of each?
    ru: Таймауты, повторы и mTLS могут жить в клиентской библиотеке, в sidecar service mesh или на API gateway. В чём компромиссы каждого варианта?
  - id: sync-call-settings
    en: Which settings would you configure on a synchronous HTTP client before releasing it to production, and why each one?
    ru: Какие настройки вы зададите синхронному HTTP-клиенту перед выкатом в прод и зачем каждая из них?
  - id: async-consumer-settings
    en: Which settings matter when configuring a message consumer, and what breaks if you get acknowledgement or offset handling wrong?
    ru: Какие настройки важны при конфигурации потребителя сообщений и что ломается при неверной работе с подтверждениями или смещениями?
  - id: retry-safety
    en: Under what conditions is it safe to retry a failed call, and how can naive retries make an outage worse?
    ru: При каких условиях повторять упавший вызов безопасно и как наивные повторы усугубляют аварию?
  - id: security-and-tracing-propagation
    en: How do you secure service-to-service calls and keep distributed tracing working, including across a message broker?
    ru: Как защитить вызовы между сервисами и сохранить работоспособность распределённой трассировки, в том числе через брокер сообщений?
  - id: spring-client-options
    en: In a Spring application, which options exist for calling another service, and how would you pick between RestClient, WebClient and Feign?
    ru: Какие в Spring-приложении есть варианты вызвать другой сервис и как выбрать между RestClient, WebClient и Feign?
