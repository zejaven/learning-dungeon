id: cors
languages: [en, ru]
title:
  en: 'What Is CORS'
  ru: 'Что такое CORS'
category:
  en: REST / API Design
  ru: REST / Проектирование API
type: HTTP
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: rest
difficulty: 1
catalogId: rest-4
summary:
  en: >
    CORS — Cross-Origin Resource Sharing — is the set of response headers with
    which a server relaxes the browser's same-origin policy. By default a page
    from one origin (scheme + host + port) may send a request to another origin
    but may not read the answer; when the server replies with
    'Access-Control-Allow-Origin' naming that page, the browser hands the
    response over. Anything a plain HTML form could not have sent — a JSON
    Content-Type, a custom header, PUT/PATCH/DELETE — is asked about first in an
    'OPTIONS' preflight. The traps: a blocked response was still delivered and
    executed, so CORS is not server-side authorization; cookies require an exact
    origin plus 'Access-Control-Allow-Credentials' and reject the '*' wildcard;
    and reading a custom response header needs its own
    'Access-Control-Expose-Headers'.
  ru: >
    CORS — Cross-Origin Resource Sharing — это набор заголовков ответа, которыми
    сервер ослабляет правило одного источника в браузере. По умолчанию страница с
    одного origin (схема + хост + порт) может отправить запрос на другой origin,
    но не может прочитать ответ; когда сервер отвечает заголовком
    'Access-Control-Allow-Origin' с этой страницей, браузер отдаёт ответ.
    Про всё, что обычная HTML-форма отправить не смогла бы — Content-Type
    application/json, произвольный заголовок, PUT/PATCH/DELETE, — браузер сначала
    спрашивает предварительным запросом 'OPTIONS'. Ловушки: заблокированный ответ
    всё равно был доставлен и выполнен, поэтому CORS — не серверная авторизация;
    для кук нужен точный origin плюс 'Access-Control-Allow-Credentials', а
    подстановочный '*' запрещён; а чтобы прочитать нестандартный заголовок
    ответа, нужен отдельный 'Access-Control-Expose-Headers'.

# Visual primitives this topic's visualizer composes (frontend).
primitives:
  - BoxGroup

defaultExample: response-is-blocked

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: what-is-an-origin
    title:
      en: What counts as an origin
      ru: Что считается origin
    file: 01-what-is-an-origin.java
    explanation:
      en: >
        Before CORS there is the same-origin policy, and before that there is the
        word "origin": scheme, host and port together. Two pages on the same host
        but different ports are as foreign to each other as two unrelated sites,
        which is why localhost:5173 calling localhost:8080 hits this on day one.
      ru: >
        До CORS есть правило одного источника, а до него — само слово «origin»:
        схема, хост и порт вместе. Две страницы на одном хосте, но на разных
        портах чужие друг другу так же, как два никак не связанных сайта, — потому
        разработчик и натыкается на это в первый же день, когда localhost:5173
        обращается к localhost:8080.
  - id: response-is-blocked
    title:
      en: 'The request goes through anyway'
      ru: 'Запрос всё равно уходит'
    file: 02-response-is-blocked.java
    explanation:
      en: >
        The sentence everyone gets wrong. A form-style POST needs no permission
        up front, so the browser sends it, the handler runs and the order is
        created — and only then does the browser notice there is no
        Access-Control-Allow-Origin and hide the answer. "Blocked by CORS" means
        the reply was withheld from JavaScript, not that the call was stopped.
      ru: >
        Фраза, которую понимают неверно почти все. POST в стиле формы не требует
        разрешения заранее, поэтому браузер его отправляет, обработчик
        отрабатывает, заказ создаётся — и лишь потом браузер замечает, что
        Access-Control-Allow-Origin нет, и прячет ответ. «Заблокировано CORS»
        означает, что ответ не отдали JavaScript, а не что вызов остановили.
  - id: allow-origin
    title:
      en: One header changes the verdict
      ru: Один заголовок меняет вердикт
    file: 03-allow-origin.java
    explanation:
      en: >
        A policy that names the wrong origin is worth exactly as much as no
        policy. Fix the value and the same request becomes readable. Note who is
        speaking: the permission is issued by the server being called, never
        requested by the caller — which is why you cannot "turn CORS off" in your
        own frontend.
      ru: >
        Политика, называющая не тот origin, стоит ровно столько же, сколько
        отсутствие политики. Исправьте значение — и тот же запрос станет
        читаемым. Обратите внимание, кто говорит: разрешение выдаёт вызываемый
        сервер, а не запрашивает вызывающий, — поэтому «выключить CORS» у себя во
        фронтенде нельзя.
  - id: preflight
    title:
      en: 'When one call becomes two'
      ru: 'Когда один вызов превращается в два'
    file: 04-preflight.java
    explanation:
      en: >
        The browser sends an extra OPTIONS request whenever the call is something
        a plain HTML form could not have made: a method outside GET/HEAD/POST, or
        a header outside the safelist — and Content-Type application/json is
        outside it. That is why a GET goes straight out and the JSON POST next to
        it costs two round trips.
      ru: >
        Браузер отправляет дополнительный запрос OPTIONS всякий раз, когда вызов
        такой, какой обычная HTML-форма отправить не смогла бы: метод не из
        GET/HEAD/POST или заголовок не из безопасного списка — а Content-Type
        application/json в него не входит. Поэтому GET уходит сразу, а
        соседний POST с JSON стоит двух обращений по сети.
  - id: preflight-blocked
    title:
      en: 'A preflight that says no'
      ru: 'Предварительный запрос отвечает «нет»'
    file: 05-preflight-blocked.java
    explanation:
      en: >
        The mirror image of the second example. When the OPTIONS answer does not
        list the method or the header, the real request is never sent — nothing
        reaches the handler, nothing is written. Preflight is also where
        Authorization bites: it is a header like any other and has to be listed.
      ru: >
        Зеркальное отражение второго примера. Если в ответе на OPTIONS нет
        нужного метода или заголовка, настоящий запрос вообще не отправляется —
        до обработчика ничего не доходит, ничего не пишется. Здесь же кусается
        Authorization: это такой же заголовок, как остальные, и его надо
        перечислить.
  - id: credentials
    title:
      en: 'Cookies change the rules'
      ru: 'Куки меняют правила'
    file: 06-credentials.java
    explanation:
      en: >
        The wildcard is a promise that any page on the internet may read this,
        and no server can honestly make that promise about a signed-in user's
        data — so the browser refuses the combination outright. Naming the origin
        is still not enough: acting as the logged-in user needs
        Access-Control-Allow-Credentials on top.
      ru: >
        Звёздочка — это обещание, что читать может любая страница в интернете, а
        про данные залогиненного пользователя ни один сервер честно такого
        обещать не может, поэтому браузер отвергает такое сочетание сразу.
        Назвать origin тоже мало: чтобы действовать от имени пользователя, нужен
        ещё и Access-Control-Allow-Credentials.
  - id: expose-headers
    title:
      en: 'The header you cannot read'
      ru: 'Заголовок, который не прочитать'
    file: 07-expose-headers.java
    explanation:
      en: >
        Reading the body and reading a header are two separate permissions.
        Cross-origin JavaScript sees only a short safelist of response headers;
        X-Total-Count, Location or a rate-limit header return null until the
        server lists them in Access-Control-Expose-Headers. The request succeeds,
        so this one is usually diagnosed as a backend bug.
      ru: >
        Читать тело и читать заголовок — два разных разрешения. Кросс-доменному
        JavaScript виден лишь короткий безопасный список заголовков ответа;
        X-Total-Count, Location или заголовок лимита запросов вернут null, пока
        сервер не перечислит их в Access-Control-Expose-Headers. Запрос при этом
        успешен, поэтому такое обычно принимают за баг бэкенда.
  - id: preflight-cache
    title:
      en: 'Paying for the preflight once'
      ru: 'Заплатить за предварительный запрос один раз'
    file: 08-preflight-cache.java
    explanation:
      en: >
        Without Access-Control-Max-Age every JSON call is two round trips, and on
        a chatty screen that doubles the request count. With it the browser
        remembers the answer for this method and header combination and stops
        asking. It is the cheapest CORS-related performance fix there is.
      ru: >
        Без Access-Control-Max-Age каждый вызов с JSON — это два обращения по
        сети, а на «болтливом» экране это удваивает число запросов. С ним браузер
        запоминает ответ для этой комбинации метода и заголовков и перестаёт
        спрашивать. Самое дешёвое, что можно сделать с производительностью CORS.

