summary:
  en: >
    A practical map of monolith variants: unstructured, layered, modular,
    plugin-based, and the distributed monolith trap. Focuses on deployment
    unit, internal boundaries, coupling, database ownership, and how to answer
    the interview question without treating every monolith as legacy code.
  ru: >
    Практичная карта вариантов монолита: неструктурированный, слоистый,
    модульный, plugin-based и ловушка distributed monolith. Фокус на единице
    развертывания, внутренних границах, связанности, владении данными и на том,
    как отвечать на собеседовании без ошибки «любой монолит - это legacy».

