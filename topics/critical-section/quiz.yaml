missions:
  - id: enter-section
    title:
      en: Enter the protected block
      ru: Войди в защищённый блок
    goal:
      en: Run code where a thread enters the critical section and owns the lock.
      ru: Запусти код, где thread входит в критическую секцию и владеет lock.
    event: CRITICAL_SECTION_ENTER
  - id: make-thread-wait
    title:
      en: Make another thread wait
      ru: Заставь другой thread ждать
    goal:
      en: Try to enter the same critical section from a second thread while the first still owns the lock.
      ru: Попробуй войти в ту же критическую секцию из второго thread, пока первый ещё владеет lock.
    event: THREAD_WAITING
  - id: write-shared-value
    title:
      en: Update shared state safely
      ru: Безопасно обнови общее состояние
    goal:
      en: Read and write the shared value while the thread is inside the critical section.
      ru: Прочитай и запиши общее значение, пока thread находится внутри критической секции.
    event: SHARED_WRITE
  - id: show-lost-update
    title:
      en: Show the race
      ru: Покажи race
    goal:
      en: Run an unprotected read-modify-write sequence that produces a lost update.
      ru: Запусти незащищённую последовательность read-modify-write, которая даёт потерянное обновление.
    event: LOST_UPDATE

bossFight:
  - id: definition
    en: What is a critical section?
    ru: Что такое критическая секция?
  - id: why-lock
    en: Why does a critical section need synchronization or a lock?
    ru: Почему критической секции нужна синхронизация или lock?
  - id: shared-mutable-state
    en: How do you decide which code must be inside a critical section?
    ru: Как понять, какой код должен быть внутри критической секции?
  - id: lost-update
    en: Explain a lost update caused by two threads incrementing the same counter.
    ru: Объясни потерянное обновление, когда два threads увеличивают один counter.
  - id: keep-small
    en: Why should critical sections usually be kept short?
    ru: Почему критические секции обычно должны быть короткими?
  - id: same-lock
    en: Why must all threads use the same lock for the same shared data?
    ru: Почему все threads должны использовать один и тот же lock для одних и тех же общих данных?
