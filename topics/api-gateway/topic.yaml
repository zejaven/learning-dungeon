summary:
  en: >
    An API gateway is the single entry point for external traffic into a system
    of many services. It exists because without it every client has to know the
    internal topology, every service has to re-implement authentication, rate
    limiting, TLS and CORS, and a mobile client has to make a dozen round trips
    to render one screen. The gateway routes by API semantics, enforces edge
    policy in one place, translates protocols, can aggregate responses, and
    decouples the public contract from how services are actually split. It
    handles north-south traffic only - internal service-to-service calls bypass
    it, which is why a gateway is not a security boundary on its own and not a
    replacement for a service mesh.
  ru: >
    API gateway - это единая точка входа для внешнего трафика в систему из
    множества сервисов. Он нужен потому, что без него каждый клиент обязан знать
    внутреннюю топологию, каждый сервис заново реализует аутентификацию,
    ограничение частоты запросов, TLS и CORS, а мобильному клиенту приходится
    делать десяток обращений, чтобы отрисовать один экран. Gateway маршрутизирует
    по смыслу API, применяет политику периметра в одном месте, транслирует
    протоколы, может агрегировать ответы и отделяет публичный контракт от того,
    как сервисы разрезаны на самом деле. Он обслуживает только north-south
    трафик - внутренние вызовы между сервисами проходят мимо него, поэтому
    gateway сам по себе не является границей безопасности и не заменяет service
    mesh.

