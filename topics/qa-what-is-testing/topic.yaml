summary:
  en: >
    What software testing actually is: classic definitions from ISTQB, Kulikov,
    Savin, Wikipedia, and James Bach; the popular "expected vs actual behavior"
    formula; the hierarchy of QA, QC, and testing; the difference between
    verification and validation; and the main goals of testing — finding
    defects, confirming compliance with requirements, and building confidence
    in the product.
  ru: >
    Что такое тестирование ПО на самом деле: классические определения от ISTQB,
    Куликова, Савина, Википедии и Джеймса Баха; популярная формула «ожидаемое
    против реального поведения»; иерархия QA, QC и тестирования; разница между
    верификацией и валидацией; основные цели тестирования — поиск дефектов,
    подтверждение соответствия требованиям и уверенность в продукте.

