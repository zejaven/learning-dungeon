summary: >
  Продвинутый блок собеседования по мобильному тестированию: кратко об
  отличиях мобильного тестирования от web и нативных приложений от веба,
  ключевые различия iOS и Android (закрытая система против open-source,
  отсутствие Google-сервисов у Huawei), функции Charles Proxy — map remote,
  map local, rewrite, breakpoint — и их практическое применение (изменить
  конфиг, навесить 500-ю ошибку), специфичные мобильные дефекты и их
  приоритет, выбор версий Android при поддержке «с 8.0», и две ситуационные
  задачи: «Failed to send» при отправке файла в мессенджере и пуши, которые
  приходят на одно устройство и не приходят на другое.

assistantExample: 'например: Как с помощью Charles подменить ответ сервера на 500-ю ошибку для конкретного запроса?'

