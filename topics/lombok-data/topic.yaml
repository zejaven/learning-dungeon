summary:
  en: >
    Lombok's @Data is a shortcut that generates boilerplate for a mutable
    data-holding class at compile time: a getter for every field, a setter for
    every non-final field, plus toString, equals, hashCode and a required-args
    constructor. This topic shows exactly what it expands to, the traps
    (equals/hashCode in collections, mutability, JPA entities) and when to prefer
    a record instead.
  ru: >
    Аннотация @Data от Lombok — это сокращение, которое на этапе компиляции
    генерирует шаблонный код для изменяемого класса-носителя данных: геттер для
    каждого поля, сеттер для каждого не-final поля, а также toString, equals,
    hashCode и конструктор по обязательным полям. В теме разобрано, во что именно
    разворачивается аннотация, какие у неё ловушки (equals/hashCode в коллекциях,
    изменяемость, JPA-сущности) и когда вместо неё лучше взять record.

