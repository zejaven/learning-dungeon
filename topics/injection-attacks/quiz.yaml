# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: turn-data-into-grammar
    title:
      en: Rewrite somebody else's query
      ru: Перепиши чужой запрос
    goal:
      en: Concatenate a value containing a quote and watch the database parse part of it as SQL.
      ru: Склей значение с кавычкой внутри и посмотри, как база разберёт его часть как SQL.
    event: SQL_INJECTED
  - id: bound-and-injected-anyway
    title:
      en: Bind a parameter and get injected anyway
      ru: Привяжи параметр и всё равно получи инъекцию
    goal:
      en: Pass a properly bound value to a procedure that concatenates it into SQL inside the database.
      ru: Передай корректно привязанное значение процедуре, которая склеивает его в SQL внутри базы.
    event: DYNAMIC_SQL_IN_DATABASE
  - id: parse-before-the-value-exists
    title:
      en: Parse the SQL before the value exists
      ru: Разбери SQL до появления значения
    goal:
      en: Send a statement whose text is a constant with a '?' in it, and note when the database parses it.
      ru: Отправь запрос, текст которого — константа с «?», и заметь, когда база его разбирает.
    event: STATEMENT_PREPARED
  - id: send-it-out-of-band
    title:
      en: Send the value beside the query
      ru: Отправь значение рядом с запросом
    goal:
      en: Bind the same payload as a parameter and watch which channel it travels down.
      ru: Привяжи ту же нагрузку параметром и посмотри, по какому каналу она едет.
    event: PARAMETER_BOUND
  - id: payload-stays-a-value
    title:
      en: Make the payload a value again
      ru: Снова сделай нагрузку значением
    goal:
      en: Get an attack string treated as a plain name, and read why it could not become grammar.
      ru: Добейся, чтобы атакующая строка стала обычным именем, и прочитай, почему она не смогла стать грамматикой.
    event: VALUE_STAYED_DATA
  - id: beat-the-escaper
    title:
      en: Escape it and lose anyway
      ru: Экранируй — и всё равно проиграй
    goal:
      en: Switch escaping on, then inject through a numeric column where there is no quote to escape.
      ru: Включи экранирование, а потом внедрись через числовую колонку, где кавычки нет вовсе.
    event: ESCAPING_BYPASSED
  - id: prepared-in-name-only
    title:
      en: Call prepareStatement and stay vulnerable
      ru: Вызови prepareStatement и останься уязвимым
    goal:
      en: Hand a concatenated string to prepareStatement and see how much of the value it binds.
      ru: Передай сконкатенированную строку в prepareStatement и посмотри, какую часть значения он привяжет.
    event: PREPARED_IN_NAME_ONLY
  - id: no-placeholder-for-a-column
    title:
      en: Find what a '?' cannot stand for
      ru: Найди то, что «?» заменить не может
    goal:
      en: Sort by a column name from the request and see why this slot has no placeholder.
      ru: Отсортируй по имени колонки из запроса и увидь, почему у этого места нет плейсхолдера.
    event: IDENTIFIER_INTERPOLATED
  - id: allowlist-the-identifier
    title:
      en: Fix it with an allowlist
      ru: Почини это белым списком
    goal:
      en: Match the requested column against a fixed set, so the SQL is built from a name you wrote.
      ru: Сопоставь запрошенную колонку с фиксированным набором, чтобы SQL собирался из имени, написанного тобой.
    event: ALLOWLIST_CHECKED
  - id: injected-from-your-own-database
    title:
      en: Get injected by your own database
      ru: Получи инъекцию из собственной базы
    goal:
      en: Store a payload with a bind parameter, then concatenate that row into a later query.
      ru: Сохрани нагрузку через привязку параметра, а потом склей эту строку в более поздний запрос.
    event: SECOND_ORDER_INJECTION
  - id: read-a-file-through-xml
    title:
      en: Read a file through an XML upload
      ru: Прочитай файл через загрузку XML
    goal:
      en: Send a document that declares an external entity and see what the parser fetches for it.
      ru: Отправь документ, объявляющий внешнюю сущность, и посмотри, что парсер для него загрузит.
    event: XXE_FILE_DISCLOSED
  - id: shut-the-doctype
    title:
      en: Shut the door on every XXE at once
      ru: Закрой дверь всем XXE разом
    goal:
      en: Disallow DOCTYPE declarations and send the same payload again.
      ru: Запрети объявления DOCTYPE и отправь ту же нагрузку ещё раз.
    event: XXE_BLOCKED

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: what-is-an-injection
    en: What is an injection attack, and what do SQL injection, XXE and command injection have in common?
    ru: Что такое инъекция и что общего у SQL injection, XXE и командной инъекции?
  - id: how-sql-injection-works
    en: 'Walk through a concrete SQL injection: what does the attacker type, what does the database receive, and what does it do differently?'
    ru: 'Разбери конкретный пример SQL injection: что печатает злоумышленник, что получает база и что она делает иначе?'
  - id: what-it-buys-the-attacker
    en: What can an attacker actually achieve through one injectable parameter? Give examples beyond reading extra rows.
    ru: Чего злоумышленник реально может добиться через один уязвимый параметр? Приведи примеры помимо чтения лишних строк.
  - id: why-prepared-statements-work
    en: Why exactly does a PreparedStatement prevent SQL injection? Answer in terms of when the statement is parsed and how the value travels.
    ru: Почему именно PreparedStatement предотвращает SQL injection? Ответь в терминах момента разбора запроса и способа передачи значения.
  - id: binding-is-not-escaping
    en: Is a bind parameter a form of escaping? What is the difference, and why does it matter?
    ru: Является ли привязка параметра разновидностью экранирования? В чём разница и почему это важно?
  - id: when-prepared-does-not-help
    en: Name the cases where a PreparedStatement does NOT prevent SQL injection, and say what you use instead in each.
    ru: Назови случаи, когда PreparedStatement НЕ предотвращает SQL injection, и скажи, что применяется вместо него в каждом.
  - id: dynamic-identifiers
    en: Why can't you bind a table or column name? How do you build a dynamic ORDER BY safely?
    ru: Почему нельзя привязать имя таблицы или колонки? Как безопасно собрать динамический ORDER BY?
  - id: second-order-injection
    en: What is second-order injection, and why does 'the value came from our own database' not make it safe?
    ru: Что такое инъекция второго порядка и почему «значение пришло из нашей же базы» не делает его безопасным?
  - id: dynamic-sql-in-procedures
    en: A parameter is bound correctly and the stored procedure it is passed to still gets injected. How?
    ru: Параметр привязан правильно, а хранимая процедура, которой его передали, всё равно получает инъекцию. Как так?
  - id: escaping-vs-parameters
    en: Why is manually escaping quotes a weaker defence than parameters, even when the escaping itself is correct?
    ru: Почему ручное экранирование кавычек — более слабая защита, чем параметры, даже если само экранирование корректно?
  - id: orm-and-jpa
    en: Does using Hibernate or Spring Data make you immune to SQL injection? Where can it still happen?
    ru: Делает ли использование Hibernate или Spring Data неуязвимым к SQL injection? Где она всё ещё возможна?
  - id: least-privilege
    en: What does the database account the application connects with have to do with the impact of an injection?
    ru: Как учётная запись базы, под которой подключается приложение, влияет на последствия инъекции?
  - id: what-is-xxe
    en: What is XXE? Explain what an external entity is and what the parser does with it.
    ru: Что такое XXE? Объясни, что такое внешняя сущность и что парсер с ней делает.
  - id: xxe-impact
    en: What can XXE lead to besides reading a local file? Cover SSRF and denial of service.
    ru: К чему ещё, кроме чтения локального файла, может привести XXE? Разбери SSRF и отказ в обслуживании.
  - id: fixing-xxe-in-java
    en: How do you fix XXE in a Java application? Name the parser settings and the libraries they apply to.
    ru: Как чинить XXE в Java-приложении? Назови настройки парсера и библиотеки, к которым они относятся.
  - id: where-xml-hides
    en: Which parts of a typical system parse XML without anyone thinking about it? Why does that matter for XXE?
    ru: Какие части типичной системы разбирают XML так, что об этом никто не думает? Почему это важно для XXE?
  - id: input-validation-role
    en: What role does input validation play against injection, and why can it not be the main defence?
    ru: Какую роль играет валидация ввода против инъекций и почему она не может быть основной защитой?
  - id: detecting-injection
    en: How would you find injection vulnerabilities in an existing codebase, and how would you spot exploitation in production?
    ru: Как искать уязвимости к инъекциям в существующем коде и как заметить эксплуатацию в продакшене?
  - id: blind-injection
    en: What is blind SQL injection, and why does an endpoint that returns nothing useful still leak data?
    ru: Что такое слепая SQL injection и почему эндпоинт, не возвращающий ничего полезного, всё равно отдаёт данные?
  - id: injection-family
    en: Beyond SQL and XML, where else does this bug appear? Give examples and the fix for each.
    ru: Где ещё, кроме SQL и XML, встречается эта ошибка? Приведи примеры и способ починки для каждого.
