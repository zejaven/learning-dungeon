summary:
  en: >
    Performance management as the "P" in FCAPS: the bandwidth–throughput–latency
    triad, the four components of latency, jitter and packet loss, the
    Bandwidth-Delay Product, SNMP vs NetFlow/IPFIX monitoring, KPIs and SLAs,
    QoS queuing policies, bufferbloat and AQM, microbursts in 100G links, and
    architecting networks for low latency.
  ru: >
    Управление производительностью как «P» в FCAPS: триада bandwidth–throughput–latency,
    четыре компонента задержки, jitter и потеря пакетов, Bandwidth-Delay Product,
    мониторинг через SNMP и NetFlow/IPFIX, KPI и SLA, политики очередей QoS,
    bufferbloat и AQM, микровсплески в линках 100G и проектирование сетей
    с низкой задержкой.

