summary:
  en: >
    The everyday toolbox of a mobile QA engineer: mobile analytics services
    (Firebase, Flurry, AppsFlyer, MixPanel), traffic sniffers (Charles,
    Fiddler, Proxyman, mitmproxy) for inspecting requests, ways to read
    iOS/Android/backend logs (Android Studio, Xcode, Crashlytics, Sentry,
    Kibana), post-release health checks via crash rate and monitoring,
    choosing test devices from country statistics, semantic versioning
    (major.minor.patch), geolocation testing, multi-country apps with
    locales and payment acquirers, and the difference between iOS and iPadOS.
  ru: >
    Повседневный набор инструментов мобильного тестировщика: сервисы
    мобильной аналитики (Firebase, Flurry, AppsFlyer, MixPanel), снифферы
    трафика (Charles, Fiddler, Proxyman, mitmproxy) для просмотра запросов,
    способы смотреть логи iOS/Android/backend (Android Studio, Xcode,
    Crashlytics, Sentry, Kibana), проверка здоровья приложения после релиза
    по крашрейту и мониторингам, выбор устройств по статистике страны,
    семантическое версионирование (major.minor.patch), тестирование
    геолокации, приложения в нескольких странах с локалями и эквайерами,
    а также отличие iOS от iPadOS.

assistantExample:
  en: 'e.g. How would you inspect the network requests that a mobile app sends from a real device?'
  ru: 'например: Как посмотреть сетевые запросы, которые мобильное приложение отправляет с реального устройства?'

