id: arraylist-naive-growth-complexity
languages: [en, ru]
title:
  en: Naive ArrayList Growth Complexity
  ru: Сложность наивного роста ArrayList
category:
  en: Java Core / Collections
  ru: Java Core / Коллекции
type: DATA_STRUCTURE
mode: trace
aiProvider: codex
aiModel: gpt-5.5
summary:
  en: >
    Why a grow-by-one ArrayList design makes adding N elements O(N^2): every
    append allocates a new array, copies all previous references, and only then
    writes the new value.
  ru: >
    Почему дизайн ArrayList с ростом на одну ячейку делает добавление N
    элементов O(N^2): каждое добавление выделяет новый массив, копирует все
    предыдущие ссылки и только потом записывает новое значение.
categoryId: java-collections
difficulty: 2
catalogId: java-collections-11
style: Real world

primitives:
  - ArrayGrid
  - EventLog

defaultExample: four-appends

examples:
  - id: first-append
    title:
      en: First append
      ru: Первое добавление
    file: 01-first-append.java
    explanation:
      en: >
        The first add allocates a one-slot array and copies zero old references.
      ru: >
        Первое add выделяет массив на одну ячейку и копирует ноль старых ссылок.
  - id: second-append
    title:
      en: Second append copies one
      ru: Второе добавление копирует одну ссылку
    file: 02-second-append.java
    explanation:
      en: >
        The second add must allocate a two-slot array and copy the previous
        element before writing the new one.
      ru: >
        Второе add должно выделить массив на две ячейки и скопировать предыдущий
        элемент перед записью нового.
  - id: four-appends
    title:
      en: Four appends
      ru: Четыре добавления
    file: 03-four-appends.java
    explanation:
      en: >
        Four appends copy 0 + 1 + 2 + 3 = 6 old references, showing the
        triangular-number pattern.
      ru: >
        Четыре добавления копируют 0 + 1 + 2 + 3 = 6 старых ссылок и показывают
        закономерность треугольного числа.
  - id: ten-appends
    title:
      en: Ten appends
      ru: Десять добавлений
    file: 04-ten-appends.java
    explanation:
      en: >
        Ten appends copy 45 old references, so the total work grows much faster
        than the element count.
      ru: >
        Десять добавлений копируют 45 старых ссылок, поэтому общая работа растёт
        намного быстрее числа элементов.

assistantExample:
  en: "e.g. If ArrayList copied into a new array on every add, why would adding N elements be O(N^2)?"
  ru: "например: Если бы ArrayList копировал элементы в новый массив при каждом add, почему добавление N элементов стоило бы O(N^2)?"

missionsFile: quiz.yaml
