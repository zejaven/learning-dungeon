# Theory topic: no missions, only a Boss Fight.
bossFight:
  - id: hibernate-vs-manual-mapping
    en: 'How is Hibernate different from manual JDBC or RowMapper-style mapping?'
    ru: 'Чем Hibernate отличается от ручного маппинга через JDBC или RowMapper?'
  - id: jpa-vs-hibernate
    en: 'What is the difference between JPA and Hibernate?'
    ru: 'В чём разница между JPA и Hibernate?'
  - id: persistence-context
    en: 'What is the Persistence Context, and why is it more than a simple cache?'
    ru: 'Что такое Persistence Context и почему это больше, чем простой кэш?'
  - id: dirty-checking-flush
    en: 'How do dirty checking and flush turn object changes into SQL?'
    ru: 'Как dirty checking и flush превращают изменения объектов в SQL?'
  - id: lazy-loading-proxies
    en: 'How do lazy loading and proxies work in Hibernate, and where can they fail?'
    ru: 'Как в Hibernate работают lazy loading и proxies и где они могут сломаться?'
  - id: beyond-mapping-features
    en: 'What features does Hibernate provide besides field-to-column mapping?'
    ru: 'Какие возможности Hibernate даёт кроме маппинга полей на колонки?'
  - id: production-risks
    en: 'What Hibernate problems should you watch for in production?'
    ru: 'За какими проблемами Hibernate нужно следить в production?'
