summary:
  en: >
    Is recursion or a plain loop better? Neither wins universally — it is a
    trade-off. A loop reuses one stack frame, runs with no call overhead and
    never overflows the stack, so it suits flat, sequential work. Recursion is
    clearer for self-similar problems (trees, parsing, divide and conquer) but
    every call adds a stack frame, and Java has no tail-call optimization, so
    deep recursion risks StackOverflowError. Any recursion can be rewritten as a
    loop.
  ru: >
    Что лучше — рекурсия или обычный цикл? Универсального победителя нет, это
    компромисс. Цикл переиспользует один кадр стека, работает без накладных
    расходов на вызовы и никогда не переполняет стек, поэтому подходит для
    плоской, последовательной работы. Рекурсия яснее для самоподобных задач
    (деревья, разбор, «разделяй и властвуй»), но каждый вызов добавляет кадр
    стека, а в Java нет оптимизации хвостовых вызовов, поэтому глубокая рекурсия
    рискует StackOverflowError. Любую рекурсию можно переписать циклом.

