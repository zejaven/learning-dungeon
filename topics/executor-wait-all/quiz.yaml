missions:
  - id: create-limited-executor
    title:
      en: Create a fixed executor
      ru: Создай fixed executor
    goal:
      en: Create an executor with a limited number of reusable workers.
      ru: Создай executor с ограниченным числом переиспользуемых workers.
    event: LIMITED_EXECUTOR_CREATED
  - id: queue-extra-work
    title:
      en: Queue extra work
      ru: Поставь лишнюю работу в очередь
    goal:
      en: Submit more tasks than available workers so one task waits in the queue.
      ru: Отправь больше задач, чем есть свободных workers, чтобы одна задача ждала в очереди.
    event: TASK_QUEUED
  - id: make-main-await-latch
    title:
      en: Make main await a latch
      ru: Заставь main ждать latch
    goal:
      en: Call await() while the CountDownLatch count is still above zero.
      ru: Вызови await(), пока счетчик CountDownLatch еще больше нуля.
    event: MAIN_AWAITING_LATCH
  - id: count-down-from-task
    title:
      en: Count down from a task
      ru: Уменьши счетчик из задачи
    goal:
      en: Let a completed task call countDown() on the latch.
      ru: Дай завершенной задаче вызвать countDown() у latch.
    event: LATCH_COUNTED_DOWN
  - id: use-invoke-all
    title:
      en: Wait with invokeAll
      ru: Дождись через invokeAll
    goal:
      en: Use invokeAll so main continues only after every Callable-style task is done.
      ru: Используй invokeAll, чтобы main продолжил только после завершения всех Callable-style задач.
    event: INVOKE_ALL_COMPLETED
  - id: collect-future-result
    title:
      en: Collect a Future result
      ru: Забери результат Future
    goal:
      en: Call Future.get() after the task is done and receive its result.
      ru: Вызови Future.get() после завершения задачи и получи ее результат.
    event: FUTURE_GET_RETURNED
  - id: shutdown-executor
    title:
      en: Shut down the executor
      ru: Останови executor
    goal:
      en: Call shutdown() after accepted work is complete.
      ru: Вызови shutdown() после завершения принятой работы.
    event: EXECUTOR_SHUTDOWN

bossFight:
  - id: fixed-pool-wait-all
    en: How would you run 100 independent tasks on a pool of 10 threads and wait until all of them finish?
    ru: Как запустить 100 независимых задач на pool из 10 потоков и дождаться завершения всех?
  - id: latch-vs-invokeall
    en: When would you choose CountDownLatch instead of invokeAll?
    ru: Когда ты выберешь CountDownLatch вместо invokeAll?
  - id: future-get-blocking
    en: What exactly does Future.get() do if the task has not completed yet?
    ru: Что именно делает Future.get(), если задача еще не завершилась?
  - id: submit-first-then-wait
    en: Why should you usually submit the whole batch before calling Future.get() on individual tasks?
    ru: Почему обычно стоит сначала отправить всю пачку, а уже потом вызывать Future.get() у отдельных задач?
  - id: latch-finally
    en: Why should countDown() usually be placed in a finally block?
    ru: Почему countDown() обычно нужно помещать в блок finally?
  - id: invokeall-failures
    en: How do task failures show up when you use invokeAll?
    ru: Как проявляются ошибки задач при использовании invokeAll?
  - id: timeout-and-cancel
    en: How would you add a timeout or cancellation to this waiting strategy?
    ru: Как добавить timeout или отмену в такую стратегию ожидания?
  - id: shutdown-purpose
    en: Why is shutdown() still needed after main has waited for all tasks?
    ru: Почему shutdown() все равно нужен после того, как main дождался всех задач?
