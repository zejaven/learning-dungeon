bossFight:
  # Variables, constants, data types
  - id: variable-vs-constant
    en: 'What is a variable and how does it differ from a constant? Show how you would declare both in C#.'
    ru: 'Что такое переменная и чем она отличается от константы? Покажите, как объявить и то, и другое в C#.'
  - id: csharp-data-types
    en: 'Name the basic C# data types. What is the difference between float and double, and what does var actually do?'
    ru: 'Назовите основные типы данных C#. В чём разница между float и double и что на самом деле делает var?'
  - id: json-data-types
    en: 'How are different data types expressed in JSON? Why is "42" not the same as 42?'
    ru: 'Как выделяются разные типы данных в JSON? Почему "42" — это не то же самое, что 42?'
  # Loops and algorithms
  - id: for-vs-while
    en: 'What is a loop? When would you choose for and when while? What happens if the while condition never becomes false?'
    ru: 'Что такое цикл? Когда вы выберете for, а когда while? Что произойдёт, если условие while никогда не станет ложным?'
  - id: algorithm-parts
    en: 'What is an algorithm and what parts can it consist of? How does this map onto the structure of an automated test?'
    ru: 'Что такое алгоритм и из каких частей он может состоять? Как это ложится на структуру автотеста?'
  # Git and CI/CD
  - id: git-clone-push
    en: 'Which Git command copies a repository to your machine, and which one uploads your code to the server? What is a branch?'
    ru: 'Какой командой в Git скопировать репозиторий себе, а какой залить код на сервер? Что такое ветка?'
  - id: git-flow-model
    en: 'Describe the Git Flow branching model: which branches exist, what are their roles, and why should QA care about them?'
    ru: 'Опишите модель ветвления Git Flow: какие ветки есть, каковы их роли и почему это важно для QA?'
  - id: ci-cd-meaning
    en: 'What are CI and CD, and what problem does Continuous Integration solve? Where do automated tests fit into the pipeline?'
    ru: 'Что такое CI и CD и какую проблему решает Continuous Integration? Где в пайплайне место автотестам?'
  # Interfaces and tools
  - id: gui-vs-cli
    en: 'What interfaces do you know? Compare GUI and CLI and give examples of when a QA engineer needs the command line.'
    ru: 'Какие интерфейсы вы знаете? Сравните GUI и CLI и приведите примеры, когда QA-инженеру нужна командная строка.'
  - id: sniffer-vs-devtools
    en: 'What is a sniffer and how does it differ from browser DevTools? When is DevTools not enough?'
    ru: 'Что такое сниффер и чем он отличается от DevTools в браузере? В каких случаях DevTools недостаточно?'
  # Patterns
  - id: patterns-and-antipatterns
    en: 'What is a design pattern and what is an anti-pattern? Give examples of each, including one pattern useful in test automation.'
    ru: 'Что такое паттерн проектирования и что такое антипаттерн? Приведите примеры каждого, включая паттерн, полезный в автоматизации тестирования.'
