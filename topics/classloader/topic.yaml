id: classloader
title:
  en: ClassLoaders and Their Types
  ru: ClassLoader и их виды
category:
  en: Java Core / JVM
  ru: Java Core / JVM
type: JVM_MEMORY
aiProvider: claude
aiModel: claude-opus-4-8
categoryId: java-core
difficulty: 2
catalogId: java-core-17
style: Real world
summary:
  en: >
    What a ClassLoader is, the built-in hierarchy (Bootstrap, Platform,
    Application), how the parent-delegation model works, why each class is loaded
    once per loader, when ClassNotFoundException happens, and what custom loaders
    are for.
  ru: >
    Что такое ClassLoader, встроенная иерархия (Bootstrap, Platform, Application),
    как работает модель делегирования родителю, почему класс загружается один раз
    на загрузчик, когда возникает ClassNotFoundException и зачем нужны
    пользовательские загрузчики.

# Visual primitives this topic's visualizer composes (frontend).
primitives:
  - ArrayGrid
  - LinkedNodes
  - EventLog

defaultExample: standard-hierarchy

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: standard-hierarchy
    title:
      en: Built-in hierarchy
      ru: Встроенная иерархия
    file: 01-standard-hierarchy.java
    explanation:
      en: >
        Build Bootstrap -> Platform -> Application and load a core class. The
        request starts at the Application loader but is delegated up; Bootstrap
        owns java.* classes and defines it.
      ru: >
        Строим Bootstrap -> Platform -> Application и загружаем системный класс.
        Запрос стартует в Application, но делегируется наверх; java.* принадлежит
        Bootstrap, он и определяет класс.
  - id: delegate-up
    title:
      en: Delegate up the chain
      ru: Делегирование наверх
    file: 02-delegate-up.java
    explanation:
      en: >
        An application class still delegates up first. Bootstrap and Platform
        fail to find it, so the Application loader defines it. Parents get the
        first chance, always.
      ru: >
        Прикладной класс всё равно сначала делегируется наверх. Bootstrap и
        Platform его не находят, поэтому класс определяет Application. Родитель
        всегда получает первый шанс.
  - id: cache-hit
    title:
      en: Load once, then cache
      ru: Загрузка один раз, потом кэш
    file: 03-cache-hit.java
    explanation:
      en: >
        The same class is requested twice. The second time it is already in the
        loader's cache and is returned without reloading — a class is loaded once
        per loader.
      ru: >
        Один и тот же класс запрашивается дважды. Во второй раз он уже в кэше
        загрузчика и возвращается без перезагрузки — класс грузится один раз на
        загрузчик.
  - id: not-found
    title:
      en: ClassNotFoundException
      ru: ClassNotFoundException
    file: 04-not-found.java
    explanation:
      en: >
        No loader knows this class. The request bubbles all the way up to
        Bootstrap, returns empty, and ends in ClassNotFoundException.
      ru: >
        Класс не знает ни один загрузчик. Запрос поднимается до самого Bootstrap,
        возвращается пустым и заканчивается ClassNotFoundException.
  - id: custom-loader
    title:
      en: Custom loader
      ru: Пользовательский загрузчик
    file: 05-custom-loader.java
    explanation:
      en: >
        A custom loader at the bottom of the chain delegates up first and only
        defines the plugin class when no ancestor can. This is how app servers
        and plugin systems isolate code.
      ru: >
        Пользовательский загрузчик внизу цепочки сначала делегирует наверх и
        определяет класс плагина, только если предок не смог. Так серверы
        приложений и плагины изолируют код.

