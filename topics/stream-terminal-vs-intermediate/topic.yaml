id: stream-terminal-vs-intermediate
languages: [en, ru]
title:
  en: Terminal vs Intermediate Stream Operations
  ru: Терминальные и промежуточные операции Stream
category:
  en: Java Core / Streams
  ru: Java Core / Стримы
type: OTHER
aiProvider: claude
aiModel: claude-opus-4-8
categoryId: streams
difficulty: 2
catalogId: streams-3
style: Real world
summary:
  en: >
    How a Stream pipeline splits into intermediate (pipeline) operations that are
    lazy and return a new Stream, and a single terminal operation that triggers
    execution, produces a non-stream result, and consumes the stream. Covers
    laziness, element-by-element processing, short-circuiting, and single use.
  ru: >
    Как конвейер Stream делится на промежуточные (конвейерные) операции, которые
    ленивы и возвращают новый Stream, и одну терминальную операцию, которая
    запускает выполнение, выдаёт не-стримовый результат и потребляет стрим.
    Разбираем ленивость, поэлементную обработку, замыкание и одноразовость.

primitives:
  - ArrayGrid

defaultExample: pipeline-vs-terminal

examples:
  - id: pipeline-vs-terminal
    title:
      en: Pipeline vs terminal
      ru: Конвейер и терминал
    file: 01-pipeline-vs-terminal.java
    explanation:
      en: >
        filter and map are intermediate operations that just build the pipeline;
        collect is the terminal that runs it and returns a List.
      ru: >
        filter и map — промежуточные операции, которые лишь строят конвейер;
        collect — терминал, который его запускает и возвращает List.
  - id: laziness
    title:
      en: Laziness (no terminal)
      ru: Ленивость (без терминала)
    file: 02-laziness.java
    explanation:
      en: >
        Building a pipeline without a terminal runs nothing: peek never fires and
        no element ever enters the pipeline.
      ru: >
        Построение конвейера без терминала ничего не выполняет: peek не срабатывает
        и ни один элемент не входит в конвейер.
  - id: element-by-element
    title:
      en: Element by element
      ru: Поэлементно
    file: 03-element-by-element.java
    explanation:
      en: >
        A stream is processed vertically: one element travels through the whole
        pipeline before the next one starts, so stages run interleaved.
      ru: >
        Стрим обрабатывается вертикально: один элемент проходит весь конвейер до
        того, как начнётся следующий, поэтому стадии чередуются.
  - id: short-circuit
    title:
      en: Short-circuit (findFirst)
      ru: Замыкание (findFirst)
    file: 04-short-circuit.java
    explanation:
      en: >
        findFirst is a short-circuiting terminal: it stops as soon as one element
        passes, so later elements are never read.
      ru: >
        findFirst — замыкающий терминал: останавливается, как только проходит один
        элемент, поэтому последующие элементы не читаются.
  - id: limit-short-circuit
    title:
      en: Short-circuit (limit)
      ru: Замыкание (limit)
    file: 05-limit-short-circuit.java
    explanation:
      en: >
        limit is a short-circuiting intermediate: still lazy, but once it has
        passed enough elements it stops the pipeline early.
      ru: >
        limit — замыкающая промежуточная операция: всё ещё ленивая, но, пропустив
        достаточно элементов, она досрочно останавливает конвейер.
  - id: terminal-single-result
    title:
      en: Single result + consumed
      ru: Один результат + потреблён
    file: 06-terminal-single-result.java
    explanation:
      en: >
        reduce is a terminal that returns one non-stream value and consumes the
        stream; reusing the same stream afterwards throws IllegalStateException.
      ru: >
        reduce — терминал, возвращающий одно не-стримовое значение и потребляющий
        стрим; повторное использование бросит IllegalStateException.

assistantExample:
  en: "e.g. How do you tell an intermediate operation from a terminal one?"
  ru: "например: Как отличить промежуточную операцию от терминальной?"

