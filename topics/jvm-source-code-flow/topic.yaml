id: jvm-source-code-flow
title:
  en: How Java Source Code Becomes Running Code
  ru: Как Java source code становится работающей программой
category:
  en: Java Core / JVM
  ru: Java Core / JVM
type: JVM_MEMORY
mode: trace
aiProvider: codex
aiModel: gpt-5.5
categoryId: java-core
difficulty: 2
catalogId: java-core-18
style: Real world
summary:
  en: >
    What actually happens between a .java file and a running Java program:
    javac compiles source into bytecode, the JVM loads and verifies .class files,
    initializes classes, interprets bytecode, and uses JIT compilation for hot
    methods.
  ru: >
    Что происходит между файлом .java и работающей Java-программой:
    javac компилирует source в bytecode, JVM загружает и проверяет .class файлы,
    инициализирует классы, интерпретирует bytecode и использует JIT compilation
    для hot methods.

primitives:
  - ArrayGrid
  - LinkedNodes

defaultExample: source-to-bytecode

examples:
  - id: source-to-bytecode
    title:
      en: Source becomes bytecode
      ru: Source становится bytecode
    file: 01-source-to-bytecode.java
    explanation:
      en: >
        Shows the common trap: the JVM does not execute .java source directly.
        javac must first produce a .class file with bytecode.
      ru: >
        Показывает частую ловушку: JVM не выполняет .java source напрямую.
        Сначала javac должен создать .class файл с bytecode.
  - id: load-and-verify
    title:
      en: Load and verify
      ru: Загрузка и проверка
    file: 02-load-and-verify.java
    explanation:
      en: >
        ClassLoader brings .class bytes into the JVM, then the verifier checks
        that the bytecode is structurally safe before execution.
      ru: >
        ClassLoader передает .class байты внутрь JVM, а затем verifier проверяет,
        что bytecode структурно безопасен перед выполнением.
  - id: first-run
    title:
      en: First execution
      ru: Первый запуск
    file: 03-first-run.java
    explanation:
      en: >
        After verification, the class is initialized and the interpreter starts
        executing bytecode instructions for main().
      ru: >
        После проверки класс инициализируется, и interpreter начинает выполнять
        bytecode инструкции метода main().
  - id: hot-method-jit
    title:
      en: Hot method and JIT
      ru: Hot method и JIT
    file: 04-hot-method-jit.java
    explanation:
      en: >
        A frequently called method becomes hot, so the JIT compiler turns it into
        native machine code stored in the Code Cache.
      ru: >
        Часто вызываемый метод становится hot, поэтому JIT compiler превращает
        его в native machine code, сохраненный в Code Cache.
  - id: runtime-areas
    title:
      en: Runtime areas
      ru: Runtime области
    file: 05-runtime-areas.java
    explanation:
      en: >
        Connects execution with memory areas: metadata lives in Metaspace, method
        calls use stack frames, objects go to the heap, and JIT code goes to the
        Code Cache.
      ru: >
        Связывает выполнение с областями памяти: metadata хранится в Metaspace,
        вызовы методов используют stack frames, объекты попадают в heap, а JIT
        code идет в Code Cache.

assistantExample:
  en: "e.g. Does the JVM execute Java source code directly, or does javac run first?"
  ru: "например: JVM выполняет Java source code напрямую или сначала запускается javac?"

