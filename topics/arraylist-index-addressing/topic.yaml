id: arraylist-index-addressing
title:
  en: How an ArrayList Index Finds Its Object
  ru: Как индекс ArrayList находит свой объект
category:
  en: Java Core / Collections
  ru: Java Core / Коллекции
type: DATA_STRUCTURE
aiProvider: claude
aiModel: claude-opus-4-8
categoryId: java-collections
difficulty: 2
catalogId: java-collections-10
style: Real world
summary:
  en: >
    How the JVM maps an ArrayList index to a concrete object: the backing
    Object[] is one contiguous block of equal-width reference slots, so get(i)
    is a bounds check plus a single address computation (base + header + i *
    scale) and a dereference — never a scan. That is why indexed access is O(1).
  ru: >
    Как JVM сопоставляет индекс ArrayList с конкретным объектом: внутренний
    Object[] — это один непрерывный блок ссылочных ячеек одинаковой ширины,
    поэтому get(i) — это проверка границ плюс одно вычисление адреса (base +
    header + i * scale) и разыменование, без перебора. Поэтому доступ по
    индексу — O(1).

