missions:
  - id: pass-lambda
    title:
      en: Pass a lambda
      ru: Передай lambda
    goal:
      en: Run an example where a lambda expression is passed into a method parameter.
      ru: Запусти пример, где lambda expression передается в параметр метода.
    event: LAMBDA_PASSED
  - id: invoke-lambda
    title:
      en: Invoke the callback
      ru: Вызови callback
    goal:
      en: Make the receiving method call the functional interface method.
      ru: Сделай так, чтобы принимающий метод вызвал метод functional interface.
    event: LAMBDA_INVOKED
  - id: capture-effectively-final
    title:
      en: Capture a local
      ru: Захвати локальную переменную
    goal:
      en: Use a final or effectively final local variable from inside the lambda.
      ru: Используй final или effectively final локальную переменную внутри lambda.
    event: LAMBDA_CAPTURED_VALUE
  - id: send-argument
    title:
      en: Send an argument
      ru: Передай аргумент
    goal:
      en: Run a Consumer or Function example where the method passes a value into the lambda.
      ru: Запусти пример с Consumer или Function, где метод передает значение в lambda.
    event: LAMBDA_ARGUMENT_SENT
  - id: return-value
    title:
      en: Return a value
      ru: Верни значение
    goal:
      en: Run a Supplier or Function example where the lambda returns a value to the method.
      ru: Запусти пример с Supplier или Function, где lambda возвращает значение методу.
    event: LAMBDA_RETURNED_VALUE
bossFight:
  - id: parameter-type
    en: 'Can a Java method accept `() -> System.out.println("Hello")` directly? What must the parameter type be?'
    ru: 'Может ли Java-метод принять `() -> System.out.println("Hello")` напрямую? Каким должен быть тип параметра?'
  - id: write-runnable-method
    en: 'Write the method signature for `doSomeLogic(() -> System.out.println("Hello"))`.'
    ru: 'Напиши сигнатуру метода для `doSomeLogic(() -> System.out.println("Hello"))`.'
  - id: functional-interface-rule
    en: Why must the target type be a functional interface?
    ru: Почему целевой тип должен быть functional interface?
  - id: execution-timing
    en: 'When does the lambda body run: when it is passed or when the method invokes it?'
    ru: 'Когда выполняется тело lambda: при передаче или когда метод ее вызывает?'
  - id: captured-locals
    en: Which local variables can a lambda capture?
    ru: Какие локальные переменные может захватывать lambda?
  - id: standard-functional-interfaces
    en: When would you choose Runnable, Supplier, Consumer, or Function for a method parameter?
    ru: Когда выбрать Runnable, Supplier, Consumer или Function для параметра метода?
