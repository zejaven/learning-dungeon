kind: practice
order: 1
title:
  en: |-
    Sorted, almost always
  ru: |-
    Отсортировано почти всегда
statement:
  en: |-
    A report sorts accounts with the two comparators below. They pass code review and work on all the test data. On production data the report sometimes shows accounts in the wrong order, and `TimSort` once failed with `Comparison method violates its general contract!`.

    Fix `BY_BALANCE` and `BY_OPENED_AT` so they order accounts correctly for any possible `int` balance and any possible `long` timestamp.
  ru: |-
    Отчёт сортирует счета двумя компараторами ниже. Они прошли код-ревью и работают на всех тестовых данных. На реальных данных отчёт иногда показывает счета в неверном порядке, а `TimSort` однажды упал с ошибкой `Comparison method violates its general contract!`.

    Почини `BY_BALANCE` и `BY_OPENED_AT`, чтобы они верно упорядочивали счета при любом балансе типа `int` и любом времени типа `long`.
hints:
  - en: |-
      Only the sign of the result matters. Try to find two `int` values whose difference does not fit in an `int`.
    ru: |-
      Важен только знак результата. Попробуй найти два значения `int`, разность которых не помещается в `int`.
  - en: |-
      `Integer.MIN_VALUE - 1` wraps around to a positive number. And in `BY_OPENED_AT` the cast keeps only the low 32 bits, so a difference of exactly 2^32 ms becomes 0.
    ru: |-
      `Integer.MIN_VALUE - 1` переполняется и становится положительным. А в `BY_OPENED_AT` приведение оставляет только младшие 32 бита, поэтому разность ровно в 2^32 мс превращается в 0.
  - en: |-
      Do not compute a difference at all: compare the values. `Integer` and `Long` have static methods for exactly this. `Integer.signum(a - b)` keeps the overflow, it only hides it.
    ru: |-
      Не вычисляй разность вообще: сравнивай значения. У `Integer` и `Long` есть для этого статические методы. `Integer.signum(a - b)` сохраняет переполнение и только прячет его.
debrief:
  en: |-
    Subtraction looks like a shortcut because `compare()` only needs a sign, but the difference of two `int`s needs 33 bits. On overflow the sign flips, and the comparator stops being transitive. That is what `TimSort` detects, and only sometimes.

    The `long` version fails in a second way: the cast drops the high bits, so accounts opened about 49.7 days apart can compare as equal or reversed.

    `Integer.compare` and `Long.compare` compare without subtracting. `Comparator.comparingInt` and `comparingLong` use them, so they are the shorter safe spelling.
  ru: |-
    Вычитание кажется удобным, потому что `compare()` нужен только знак, но для разности двух `int` требуется 33 бита. При переполнении знак меняется, и компаратор перестаёт быть транзитивным. Именно это и замечает `TimSort`, причём не всегда.

    Вариант с `long` ломается ещё и иначе: приведение отбрасывает старшие биты, поэтому счета, открытые с разницей примерно в 49,7 дня, могут оказаться равными или перепутанными.

    `Integer.compare` и `Long.compare` сравнивают без вычитания. На них построены `Comparator.comparingInt` и `comparingLong`, это более короткая безопасная запись.
