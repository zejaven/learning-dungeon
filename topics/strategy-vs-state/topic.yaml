categoryId: design-patterns
difficulty: 3
catalogId: design-patterns-9
style: Real world
summary:
  en: >
    Strategy and State share almost the same UML — a context that delegates to an
    object behind an interface — yet they solve different problems. Strategy makes
    a family of algorithms interchangeable, chosen from outside and usually fixed
    for the object's life. State models a finite state machine: the object's
    behaviour changes as its internal state changes, and the states drive the
    transitions themselves. This topic pins down the difference by intent,
    transitions, and who is in charge of switching.
  ru: >
    Strategy и State имеют почти одинаковую UML-структуру — контекст делегирует
    объекту за интерфейсом, — но решают разные задачи. Strategy делает семейство
    алгоритмов взаимозаменяемыми; их выбирают снаружи, и обычно они фиксированы на
    время жизни объекта. State моделирует конечный автомат: поведение объекта
    меняется при смене его внутреннего состояния, и сами состояния управляют
    переходами. Эта тема разбирает разницу по замыслу, переходам и тому, кто
    управляет переключением.

assistantExample:
