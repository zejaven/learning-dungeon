# Theory topic: no missions (there is no practice editor) - only a Boss Fight.
bossFight:
  - id: define-clustered
    en: What is a clustered index, and where is the actual row data stored?
    ru: Что такое кластерный индекс и где хранятся сами данные строки?
  - id: define-nonclustered
    en: What is a non-clustered index, and what does its leaf level contain?
    ru: Что такое некластерный индекс и что содержится на уровне его листьев?
  - id: one-clustered-many-nonclustered
    en: Why can a table have at most one clustered index but many non-clustered ones?
    ru: Почему у таблицы может быть не более одного кластерного индекса, но много некластерных?
  - id: second-hop
    en: Why does a non-clustered index lookup often need a second hop, and what is a covering index?
    ru: Почему поиску по некластерному индексу часто нужен второй прыжок и что такое covering index?
  - id: engine-differences
    en: How do InnoDB and PostgreSQL differ in how they store tables and non-clustered index pointers?
    ru: Чем InnoDB и PostgreSQL отличаются в хранении таблиц и указателей некластерных индексов?
  - id: clustered-key-choice
    en: Why does the choice of clustered key (sequential vs random) affect insert performance and fragmentation?
    ru: Почему выбор кластерного ключа (последовательный или случайный) влияет на скорость вставки и фрагментацию?
  - id: range-scan
    en: Why are range scans and ordered reads typically faster on a clustered index key?
    ru: Почему диапазонные сканирования и упорядоченное чтение обычно быстрее по ключу кластерного индекса?
