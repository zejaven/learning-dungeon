# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: define-solid
    en: What does SOLID stand for, and what problem does it solve in OOP design?
    ru: Что означает SOLID и какую проблему он решает в OOP-проектировании?
  - id: srp-boundary
    en: How do you decide whether a class has one responsibility or too many?
    ru: Как понять, что у класса одна ответственность, а не слишком много?
  - id: ocp-extension
    en: Explain the Open/Closed Principle with a Java example.
    ru: Объясните Open/Closed Principle на Java-примере.
  - id: lsp-contract
    en: What is a Liskov Substitution Principle violation, and why is it dangerous?
    ru: Что такое нарушение Liskov Substitution Principle и чем оно опасно?
  - id: isp-fat-interface
    en: Why are fat interfaces a problem, and how does ISP help?
    ru: Почему толстые интерфейсы проблемны и как помогает ISP?
  - id: dip-abstractions
    en: How is the Dependency Inversion Principle related to Dependency Injection?
    ru: Как Dependency Inversion Principle связан с Dependency Injection?
  - id: solid-tradeoffs
    en: When can applying SOLID too aggressively make code worse?
    ru: Когда слишком активное применение SOLID может ухудшить код?
