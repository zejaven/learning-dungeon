# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: throw
    title:
      en: Throw an exception
      ru: Брось исключение
    goal:
      en: Run an example that throws an exception and watch the JVM start looking for a catch.
      ru: Запусти пример, который бросает исключение, и посмотри, как JVM начинает искать catch.
    event: THROW
  - id: propagate
    title:
      en: Unwind the stack
      ru: Раскрути стек
    goal:
      en: Make an exception travel up at least one frame that does not catch it.
      ru: Сделай так, чтобы исключение поднялось хотя бы на один фрейм, который его не ловит.
    event: PROPAGATE
  - id: catch
    title:
      en: Catch it
      ru: Поймай его
    goal:
      en: Let a matching catch block handle the exception so propagation stops.
      ru: Дай подходящему блоку catch обработать исключение, чтобы распространение прекратилось.
    event: CATCH
  - id: finally
    title:
      en: Run a finally block
      ru: Выполни блок finally
    goal:
      en: Trigger a finally block that runs while the exception unwinds the stack.
      ru: Запусти блок finally, который выполняется при раскрутке стека.
    event: FINALLY
  - id: uncaught
    title:
      en: Leave it uncaught
      ru: Оставь без обработки
    goal:
      en: Throw an exception that nobody catches, so it terminates the thread.
      ru: Брось исключение, которое никто не ловит, чтобы оно завершило поток.
    event: UNCAUGHT

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: hierarchy
    en: How is the Java exception hierarchy structured (Throwable, Error, Exception, RuntimeException)?
    ru: Как устроена иерархия исключений в Java (Throwable, Error, Exception, RuntimeException)?
  - id: checked-vs-unchecked
    en: What is the difference between checked and unchecked exceptions, and when would you use each?
    ru: В чём разница между проверяемыми и непроверяемыми исключениями и когда применять каждый вид?
  - id: error-vs-exception
    en: What is the difference between an Error and an Exception, and should you catch Errors?
    ru: В чём разница между Error и Exception и стоит ли ловить Error?
  - id: propagation
    en: What happens to the call stack when an exception is thrown and not caught immediately?
    ru: Что происходит со стеком вызовов, когда исключение брошено и не поймано сразу?
  - id: finally-semantics
    en: When does a finally block run, and can it run even when the exception is not caught in that method?
    ru: Когда выполняется блок finally и может ли он выполниться, даже если исключение не поймано в этом методе?
  - id: throw-vs-throws
    en: What is the difference between throw and throws?
    ru: В чём разница между throw и throws?
