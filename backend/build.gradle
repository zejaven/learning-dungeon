plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.interviewlearning'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.yaml:snakeyaml:2.2'
    // Static analysis of structural (design-pattern) topics: parse user .java
    // sources into a class-relationship graph.
    implementation 'com.github.javaparser:javaparser-core:3.26.2'
    // Disposable in-memory database for SQL topics: each query runs against a
    // fresh H2 (PostgreSQL mode), isolated from the app's real Postgres.
    implementation 'com.h2database:h2:2.3.232'
    // visual-runtime is also needed as a built jar on the *sandbox* classpath
    // (see RunnerProperties / JavaCodeRunner). The project dependency makes
    // Gradle build it before the backend runs.
    implementation project(':visual-runtime')

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // TopicExamplesTest compiles and runs each topic's examples against the
    // visual-runtime jar, so make sure it is built first.
    dependsOn ':visual-runtime:jar'
}

// Bundle the production frontend bundle into the jar under static/, so a
// packaged run is self-contained for the UI and does not need frontend/dist on
// disk. build-app.ps1 runs `npm run build` before bootJar, so the folder
// exists; if it is missing this simply contributes nothing.
bootJar {
    from("${rootProject.projectDir}/frontend/dist") {
        into 'static'
    }
}

// Run the backend from the repository root so that relative paths to topics/
// and the visual-runtime jar resolve consistently in dev.
bootRun {
    workingDir = rootProject.projectDir
    // Allow passing a question/prompt etc. through if ever needed.
    systemProperty 'app.repo-root', rootProject.projectDir.absolutePath
}
