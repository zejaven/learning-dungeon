  ru: Чем scrum отличается от kanban и когда команде лучше выбрать kanban вместо спринтов?
- id: tester-place-in-scrum
  ru: Где место тестировщика в scrum-команде? Что такое definition of done и почему тестирование должно происходить внутри спринта, а не после него?
