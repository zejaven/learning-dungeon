primitives:
  - BoxGroup

defaultExample: simple-vs-preflighted

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: simple-vs-preflighted
    title:
      en: 'What a form could have sent'
      ru: 'Что могла бы отправить форма'
    file: 01-simple-vs-preflighted.java
    explanation:
      en: >
        The whole rule in one run. A GET and a form-encoded POST are requests
        the web already allowed cross-origin before fetch() existed, so asking
        permission for them would break existing sites — they go straight out.
        Switch the same POST to a JSON body and the browser suddenly has to ask.
        Nothing about the endpoint changed; only the Content-Type value did.
      ru: >
        Всё правило за один запуск. GET и POST в кодировке формы — это запросы,
        которые веб разрешал кросс-доменно ещё до появления fetch(), поэтому
        спрашивать про них разрешение значило бы сломать существующие сайты: они
        уходят сразу. Поменяйте у того же POST тело на JSON — и браузеру внезапно
        приходится спрашивать. В самом эндпоинте ничего не изменилось, изменилось
        только значение Content-Type.
  - id: what-triggers-a-preflight
    title:
      en: 'The three triggers'
      ru: 'Три причины'
    file: 02-what-triggers-a-preflight.java
    explanation:
      en: >
        Only three things force a preflight, and any one of them is enough: a
        method outside GET/HEAD/POST, a header outside the safelist, or a
        Content-Type whose value is outside the three a form can produce. The
        second one surprises people most — adding a tracing header to a plain
        read turns that read into two network round trips.
      ru: >
        Предварительный запрос вызывают всего три вещи, и достаточно любой одной:
        метод не из GET/HEAD/POST, заголовок не из безопасного списка или
        Content-Type со значением не из трёх, которые может выдать форма. Вторая
        удивляет сильнее всего: добавьте заголовок трассировки к обычному чтению —
        и это чтение превратится в два обращения по сети.
  - id: the-options-exchange
    title:
      en: 'The exchange itself'
      ru: 'Сам обмен'
    file: 03-the-options-exchange.java
    explanation:
      en: >
        What the two requests actually contain. The browser asks with Origin,
        Access-Control-Request-Method and Access-Control-Request-Headers — header
        names only, never their values — and the server answers 204 with the
        matching Allow headers. The preflight carries no body, no cookies and no
        Authorization header, which is exactly why it cannot be authenticated.
      ru: >
        Что на самом деле лежит в этих двух запросах. Браузер спрашивает с
        помощью Origin, Access-Control-Request-Method и
        Access-Control-Request-Headers — только имена заголовков, никогда их
        значения, — а сервер отвечает 204 с соответствующими заголовками Allow. В
        предварительном запросе нет тела, нет кук и нет заголовка Authorization —
        именно поэтому его нельзя аутентифицировать.
  - id: denied-nothing-runs
    title:
      en: 'A no means nothing runs'
      ru: 'Отказ означает, что ничего не выполнится'
    file: 04-denied-nothing-runs.java
    explanation:
      en: >
        The asymmetry worth naming in an interview. When the OPTIONS answer does
        not list the method or the header, the real request is never sent: no
        handler runs, nothing is written, and the access log contains only the
        OPTIONS line. A blocked simple request is the opposite — it was already
        delivered and executed before the browser blocked reading the reply.
      ru: >
        Асимметрия, которую стоит назвать на собеседовании. Если в ответе на
        OPTIONS нет нужного метода или заголовка, настоящий запрос не
        отправляется: ни один обработчик не выполняется, ничего не пишется, а в
        логе доступа есть только строка про OPTIONS. С заблокированным простым
        запросом всё наоборот — он был доставлен и выполнен ещё до того, как
        браузер запретил читать ответ.
  - id: the-401-on-options
    title:
      en: 'The 401 that looks like CORS'
      ru: 'Ошибка 401, похожая на CORS'
    file: 05-the-401-on-options.java
    explanation:
      en: >
        The most expensive hour in this topic. The CORS configuration is
        correct, but a security filter authenticates every request and answers
        the preflight with 401 — which the preflight can never satisfy, because
        it carries no credentials by design. The browser reports a CORS error, so
        people go and edit the CORS configuration that was never wrong.
      ru: >
        Самый дорогой час в этой теме. Настройки CORS верны, но фильтр
        безопасности аутентифицирует каждый запрос и отвечает на предварительный
        кодом 401 — а удовлетворить его тот не может, потому что по своей природе
        не несёт учётных данных. Браузер показывает ошибку CORS, и человек идёт
        править конфигурацию CORS, которая и не была сломана.
  - id: wildcards-have-limits
    title:
      en: 'Where the wildcard stops'
      ru: 'Где заканчивается звёздочка'
    file: 06-wildcards-have-limits.java
    explanation:
      en: >
        Access-Control-Allow-Headers - * has two written-down holes. It never
        covers Authorization, which must always be named explicitly; and for a
        call that carries cookies the asterisk stops being a wildcard at all and
        is compared literally. Both produce a denial that reads like the server
        allows everything, which is why they cost so much debugging time.
      ru: >
        У Access-Control-Allow-Headers - * есть две прямо описанные дыры. Он
        никогда не покрывает Authorization — этот заголовок всегда нужно называть
        явно; а для вызова с куками звёздочка вообще перестаёт быть подстановочным
        знаком и сравнивается буквально. И то, и другое даёт отказ при настройках,
        которые выглядят как «разрешено всё», — потому на них и уходит столько
        времени.
  - id: the-preflight-cache
    title:
      en: 'Paying once instead of always'
      ru: 'Заплатить один раз, а не всегда'
    file: 07-the-preflight-cache.java
    explanation:
      en: >
        Access-Control-Max-Age is what keeps a chatty screen from doubling its
        request count. Watch what the entry is keyed by, though: path, method,
        header set and credentials mode. A REST API where every resource has its
        own path gets far fewer cache hits than the header suggests.
      ru: >
        Access-Control-Max-Age — то, что не даёт «болтливому» экрану удвоить число
        запросов. Но посмотрите, по чему строится ключ записи: путь, метод, набор
        заголовков и режим кук. У REST API, где у каждого ресурса свой путь,
        попаданий в кеш будет заметно меньше, чем кажется по заголовку.
  - id: expiry-and-cost
    title:
      en: 'Expiry, caps and round trips'
      ru: 'Истечение, потолки и обращения по сети'
    file: 08-expiry-and-cost.java
    explanation:
      en: >
        A remembered permission is only good until its Max-Age runs out, and
        asking for a day does not get you a day — browsers cap what they will
        keep (about two hours in Chromium, twenty-four in Firefox). The audit
        line at the end is the number that matters in production: round trips,
        not requests.
      ru: >
        Запомненное разрешение действует лишь до конца своего Max-Age, и попросить
        сутки не значит их получить — браузеры ограничивают срок хранения (около
        двух часов в Chromium, суток в Firefox). Итоговая строка аудита — это и
        есть число, которое важно в продакшене: обращения по сети, а не запросы.

