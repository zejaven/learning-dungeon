# Missions complete when a run emits the matching trace event.
missions:
  - id: store-reference
    title:
      en: Store a reference
      ru: Сохрани ссылку
    goal:
      en: Run an example that stores an object's reference into a backing-array slot.
      ru: Запусти пример, который сохраняет ссылку на объект в ячейку внутреннего массива.
    event: ARRAY_STORE_REF
  - id: address-calc
    title:
      en: Turn an index into an address
      ru: Преврати индекс в адрес
    goal:
      en: Call get(i) and watch the JVM compute base + header + i * scale instead of scanning.
      ru: Вызови get(i) и посмотри, как JVM вычисляет base + header + i * scale, а не перебирает элементы.
    event: ARRAY_ADDRESS_CALC
  - id: read-reference
    title:
      en: Follow the reference
      ru: Перейди по ссылке
    goal:
      en: After the address is computed, read the reference in that slot and follow it to the object.
      ru: После вычисления адреса прочитай ссылку в ячейке и перейди по ней к объекту.
    event: ARRAY_READ_REF
  - id: out-of-bounds
    title:
      en: Fail a bounds check
      ru: Провали проверку границ
    goal:
      en: Call get(i) with an index outside [0, size) and see it throw before any address is computed.
      ru: Вызови get(i) с индексом вне [0, size) и посмотри, как он бросает исключение до вычисления адреса.
    event: ARRAY_OUT_OF_BOUNDS

bossFight:
  - id: index-to-object
    en: How does the JVM know which object a given ArrayList index refers to?
    ru: Как JVM понимает, на какой объект ссылается данный индекс ArrayList?
  - id: why-o-one
    en: Why is get(i) on an ArrayList O(1), independent of the index and the list size?
    ru: Почему get(i) у ArrayList — O(1), независимо от индекса и размера списка?
  - id: reference-vs-object
    en: Does a backing-array slot hold the object itself or just a reference? Why does that matter?
    ru: Ячейка внутреннего массива хранит сам объект или только ссылку? Почему это важно?
  - id: equal-width
    en: Why must every slot be the same width for index-to-address arithmetic to work?
    ru: Почему все ячейки должны быть одинаковой ширины, чтобы работала арифметика индекс-в-адрес?
  - id: bounds-check
    en: What does the bounds check do, and what happens if the index is out of range?
    ru: Что делает проверка границ и что происходит, если индекс вне диапазона?
  - id: vs-linkedlist
    en: Why can't a LinkedList resolve an index by arithmetic the way an array can?
    ru: Почему LinkedList не может вычислить индекс арифметикой, как массив?
