summary:
  en: >
    A coding challenge: implement a FIFO queue using only two stack-like
    containers. The key idea is to push new values onto an input stack and move
    them to an output stack only when the output stack is empty, which makes
    enqueue O(1), dequeue worst-case O(n), and dequeue amortized O(1).
  ru: >
    Кодовая задача: реализуй FIFO queue, используя только две stack-подобные
    емкости. Ключевая идея: добавлять новые значения в input stack и переносить
    их в output stack только когда output stack пуст, поэтому enqueue имеет O(1),
    dequeue имеет худший случай O(n), а амортизированно dequeue работает за O(1).

