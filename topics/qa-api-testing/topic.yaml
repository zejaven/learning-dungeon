summary:
  en: >
    The core of API testing interviews: client-server architecture and what an
    API actually is, the four basic HTTP methods and what each one does, the
    2xx/3xx/4xx/5xx status code families with examples, GET vs POST and query
    string parameters, the classic "wrong password" 401 case, XML vs JSON,
    REST vs SOAP and WSDL, HTTP authentication schemes, sync vs async calls,
    why APIs are tested separately from the UI, and the tools testers use
    (Postman and friends).
  ru: >
    Ядро собеседований по тестированию API: клиент-серверная архитектура и
    что такое API своими словами, четыре базовых HTTP-метода и назначение
    каждого, группы статус-кодов 2xx/3xx/4xx/5xx с примерами, различия GET и
    POST и параметры в query string, классический кейс с 401 на неверный
    пароль, XML vs JSON, REST vs SOAP и WSDL, способы аутентификации через
    HTTP, синхронность и асинхронность, зачем тестировать API отдельно от UI
    и какие инструменты для этого используют (Postman и другие).

assistantExample:
  en: 'e.g. You enter an incorrect login and password — what status code will the server return?'
  ru: 'например: Вы вводите некорректные логин и пароль — какой статус-код вернёт сервер?'

