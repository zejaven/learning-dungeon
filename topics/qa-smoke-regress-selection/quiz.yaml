bossFight:
- id: smoke-vs-regression-difference
  ru: Чем smoke-тестирование отличается от регрессионного по цели, объёму и моменту запуска?
  en: Чем smoke-тестирование отличается от регрессионного по цели, объёму и моменту запуска?
- id: smoke-selection-criteria
  ru: По каким критериям вы отбираете кейсы в smoke-набор? Какие свойства должен иметь хороший smoke-набор?
  en: По каким критериям вы отбираете кейсы в smoke-набор? Какие свойства должен иметь хороший smoke-набор?
- id: regression-selection-criteria
  ru: По каким критериям вы отбираете кейсы в регрессионный набор? Какую роль играют покрытие изменённых модулей, история дефектов и риски?
  en: По каким критериям вы отбираете кейсы в регрессионный набор? Какую роль играют покрытие изменённых модулей, история дефектов и риски?
- id: regression-suite-maintenance
  ru: Регрессионный набор разросся и прогоняется слишком долго. Как вы решите, что оставить, а что убрать или автоматизировать?
  en: Регрессионный набор разросся и прогоняется слишком долго. Как вы решите, что оставить, а что убрать или автоматизировать?
- id: hotfix-smoke-enough
  ru: При выкатке хотфикса достаточно ли smoke-тестирования или нужен регресс? От чего это зависит и какой минимум вы бы прогнали?
  en: При выкатке хотфикса достаточно ли smoke-тестирования или нужен регресс? От чего это зависит и какой минимум вы бы прогнали?
- id: automation-vs-manual
  ru: Когда выбирать автоматизированное тестирование, а когда — ручное? Приведите примеры проверок, которые вы принципиально оставите ручными.
  en: Когда выбирать автоматизированное тестирование, а когда — ручное? Приведите примеры проверок, которые вы принципиально оставите ручными.
