bossFight:
  # I. Methodology and Strategic Philosophy
  - id: why-before-how
    en: 'Why is requirement analysis described as the most critical phase of network design, and what are the consequences of a technically flawless architecture that fails to align with business needs?'
    ru: 'Почему анализ требований называют самой критичной фазой проектирования сети и каковы последствия технически безупречной архитектуры, не согласованной с потребностями бизнеса?'
  - id: top-down-vs-bottom-up
    en: 'Contrast the Top-Down methodology (focusing on applications first) with the "Bottom-Up" approach. Why might "Bottom-Up" design lead to expensive "gold-plating" or performance bottlenecks?'
    ru: 'Сопоставьте методологию Top-Down (сначала приложения) с подходом «Bottom-Up». Почему дизайн «Bottom-Up» может привести к дорогому «gold-plating» или узким местам производительности?'
  - id: iterative-spiral-cycle
    en: 'Why is requirement analysis not a "one-time event," and how does the process of "spiralling downward" help refine a design from high-level goals to technical specs?'
    ru: 'Почему анализ требований — не «разовое событие» и как процесс «спирального погружения» помогает уточнять дизайн от высокоуровневых целей до технических спецификаций?'
  - id: hierarchy-of-needs
    en: 'In the Hierarchy of Needs for network design, why must connectivity and integrity be established before focusing on service delivery or autonomy?'
    ru: 'Почему в иерархии потребностей проектирования сети связность и целостность должны быть обеспечены раньше, чем доставка сервисов или автономия?'
  # II. Business Goals, Constraints, and Politics
  - id: core-business-drivers
    en: 'How do primary objectives—like increasing revenue or expanding into new markets—dictate the fundamental technical choices a designer must make?'
    ru: 'Как основные цели — например, рост выручки или выход на новые рынки — диктуют фундаментальные технические решения проектировщика?'
  - id: industry-compliance-standards
    en: 'Why do specific industries (e.g., healthcare or finance) have "default" requirements, and how do standards like HIPAA or PCI-DSS drive the design process?'
    ru: 'Почему у отдельных отраслей (например, здравоохранения или финансов) есть требования «по умолчанию» и как стандарты вроде HIPAA или PCI-DSS направляют процесс проектирования?'
  - id: eighth-layer-politics
    en: 'Discuss the impact of workplace politics on a project. How do "technological religions" or "turf wars" influence which vendors or protocols are ultimately selected?'
    ru: 'Обсудите влияние офисной политики на проект. Как «технологические религии» или «войны за территорию» влияют на итоговый выбор вендоров или протоколов?'
  - id: staffing-constraints
    en: 'Beyond budget (CapEx/OpEx), how does the existing staffing expertise act as a constraint when recommending complex protocols like OSPF?'
    ru: 'Помимо бюджета (CapEx/OpEx), как существующая экспертиза персонала становится ограничением при рекомендации сложных протоколов вроде OSPF?'
  # III. Application Profiling and Performance Metrics
  - id: criticality-ranking
    en: 'Why is it necessary to rank applications on a scale from 1 (Extremely Critical) to 3 (Not Critical) during the analysis phase?'
    ru: 'Почему на этапе анализа необходимо ранжировать приложения по шкале от 1 (крайне критично) до 3 (некритично)?'
  - id: application-categorisation
    en: 'Contrast the needs of Real-Time/Interactive apps (like VoIP) with Transaction/Bulk Data apps. How do their requirements for jitter versus bandwidth differ?'
    ru: 'Сопоставьте потребности Real-Time/интерактивных приложений (например, VoIP) и транзакционных/Bulk Data приложений. Чем различаются их требования к jitter и полосе?'
  - id: real-time-thresholds
    en: 'Discuss the specific metrics required for real-time applications: why are targets like one-way latency < 150 ms and packet loss < 1% considered the gold standard?'
    ru: 'Обсудите конкретные метрики для приложений реального времени: почему целевые значения вроде односторонней задержки < 150 мс и потерь пакетов < 1% считаются золотым стандартом?'
  - id: user-vs-system-apps
    en: 'Why is it important to profile "System Apps" like DNS, 802.1X, and SNMP separately from end-user applications like CRM or E-commerce?'
    ru: 'Почему важно профилировать «системные приложения» вроде DNS, 802.1X и SNMP отдельно от пользовательских приложений вроде CRM или E-commerce?'
  # IV. Scalability, Availability, and Security
  - id: growth-horizons
    en: 'Why is it a standard practice to design for a 3-to-5-year growth horizon, and how does Scaling Out (horizontal) differ from Scaling Up (vertical)?'
    ru: 'Почему стандартная практика — проектировать под горизонт роста 3–5 лет и чем Scaling Out (горизонтальное) отличается от Scaling Up (вертикальное)?'
  - id: five-nines-challenge
    en: 'What does achieving 99.999% availability mean for a network''s annual downtime, and how is it mathematically calculated using MTBF and MTTR?'
    ru: 'Что означает достижение доступности 99,999% для годового простоя сети и как она математически рассчитывается через MTBF и MTTR?'
  - id: zero-trust-architecture
    en: 'How does the shift to Zero Trust change requirement analysis regarding micro-segmentation and identity-based access?'
    ru: 'Как переход к Zero Trust меняет анализ требований в части микросегментации и доступа на основе идентичности?'
  - id: device-density-ratio
    en: 'Why has the modern baseline shifted to a 3:1 device-to-user ratio, and how does this impact the analysis of concurrent user peaks?'
    ru: 'Почему современная базовая норма сместилась к соотношению устройств к пользователю 3:1 и как это влияет на анализ пиков одновременных пользователей?'
  # V. Analytical Tools and Project Finalisation
  - id: qualitative-vs-quantitative
    en: 'Compare the value of stakeholder interviews (executive vision vs. admin pain points) with quantitative data from tools like NetFlow or SNMP.'
    ru: 'Сравните ценность интервью со стейкхолдерами (видение руководителей против болевых точек администраторов) с количественными данными инструментов вроде NetFlow или SNMP.'
  - id: dpi-role
    en: 'How can Deep Packet Inspection (DPI) help a designer determine if a performance issue is network-based or application-based before proposing an upgrade?'
    ru: 'Как Deep Packet Inspection (DPI) помогает проектировщику определить, где источник проблемы производительности — в сети или в приложении, до предложения апгрейда?'
  - id: trade-off-matrix
    en: 'Discuss the Principles of Conflict. Why does increasing redundancy often decrease a system''s "KISS" (simplicity) and usability?'
    ru: 'Обсудите принципы конфликта. Почему увеличение избыточности часто снижает «KISS» (простоту) и удобство системы?'
  - id: requirements-spec-document
    en: 'Why is this document considered the "source of truth" for the project, and why must stakeholders sign off on it before logical design begins?'
    ru: 'Почему документ спецификации требований считается «источником истины» проекта и почему стейкхолдеры должны подписать его до начала логического дизайна?'
