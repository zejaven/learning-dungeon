# Theory topic: no missions (there is no practice editor) - only a Boss Fight.
bossFight:
  - id: first-fields-to-check
    en: Which table fields do you inspect first when reviewing a database query?
    ru: На какие поля таблиц ты смотришь в первую очередь при разборе запроса к базе данных?
  - id: where-join-priority
    en: Why are WHERE and JOIN columns usually more important than random selected columns?
    ru: Почему колонки из WHERE и JOIN обычно важнее случайных колонок из SELECT?
  - id: sort-group-fields
    en: How do ORDER BY and GROUP BY columns affect the useful shape of an index?
    ru: Как колонки из ORDER BY и GROUP BY влияют на полезную форму индекса?
  - id: selected-columns
    en: Why can the SELECT list still matter for query performance?
    ru: Почему список колонок в SELECT все равно может влиять на производительность запроса?
  - id: selectivity-nullability
    en: Why should you care about selectivity, cardinality, and NULL values in queried fields?
    ru: Почему важны селективность, кардинальность и NULL в полях, по которым строится запрос?
  - id: index-tradeoff
    en: Why is it a bad idea to index every column that appears in a query?
    ru: Почему плохая идея индексировать каждую колонку, которая встречается в запросе?
