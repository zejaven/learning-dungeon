id: chain-of-responsibility
title:
  en: Chain of Responsibility
  ru: Цепочка обязанностей
category:
  en: Design Patterns / Behavioral
  ru: Паттерны проектирования / Поведенческие
type: DESIGN_PATTERN
summary:
  en: >
    A behavioral pattern that decouples the sender of a request from its
    receiver. The request travels along a linked chain of handlers; each handler
    in turn either handles it or passes it to the next. Here the chain is an
    approval/escalation chain: a handler approves a request within its limit,
    otherwise it escalates. Order matters, and a request that no handler can
    process falls off the end unhandled.
  ru: >
    Поведенческий паттерн, который развязывает отправителя запроса и его
    получателя. Запрос идёт по связанной цепочке обработчиков; каждый по очереди
    либо обрабатывает его, либо передаёт следующему. Здесь цепочка — это цепочка
    согласования/эскалации: обработчик одобряет запрос в пределах своего лимита,
    иначе эскалирует дальше. Порядок важен, а запрос, который никто не может
    обработать, выпадает из конца цепочки необработанным.

# Visual primitives this topic's visualizer composes (frontend).
primitives:
  - LinkedNodes
  - EventLog

defaultExample: basic

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: basic
    title:
      en: First capable handler wins
      ru: Обрабатывает первый способный
    file: 01-basic.java
    explanation:
      en: >
        The request is small enough for the first handler (TeamLead), so it
        approves it and the chain stops immediately — later handlers are never
        even asked.
      ru: >
        Запрос достаточно мал для первого обработчика (TeamLead), поэтому он
        одобряет его и цепочка сразу останавливается — следующих обработчиков
        даже не спрашивают.
  - id: escalation
    title:
      en: Escalate down the chain
      ru: Эскалация по цепочке
    file: 02-escalation.java
    explanation:
      en: >
        A larger request is passed by TeamLead and Manager and finally approved
        by Director. The sender never had to know who the right handler was.
      ru: >
        Более крупный запрос пропускают TeamLead и Manager, и в итоге его
        одобряет Director. Отправителю не нужно было знать, кто нужный обработчик.
  - id: unhandled
    title:
      en: Nobody can handle it
      ru: Никто не может обработать
    file: 03-unhandled.java
    explanation:
      en: >
        A request over every limit walks the whole chain and falls off the end
        unhandled (handle() returns null). That is why production chains usually
        end with a default/catch-all tail handler.
      ru: >
        Запрос сверх всех лимитов проходит всю цепочку и выпадает из конца
        необработанным (handle() возвращает null). Поэтому боевые цепочки обычно
        заканчиваются обработчиком по умолчанию.
  - id: order-matters
    title:
      en: Order matters (trap)
      ru: Порядок важен (ловушка)
    file: 04-order-matters.java
    explanation:
      en: >
        A broad CEO handler placed first approves everything, making every later
        handler dead code. Put specific handlers before broad ones.
      ru: >
        Широкий обработчик CEO, поставленный первым, одобряет всё, превращая
        остальные обработчики в мёртвый код. Ставьте специфичные обработчики
        перед широкими.
  - id: extend-chain
    title:
      en: Extend without touching the sender
      ru: Расширение без правки отправителя
    file: 05-extend-chain.java
    explanation:
      en: >
        A request that was unhandled becomes handled after a new handler is
        linked to the tail — the request-sending code never changes. This is the
        pattern's open/closed payoff.
      ru: >
        Необработанный запрос становится обработанным после добавления нового
        обработчика в хвост — код отправки запроса не меняется. В этом выгода
        паттерна по принципу open/closed.

missionsFile: quiz.yaml
