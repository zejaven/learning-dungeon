bossFight:
  - id: what-is-api
    en: 'In your own words, what is an API, and how does client-server architecture work in a typical web application?'
    ru: 'Своими словами, что такое API и как устроена клиент-серверная архитектура типичного веб-приложения?'
  - id: why-test-api-separately
    en: 'Why test the API separately if you can test everything through the UI? Name at least three reasons.'
    ru: 'Зачем тестировать API отдельно, если можно тестировать сразу через UI? Назовите минимум три причины.'
  - id: http-methods-four
    en: 'Which HTTP methods do you know? Describe the purpose of the four basic ones. What is idempotency and which methods are idempotent?'
    ru: 'Какие методы HTTP вы знаете? Расскажите о назначении четырёх базовых. Что такое идемпотентность и какие методы идемпотентны?'
  - id: status-code-groups
    en: 'What HTTP status code groups exist and what does each mean? Give two example codes per group.'
    ru: 'Какие группы HTTP статус-кодов существуют и что каждая значит? Приведите по два примера кодов на группу.'
  - id: wrong-password-401
    en: 'You enter an incorrect login and password, and the server returns an error. What status code will it be? How is 401 different from 403 and 400?'
    ru: 'Вы вводите некорректные логин и пароль, и сервер отдаёт ошибку. Какой будет статус-код? Чем 401 отличается от 403 и 400?'
  - id: get-vs-post
    en: 'What are the differences between GET and POST? Can you pass parameters in a GET request, and why should credentials never be sent that way?'
    ru: 'В чём различия GET и POST? Можно ли передавать параметры в GET-запросе и почему так нельзя отправлять учётные данные?'
  - id: rest-vs-soap-wsdl
    en: 'How do REST and SOAP differ? What is WSDL and what is it used for?'
    ru: 'В чём различия REST и SOAP? Что такое WSDL и для чего он используется?'
  - id: auth-and-sync-async
    en: 'Which HTTP authentication methods do you know? And what is the difference between synchronous and asynchronous calls — how does it affect testing?'
    ru: 'Какие способы аутентификации через HTTP вы знаете? И в чём разница между синхронными и асинхронными вызовами — как это влияет на тестирование?'
