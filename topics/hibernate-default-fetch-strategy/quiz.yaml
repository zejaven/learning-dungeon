# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: default-fetch-per-cardinality
    en: What is the default fetch strategy for loading entities in JPA/Hibernate, and what does it depend on?
    ru: Какова стратегия загрузки сущностей по умолчанию в JPA/Hibernate и от чего она зависит?
  - id: to-one-vs-to-many
    en: Why is @ManyToOne EAGER by default but @OneToMany LAZY?
    ru: Почему @ManyToOne по умолчанию EAGER, а @OneToMany — LAZY?
  - id: how-lazy-works
    en: How does LAZY loading actually work under the hood?
    ru: Как на самом деле работает ленивая (LAZY) загрузка под капотом?
  - id: lazy-init-exception
    en: What causes a LazyInitializationException and how do you avoid it?
    ru: Из-за чего возникает LazyInitializationException и как его избежать?
  - id: n-plus-one
    en: How can the default EAGER fetch on a @ManyToOne lead to the N+1 problem?
    ru: Как EAGER по умолчанию для @ManyToOne может привести к проблеме N+1?
  - id: override-default
    en: How do you override the default fetch strategy, and what is the recommended practice?
    ru: Как переопределить стратегию загрузки по умолчанию и какая практика рекомендуется?
