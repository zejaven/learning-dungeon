# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: lock-a-local
    title:
      en: Lock a local variable
      ru: Заблокируй локальную переменную
    goal:
      en: Declare a final local variable and watch its binding lock immediately.
      ru: Объяви final-локальную переменную и увидь, как её связь сразу блокируется.
    event: FINAL_LOCAL
  - id: hit-the-wall
    title:
      en: Hit the final wall
      ru: Упрись в стену final
    goal:
      en: Try to reassign a final variable and see the compiler reject it.
      ru: Попробуй переприсвоить final-переменную и увидь, как компилятор это отклоняет.
    event: FINAL_BLOCK
  - id: blank-then-assign
    title:
      en: Assign a blank final
      ru: Присвой пустое final-поле
    goal:
      en: Declare a blank final field, then assign it exactly once in the constructor.
      ru: Объяви пустое final-поле и присвой его ровно один раз в конструкторе.
    event: FINAL_ASSIGN
  - id: mutate-behind-final
    title:
      en: Mutate behind a final reference
      ru: Измени объект за final-ссылкой
    goal:
      en: Mutate the object behind a final reference and see the binding stay put.
      ru: Измени объект за final-ссылкой и увидь, что связь остаётся на месте.
    event: FINAL_MUTATE
  - id: make-a-constant
    title:
      en: Make a constant
      ru: Создай константу
    goal:
      en: Declare a static final constant shared by the whole class.
      ru: Объяви константу static final, общую для всего класса.
    event: FINAL_STATIC
  - id: final-parameter
    title:
      en: Lock a parameter
      ru: Заблокируй параметр
    goal:
      en: Declare a final method parameter that cannot be reassigned in the body.
      ru: Объяви final-параметр метода, который нельзя переприсвоить в теле.
    event: FINAL_PARAM
  - id: seal-a-method
    title:
      en: Seal a method
      ru: Запечатай метод
    goal:
      en: Declare a final method that subclasses cannot override.
      ru: Объяви final-метод, который подклассы не могут переопределить.
    event: FINAL_METHOD
  - id: seal-a-class
    title:
      en: Seal a class
      ru: Запечатай класс
    goal:
      en: Declare a final class that cannot be subclassed.
      ru: Объяви final-класс, который нельзя наследовать.
    event: FINAL_CLASS

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: what-is-final
    en: What does the final keyword mean, and in which contexts can it appear?
    ru: Что означает ключевое слово final и в каких контекстах оно может встречаться?
  - id: final-reference-vs-object
    en: If a reference variable is final, can you still change the object it points to? Explain the difference.
    ru: Если ссылочная переменная объявлена final, можно ли изменить объект, на который она указывает? Объясни разницу.
  - id: blank-final
    en: What is a blank final field, and when must it be assigned?
    ru: Что такое пустое (blank) final-поле и когда оно должно быть присвоено?
  - id: final-vs-immutable
    en: Does final make an object immutable? How would you make a class truly immutable?
    ru: Делает ли final объект неизменяемым? Как сделать класс по-настоящему immutable?
  - id: static-final-constant
    en: What is the difference between a final field and a static final constant?
    ru: В чём разница между final-полем и константой static final?
  - id: final-method-class
    en: What do final on a method and final on a class each prevent? Give an example of a final class in the JDK.
    ru: Что именно запрещают final на методе и final на классе? Приведи пример final-класса в JDK.
  - id: effectively-final
    en: What does 'effectively final' mean, and why do lambdas and anonymous classes require it?
    ru: Что означает «effectively final» и почему лямбды и анонимные классы этого требуют?
