# Theory topic: no missions, only Boss Fight questions.
bossFight:
  - id: starter-web-purpose
    en: 'What is spring-boot-starter-web, and which main pieces does it bring to a servlet Spring Boot application?'
    ru: 'Что такое spring-boot-starter-web и какие основные части он добавляет в servlet-приложение Spring Boot?'
  - id: starter-vs-autoconfiguration
    en: 'What is the difference between a Spring Boot starter and Spring Boot auto-configuration?'
    ru: 'В чем разница между Spring Boot starter и Spring Boot auto-configuration?'
  - id: web-autoconfiguration-conditions
    en: 'How does Spring Boot decide that web auto-configuration should create MVC beans?'
    ru: 'Как Spring Boot решает, что web auto-configuration должна создать MVC beans?'
  - id: custom-starter-modules
    en: 'Which modules would you create for a custom starter, and what belongs in each one?'
    ru: 'Какие modules вы бы создали для custom starter и что должно находиться в каждом из них?'
  - id: boot3-registration
    en: 'Where is a custom auto-configuration class registered in Spring Boot 3?'
    ru: 'Где регистрируется custom auto-configuration class в Spring Boot 3?'
  - id: user-overrides
    en: 'How can a custom starter provide defaults without preventing the application from overriding them?'
    ru: 'Как custom starter может предоставить defaults и при этом не мешать приложению переопределять их?'
  - id: starter-production-risks
    en: 'What are common production risks when writing an internal Spring Boot starter?'
    ru: 'Какие common production risks возникают при написании внутреннего Spring Boot starter?'
