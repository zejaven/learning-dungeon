summary:
  en: >
    Security as a designed-in property of the network: proactive Security by
    Design vs reactive add-ons, the obsolete castle-and-moat model, Defense in
    Depth, Zero Trust (PoLP, MFA, conditional access), segmentation with
    VLANs/VRFs/microsegmentation and DMZs, firewall evolution to NGFW and DPI,
    hybrid cryptography and confidential computing, RBAC/SoD, IDS/IPS sensor
    placement, SIEM, and generative-AI risks.
  ru: >
    Безопасность как встроенное свойство сети: проактивный Security by Design
    против реактивных «добавок», устаревшая модель «замка и рва», Defense in
    Depth, Zero Trust (PoLP, MFA, условный доступ), сегментация через
    VLAN/VRF/микросегментацию и DMZ, эволюция firewall до NGFW и DPI, гибридная
    криптография и confidential computing, RBAC/SoD, размещение сенсоров
    IDS/IPS, SIEM и риски генеративного AI.

