kind: practice
order: 2
title:
  en: |-
    Half the staff is missing
  ru: |-
    Половина сотрудников пропала
statement:
  en: |-
    The salary ranking is built with a `TreeSet`. HR reports that the ranking has fewer people than the company. No exception is thrown, and everyone who is in the ranking is in the right place.

    Fix `Payroll.ranking` and keep the `SortedSet` return type. The ranking must:

    1. contain every employee;
    2. put the highest salary first;
    3. order equal salaries by name, A to Z;
    4. order namesakes with equal salaries by `id`, lowest first;
    5. list one `id` only once, even if it was passed twice as different objects.
  ru: |-
    Рейтинг зарплат строится на `TreeSet`. HR сообщает, что в рейтинге людей меньше, чем в компании. Исключений нет, а все, кто попал в рейтинг, стоят на своих местах.

    Почини `Payroll.ranking`, оставив возвращаемый тип `SortedSet`. Рейтинг должен:

    1. содержать всех сотрудников;
    2. ставить самую высокую зарплату первой;
    3. упорядочивать равные зарплаты по имени от A до Z;
    4. упорядочивать тёзок с равной зарплатой по `id`, начиная с меньшего;
    5. показывать каждый `id` только один раз, даже если он передан дважды разными объектами.
hints:
  - en: |-
      How does a `TreeSet` decide that an element is already there? It never calls `equals()`.
    ru: |-
      Как `TreeSet` решает, что элемент уже есть? `equals()` он не вызывает.
  - en: |-
      For `TreeSet` a comparator result of 0 means "the same element", so a second employee with the same salary is dropped. The comparator needs tie-breakers down to the unique `id`.
    ru: |-
      Для `TreeSet` результат компаратора 0 означает «тот же элемент», поэтому второй сотрудник с такой же зарплатой отбрасывается. Компаратору нужны tie-breaker вплоть до уникального `id`.
  - en: |-
      Mind where `.reversed()` goes: it reverses everything chained before it. If it comes last, names and ids are reversed too.
    ru: |-
      Следи, где стоит `.reversed()`: он разворачивает всё, что стоит в цепочке до него. Если он идёт последним, развернутся и имена, и id.
debrief:
  en: |-
    `TreeSet` and `TreeMap` do not use `equals()` to find duplicates. A comparator result of 0 is their only notion of "the same element", so an order that is inconsistent with `equals()` silently loses data.

    The chain has to end on a unique field, and `id` is what makes requirement 5 work too: two objects with the same `id` compare as 0 and stay one element. A tie-breaker based on `System.identityHashCode` would keep every object apart, including real duplicates.

    `.reversed()` applies to the whole comparator built so far, so `comparingInt(salary).reversed().thenComparing(name)` and `comparingInt(salary).thenComparing(name).reversed()` are different orders.
  ru: |-
    `TreeSet` и `TreeMap` не используют `equals()` для поиска дубликатов. Результат компаратора 0 для них единственный признак «того же элемента», поэтому порядок, несогласованный с `equals()`, молча теряет данные.

    Цепочка должна заканчиваться уникальным полем, и именно `id` выполняет требование 5: два объекта с одним `id` дают 0 и остаются одним элементом. Tie-breaker через `System.identityHashCode` развёл бы все объекты, включая настоящие дубликаты.

    `.reversed()` применяется ко всему уже собранному компаратору, поэтому `comparingInt(salary).reversed().thenComparing(name)` и `comparingInt(salary).thenComparing(name).reversed()` дают разный порядок.
