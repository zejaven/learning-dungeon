id: primitive-vs-object-types
languages: [en, ru]
title:
  en: Primitive vs Object Types
  ru: Примитивные и объектные типы
category:
  en: Java Core / Types
  ru: Java Core / Типы
type: JVM_MEMORY
mode: trace
aiProvider: codex
aiModel: gpt-5.5
categoryId: java-core
difficulty: 1
catalogId: java-core-9
style: Real world
summary:
  en: >
    The practical difference between Java primitive types and object/reference
    types: what each variable stores, where objects live, how copying works,
    why only references can be null, how wrappers and autoboxing fit in, and
    why == is not the same question for values and objects.
  ru: >
    Практическая разница между примитивными и объектными/ссылочными типами в
    Java: что хранит переменная, где живут объекты, как работает копирование,
    почему только ссылки могут быть null, как сюда вписываются wrappers и
    autoboxing, и почему == задаёт не один и тот же вопрос для значений и
    объектов.

primitives:
  - BoxGroup

defaultExample: primitive-value

examples:
  - id: primitive-value
    title:
      en: Primitive value slot
      ru: Слот примитивного значения
    file: 01-primitive-value.java
    explanation:
      en: >
        int seats = 4 stores the value directly in the local variable slot. Copying
        it into spareSeats copies the number, so changing the copy leaves seats
        unchanged.
      ru: >
        int seats = 4 хранит значение прямо в слоте локальной переменной.
        Копирование в spareSeats копирует число, поэтому изменение копии не
        меняет seats.
  - id: object-reference
    title:
      en: Object through reference
      ru: Объект через ссылку
    file: 02-object-reference.java
    explanation:
      en: >
        Order order = new Order(...) creates an object on the heap. The local
        variable order stores only a reference to that object, not the object
        itself.
      ru: >
        Order order = new Order(...) создаёт объект в куче. Локальная переменная
        order хранит только ссылку на этот объект, а не сам объект.
  - id: reference-copy
    title:
      en: Copying a reference
      ru: Копирование ссылки
    file: 03-reference-copy.java
    explanation:
      en: >
        Basket second = first copies the reference. Both variables point at the
        same heap object, so changing the object through second is visible through
        first too.
      ru: >
        Basket second = first копирует ссылку. Обе переменные указывают на один
        объект в куче, поэтому изменение через second видно и через first.
  - id: null-reference
    title:
      en: Null is for references
      ru: null только для ссылок
    file: 04-null-reference.java
    explanation:
      en: >
        A reference variable can hold null, meaning it points at no object. A
        primitive int cannot hold null because its slot must contain an int value.
      ru: >
        Ссылочная переменная может хранить null, то есть не указывать ни на какой
        объект. Примитивный int не может хранить null, потому что его слот должен
        содержать значение int.
  - id: wrapper-autoboxing
    title:
      en: Wrapper and autoboxing
      ru: Wrapper и autoboxing
    file: 05-wrapper-autoboxing.java
    explanation:
      en: >
        Integer is an object type that wraps an int value. Autoboxing can create
        or reuse a wrapper object, while unboxing reads the primitive value back.
      ru: >
        Integer - объектный тип, который оборачивает значение int. Autoboxing
        может создать или переиспользовать wrapper-объект, а unboxing читает
        примитивное значение обратно.
  - id: equality-checks
    title:
      en: == versus equals
      ru: == против equals
    file: 06-equality-checks.java
    explanation:
      en: >
        For primitives, == compares values. For object references, == compares
        whether both variables point at the same object; equals can compare
        object content.
      ru: >
        Для примитивов == сравнивает значения. Для объектных ссылок == проверяет,
        указывают ли обе переменные на один объект; equals может сравнивать
        содержимое объекта.

assistantExample:
  en: "e.g. Why can Integer be null but int cannot?"
  ru: "например: Почему Integer может быть null, а int - нет?"

missionsFile: quiz.yaml
