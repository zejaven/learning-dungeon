# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: which-is-better
    en: Which is better, recursion or a loop? Defend your answer.
    ru: Что лучше — рекурсия или обычный цикл? Обоснуйте ответ.
  - id: stack-difference
    en: What is the key difference in how recursion and a loop use the call stack?
    ru: В чём ключевая разница в том, как рекурсия и цикл используют стек вызовов?
  - id: when-recursion
    en: Name a problem where recursion is clearly the better choice, and why.
    ru: Назовите задачу, где рекурсия явно лучший выбор, и почему.
  - id: when-loop
    en: Name a situation where you must use a loop instead of recursion in Java.
    ru: Назовите ситуацию, где в Java нужно использовать цикл, а не рекурсию.
  - id: tail-call-java
    en: Does Java optimize tail recursion? What does that mean for deep recursion?
    ru: Оптимизирует ли Java хвостовую рекурсию? Что это значит для глубокой рекурсии?
  - id: convert-recursion
    en: Can every recursion be rewritten as a loop? If so, how?
    ru: Можно ли любую рекурсию переписать циклом? Если да, то как?
  - id: memory-cost
    en: Compare the memory cost of recursion versus iteration in terms of Big-O.
    ru: Сравните затраты памяти рекурсии и итерации в терминах Big-O.
