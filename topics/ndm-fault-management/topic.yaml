summary:
  en: >
    Fault Management within the FCAPS model (ISO X.700): the fault taxonomy
    (hard/soft, permanent/transient/intermittent), the six-stage FM lifecycle,
    passive vs active monitoring (SNMP traps, syslog, ICMP polling), alarm
    storms and severity filtering, root cause analysis techniques, RMON, MIBs,
    machine-learning approaches (ANN, Bayesian networks, SVM), and key metrics
    like MTTR, MTTD, and MTBF.
  ru: >
    Управление сбоями в рамках модели FCAPS (ISO X.700): таксономия сбоев
    (hard/soft, постоянные/кратковременные/перемежающиеся), шестиэтапный
    жизненный цикл FM, пассивный и активный мониторинг (SNMP traps, syslog,
    ICMP-опрос), «штормы» аварийных сигналов и фильтрация по серьёзности,
    методы анализа первопричин, RMON, MIB, подходы машинного обучения (ANN,
    байесовские сети, SVM) и ключевые метрики MTTR, MTTD и MTBF.

