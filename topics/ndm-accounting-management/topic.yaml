summary:
  en: >
    Accounting Management as the third pillar of FCAPS and of the AAA
    framework: key metrics (data volume, temporal, resource), where to account
    (data link vs network vs application layer) and at what granularity, the
    RADIUS / TACACS+ / NetFlow protocol comparison, the accounting log
    lifecycle, chargebacks and Fair Use Policies, forensic auditing and
    compliance (HIPAA, PCI-DSS, SOX), and the EML/NML/SML hierarchy.
  ru: >
    Accounting Management как третий столп FCAPS и каркаса AAA: ключевые
    метрики (объём данных, временные, ресурсные), где вести учёт (канальный,
    сетевой или прикладной уровень) и с какой гранулярностью, сравнение
    протоколов RADIUS / TACACS+ / NetFlow, жизненный цикл учётного журнала,
    внутренние chargebacks и Fair Use Policies, форензик-аудит и комплаенс
    (HIPAA, PCI-DSS, SOX), а также иерархия EML/NML/SML.

assistantExample:
  en: "e.g. Why does TACACS+ log every CLI command while RADIUS only tracks session-level metadata?"
  ru: "например: Почему TACACS+ логирует каждую CLI-команду, а RADIUS отслеживает только метаданные сессий?"

