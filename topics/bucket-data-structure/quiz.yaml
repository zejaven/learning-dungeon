# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: list-add
    title:
      en: Build a chain
      ru: Построй цепочку
    goal:
      en: Run a bucket and append entries — they form a singly-linked list.
      ru: Запусти бакет и добавь записи — они образуют односвязный список.
    event: LIST_ADD
  - id: list-get
    title:
      en: Walk the chain
      ru: Пройди по цепочке
    goal:
      en: Look a key up in a list bucket so get() walks node by node (O(n)).
      ru: Найди ключ в бакете-списке, чтобы get() прошёл узел за узлом (O(n)).
    event: LIST_GET
  - id: treeify
    title:
      en: Treeify a long bucket
      ru: Сделай treeify длинного бакета
    goal:
      en: Add 8 entries with capacity 64 so the bucket becomes a red-black tree.
      ru: Добавь 8 записей при ёмкости 64, чтобы бакет стал красно-чёрным деревом.
    event: TREEIFY
  - id: tree-get
    title:
      en: Search a tree bucket
      ru: Поиск в бакете-дереве
    goal:
      en: Look a key up after treeify so the search runs in O(log n) comparisons.
      ru: Найди ключ после treeify, чтобы поиск шёл за O(log n) сравнений.
    event: TREE_GET
  - id: untreeify
    title:
      en: Shrink back to a list
      ru: Уменьши обратно до списка
    goal:
      en: Remove entries until the tree drops to 6 nodes and untreeifies.
      ru: Удаляй записи, пока дерево не уменьшится до 6 узлов и не станет списком.
    event: UNTREEIFY

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: bucket-default-structure
    en: What data structure stores the values inside a single HashMap bucket?
    ru: Какая структура данных хранит значения внутри одного бакета HashMap?
  - id: treeify-conditions
    en: Under exactly what conditions does a bucket convert from a list to a tree?
    ru: При каких именно условиях бакет превращается из списка в дерево?
  - id: tree-kind
    en: What kind of tree is used, and why that one rather than a plain BST?
    ru: Какое дерево используется и почему именно оно, а не обычный BST?
  - id: complexity
    en: How does treeification change the lookup complexity inside the bucket?
    ru: Как treeification меняет сложность поиска внутри бакета?
  - id: untreeify-threshold
    en: When does a tree bucket revert to a linked list, and why is the threshold (6) lower than treeify (8)?
    ru: Когда бакет-дерево возвращается к списку и почему порог (6) ниже, чем у treeify (8)?
  - id: comparable-requirement
    en: How does the tree order keys whose hashes collide, and what is the role of Comparable?
    ru: Как дерево упорядочивает ключи с одинаковым hash и какова роль Comparable?
