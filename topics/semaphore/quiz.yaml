missions:
  - id: acquire-permit
    title:
      en: Acquire a permit
      ru: Получи permit
    goal:
      en: Run code where a thread successfully calls acquire() and receives a permit.
      ru: Запусти код, где thread успешно вызывает acquire() и получает permit.
    event: SEMAPHORE_ACQUIRE
  - id: make-thread-wait
    title:
      en: Make a thread wait
      ru: Заставь thread ждать
    goal:
      en: Use all available permits, then have another thread call acquire() and wait in the queue.
      ru: Используй все доступные permits, затем вызови acquire() из другого thread, чтобы он ждал в очереди.
    event: SEMAPHORE_WAIT
  - id: hand-off-permit
    title:
      en: Hand off a permit
      ru: Передай permit
    goal:
      en: Release a permit while another thread is waiting, so the waiting thread receives it.
      ru: Освободи permit, пока другой thread ждёт, чтобы ожидающий thread получил его.
    event: SEMAPHORE_PERMIT_GRANTED
  - id: fail-fast-try-acquire
    title:
      en: Fail fast with tryAcquire
      ru: Быстро откажись через tryAcquire
    goal:
      en: Call tryAcquire() when no permit is available and observe that it does not join the waiting queue.
      ru: Вызови tryAcquire(), когда permit недоступен, и проверь, что он не встаёт в очередь ожидания.
    event: SEMAPHORE_TRY_ACQUIRE_FAILED
  - id: show-over-release
    title:
      en: Show over-release
      ru: Покажи лишний release
    goal:
      en: Call release() from a thread that did not acquire a permit and see how capacity can accidentally grow.
      ru: Вызови release() из thread, который не получал permit, и посмотри, как capacity может случайно вырасти.
    event: SEMAPHORE_OVER_RELEASE

bossFight:
  - id: definition
    en: What is a Semaphore in Java, and what does a permit represent?
    ru: Что такое Semaphore в Java и что представляет permit?
  - id: when-needed
    en: In what situations would you use Semaphore in production code?
    ru: В каких ситуациях ты использовал бы Semaphore в production-коде?
  - id: acquire-release
    en: Explain what happens when acquire() is called with no available permits, and what release() does.
    ru: Объясни, что происходит при вызове acquire(), когда доступных permits нет, и что делает release().
  - id: semaphore-vs-lock
    en: How is Semaphore different from synchronized or ReentrantLock?
    ru: Чем Semaphore отличается от synchronized или ReentrantLock?
  - id: binary-vs-counting
    en: What is the difference between a binary semaphore and a counting semaphore?
    ru: В чём разница между binary semaphore и counting semaphore?
  - id: fairness
    en: What does the fairness option change, and what trade-off can it have?
    ru: Что меняет опция fairness и какой trade-off у неё может быть?
  - id: common-traps
    en: What bugs can appear if code releases too many permits or uses Semaphore as a mutex?
    ru: Какие bugs возможны, если код освобождает слишком много permits или использует Semaphore как mutex?
