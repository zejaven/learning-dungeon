# Theory topic: no missions, only Boss Fight questions.
bossFight:
  - id: what-is-prepared-statement
    en: What is a PreparedStatement in JDBC?
    ru: Что такое PreparedStatement в JDBC?
  - id: statement-vs-preparedstatement
    en: How is PreparedStatement different from Statement?
    ru: Чем PreparedStatement отличается от Statement?
  - id: sql-injection-protection
    en: Why does parameter binding help prevent SQL injection?
    ru: Почему привязка параметров помогает предотвращать SQL injection?
  - id: binding-rules
    en: What can and cannot be replaced by a PreparedStatement parameter placeholder?
    ru: Что можно и чего нельзя заменить параметром-заполнителем в PreparedStatement?
  - id: performance-reuse
    en: When can prepared statements improve performance, and when should you not overpromise it?
    ru: Когда prepared statements могут улучшить производительность и когда не стоит это переобещать?
  - id: transactions-and-resources
    en: How do PreparedStatement, transactions, and resource closing relate in real JDBC code?
    ru: Как PreparedStatement, transactions и закрытие ресурсов связаны в реальном JDBC-коде?
