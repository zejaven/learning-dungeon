id: equals-hashcode-contract
languages: [en, ru]
title:
  en: equals() and hashCode() Contract
  ru: Контракт equals() и hashCode()
category:
  en: Java Core / Objects
  ru: Java Core / Объекты
type: OTHER
mode: trace
summary:
  en: >
    How to implement equals() and hashCode() for a value class, which fields to
    use, why equal objects must have the same hashCode, and how broken contracts
    confuse HashSet and HashMap.
  ru: >
    Как реализовать equals() и hashCode() для класса-значения, какие поля
    использовать, почему равные объекты обязаны иметь одинаковый hashCode и как
    нарушенный контракт путает HashSet и HashMap.
categoryId: java-core
difficulty: 2
catalogId: java-core-20
style: Real world
aiProvider: codex
aiModel: gpt-5.5

primitives:
  - ArrayGrid
  - LinkedNodes
  - EventLog

defaultExample: correct-value-key

examples:
  - id: correct-value-key
    title:
      en: Correct value key
      ru: Правильный value key
    file: 01-correct-value-key.java
    explanation:
      en: >
        Two different instances represent the same value. equals() returns true,
        hashCode() matches, and the set rejects the duplicate.
      ru: >
        Два разных экземпляра представляют одно значение. equals() возвращает
        true, hashCode() совпадает, и set отклоняет дубликат.
  - id: broken-hashcode
    title:
      en: Broken hashCode()
      ru: Сломанный hashCode()
    file: 02-broken-hashcode.java
    explanation:
      en: >
        equals() says the objects are the same, but hashCode() sends them to
        different buckets, so a HashSet-like structure stores a duplicate.
      ru: >
        equals() говорит, что объекты одинаковые, но hashCode() отправляет их в
        разные бакеты, поэтому структура вроде HashSet хранит дубликат.
  - id: missing-equals
    title:
      en: Missing equals()
      ru: Отсутствующий equals()
    file: 03-missing-equals.java
    explanation:
      en: >
        Matching hashCode() is not enough. Without equals(), Java keeps reference
        equality and treats two value-looking objects as different.
      ru: >
        Одного совпадающего hashCode() недостаточно. Без equals() Java оставляет
        сравнение ссылок и считает два похожих value-объекта разными.
  - id: mutable-field
    title:
      en: Mutable field trap
      ru: Ловушка изменяемого поля
    file: 04-mutable-field.java
    explanation:
      en: >
        A field used by hashCode() changes after insertion. The object remains in
        the old bucket, while lookup checks a new bucket and misses it.
      ru: >
        Поле, участвующее в hashCode(), меняется после вставки. Объект остаётся
        в старом бакете, а поиск проверяет новый бакет и промахивается.
  - id: symmetry-trap
    title:
      en: Symmetry trap
      ru: Ловушка симметрии
    file: 05-symmetry-trap.java
    explanation:
      en: >
        A superclass accepts a subclass in equals(), but the subclass rejects the
        superclass. That violates the symmetry rule.
      ru: >
        Суперкласс принимает подкласс в equals(), а подкласс отвергает
        суперкласс. Это нарушает правило симметрии.
  - id: record-key
    title:
      en: Record key
      ru: record-ключ
    file: 06-record-key.java
    explanation:
      en: >
        Java records generate equals() and hashCode() from their components,
        making small immutable value keys concise and safe.
      ru: >
        Java records генерируют equals() и hashCode() по компонентам, поэтому
        маленькие неизменяемые value keys получаются краткими и безопасными.

assistantExample:
  en: 'e.g. Which fields should equals() and hashCode() use in a value class?'
  ru: 'например: Какие поля должны использовать equals() и hashCode() в классе-значении?'

missionsFile: quiz.yaml
