# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: forge-a-transfer
    title:
      en: Move money from a page you do not own
      ru: Переведи деньги со страницы, которая тебе не принадлежит
    goal:
      en: Let another site's page make the browser send a state-changing request, and watch it succeed.
      ru: Дай странице чужого сайта заставить браузер отправить изменяющий состояние запрос и посмотри, как он проходит.
    event: FORGED_ACTION
  - id: borrow-the-cookie
    title:
      en: Watch the browser attach the session
      ru: Посмотри, как браузер прикрепляет сессию
    goal:
      en: Find the step where the cookie is added to a request nobody on your site built.
      ru: Найди шаг, на котором cookie добавляется к запросу, который собрал не твой сайт.
    event: COOKIE_ATTACHED
  - id: attack-without-reading
    title:
      en: Attack without reading a byte
      ru: Атакуй, не прочитав ни байта
    goal:
      en: Confirm the attacker never sees the response, and that the side effect happened anyway.
      ru: Убедись, что злоумышленник не видит ответа, а побочный эффект всё равно случился.
    event: RESPONSE_UNREADABLE
  - id: unsafe-get
    title:
      en: 'Turn an <img> tag into an attack'
      ru: 'Преврати тег <img> в атаку'
    goal:
      en: Reach a state change over GET and see why a safe method has to stay safe.
      ru: Измени состояние методом GET и увидь, почему безопасный метод обязан оставаться безопасным.
    event: UNSAFE_GET
  - id: withhold-the-cookie
    title:
      en: Make the browser withhold the cookie
      ru: Заставь браузер не отправлять cookie
    goal:
      en: Set SameSite so a cross-site request arrives without the session attached.
      ru: Настрой SameSite так, чтобы кросс-сайтовый запрос пришёл без прикреплённой сессии.
    event: COOKIE_WITHHELD
  - id: find-the-lax-gap
    title:
      en: Find the gap SameSite=Lax leaves
      ru: Найди дыру, которую оставляет SameSite=Lax
    goal:
      en: Deliver the request as a top-level GET navigation under Lax and see the cookie ride along.
      ru: Доставь запрос переходом верхнего уровня методом GET при Lax и увидь, как cookie едет вместе с ним.
    event: SAMESITE_GAP
  - id: demand-a-token
    title:
      en: Reject a request with no token
      ru: Отклони запрос без токена
    goal:
      en: Require a synchronizer token and watch a forged request fail to produce one.
      ru: Потребуй синхронизирующий токен и посмотри, как поддельный запрос не может его предъявить.
    event: TOKEN_MISSING
  - id: keep-the-user-working
    title:
      en: Keep the real user working
      ru: Не сломай настоящего пользователя
    goal:
      en: Send the same request from the site's own page and see the token accepted.
      ru: Отправь тот же запрос с собственной страницы сайта и увидь, что токен принят.
    event: TOKEN_VALIDATED
  - id: check-the-origin
    title:
      en: Refuse it by its Origin
      ru: Откажи по заголовку Origin
    goal:
      en: Turn on the Origin check and refuse a request whose session is perfectly valid.
      ru: Включи проверку Origin и откажи запросу, сессия которого совершенно настоящая.
    event: ORIGIN_REJECTED
  - id: stopped-before-sending
    title:
      en: Stop it before it is sent
      ru: Останови его до отправки
    goal:
      en: Make the attacker use a content type that needs a preflight, and see the request never leave.
      ru: Заставь злоумышленника взять тип содержимого, требующий preflight, и увидь, что запрос не уходит вовсе.
    event: PREFLIGHT_BLOCKED
  - id: remove-ambient-authority
    title:
      en: Leave nothing to forge
      ru: Не оставь ничего для подделки
    goal:
      en: Move the session out of the cookie and watch the forged request arrive with no identity at all.
      ru: Вынеси сессию из cookie и посмотри, как поддельный запрос приходит вообще без личности.
    event: NO_AMBIENT_CREDENTIALS
  - id: token-read-by-xss
    title:
      en: Read the token off the page
      ru: Считай токен прямо со страницы
    goal:
      en: Let a script on your own origin take the CSRF token and confirm every defence agrees with it.
      ru: Дай скрипту на твоём собственном origin забрать CSRF-токен и убедись, что все защиты с ним согласны.
    event: TOKEN_STOLEN

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: what-is-csrf
    en: What is cross-site request forgery, and what exactly does the victim's browser do wrong?
    ru: Что такое межсайтовая подделка запроса и что именно делает не так браузер жертвы?
  - id: why-cookies-enable-it
    en: Why does a cookie make this attack possible at all? What does 'ambient authority' mean here?
    ru: Почему именно cookie делает эту атаку возможной? Что здесь означает «ambient-полномочия»?
  - id: not-an-auth-bug
    en: Why is CSRF not an authentication problem? Why do stronger passwords, MFA or HTTPS not help?
    ru: Почему CSRF — не проблема аутентификации? Почему не помогают более сильные пароли, MFA или HTTPS?
  - id: write-not-read
    en: The same-origin policy stops the attacker from reading the response. Why is the attack still worth doing?
    ru: Правило одного источника не даёт злоумышленнику прочитать ответ. Почему атака всё равно имеет смысл?
  - id: delivery-vehicles
    en: How can a page on another domain make my browser send a request to your site? List the ways.
    ru: Как страница на другом домене может заставить мой браузер отправить запрос на ваш сайт? Перечисли способы.
  - id: get-side-effects
    en: Why is a GET endpoint that changes state so much more dangerous here than a POST one?
    ru: Почему эндпоинт GET, меняющий состояние, здесь настолько опаснее, чем POST?
  - id: post-only-myth
    en: 'Is ''we only accept POST'' a CSRF defence? Explain what it does and does not close.'
    ru: 'Является ли «мы принимаем только POST» защитой от CSRF? Объясни, что это закрывает, а что нет.'
  - id: synchronizer-token
    en: How does a synchronizer token work, and what property of the browser makes it unguessable to the attacker?
    ru: Как работает синхронизирующий токен и какое свойство браузера делает его недоступным злоумышленнику?
  - id: double-submit
    en: What is the double-submit cookie pattern, and when is it weaker than a server-side token?
    ru: Что такое паттерн double-submit cookie и когда он слабее серверного токена?
  - id: samesite-values
    en: Compare SameSite=Lax, Strict and None. What does each stop, and what does Lax deliberately allow?
    ru: Сравни SameSite=Lax, Strict и None. Что останавливает каждый и что Lax разрешает намеренно?
  - id: samesite-enough
    en: Browsers now default cookies to SameSite=Lax. Is that enough on its own to drop CSRF tokens?
    ru: Браузеры теперь по умолчанию ставят cookie SameSite=Lax. Достаточно ли этого, чтобы отказаться от CSRF-токенов?
  - id: origin-referer-check
    en: How would you defend a token-less JSON API? What are the pitfalls of checking Origin and Referer?
    ru: Как защитить JSON API без токенов? Какие подводные камни у проверки Origin и Referer?
  - id: cors-relationship
    en: How are CORS and CSRF related? Does a strict CORS policy protect me, and which misconfiguration breaks that?
    ru: Как связаны CORS и CSRF? Защищает ли меня строгая политика CORS и какая ошибка в настройке её ломает?
  - id: json-api-safety
    en: Is a JSON-only API automatically safe from CSRF? What must the server actually enforce?
    ru: Автоматически ли безопасен от CSRF API, принимающий только JSON? Что сервер обязан на самом деле проверять?
  - id: xss-vs-csrf
    en: How do XSS and CSRF differ, and why is every CSRF defence useless once a site has an XSS?
    ru: Чем XSS отличается от CSRF и почему любая защита от CSRF бесполезна, если на сайте есть XSS?
  - id: bearer-tokens
    en: A SPA keeps its token in localStorage and sends it in a header. Is it CSRF-proof, and what did it trade away?
    ru: SPA хранит токен в localStorage и шлёт его в заголовке. Защищено ли оно от CSRF и чем оно за это заплатило?
  - id: spring-security-csrf
    en: How does Spring Security implement CSRF protection, and when do developers disable it correctly or by mistake?
    ru: Как защита от CSRF устроена в Spring Security и когда её отключают обоснованно, а когда по ошибке?
  - id: which-endpoints
    en: Which endpoints need CSRF protection and which do not? How does login itself fit in?
    ru: Каким эндпоинтам нужна защита от CSRF, а каким нет? Как в это вписывается сам вход в систему?
  - id: layered-defence
    en: Design a layered CSRF defence for a real application, and say which layer you would ship first and why.
    ru: Спроектируй многоуровневую защиту от CSRF для реального приложения и скажи, какой уровень внедрил бы первым и почему.
  - id: incident-detection
    en: A user says money left their account but the logs show a normal authenticated request. How would you investigate CSRF?
    ru: Пользователь говорит, что с его счёта ушли деньги, а в логах обычный аутентифицированный запрос. Как расследовать CSRF?
