missions:
  - id: wait-releases-monitor
    title:
      en: Release monitor with wait()
      ru: Освободи monitor через wait()
    goal:
      en: Run code where a thread owns the monitor, calls wait(), enters the wait set, and releases ownership.
      ru: Запусти код, где thread владеет monitor, вызывает wait(), попадает в wait set и освобождает ownership.
    event: MONITOR_WAIT_RELEASED
  - id: notify-keeps-owner
    title:
      en: Wake one waiter
      ru: Разбуди одного waiter
    goal:
      en: Call notify() while still inside synchronized and observe that the notifier keeps the monitor.
      ru: Вызови notify() внутри synchronized и проверь, что notifier сохраняет monitor.
    event: MONITOR_NOTIFY
  - id: reacquire-before-return
    title:
      en: Re-acquire before return
      ru: Захвати monitor перед возвратом
    goal:
      en: Let a notified or spuriously woken thread re-acquire the monitor before wait() can return.
      ru: Дай notified или spuriously woken thread заново захватить monitor перед возвратом из wait().
    event: MONITOR_REACQUIRED
  - id: wake-all-waiters
    title:
      en: Wake all waiters
      ru: Разбуди всех waiters
    goal:
      en: Put multiple threads in the wait set and call notifyAll() so all of them move toward re-acquisition.
      ru: Помести несколько threads в wait set и вызови notifyAll(), чтобы все перешли к повторному захвату.
    event: MONITOR_NOTIFY_ALL
  - id: handle-spurious-wakeup
    title:
      en: Handle spurious wakeup
      ru: Обработай spurious wakeup
    goal:
      en: Produce a spurious wakeup and re-check the guard condition instead of trusting one wait() return.
      ru: Получи spurious wakeup и заново проверь guard condition вместо доверия одному возврату из wait().
    event: MONITOR_SPURIOUS_WAKEUP
  - id: notify-is-not-stored
    title:
      en: Show lost notify
      ru: Покажи потерянный notify
    goal:
      en: Call notify() when the wait set is empty and observe that the signal is not saved for later.
      ru: Вызови notify(), когда wait set пуст, и проверь, что сигнал не сохраняется на потом.
    event: MONITOR_NOTIFY_NO_WAITER

bossFight:
  - id: wait-releases-monitor
    en: Does wait() release the monitor, and what state does the waiting thread enter?
    ru: Освобождает ли wait() monitor и в какое состояние переходит ожидающий thread?
  - id: synchronized-required
    en: Why must wait(), notify() and notifyAll() be called while owning the same monitor inside synchronized?
    ru: Почему wait(), notify() и notifyAll() нужно вызывать при владении тем же monitor внутри synchronized?
  - id: notify-not-release
    en: What exactly happens after notify() is called, and why does the waiting thread not continue immediately?
    ru: Что именно происходит после вызова notify() и почему ожидающий thread не продолжает работу сразу?
  - id: notify-vs-notifyall
    en: What is the practical difference between notify() and notifyAll(), and when is notifyAll() safer?
    ru: В чём практическая разница между notify() и notifyAll() и когда notifyAll() безопаснее?
  - id: while-not-if
    en: Why should wait() usually be used inside a while loop instead of an if statement?
    ru: Почему wait() обычно используют внутри цикла while, а не в if?
  - id: wait-set-vs-entry-set
    en: How are the wait set and the entry set different for a Java object monitor?
    ru: Чем wait set отличается от entry set у object monitor в Java?
  - id: lost-notification
    en: What is a lost notification, and how does a real guard condition prevent it?
    ru: Что такое lost notification и как настоящая guard condition помогает её избежать?
