id: jdk-dynamic-proxy-vs-cglib
languages: [en, ru]
title:
  en: JDK Dynamic Proxy vs CGLIB Proxy
  ru: JDK Dynamic Proxy и CGLIB Proxy
category:
  en: Spring / AOP
  ru: Spring / AOP
type: SPRING
mode: trace
aiProvider: claude
aiModel: claude-opus-4-8
categoryId: spring
difficulty: 2
catalogId: manual-16
style: Real world
summary:
  en: >
    How Spring builds an AOP proxy: a JDK dynamic proxy that implements the
    bean's interface, or a CGLIB proxy that subclasses the bean's class. When
    Spring picks each one, how proxyTargetClass changes the choice, and why
    final classes and final methods break a CGLIB proxy.
  ru: >
    Как Spring строит AOP proxy: JDK dynamic proxy, реализующий interface bean,
    или CGLIB proxy, наследующий класс bean. Когда Spring выбирает каждый из них,
    как proxyTargetClass меняет выбор и почему final-классы и final-методы ломают
    CGLIB proxy.

primitives:
  - ArrayGrid
  - LinkedNodes

defaultExample: jdk-proxy

examples:
  - id: jdk-proxy
    title:
      en: JDK dynamic proxy
      ru: JDK dynamic proxy
    file: 01-jdk-proxy.java
    explanation:
      en: >
        The bean implements an interface, so Spring AOP defaults to a JDK
        dynamic proxy — a sibling object that implements the same interface and
        routes every call through an InvocationHandler.
      ru: >
        Bean реализует interface, поэтому Spring AOP по умолчанию делает JDK
        dynamic proxy — объект-сосед, реализующий тот же interface и
        направляющий каждый вызов через InvocationHandler.
  - id: cglib-proxy
    title:
      en: CGLIB proxy
      ru: CGLIB proxy
    file: 02-cglib-proxy.java
    explanation:
      en: >
        With no interface to implement, a JDK proxy is impossible. Spring falls
        back to CGLIB, which generates a runtime subclass of the bean and
        overrides its methods to insert advice.
      ru: >
        Без interface JDK proxy невозможен. Spring переключается на CGLIB,
        который генерирует подкласс bean в рантайме и переопределяет его методы,
        чтобы вставить advice.
  - id: force-cglib
    title:
      en: Force CGLIB
      ru: Форсировать CGLIB
    file: 03-force-cglib.java
    explanation:
      en: >
        The bean implements an interface, but proxyTargetClass=true forces a
        class-based CGLIB proxy. This is the Spring Boot default since 2.0.
      ru: >
        Bean реализует interface, но proxyTargetClass=true форсирует class-based
        CGLIB proxy. Это поведение по умолчанию в Spring Boot начиная с 2.0.
  - id: final-method
    title:
      en: Final method trap
      ru: Ловушка с final-методом
    file: 04-final-method.java
    explanation:
      en: >
        CGLIB intercepts by overriding methods. A final method cannot be
        overridden, so the call runs unadvised — the advice, transaction or
        logging silently never runs.
      ru: >
        CGLIB перехватывает через переопределение методов. final-метод нельзя
        переопределить, поэтому вызов идёт без advice — advice, транзакция или
        логирование молча не выполняются.
  - id: final-class
    title:
      en: Final class blocks CGLIB
      ru: Final-класс блокирует CGLIB
    file: 05-final-class.java
    explanation:
      en: >
        CGLIB must subclass the target, but a final class cannot be subclassed,
        so proxy creation fails. Add an interface (for a JDK proxy) or drop the
        final modifier.
      ru: >
        CGLIB должен наследовать target, но final-класс наследовать нельзя,
        поэтому создание proxy падает. Добавьте interface (для JDK proxy) или
        уберите модификатор final.

