summary:
  en: >
    The Java Memory Model (JMM) defines what one thread is guaranteed to see of
    another thread's actions. When you share mutable data without the right
    synchronization, four classic problems appear: lost visibility of writes,
    instruction reordering, broken atomicity of read-modify-write, and unsafe
    publication of half-built objects. This topic maps those problems and links
    to the tools that fix them.
  ru: >
    Модель памяти Java (JMM) описывает, что один поток гарантированно видит из
    действий другого. Если разделять изменяемые данные без правильной
    синхронизации, возникают четыре классические проблемы: потеря видимости
    записей, переупорядочивание инструкций, нарушенная атомарность
    «прочитать-изменить-записать» и небезопасная публикация недостроенных
    объектов. Эта тема показывает карту проблем и ссылки на инструменты их
    решения.

