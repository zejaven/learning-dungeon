missions:
  - id: compare-base-and-subclass
    title:
      en: Compare base and subclass
      ru: Сравни базовый класс и подкласс
    goal:
      en: Run an example where Point and Point3D are compared with equals().
      ru: Запусти пример, где Point и Point3D сравниваются через equals().
    event: EQUALITY_COMPARE
  - id: break-symmetry
    title:
      en: Break symmetry
      ru: Сломай симметрию
    goal:
      en: Produce p.equals(p3) and p3.equals(p) with different boolean results.
      ru: Получи p.equals(p3) и p3.equals(p) с разными boolean-результатами.
    event: EQUALITY_SYMMETRY_BROKEN
  - id: break-transitivity
    title:
      en: Break transitivity
      ru: Сломай транзитивность
    goal:
      en: Show three objects where a equals b and b equals c, but a does not equal c.
      ru: Покажи три объекта, где a равен b и b равен c, но a не равен c.
    event: EQUALITY_TRANSITIVITY_BROKEN
  - id: getclass-guard
    title:
      en: Use getClass()
      ru: Используй getClass()
    goal:
      en: Run a comparison where getClass() rejects equality between Point and Point3D.
      ru: Запусти сравнение, где getClass() отвергает равенство между Point и Point3D.
    event: EQUALITY_GETCLASS_GUARD
  - id: collection-surprise
    title:
      en: Surprise a collection
      ru: Удиви коллекцию
    goal:
      en: Show how asymmetric equals() makes HashSet.contains(...) depend on comparison direction.
      ru: Покажи, как асимметричный equals() заставляет HashSet.contains(...) зависеть от направления сравнения.
    event: EQUALITY_COLLECTION_SURPRISE

bossFight:
  - id: instanceof-main-risk
    en: What can go wrong if a base value class implements equals(Object) with instanceof?
    ru: Что может пойти не так, если базовый value class реализует equals(Object) через instanceof?
  - id: symmetry-point-point3d
    en: Explain the Point / Point3D symmetry problem with p.equals(p3) and p3.equals(p).
    ru: Объясни проблему симметрии Point / Point3D на p.equals(p3) и p3.equals(p).
  - id: transitivity-point-point3d
    en: How can an attempted fix for Point3D equality break transitivity?
    ru: Как попытка починить равенство Point3D может нарушить транзитивность?
  - id: getclass-tradeoff
    en: How does getClass() differ from instanceof in equals(), and what tradeoff does it create?
    ru: Чем getClass() отличается от instanceof в equals(), и какой компромисс он создает?
  - id: collections-impact
    en: Why do broken equals() and hashCode() contracts show up as bugs in HashSet or HashMap?
    ru: Почему нарушенные контракты equals() и hashCode() проявляются как баги в HashSet или HashMap?
  - id: practical-recommendation
    en: What practical design choices avoid equality problems in inheritance hierarchies?
    ru: Какие практические проектные решения помогают избежать проблем равенства в иерархиях наследования?
