# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: write-a-catalog-row
    title:
      en: Write one failure down
      ru: Запиши один сбой
    goal:
      en: 'Declare an error code: the exception that raises it, the status that carries it, and whether a retry can help.'
      ru: 'Объяви код ошибки: исключение, которое его вызывает, статус, который его несёт, и помогает ли повтор.'
    event: CODE_DEFINED
  - id: name-it-so-it-lasts
    title:
      en: 'Break a code on purpose'
      ru: 'Сломай код нарочно'
    goal:
      en: Declare a code that is a human sentence, or one with no namespace, and see what the client loses when the wording changes.
      ru: Объяви код, который является человеческой фразой, или код без пространства имён, и посмотри, что теряет клиент при смене формулировки.
    event: CODE_UNSTABLE
  - id: error-with-a-success-status
    title:
      en: 'Hide a failure behind 2xx'
      ru: 'Спрячь сбой за 2xx'
    goal:
      en: Declare an error whose status says nothing went wrong, and see which layers stop noticing it.
      ru: Объяви ошибку со статусом, который говорит, что всё в порядке, и посмотри, какие слои перестают её замечать.
    event: STATUS_MISUSED
  - id: retry-advice-that-lies
    title:
      en: 'Contradict your own status'
      ru: 'Противоречь собственному статусу'
    goal:
      en: Mark a 409 as retryable, or a 503 as not retryable, and see why the two fields have to agree.
      ru: Пометь 409 как повторяемый или 503 как неповторяемый и пойми, почему эти два поля обязаны совпадать.
    event: RETRY_ADVICE_WRONG
  - id: exception-to-code
    title:
      en: 'Turn an exception into a code'
      ru: 'Преврати исключение в код'
    goal:
      en: Send a request whose service throws a mapped exception, and watch one advice turn a domain word into a status and a code.
      ru: Отправь запрос, чей сервис бросает отображённое исключение, и посмотри, как один advice превращает доменное слово в статус и код.
    event: EXCEPTION_MAPPED
  - id: nobody-mapped-it
    title:
      en: 'Reach the catch-all'
      ru: 'Дойди до общего перехватчика'
    goal:
      en: Fail with an exception no code claims and see what the client is left holding.
      ru: Заверши запрос исключением, на которое не претендует ни один код, и посмотри, с чем остаётся клиент.
    event: UNMAPPED_EXCEPTION
  - id: name-every-bad-field
    title:
      en: 'Name every bad field'
      ru: 'Назови каждое неверное поле'
    goal:
      en: Send a body that breaks more than one constraint and see why one code is not enough for a form.
      ru: Отправь тело, нарушающее больше одного ограничения, и пойми, почему одного кода для формы мало.
    event: VALIDATION_REJECTED
  - id: one-body-shape
    title:
      en: Read the error body
      ru: Прочитай тело ошибки
    goal:
      en: Produce the API's error response and read it field by field — code, type, instance, traceId, retryable.
      ru: 'Получи ответ с ошибкой этого API и прочитай его по полям: code, type, instance, traceId, retryable.'
    event: ERROR_RESPONSE
  - id: the-other-half-is-the-log
    title:
      en: 'Log the other half'
      ru: 'Залогируй вторую половину'
    goal:
      en: Fail a request and read the log line — which level, with or without a stack, and what joins it to the client's copy.
      ru: 'Сломай запрос и прочитай строку лога: какой уровень, со стеком или без и что связывает её с копией клиента.'
    event: ERROR_LOGGED
  - id: leak-the-inside
    title:
      en: 'Ship the stack trace'
      ru: 'Отправь стек наружу'
    goal:
      en: Answer with the raw exception and see exactly what a caller learns about your inside.
      ru: Ответь сырым исключением и посмотри, что именно вызывающий узнаёт о ваших внутренностях.
    event: INTERNALS_LEAKED
  - id: swallow-an-error
    title:
      en: 'Answer a failure with 200'
      ru: 'Ответь на сбой двумя сотнями'
    goal:
      en: Catch the exception inside the handler, report success, and see who stops noticing the outage.
      ru: Перехвати исключение внутри обработчика, отчитайся об успехе и посмотри, кто перестаёт замечать аварию.
    event: ERROR_SWALLOWED
  - id: read-it-as-a-client
    title:
      en: 'Review the contract'
      ru: 'Проверь контракт'
    goal:
      en: Review the catalog as a whole — how many codes, over how many statuses, with what still unmapped.
      ru: Проверь каталог целиком — сколько кодов, на скольких статусах и что осталось неотображённым.
    event: CONTRACT_REVIEW

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: how-you-manage-errors
    en: How would you manage errors in an API and provide error codes? Walk through the decisions, from the exception to what the client reads.
    ru: Как ты организуешь работу с ошибками в API и коды ошибок? Пройди по решениям — от исключения до того, что читает клиент.
  - id: status-vs-error-code
    en: You already return an HTTP status. Why does the response also need your own error code?
    ru: Ты уже возвращаешь HTTP-статус. Зачем ответу ещё и собственный код ошибки?
  - id: designing-a-code
    en: What does a good error code look like, and what makes one impossible to change later?
    ru: Как выглядит хороший код ошибки и что делает его неизменяемым в дальнейшем?
  - id: where-mapping-lives
    en: Where does the mapping from exception to HTTP status live in a Spring application, and why there?
    ru: Где в Spring-приложении живёт отображение исключения в HTTP-статус и почему именно там?
  - id: error-body-fields
    en: What exactly is in your error response body? Name every field and say who reads it.
    ru: Что именно лежит в теле ответа с ошибкой? Назови каждое поле и скажи, кто его читает.
  - id: four-hundred-vs-four-twenty-two
    en: When do you answer 400 and when 422? And 404 versus 403 for something the caller may not see?
    ru: Когда ты отвечаешь 400, а когда 422? И 404 против 403 для того, что вызывающему видеть не положено?
  - id: validation-error-shape
    en: A form sends five fields and three are wrong. What does the response look like?
    ru: Форма отправляет пять полей, три из них неверны. Как выглядит ответ?
  - id: never-two-hundred-with-an-error
    en: 'A colleague returns 200 with ''{"success": false}''. Give the concrete costs of that choice.'
    ru: 'Коллега возвращает 200 с «{"success": false}». Назови конкретные издержки такого решения.'
  - id: what-not-to-expose
    en: What must never appear in an error response, and where does that information go instead?
    ru: Что никогда не должно появляться в ответе с ошибкой и куда эта информация уходит вместо этого?
  - id: correlation-id
    en: 'A user reports «it failed around three o''clock». What in your design lets you find that request?'
    ru: 'Пользователь сообщает: «сломалось где-то около трёх». Что в твоём дизайне позволяет найти этот запрос?'
  - id: logging-levels-for-errors
    en: At which log level do you record a 400, and at which a 500? What do you alert on?
    ru: На каком уровне логирования ты записываешь 400, а на каком 500? На что настраиваешь оповещения?
  - id: telling-the-client-to-retry
    en: How does a client know whether retrying is worth it, and what stops a retry storm?
    ru: Как клиент понимает, стоит ли повторять запрос, и что останавливает шторм повторов?
  - id: checked-vs-unchecked-in-services
    en: Do your services throw checked or unchecked exceptions, and how does that interact with transactions?
    ru: Твои сервисы бросают проверяемые или непроверяемые исключения и как это связано с транзакциями?
  - id: domain-exception-vs-responsestatusexception
    en: Would you throw ResponseStatusException from a service? What do you gain and what do you couple?
    ru: Ты будешь бросать ResponseStatusException из сервиса? Что ты выигрываешь и что связываешь между собой?
  - id: errors-across-services
    en: A downstream service returns an error to yours. How do you decide what your caller sees?
    ru: Нижестоящий сервис вернул твоему ошибку. Как ты решаешь, что увидит твой вызывающий?
  - id: evolving-the-error-contract
    en: How do you add, change or remove an error code once clients already depend on it?
    ru: Как добавить, изменить или удалить код ошибки, когда клиенты уже на него полагаются?
  - id: problem-details-standard
    en: What is RFC 7807 / RFC 9457 problem+json, and would you use it or your own shape?
    ru: Что такое problem+json из RFC 7807 / RFC 9457 и ты будешь использовать его или собственную форму?
  - id: partial-failure
    en: A bulk request half-succeeds. What status, and what body?
    ru: Массовый запрос выполнился наполовину. Какой статус и какое тело?
