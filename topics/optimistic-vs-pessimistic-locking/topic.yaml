summary:
  en: >
    Two strategies for keeping concurrent transactions from overwriting each
    other's changes to the same row (the lost update problem). Optimistic locking
    checks a version column at commit time and never holds a lock; pessimistic
    locking grabs a row lock up front and makes others wait. This topic covers the
    trade-offs, when to reach for each, and the exact SQL pessimistic locking
    generates — SELECT ... FOR UPDATE and FOR SHARE, plus NOWAIT and SKIP LOCKED.
  ru: >
    Две стратегии, не дающие параллельным транзакциям затирать изменения друг
    друга в одной строке (проблема потерянного обновления). Оптимистичная
    блокировка проверяет версионный столбец в момент коммита и не держит
    блокировок; пессимистичная — сразу берёт блокировку строки и заставляет
    остальных ждать. В теме разбираются компромиссы, когда что выбирать и какой
    именно SQL порождает пессимистичная блокировка — SELECT ... FOR UPDATE и
    FOR SHARE, а также NOWAIT и SKIP LOCKED.

