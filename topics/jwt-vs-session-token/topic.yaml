defaultExample: what-a-jwt-is

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: what-a-jwt-is
    title:
      en: 'What a JWT actually is'
      ru: 'Что такое JWT на самом деле'
    file: 01-what-a-jwt-is.java
    explanation:
      en: >
        Three dotted segments, and the decode step needs no key, no permission and
        no server — base64url is an encoding, not a cipher. Then the verification:
        the service recomputes the signature from the bytes it received and gets a
        match, with zero lookups. Watch the byte count too; that is what every
        request now carries.
      ru: >
        Три сегмента через точку — и шаг расшифровки не требует ни ключа, ни
        разрешения, ни сервера: base64url — это кодирование, а не шифр. Затем
        проверка: сервис пересчитывает подпись по полученным байтам и получает
        совпадение, без единого обращения к хранилищу. Обратите внимание и на
        число байт — именно столько теперь везёт каждый запрос.
  - id: signature-not-secrecy
    title:
      en: 'Signed, not secret'
      ru: 'Подписан, а не секретен'
    file: 02-signature-not-secrecy.java
    explanation:
      en: >
        Editing a claim is trivial; producing a signature for it is not, and that
        asymmetry is the entire security model. Then the classic bug: 'alg' is a
        field inside the value being checked, so a verifier that obeys it will
        accept an unsigned document. The same forgery, twice, against two
        verifiers.
      ru: >
        Изменить claim элементарно, а выпустить для него подпись — нет, и вся
        модель безопасности держится на этой асимметрии. Дальше классическая
        ошибка: «alg» — это поле внутри проверяемого значения, поэтому
        проверяющий, который его слушается, примет неподписанный документ. Одна и
        та же подделка дважды, против двух проверяющих.
  - id: no-lookup-at-all
    title:
      en: 'Three services, no shared store'
      ru: 'Три сервиса, без общего хранилища'
    file: 03-no-lookup-at-all.java
    explanation:
      en: >
        The strongest argument for JWTs, shown rather than asserted: three
        independent services accept the same credential and not one of them asks
        anybody anything. Then the same three on session ids, where every request
        is a lookup against one shared store — a dependency and a bottleneck that
        grows with the service count.
      ru: >
        Самый сильный аргумент за JWT, показанный, а не заявленный: три независимых
        сервиса принимают одни и те же учётные данные, и ни один ни у кого ничего
        не спрашивает. Затем те же три на идентификаторах сессий, где каждый запрос
        — обращение к одному общему хранилищу: зависимость и узкое место, растущие
        вместе с числом сервисов.
  - id: the-opaque-id
    title:
      en: 'The opaque session id'
      ru: 'Непрозрачный идентификатор сессии'
    file: 04-the-opaque-id.java
    explanation:
      en: >
        Decoding it produces nothing, because there is nothing in it: an opaque id
        is not encoded, it is meaningless, and a thief who takes it learns only
        that they hold a session id. The lookup you pay for on every request is
        what makes the last two steps work — logout is a DELETE, and it lands
        immediately.
      ru: >
        Расшифровка не даёт ничего, потому что внутри ничего и нет: непрозрачный
        идентификатор не закодирован, он бессмыслен, и укравший узнает лишь то,
        что держит идентификатор сессии. Обращение к хранилищу, за которое вы
        платите на каждом запросе, — это то, что заставляет работать два последних
        шага: выход — это DELETE, и он действует сразу.
  - id: logout-does-not-work
    title:
      en: 'Log out, and nothing happens'
      ru: '«Выйти» — и ничего не происходит'
    file: 05-logout-does-not-work.java
    explanation:
      en: >
        The single best question to ask about any token design. Every check a
        stateless verifier performs still passes after logout, and none of them can
        express "the user asked us to stop". Time closes the window on its own,
        which is why 'exp' is short — and a deny-list closes it now, by quietly
        putting the state back.
      ru: >
        Лучший вопрос, который можно задать про любую схему с токенами. После
        выхода все проверки, которые делает проверяющий без состояния, продолжают
        проходить, и ни одна не умеет выразить «пользователь попросил прекратить».
        Окно закрывает само время — поэтому «exp» делают коротким, — а список
        отозванных закрывает его сейчас, тихо вернув состояние.
  - id: claims-go-stale
    title:
      en: 'The token says admin; the database disagrees'
      ru: 'В токене admin, а база не согласна'
    file: 06-claims-go-stale.java
    explanation:
      en: >
        A JWT is a snapshot of facts that were true when it was signed, and every
        claim in it is stale by design until it expires. Watch a demotion and then
        a disabled account change nothing the verifier can see. The session run
        below carries no claims at all, so there is nothing to go stale.
      ru: >
        JWT — это снимок фактов, верных на момент подписания, и каждый claim в нём
        устаревает by design до самого истечения срока. Посмотрите, как понижение
        в правах, а затем и отключение аккаунта не меняют ничего из того, что
        видит проверяющий. В прогоне с сессией ниже claims нет вообще, поэтому и
        устаревать нечему.
  - id: in-the-browser
    title:
      en: 'Client-server: a browser app'
      ru: 'Клиент-сервер: браузерное приложение'
    file: 07-in-the-browser.java
    explanation:
      en: >
        One first-party app and one backend, told twice. Compare the two audit
        lines: the JWT run saves lookups it did not need and pays with bytes on
        every request, a demotion nobody applied and a logout that did nothing.
        This is why the default for a browser app is still a session cookie.
      ru: >
        Одно приложение своего же домена и один бэкенд — рассказано дважды.
        Сравните две итоговые строки: прогон с JWT экономит обращения, которые и не
        были нужны, и платит байтами на каждом запросе, непроведённым понижением в
        правах и выходом, который ничего не сделал. Поэтому по умолчанию для
        браузерного приложения по-прежнему берут cookie сессии.
  - id: service-to-service
    title:
      en: 'Server-server: the aud claim'
      ru: 'Сервер-сервер: claim aud'
    file: 08-service-to-service.java
    explanation:
      en: >
        No browser, no cookie, nobody pressing "log out" — the case JWTs were made
        for. The middle step is the one to remember: a perfectly valid signature is
        refused because the token was addressed elsewhere. Without 'aud', handing
        your token to one service lets it act as you against every other one.
      ru: >
        Ни браузера, ни cookie, ни человека, нажимающего «выйти», — случай, ради
        которого JWT и придуманы. Запомнить стоит средний шаг: совершенно
        корректная подпись отклонена, потому что токен был адресован другому. Без
        «aud», отдав токен одному сервису, вы позволяете ему действовать от вашего
        имени против всех остальных.

