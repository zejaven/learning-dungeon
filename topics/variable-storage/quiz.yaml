# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: store-primitive
    title:
      en: Store a value on the stack
      ru: Сохрани значение на стеке
    goal:
      en: Run the primitive example so a value is stored directly in a stack slot.
      ru: Запусти пример с примитивом, чтобы значение легло прямо в слот на стеке.
    event: MEM_PRIMITIVE
  - id: allocate-object
    title:
      en: Put an object on the heap
      ru: Положи объект в кучу
    goal:
      en: Create an object with new so a variable holds a reference to the heap.
      ru: Создай объект через new, чтобы переменная хранила ссылку на кучу.
    event: MEM_NEW
  - id: alias-reference
    title:
      en: Make two names share one object
      ru: Сделай два имени одним объектом
    goal:
      en: Copy a reference into a second variable so both point at the same object.
      ru: Скопируй ссылку во вторую переменную, чтобы обе указывали на один объект.
    event: MEM_COPY_REFERENCE
  - id: mutate-shared
    title:
      en: Mutate a shared object
      ru: Измени общий объект
    goal:
      en: Change a field through one reference and see it through the alias too.
      ru: Измени поле через одну ссылку и увидь это через алиас.
    event: MEM_MUTATE
  - id: pass-by-value
    title:
      en: Pass an argument to a method
      ru: Передай аргумент в метод
    goal:
      en: Call a method so its parameter receives a copy of the reference.
      ru: Вызови метод, чтобы его параметр получил копию ссылки.
    event: MEM_CALL

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: value-vs-reference
    en: When you declare a variable in Java, what exactly does it store, and where?
    ru: Когда ты объявляешь переменную в Java, что именно она хранит и где?
  - id: primitive-vs-object-location
    en: Where does a primitive's value live versus where an object lives?
    ru: Где находится значение примитива, а где — сам объект?
  - id: copy-semantics
    en: What is the difference between copying a primitive and copying a reference?
    ru: В чём разница между копированием примитива и копированием ссылки?
  - id: pass-by-value
    en: Is Java pass-by-value or pass-by-reference? Explain with an object argument.
    ru: Java передаёт по значению или по ссылке? Объясни на примере объекта-аргумента.
  - id: null-meaning
    en: What does a reference variable hold when it is null?
    ru: Что хранит ссылочная переменная, когда она равна null?
  - id: becomes-garbage
    en: After you reassign a reference, what happens to the object it used to point at?
    ru: После переприсваивания ссылки что происходит с объектом, на который она указывала?
