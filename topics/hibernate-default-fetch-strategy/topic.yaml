summary:
  en: >
    What fetch strategy JPA/Hibernate uses by default when you load an entity that
    has associations. The rule splits by cardinality: to-one associations
    (@ManyToOne, @OneToOne) default to EAGER, while to-many associations
    (@OneToMany, @ManyToMany) default to LAZY. Covers how LAZY uses proxies, why
    the defaults are dangerous (N+1, LazyInitializationException), and the
    recommended practice of making everything LAZY and fetching explicitly.
  ru: >
    Какую стратегию загрузки JPA/Hibernate использует по умолчанию, когда вы
    загружаете сущность со связями. Правило зависит от кардинальности: связи
    «к одному» (@ManyToOne, @OneToOne) по умолчанию EAGER, а связи «ко многим»
    (@OneToMany, @ManyToMany) по умолчанию LAZY. Разбираем, как LAZY использует
    прокси, чем опасны значения по умолчанию (N+1, LazyInitializationException) и
    почему рекомендуется делать всё LAZY и загружать связи явно.

