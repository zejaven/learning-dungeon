summary: >
  Как отвечать на вопрос «как вы пользовались Postman»: три уровня — ручная
  отправка запросов, написание проверок ответов, автоматизация прогонов.
  Переменные в Postman: зачем нужны, уровни (глобальные, окружения,
  коллекции, локальные) и когда какие применять, приоритет при одинаковых
  именах (локальная > окружение > коллекция > глобальная), pre-request и
  post-response скрипты, что выполняется первым при запуске коллекции,
  прогоны через Collection Runner и Newman в CI.

assistantExample: 'например: Глобальная и локальная переменные в Postman имеют одинаковое имя — какая из них будет использована?'

missionsFile: quiz.yaml
