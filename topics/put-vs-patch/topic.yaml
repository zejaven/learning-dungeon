id: put-vs-patch
title:
  en: 'PUT vs PATCH'
  ru: 'PUT против PATCH'
category:
  en: REST / API Design
  ru: REST / Проектирование API
type: HTTP
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: rest
difficulty: 1
catalogId: rest-2
summary:
  en: >
    PUT and PATCH both change an existing resource, but they say different
    things. PUT sends the whole representation — "make this URL hold exactly
    this" — so a field the body forgot is not left alone, it is wiped. PATCH
    sends only the change, so unmentioned fields keep their values. PUT is
    required to be idempotent and may create a resource that does not exist yet;
    PATCH is not guaranteed to be idempotent (an "append" operation applied twice
    appends twice) and has nothing to merge into when the resource is missing.
    The traps are the partial PUT that silently deletes fields, the assumption
    that PATCH is always idempotent, and JSON Merge Patch treating an explicit
    null as "remove this member".
  ru: >
    PUT и PATCH оба изменяют существующий ресурс, но говорят разное. PUT
    отправляет представление целиком — «пусть по этому URL лежит именно это», —
    поэтому поле, о котором тело забыло, не остаётся прежним, а стирается. PATCH
    отправляет только изменение, и неупомянутые поля сохраняют свои значения. PUT
    обязан быть идемпотентным и может создать ещё не существующий ресурс; PATCH
    идемпотентным быть не обязан (операция «добавить», применённая дважды,
    добавит дважды), а при отсутствующем ресурсе ему просто не с чем сливаться.
    Ловушки: частичный PUT, который молча удаляет поля; уверенность, что PATCH
    всегда идемпотентен; и правило JSON Merge Patch, по которому явный null
    означает «удалить поле».

# Visual primitives this topic's visualizer composes (frontend).
primitives:
  - BoxGroup

defaultExample: put-drops-omitted

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: put-replaces
    title:
      en: PUT sends everything
      ru: PUT отправляет всё
    file: 01-put-replaces.java
    explanation:
      en: >
        The honest PUT. The client sends the complete representation it wants
        stored, changes two fields inside it, and the resource ends up with
        exactly those four fields. Nothing is lost — because nothing was left
        out.
      ru: >
        Честный PUT. Клиент отправляет полное представление, которое хочет
        сохранить, меняет в нём два поля, и в ресурсе остаются ровно эти четыре
        поля. Ничего не потеряно — потому что ничего не было пропущено.
  - id: put-drops-omitted
    title:
      en: 'PUT with a partial body (trap)'
      ru: 'PUT с частичным телом (ловушка)'
    file: 02-put-drops-omitted.java
    explanation:
      en: >
        The bug every team ships once. The client only wants to change the role,
        so it sends only the role — and PUT reads that as "the resource should
        consist of this and nothing else". Three fields disappear, and the
        response is a cheerful 200 OK.
      ru: >
        Баг, который каждая команда выкатывает хотя бы раз. Клиент хочет изменить
        только роль, поэтому отправляет только роль — а PUT читает это как «ресурс
        должен состоять из этого и больше ни из чего». Три поля исчезают, и в
        ответ приходит бодрый 200 OK.
  - id: patch-merges
    title:
      en: PATCH sends only the change
      ru: PATCH отправляет только изменение
    file: 03-patch-merges.java
    explanation:
      en: >
        The same intent expressed correctly. The body names one member, the
        server merges it into the stored representation, and everything the body
        did not mention is left exactly as it was.
      ru: >
        То же намерение, выраженное правильно. Тело называет одно поле, сервер
        вливает его в хранимое представление, а всё, о чём тело не упомянуло,
        остаётся ровно таким же.
  - id: idempotency
    title:
      en: Send it twice
      ru: Отправь дважды
    file: 04-idempotency.java
    explanation:
      en: >
        Idempotency is about the state you end up in, not about the response. The
        same full PUT twice and the same merge PATCH twice both land on the same
        resource. A PATCH that carries an operation — append this tag — lands
        somewhere new every time.
      ru: >
        Идемпотентность — про состояние, в котором вы оказались, а не про ответ.
        Один и тот же полный PUT дважды и один и тот же merge PATCH дважды
        приводят к одному и тому же ресурсу. А PATCH, несущий операцию —
        «добавь этот тег», — каждый раз приводит в новое место.
  - id: merge-patch-null
    title:
      en: 'null means "delete"'
      ru: 'null означает «удалить»'
    file: 05-merge-patch-null.java
    explanation:
      en: >
        In JSON Merge Patch an explicit null is the way to remove a member — which
        also means merge patch cannot store a null value. When you need to
        distinguish "clear this" from "set this to null", you need JSON Patch,
        where the operation is named instead of implied.
      ru: >
        В JSON Merge Patch явный null — это способ удалить поле, а значит, merge
        patch не может сохранить значение null. Когда нужно различать «очисти
        это» и «поставь сюда null», нужен JSON Patch, где операция названа явно,
        а не подразумевается.
  - id: create-and-missing
    title:
      en: When the resource is not there
      ru: Когда ресурса нет
    file: 06-create-and-missing.java
    explanation:
      en: >
        PATCH describes a change to an existing representation, so an absent
        resource is a 404. PUT describes the final state, so the server can
        simply create it — 201 Created — which is why PUT is the method you can
        point at a client-chosen URL.
      ru: >
        PATCH описывает изменение существующего представления, поэтому
        отсутствующий ресурс — это 404. PUT описывает конечное состояние, поэтому
        сервер может просто создать его — 201 Created; именно поэтому PUT можно
        направить на URL, выбранный клиентом.
  - id: concurrent-edit
    title:
      en: Two editors, one resource
      ru: Два редактора, один ресурс
    file: 07-concurrent-edit.java
    explanation:
      en: >
        A full-body PUT built from a copy read a minute ago quietly reverts
        whatever changed in between — the classic lost update. An If-Match header
        turns that silent revert into a 412 Precondition Failed, which is the
        only reliable difference here; PATCH narrows the blast radius but does not
        remove it.
      ru: >
        PUT с полным телом, собранным по копии, прочитанной минуту назад, тихо
        откатывает всё, что изменилось за это время, — классическая потеря
        обновления. Заголовок If-Match превращает этот тихий откат в 412
        Precondition Failed, и это здесь единственное надёжное отличие; PATCH
        сужает зону поражения, но не убирает её.

