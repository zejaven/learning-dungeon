missions:
  - id: show-unsafe-race
    title:
      en: Show unsafe lazy race
      ru: Покажи небезопасную lazy race
    goal:
      en: Run a naive lazy Singleton path where two threads both create an instance.
      ru: Запусти наивный lazy Singleton path, где два threads оба создают экземпляр.
    event: SINGLETON_DUPLICATE_CREATED
  - id: serialize-with-synchronized
    title:
      en: Serialize access
      ru: Выстрой доступ в очередь
    goal:
      en: Use a synchronized getInstance() path that takes the class lock before construction.
      ru: Используй synchronized getInstance() path, который берёт class lock перед созданием.
    event: SINGLETON_SYNCHRONIZED_LOCK
  - id: double-check-inside-lock
    title:
      en: Check twice
      ru: Проверь дважды
    goal:
      en: Run double-checked locking and reach the second null check inside the lock.
      ru: Запусти double-checked locking и дойди до второй проверки null внутри lock.
    event: SINGLETON_DCL_SECOND_CHECK
  - id: publish-with-volatile
    title:
      en: Publish with volatile
      ru: Опубликуй через volatile
    goal:
      en: Publish the constructed instance through a volatile field.
      ru: Опубликуй созданный экземпляр через volatile поле.
    event: SINGLETON_VOLATILE_PUBLISH
  - id: use-enum-singleton
    title:
      en: Use enum Singleton
      ru: Используй enum Singleton
    goal:
      en: Access the JVM-created enum constant as the Singleton instance.
      ru: Обратись к enum-константе, созданной JVM, как к экземпляру Singleton.
    event: SINGLETON_ENUM_ACCESS

bossFight:
  - id: singleton-purpose
    en: What problem does the Singleton pattern solve, and what tradeoff does it introduce?
    ru: Какую проблему решает паттерн Singleton и какой компромисс он добавляет?
  - id: private-constructor-static-access
    en: What are the core parts of a classic Java Singleton implementation?
    ru: Из каких основных частей состоит классическая реализация Singleton в Java?
  - id: unsafe-lazy-race
    en: Why can a naive lazy Singleton create more than one instance under concurrency?
    ru: Почему наивный lazy Singleton может создать больше одного экземпляра при concurrency?
  - id: dcl-volatile
    en: Why does double-checked locking require the instance field to be volatile?
    ru: Почему double-checked locking требует, чтобы поле instance было volatile?
  - id: synchronized-vs-dcl
    en: Compare synchronized getInstance() with double-checked locking.
    ru: Сравни synchronized getInstance() и double-checked locking.
  - id: enum-advantages
    en: Why is enum Singleton often recommended in Java?
    ru: Почему enum Singleton часто рекомендуют в Java?
  - id: spring-singleton-trap
    en: How is a Spring singleton bean different from a GoF Singleton?
    ru: Чем Spring singleton bean отличается от GoF Singleton?
