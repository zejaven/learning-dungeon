bossFight:
  - id: inspect-device-requests
    en: 'How would you inspect the network requests a mobile app sends from a real device? Walk through the full setup with a sniffer like Charles or Proxyman.'
    ru: 'Как посмотреть сетевые запросы, которые мобильное приложение отправляет с реального устройства? Опишите всю настройку со сниффером вроде Charles или Proxyman.'
  - id: https-certificate-pinning
    en: 'You configured the proxy but see no app traffic, or only encrypted noise. What are the likely causes, and what role do the root certificate and SSL pinning play?'
    ru: 'Вы настроили proxy, но трафика приложения не видно или виден только шифрованный шум. Каковы вероятные причины и какую роль играют root-сертификат и SSL pinning?'
  - id: read-logs-per-platform
    en: 'How do you read logs on iOS, Android, and the backend? Which tools would you name for each, and why is a platform-by-platform answer valued?'
    ru: 'Как посмотреть логи iOS, Android и backend? Какие инструменты назовёте для каждого и почему ценится ответ по платформам?'
  - id: post-release-health
    en: 'A release just went live. How do you find out whether everything is fine for users? Which metrics and tools would you check first?'
    ru: 'Произошёл релиз. Как понять, что у пользователей всё в порядке? Какие метрики и инструменты проверите в первую очередь?'
  - id: device-selection-statistics
    en: 'How would you choose devices for testing an app in Russia versus China? What data sources would you use to build the device matrix?'
    ru: 'Как выберете устройства для тестирования приложения в России и в Китае? Какие источники данных используете для составления device matrix?'
  - id: semver-4-21-3
    en: 'What do the numbers in app version 4.21.3 mean? What would the version become after a hotfix, and how does testing a patch release differ from a minor one?'
    ru: 'Что означают цифры в версии приложения 4.21.3? Какой станет версия после хотфикса и чем тестирование patch-релиза отличается от minor?'
  - id: fourteen-countries-regression
    en: 'Our app works in 14 countries. How would you test and regression-test it, how long would it take, and what exactly needs checking (locales, payment acquirers)?'
    ru: 'Наше приложение работает в 14 странах. Как будете тестировать и регрессить, сколько это займёт по времени и что именно нужно проверять (локали, эквайеры)?'
  - id: ios-vs-ipados
    en: 'What is the difference between iOS and iPadOS, and what does it imply for testing an app that supports iPad?'
    ru: 'В чём отличие iOS от iPadOS и что это означает для тестирования приложения с поддержкой iPad?'
