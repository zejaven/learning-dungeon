# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: meet-the-dispatchers
    title:
      en: Count the real threads
      ru: Посчитай настоящие потоки
    goal:
      en: Start a runtime and find the step that names the dispatchers — note how many threads exist before any coroutine does.
      ru: Запусти рантайм и найди шаг, где названы диспетчеры, — заметь, сколько потоков существует до появления первой корутины.
    event: RUNTIME_READY
  - id: read-the-generated-class
    title:
      en: Read what the compiler wrote
      ru: Прочитай, что написал компилятор
    goal:
      en: 'Compile a suspend fun and find the generated class: an int label, a field per surviving local, and a hidden Continuation parameter.'
      ru: 'Скомпилируй suspend fun и найди сгенерированный класс: int label, поле на каждую выживающую локальную переменную и скрытый параметр Continuation.'
    event: SUSPEND_FUN_COMPILED
  - id: jump-to-the-label
    title:
      en: 'Find the when (label) jump'
      ru: 'Найди прыжок по when (label)'
    goal:
      en: Step through the state machine and watch it write down where to come back BEFORE it makes the call that might suspend.
      ru: Пройди по машине состояний и посмотри, как она записывает, куда вернуться, ДО вызова, который может приостановиться.
    event: STATE_MACHINE_STEP
  - id: return-the-marker
    title:
      en: Return COROUTINE_SUSPENDED
      ru: Верни COROUTINE_SUSPENDED
    goal:
      en: Reach a suspension point that has no answer ready and see what happens to the JVM stack and to the thread.
      ru: Дойди до точки приостановки, у которой нет готового ответа, и увидь, что происходит со стеком JVM и с потоком.
    event: SUSPENDED
  - id: resume-where-it-stopped
    title:
      en: Resume at a statement
      ru: Возобновись с оператора
    goal:
      en: Find the step where resumeWith calls invokeSuspend on the same object again, and check that nothing re-executes from the top.
      ru: Найди шаг, где resumeWith снова вызывает invokeSuspend на том же объекте, и убедись, что ничего не выполняется заново с начала.
    event: RESUMED
  - id: hand-the-thread-over
    title:
      en: Hand the thread to the next one
      ru: Передай поток следующему
    goal:
      en: Suspend a coroutine on a one-thread dispatcher and catch the moment the freed thread picks the queued coroutine up.
      ru: Приостанови корутину на однопоточном диспетчере и поймай момент, когда освободившийся поток подхватывает корутину из очереди.
    event: DISPATCHED
  - id: wait-for-a-thread
    title:
      en: Wait in the queue
      ru: Постой в очереди
    goal:
      en: Launch more coroutines than the dispatcher has threads and find the one that is ready but not running.
      ru: Запусти больше корутин, чем у диспетчера потоков, и найди ту, что готова, но не выполняется.
    event: QUEUED
  - id: hold-a-thread-hostage
    title:
      en: Block instead of suspending
      ru: Заблокируй вместо приостановки
    goal:
      en: Call something that is not a suspend function inside a coroutine and see what it does to the worker thread.
      ru: Вызови внутри корутины что-то, что не является suspend-функцией, и посмотри, что это делает с рабочим потоком.
    event: THREAD_BLOCKED
  - id: starve-the-pool
    title:
      en: Starve Dispatchers.Default
      ru: Заморозь Dispatchers.Default
    goal:
      en: Block every thread of the CPU dispatcher at once and work out why nothing in production would tell you about it.
      ru: Заблокируй все потоки CPU-диспетчера разом и разберись, почему в продакшене об этом никто не сообщит.
    event: POOL_STARVED
  - id: move-the-blocking-call
    title:
      en: Move it to Dispatchers.IO
      ru: Перенеси на Dispatchers.IO
    goal:
      en: Use withContext to change dispatchers mid-coroutine and confirm it is a suspension, not a second coroutine.
      ru: Смени диспетчер посреди корутины через withContext и убедись, что это приостановка, а не вторая корутина.
    event: CONTEXT_SWITCHED
  - id: burn-a-core
    title:
      en: Run a loop that never suspends
      ru: Запусти цикл, который не приостанавливается
    goal:
      en: Do pure computation inside a coroutine and check how much of the dispatcher is available to anyone else while it runs.
      ru: Выполни внутри корутины чистое вычисление и проверь, сколько диспетчера остаётся другим, пока оно идёт.
    event: CPU_WORK
  - id: wait-for-the-children
    title:
      en: Make a scope wait
      ru: Заставь область подождать
    goal:
      en: Reach the closing brace of a coroutineScope while children are still active, and see what the scope does instead of returning.
      ru: Дойди до закрывающей скобки coroutineScope, пока дети ещё активны, и посмотри, что область делает вместо возврата.
    event: SCOPE_JOINED
  - id: fail-one-child
    title:
      en: Throw inside a coroutine
      ru: Брось исключение внутри корутины
    goal:
      en: Let a child throw and find where the exception goes — it is not a Thread.UncaughtExceptionHandler.
      ru: Дай ребёнку упасть и найди, куда уходит исключение, — это не Thread.UncaughtExceptionHandler.
    event: COROUTINE_FAILED
  - id: take-the-siblings-down
    title:
      en: Take the siblings down with it
      ru: Утяни за собой соседей
    goal:
      en: Fail one child of a coroutineScope and check what happened to the request that was already in flight next to it.
      ru: Урони одного ребёнка coroutineScope и проверь, что стало с запросом, который летел рядом с ним.
    event: CHILDREN_CANCELLED
  - id: isolate-a-failure
    title:
      en: Keep a failure local
      ru: Удержи падение на месте
    goal:
      en: Do the same inside a supervisorScope and work out what you now have to do with the exception yourself.
      ru: Сделай то же самое внутри supervisorScope и разберись, что теперь придётся делать с исключением самому.
    event: SUPERVISOR_ISOLATED
  - id: ask-it-to-stop
    title:
      en: 'Call cancel() and change nothing'
      ru: 'Вызови cancel() и ничего не измени'
    goal:
      en: Cancel a running coroutine and read its state on the very next step — cancel() is not stop().
      ru: Отмени выполняющуюся корутину и прочитай её состояние на следующем же шаге — cancel() это не stop().
    event: CANCELLATION_REQUESTED
  - id: deliver-the-cancellation
    title:
      en: Deliver it at a suspension point
      ru: Достави её в точке приостановки
    goal:
      en: Cancel a coroutine that is suspended and find out what its continuation is resumed with instead of a value.
      ru: Отмени приостановленную корутину и выясни, чем возобновляют её continuation вместо значения.
    event: CANCELLED_AT_SUSPENSION_POINT
  - id: be-ignored
    title:
      en: Be ignored by a tight loop
      ru: Будь проигнорирован тесным циклом
    goal:
      en: Cancel a coroutine that only computes and watch it finish anyway — then find the one line that would have stopped it.
      ru: Отмени корутину, которая только считает, и посмотри, как она всё равно досчитает, — а затем найди строку, которая бы её остановила.
    event: CANCELLATION_IGNORED
  - id: orphan-a-coroutine
    title:
      en: Leave one with no parent
      ru: Оставь одну без родителя
    goal:
      en: Launch something in GlobalScope, cancel the scope that should have owned it, and see what survives.
      ru: Запусти что-нибудь в GlobalScope, отмени область, которая должна была им владеть, и посмотри, что выживет.
    event: GLOBAL_SCOPE_LEAK
  - id: start-two-before-awaiting
    title:
      en: Start both before awaiting either
      ru: Запусти обе до первого await
    goal:
      en: Use async twice and check that the requests overlap even though the dispatcher has a single thread.
      ru: Используй async дважды и проверь, что запросы перекрываются, хотя у диспетчера всего один поток.
    event: ASYNC_STARTED
  - id: price-a-hundred-thousand
    title:
      en: Price 100 000 concurrent tasks
      ru: Оцени 100 000 конкурентных задач
    goal:
      en: Compare threads, coroutines and virtual threads for the same workload and read the memory and OS-thread columns.
      ru: Сравни потоки, корутины и виртуальные потоки на одной нагрузке и прочитай колонки памяти и потоков ОС.
    event: SCALE_COMPARED
  - id: read-the-audit
    title:
      en: Read the audit
      ru: Прочитай итог
    goal:
      en: Finish a run and compare the two numbers that matter — peak live coroutines against worker threads.
      ru: Заверши прогон и сравни два числа, которые важны, — пик живых корутин против рабочих потоков.
    event: COROUTINE_AUDIT

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: how-do-coroutines-work
    en: How do Kotlin coroutines work? Explain what actually happens when a suspend function suspends.
    ru: Как работают корутины Kotlin? Объясни, что на самом деле происходит, когда suspend-функция приостанавливается.
  - id: what-is-a-coroutine
    en: Is a coroutine a thread, a lightweight thread, or something else? What is it at runtime?
    ru: Корутина — это поток, лёгкий поток или что-то ещё? Что она такое во время выполнения?
  - id: what-the-compiler-generates
    en: What does the Kotlin compiler generate for a suspend fun? Describe the class, its fields and the hidden parameter.
    ru: Что компилятор Kotlin генерирует для suspend fun? Опиши класс, его поля и скрытый параметр.
  - id: what-a-continuation-is
    en: What is a Continuation, and what does continuation-passing style have to do with coroutines?
    ru: Что такое Continuation и при чём здесь стиль передачи продолжений (CPS)?
  - id: coroutine-suspended-marker
    en: What is COROUTINE_SUSPENDED and why does returning it free the thread?
    ru: Что такое COROUTINE_SUSPENDED и почему возврат этого маркера освобождает поток?
  - id: suspend-vs-blocking
    en: What is the difference between suspending and blocking? Why does one release a thread and the other not?
    ru: В чём разница между приостановкой и блокировкой? Почему одно освобождает поток, а другое нет?
  - id: what-suspend-keyword-means
    en: What does the suspend keyword actually mean, and why can a suspend function only be called from another one?
    ru: Что на самом деле означает ключевое слово suspend и почему suspend-функцию можно вызвать только из другой такой же?
  - id: does-suspend-mean-background
    en: 'Does marking a function suspend make it run in the background? Where does its code run?'
    ru: 'Делает ли пометка suspend функцию фоновой? Где выполняется её код?'
  - id: what-a-dispatcher-does
    en: What does a CoroutineDispatcher do, and what is the difference between Default, IO and Main?
    ru: Что делает CoroutineDispatcher и чем отличаются Default, IO и Main?
  - id: blocking-call-on-default
    en: A colleague calls a JDBC query inside a coroutine on Dispatchers.Default. What happens under load, and how do you find it?
    ru: Коллега вызывает JDBC-запрос внутри корутины на Dispatchers.Default. Что произойдёт под нагрузкой и как это обнаружить?
  - id: with-context-vs-launch
    en: What is the difference between withContext, launch and async? When would you use each?
    ru: В чём разница между withContext, launch и async? Когда использовать каждое?
  - id: delay-vs-thread-sleep
    en: 'What is the difference between delay(1000) and Thread.sleep(1000) inside a coroutine?'
    ru: 'В чём разница между delay(1000) и Thread.sleep(1000) внутри корутины?'
  - id: concurrency-vs-parallelism
    en: Are coroutines concurrent or parallel? Can two coroutines run at the same instant, and on what does that depend?
    ru: Корутины конкурентны или параллельны? Могут ли две корутины выполняться в один и тот же момент и от чего это зависит?
  - id: where-async-concurrency-comes-from
    en: Two async calls followed by two awaits run concurrently, but async-await-async-await does not. Why?
    ru: Два вызова async с последующими await выполняются конкурентно, а async-await-async-await — нет. Почему?
  - id: structured-concurrency-meaning
    en: What is structured concurrency, and what does it guarantee that starting threads does not?
    ru: Что такое структурная конкурентность и что она гарантирует такого, чего не даёт запуск потоков?
  - id: coroutine-scope-and-job
    en: What is a CoroutineScope, what is a Job, and how are they related to a coroutine's lifetime?
    ru: Что такое CoroutineScope, что такое Job и как они связаны со временем жизни корутины?
  - id: coroutine-context-parts
    en: What is a CoroutineContext made of, and what happens to it when a coroutine starts a child?
    ru: Из чего состоит CoroutineContext и что с ним происходит, когда корутина запускает ребёнка?
  - id: exception-propagation
    en: An exception is thrown inside launch and nobody catches it. Where does it go?
    ru: Внутри launch бросается исключение, и его никто не ловит. Куда оно попадёт?
  - id: supervisor-scope-difference
    en: What does supervisorScope change compared with coroutineScope, and what do you give up by using it?
    ru: Что меняет supervisorScope по сравнению с coroutineScope и чем приходится за это платить?
  - id: cooperative-cancellation
    en: How does cancellation work? Why can a coroutine keep running after you call cancel() on its Job?
    ru: Как работает отмена? Почему корутина может продолжать выполняться после вызова cancel() у её Job?
  - id: making-a-loop-cancellable
    en: You have a CPU-bound loop inside a coroutine. What do you add so that cancelling it actually stops it?
    ru: У тебя внутри корутины цикл, нагружающий CPU. Что добавить, чтобы отмена действительно его остановила?
  - id: cancellation-exception-handling
    en: 'Why should you never swallow a CancellationException, and how do you run cleanup that itself suspends?'
    ru: 'Почему нельзя проглатывать CancellationException и как выполнить уборку, которая сама приостанавливается?'
  - id: why-not-global-scope
    en: What is wrong with GlobalScope.launch? What do you use instead, and why?
    ru: Что не так с GlobalScope.launch? Что использовать вместо него и почему?
  - id: run-blocking-usage
    en: What does runBlocking do, and where is it appropriate to use it?
    ru: Что делает runBlocking и где его уместно применять?
  - id: thread-locals-and-coroutines
    en: Why is a ThreadLocal unreliable inside a coroutine, and what is the coroutine equivalent?
    ru: Почему ThreadLocal ненадёжен внутри корутины и что является её аналогом?
  - id: shared-mutable-state
    en: Do coroutines make shared mutable state safe? What still has to be synchronised, and what are your options?
    ru: Делают ли корутины безопасным разделяемое изменяемое состояние? Что всё ещё нужно синхронизировать и какие есть варианты?
  - id: coroutines-vs-virtual-threads
    en: How do Kotlin coroutines compare with Java 21 virtual threads? What does each approach cost you?
    ru: Чем корутины Kotlin отличаются от виртуальных потоков Java 21? Чего стоит каждый из подходов?
  - id: how-many-coroutines-fit
    en: How many coroutines can one JVM realistically hold, and why is the answer so different from the answer for threads?
    ru: Сколько корутин реально может держать одна JVM и почему этот ответ так отличается от ответа для потоков?
  - id: timeouts-and-withtimeout
    en: How do you put a timeout on a coroutine, and what does withTimeout actually do to the coroutine it wraps?
    ru: Как поставить корутине таймаут и что withTimeout на самом деле делает с обёрнутой корутиной?
  - id: debugging-coroutines
    en: A coroutine hangs in production. What tools and techniques do you use to find out where it is suspended?
    ru: Корутина зависла в продакшене. Какими инструментами и приёмами ты выяснишь, где она приостановлена?
