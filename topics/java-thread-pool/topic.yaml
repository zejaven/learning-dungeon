id: java-thread-pool
languages: [en, ru]
title:
  en: Java Thread Pool
  ru: Пул потоков в Java
category:
  en: Java Core / Concurrency
  ru: Java Core / Многопоточность
type: CONCURRENCY
mode: trace
summary:
  en: >
    What a Java ThreadPool is, why ExecutorService reuses worker threads, how
    bounded queues create backpressure, what happens on overload, and how to
    shut a pool down without losing already accepted work.
  ru: >
    Что такое ThreadPool в Java, почему ExecutorService переиспользует worker
    threads, как ограниченные очереди создают backpressure, что происходит при
    перегрузке и как останавливать pool без потери уже принятой работы.
categoryId: concurrency
difficulty: 2
catalogId: concurrency-7
style: Real world
aiProvider: codex
aiModel: gpt-5.5

primitives:
  - ArrayGrid
  - LinkedNodes

defaultExample: basic-submit

examples:
  - id: basic-submit
    title:
      en: Basic submit
      ru: Базовая отправка
    file: 01-basic-submit.java
    explanation:
      en: >
        A fixed pool has two reusable workers. Two submitted tasks start on
        workers without creating a new Thread per task.
      ru: >
        Fixed pool имеет два переиспользуемых worker. Две отправленные задачи
        стартуют на workers без создания нового Thread для каждой задачи.
  - id: worker-reuse
    title:
      en: Worker reuse
      ru: Переиспользование worker
    file: 02-worker-reuse.java
    explanation:
      en: >
        After a worker completes one task, the same worker takes another task.
        This is the main resource-saving idea behind a ThreadPool.
      ru: >
        После завершения одной задачи тот же worker берет следующую задачу.
        Это главная идея ThreadPool для экономии ресурсов.
  - id: queue-backpressure
    title:
      en: Queue backpressure
      ru: Backpressure через очередь
    file: 03-queue-backpressure.java
    explanation:
      en: >
        When every worker is busy, extra accepted tasks wait in a bounded queue
        until a worker becomes free.
      ru: >
        Когда все workers заняты, дополнительные принятые задачи ждут в
        ограниченной очереди, пока worker не освободится.
  - id: reject-overload
    title:
      en: Reject overload
      ru: Отклонение перегрузки
    file: 04-reject-overload.java
    explanation:
      en: >
        If workers and queue slots are full, the pool rejects the next task
        instead of growing without limit.
      ru: >
        Если workers и места в очереди заполнены, pool отклоняет следующую
        задачу вместо неограниченного роста.
  - id: shutdown
    title:
      en: Shutdown
      ru: Остановка
    file: 05-shutdown.java
    explanation:
      en: >
        shutdown() stops new submissions, but already accepted work can still
        finish in an orderly way.
      ru: >
        shutdown() прекращает прием новых задач, но уже принятая работа все еще
        может корректно завершиться.

assistantExample:
  en: 'e.g. How should I choose the size and queue for an ExecutorService?'
  ru: 'например: Как выбрать размер и очередь для ExecutorService?'

missionsFile: quiz.yaml
