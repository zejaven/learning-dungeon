# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: index-vs-value-complexity
    en: What is the time complexity of finding an element in an array by index and by value?
    ru: Какова сложность поиска элемента в массиве по индексу и по значению?
  - id: why-index-is-constant
    en: Why is access by index O(1)? What formula gives the element's address?
    ru: Почему доступ по индексу — это O(1)? Какая формула даёт адрес элемента?
  - id: why-value-is-linear
    en: Why is searching by value O(n) in an unsorted array? What are the best and worst cases?
    ru: Почему поиск по значению в неотсортированном массиве — это O(n)? Каковы лучший и худший случаи?
  - id: sorted-binary-search
    en: How does sorting the array change the cost of searching by value, and what is the catch?
    ru: Как сортировка массива меняет стоимость поиска по значению и в чём подвох?
  - id: faster-value-lookup
    en: If you need fast lookup by value without sorting, what data structure would you use and at what cost?
    ru: Если нужен быстрый поиск по значению без сортировки, какую структуру данных вы выберете и какой ценой?
  - id: indexof-contains-cost
    en: What is the complexity of indexOf and contains on an ArrayList, and when does it matter?
    ru: Какова сложность indexOf и contains у ArrayList и когда это важно?
