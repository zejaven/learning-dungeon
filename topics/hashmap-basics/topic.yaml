id: hashmap-basics
title:
  en: 'HashMap: Basics and Java Implementation'
  ru: 'HashMap: основы и реализация в Java'
category:
  en: Java Core / Collections
  ru: Java Core / Коллекции
type: DATA_STRUCTURE
mode: trace
summary:
  en: >
    A beginner-friendly walk through what HashMap is, how put() and get() use
    hashCode, buckets and equals, how collisions are stored in chains, why
    resize happens after the load-factor threshold, and which key mistakes break
    lookup.
  ru: >
    Понятное введение в HashMap: что это такое, как put() и get() используют
    hashCode, бакеты и equals, как коллизии хранятся в цепочках, почему после
    порога load factor происходит resize и какие ошибки с ключами ломают поиск.
categoryId: java-collections
difficulty: 1
catalogId: java-collections-2
style: Real world
aiProvider: codex
aiModel: gpt-5.5

primitives:
  - ArrayGrid
  - LinkedNodes
  - EventLog

defaultExample: put-and-get

examples:
  - id: put-and-get
    title:
      en: put() and get()
      ru: put() и get()
    file: 01-put-and-get.java
    explanation:
      en: >
        Store one entry, then read it back. The map recomputes the same bucket
        index during get().
      ru: >
        Сохрани одну запись и прочитай её обратно. При get() мапа заново
        вычисляет тот же индекс бакета.
  - id: missing-key
    title:
      en: Missing key
      ru: Отсутствующий ключ
    file: 02-missing-key.java
    explanation:
      en: >
        get() checks the expected bucket and returns null when no equal key is
        found there.
      ru: >
        get() проверяет ожидаемый бакет и возвращает null, если там нет равного
        ключа.
  - id: collision-chain
    title:
      en: Collision chain
      ru: Цепочка коллизии
    file: 03-collision-chain.java
    explanation:
      en: >
        "Aa" and "BB" have the same hashCode in Java, so they land in one bucket
        and form a chain.
      ru: >
        У "Aa" и "BB" одинаковый hashCode в Java, поэтому они попадают в один
        бакет и образуют цепочку.
  - id: update-same-key
    title:
      en: Update same key
      ru: Обновление того же ключа
    file: 04-update-same-key.java
    explanation:
      en: >
        Putting an equal key again does not add a second node. It replaces the
        value in the existing node.
      ru: >
        Повторный put с равным ключом не добавляет второй узел. Он заменяет
        значение в уже существующем узле.
  - id: resize-threshold
    title:
      en: Resize threshold
      ru: Порог resize
    file: 05-resize-threshold.java
    explanation:
      en: >
        The default capacity is 16 and the threshold is 12. The 13th entry
        doubles the bucket array.
      ru: >
        Ёмкость по умолчанию равна 16, а порог равен 12. Тринадцатая запись
        удваивает массив бакетов.
  - id: mutable-key
    title:
      en: Mutable key trap
      ru: Ловушка изменяемого ключа
    file: 06-mutable-key.java
    explanation:
      en: >
        A key whose hashCode changes after insertion is searched in the wrong
        bucket, so get() can return null.
      ru: >
        Ключ, у которого hashCode меняется после вставки, ищется не в том
        бакете, поэтому get() может вернуть null.

assistantExample:
  en: 'e.g. What happens inside HashMap when I call put() and get()?'
  ru: 'например: Что происходит внутри HashMap при вызове put() и get()?'

missionsFile: quiz.yaml
