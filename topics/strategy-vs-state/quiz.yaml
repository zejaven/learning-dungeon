# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: core-difference
    en: Strategy and State have almost the same class diagram. What is the real difference between them?
    ru: У Strategy и State почти одинаковая диаграмма классов. В чём настоящая разница между ними?
  - id: who-switches
    en: In each pattern, who decides which concrete behaviour is used next — the client or the object itself?
    ru: Кто в каждом паттерне решает, какое конкретное поведение будет использовано дальше, — клиент или сам объект?
  - id: states-know-each-other
    en: Why do State objects typically reference each other while Strategy objects do not?
    ru: Почему объекты-состояния обычно ссылаются друг на друга, а стратегии — нет?
  - id: how-often-changes
    en: How does the frequency of switching behaviour differ between Strategy and State over an object's lifetime?
    ru: Чем отличается частота смены поведения у Strategy и State в течение жизни объекта?
  - id: when-state
    en: Give a real-world example that is clearly State rather than Strategy, and explain why.
    ru: Приведите пример из жизни, который однозначно State, а не Strategy, и объясните почему.
  - id: enum-vs-pattern
    en: When is a simple enum-and-switch state machine enough, and when would you reach for the full State pattern?
    ru: Когда достаточно простого автомата на enum и switch, а когда стоит взять полноценный паттерн State?
