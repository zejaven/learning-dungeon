id: rabbitmq-binding-vs-routing-key
languages: [en, ru]
title:
  en: Binding Key vs Routing Key in RabbitMQ
  ru: Binding key против routing key в RabbitMQ
category:
  en: Messaging
  ru: Обмен сообщениями
type: OTHER
aiProvider: claude
aiModel: claude-opus-5
categoryId: messaging
difficulty: 2
catalogId: messaging-2
summary:
  en: >
    Both are strings, but they hang on different objects. The routing key is a
    property of the message: the producer stamps it on every publish and names
    no queue. The binding key is a property of the binding between an exchange
    and a queue: the queue side declares it once, at setup time. They meet
    inside the exchange at publish time, and the exchange type is the comparison
    rule - direct means equality, topic reads the binding key as a pattern,
    fanout ignores both. Wildcards are legal only in a binding key, the relation
    between keys and queues is many-to-many, and a message that matches nothing
    is dropped silently.
  ru: >
    Оба — строки, но висят они на разных объектах. Routing key — свойство
    сообщения: продюсер ставит его на каждую публикацию и не называет ни одной
    очереди. Binding key — свойство привязки между exchange и очередью: сторона
    очереди объявляет его один раз при настройке. Встречаются они внутри
    exchange в момент публикации, а правилом сравнения служит тип exchange:
    direct требует равенства, topic читает binding key как шаблон, fanout
    игнорирует оба. Шаблоны допустимы только в binding key, связь ключей и
    очередей — многие ко многим, а сообщение, не совпавшее ни с чем, молча
    выбрасывается.

# Visual primitives this topic's visualizer composes (frontend).
primitives:
  - BoxGroup

defaultExample: two-sides

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: two-sides
    title:
      en: Two keys, two owners
      ru: Два ключа, два владельца
    file: 01-two-sides.java
    explanation:
      en: >
        The binding key is chosen by the queue side and stays on the binding;
        the routing key is stamped on each message by the producer. A direct
        exchange routes when they are equal, and drops the message when no
        binding key matches. A queue with no binding is simply unreachable.
      ru: >
        Binding key выбирает сторона очереди, и живёт он на привязке; routing key
        продюсер ставит на каждое сообщение. Direct exchange маршрутизирует,
        когда они равны, и выбрасывает сообщение, если ни один binding key не
        подошёл. Очередь без привязки просто недостижима.
  - id: many-to-many
    title:
      en: Many-to-many bindings
      ru: Привязки многие ко многим
    file: 02-many-to-many.java
    explanation:
      en: >
        Two queues bound with the same binding key each get their own copy, and
        one queue can carry several bindings to accept several kinds of message.
        Adding a consumer is a binding, not a change to the producer.
      ru: >
        Две очереди с одинаковым binding key получают каждая свою копию, а у
        одной очереди может быть несколько привязок, чтобы принимать разные виды
        сообщений. Новый потребитель — это привязка, а не правка продюсера.
  - id: topic-patterns
    title:
      en: Patterns on the binding
      ru: Шаблоны на привязке
    file: 03-topic-patterns.java
    explanation:
      en: >
        A topic exchange reads the binding key as a pattern over dot-separated
        words - one word for a star, zero or more for a hash - while the routing
        key stays a concrete string. One publish can reach three queues, two, or
        none.
      ru: >
        Topic exchange читает binding key как шаблон по словам через точку —
        звёздочка это одно слово, решётка ноль или больше, — а routing key
        остаётся конкретной строкой. Одна публикация может попасть в три
        очереди, в две или ни в одну.
  - id: wildcard-in-routing-key
    title:
      en: A wildcard that is not one
      ru: Шаблон, который не шаблон
    file: 04-wildcard-in-routing-key.java
    explanation:
      en: >
        The classic trap: a producer publishes a wildcard routing key hoping to
        reach every order queue. Wildcard characters are literal in a routing
        key, so the message matches nothing at all. Patterns belong on the
        binding side.
      ru: >
        Классическая ловушка: продюсер публикует routing key с шаблоном, надеясь
        достать все очереди заказов. В routing key символы шаблона буквальны,
        поэтому сообщение не совпадает ни с чем. Шаблоны живут на стороне
        привязки.
  - id: fanout-ignores-keys
    title:
      en: fanout ignores both keys
      ru: fanout игнорирует оба ключа
    file: 05-fanout-ignores-keys.java
    explanation:
      en: >
        A fanout exchange reads neither the routing key nor any binding key: the
        existence of the binding is the whole decision, so even an empty routing
        key reaches every bound queue. The exchange type outranks both keys.
      ru: >
        Fanout exchange не читает ни routing key, ни binding key: решает сам
        факт привязки, поэтому даже пустой routing key дойдёт до каждой
        привязанной очереди. Тип exchange важнее обоих ключей.
  - id: default-exchange
    title:
      en: The default exchange
      ru: Default exchange
    file: 06-default-exchange.java
    explanation:
      en: >
        Publishing "straight to a queue" is really the nameless default
        exchange, to which the broker binds every queue with a binding key equal
        to its name. The matching is still exact, so a typo in the name silently
        sends the message nowhere.
      ru: >
        Публикация «прямо в очередь» — на самом деле безымянный default
        exchange, к которому брокер привязывает каждую очередь с binding key,
        равным её имени. Сравнение всё так же точное, поэтому опечатка в имени
        молча отправит сообщение в никуда.
  - id: overlapping-bindings
    title:
      en: Overlapping bindings
      ru: Пересекающиеся привязки
    file: 07-overlapping-bindings.java
    explanation:
      en: >
        Two binding keys of the same queue can both match one message, yet the
        queue still receives exactly one copy. Duplicates across queues are
        normal, duplicates inside one queue are not.
      ru: >
        Два binding key одной очереди могут совпасть с одним сообщением, но
        очередь всё равно получит ровно одну копию. Дубли между очередями — это
        норма, дубли внутри одной очереди — нет.

