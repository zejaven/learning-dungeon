# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: locals-on-stack
    title:
      en: Put a local on the stack
      ru: Положи локальную переменную на стек
    goal:
      en: Run the stack example so a primitive value is stored directly in a stack frame.
      ru: Запусти пример со стеком, чтобы значение примитива легло прямо в кадр стека.
    event: MEM_PRIMITIVE
  - id: object-on-heap
    title:
      en: Put an object on the heap
      ru: Положи объект в кучу
    goal:
      en: Create an object with new so it lives on the heap and the variable holds a reference.
      ru: Создай объект через new, чтобы он жил в куче, а переменная хранила ссылку.
    event: MEM_NEW
  - id: frame-per-call
    title:
      en: Push a frame on a call
      ru: Добавь кадр при вызове
    goal:
      en: Call a method so a new frame is pushed onto the same thread's stack.
      ru: Вызови метод, чтобы новый кадр добавился в стек того же потока.
    event: MEM_CALL
  - id: frame-pops-on-return
    title:
      en: Pop the frame on return
      ru: Сними кадр при возврате
    goal:
      en: Return from the method so its frame and locals disappear from the stack.
      ru: Вернись из метода, чтобы его кадр и локальные переменные исчезли со стека.
    event: MEM_RETURN
  - id: share-a-heap-object
    title:
      en: Share one heap object
      ru: Раздели один объект в куче
    goal:
      en: Copy a reference so two stack slots point at the same heap object.
      ru: Скопируй ссылку, чтобы два слота стека указывали на один объект в куче.
    event: MEM_COPY_REFERENCE
  - id: make-heap-garbage
    title:
      en: Leave a heap object as garbage
      ru: Оставь объект в куче мусором
    goal:
      en: Repoint a reference so the object it used to point at becomes unreachable.
      ru: Переприсвой ссылку, чтобы объект, на который она указывала, стал недостижим.
    event: MEM_REASSIGN

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: memory-areas-overview
    en: How does the JVM divide runtime memory into areas, and which are per-thread versus shared?
    ru: Как JVM делит память времени выполнения на области и какие из них приватны для потока, а какие общие?
  - id: stack-vs-heap-difference
    en: What is the core difference between the stack and the heap?
    ru: В чём ключевое отличие стека от кучи?
  - id: what-lives-where
    en: When you write `int a = 5;` and `Point p = new Point();`, what goes on the stack and what goes on the heap?
    ru: Когда ты пишешь `int a = 5;` и `Point p = new Point();`, что попадает на стек, а что — в кучу?
  - id: stack-lifetime
    en: How and when is stack memory reclaimed compared to heap memory?
    ru: Как и когда освобождается память стека по сравнению с памятью кучи?
  - id: heap-sharing-threads
    en: Why can two threads share a heap object but never share each other's stack frames?
    ru: Почему два потока могут делить объект в куче, но никогда не делят кадры стека друг друга?
  - id: stackoverflow-vs-oom
    en: What causes a StackOverflowError versus an OutOfMemoryError, and what does that tell you about the two areas?
    ru: Что вызывает StackOverflowError, а что — OutOfMemoryError, и что это говорит о двух областях?
  - id: metaspace-role
    en: Besides the stack and the heap, what is the Metaspace for?
    ru: Помимо стека и кучи, для чего нужен Metaspace?
