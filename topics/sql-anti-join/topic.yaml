summary:
  en: >
    Finding rows that have NO related records — an anti-join. You LEFT JOIN the two
    tables so unmatched rows survive with NULLs on the right side, then keep only
    those NULL rows with IS NULL. You practise the basic anti-join, a second one on
    another table, and the classic trap of putting an extra condition in ON versus
    WHERE. You write the queries against a seeded database and see the result table.
  ru: >
    Поиск строк, у которых НЕТ связанных записей — anti-join. Вы делаете LEFT JOIN
    двух таблиц, чтобы несопоставленные строки остались с NULL по правой стороне, и
    оставляете только эти NULL-строки через IS NULL. Вы отрабатываете базовый
    anti-join, ещё один на другой таблице и классическую ловушку с дополнительным
    условием в ON против WHERE. Запросы пишутся к засеянной базе, и вы видите
    таблицу результата.

assistantExample:
  en: "e.g. Why can NOT IN with a NULL in the subquery return zero rows?"
  ru: "например: Почему NOT IN с NULL в подзапросе может вернуть ноль строк?"

