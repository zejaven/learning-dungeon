# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: repeat-for-free
    title:
      en: Repeat a read for free
      ru: Повтори чтение бесплатно
    goal:
      en: Send a safe method and confirm the server holds exactly what it held before the request.
      ru: Отправь безопасный метод и убедись, что на сервере осталось ровно то же, что было до запроса.
    event: SAFE_READ
  - id: lose-the-answer
    title:
      en: Lose the answer
      ru: Потеряй ответ
    goal:
      en: Make the server apply a request whose response never reaches the client, so the client cannot tell what happened.
      ru: Добейся, чтобы сервер применил запрос, ответ на который не дошёл до клиента и тот не знает, что произошло.
    event: RESPONSE_LOST
  - id: send-it-again
    title:
      en: Send it again
      ru: Отправь ещё раз
    goal:
      en: Retry the identical request after a timeout — the only recovery a client has.
      ru: Повтори тот же самый запрос после таймаута — единственное восстановление, доступное клиенту.
    event: RETRY_SENT
  - id: repeat-without-effect
    title:
      en: Repeat without effect
      ru: Повтори без последствий
    goal:
      en: Send a request twice so the second call leaves the server in exactly the state the first one did.
      ru: Отправь запрос дважды так, чтобы второй вызов оставил сервер ровно в том же состоянии, что и первый.
    event: IDEMPOTENT_REPEAT
  - id: do-it-twice
    title:
      en: Do the same thing twice
      ru: Сделай одно и то же дважды
    goal:
      en: Repeat a request whose second call changes the state again, and watch one intent become two effects.
      ru: Повтори запрос, второй вызов которого снова меняет состояние, и увидь, как одно намерение превращается в два эффекта.
    event: DUPLICATE_EFFECT
  - id: relative-body
    title:
      en: Send a relative change
      ru: Отправь относительное изменение
    goal:
      en: Send a body that says '+1' instead of a target value, and see why the method alone cannot promise idempotency.
      ru: Отправь тело, которое говорит «+1» вместо конечного значения, и увидь, почему один метод не может обещать идемпотентность.
    event: RELATIVE_UPDATE
  - id: recognize-the-retry
    title:
      en: Recognize the retry
      ru: Распознай повтор
    goal:
      en: Retry a POST carrying an Idempotency-Key and have the server replay the stored response instead of creating a second resource.
      ru: Повтори POST с заголовком Idempotency-Key и добейся, чтобы сервер вернул сохранённый ответ вместо создания второго ресурса.
    event: KEY_REPLAYED
  - id: leak-a-side-effect
    title:
      en: Break the promise from inside
      ru: Нарушь обещание изнутри
    goal:
      en: Repeat an idempotent method whose handler fires a side effect, so the resource is unchanged but the effect happens twice.
      ru: Повтори идемпотентный метод, обработчик которого делает побочный эффект, — ресурс не изменится, а эффект произойдёт дважды.
    event: SIDE_EFFECT_LEAK

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: define-idempotency
    en: What is idempotency? Define it precisely and give an example of an operation that is idempotent and one that is not.
    ru: Что такое идемпотентность? Дай точное определение и приведи пример идемпотентной и неидемпотентной операции.
  - id: which-methods
    en: Which HTTP methods are idempotent and which are not? Go through the list and justify each one.
    ru: Какие HTTP-методы идемпотентны, а какие нет? Пройдись по списку и обоснуй каждый.
  - id: safe-vs-idempotent
    en: How do 'safe' and 'idempotent' differ? Can a method be one without the other?
    ru: Чем «безопасный» отличается от «идемпотентного»? Может ли метод быть одним без другого?
  - id: why-it-matters
    en: Why does anyone care whether a method is idempotent? What breaks without the guarantee?
    ru: Почему вообще важно, идемпотентен ли метод? Что ломается без этой гарантии?
  - id: same-response-myth
    en: 'A colleague says: "DELETE cannot be idempotent, the second call returns 404 instead of 204." What do you answer?'
    ru: 'Коллега говорит: «DELETE не может быть идемпотентным, второй вызов возвращает 404 вместо 204». Что ты ответишь?'
  - id: patch-not-guaranteed
    en: Why is PUT required to be idempotent while PATCH is only "not guaranteed"? Give a PATCH body that is idempotent and one that is not.
    ru: Почему PUT обязан быть идемпотентным, а для PATCH это «не гарантируется»? Приведи идемпотентное и неидемпотентное тело PATCH.
  - id: post-idempotency-key
    en: You have a POST that creates a payment. How do you make it safe to retry? Describe the idempotency-key mechanism end to end.
    ru: Есть POST, создающий платёж. Как сделать его безопасным для повтора? Опиши механизм ключа идемпотентности целиком.
  - id: key-generation-and-scope
    en: Who generates the idempotency key, what does it identify, and how long does the server keep it? What happens when the key is reused with a different body?
    ru: Кто генерирует ключ идемпотентности, что именно он идентифицирует и как долго сервер его хранит? Что делать, если тот же ключ пришёл с другим телом?
  - id: handler-must-keep-it
    en: Does declaring a method idempotent make your endpoint idempotent? Where does the guarantee actually come from?
    ru: Делает ли объявление метода идемпотентным сам эндпоинт идемпотентным? Откуда на самом деле берётся гарантия?
  - id: side-effects-count
    en: A PUT stores the same representation on every call but also sends a notification each time. Is that endpoint idempotent?
    ru: PUT при каждом вызове сохраняет одно и то же представление, но ещё и отправляет уведомление. Идемпотентен ли такой эндпоинт?
  - id: concurrent-duplicates
    en: Two identical retries arrive at the same moment and both check "has this key been used?" before either writes. What happens, and how do you prevent it?
    ru: Два одинаковых повтора приходят одновременно, и оба проверяют «был ли такой ключ?» до того, как кто-либо записал. Что произойдёт и как это предотвратить?
  - id: who-retries
    en: Who actually retries requests in a production system? Name the layers and say which methods each of them is willing to repeat.
    ru: Кто в реальной системе действительно повторяет запросы? Назови слои и скажи, какие методы каждый из них готов повторять.
  - id: at-least-once-messaging
    en: How does the same problem look in message-driven systems with at-least-once delivery, and how do consumers deal with it?
    ru: Как та же проблема выглядит в системах на очередях с доставкой at-least-once и как с ней справляются потребители?
  - id: timeouts-and-retry-policy
    en: A client times out and retries three times with backoff. What must the server guarantee, and what must the client avoid retrying?
    ru: Клиент отваливается по таймауту и повторяет три раза с backoff. Что обязан гарантировать сервер и что клиенту повторять нельзя?
  - id: design-a-transfer-api
    en: Design an endpoint for "transfer money between two accounts" that a mobile client on a bad connection can retry safely. What are the request, the storage and the responses?
    ru: Спроектируй эндпоинт «перевести деньги между счетами», который мобильный клиент на плохой связи может безопасно повторять. Как выглядят запрос, хранение и ответы?
