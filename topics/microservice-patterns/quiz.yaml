# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: pattern-groups-map
    en: What microservice patterns exist? Group them and explain what question each group answers.
    ru: Какие существуют микросервисные паттерны? Сгруппируйте их и объясните, на какой вопрос отвечает каждая группа.
  - id: patterns-vs-gof
    en: How do microservice patterns differ from GoF design patterns?
    ru: Чем микросервисные паттерны отличаются от паттернов проектирования GoF?
  - id: decomposition-patterns
    en: Which decomposition patterns do you know, and which decompositions are wrong by construction?
    ru: Какие паттерны декомпозиции вы знаете и какие способы разрезать систему ошибочны по построению?
  - id: strangler-fig
    en: How would you move from a monolith to services? Describe the Strangler Fig pattern and why a big-bang rewrite fails.
    ru: Как бы вы переезжали с монолита на сервисы? Опишите паттерн Strangler Fig и почему переписывание «одним прыжком» проваливается.
  - id: database-per-service-cost
    en: What does database per service take away from you, and which patterns exist to compensate for that loss?
    ru: Что отнимает у вас база на сервис и какие паттерны существуют, чтобы компенсировать эту потерю?
  - id: saga-basics
    en: What is a Saga? How does it differ from a distributed transaction, and what replaces rollback?
    ru: Что такое Saga? Чем она отличается от распределённой транзакции и что заменяет откат?
  - id: choreography-vs-orchestration
    en: Compare saga choreography with orchestration. Which would you pick for a five-step order flow and why?
    ru: Сравните хореографию и оркестрацию саги. Что бы вы выбрали для процесса заказа из пяти шагов и почему?
  - id: outbox-dual-write
    en: A handler saves an order and then publishes an event to Kafka. What can go wrong, and which pattern fixes it?
    ru: Обработчик сохраняет заказ, а затем публикует событие в Kafka. Что может пойти не так и какой паттерн это чинит?
  - id: idempotent-consumer
    en: Why must a message consumer be idempotent, and how do you implement idempotency in practice?
    ru: Почему потребитель сообщений обязан быть идемпотентным и как реализовать идемпотентность на практике?
  - id: cross-service-query
    en: You need a paginated, sorted list that joins data from three services. What are your options and their trade-offs?
    ru: Нужен постраничный отсортированный список, объединяющий данные трёх сервисов. Какие есть варианты и их компромиссы?
  - id: reliability-patterns
    en: Which patterns stop a cascading failure? Explain timeout, retry, circuit breaker and bulkhead and how they work together.
    ru: Какие паттерны останавливают каскадный отказ? Объясните таймаут, повтор, circuit breaker и bulkhead и как они работают вместе.
  - id: retry-danger
    en: When is a retry harmful? What must be true about the operation and about the retry policy?
    ru: Когда повтор вреден? Что должно быть верно про саму операцию и про политику повторов?
  - id: cross-cutting-patterns
    en: Which patterns make dozens of services operable — configuration, chassis, observability, deployment, testing?
    ru: Какие паттерны делают десятки сервисов эксплуатируемыми - конфигурация, chassis, наблюдаемость, развёртывание, тестирование?
  - id: contract-testing
    en: How do you test that two services still fit together without running the whole system?
    ru: Как проверить, что два сервиса всё ещё стыкуются, не поднимая всю систему?
  - id: pattern-adoption-order
    en: In what order would you adopt these patterns on a new system, and what happens to a team that adopts them all at once?
    ru: В каком порядке вы бы внедряли эти паттерны на новой системе и что произойдёт с командой, которая возьмёт их все сразу?
