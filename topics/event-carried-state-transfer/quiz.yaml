# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: inherit-the-outage
    title:
      en: Inherit someone else's outage
      ru: Унаследуй чужую аварию
    goal:
      en: Call the owning service inside the decision, take it down, and watch a healthy checkout fail.
      ru: Вызови сервис-владелец внутри решения, урони его и посмотри, как падает исправное оформление.
    event: SYNC_CALL_FAILED
  - id: decide-locally
    title:
      en: Decide without a network call
      ru: Прими решение без сетевого вызова
    goal:
      en: Keep the rate in a local cache and serve a decision from it while it is still within its TTL.
      ru: Держи курс в локальном кэше и обслужи решение из него, пока не истёк TTL.
    event: CACHE_HIT
  - id: watch-the-ttl-expire
    title:
      en: Let the TTL expire
      ru: Дай TTL истечь
    goal:
      en: Move the clock past the TTL and see the decision pay for a refresh instead of reading locally.
      ru: Переведи часы за TTL и посмотри, как решение платит за обновление вместо локального чтения.
    event: CACHE_EXPIRED
  - id: push-instead-of-pull
    title:
      en: Push the state instead of pulling it
      ru: Передай состояние событием, а не запросом
    goal:
      en: Publish a rate change and see it land in the local replica before any decision asks for it.
      ru: Опубликуй изменение курса и посмотри, как оно попадает в локальную реплику до того, как его спросят.
    event: RATE_APPLIED
  - id: drop-the-late-event
    title:
      en: Drop an event that arrives late
      ru: Отбрось событие, пришедшее с опозданием
    goal:
      en: Redeliver an older version after a newer one and let the version check refuse to overwrite.
      ru: Доставь повторно более старую версию после более новой и дай проверке версии отказать в перезаписи.
    event: STALE_EVENT_IGNORED
  - id: stop-the-feed
    title:
      en: 'Stop the feed, break nothing'
      ru: 'Останови поток, ничего не сломав'
    goal:
      en: Cut the stream to the consumer and watch decisions keep succeeding on data that stopped changing.
      ru: Оборви поток к потребителю и посмотри, как решения продолжают приниматься по переставшим меняться данным.
    event: FEED_STOPPED
  - id: quote-on-old-data
    title:
      en: Quote on data you know is old
      ru: Посчитай по заведомо старым данным
    goal:
      en: Declare a freshness limit, then make a decision beyond it and see it served as a flagged degradation.
      ru: Объяви предел свежести, прими решение за этим пределом и увидь его как помеченную деградацию.
    event: STALE_RATE_USED
  - id: refuse-instead-of-guessing
    title:
      en: Refuse instead of guessing
      ru: Откажи вместо догадки
    goal:
      en: Make the decision fail closed when the only value available is past the declared freshness limit.
      ru: Добейся отказа (fail closed), когда единственное доступное значение вышло за объявленный предел свежести.
    event: DECISION_BLOCKED
  - id: rebuild-the-replica
    title:
      en: Rebuild the replica after a restart
      ru: Восстанови реплику после перезапуска
    goal:
      en: Restart the instance with an empty in-memory replica and refill it by replaying the log.
      ru: Перезапусти инстанс с пустой репликой в памяти и наполни её заново, перечитав лог.
    event: REPLICA_REBUILT

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: async-data-at-a-sync-decision
    en: A checkout must be priced now, but the exchange rate is owned by another service that publishes it asynchronously. Walk me through your options and what you would actually build.
    ru: Заказ нужно рассчитать сейчас, но курс принадлежит другому сервису, который публикует его асинхронно. Разбери варианты и расскажи, что бы ты действительно построил.
  - id: sync-call-vs-local-copy
    en: When is a synchronous call to the owning service the right answer, and when is a local copy? What exactly changes when you switch?
    ru: Когда синхронный вызов сервиса-владельца — правильный ответ, а когда локальная копия? Что именно меняется при переходе?
  - id: what-goes-into-the-event
    en: What is event-carried state transfer, and what do you put into the event — the full state, the changed fields, or just an id the consumer then fetches?
    ru: Что такое event-carried state transfer и что класть в событие — полное состояние, изменившиеся поля или только идентификатор, по которому потребитель потом сходит за данными?
  - id: how-stale-may-it-be
    en: How old is the locally stored rate allowed to be? How do you derive that number, and who signs off on it?
    ru: Насколько старым может быть локально сохранённый курс? Как получить это число и кто его утверждает?
  - id: fail-open-or-fail-closed
    en: The local copy is older than the limit and there is no way to refresh it. Do you price the order anyway or refuse it? Defend your default.
    ru: Локальная копия старше предела, а обновить её невозможно. Считать заказ всё равно или отказать? Обоснуй значение по умолчанию.
  - id: detecting-staleness
    en: The feed silently stops and the replica keeps answering. What tells you, and how fast? What do you alert on when nothing throws?
    ru: Поток тихо останавливается, а реплика продолжает отвечать. Что тебе об этом скажет и как быстро? На что вешать алерт, если ничего не падает?
  - id: ordering-and-duplicates
    en: Events can be duplicated and reordered. How do you keep the replica correct, and what does that require of the events themselves?
    ru: События могут дублироваться и приходить не по порядку. Как сохранить реплику корректной и что для этого требуется от самих событий?
  - id: cold-start-and-rebuild
    en: A new instance starts with an empty replica. How does it become useful, where does the replica live, and how long does that take?
    ru: Новый инстанс стартует с пустой репликой. Как он становится полезным, где живёт реплика и сколько это занимает?
  - id: ttl-cache-vs-event-driven
    en: 'Compare a TTL cache with an event-driven replica: freshness, load on the owner, failure modes, and what a cache stampede does to each.'
    ru: 'Сравни TTL-кэш и реплику на событиях: свежесть, нагрузка на владельца, режимы отказа и что с каждым из них делает лавина промахов кэша.'
  - id: replica-ownership-and-queries
    en: Who owns data that now lives in three services' local replicas? Can you report from a replica, and what are you allowed to do with it?
    ru: Кому принадлежат данные, которые теперь лежат в локальных репликах трёх сервисов? Можно ли строить по реплике отчёты и что вообще с ней позволено делать?
  - id: pinning-the-decision
    en: The rate changes between quoting the order and charging the card. Which rate applies, and how does your data model make that unambiguous?
    ru: Курс меняется между расчётом заказа и списанием с карты. Какой курс применяется и как модель данных делает это однозначным?
  - id: when-not-to-replicate
    en: When is event-carried state transfer the wrong choice? Give concrete cases where you would not keep a local copy.
    ru: Когда event-carried state transfer — неправильный выбор? Приведи конкретные случаи, где локальную копию держать не стоит.
  - id: rollout-and-schema-change
    en: The owning service adds a field and changes the shape of its rate event. How do you roll that out without breaking every replica?
    ru: Сервис-владелец добавляет поле и меняет формат своего события о курсе. Как это выкатить, не сломав все реплики?
