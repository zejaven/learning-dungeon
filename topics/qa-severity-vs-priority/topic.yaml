summary:
  en: >
    Severity vs priority of a defect: what severity measures (impact on the
    system, set by the tester), the classic Blocker / Critical / Major / Minor
    scale with examples, what priority measures (urgency of the fix, a
    management tool), and the classic combinations — high severity with low
    priority and the other way around.
  ru: >
    Критичность (severity) и приоритет (priority) дефекта: что измеряет
    критичность (влияние на систему, ставит тестировщик), классическая шкала
    Blocker / Critical / Major / Minor с примерами, что измеряет приоритет
    (срочность исправления, инструмент менеджмента) и классические
    комбинации — высокая критичность при низком приоритете и наоборот.

