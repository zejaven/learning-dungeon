id: jpa-entity-states
title:
  en: JPA Entity States
  ru: Состояния сущности в JPA
category:
  en: Hibernate / JPA
  ru: Hibernate / JPA
type: OTHER
mode: trace
aiProvider: codex
aiModel: gpt-5.5
categoryId: hibernate
difficulty: 2
catalogId: hibernate-7
style: Real world
summary:
  en: >
    How a JPA entity moves through transient, managed, detached and removed
    states; what persist, find, detach, clear, close, merge, remove and flush do;
    and why merge returns a managed copy instead of reattaching the same object.
  ru: >
    Как JPA-сущность проходит состояния transient, managed, detached и removed;
    что делают persist, find, detach, clear, close, merge, remove и flush; и
    почему merge возвращает managed-копию, а не «прикрепляет» тот же объект.

primitives:
  - ArrayGrid
  - EventLog

defaultExample: transient-persist

examples:
  - id: transient-persist
    title:
      en: transient to managed
      ru: transient в managed
    file: 01-transient-persist.java
    explanation:
      en: >
        A plain new Java object starts as transient. persist() puts it into the
        Persistence Context as managed and schedules an INSERT for flush().
      ru: >
        Обычный new Java-объект начинает как transient. persist() помещает его в
        Persistence Context как managed и планирует INSERT для flush().
  - id: find-detach
    title:
      en: find and detach
      ru: find и detach
    file: 02-find-detach.java
    explanation:
      en: >
        find() loads a database row as managed. detach() removes this object from
        tracking, so later changes are not synchronized by flush().
      ru: >
        find() загружает строку из базы как managed. detach() убирает объект из
        отслеживания, поэтому последующие изменения не синхронизируются через flush().
  - id: detached-merge
    title:
      en: detached merge
      ru: merge detached
    file: 03-detached-merge.java
    explanation:
      en: >
        merge() copies the detached object's fields into a managed instance and
        returns that managed copy. The original object stays detached.
      ru: >
        merge() копирует поля detached-объекта в managed-экземпляр и возвращает
        эту managed-копию. Исходный объект остаётся detached.
  - id: remove-flush
    title:
      en: remove and flush
      ru: remove и flush
    file: 04-remove-flush.java
    explanation:
      en: >
        remove() marks a managed entity as removed. The DELETE is produced only
        when the Persistence Context flushes.
      ru: >
        remove() помечает managed-сущность как removed. DELETE появляется только
        при flush Persistence Context.
  - id: clear-close
    title:
      en: clear and close
      ru: clear и close
    file: 05-clear-close.java
    explanation:
      en: >
        clear() detaches every tracked entity while keeping the EntityManager
        open. close() ends the Persistence Context.
      ru: >
        clear() переводит все отслеживаемые сущности в detached, но оставляет
        EntityManager открытым. close() завершает Persistence Context.

assistantExample:
  en: 'e.g. Why does merge return a managed copy instead of reattaching the detached object?'
  ru: 'например: Почему merge возвращает managed-копию, а не прикрепляет detached-объект обратно?'

