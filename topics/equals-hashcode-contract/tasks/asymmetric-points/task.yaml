kind: practice
order: 2
title:
  en: |-
    Equal one way only
  ru: |-
    Равны только в одну сторону
statement:
  en: |-
    A warehouse map stores plain `Point`s and colored `ColorPoint`s in the same collections. A bug report says the result of `list.contains(x)` depends on which of the two objects is in the list, because:

    ```java
    new Point(1, 2).equals(new ColorPoint(1, 2, "red"));  // true
    new ColorPoint(1, 2, "red").equals(new Point(1, 2));  // false
    ```

    Make `equals()` work correctly across the hierarchy. A plain point and a colored point are never equal, in either direction. Two points of the same kind compare by their fields.
  ru: |-
    Карта склада хранит обычные `Point` и цветные `ColorPoint` в одних и тех же коллекциях. В баг-репорте сказано, что результат `list.contains(x)` зависит от того, какой из двух объектов лежит в списке, потому что:

    ```java
    new Point(1, 2).equals(new ColorPoint(1, 2, "red"));  // true
    new ColorPoint(1, 2, "red").equals(new Point(1, 2));  // false
    ```

    Сделай так, чтобы `equals()` правильно работал по всей иерархии. Обычная и цветная точки никогда не равны, ни в какую сторону. Две точки одного вида сравниваются по полям.
hints:
  - en: |-
      Which rule of the `equals()` contract does the example break? Which of the two calls is the wrong one?
    ru: |-
      Какое правило контракта `equals()` нарушает пример? Какой из двух вызовов неверный?
  - en: |-
      The wrong call runs `Point.equals`. Ask what `o instanceof Point` answers when `o` is a `ColorPoint`.
    ru: |-
      Неверный вызов выполняет `Point.equals`. Спроси себя, что отвечает `o instanceof Point`, когда `o` это `ColorPoint`.
  - en: |-
      `Point.equals` must reject subclasses, so compare exact runtime classes with `getClass()`. Changing only `ColorPoint.equals` cannot help: it is not the method that answers `true`.
    ru: |-
      `Point.equals` должен отвергать подклассы, поэтому сравнивай точные классы через `getClass()`. Правка только `ColorPoint.equals` не поможет: `true` отвечает не этот метод.
debrief:
  en: |-
    `instanceof` lets a subclass pass as its parent, so the parent says "equal" while the subclass, which also checks the color, says "not equal". That breaks symmetry.

    `getClass()` keeps a value class strict. The cost to name in an interview: a subclass that adds no state is no longer equal to its parent either, which is why frameworks that generate proxies often need `instanceof`. The classic trick of having `ColorPoint` ignore the color when compared to a plain `Point` fixes symmetry but breaks transitivity: red equals plain, plain equals blue, red does not equal blue.
  ru: |-
    `instanceof` пропускает подкласс как родителя, поэтому родитель говорит «равны», а подкласс, который проверяет ещё и цвет, говорит «не равны». Так ломается симметричность.

    `getClass()` делает класс-значение строгим. Цена, которую стоит назвать на собеседовании: подкласс без нового состояния тоже перестаёт быть равен родителю, поэтому фреймворкам с прокси часто нужен `instanceof`. Классический приём, когда `ColorPoint` игнорирует цвет при сравнении с обычной `Point`, чинит симметричность, но ломает транзитивность: красная равна обычной, обычная равна синей, а красная синей не равна.
