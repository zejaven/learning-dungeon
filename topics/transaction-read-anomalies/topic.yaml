summary:
  en: >
    Learn the four classic concurrency problems interviewers ask about: dirty
    read, non-repeatable read, phantom read, and lost update. The topic explains
    what each anomaly means, how the scenarios differ, and how isolation levels,
    locks, constraints, and retry logic help prevent them.
  ru: >
    Разбери четыре классические проблемы параллельных транзакций, о которых
    спрашивают на собеседованиях: dirty read, non-repeatable read, phantom read
    и lost update. Тема объясняет, что означает каждая аномалия, чем сценарии
    отличаются друг от друга и как isolation levels, locks, constraints и retry
    logic помогают их предотвращать.

assistantExample:
  en: 'e.g. Can lost update happen even when dirty reads are impossible?'
  ru: 'например: Может ли lost update случиться, даже если dirty reads невозможны?'

