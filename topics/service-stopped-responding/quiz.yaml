# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: the-alarm-fires
    title:
      en: 'Start the clock'
      ru: 'Запусти часы'
    goal:
      en: 'Open an outage and read what "not responding" does not yet tell you.'
      ru: 'Открой аварию и прочитай, чего «не отвечает» пока не сообщает.'
    event: SERVICE_UNRESPONSIVE
  - id: probe-one-layer
    title:
      en: 'Probe one layer'
      ru: 'Прощупай один слой'
    goal:
      en: 'Run one dumb command against one layer — DNS, TCP, health, the endpoint — and record the exact answer.'
      ru: 'Выполни одну тупую команду против одного слоя — DNS, TCP, health, эндпоинт — и запиши точный ответ.'
    event: LAYER_PROBED
  - id: name-the-failure-mode
    title:
      en: 'Name the failure mode'
      ru: 'Назови режим сбоя'
    goal:
      en: 'Collapse the probes into a verdict: nothing listening, silent, healthy-but-hanging, slow, or partly down.'
      ru: 'Сведи пробы к вердикту: никто не слушает, молчит, «здоров, но висит», медленно или частично лежит.'
    event: FAILURE_CLASSIFIED
  - id: restart-before-anything
    title:
      en: 'Restart on reflex'
      ru: 'Перезапусти рефлекторно'
    goal:
      en: 'Restore service the fastest way possible, and see what that costs besides two minutes.'
      ru: 'Восстанови сервис самым быстрым способом и посмотри, во что это обходится помимо двух минут.'
    event: RESTARTED_BLIND
  - id: ask-for-a-dump-too-late
    title:
      en: 'Ask for a dump too late'
      ru: 'Запроси дамп слишком поздно'
    goal:
      en: 'Try to capture an artifact from a process that has already been replaced.'
      ru: 'Попробуй снять артефакт с процесса, который уже заменили.'
    event: EVIDENCE_LOST
  - id: capture-the-crime-scene
    title:
      en: 'Capture the crime scene'
      ru: 'Зафиксируй место преступления'
    goal:
      en: 'Take an artifact that only exists while the process is still hung, before anything restarts.'
      ru: 'Сними артефакт, который существует только пока процесс висит, до любого перезапуска.'
    event: EVIDENCE_CAPTURED
  - id: count-the-stacks
    title:
      en: 'Group the thread dump'
      ru: 'Сгруппируй дамп потоков'
    goal:
      en: 'Collapse the dump into groups by top frame and read the share of the biggest one.'
      ru: 'Сверни дамп в группы по верхнему кадру и прочитай долю самой большой.'
    event: THREADS_READ
  - id: the-jvm-proves-it
    title:
      en: 'Find a deadlock'
      ru: 'Найди взаимоблокировку'
    goal:
      en: 'Read the section of the dump where the JVM proves the cycle for you.'
      ru: 'Прочитай тот раздел дампа, где JVM сама доказывает цикл.'
    event: DEADLOCK_FOUND
  - id: read-a-bounded-pool
    title:
      en: 'Read a bounded pool'
      ru: 'Прочитай ограниченный пул'
    goal:
      en: 'Check one thing requests queue for — used, maximum, and how many are waiting behind it.'
      ru: 'Проверь одно место, где стоит очередь: занято, максимум и сколько ждёт за ним.'
    event: POOL_READ
  - id: alive-busy-answering-nobody
    title:
      en: 'Check the collector'
      ru: 'Проверь сборщик мусора'
    goal:
      en: 'Read the GC pause share and how full the heap still is right after a full collection.'
      ru: 'Прочитай долю пауз GC и то, насколько куча заполнена сразу после полной сборки.'
    event: GC_READ
  - id: look-below-the-jvm
    title:
      en: 'Look below the JVM'
      ru: 'Посмотри ниже JVM'
    goal:
      en: 'Read something no stack trace will ever mention: the CPU quota, the descriptors, the disk.'
      ru: 'Прочитай то, чего не будет ни в одном стек-трейсе: квоту CPU, дескрипторы, диск.'
    event: RESOURCE_READ
  - id: do-the-arithmetic
    title:
      en: 'Do the pool arithmetic'
      ru: 'Посчитай арифметику пула'
    goal:
      en: 'Compute capacity as threads over service time, and see how long the pool survives the arrival rate.'
      ru: 'Посчитай способность как потоки, делённые на время обслуживания, и посмотри, сколько пул живёт под входящим потоком.'
    event: SATURATION_COMPUTED
  - id: restore-with-evidence-in-hand
    title:
      en: 'Restore service properly'
      ru: 'Восстанови сервис как надо'
    goal:
      en: 'Take a reversible action that serves users again, with the artifacts already captured.'
      ru: 'Сделай обратимое действие, которое снова обслуживает пользователей, уже имея собранные артефакты.'
    event: SERVICE_RESTORED
  - id: a-cause-that-explains-the-timing
    title:
      en: 'Confirm a cause'
      ru: 'Подтверди причину'
    goal:
      en: 'Name a cause that explains the symptom, the timing, and why nothing was thrown into the log.'
      ru: 'Назови причину, объясняющую и симптом, и время, и то, почему в лог ничего не выброшено.'
    event: ROOT_CAUSE_CONFIRMED
  - id: raise-a-limit-instead
    title:
      en: 'Ship a limit increase'
      ru: 'Выкати увеличение лимита'
    goal:
      en: 'Change production with nothing confirmed, and count what you can no longer learn from the result.'
      ru: 'Измени прод, ничего не подтвердив, и посчитай, чего ты уже не узнаешь из результата.'
    event: BLIND_FIX
  - id: watch-the-guess-miss
    title:
      en: 'Watch a fix miss'
      ru: 'Посмотри, как исправление промахивается'
    goal:
      en: 'Re-run the failing check after a guess, and read what to do before the next hypothesis.'
      ru: 'Перезапусти падающую проверку после догадки и прочитай, что сделать до следующей гипотезы.'
    event: STILL_DOWN
  - id: fix-both-halves
    title:
      en: 'Fix a confirmed cause'
      ru: 'Исправь подтверждённую причину'
    goal:
      en: 'Ship one change against the confirmed cause, covering both what broke and what let it spread.'
      ru: 'Выкати одно изменение под подтверждённую причину, закрыв и то, что сломалось, и то, что дало этому расползтись.'
    event: FIX_APPLIED
  - id: prove-it-with-the-request
    title:
      en: 'Verify with the real request'
      ru: 'Проверь настоящим запросом'
    goal:
      en: 'Re-run the request that failed, in the environment it failed in, and watch it pass.'
      ru: 'Перезапусти запрос, который падал, в том окружении, где падал, и увидь, как он проходит.'
    event: RECOVERY_VERIFIED
  - id: leave-an-alert-behind
    title:
      en: 'Leave a guard behind'
      ru: 'Оставь после себя защиту'
    goal:
      en: 'Add the alert, timeout, probe or capture script that makes the next outage five minutes long.'
      ru: 'Добавь алерт, таймаут, проверку или скрипт сбора, который сделает следующую аварию пятиминутной.'
    event: GUARD_ADDED
  - id: read-the-worksheet-back
    title:
      en: 'Review the incident'
      ru: 'Разбери инцидент'
    goal:
      en: 'Read the whole triage back — the mode, the evidence, the cause, the missteps and the clock.'
      ru: 'Прочитай весь разбор обратно — режим, улики, причину, промахи и часы.'
    event: INCIDENT_REVIEW

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: first-fifteen-minutes
    en: A production service has stopped responding to requests. Walk me through what you do, in order, from the alert to a fix.
    ru: Сервис в проде перестал отвечать на запросы. Проведи меня по своим действиям по порядку — от алерта до исправления.
  - id: kinds-of-not-responding
    en: '"Not responding" can mean several different things. Which ones, and how do you tell them apart?'
    ru: '«Не отвечает» может означать несколько разных вещей. Каких именно и как ты их различишь?'
  - id: refused-versus-timeout
    en: What is the practical difference between a connection refused and a connection that hangs, and what does each one send you to look at?
    ru: В чём практическая разница между «connection refused» и повисшим соединением и куда каждый из случаев вас отправляет?
  - id: what-to-capture-before-restart
    en: Before you restart a hung JVM, what do you capture, and how long should that take?
    ru: Что ты соберёшь перед перезапуском зависшей JVM и сколько времени это должно занять?
  - id: restart-now-or-later
    en: Users are down and the fastest fix is a restart. How do you decide between restoring service now and preserving evidence?
    ru: Пользователи лежат, и самое быстрое решение — перезапуск. Как ты выберешь между «восстановить сейчас» и «сохранить улики»?
  - id: reading-a-thread-dump
    en: You have a thread dump with 200 threads. How do you read it, and what are you looking for?
    ru: У тебя дамп с 200 потоками. Как ты его читаешь и что именно ищешь?
  - id: three-dumps-not-one
    en: Why take three thread dumps a few seconds apart instead of one?
    ru: Зачем снимать три дампа потоков с интервалом в несколько секунд, а не один?
  - id: thread-states-meaning
    en: What do you conclude if most threads are RUNNABLE? BLOCKED? WAITING? TIMED_WAITING?
    ru: Какой вывод ты сделаешь, если большинство потоков в RUNNABLE? В BLOCKED? В WAITING? В TIMED_WAITING?
  - id: pool-exhaustion-arithmetic
    en: A downstream call goes from 50ms to 8 seconds. Explain, with numbers, why that takes your whole service down.
    ru: Вызов зависимости уходит с 50мс на 8 секунд. Объясни с числами, почему это кладёт весь твой сервис.
  - id: why-not-just-bigger-pool
    en: Why is doubling the thread pool usually the wrong answer here, and what is the right one?
    ru: Почему удвоить пул потоков здесь обычно неверный ответ и какой ответ верный?
  - id: gc-thrash-symptoms
    en: How would you tell that a service is unresponsive because of garbage collection rather than because of a blocked thread?
    ru: Как ты поймёшь, что сервис не отвечает из-за сборки мусора, а не из-за заблокированного потока?
  - id: deadlock-detection
    en: How do you detect a deadlock in production, and why does a restart not fix it?
    ru: Как обнаружить взаимоблокировку в проде и почему перезапуск её не чинит?
  - id: health-check-green-service-dead
    en: The health endpoint returns 200 while every real request hangs. How is that possible, and what would you change?
    ru: Health-эндпоинт отдаёт 200, а все настоящие запросы висят. Как такое возможно и что бы ты изменил?
  - id: liveness-versus-readiness
    en: What is the difference between a liveness and a readiness probe, and what goes wrong if you put a database check in the wrong one?
    ru: Чем отличаются проверки liveness и readiness и что сломается, если поставить проверку базы не в ту из них?
  - id: only-some-instances
    en: Only two of five pods are unresponsive. How does that change your investigation?
    ru: Не отвечают только два пода из пяти. Как это меняет твоё расследование?
  - id: nothing-in-the-logs
    en: The service is silent and there is nothing in the logs at all. What are the possible reasons, and what do you check?
    ru: Сервис молчит, и в логах вообще ничего нет. Какие могут быть причины и что ты проверишь?
  - id: cascading-failure
    en: How does one slow dependency turn into a full outage, and what stops that from happening?
    ru: Как одна медленная зависимость превращается в полную аварию и что этому мешает?
  - id: mitigation-versus-fix
    en: What is the difference between mitigating an outage and fixing it, and which do you do first?
    ru: В чём разница между смягчением аварии и её исправлением и что делаешь первым?
  - id: proving-it-recovered
    en: What counts as proof that the service has actually recovered? What would you refuse to accept?
    ru: Что считается доказательством, что сервис действительно восстановился? Что ты откажешься принять?
  - id: what-you-leave-behind
    en: The service is answering again. What do you leave behind so the next outage is found by a machine in five minutes, not by a customer in an hour?
    ru: Сервис снова отвечает. Что ты оставишь после себя, чтобы следующую аварию нашла машина за пять минут, а не клиент за час?
