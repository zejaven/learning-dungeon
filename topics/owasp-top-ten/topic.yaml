summary:
  en: >
    OWASP is a non-profit foundation that publishes free, vendor-neutral
    application-security material - the Top 10, the ASVS verification standard,
    the Cheat Sheet Series, ZAP, Dependency-Check, Juice Shop. Its famous
    artefact is the Top 10, an awareness document naming the ten broadest
    categories of web-application risk: broken access control, cryptographic
    failures, injection, insecure design, security misconfiguration, vulnerable
    and outdated components, identification and authentication failures,
    software and data integrity failures, security logging and monitoring
    failures, and server-side request forgery. It is deliberately a list of
    categories, not of bugs, and eight of the ten are chosen from measured
    vulnerability data while two come from a practitioner survey so the list can
    warn about things scanners cannot yet find. The single most common mistake
    in an interview is to treat it as a checklist or a compliance target -
    passing the Top 10 is a floor, and the standard you actually verify against
    is the ASVS.
  ru: >
    OWASP - некоммерческий фонд, публикующий бесплатные и независимые от
    вендоров материалы по безопасности приложений: Top 10, стандарт проверки
    ASVS, серию Cheat Sheets, ZAP, Dependency-Check, Juice Shop. Самый известный
    его артефакт - Top 10, документ для повышения осведомлённости, называющий
    десять самых широких категорий риска веб-приложений: нарушенный контроль
    доступа, криптографические сбои, инъекции, небезопасное проектирование,
    ошибки конфигурации, уязвимые и устаревшие компоненты, сбои идентификации и
    аутентификации, нарушения целостности кода и данных, недостатки
    логирования и мониторинга, а также подделка запросов на стороне сервера
    (SSRF). Это намеренно список категорий, а не список багов, причём восемь
    позиций из десяти выбираются по измеренным данным об уязвимостях, а две -
    по опросу практиков, чтобы список успевал предупреждать о том, чего
    сканеры пока не находят. Самая частая ошибка на собеседовании - считать его
    чек-листом или целью для комплаенса: пройденный Top 10 - это пол, а
    стандарт, по которому реально проверяют, - ASVS.

