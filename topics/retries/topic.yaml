id: retries
languages: [en, ru]
title:
  en: Retrying Failed Calls Safely
  ru: Безопасные повторы неудачных вызовов
category:
  en: Microservices / Resilience
  ru: Микросервисы / Устойчивость
type: OTHER
mode: trace
aiProvider: claude
aiModel: opus
categoryId: microservices
difficulty: 2
catalogId: plan-retries
summary:
  en: >
    How to retry a failed remote call without making things worse: exponential
    backoff with a cap, jitter against synchronized retry storms, retrying only
    transient errors (and ambiguous ones only when the operation is idempotent),
    honoring Retry-After, bounding retries by a deadline and a retry budget, and
    retrying at exactly one layer of the stack.
  ru: >
    Как повторять неудачный удалённый вызов, не делая хуже: exponential backoff
    с потолком, jitter против синхронных штормов повторов, повтор только
    временных ошибок (а неоднозначных — только для идемпотентных операций),
    уважение к Retry-After, ограничение повторов deadline и retry budget и
    retry ровно на одном уровне стека.

primitives:
  - ArrayGrid

defaultExample: exponential-backoff

examples:
  - id: exponential-backoff
    title:
      en: Exponential backoff
      ru: Exponential backoff
    file: 01-exponential-backoff.java
    explanation:
      en: >
        Two 503 answers, then success. Each wait doubles (100 ms, 200 ms), giving
        the overloaded service time to recover instead of hammering it.
      ru: >
        Два ответа 503, затем успех. Каждая пауза удваивается (100 ms, 200 ms),
        давая перегруженному сервису время восстановиться, а не добивая его.
  - id: jitter-herd
    title:
      en: Jitter vs thundering herd
      ru: Jitter против thundering herd
    file: 02-jitter-herd.java
    explanation:
      en: >
        Twenty clients fail at the same moment. Without jitter they all retry in
        the same 100 ms window; with full jitter the retries spread out.
      ru: >
        Двадцать клиентов падают в один момент. Без jitter все повторяют в одном
        окне 100 ms; с full jitter повторы размазываются по времени.
  - id: which-errors
    title:
      en: Which errors to retry
      ru: Какие ошибки повторять
    file: 03-which-errors.java
    explanation:
      en: >
        A 400 is permanent and is never retried. A 429 carries Retry-After, and
        the client waits at least that long before trying again.
      ru: >
        400 — постоянная ошибка, её не повторяют. 429 несёт Retry-After, и
        клиент ждёт не меньше указанного перед следующей попыткой.
  - id: idempotency-key
    title:
      en: Timeouts and idempotency
      ru: Timeouts и идемпотентность
    file: 04-idempotency-key.java
    explanation:
      en: >
        A timed-out POST may already have charged the card, so a plain POST is
        not retried. The same call with an idempotency key is retried safely.
      ru: >
        POST, упавший по timeout, мог уже списать деньги, поэтому обычный POST
        не повторяют. Тот же вызов с idempotency key повторяется безопасно.
  - id: deadline-budget
    title:
      en: Deadline and retry budget
      ru: Deadline и retry budget
    file: 05-deadline-budget.java
    explanation:
      en: >
        Retries stop when the next wait would cross the request deadline, and a
        shared retry budget makes a client fail fast once it retries too much.
      ru: >
        Повторы прекращаются, когда следующая пауза пересечёт deadline запроса, а
        общий retry budget заставляет клиента быстро отказывать, если он уже
        слишком много повторяет.
  - id: retry-layers
    title:
      en: Retry at one layer
      ru: Retry на одном уровне
    file: 06-retry-layers.java
    explanation:
      en: >
        When every layer retries 3 times, one user request becomes 27 calls to a
        database that is already down. Retrying at one layer keeps it at 3.
      ru: >
        Если каждый уровень повторяет 3 раза, один запрос пользователя
        превращается в 27 вызовов к уже упавшей базе. Retry на одном уровне
        оставляет 3.

assistantExample:
  en: 'e.g. Why is retrying a POST after a timeout dangerous, and how do you make it safe?'
  ru: 'например: Почему повторять POST после timeout опасно и как сделать это безопасным?'

missionsFile: quiz.yaml
