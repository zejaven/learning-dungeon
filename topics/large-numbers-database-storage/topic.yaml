summary:
  en: >
    How to store values that do not fit int64: Java BigInteger, uint256, token
    balances with 18 decimals, and exact financial amounts. Learn when
    NUMERIC/DECIMAL is enough, when you need canonical text or binary plus
    sortable key columns, and why plain text breaks numeric indexing and sorting.
  ru: >
    Как хранить значения, которые не помещаются в int64: Java BigInteger, uint256,
    балансы токенов с 18 decimals и точные финансовые суммы. Разбери, когда
    достаточно NUMERIC/DECIMAL, когда нужны канонический текст или бинарный вид
    плюс сортируемые ключевые колонки, и почему обычный текст ломает числовую
    индексацию и сортировку.

