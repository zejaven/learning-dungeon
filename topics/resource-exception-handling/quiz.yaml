missions:
  - id: auto-close
    title:
      en: Close automatically
      ru: Закрой автоматически
    goal:
      en: Run code where a try-with-resources resource is closed after normal work.
      ru: Запусти код, где ресурс try-with-resources закрывается после нормальной работы.
    event: RESOURCE_CLOSED
  - id: body-exception-kept
    title:
      en: Keep the body exception
      ru: Сохрани исключение тела
    goal:
      en: Make work inside the try block fail so the body exception becomes primary.
      ru: Сделай ошибку внутри блока try, чтобы исключение из тела стало основным.
    event: RESOURCE_PRIMARY_EXCEPTION
  - id: close-can-fail
    title:
      en: See close() fail
      ru: Увидь падение close()
    goal:
      en: Run a resource whose close() throws after the body succeeds.
      ru: Запусти ресурс, у которого close() выбрасывает исключение после успешного тела.
    event: RESOURCE_CLOSE_FAILED
  - id: suppressed-close-failure
    title:
      en: Attach suppressed failure
      ru: Прикрепи suppressed ошибку
    goal:
      en: Make both the body and close() fail so the close exception becomes suppressed.
      ru: Сделай так, чтобы упали и тело, и close(), тогда ошибка close станет suppressed.
    event: RESOURCE_SUPPRESSED_EXCEPTION
  - id: reverse-close-order
    title:
      en: Close in reverse order
      ru: Закрой в обратном порядке
    goal:
      en: Declare two resources and observe that the later one closes first.
      ru: Объяви два ресурса и посмотри, что более поздний закрывается первым.
    event: RESOURCE_REVERSE_CLOSE
  - id: finally-after-resources
    title:
      en: Run finally after resources
      ru: Выполни finally после ресурсов
    goal:
      en: Add a finally block and observe that it runs after resource closing.
      ru: Добавь блок finally и посмотри, что он выполняется после закрытия ресурсов.
    event: RESOURCE_FINALLY

bossFight:
  - id: try-with-resources-mechanics
    en: What does try-with-resources do for an AutoCloseable resource?
    ru: Что делает try-with-resources для ресурса AutoCloseable?
  - id: close-order
    en: In what order are multiple try-with-resources resources closed, and why?
    ru: В каком порядке закрываются несколько ресурсов try-with-resources и почему?
  - id: suppressed-exceptions
    en: What is a suppressed exception, and when does Java create one?
    ru: Что такое suppressed exception и когда Java его создаёт?
  - id: close-only-failure
    en: What exception is caught if the try body succeeds but close() throws?
    ru: Какое исключение будет поймано, если тело try успешно, но close() выбрасывает?
  - id: finally-vs-try-with-resources
    en: When would you use finally instead of try-with-resources for cleanup?
    ru: Когда для очистки стоит использовать finally вместо try-with-resources?
  - id: autocloseable-vs-closeable
    en: What is the practical difference between AutoCloseable and Closeable?
    ru: В чём практическая разница между AutoCloseable и Closeable?
