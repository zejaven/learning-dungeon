summary:
  en: >
    SQL is declarative: you say what you want, not how to get it. The database
    turns your query into an execution plan through parsing, rewriting,
    cost-based planning over table statistics, and execution. Learn what the
    planner chooses (scans, join methods, join order), why it relies on
    statistics and cardinality estimates, and how to read the plan with EXPLAIN
    and EXPLAIN ANALYZE.
  ru: >
    SQL декларативен: вы говорите, что хотите получить, а не как. База данных
    превращает запрос в план выполнения через разбор, перезапись, планирование
    по стоимости на основе статистики таблиц и собственно выполнение. Разберись,
    что выбирает планировщик (способы сканирования, методы и порядок соединений),
    почему он опирается на статистику и оценки кардинальности и как читать план
    через EXPLAIN и EXPLAIN ANALYZE.

assistantExample:
