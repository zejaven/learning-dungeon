missions:
  - id: store-primitive-value
    title:
      en: Store a primitive value
      ru: Сохрани примитивное значение
    goal:
      en: Run an example where an int value is stored directly in a local variable slot.
      ru: Запусти пример, где значение int хранится прямо в слоте локальной переменной.
    event: MEM_PRIMITIVE
  - id: copy-primitive-value
    title:
      en: Copy the value
      ru: Скопируй значение
    goal:
      en: Copy one primitive into another variable and then change only the copy.
      ru: Скопируй один примитив в другую переменную, а затем измени только копию.
    event: MEM_COPY_PRIMITIVE
  - id: allocate-object-reference
    title:
      en: Create an object reference
      ru: Создай объектную ссылку
    goal:
      en: Allocate an object so a local variable stores a reference to a heap object.
      ru: Создай объект так, чтобы локальная переменная хранила ссылку на объект в куче.
    event: MEM_NEW
  - id: copy-object-reference
    title:
      en: Copy the reference
      ru: Скопируй ссылку
    goal:
      en: Assign one object variable to another so both variables point at the same object.
      ru: Присвой одну объектную переменную другой, чтобы обе указывали на один объект.
    event: MEM_COPY_REFERENCE
  - id: mutate-through-reference
    title:
      en: Change the shared object
      ru: Измени общий объект
    goal:
      en: Mutate a field through one reference and observe that the shared heap object changes.
      ru: Измени поле через одну ссылку и увидь, что меняется общий объект в куче.
    event: MEM_MUTATE
  - id: set-reference-null
    title:
      en: Set a reference to null
      ru: Присвой ссылке null
    goal:
      en: Assign null to an object variable so it no longer points at a heap object.
      ru: Присвой object-переменной null, чтобы она больше не указывала на объект в куче.
    event: MEM_NULL

bossFight:
  - id: primitive-list
    en: Which Java types are primitive, and how are they different from classes such as String or Integer?
    ru: Какие типы в Java являются примитивными и чем они отличаются от классов вроде String или Integer?
  - id: storage-model
    en: What does a primitive variable store, and what does an object variable store?
    ru: Что хранит переменная примитивного типа и что хранит переменная объектного типа?
  - id: null-defaults
    en: Why can a reference type be null, but a primitive int cannot be null?
    ru: Почему ссылочный тип может быть null, а примитивный int не может быть null?
  - id: copy-semantics
    en: What happens when you assign one primitive variable to another versus one object variable to another?
    ru: Что происходит при присваивании одной примитивной переменной другой и одной объектной переменной другой?
  - id: wrappers-autoboxing
    en: Why do Java wrappers like Integer exist, and what is autoboxing?
    ru: Зачем в Java нужны wrappers вроде Integer и что такое autoboxing?
  - id: equality-trap
    en: Why is == usually safe for primitive values but dangerous for comparing object contents?
    ru: Почему == обычно безопасен для примитивных значений, но опасен для сравнения содержимого объектов?
