# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: complexity-after-sorting
    en: What is the search complexity in an array after it has been sorted, and what is it before?
    ru: Какова сложность поиска в массиве после того, как он отсортирован, и какова до этого?
  - id: why-log-n
    en: Why is binary search O(log n)? Explain what happens at each step.
    ru: Почему бинарный поиск имеет сложность O(log n)? Объясните, что происходит на каждом шаге.
  - id: sorting-cost
    en: Sorting costs O(n log n). Does it make sense to sort an array just to perform a single search?
    ru: Сортировка стоит O(n log n). Имеет ли смысл сортировать массив ради одного-единственного поиска?
  - id: when-sorting-pays-off
    en: When does sorting up front to enable binary search actually pay off?
    ru: Когда предварительная сортировка ради бинарного поиска действительно окупается?
  - id: random-access-requirement
    en: Why does binary search require random access? What happens to its complexity on a LinkedList?
    ru: Почему бинарному поиску нужен произвольный доступ? Что происходит с его сложностью на LinkedList?
  - id: vs-hashmap
    en: If you need many fast lookups, when would you prefer a HashMap over a sorted array, and when the sorted array?
    ru: Если нужно много быстрых поисков, когда вы предпочтёте HashMap отсортированному массиву, а когда — массив?
