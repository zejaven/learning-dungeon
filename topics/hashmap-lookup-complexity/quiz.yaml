missions:
  - id: perform-lookup
    title:
      en: Read by key
      ru: Прочитай по ключу
    goal:
      en: Call get() so the map recomputes the bucket index and emits HASHMAP_GET.
      ru: Вызови get(), чтобы мапа заново вычислила индекс бакета и выдала HASHMAP_GET.
    event: HASHMAP_GET
  - id: create-collision-chain
    title:
      en: Create a collision chain
      ru: Создай цепочку коллизии
    goal:
      en: Put two different keys into the same bucket, for example "Aa" and "BB".
      ru: Положи два разных ключа в один бакет, например "Aa" и "BB".
    event: HASHMAP_COLLISION
  - id: trigger-resize
    title:
      en: Trigger resize
      ru: Вызови resize
    goal:
      en: Insert 13 entries so size passes the default threshold of 12.
      ru: Вставь 13 записей, чтобы размер превысил стандартный порог 12.
    event: HASHMAP_RESIZE

bossFight:
  - id: lookup-big-o
    en: 'What is the average time complexity of HashMap.get(), and what assumption makes that answer true?'
    ru: 'Какая средняя сложность HashMap.get(), и при каком предположении этот ответ верен?'
  - id: collision-worst-case
    en: 'When can HashMap lookup degrade from O(1) to O(n)?'
    ru: 'Когда выборка из HashMap может ухудшиться с O(1) до O(n)?'
  - id: java8-tree-bins
    en: 'What did Java 8 change for heavily collided HashMap buckets?'
    ru: 'Что Java 8 изменила для бакетов HashMap с большим числом коллизий?'
  - id: resize-and-lookup
    en: 'Does resize make get() expensive, or is resize mainly paid during put()?'
    ru: 'Делает ли resize вызов get() дорогим, или resize в основном оплачивается во время put()?'
  - id: key-contract
    en: 'Why can a mutable key make HashMap.get() return null even when the entry is still stored?'
    ru: 'Почему изменяемый ключ может заставить HashMap.get() вернуть null, хотя запись всё ещё хранится?'
