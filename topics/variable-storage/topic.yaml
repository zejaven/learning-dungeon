id: variable-storage
title:
  en: What a Variable Stores and Where
  ru: Что хранит переменная и где
category:
  en: Java Core / Memory
  ru: Java Core / Память
type: JVM_MEMORY
mode: trace
aiProvider: claude
aiModel: claude-opus-4-8
categoryId: java-core
difficulty: 1
catalogId: java-core-2
style: Real world
summary:
  en: >
    What a Java variable actually holds: a primitive variable stores its value
    directly in its stack slot, while a reference variable stores only a
    reference to an object that lives on the heap. From that one fact follow
    value-copy vs reference-copy, aliasing, reassignment and garbage, null, and
    why Java is pass-by-value.
  ru: >
    Что на самом деле хранит переменная в Java: примитивная переменная держит
    значение прямо в своём слоте на стеке, а ссылочная — только ссылку на объект,
    который живёт в куче. Из этого факта следуют копирование значения против
    копирования ссылки, алиасинг, переприсваивание и мусор, null и почему Java
    передаёт аргументы по значению.

# Visual primitives this topic's visualizer composes (frontend).
primitives:
  - BoxGroup

defaultExample: reference-holds-handle

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: primitive-holds-value
    title:
      en: Primitive holds the value
      ru: Примитив хранит значение
    file: 01-primitive-holds-value.java
    explanation:
      en: >
        int a = 5; int b = a; — a primitive variable stores the value itself in
        its own stack slot. Copying it copies the value, so changing b leaves a
        untouched.
      ru: >
        int a = 5; int b = a; — примитивная переменная хранит само значение в
        своём слоте на стеке. Копирование копирует значение, поэтому изменение b
        не трогает a.
  - id: reference-holds-handle
    title:
      en: Reference holds a handle
      ru: Ссылка хранит указатель
    file: 02-reference-holds-handle.java
    explanation:
      en: >
        Point p = new Point(1, 2); — the object lives on the heap; the variable p
        stores only a reference (a handle) to it, sitting in its stack slot.
      ru: >
        Point p = new Point(1, 2); — объект живёт в куче; переменная p хранит лишь
        ссылку (указатель) на него, лежащую в её слоте на стеке.
  - id: aliasing
    title:
      en: Two names, one object
      ru: Два имени, один объект
    file: 03-aliasing.java
    explanation:
      en: >
        Point q = p; copies the reference, not the object. q and p now point at
        the SAME heap object, so q.x = 99 is visible through p too.
      ru: >
        Point q = p; копирует ссылку, а не объект. q и p теперь указывают на ТОТ
        ЖЕ объект в куче, поэтому q.x = 99 видно и через p.
  - id: reassign-garbage
    title:
      en: Reassign and garbage
      ru: Переприсваивание и мусор
    file: 04-reassign-garbage.java
    explanation:
      en: >
        p = new Point(7, 8); repoints p at a fresh object. The old object is no
        longer reachable from any variable, so it becomes garbage.
      ru: >
        p = new Point(7, 8); перенаправляет p на новый объект. Прежний объект уже
        недостижим ни из одной переменной и становится мусором.
  - id: null-reference
    title:
      en: A reference can be null
      ru: Ссылка может быть null
    file: 05-null-reference.java
    explanation:
      en: >
        p = null; the variable still exists in its stack slot, but it now
        references no object at all. The object it used to point at can be
        collected.
      ru: >
        p = null; переменная по-прежнему есть в своём слоте на стеке, но теперь не
        ссылается ни на какой объект. Прежний объект может быть собран сборщиком.
  - id: pass-by-value
    title:
      en: Java is pass-by-value
      ru: Java передаёт по значению
    file: 06-pass-by-value.java
    explanation:
      en: >
        A method gets a COPY of the reference. Mutating the shared object is
        visible to the caller, but reassigning the parameter is not — the caller's
        variable keeps pointing at the original object.
      ru: >
        Метод получает КОПИЮ ссылки. Изменение общего объекта видно вызывающему, а
        переприсваивание параметра — нет: переменная вызывающего продолжает
        указывать на исходный объект.

