# Theory topic: no missions (there is no practice editor) - only a Boss Fight.
bossFight:
  - id: core-difference
    en: What is the main difference between an interface and an abstract class in Java?
    ru: В чем главное отличие интерфейса от абстрактного класса в Java?
  - id: choose-interface
    en: When would you choose an interface over an abstract class?
    ru: Когда стоит выбрать интерфейс вместо абстрактного класса?
  - id: choose-abstract-class
    en: When is an abstract class a better fit than an interface?
    ru: Когда абстрактный класс подходит лучше, чем интерфейс?
  - id: state-and-constructors
    en: Can interfaces and abstract classes have state and constructors?
    ru: Могут ли интерфейсы и абстрактные классы иметь состояние и конструкторы?
  - id: default-methods
    en: Do default methods make interfaces the same as abstract classes?
    ru: Делают ли default-методы интерфейсы такими же, как абстрактные классы?
  - id: multiple-inheritance
    en: How do interfaces and abstract classes differ in multiple inheritance?
    ru: Чем интерфейсы и абстрактные классы отличаются с точки зрения множественного наследования?
  - id: interview-example
    en: Give a small Java example where an interface is the right choice and another where an abstract class is the right choice.
    ru: Приведите небольшой Java-пример, где правильно выбрать интерфейс, и другой, где правильно выбрать абстрактный класс.
