id: reference-types-cache
languages: [en, ru]
title:
  en: Reference Types and a Memory-Sensitive Cache
  ru: Типы ссылок и кэш, чувствительный к памяти
category:
  en: Java Core / Memory & GC
  ru: Java Core / Память и GC
type: JVM_MEMORY
aiProvider: claude
aiModel: claude-opus-4-8
categoryId: memory-gc
difficulty: 2
catalogId: memory-gc-9
style: Real world
summary:
  en: >
    The four reference strengths in Java — strong, soft, weak and phantom — what
    each is for, and how the GC treats them. Reachability is decided by the
    strongest live reference: strong keeps an object forever, soft survives until
    memory runs low, weak is cleared at the next GC, and phantom is a post-mortem
    cleanup hook. The payoff is a cache built on soft references that the JVM
    clears for you when the heap is tight.
  ru: >
    Четыре силы ссылок в Java — strong, soft, weak и phantom — для чего каждая и
    как с ними обходится GC. Достижимость определяется самой сильной живой
    ссылкой: strong держит объект всегда, soft живёт до нехватки памяти, weak
    очищается на ближайшем GC, а phantom — это хук для пост-обработки. Итог —
    кэш на мягких ссылках, который JVM сам очистит, когда куче тесно.

primitives:
  - ArrayGrid
  - LinkedNodes

defaultExample: soft-cache

examples:
  - id: strong-reference
    title:
      en: Strong reference
      ru: Сильная ссылка
    file: 01-strong-reference.java
    explanation:
      en: >
        A strong reference keeps the object alive across any GC. Only after it is
        dropped (set to null) does the object become unreachable and get collected.
      ru: >
        Сильная ссылка держит объект живым при любом GC. Только после её сброса
        (= null) объект становится недостижимым и собирается.
  - id: weak-reference
    title:
      en: Weak reference
      ru: Слабая ссылка
    file: 02-weak-reference.java
    explanation:
      en: >
        A weak reference never keeps an object alive. Once the only strong
        reference is gone, the next GC clears it — the mechanism behind WeakHashMap.
      ru: >
        Слабая ссылка не удерживает объект. Как только исчезает единственная
        сильная ссылка, ближайший GC её очищает — основа WeakHashMap.
  - id: soft-cache
    title:
      en: Soft-reference cache
      ru: Кэш на мягких ссылках
    file: 03-soft-cache.java
    explanation:
      en: >
        A soft reference survives a normal GC (cache hit) but is cleared under
        memory pressure (cache miss). This is exactly the memory-sensitive cache
        the question asks for.
      ru: >
        Мягкая ссылка переживает обычный GC (попадание в кэш), но очищается при
        нехватке памяти (промах). Это и есть тот самый кэш из вопроса.
  - id: phantom-cleanup
    title:
      en: Phantom cleanup
      ru: Фантомная очистка
    file: 04-phantom-cleanup.java
    explanation:
      en: >
        A phantom reference's get() is always null; it is enqueued only after the
        object is collected, so you can run cleanup (free native memory) reliably.
      ru: >
        У фантомной ссылки get() всегда null; она ставится в очередь только после
        сборки объекта, поэтому очистку (освобождение нативной памяти) можно
        выполнить надёжно.
  - id: strength-wins
    title:
      en: Strongest reference wins
      ru: Побеждает сильнейшая ссылка
    file: 05-strength-wins.java
    explanation:
      en: >
        An object referenced both strongly and weakly is strongly reachable; the
        weak reference matters only after the strong one is dropped.
      ru: >
        Объект, на который есть и сильная, и слабая ссылка, достижим сильно;
        слабая ссылка важна лишь после сброса сильной.

assistantExample:
  en: "e.g. How would you build a cache the JVM clears automatically when memory runs low?"
  ru: "например: Как сделать кэш, который JVM сам очистит при нехватке памяти?"

