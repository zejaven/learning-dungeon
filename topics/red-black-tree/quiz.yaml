missions:
  - id: insert-red-black-node
    title:
      en: 'Insert a node'
      ru: 'Вставь узел'
    goal:
      en: 'Run code that inserts at least one key into the red-black tree.'
      ru: 'Запусти код, который вставляет хотя бы один ключ в красно-чёрное дерево.'
    event: RBT_INSERT
  - id: recolor-red-uncle
    title:
      en: 'Trigger recoloring'
      ru: 'Вызови перекраску'
    goal:
      en: 'Create a red parent with a red uncle so the tree repairs the colors.'
      ru: 'Создай красного родителя с красным дядей, чтобы дерево исправило цвета.'
    event: RBT_RECOLOR
  - id: rotate-left
    title:
      en: 'Trigger a left rotation'
      ru: 'Вызови левый поворот'
    goal:
      en: 'Insert ascending keys that form a right-right shape and force a left rotation.'
      ru: 'Вставь возрастающие ключи, которые образуют форму right-right и вызывают левый поворот.'
    event: RBT_ROTATE_LEFT
  - id: rotate-right
    title:
      en: 'Trigger a right rotation'
      ru: 'Вызови правый поворот'
    goal:
      en: 'Insert descending keys that form a left-left shape and force a right rotation.'
      ru: 'Вставь убывающие ключи, которые образуют форму left-left и вызывают правый поворот.'
    event: RBT_ROTATE_RIGHT
  - id: search-tree
    title:
      en: 'Trace a search'
      ru: 'Проследи поиск'
    goal:
      en: 'Call contains(...) and observe the short branch-by-branch search path.'
      ru: 'Вызови contains(...) и посмотри короткий путь поиска по веткам.'
    event: RBT_SEARCH
bossFight:
  - id: definition-invariants
    en: 'What is a red-black tree, and which invariants make it balanced?'
    ru: 'Что такое красно-чёрное дерево и какие инварианты делают его сбалансированным?'
  - id: complexity-reason
    en: 'Why do search, insert, and delete stay O(log n) in a red-black tree?'
    ru: 'Почему search, insert и delete остаются O(log n) в красно-чёрном дереве?'
  - id: recolor-vs-rotation
    en: 'When does insertion use recoloring, and when does it need a rotation?'
    ru: 'Когда вставка использует перекраску, а когда нужен поворот?'
  - id: rotation-purpose
    en: 'What does a tree rotation change, and what order does it preserve?'
    ru: 'Что меняет поворот дерева и какой порядок он сохраняет?'
  - id: java-collections-use
    en: 'Where do red-black trees appear in Java collections, and why?'
    ru: 'Где красно-чёрные деревья встречаются в Java Collections и зачем?'
  - id: common-misconceptions
    en: 'What are common misconceptions about red-black trees in interviews?'
    ru: 'Какие частые заблуждения о красно-чёрных деревьях встречаются на собеседованиях?'
