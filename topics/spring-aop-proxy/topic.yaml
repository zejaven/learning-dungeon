summary:
  en: >
    What a proxy is in Spring AOP: Spring often injects a wrapper bean instead of
    the raw target, so calls can be intercepted by advice before they reach the
    real method. Covers JDK dynamic proxies, CGLIB subclass proxies, self-invocation,
    and why proxy-based AOP affects public calls through Spring-managed beans.
  ru: >
    Что такое proxy в Spring AOP: Spring часто внедряет бин-обертку вместо
    исходного target, чтобы advice мог перехватывать вызовы до попадания в
    настоящий метод. Разбираются JDK dynamic proxies, CGLIB subclass proxies,
    self-invocation и почему proxy-based AOP работает для public вызовов через
    Spring-managed beans.

