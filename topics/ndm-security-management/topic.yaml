summary:
  en: >
    Security management as the "S" in FCAPS: the CIA triad, defence-in-depth,
    the AAA framework with TACACS+/RADIUS and least privilege, firewalls and
    DMZ design, VLAN segmentation, port security and 802.1X, IDS vs IPS and
    detection methodologies, SNMPv3 hardening, VPNs and data-at-rest
    encryption, log management, audits and pentesting, Zero Trust and AI-driven
    security.
  ru: >
    Управление безопасностью как «S» в FCAPS: триада CIA, defence-in-depth,
    каркас AAA с TACACS+/RADIUS и принципом least privilege, файрволы и дизайн
    DMZ, сегментация VLAN, port security и 802.1X, IDS против IPS и методологии
    обнаружения, укрепление SNMPv3, VPN и шифрование данных at-rest, управление
    логами, аудиты и пентестинг, Zero Trust и безопасность на основе AI.

