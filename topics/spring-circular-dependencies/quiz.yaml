missions:
  - id: detect-constructor-cycle
    title:
      en: Detect the cycle
      ru: Обнаружь цикл
    goal:
      en: Run a graph where A needs B, B needs C, and C needs A immediately.
      ru: Запусти graph, где A нужен B, B нужен C, а C сразу нужен A.
    event: SPRING_CYCLE_DETECTED
  - id: start-after-refactor
    title:
      en: Start after refactoring
      ru: Запусти после рефакторинга
    goal:
      en: Change the graph so dependencies point in one direction and the context becomes ready.
      ru: Измени graph так, чтобы dependencies шли в одну сторону и context стал ready.
    event: SPRING_CONTEXT_READY
  - id: inject-lazy-proxy
    title:
      en: Inject a lazy proxy
      ru: Внедри lazy proxy
    goal:
      en: Use a deferred @Lazy dependency so the back-reference is not created during constructor resolution.
      ru: Используй отложенную @Lazy dependency, чтобы back-reference не создавалась во время constructor resolution.
    event: SPRING_LAZY_PROXY_INJECTED
  - id: resolve-lazy-later
    title:
      en: Resolve after startup
      ru: Разреши после startup
    goal:
      en: Touch the @Lazy proxy after the context is ready so it resolves the real bean.
      ru: Обратись к @Lazy proxy после готовности context, чтобы он нашёл настоящий bean.
    event: SPRING_LAZY_TARGET_RESOLVED
  - id: request-provider
    title:
      en: Request through ObjectProvider
      ru: Запроси через ObjectProvider
    goal:
      en: Use an ObjectProvider-style dependency and request the target bean after startup.
      ru: Используй dependency в стиле ObjectProvider и запроси целевой bean после startup.
    event: SPRING_PROVIDER_REQUESTED

bossFight:
  - id: constructor-cycle-failure
    en: What happens when Spring creates A, then B, then C, and C requires A through constructor injection?
    ru: Что произойдёт, когда Spring создаёт A, затем B, затем C, а C требует A через constructor injection?
  - id: setter-field-cycle
    en: Why can setter or field cycles sometimes look like they work, and why should you still avoid relying on that?
    ru: Почему setter или field cycles иногда выглядят рабочими и почему всё равно не стоит на это полагаться?
  - id: avoid-by-design
    en: Name two design changes that remove a circular bean dependency without @Lazy.
    ru: Назови два изменения дизайна, которые убирают circular bean dependency без @Lazy.
  - id: lazy-injection-point
    en: Where would you place @Lazy in an A -> B -> C -> A cycle, and what does Spring inject there?
    ru: Где поставить @Lazy в цикле A -> B -> C -> A и что Spring внедрит в это место?
  - id: lazy-risks
    en: What risks does @Lazy introduce compared with actually refactoring the dependency graph?
    ru: Какие риски добавляет @Lazy по сравнению с настоящим рефакторингом dependency graph?
  - id: provider-vs-lazy
    en: When would ObjectProvider or Provider be clearer than @Lazy?
    ru: Когда ObjectProvider или Provider будут понятнее, чем @Lazy?
