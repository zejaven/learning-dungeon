summary:
  en: >
    Synchronous communication means the caller waits for the receiver to answer
    before it can continue, so the result is immediate but the services are tied
    together by latency and availability. Asynchronous communication means the
    sender hands off a message and continues, while the receiver processes it
    later, which improves decoupling and resilience but adds eventual consistency,
    retries, ordering and observability concerns.
  ru: >
    Синхронная коммуникация означает, что вызывающая сторона ждёт ответ получателя,
    прежде чем продолжить работу: результат приходит сразу, но сервисы связываются
    задержкой и доступностью друг друга. Асинхронная коммуникация означает, что
    отправитель передаёт сообщение и продолжает работу, а получатель обрабатывает
    его позже; это улучшает развязку и устойчивость, но добавляет eventual
    consistency, повторы, порядок обработки и вопросы наблюдаемости.

