# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: queue-locally-first
    title:
      en: Write the sale down first
      ru: Сначала запиши продажу
    goal:
      en: Run the code and put a sale into the client's durable local queue before any send.
      ru: Запусти код и положи продажу в надёжную локальную очередь клиента до любой отправки.
    event: SALE_QUEUED
  - id: survive-a-lost-response
    title:
      en: Survive a lost response
      ru: Переживи потерянный ответ
    goal:
      en: Retry a sale the server already registered and watch the idempotency store ignore it.
      ru: Повтори продажу, которую сервер уже зарегистрировал, и посмотри, как хранилище идемпотентности её игнорирует.
    event: DUPLICATE_IGNORED
  - id: drain-the-queue
    title:
      en: Drain the offline queue
      ru: Выгрузи офлайн-очередь
    goal:
      en: Go offline, keep selling, then reconnect and sync every queued sale at once.
      ru: Уйди в офлайн, продолжай продавать, затем восстанови связь и синхронизируй все накопленные продажи.
    event: QUEUE_DRAINED
  - id: trip-the-double-charge
    title:
      en: Trip the double-charge trap
      ru: Сработай на ловушке двойного списания
    goal:
      en: Retry a sale under a freshly generated key and watch the same sale get registered twice.
      ru: Повтори продажу с заново сгенерированным ключом и посмотри, как одна и та же продажа зарегистрируется дважды.
    event: DOUBLE_CHARGE_DETECTED

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: overall-design
    en: Design an API for registering sales from a till whose connection drops constantly. What are the moving parts?
    ru: Спроектируй API для регистрации продаж с кассы, у которой постоянно рвётся связь. Из каких частей он состоит?
  - id: timeout-ambiguity
    en: The client times out waiting for the response. What are the two possible server states, and how does the client resolve the ambiguity?
    ru: У клиента истёк таймаут ожидания ответа. Какие два состояния сервера возможны и как клиент разрешает эту неоднозначность?
  - id: who-mints-the-key
    en: Who generates the idempotency key — the client or the server — and at what exact moment?
    ru: Кто генерирует ключ идемпотентности — клиент или сервер — и в какой именно момент?
  - id: server-side-dedup
    en: How does the server implement idempotency? What does it store, and what does it return on a repeat request?
    ru: Как сервер реализует идемпотентность? Что он хранит и что возвращает на повторный запрос?
  - id: concurrent-retries
    en: Two retries of the same key arrive at two instances at the same time. What stops both from registering the sale?
    ru: Два повтора с одним ключом приходят одновременно на два инстанса. Что мешает обоим зарегистрировать продажу?
  - id: retry-policy
    en: How should the client retry — how often, for how long, and what stops a fleet of tills from causing a retry storm?
    ru: Как клиент должен повторять запросы — как часто, как долго и что мешает парку касс устроить шторм повторов?
  - id: key-lifetime
    en: How long does the server keep idempotency keys, and what breaks if that window is too short?
    ru: Как долго сервер хранит ключи идемпотентности и что ломается, если это окно слишком короткое?
  - id: same-key-different-body
    en: A request arrives with a known key but a different body. What should the API do?
    ru: Приходит запрос с известным ключом, но с другим телом. Что должен сделать API?
  - id: ordering-and-clocks
    en: Sales synced hours late arrive out of order and the till's clock is wrong. How do you keep the reports correct?
    ru: Продажи, синхронизированные с задержкой в часы, приходят не по порядку, а часы на кассе врут. Как сохранить корректность отчётов?
  - id: exactly-once
    en: Why is true exactly-once delivery impossible here, and what do you promise the business instead?
    ru: Почему настоящая доставка exactly-once здесь невозможна и что вместо неё обещают бизнесу?
