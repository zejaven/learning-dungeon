summary:
  en: >
    When associations are mapped LAZY (the recommended default), how to load them
    eagerly for one specific query without changing the mapping. Covers JPQL/HQL
    JOIN FETCH, the Criteria API fetch(), JPA entity graphs (@NamedEntityGraph,
    @EntityGraph, the javax/jakarta.persistence.fetchgraph and loadgraph hints),
    and Hibernate.initialize(). Explains why query-time fetching beats EAGER on the
    mapping, the MultipleBagFetchException and pagination traps, and the N+1
    problem it solves.
  ru: >
    Когда связи замаплены как LAZY (рекомендуемое значение по умолчанию), как
    загрузить их жадно для одного конкретного запроса, не меняя маппинг.
    Разбираем JPQL/HQL JOIN FETCH, fetch() в Criteria API, графы сущностей JPA
    (@NamedEntityGraph, @EntityGraph, хинты javax/jakarta.persistence.fetchgraph и
    loadgraph) и Hibernate.initialize(). Объясняем, почему загрузка на уровне
    запроса лучше, чем EAGER в маппинге, ловушки MultipleBagFetchException и
    пагинации, а также какую проблему N+1 это решает.

