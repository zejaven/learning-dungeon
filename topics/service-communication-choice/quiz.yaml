# Theory topic: no missions (there is no practice editor) - only a Boss Fight.
bossFight:
  - id: no-universal-winner
    en: Why is there no universally preferable choice between synchronous and asynchronous service communication?
    ru: Почему между синхронным и асинхронным взаимодействием сервисов нет универсально предпочтительного выбора?
  - id: sync-preferred
    en: In which situations is synchronous communication preferable between services?
    ru: В каких ситуациях синхронное взаимодействие между сервисами предпочтительнее?
  - id: async-preferred
    en: In which situations is asynchronous communication preferable between services?
    ru: В каких ситуациях асинхронное взаимодействие между сервисами предпочтительнее?
  - id: consistency-tradeoff
    en: How does the choice change when the business can or cannot tolerate eventual consistency?
    ru: Как выбор меняется, если бизнес может или не может допустить eventual consistency?
  - id: failure-tradeoff
    en: How do failure-handling responsibilities differ for synchronous calls and asynchronous messaging?
    ru: Чем отличаются обязанности по обработке сбоев в синхронных вызовах и асинхронных сообщениях?
  - id: hybrid-design
    en: Describe a flow where synchronous communication at the edge and asynchronous processing inside the system is a good design.
    ru: Опишите сценарий, где синхронное взаимодействие на входе и асинхронная обработка внутри системы являются хорошим дизайном.
