# Structural missions: checked against the analyzed class graph (not trace events).
# A mission passes when EVERY predicate in `requires` holds. Predicate kinds:
#   interfaceWithImpls { minImplementations, name? }
#   composition        { targetKind, ownerKind?, name? }
#   edge               { relation: extends|implements|association, from?, to? }
#   nodeExists         { nodeKind, name? }
missions:
  - id: strategy-interface
    type: structure
    title:
      en: Define a Strategy interface
      ru: Определи интерфейс Strategy
    goal:
      en: Create an interface with at least two implementing classes.
      ru: Создай интерфейс с минимум двумя реализующими классами.
    requires:
      - { kind: interfaceWithImpls, minImplementations: 2 }
  - id: context-holds-strategy
    type: structure
    title:
      en: Context holds a Strategy
      ru: Контекст хранит Strategy
    goal:
      en: A class has a field whose type is the strategy interface.
      ru: У класса есть поле, тип которого — интерфейс стратегии.
    requires:
      - { kind: composition, targetKind: interface }
  - id: strategy-assembled
    type: structure
    title:
      en: Strategy assembled
      ru: Strategy собран
    goal:
      en: An interface with two or more implementations AND a context that composes it.
      ru: Интерфейс с двумя и более реализациями И контекст, который его композирует.
    requires:
      - { kind: interfaceWithImpls, minImplementations: 2 }
      - { kind: composition, targetKind: interface }

bossFight:
  - id: what-strategy
    en: What is the Strategy pattern and what problem does it solve?
    ru: Что такое паттерн Strategy и какую проблему он решает?
  - id: strategy-vs-state
    en: How does the Strategy pattern differ from the State pattern?
    ru: Чем паттерн Strategy отличается от паттерна State?
  - id: strategy-vs-ifelse
    en: Why prefer Strategy over a big if/else or a switch on a type?
    ru: Почему Strategy лучше большого if/else или switch по типу?
  - id: strategy-runtime
    en: How does Strategy let you change behaviour at runtime without editing the context?
    ru: Как Strategy позволяет менять поведение во время выполнения, не редактируя контекст?
