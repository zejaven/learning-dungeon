defaultExample: the-answer

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: the-answer
    title:
      en: 'The answer, in one lookup'
      ru: 'Ответ за один поиск'
    file: 01-the-answer.java
    explanation:
      en: >
        application.properties says 8080, the deployment sets SERVER_PORT=9000,
        and the application listens on 9000. Watch where the walk stops: the
        Environment never reaches the file, because a source higher up already
        answered. The file value is not erased and not merged — it is shadowed,
        and it comes back the moment the variable is unset.
      ru: >
        В application.properties написано 8080, деплой задаёт SERVER_PORT=9000,
        и приложение слушает 9000. Обратите внимание, где останавливается
        обход: до файла Environment просто не доходит, потому что ответ уже дал
        источник выше. Значение из файла не стёрто и не слито — оно затенено и
        вернётся, как только переменную уберут.
  - id: names-in-the-shell
    title:
      en: 'SPRING_DATASOURCE_URL finds spring.datasource.url'
      ru: 'SPRING_DATASOURCE_URL находит spring.datasource.url'
    file: 02-names-in-the-shell.java
    explanation:
      en: >
        No shell lets you export a variable with dots in its name, so Spring
        meets you halfway: it converts the key you asked for into the shouty
        spelling (uppercase, dots to underscores, dashes dropped) and matches on
        that. The last line is the trap that follows from it — the same process
        where getProperty("spring.datasource.url") succeeds has
        System.getenv("spring.datasource.url") returning null, because relaxed
        binding belongs to Spring, not to the JVM.
      ru: >
        Ни одна оболочка не даст экспортировать переменную с точками в имени,
        поэтому Spring идёт навстречу: он переводит запрошенный ключ в
        написание капсом (верхний регистр, точки в подчёркивания, дефисы
        убираются) и ищет по нему. Последняя строка — вытекающая отсюда ловушка:
        в том же процессе, где getProperty("spring.datasource.url") срабатывает,
        System.getenv("spring.datasource.url") вернёт null, потому что relaxed
        binding принадлежит Spring, а не JVM.
  - id: the-full-ladder
    title:
      en: 'One key, five definitions'
      ru: 'Один ключ, пять определений'
    file: 03-the-full-ladder.java
    explanation:
      en: >
        server.port is set in the jar, in a file next to the jar, in the
        environment, with -D and on the command line — deliberately in that
        order, bottom-up, so you can see that the winner is decided by rank and
        not by who wrote last. The report at the end is the ladder itself; it is
        the thing worth memorising, because every "why is my value ignored"
        question is really a question about which rung the other value sits on.
      ru: >
        server.port задан в jar, в файле рядом с jar, в окружении, через -D и в
        командной строке — намеренно именно в таком порядке, снизу вверх, чтобы
        было видно: победителя определяет ранг, а не то, кто записал последним.
        Отчёт в конце — это и есть та самая лестница; именно её стоит запомнить,
        потому что любой вопрос «почему моё значение игнорируется» на самом деле
        про то, на какой ступеньке лежит другое значение.
  - id: profiles
    title:
      en: 'A profile file is not a lower-priority file'
      ru: 'Файл профиля — не файл с меньшим приоритетом'
    file: 04-profiles.java
    explanation:
      en: >
        application-prod.properties ships inside the same jar and is completely
        ignored until prod is active — not read at low priority, not read at
        all. Switch the profile on and it jumps above the plain
        application.properties next to it. Then set the environment variable and
        it wins over the profile too: profiles reorder the files among
        themselves, they do not lift a file above the environment.
      ru: >
        application-prod.properties лежит в том же jar и полностью игнорируется,
        пока не активен профиль prod, — не читается с низким приоритетом, а не
        читается вообще. Включите профиль — и он окажется выше обычного
        application.properties рядом с ним. Затем задайте переменную окружения —
        и она победит и профиль: профили переупорядочивают файлы между собой, но
        не поднимают файл выше окружения.
  - id: low-priority-sources
    title:
      en: 'The two sources that lose to the file'
      ru: 'Два источника, проигрывающих файлу'
    file: 05-low-priority-sources.java
    explanation:
      en: >
        @PropertySource looks like a deliberate decision and reads like an
        override, and it loses to the ordinary application.properties anyway —
        this is the single most common surprise in the whole ladder.
        setDefaultProperties is below even that, on purpose: it is the floor
        everything else is allowed to stand on.
      ru: >
        @PropertySource выглядит как осознанное решение и читается как
        переопределение — и всё равно проигрывает обычному
        application.properties: это самый частый сюрприз во всей лестнице.
        setDefaultProperties лежит ещё ниже, и это сделано намеренно: это тот
        пол, на который позволено встать всему остальному.
  - id: per-key-not-per-file
    title:
      en: 'Overriding is per key, and a typo is silent'
      ru: 'Переопределение по ключу, а опечатка молчит'
    file: 06-per-key-not-per-file.java
    explanation:
      en: >
        One variable overrides one key; the other two keys in the same file are
        untouched, because a source is not a file that replaces another file —
        it is a bag of keys consulted in order. The second variable has a typo
        in its name, so it overrides nothing, reports nothing and simply is not
        there. The last lookup shows what "not there" looks like from the inside:
        null, which in a real application is a startup failure or, worse, a
        default you did not notice.
      ru: >
        Одна переменная переопределяет один ключ; два других ключа того же файла
        не тронуты, потому что источник — это не файл, заменяющий другой файл, а
        набор ключей, опрашиваемых по порядку. У второй переменной опечатка в
        имени, поэтому она ничего не переопределяет, ни о чём не сообщает и
        просто отсутствует. Последний поиск показывает, как это «отсутствует»
        выглядит изнутри: null, а в реальном приложении — падение при старте
        или, что хуже, незамеченное значение по умолчанию.
  - id: one-image-two-environments
    title:
      en: 'One jar, staging and production'
      ru: 'Один jar, staging и прод'
    file: 07-one-image-two-environments.java
    explanation:
      en: >
        This is what the precedence rule is FOR. The same artefact, built once
        and promoted unchanged, meets two different sets of variables and
        becomes two differently configured services. Everything nobody
        overrode — the log level here — stays identical, which is the property
        that makes staging a meaningful rehearsal for production.
      ru: >
        Вот ради чего вообще существует правило приоритетов. Один и тот же
        артефакт, собранный однажды и продвинутый без изменений, встречает два
        разных набора переменных и превращается в два по-разному настроенных
        сервиса. Всё, что никто не переопределял, — здесь уровень логирования —
        остаётся одинаковым, и именно это свойство делает staging осмысленной
        репетицией прода.
  - id: in-tests
    title:
      en: 'Why a test ignores your variables'
      ru: 'Почему тест игнорирует ваши переменные'
    file: 08-in-tests.java
    explanation:
      en: >
        A laptop with SERVER_PORT and SPRING_DATASOURCE_URL exported in .bashrc
        would make integration tests depend on whose machine they run on.
        @SpringBootTest(properties = …) sits at the very top of the ladder for
        exactly that reason, above the command line and above the environment,
        so a test pins what it needs and nothing outside the test can move it.
      ru: >
        Ноутбук с экспортированными в .bashrc SERVER_PORT и
        SPRING_DATASOURCE_URL сделал бы интеграционные тесты зависимыми от того,
        на чьей машине они запущены. Именно поэтому @SpringBootTest(properties =
        …) стоит на самом верху лестницы — выше командной строки и выше
        окружения: тест фиксирует то, что ему нужно, и ничто снаружи не может
        это сдвинуть.

