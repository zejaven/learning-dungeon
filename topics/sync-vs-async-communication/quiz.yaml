# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: core-difference
    en: What is the core difference between synchronous and asynchronous communication?
    ru: В чём основная разница между синхронной и асинхронной коммуникацией?
  - id: sync-use-cases
    en: When would you choose synchronous communication between services?
    ru: Когда стоит выбрать синхронную коммуникацию между сервисами?
  - id: async-use-cases
    en: When would you choose asynchronous communication between services?
    ru: Когда стоит выбрать асинхронную коммуникацию между сервисами?
  - id: tradeoffs
    en: What tradeoffs does asynchronous communication introduce?
    ru: Какие компромиссы добавляет асинхронная коммуникация?
  - id: failure-handling
    en: How do failures differ in synchronous calls and asynchronous messaging?
    ru: Чем отличается обработка сбоев в синхронных вызовах и асинхронных сообщениях?
  - id: common-trap
    en: Why is it wrong to say that asynchronous communication is always faster or always better?
    ru: Почему неверно говорить, что асинхронная коммуникация всегда быстрее или всегда лучше?
