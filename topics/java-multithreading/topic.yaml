id: java-multithreading
languages: [en, ru]
title:
  en: Java Multithreading
  ru: Многопоточность в Java
category:
  en: Java Core / Concurrency
  ru: Java Core / Многопоточность
type: CONCURRENCY
mode: trace
summary:
  en: >
    How Java runs multiple threads inside one JVM process, how start() creates a
    separate execution path, how thread lifecycle states fit together, and why
    shared mutable state needs coordination.
  ru: >
    Как Java запускает несколько threads внутри одного процесса JVM, как start()
    создает отдельный путь выполнения, как связаны состояния lifecycle thread и
    почему общее изменяемое состояние требует координации.
categoryId: concurrency
difficulty: 2
catalogId: concurrency-3
style: Real world
aiProvider: codex
aiModel: gpt-5.5

primitives:
  - ArrayGrid
  - LinkedNodes
  - EventLog

defaultExample: start-worker

examples:
  - id: start-worker
    title:
      en: start() creates a worker
      ru: start() создает worker
    file: 01-start-worker.java
    explanation:
      en: >
        A Runnable describes the task, a Thread owns the execution path, and
        start() asks the JVM to run the task on a separate Java thread.
      ru: >
        Runnable описывает задачу, Thread владеет путем выполнения, а start()
        просит JVM выполнить задачу в отдельном Java thread.
  - id: two-workers
    title:
      en: Two workers, one task
      ru: Два worker, одна задача
    file: 02-two-workers.java
    explanation:
      en: >
        The same Runnable instance can be attached to more than one Thread, which
        separates reusable work from the workers that run it.
      ru: >
        Один экземпляр Runnable можно привязать к нескольким Thread, что отделяет
        переиспользуемую работу от worker, которые ее выполняют.
  - id: run-vs-start
    title:
      en: run() is not start()
      ru: run() не start()
    file: 03-run-vs-start.java
    explanation:
      en: >
        Calling run() directly is a normal method call on the current thread.
        Calling start() creates a separate execution path.
      ru: >
        Прямой вызов run() является обычным вызовом метода в текущем thread.
        Вызов start() создает отдельный путь выполнения.
  - id: subclass-thread
    title:
      en: Thread subclass
      ru: Подкласс Thread
    file: 04-subclass-thread.java
    explanation:
      en: >
        Extending Thread works, but it couples the task to the worker object
        instead of keeping the work reusable.
      ru: >
        Наследование от Thread работает, но связывает задачу с объектом worker,
        вместо того чтобы оставить работу переиспользуемой.
  - id: lifecycle
    title:
      en: Lifecycle to TERMINATED
      ru: Lifecycle до TERMINATED
    file: 05-lifecycle.java
    explanation:
      en: >
        A started thread enters execution, runs its task, and then reaches
        TERMINATED. A Java Thread object cannot be started again after that.
      ru: >
        Запущенный thread входит в выполнение, выполняет задачу и затем достигает
        TERMINATED. Объект Java Thread нельзя запустить снова после этого.

