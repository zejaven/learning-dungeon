bossFight:
  - id: error-defect-failure-difference
    en: 'What is the difference between an error, a defect (bug, fault), and a failure? Explain the cause-and-effect chain.'
    ru: 'В чём разница между ошибкой (error), дефектом (defect, bug, fault) и сбоем (failure)? Объясните цепочку «причина — следствие».'
  - id: who-finds-what
    en: 'Why is the same underlying problem named differently depending on who found it — a developer, a tester, or an end user?'
    ru: 'Почему одна и та же проблема называется по-разному в зависимости от того, кто её нашёл — разработчик, тестировщик или конечный пользователь?'
  - id: defect-without-failure
    en: 'Can a defect exist in a program without ever causing a failure? Give an example.'
    ru: 'Может ли дефект существовать в программе, ни разу не вызвав сбой (failure)? Приведите пример.'
  - id: failure-without-defect
    en: 'Can a failure occur that is not caused by any defect in the code? Give examples.'
    ru: 'Может ли произойти сбой (failure), который не вызван ни одним дефектом в коде? Приведите примеры.'
  - id: bug-causes
    en: 'What are the typical causes that lead to bugs in software? Name as many as you can.'
    ru: 'Какие типовые причины приводят к появлению багов в ПО? Назовите как можно больше.'
  - id: bugs-born-before-code
    en: 'Why do interviewers say that many bugs are born before any code is written? Which causes does this refer to?'
    ru: 'Почему говорят, что многие баги рождаются ещё до написания кода? К каким причинам это относится?'
  - id: defect-without-error
    en: 'Can a program contain a defect even though the developer made no mistake? How?'
    ru: 'Может ли программа содержать дефект, если разработчик не допустил ошибки? Как такое возможно?'
