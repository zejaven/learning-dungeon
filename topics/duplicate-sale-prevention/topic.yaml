id: duplicate-sale-prevention
languages: [en, ru]
title:
  en: Avoiding Duplicate Sales on Registration
  ru: Как избежать дублей при регистрации продаж
category:
  en: Microservices / Data Consistency
  ru: Микросервисы / Согласованность данных
type: OTHER
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: microservices
difficulty: 3
catalogId: microservices-13
summary:
  en: >
    A sale can arrive twice for reasons you do not control: a retried HTTP call,
    a redelivered message, a double-tapped button, a re-synced offline queue.
    Duplicates are prevented on the server, not on the client, by giving every
    sale an explicit identity and enforcing that identity where it cannot race —
    a UNIQUE index or an ON CONFLICT upsert, with the dedup row and the sale row
    written in one transaction. An application-level "check, then insert" is not
    a guard, deduplicating by a hash of the payload silently deletes real sales,
    and a retention window shorter than the longest possible retry quietly
    reopens the hole.
  ru: >
    Продажа может прийти дважды по причинам, которые вы не контролируете:
    повторный HTTP-запрос, повторная доставка сообщения, двойное нажатие кнопки,
    повторная синхронизация офлайн-очереди. Дубли предотвращаются на сервере, а
    не на клиенте: каждой продаже дают явную идентичность и проверяют её там, где
    невозможна гонка — UNIQUE-индексом или upsert с ON CONFLICT, записывая строку
    дедупликации и строку продажи в одной транзакции. Проверка «сначала SELECT,
    потом INSERT» на уровне приложения защитой не является, дедупликация по хэшу
    тела запроса молча удаляет настоящие продажи, а окно хранения короче самого
    долгого возможного повтора тихо открывает дыру обратно.

