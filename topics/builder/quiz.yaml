missions:
  - id: add-concrete-builder
    type: structure
    title:
      en: Add a concrete Builder
      ru: Добавь конкретный Builder
    goal:
      en: Add DefaultOrderBuilder and make it implement OrderBuilder.
      ru: Добавь DefaultOrderBuilder и сделай так, чтобы он реализовывал OrderBuilder.
    requires:
      - { kind: nodeExists, nodeKind: class, name: DefaultOrderBuilder }
      - { kind: edge, relation: implements, from: DefaultOrderBuilder, to: OrderBuilder }
  - id: service-depends-on-builder
    type: structure
    title:
      en: Service depends on Builder
      ru: Service зависит от Builder
    goal:
      en: Give OrderService a field of type OrderBuilder instead of constructing Order directly.
      ru: Дай OrderService поле типа OrderBuilder вместо прямого создания Order.
    requires:
      - { kind: edge, relation: association, from: OrderService, to: OrderBuilder }
  - id: builder-structure-assembled
    type: structure
    title:
      en: Builder structure assembled
      ru: Структура Builder собрана
    goal:
      en: The graph shows a concrete builder implementing OrderBuilder and OrderService holding the builder contract.
      ru: Граф показывает, что конкретный builder реализует OrderBuilder, а OrderService хранит контракт builder.
    requires:
      - { kind: interfaceWithImpls, name: OrderBuilder, minImplementations: 1 }
      - { kind: edge, relation: implements, from: DefaultOrderBuilder, to: OrderBuilder }
      - { kind: edge, relation: association, from: OrderService, to: OrderBuilder }

bossFight:
  - id: problem-solved
    en: What problem does the Builder pattern solve?
    ru: Какую проблему решает паттерн Builder?
  - id: when-to-use
    en: When is Builder a better fit than a constructor with many parameters?
    ru: Когда Builder подходит лучше, чем конструктор с большим количеством параметров?
  - id: builder-roles
    en: Name the Builder pattern roles and explain how object creation flows through them.
    ru: Назови роли паттерна Builder и объясни, как через них проходит создание объекта.
  - id: builder-vs-factory
    en: How is Builder different from Factory Method or Abstract Factory?
    ru: Чем Builder отличается от Factory Method или Abstract Factory?
  - id: immutability-validation
    en: How can Builder help create immutable objects and centralize validation?
    ru: Как Builder помогает создавать immutable-объекты и централизовать валидацию?
