# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: run-somebody-elses-script
    title:
      en: Run somebody else's script
      ru: Выполни чужой скрипт
    goal:
      en: Render an unescaped value that contains markup and watch the browser execute it on your origin.
      ru: Отрисуй неэкранированное значение с разметкой внутри и посмотри, как браузер выполнит её на твоём origin.
    event: SCRIPT_EXECUTED
  - id: steal-the-session
    title:
      en: Steal the session cookie
      ru: Укради куку сессии
    goal:
      en: Let an injected script reach document.cookie and see what the attacker walks away with.
      ru: Дай внедрённому скрипту добраться до document.cookie и посмотри, с чем уходит злоумышленник.
    event: COOKIE_STOLEN
  - id: neutralize-the-payload
    title:
      en: Turn the payload back into text
      ru: Преврати нагрузку обратно в текст
    goal:
      en: Encode on output so the same payload becomes a text node instead of an element.
      ru: Экранируй на выводе, чтобы та же нагрузка стала текстовым узлом, а не элементом.
    event: RENDERED_AS_TEXT
  - id: serve-a-stored-payload
    title:
      en: Hit a visitor who did nothing
      ru: Порази посетителя, который ничего не делал
    goal:
      en: Save an untrusted value once and serve it to a reader who never saw the attacker's link.
      ru: Сохрани недоверенное значение один раз и отдай его читателю, который не видел ссылки злоумышленника.
    event: STORED_PAYLOAD_SERVED
  - id: bypass-the-server
    title:
      en: Attack without touching the server
      ru: Атакуй, не трогая сервер
    goal:
      en: Reach a DOM sink from the URL fragment and confirm server-side encoding never had a chance to run.
      ru: Дотянись до DOM-приёмника из фрагмента URL и убедись, что серверное экранирование даже не запускалось.
    event: DOM_XSS
  - id: escape-in-the-wrong-context
    title:
      en: Escape it and lose anyway
      ru: Экранируй — и всё равно проиграй
    goal:
      en: Apply the HTML escaper to a script block or a link and watch the payload execute despite it.
      ru: Примени HTML-экранирование к блоку script или к ссылке и посмотри, как нагрузка выполняется несмотря на это.
    event: WRONG_CONTEXT
  - id: sanitize-rich-text
    title:
      en: Keep the formatting, drop the script
      ru: Сохрани форматирование, выбрось скрипт
    goal:
      en: Sanitize a value that must stay HTML and see which parts the allowlist keeps.
      ru: Пропусти через санитайзер значение, которое обязано остаться HTML, и увидь, что оставит белый список.
    event: INPUT_SANITIZED
  - id: catch-it-with-csp
    title:
      en: Catch an injection with CSP
      ru: Поймай внедрение с помощью CSP
    goal:
      en: Leave the page unescaped but send a Content-Security-Policy, and see the injected script refused.
      ru: Оставь страницу без экранирования, но отправь Content-Security-Policy, и увидь, как внедрённый скрипт отклонят.
    event: CSP_BLOCKED
  - id: hide-the-cookie
    title:
      en: 'Make the cookie unreadable'
      ru: 'Сделай куку нечитаемой'
    goal:
      en: Mark the session cookie HttpOnly and check what the running script can and cannot still do.
      ru: Пометь куку сессии как HttpOnly и проверь, что выполняющийся скрипт всё ещё может, а что уже нет.
    event: COOKIE_PROTECTED

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: what-is-xss
    en: What is cross-site scripting, and what exactly goes wrong for the victim?
    ru: Что такое межсайтовый скриптинг и что именно происходит с жертвой?
  - id: three-types
    en: What are the three types of XSS — reflected, stored and DOM-based — and how do they differ in delivery and impact?
    ru: Какие есть три вида XSS — отражённый, хранимый и DOM-based — и чем они отличаются по доставке и по последствиям?
  - id: why-origin-matters
    en: Why is it so serious that the injected script runs on your origin? What does the same-origin policy give the attacker here?
    ru: Почему настолько серьёзно, что внедрённый скрипт выполняется на твоём origin? Что даёт злоумышленнику правило одного источника в этом случае?
  - id: encode-on-output
    en: Why is the fix output encoding rather than input validation? Where exactly in the code does it belong?
    ru: Почему чинится экранированием на выводе, а не валидацией ввода? Где именно в коде этому место?
  - id: context-dependent-encoding
    en: Why does the right encoding depend on the context? Compare the HTML body, an attribute, a script block and a URL.
    ru: Почему правильное экранирование зависит от контекста? Сравни тело HTML, атрибут, блок script и URL.
  - id: escaping-vs-sanitizing
    en: What is the difference between escaping and sanitizing, and when do you need a sanitizer instead of an encoder?
    ru: В чём разница между экранированием и санитайзингом и когда нужен санитайзер вместо экранирования?
  - id: blocklist-vs-allowlist
    en: Why is a blocklist ('strip the word script') a losing strategy for XSS, and what does an allowlist do differently?
    ru: Почему чёрный список («вырезаем слово script») — проигрышная стратегия против XSS и что делает иначе белый список?
  - id: no-script-tag
    en: Can there be XSS without a script tag? Give payloads that use an attribute, an image, or a link.
    ru: Возможен ли XSS без тега script? Приведи нагрузки, использующие атрибут, картинку или ссылку.
  - id: dom-xss-detection
    en: Why can DOM-based XSS be invisible in server logs, and how would you find one in a code review?
    ru: Почему DOM-based XSS может быть невидим в логах сервера и как найти такой на ревью кода?
  - id: dangerous-sinks
    en: Which browser APIs are dangerous sinks for untrusted data, and what are the safe alternatives?
    ru: Какие браузерные API являются опасными приёмниками для недоверенных данных и чем их безопасно заменить?
  - id: csp-role
    en: What does a Content-Security-Policy actually do about XSS, and why does 'unsafe-inline' undo most of it?
    ru: Что на самом деле делает Content-Security-Policy против XSS и почему 'unsafe-inline' сводит на нет почти всё?
  - id: httponly-limits
    en: Does an HttpOnly cookie stop XSS? What can the attacker still do without ever reading the cookie?
    ru: Останавливает ли XSS кука HttpOnly? Что злоумышленник всё равно может сделать, ни разу не прочитав куку?
  - id: xss-vs-csrf
    en: How do XSS and CSRF differ, and why do CSRF tokens not help once a site has an XSS?
    ru: Чем XSS отличается от CSRF и почему CSRF-токены не помогают, если на сайте есть XSS?
  - id: spring-thymeleaf
    en: How do server-side templates in the Java world (Thymeleaf, JSP, Freemarker) protect against XSS, and how do developers switch that protection off by accident?
    ru: Как серверные шаблоны в мире Java (Thymeleaf, JSP, Freemarker) защищают от XSS и как разработчики случайно эту защиту отключают?
  - id: json-api-xss
    en: A backend that only returns JSON — can it still be responsible for an XSS? Where would the bug be?
    ru: Бэкенд, который отдаёт только JSON, — может ли он всё равно быть виноват в XSS? Где тогда будет ошибка?
  - id: frameworks-and-xss
    en: Modern frontend frameworks escape by default. Which escape hatches reintroduce XSS, and what should code review look for?
    ru: Современные фронтенд-фреймворки экранируют по умолчанию. Какие лазейки возвращают XSS и что искать на ревью кода?
  - id: defence-in-depth
    en: Lay out a layered defence against XSS for a real application, and say which layer actually fixes the bug.
    ru: Разложи многоуровневую защиту от XSS для реального приложения и скажи, какой уровень действительно чинит ошибку.
  - id: incident-response
    en: A stored XSS is found in production comments. What do you do first, and why is fixing the template not the end of it?
    ru: В продакшене нашли хранимый XSS в комментариях. Что делаешь первым делом и почему починкой шаблона дело не заканчивается?
