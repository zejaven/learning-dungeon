# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: read-size-table
    title:
      en: Read the size table
      ru: Прочитай таблицу размеров
    goal:
      en: Run an example that emits the byte-size table for all primitive types.
      ru: Запусти пример, который выводит таблицу размеров в байтах для всех примитивных типов.
    event: PRIMITIVE_SIZE_TABLE
  - id: compare-integer-widths
    title:
      en: Compare integer widths
      ru: Сравни ширину целых типов
    goal:
      en: Focus on byte, short, int, and long so their 1/2/4/8-byte pattern is clear.
      ru: Сфокусируйся на byte, short, int и long, чтобы увидеть схему 1/2/4/8 байт.
    event: PRIMITIVE_INTEGRAL_SIZES
  - id: explain-char-size
    title:
      en: Explain char size
      ru: Объясни размер char
    goal:
      en: Show that char is 2 bytes because it is a 16-bit UTF-16 code unit.
      ru: Покажи, что char занимает 2 байта, потому что это 16-битная кодовая единица UTF-16.
    event: PRIMITIVE_CHAR_SIZE
  - id: catch-boolean-trap
    title:
      en: Catch the boolean trap
      ru: Поймай ловушку boolean
    goal:
      en: Emit the boolean caveat and explain why Java does not guarantee a portable byte count.
      ru: Выведи оговорку про boolean и объясни, почему Java не гарантирует переносимое число байт.
    event: PRIMITIVE_BOOLEAN_CAVEAT
  - id: separate-footprint
    title:
      en: Separate value size from footprint
      ru: Отдели размер значения от следа в памяти
    goal:
      en: Show why primitive value width is not the same as an object's full memory footprint.
      ru: Покажи, почему ширина значения примитива не равна полному следу объекта в памяти.
    event: PRIMITIVE_STORAGE_CONTEXT

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: primitive-byte-table
    en: List the byte sizes of byte, short, int, long, float, double, and char in Java.
    ru: Перечисли размеры byte, short, int, long, float, double и char в Java в байтах.
  - id: boolean-size-caveat
    en: Why is boolean a special case when someone asks how many bytes every primitive type occupies?
    ru: Почему boolean - особый случай, когда спрашивают, сколько байт занимает каждый примитивный тип?
  - id: char-two-bytes
    en: Why does char occupy 2 bytes, and what does that have to do with UTF-16?
    ru: Почему char занимает 2 байта и как это связано с UTF-16?
  - id: value-size-vs-object-size
    en: Why is the size of a primitive value not the same thing as the memory footprint of a field, array, or object?
    ru: Почему размер значения примитива - это не то же самое, что след в памяти у поля, массива или объекта?
  - id: float-double-sizes
    en: Which primitive types occupy 4 bytes, and which occupy 8 bytes?
    ru: Какие примитивные типы занимают 4 байта, а какие - 8 байт?
