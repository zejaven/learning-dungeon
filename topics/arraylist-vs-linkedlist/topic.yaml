id: arraylist-vs-linkedlist
languages: [en, ru]
title:
  en: ArrayList vs LinkedList
  ru: ArrayList vs LinkedList
category:
  en: Java Core / Collections
  ru: Java Core / Коллекции
type: DATA_STRUCTURE
aiProvider: claude
categoryId: java-collections
difficulty: 1
summary:
  en: >
    Both implement List, but their internals are opposites. ArrayList is a
    resizable array: O(1) random access and amortised O(1) append, but inserting
    or removing in the middle shifts elements (O(n)) and a full array triggers a
    grow-and-copy. LinkedList is a doubly-linked chain: O(1) add/remove at the
    ends, but access by index must walk node by node (O(n)). The deciding factor
    is the cost of each operation.
  ru: >
    Оба реализуют List, но их устройство противоположно. ArrayList — это
    динамический массив: O(1) на произвольный доступ и амортизированный O(1) на
    добавление в конец, но вставка/удаление в середине сдвигает элементы (O(n)),
    а заполненный массив вызывает расширение с копированием. LinkedList — это
    двусвязная цепочка узлов: O(1) на добавление/удаление по краям, но доступ по
    индексу идёт обходом узел за узлом (O(n)). Решает цена каждой операции.

# Visual primitives this topic's visualizer composes (frontend).
primitives:
  - ArrayGrid
  - LinkedNodes
  - EventLog

defaultExample: arraylist-access

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: arraylist-access
    title:
      en: ArrayList — O(1) access
      ru: ArrayList — O(1) доступ
    file: 01-arraylist-access.java
    explanation:
      en: >
        Appending writes into the next free slot and get(i) jumps straight to
        slot i. Both are O(1) — the backing array gives random access for free.
      ru: >
        Добавление пишет в следующую свободную ячейку, а get(i) сразу прыгает в
        ячейку i. Оба O(1) — массив даёт произвольный доступ «бесплатно».
  - id: arraylist-grow
    title:
      en: ArrayList — grow & copy
      ru: ArrayList — рост и копирование
    file: 02-arraylist-grow.java
    explanation:
      en: >
        When the backing array is full, ArrayList allocates a bigger one (×1.5)
        and copies every element across. This is why append is only *amortised*
        O(1).
      ru: >
        Когда массив заполнен, ArrayList выделяет больший (×1.5) и копирует в него
        все элементы. Поэтому добавление в конец — только *амортизированный* O(1).
  - id: arraylist-insert
    title:
      en: ArrayList — insert shifts
      ru: ArrayList — вставка сдвигает
    file: 03-arraylist-insert.java
    explanation:
      en: >
        Inserting at the front shifts every existing element one slot to the
        right before writing the new value — the O(n) weakness of an array.
      ru: >
        Вставка в начало сдвигает все элементы на одну ячейку вправо перед
        записью нового значения — это O(n)-слабость массива.
  - id: linkedlist-ends
    title:
      en: LinkedList — O(1) ends
      ru: LinkedList — O(1) по краям
    file: 04-linkedlist-ends.java
    explanation:
      en: >
        addFirst and addLast only relink a couple of pointers, with no array to
        grow and nothing to shift. Adding at either end is O(1).
      ru: >
        addFirst и addLast лишь перецепляют пару указателей: нет массива, который
        нужно растить, и нечего сдвигать. Добавление по краям — O(1).
  - id: linkedlist-access
    title:
      en: LinkedList — O(n) access
      ru: LinkedList — O(n) доступ
    file: 05-linkedlist-access.java
    explanation:
      en: >
        With no array to index, get(i) walks the chain from the nearer end,
        counting hops. That walk is the O(n) cost ArrayList avoids.
      ru: >
        Массива для индексации нет, поэтому get(i) идёт по цепочке от ближнего
        конца, считая шаги. Этот обход — та самая цена O(n), которой нет у ArrayList.
  - id: linkedlist-insert
    title:
      en: LinkedList — insert relinks
      ru: LinkedList — вставка перецепляет
    file: 06-linkedlist-insert.java
    explanation:
      en: >
        Inserting in the middle is an O(n) walk to the position plus an O(1)
        relink. Nothing is shifted or copied — only two pointers change.
      ru: >
        Вставка в середину — это O(n) обход до позиции плюс O(1) перецепление.
        Ничего не сдвигается и не копируется — меняются лишь два указателя.

# Example question pre-filled as the Ask AI placeholder.
assistantExample:
