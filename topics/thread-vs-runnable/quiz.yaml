missions:
  - id: create-runnable
    title:
      en: Create a task
      ru: Создай задачу
    goal:
      en: Run code that creates a Runnable before any Thread is started.
      ru: Запусти код, который создает Runnable до запуска какого-либо Thread.
    event: RUNNABLE_CREATED
  - id: pass-runnable-to-thread
    title:
      en: Give the task to Thread
      ru: Передай задачу в Thread
    goal:
      en: Create a Thread object that receives a Runnable target.
      ru: Создай объект Thread, который получает Runnable target.
    event: THREAD_CREATED_WITH_RUNNABLE
  - id: start-thread
    title:
      en: Start the worker
      ru: Запусти worker
    goal:
      en: Call start() so the Thread runs the Runnable on a separate Java thread.
      ru: Вызови start(), чтобы Thread выполнил Runnable в отдельном Java thread.
    event: THREAD_STARTED
  - id: compare-subclass
    title:
      en: See the subclass style
      ru: Посмотри стиль с наследованием
    goal:
      en: Create a Thread subclass where the worker object owns its run() code.
      ru: Создай подкласс Thread, где объект worker сам содержит код run().
    event: THREAD_SUBCLASS_CREATED
  - id: avoid-direct-run
    title:
      en: Spot direct run()
      ru: Заметь прямой run()
    goal:
      en: Call run() directly and observe that it is not the same as start().
      ru: Вызови run() напрямую и увидь, что это не то же самое, что start().
    event: THREAD_RUN_CALLED_DIRECTLY
  - id: reuse-task
    title:
      en: Reuse work
      ru: Переиспользуй работу
    goal:
      en: Attach the same Runnable instance to more than one Thread object.
      ru: Привяжи один и тот же экземпляр Runnable к нескольким объектам Thread.
    event: RUNNABLE_REUSED

bossFight:
  - id: task-vs-worker
    en: What is the core difference between Runnable and Thread?
    ru: В чем главное отличие Runnable от Thread?
  - id: why-prefer-runnable
    en: Why is implementing Runnable usually preferred over extending Thread?
    ru: Почему обычно предпочитают реализовать Runnable, а не наследоваться от Thread?
  - id: start-vs-run
    en: What happens when you call start(), and why is it different from calling run() directly?
    ru: Что происходит при вызове start(), и почему это отличается от прямого вызова run()?
  - id: reuse
    en: How can one Runnable be reused with multiple Thread objects or an ExecutorService?
    ru: Как один Runnable можно переиспользовать с несколькими объектами Thread или ExecutorService?
  - id: no-return-value
    en: What are the limitations of Runnable compared with Callable?
    ru: Какие ограничения есть у Runnable по сравнению с Callable?
  - id: shared-state
    en: If two Threads run the same Runnable instance, what shared-state risk should you check?
    ru: Если два Thread выполняют один и тот же экземпляр Runnable, какой риск общего состояния нужно проверить?
