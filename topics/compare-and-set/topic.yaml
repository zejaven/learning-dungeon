id: compare-and-set
languages: [en, ru]
title:
  en: Compare-And-Set (CAS)
  ru: Compare-And-Set (CAS)
category:
  en: Java Core / Concurrency
  ru: Java Core / Многопоточность
type: CONCURRENCY
mode: trace
summary:
  en: >
    What compare-and-set means, how an atomic expected-value check prevents lost
    updates, why CAS usually appears in retry loops, and where its limits are:
    contention, side effects and the ABA problem.
  ru: >
    Что означает compare-and-set, как атомарная проверка expected value
    предотвращает потерянные обновления, почему CAS обычно используют в retry
    loop, и где его ограничения: contention, side effects и ABA problem.
categoryId: concurrency
difficulty: 2
catalogId: concurrency-11
style: Real world
aiProvider: codex
aiModel: gpt-5.5

primitives:
  - ArrayGrid
  - LinkedNodes
  - EventLog

defaultExample: successful-cas

examples:
  - id: successful-cas
    title:
      en: Successful CAS
      ru: Успешный CAS
    file: 01-successful-cas.java
    explanation:
      en: >
        T1 reads the current value, uses it as expected, and CAS replaces the
        slot because nobody changed it first.
      ru: >
        T1 читает текущее значение, использует его как expected, и CAS заменяет
        slot, потому что никто не изменил его раньше.
  - id: stale-expected
    title:
      en: Stale expected value
      ru: Устаревший expected value
    file: 02-stale-expected.java
    explanation:
      en: >
        T1 reads an old value, T2 updates first, and T1's CAS fails instead of
        overwriting T2's result.
      ru: >
        T1 читает старое значение, T2 обновляет первым, и CAS от T1 завершается
        неудачей вместо перезаписи результата T2.
  - id: retry-loop
    title:
      en: Retry after failure
      ru: Повтор после неудачи
    file: 03-retry-loop.java
    explanation:
      en: >
        After a failed CAS, T1 reads the fresh value and tries again with a new
        expected value.
      ru: >
        После неудачного CAS T1 читает свежее значение и пробует снова с новым
        expected value.
  - id: aba-risk
    title:
      en: ABA risk
      ru: Риск ABA
    file: 04-aba-risk.java
    explanation:
      en: >
        The value changes from 1 to 2 and back to 1. A later CAS that only checks
        the value can still succeed, which is the classic ABA trap.
      ru: >
        Значение меняется с 1 на 2 и обратно на 1. Более поздний CAS, который
        проверяет только значение, все равно может быть успешным. Это классическая
        ловушка ABA.

assistantExample:
  en: 'e.g. What does AtomicInteger.compareAndSet(expected, update) guarantee?'
  ru: 'например: Что гарантирует AtomicInteger.compareAndSet(expected, update)?'

missionsFile: quiz.yaml
