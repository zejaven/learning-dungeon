id: override-vs-overload
languages: [en, ru]
title:
  en: Overriding vs Overloading
  ru: Переопределение vs перегрузка
category:
  en: Java Core / OOP
  ru: Java Core / ООП
type: OTHER
aiProvider: claude
aiModel: claude-opus-4-8
categoryId: java-core
difficulty: 1
catalogId: java-core-4
style: Real world
summary:
  en: >
    How Java decides which method runs. Overloading (same name, different
    parameters) is resolved at compile time by the static type of the arguments;
    overriding (a subclass redefining an inherited method) is resolved at runtime
    by the actual type of the object. The visualizer shows the candidates and what
    drives each choice.
  ru: >
    Как Java решает, какой метод выполнить. Перегрузка (одно имя, разные параметры)
    разрешается во время компиляции по статическому типу аргументов; переопределение
    (подкласс заменяет унаследованный метод) разрешается во время выполнения по
    фактическому типу объекта. Визуализатор показывает кандидатов и что определяет
    каждый выбор.

primitives:
  - BoxGroup
  - EventLog

defaultExample: overriding

examples:
  - id: overriding
    title:
      en: Overriding (runtime)
      ru: Переопределение (runtime)
    file: 01-overriding.java
    explanation:
      en: >
        Animal a = new Dog(). a.speak() is resolved at runtime by the actual type
        (Dog), so Dog.speak() runs even though the variable is typed as Animal.
      ru: >
        Animal a = new Dog(). a.speak() разрешается во время выполнения по фактическому
        типу (Dog), поэтому выполняется Dog.speak(), хотя переменная имеет тип Animal.
  - id: overloading
    title:
      en: Overloading (compile-time)
      ru: Перегрузка (compile-time)
    file: 02-overloading.java
    explanation:
      en: >
        print(Object) and print(String) form an overload set. For a String
        argument the compiler picks the most specific applicable overload,
        print(String).
      ru: >
        print(Object) и print(String) образуют набор перегрузок. Для аргумента типа
        String компилятор выбирает самую конкретную подходящую перегрузку —
        print(String).
  - id: overload-trap
    title:
      en: The static-type trap
      ru: Ловушка статического типа
    file: 03-overload-static-type-trap.java
    explanation:
      en: >
        Object o = "hi". print(o) calls print(Object), not print(String): overload
        resolution uses the static type of the argument, never its runtime type.
      ru: >
        Object o = "hi". print(o) вызывает print(Object), а не print(String):
        разрешение перегрузки использует статический тип аргумента, а не его тип во
        время выполнения.
  - id: override-many-types
    title:
      en: One reference, many bodies
      ru: Одна ссылка, разные тела
    file: 04-override-many-types.java
    explanation:
      en: >
        Two Animal references pointing at a Dog and a Cat dispatch speak() to the
        actual object each time — the essence of runtime polymorphism.
      ru: >
        Две ссылки типа Animal, указывающие на Dog и Cat, каждый раз отправляют
        speak() фактическому объекту — суть полиморфизма во время выполнения.
  - id: inherited
    title:
      en: Inherited, not overridden
      ru: Унаследован, не переопределён
    file: 05-inherited-not-overridden.java
    explanation:
      en: >
        Fish does not override speak(). Dispatch walks up the chain to the first
        class that declares it, so the inherited Animal.speak() runs.
      ru: >
        Fish не переопределяет speak(). Диспетчеризация поднимается по цепочке до
        первого класса, который его объявляет, поэтому выполняется унаследованный
        Animal.speak().

assistantExample:
