missions:
  - id: start-worker
    title:
      en: Start a worker
      ru: Запусти worker
    goal:
      en: Call start() so the Thread moves from NEW into running work.
      ru: Вызови start(), чтобы Thread перешёл из NEW к выполняемой работе.
    event: THREAD_STARTED
  - id: request-cooperative-stop
    title:
      en: Request a stop
      ru: Запроси остановку
    goal:
      en: Set a cooperative stop flag instead of trying to kill the thread from outside.
      ru: Установи кооперативный флаг остановки вместо попытки убить thread снаружи.
    event: STOP_REQUESTED
  - id: observe-stop-request
    title:
      en: Let the worker notice
      ru: Дай worker заметить запрос
    goal:
      en: Make the worker check the stop request and choose a clean exit path.
      ru: Сделай так, чтобы worker проверил запрос остановки и выбрал аккуратный путь выхода.
    event: STOP_REQUEST_OBSERVED
  - id: handle-interrupt
    title:
      en: Handle interrupt
      ru: Обработай interrupt
    goal:
      en: Interrupt a blocked worker and handle InterruptedException instead of ignoring it.
      ru: Прерви заблокированный worker и обработай InterruptedException вместо игнорирования.
    event: INTERRUPT_OBSERVED
  - id: restore-interrupt-status
    title:
      en: Restore status
      ru: Восстанови status
    goal:
      en: Restore interrupt status when cancellation must be visible to outer code.
      ru: Восстанови interrupt status, когда отмена должна быть видна внешнему коду.
    event: INTERRUPT_RESTORED
  - id: wait-with-join
    title:
      en: Wait for termination
      ru: Дождись завершения
    goal:
      en: Use join() after the worker exits so the owner knows the thread has stopped.
      ru: Используй join() после выхода worker, чтобы владелец знал, что thread остановлен.
    event: JOIN_COMPLETED
  - id: reject-unsafe-stop
    title:
      en: Reject unsafe stop
      ru: Откажись от unsafe stop
    goal:
      en: Show why Thread.stop() is not the safe answer to this interview question.
      ru: Покажи, почему Thread.stop() не является безопасным ответом на этот вопрос.
    event: UNSAFE_STOP_REJECTED

bossFight:
  - id: safe-way
    en: What is the safe general approach for stopping a Java thread after it has started?
    ru: Какой общий безопасный подход к остановке Java thread после запуска?
  - id: stop-flag-visibility
    en: Why should a cancellation flag usually be volatile, AtomicBoolean, or guarded by synchronization?
    ru: Почему флаг отмены обычно должен быть volatile, AtomicBoolean или защищён synchronization?
  - id: interrupt-meaning
    en: What does Thread.interrupt() actually do, and what does it not do?
    ru: Что на самом деле делает Thread.interrupt(), а чего он не делает?
  - id: blocked-thread
    en: How do you stop a thread that is blocked in sleep(), wait(), join(), or an interruptible queue call?
    ru: Как остановить thread, который заблокирован в sleep(), wait(), join() или interruptible вызове очереди?
  - id: interrupted-exception-restore
    en: Why is it often important to restore interrupt status after catching InterruptedException?
    ru: Почему часто важно восстановить interrupt status после перехвата InterruptedException?
  - id: join-purpose
    en: Why is join() not a stop command, and when do you use it during shutdown?
    ru: Почему join() не является командой остановки и когда его используют при shutdown?
  - id: thread-stop-danger
    en: Why is Thread.stop() unsafe even though it appears to solve the problem immediately?
    ru: Почему Thread.stop() небезопасен, хотя кажется мгновенным решением проблемы?
