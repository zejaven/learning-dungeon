missions:
  - id: create-pool
    title:
      en: Create a fixed pool
      ru: Создай fixed pool
    goal:
      en: Create a ThreadPool with reusable workers and a bounded queue.
      ru: Создай ThreadPool с переиспользуемыми workers и ограниченной очередью.
    event: THREAD_POOL_CREATED
  - id: submit-work
    title:
      en: Submit work
      ru: Отправь работу
    goal:
      en: Submit a task to the pool so a worker can execute it.
      ru: Отправь задачу в pool, чтобы worker мог ее выполнить.
    event: POOL_TASK_SUBMITTED
  - id: queue-when-busy
    title:
      en: Queue when busy
      ru: Поставь в очередь при занятости
    goal:
      en: Submit more accepted tasks than idle workers so one task waits in the queue.
      ru: Отправь больше принятых задач, чем есть свободных workers, чтобы одна задача ждала в очереди.
    event: POOL_TASK_QUEUED
  - id: reuse-worker
    title:
      en: Reuse a worker
      ru: Переиспользуй worker
    goal:
      en: Complete one task, then let the same worker take another task.
      ru: Заверши одну задачу, затем дай тому же worker взять следующую задачу.
    event: POOL_WORKER_REUSED
  - id: reject-overload
    title:
      en: Reject overload
      ru: Отклони перегрузку
    goal:
      en: Fill all workers and queue slots, then submit one more task so the pool rejects it.
      ru: Заполни всех workers и места в очереди, затем отправь еще одну задачу, чтобы pool ее отклонил.
    event: POOL_TASK_REJECTED
  - id: shutdown-pool
    title:
      en: Shut down the pool
      ru: Останови pool
    goal:
      en: Call shutdown() so the pool stops accepting new tasks but can finish accepted work.
      ru: Вызови shutdown(), чтобы pool перестал принимать новые задачи, но мог завершить принятую работу.
    event: THREAD_POOL_SHUTDOWN

bossFight:
  - id: definition-purpose
    en: What is a Thread Pool in Java, and what problem does it solve?
    ru: Что такое Thread Pool в Java и какую проблему он решает?
  - id: executorservice-api
    en: How do ExecutorService and ThreadPoolExecutor relate to the idea of a thread pool?
    ru: Как ExecutorService и ThreadPoolExecutor связаны с идеей пула потоков?
  - id: workers-and-queue
    en: What happens when all workers are busy and a new task is submitted?
    ru: Что происходит, когда все workers заняты и отправляется новая задача?
  - id: bounded-queue
    en: Why is a bounded queue usually safer than an unbounded queue?
    ru: Почему ограниченная очередь обычно безопаснее неограниченной?
  - id: rejection-policy
    en: What is a rejection policy, and when does it run?
    ru: Что такое rejection policy и когда она срабатывает?
  - id: pool-sizing
    en: How would you size a pool differently for CPU-bound and I/O-bound work?
    ru: Как ты по-разному выберешь размер pool для CPU-bound и I/O-bound работы?
  - id: shutdown
    en: Why should an application shut down an ExecutorService?
    ru: Почему приложение должно останавливать ExecutorService?
  - id: shared-state
    en: Does using a ThreadPool make shared mutable state automatically thread-safe?
    ru: Делает ли использование ThreadPool общее изменяемое состояние автоматически thread-safe?
