summary:
  en: >
    Middle-level process questions from QA interviews: how to assess that
    everything is covered by tests (coverage and traceability matrices), the
    difference between a long-lived test strategy and a project-specific test
    plan, giving a concrete example of process improvement, the classic email
    validation trap (why sending a verification message is the only reliable
    check), and how to build a testing process from scratch in a new team.
  ru: >
    Процессные вопросы уровня middle с собеседований на QA: как оценить, что
    всё покрыто тестами (матрица покрытия и трассировки), чем долгоживущая
    тестовая стратегия отличается от тест-плана под конкретный проект, как
    привести пример улучшения процессов, известная ловушка с валидацией email
    (почему единственный рабочий способ — отправить проверочное письмо) и как
    выстроить процесс тестирования с нуля в новой команде.

assistantExample:
