id: resource-exception-handling
title:
  en: Resource Exception Handling
  ru: Обработка исключений ресурсов
category:
  en: Java Core / Exceptions
  ru: Java Core / Исключения
type: OTHER
mode: trace
summary:
  en: >
    How try-with-resources closes AutoCloseable resources, what happens when work
    or close() throws, why suppressed exceptions exist, and how finally fits into
    resource cleanup.
  ru: >
    Как try-with-resources закрывает ресурсы AutoCloseable, что происходит при
    ошибке в работе или close(), зачем нужны suppressed exceptions и как finally
    связан с очисткой ресурсов.
categoryId: exceptions
difficulty: 1
catalogId: exceptions-1
style: Real world
aiProvider: codex
aiModel: gpt-5.5

primitives:
  - ArrayGrid
  - EventLog

defaultExample: auto-close

examples:
  - id: auto-close
    title:
      en: Automatic close
      ru: Автоматическое закрытие
    file: 01-auto-close.java
    explanation:
      en: >
        A resource opened in try-with-resources is closed automatically after the
        block finishes normally.
      ru: >
        Ресурс, открытый в try-with-resources, закрывается автоматически после
        нормального завершения блока.
  - id: body-exception
    title:
      en: Body fails, resource closes
      ru: Тело падает, ресурс закрывается
    file: 02-body-exception.java
    explanation:
      en: >
        Even when the work inside the try block throws, Java still calls close()
        before the exception reaches catch.
      ru: >
        Даже если работа внутри блока try выбрасывает исключение, Java всё равно
        вызывает close() до передачи исключения в catch.
  - id: close-exception
    title:
      en: close() throws
      ru: close() выбрасывает
    file: 03-close-exception.java
    explanation:
      en: >
        If the body succeeds but close() throws, the close exception becomes the
        caught exception.
      ru: >
        Если тело успешно, но close() выбрасывает исключение, именно ошибка close
        становится пойманным исключением.
  - id: suppressed
    title:
      en: Suppressed close failure
      ru: Suppressed ошибка закрытия
    file: 04-suppressed-exception.java
    explanation:
      en: >
        If both the body and close() fail, Java keeps the body exception as
        primary and attaches the close failure as suppressed.
      ru: >
        Если падают и тело, и close(), Java сохраняет исключение из тела как
        основное, а ошибку закрытия прикрепляет как suppressed.
  - id: reverse-close
    title:
      en: Reverse close order
      ru: Обратный порядок закрытия
    file: 05-reverse-close-order.java
    explanation:
      en: >
        Multiple resources are closed in the reverse order of declaration, like a
        stack.
      ru: >
        Несколько ресурсов закрываются в порядке, обратном объявлению, как стек.
  - id: finally-after-close
    title:
      en: finally after close
      ru: finally после close
    file: 06-finally-after-close.java
    explanation:
      en: >
        A finally block still runs, but only after try-with-resources has already
        closed its resources.
      ru: >
        Блок finally всё ещё выполняется, но только после того, как
        try-with-resources уже закрыл ресурсы.

assistantExample:
  en: 'e.g. Why does try-with-resources keep the body exception and suppress close failures?'
  ru: 'например: Почему try-with-resources сохраняет исключение из тела, а ошибки close делает suppressed?'

missionsFile: quiz.yaml
