id: hashmap
title:
  en: HashMap Internals
  ru: Устройство HashMap
category:
  en: Java Core / Collections
  ru: Java Core / Коллекции
type: DATA_STRUCTURE
aiProvider: claude
categoryId: java-collections
difficulty: 2
summary:
  en: >
    How HashMap stores entries in buckets, how the hash is spread and turned into
    a bucket index, what happens on a collision, when it resizes, and why a
    mutable key breaks lookup.
  ru: >
    Как HashMap хранит записи в бакетах, как хэш «размешивается» и превращается в
    индекс бакета, что происходит при коллизии, когда выполняется resize и почему
    изменяемый ключ ломает поиск.

# Visual primitives this topic's visualizer composes (frontend).
primitives:
  - ArrayGrid
  - LinkedNodes
  - EventLog

defaultExample: basic-put

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: basic-put
    title:
      en: Basic put / get
      ru: Базовые put / get
    file: 01-basic-put.java
    explanation:
      en: >
        Two keys with different hashes land in different buckets. get() recomputes
        the bucket index and walks that bucket's chain.
      ru: >
        Два ключа с разными хэшами попадают в разные бакеты. get() заново вычисляет
        индекс бакета и проходит его цепочку.
  - id: collision
    title:
      en: Collision in one bucket
      ru: Коллизия в одном бакете
    file: 02-collision.java
    explanation:
      en: >
        "Aa" and "BB" have the same hashCode (2112) in Java, so they map to the
        same bucket and form a chain (separate chaining).
      ru: >
        У "Aa" и "BB" одинаковый hashCode (2112) в Java, поэтому они попадают в один
        бакет и образуют цепочку (separate chaining).
  - id: resize
    title:
      en: Resize past the threshold
      ru: Resize при превышении порога
    file: 03-resize.java
    explanation:
      en: >
        capacity * loadFactor (16 * 0.75 = 12) is the threshold. The 13th entry
        triggers a resize to 32 buckets and rehashes everything.
      ru: >
        Порог — это capacity * loadFactor (16 * 0.75 = 12). 13-я запись запускает
        resize до 32 бакетов и перехэширует всё.
  - id: mutable-key
    title:
      en: Mutable key breaks lookup
      ru: Изменяемый ключ ломает поиск
    file: 04-mutable-key.java
    explanation:
      en: >
        If a key's hashCode changes after insertion, get() computes a different
        bucket index and can no longer find the entry — it returns null.
      ru: >
        Если hashCode ключа меняется после вставки, get() вычисляет другой индекс
        бакета и больше не находит запись — возвращает null.

# Example question pre-filled as the Ask AI placeholder.
assistantExample:
  en: "e.g. Why does a mutable key break get()?"
  ru: "например: Почему изменяемый ключ ломает get()?"

missionsFile: quiz.yaml
