summary:
  en: >
    Learn why PostgreSQL can ignore an existing index: low selectivity, small
    tables, stale statistics, non-index-friendly predicates, composite or partial
    index mismatch, generic prepared plans, and heap fetch costs. Practice a
    safe diagnosis flow before changing indexes or SQL.
  ru: >
    Разбери, почему PostgreSQL может игнорировать существующий индекс: низкая
    селективность, маленькие таблицы, устаревшая статистика, предикаты,
    неудобные для индекса, несовпадение составного или частичного индекса,
    generic plans у prepared statements и стоимость обращений к heap. Отработай
    безопасный порядок диагностики перед изменением индексов или SQL.

assistantExample:
  en: 'e.g. My query filters by customer_id, but PostgreSQL uses Seq Scan - how do I diagnose it?'
  ru: 'например: Запрос фильтрует по customer_id, но PostgreSQL использует Seq Scan - как это диагностировать?'

