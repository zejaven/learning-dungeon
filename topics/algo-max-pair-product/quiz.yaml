# Challenge mission: passes when every test case in the hidden harness is green.
missions:
  - id: all-tests
    type: challenge
    title:
      en: Pass all tests
      ru: Пройди все тесты
    goal:
      en: Implement maxPairProduct so every hidden test case passes.
      ru: Реализуй maxPairProduct, чтобы прошёл каждый скрытый тест-кейс.
    requires:
      - kind: tests

bossFight:
  - id: approach
    en: How do you find the maximum product of two numbers in an array efficiently?
    ru: Как эффективно найти наибольшее произведение двух чисел в массиве?
  - id: negatives
    en: Why must you consider the two smallest (most negative) numbers, not just the two largest?
    ru: Почему нужно учитывать два наименьших (самых отрицательных) числа, а не только два наибольших?
  - id: complexity
    en: What is the time and space complexity of an optimal solution?
    ru: Какова временная и пространственная сложность оптимального решения?
  - id: sorting
    en: Could you solve it by sorting instead? What complexity would that be?
    ru: Можно ли решить сортировкой? Какой будет сложность тогда?
