# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: build-chain
    title:
      en: Build a chain
      ru: Построй цепочку
    goal:
      en: Link at least one handler into the chain with addHandler(...).
      ru: Добавь в цепочку хотя бы один обработчик через addHandler(...).
    event: HANDLER_ADDED
  - id: handle
    title:
      en: Handle a request
      ru: Обработай запрос
    goal:
      en: Send a request that a handler can approve so the chain stops on it.
      ru: Отправь запрос, который сможет одобрить обработчик, чтобы цепочка на нём остановилась.
    event: REQUEST_HANDLED
  - id: pass
    title:
      en: Pass it on
      ru: Передай дальше
    goal:
      en: Send a request too big for the first handler so it escalates to the next.
      ru: Отправь запрос, слишком большой для первого обработчика, чтобы он эскалировал дальше.
    event: HANDLER_PASS
  - id: unhandled
    title:
      en: Fall off the end
      ru: Выпасть из конца
    goal:
      en: Send a request no handler can approve so it leaves the chain unhandled.
      ru: Отправь запрос, который никто не может одобрить, чтобы он покинул цепочку необработанным.
    event: REQUEST_UNHANDLED

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  en:
    - What problem does Chain of Responsibility solve, and how does it decouple sender from receiver?
    - How does a handler decide whether to handle a request or pass it on?
    - Why does the order of handlers in the chain matter?
    - What should happen when no handler can process a request?
    - How is this pattern different from a Decorator, which also wraps a chain of objects?
    - Where do you see Chain of Responsibility in real frameworks (e.g. Servlet filters, Spring Security)?
  ru:
    - Какую проблему решает Chain of Responsibility и как он развязывает отправителя и получателя?
    - Как обработчик решает, обработать запрос или передать его дальше?
    - Почему важен порядок обработчиков в цепочке?
    - Что должно происходить, когда ни один обработчик не может обработать запрос?
    - Чем этот паттерн отличается от Decorator, который тоже оборачивает цепочку объектов?
    - Где Chain of Responsibility встречается в реальных фреймворках (например, фильтры сервлетов, Spring Security)?
