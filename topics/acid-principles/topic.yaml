summary:
  en: >
    ACID explains the four guarantees a database transaction tries to provide:
    all-or-nothing changes, valid data rules, safe concurrent execution and data
    that survives after commit.
  ru: >
    ACID объясняет четыре гарантии, которые база данных старается дать
    транзакции: изменения целиком или откат, соблюдение правил данных,
    безопасное параллельное выполнение и сохранение данных после commit.

