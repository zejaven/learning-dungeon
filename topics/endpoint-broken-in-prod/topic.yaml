id: endpoint-broken-in-prod
languages: [en, ru]
title:
  en: 'It Passed Tests and Broke in Production'
  ru: 'Прошло тесты и сломалось в проде'
category:
  en: REST / API Operations
  ru: REST / Эксплуатация API
type: HTTP
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: rest
difficulty: 3
catalogId: rest-10
summary:
  en: >
    "Nothing works" is a claim, not a measurement, and the answer to this question
    is a procedure rather than a bug. Clarify first — which request, who, since
    when, what exactly comes back, how often — then reproduce it, because until
    you can send the failing request yourself you are debugging a sentence. Read
    the signals that already exist: a `5xx` spike is inside you, a `4xx` spike is
    at the contract, latency without errors is a dependency, and a flat graph
    means it is not what they think. Measure the blast radius, let the severity
    fall out of the number, and if it is wide, restore service before you
    understand anything — roll back, flip the flag, drain the instance — because
    mitigating and fixing are different jobs. Only then ask the real question:
    not "what is wrong with the code", which passed, but "what is different" —
    your deploy, someone else''s, config, data, a dependency, the platform, or a
    client that shipped too. A day''s delay is itself evidence: it points at
    things with their own clock. Confirm a cause that explains the timing, not
    just the error; fix the smallest thing; verify by re-running the exact request
    that failed; and leave behind the alert or test that makes the next one
    shorter. The traps are guessing straight onto production, calling a rollback a
    fix, and answering "it works on my machine".
  ru: >
    «Ничего не работает» — это утверждение, а не измерение, и ответ на этот вопрос
    — процедура, а не баг. Сначала уточнить: какой запрос, у кого, с какого
    момента, что именно возвращается, как часто. Затем воспроизвести, потому что
    пока вы не можете сами отправить падающий запрос, вы отлаживаете фразу. Читать
    уже существующие сигналы: всплеск `5xx` — внутри вас, всплеск `4xx` — на
    контракте, задержка без ошибок — зависимость, а ровный график означает, что
    дело не в том, о чём думают. Измерить радиус поражения, вывести критичность из
    числа, и если он широк — восстановить работу до того, как что-то поняли:
    откатить, выключить флаг, вывести инстанс, потому что смягчение и исправление
    — разные работы. И только потом задать настоящий вопрос: не «что не так с
    кодом», который прошёл, а «что отличается» — ваш деплой, чужой, конфигурация,
    данные, зависимость, платформа или клиент, который тоже выкатился. Сутки
    задержки — сами по себе улика: они указывают на вещи с собственными часами.
    Подтвердить причину, объясняющую время, а не только ошибку; исправить
    минимальным изменением; проверить, перезапустив тот самый упавший запрос; и
    оставить после себя алерт или тест, который сделает следующий раз короче.
    Ловушки: гадать сразу на проде, называть откат исправлением и отвечать «у меня
    на машине работает».

# Visual primitives this topic's visualizer composes (frontend).
primitives:
  - BoxGroup

defaultExample: the-report-is-not-a-fact

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: the-report-is-not-a-fact
    title:
      en: 'A report is a claim'
      ru: 'Сообщение — это утверждение'
    file: 01-the-report-is-not-a-fact.java
    explanation:
      en: >
        The same half hour spent two ways. First on explaining that the tests
        passed — which is true, irrelevant, and answers a question nobody asked.
        Then on the five questions that shrink "nothing works" into one method,
        one path, one department and one status code, plus the one question
        nobody can answer yet.
      ru: >
        Одни и те же полчаса, потраченные двумя способами. Сначала на объяснение,
        что тесты прошли, — это правда, это не относится к делу и это ответ на
        вопрос, которого никто не задавал. Затем на пять вопросов, сжимающих
        «ничего не работает» до одного метода, одного пути, одного отдела и
        одного кода ответа, плюс один вопрос, на который пока никто не отвечает.
  - id: reproduce-before-you-touch
    title:
      en: 'Reproduce before you touch anything'
      ru: 'Воспроизведи, прежде чем что-то трогать'
    file: 02-reproduce-before-you-touch.java
    explanation:
      en: >
        Your request works and theirs does not, which is a narrowing rather than
        a dead end: whatever is broken needs something you did not send. Watch
        the incident stop being a sentence and become a request you own — the
        one you will re-run later to prove the fix.
      ru: >
        Ваш запрос работает, а их — нет, и это сужение, а не тупик: сломанному
        нужно что-то, чего вы не отправляли. Смотрите, как инцидент перестаёт
        быть фразой и становится вашим запросом — тем самым, который вы потом
        перезапустите, чтобы доказать исправление.
  - id: what-the-graphs-already-know
    title:
      en: 'Ask the graphs, not the code'
      ru: 'Спроси графики, а не код'
    file: 03-what-the-graphs-already-know.java
    explanation:
      en: >
        Five readings, each of which halves the search space: 5xx up, 4xx flat,
        latency flat, the dependency innocent, and a first-failure timestamp
        fifteen hours after the release. Then the sixth reading, which is that
        one of the graphs does not exist — the reason this arrived by human, a
        day late.
      ru: >
        Пять показаний, каждое из которых вдвое сужает область поиска: 5xx
        выросли, 4xx ровные, задержка ровная, зависимость невиновна, а первый сбой
        — через пятнадцать часов после релиза. И шестое показание: одного из
        графиков не существует — потому об этом и сообщил человек, на сутки позже.
  - id: stop-the-bleeding-first
    title:
      en: 'Mitigate first, understand second'
      ru: 'Сначала смягчить, понять потом'
    file: 04-stop-the-bleeding-first.java
    explanation:
      en: >
        The same incident triaged twice from the same measurement. One version
        starts thinking; the other rolls back first and thinks afterwards, with
        users being served the whole time. Compare the clocks, and note the one
        check to run before any rollback.
      ru: >
        Один и тот же инцидент, разобранный дважды из одного и того же измерения.
        Одна версия начинает думать, другая сначала откатывает и думает потом, а
        пользователей всё это время обслуживают. Сравните часы и обратите внимание
        на единственную проверку, которую делают перед любым откатом.
  - id: what-changed
    title:
      en: 'The code passed — what is different?'
      ru: 'Код прошёл — что отличается?'
    file: 05-what-changed.java
    explanation:
      en: >
        The hypothesis loop, with every suspect leaving with evidence attached:
        config, the client's own release, the dependency. Then the two that
        survive, and the cause that only counts as a cause because it explains
        why this started at 09:12 and not at 17:40.
      ru: >
        Цикл гипотез, где каждый подозреваемый уходит с приложенной уликой:
        конфигурация, собственный релиз клиента, зависимость. Затем две
        выжившие версии и причина, которая считается причиной только потому, что
        объясняет, почему это началось в 09:12, а не в 17:40.
  - id: why-the-tests-passed
    title:
      en: 'Why the suite was green'
      ru: 'Почему прогон был зелёным'
    file: 06-why-the-tests-passed.java
    explanation:
      en: >
        The half of the answer that is about engineering rather than
        firefighting. The fixtures were written by the same person as the mapper,
        so they had the same blind spot — and the three follow-ups that make the
        same class of failure cheaper next time.
      ru: >
        Та половина ответа, которая про инженерию, а не про тушение пожара.
        Фикстуры писал тот же человек, что и маппер, поэтому слепое пятно у них
        общее — и три последующие задачи, которые удешевляют тот же класс сбоев в
        следующий раз.
  - id: fix-verify-prevent
    title:
      en: 'Fix, verify, prevent'
      ru: 'Исправить, проверить, предотвратить'
    file: 07-fix-verify-prevent.java
    explanation:
      en: >
        A change pushed on a guess against a system that is already misbehaving,
        then the same incident done properly — including a fix that addresses
        where the bad data came from and still leaves the failing request
        failing, which is exactly what re-running it is for.
      ru: >
        Изменение, выкаченное по догадке в систему, которая и так ведёт себя
        плохо, а затем тот же инцидент по-человечески — включая исправление,
        которое закрывает источник плохих данных и всё равно оставляет падающий
        запрос падающим: ровно для этого его и перезапускают.

# Example question pre-filled as the Ask AI placeholder.
assistantExample:
  en: 'e.g. An endpoint passed tests and shipped; the next day the Product Owner says nothing works. What do you do first?'
  ru: 'например: Эндпоинт прошёл тесты и уехал в прод; на следующий день владелец продукта говорит, что ничего не работает. Что ты сделаешь первым делом?'

