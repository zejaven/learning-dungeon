id: oauth-openid-connect
title:
  en: 'How OAuth 2.0 and OpenID Connect Work'
  ru: 'Как работают OAuth 2.0 и OpenID Connect'
category:
  en: Security & Authentication
  ru: Безопасность и аутентификация
type: HTTP
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: security
difficulty: 2
catalogId: security-5
summary:
  en: >
    OAuth 2.0 exists to answer one question — how can an app act on your behalf
    at some provider without ever seeing your password — and OpenID Connect adds
    the question OAuth deliberately does not answer: who the user is. Separate
    the four roles (the user who owns the data, the client that wants access, the
    authorization server that authenticates and issues tokens, the resource
    server that accepts them) and the two channels (front channel = browser
    redirects, visible to everyone; back channel = server to server, where the
    secrets live), and the whole protocol reduces to a shape: the client redirects
    the browser with a request, the user proves who they are at the provider and
    consents, a short-lived single-use code comes back through the browser, the
    client swaps it for tokens on the back channel, reads WHO from the id_token,
    and sends the access token to the API. Almost every check exists because
    something might end up on the wrong channel: `state` proves the callback
    belongs to a flow you started, PKCE binds the code to whoever asked for it,
    and the id_token's `aud` is what stops a token obtained elsewhere being
    replayed here. The traps are the famous ones — using an access token as proof
    of identity, skipping `state`, shipping a client secret to a browser, the
    implicit flow, and the password grant that hands the app exactly what OAuth
    was invented to keep from it.
  ru: >
    OAuth 2.0 существует ради одного вопроса — как приложению действовать от
    вашего имени у провайдера, ни разу не увидев вашего пароля, — а OpenID
    Connect добавляет вопрос, на который OAuth намеренно не отвечает: кто такой
    пользователь. Разделите четыре роли (пользователь, которому принадлежат
    данные; клиент, которому нужен доступ; сервер авторизации, который
    аутентифицирует и выдаёт токены; сервер ресурсов, который их принимает) и два
    канала (фронт-канал — редиректы через браузер, видимые всем; бэк-канал —
    сервер к серверу, где живут секреты), и весь протокол сведётся к одной форме:
    клиент перенаправляет браузер с запросом, пользователь доказывает у
    провайдера, кто он, и даёт согласие, через браузер возвращается
    короткоживущий одноразовый код, клиент меняет его на токены по бэк-каналу,
    узнаёт КТО из id_token и отправляет access-токен в API. Почти каждая проверка
    здесь появилась потому, что что-то может оказаться не на том канале: `state`
    доказывает, что callback относится к начатому вами потоку, PKCE привязывает
    код к тому, кто его запросил, а `aud` в id_token не даёт переиграть здесь
    токен, полученный где-то ещё. Ловушки — все знаменитые: access-токен как
    доказательство личности, пропущенный `state`, client_secret, уехавший в
    браузер, implicit flow и grant с паролем, который отдаёт приложению ровно то,
    что OAuth и придумали от него скрыть.

