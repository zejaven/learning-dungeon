summary:
  en: >
    What load testing is and why teams run it: finding bottlenecks and
    performance degradation under realistic traffic before users do. The main
    types of performance tests (load, stress, spike, soak), the standard
    toolchain (JMeter, k6, Gatling, Locust), and the core metrics every QA
    should read: throughput (RPS), latency percentiles, and error rate.
  ru: >
    Что такое нагрузочное тестирование и зачем его проводят: поиск узких мест
    и деградации производительности под реалистичным трафиком до того, как это
    заметят пользователи. Основные виды нагрузочных тестов (load, stress,
    spike, soak), стандартный инструментарий (JMeter, k6, Gatling, Locust) и
    базовые метрики, которые должен читать каждый QA: throughput (RPS),
    перцентили latency и доля ошибок.

assistantExample:
