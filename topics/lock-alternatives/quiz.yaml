missions:
  - id: reentrant-try-lock
    title:
      en: Use non-blocking acquisition
      ru: Используй неблокирующий захват
    goal:
      en: Run code where tryLock() fails immediately instead of joining the queue.
      ru: Запусти код, где tryLock() сразу возвращает отказ вместо входа в очередь.
    event: REENTRANT_TRY_LOCK_FAILED
  - id: reentrant-hold-count
    title:
      en: Show reentrancy
      ru: Покажи reentrancy
    goal:
      en: Make the same thread acquire the same ReentrantLock twice.
      ru: Сделай так, чтобы один thread дважды получил тот же ReentrantLock.
    event: REENTRANT_LOCK_REENTERED
  - id: readwrite-shared-read
    title:
      en: Share read access
      ru: Раздели read-доступ
    goal:
      en: Let two readers hold the read lock at the same time.
      ru: Дай двум readers одновременно удерживать read lock.
    event: READWRITE_READ_SHARED
  - id: readwrite-writer-waits
    title:
      en: Queue an exclusive writer
      ru: Поставь writer в очередь
    goal:
      en: Make a writer wait while readers still hold the read side.
      ru: Сделай так, чтобы writer ждал, пока readers удерживают read-сторону.
    event: READWRITE_WRITE_WAITING
  - id: stamped-validate-failed
    title:
      en: Invalidate an optimistic read
      ru: Инвалидируй optimistic read
    goal:
      en: Take an optimistic stamp, perform a write, then validate the old stamp.
      ru: Возьми optimistic stamp, выполни write, затем validate старый stamp.
    event: STAMPED_VALIDATE_FAILED
  - id: stamped-convert
    title:
      en: Convert a stamp
      ru: Convert stamp
    goal:
      en: Convert the only read stamp into a write stamp.
      ru: Преобразуй единственный read stamp в write stamp.
    event: STAMPED_CONVERT_TO_WRITE

bossFight:
  - id: synchronized-vs-lock
    en: When is synchronized still the best choice, and when do you reach for Lock?
    ru: Когда synchronized всё ещё лучший выбор, а когда стоит взять Lock?
  - id: reentrantlock-choice
    en: What practical features does ReentrantLock add over synchronized?
    ru: Какие практические возможности ReentrantLock добавляет к synchronized?
  - id: readwrite-choice
    en: In what workload does ReentrantReadWriteLock help, and when can it hurt?
    ru: В какой нагрузке ReentrantReadWriteLock помогает, а когда может навредить?
  - id: stampedlock-choice
    en: When is StampedLock a good fit, and what rule makes optimistic reads safe?
    ru: Когда StampedLock хорошо подходит и какое правило делает optimistic reads безопасными?
  - id: upgrade-and-reentrancy-traps
    en: Why are read-to-write upgrades and StampedLock reentrancy common traps?
    ru: Почему upgrade с read на write и reentrancy у StampedLock являются частыми ловушками?
  - id: fairness-throughput
    en: How does fairness change latency and throughput for explicit locks?
    ru: Как fairness меняет latency и throughput у явных locks?
