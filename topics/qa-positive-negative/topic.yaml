summary:
  en: >
    The classification of testing by expected result: positive testing
    (the "pass test") verifies that the system works correctly on valid,
    expected input, while negative testing checks how the system reacts to
    errors, invalid data and incorrect requests. Includes paired checks for a
    single input field, the role of each type in a test suite, and why
    negative scenarios deserve at least as much attention as happy paths.
  ru: >
    Классификация тестирования по ожидаемому результату: позитивное
    тестирование («тест на прохождение») проверяет, что система корректно
    работает на валидных, ожидаемых данных, а негативное — как система
    реагирует на ошибки, невалидные данные и некорректные запросы. Внутри:
    примеры пар проверок для одного поля ввода, роль каждого типа в наборе
    тестов и почему негативным сценариям стоит уделять не меньше внимания,
    чем счастливым путям.

assistantExample:
