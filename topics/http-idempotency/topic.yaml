id: http-idempotency
title:
  en: 'Idempotency and Idempotent HTTP Methods'
  ru: 'Идемпотентность и идемпотентные HTTP-методы'
category:
  en: Networking / HTTP
  ru: Сети / HTTP
type: HTTP
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: networking
difficulty: 2
catalogId: networking-8
summary:
  en: >
    An operation is idempotent when N identical calls leave the system in the
    same state as one call — not when the responses are identical and not when
    nothing happens. It matters because a timeout is ambiguous: the client cannot
    tell a lost request from a lost response, and its only recovery is to send
    the request again. HTTP defines GET, HEAD, OPTIONS, TRACE, PUT and DELETE as
    idempotent (the first four are also safe, and safe implies idempotent), POST
    as not idempotent, and PATCH as not guaranteed — a relative body such as
    'add 1 to qty' applied twice adds twice. The guarantee is a contract the
    handler has to keep, not something the verb enforces: a PUT that mails the
    customer on every call has broken it. A non-idempotent operation is made
    retry-safe by giving the intent an identity — an Idempotency-Key stored under
    a unique constraint, whose stored response is replayed on a repeat.
  ru: >
    Операция идемпотентна, когда N одинаковых вызовов оставляют систему в том же
    состоянии, что и один вызов, — а не когда совпадают ответы и не когда ничего
    не происходит. Это важно, потому что таймаут неоднозначен: клиент не отличает
    потерянный запрос от потерянного ответа, и единственное восстановление для
    него — отправить запрос снова. HTTP объявляет идемпотентными GET, HEAD,
    OPTIONS, TRACE, PUT и DELETE (первые четыре ещё и безопасны, а безопасный
    автоматически идемпотентен), POST — неидемпотентным, а для PATCH
    идемпотентность не гарантируется: относительное тело вроде «прибавь 1 к qty»,
    применённое дважды, прибавит дважды. Гарантию обязан соблюдать обработчик,
    сам метод её не обеспечивает: PUT, отправляющий письмо при каждом вызове, её
    уже нарушил. Неидемпотентную операцию делают безопасной для повтора, дав
    намерению идентичность: ключ Idempotency-Key под уникальным ограничением,
    сохранённый ответ по которому повторяется при дубле.

