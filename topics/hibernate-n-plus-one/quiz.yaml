missions:
  - id: reproduce-n-plus-one
    title:
      en: Reproduce the N+1
      ru: Воспроизведи N+1
    goal:
      en: Load parents lazily and touch their collections so an extra per-parent SELECT fires.
      ru: Загрузи родителей лениво и обратись к их коллекциям, чтобы сработал отдельный SELECT на каждого.
    event: N_PLUS_ONE_QUERY
  - id: fix-with-join-fetch
    title:
      en: Fix it with JOIN FETCH
      ru: Исправь через JOIN FETCH
    goal:
      en: Use a JOIN FETCH so parents and children arrive in one query.
      ru: Используй JOIN FETCH, чтобы родители и дети пришли одним запросом.
    event: JOIN_FETCH_QUERY
  - id: fix-with-entity-graph
    title:
      en: Fix it with an entity graph
      ru: Исправь через entity graph
    goal:
      en: Use an entity graph to fetch the association in a single query.
      ru: Используй entity graph, чтобы подгрузить связь одним запросом.
    event: ENTITY_GRAPH_QUERY
  - id: reduce-with-batch-size
    title:
      en: Reduce it with a batch size
      ru: Смягчи через batch size
    goal:
      en: Set a batch size so lazy children load in grouped IN (...) queries.
      ru: Задай batch size, чтобы ленивые дети грузились сгруппированными запросами IN (...).
    event: BATCH_QUERY

bossFight:
  - id: what-is-n-plus-one
    en: What exactly is the N+1 select problem, and where does the "1" and the "N" come from?
    ru: Что именно представляет собой проблема N+1 запросов, и откуда берутся «1» и «N»?
  - id: how-to-detect
    en: How would you detect an N+1 problem in a running application?
    ru: Как обнаружить проблему N+1 в работающем приложении?
  - id: join-fetch-vs-eager
    en: Why is a JOIN FETCH on a specific query usually preferable to marking the association FetchType.EAGER on the entity?
    ru: Почему JOIN FETCH в конкретном запросе обычно предпочтительнее, чем пометить связь FetchType.EAGER на сущности?
  - id: join-fetch-pagination
    en: What goes wrong if you combine JOIN FETCH of a collection with pagination (setMaxResults), and how do you handle it?
    ru: Что ломается, если совместить JOIN FETCH коллекции с пагинацией (setMaxResults), и как это решать?
  - id: batch-size-tradeoff
    en: How does @BatchSize (or default_batch_fetch_size) change the query count, and when would you choose it over JOIN FETCH?
    ru: Как @BatchSize (или default_batch_fetch_size) меняет число запросов и когда его выбрать вместо JOIN FETCH?
  - id: multiple-bag-fetch
    en: Why can't you JOIN FETCH two collection associations at once, and what is the MultipleBagFetchException about?
    ru: Почему нельзя сделать JOIN FETCH сразу двух коллекций и о чём говорит MultipleBagFetchException?
