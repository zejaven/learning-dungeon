# Theory topic: no missions because there is no practice editor, only Boss Fight.
bossFight:
  - id: proxy-boundary
    en: What is the main limitation of Spring AOP's proxy-based model?
    ru: Какое главное ограничение у proxy-based модели Spring AOP?
  - id: private-methods
    en: Why does Spring AOP not advise private methods in the usual proxy mode?
    ru: Почему Spring AOP обычно не применяет advice к private methods в proxy mode?
  - id: static-methods
    en: Why are static methods outside the normal Spring AOP proxy mechanism?
    ru: Почему static methods находятся вне обычного proxy-механизма Spring AOP?
  - id: self-invocation
    en: Why does an aspect not run when one method calls another method inside the same class?
    ru: Почему aspect не срабатывает, когда один method вызывает другой method внутри того же класса?
  - id: jdk-vs-cglib
    en: How do JDK dynamic proxies and CGLIB proxies differ, and why do both still have proxy-boundary limits?
    ru: Чем отличаются JDK dynamic proxies и CGLIB proxies, и почему у обоих всё равно есть ограничения proxy boundary?
  - id: practical-fixes
    en: How would you fix a missed aspect caused by self-invocation in production code?
    ru: Как исправить пропущенный aspect из-за self-invocation в production code?
  - id: aspectj-option
    en: When would AspectJ weaving be considered instead of Spring's default proxy-based AOP?
    ru: Когда стоит рассмотреть AspectJ weaving вместо стандартного proxy-based AOP в Spring?
