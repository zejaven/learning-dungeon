# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: measure-the-baseline
    title:
      en: Measure before tuning
      ru: Измерь до тюнинга
    goal:
      en: Write records one by one and read the cost breakdown instead of guessing where the time goes.
      ru: Запиши записи по одной и прочитай разбор стоимости вместо догадок о том, куда уходит время.
    event: ROW_INSERTED
  - id: find-the-toast
    title:
      en: Find the TOAST chunks
      ru: Найди куски TOAST
    goal:
      en: Show what PostgreSQL does with a 30 MB value that cannot fit in an 8 KB page.
      ru: Покажи, что PostgreSQL делает со значением в 30 МБ, которое не помещается в страницу 8 КБ.
    event: TOAST_SPILL
  - id: see-the-wal-amplification
    title:
      en: Count the bytes twice
      ru: Посчитай байты дважды
    goal:
      en: Show that every byte of payload is written to the table and again to the WAL.
      ru: Покажи, что каждый байт нагрузки пишется в таблицу и ещё раз в WAL.
    event: WAL_AMPLIFIED
  - id: collapse-the-round-trips
    title:
      en: Collapse the round trips
      ru: Схлопни round trips
    goal:
      en: Send the rows as one batch in one transaction and see exactly how much that overhead was worth.
      ru: Отправь строки одним батчем в одной транзакции и увидь, сколько именно стоил этот overhead.
    event: BATCH_EXECUTED
  - id: weigh-the-indexes
    title:
      en: Weigh the indexes
      ru: Взвесь индексы
    goal:
      en: Compare index maintenance against the rest of the write on a huge row and on a small one.
      ru: Сравни обслуживание индексов с остальной записью на огромной строке и на маленькой.
    event: INDEX_MAINTENANCE
  - id: move-the-payload-out
    title:
      en: Take the payload out of the row
      ru: Вынеси нагрузку из строки
    goal:
      en: Store the payload outside PostgreSQL and keep only a reference, then re-price the write.
      ru: Сохрани нагрузку вне PostgreSQL, оставив только ссылку, и переоцени стоимость записи.
    event: PAYLOAD_OFFLOADED
  - id: stream-with-copy
    title:
      en: Stream with COPY
      ru: Передай поток через COPY
    goal:
      en: Load the rows with COPY FROM STDIN so the server parses and plans nothing per row.
      ru: Загрузи строки через COPY FROM STDIN, чтобы сервер ничего не разбирал и не планировал построчно.
    event: COPY_STREAMED
  - id: stop-waiting-for-fsync
    title:
      en: Stop waiting for the fsync
      ru: Перестань ждать fsync
    goal:
      en: Turn synchronous_commit off and see both what it saves and what it puts at risk.
      ru: Выключи synchronous_commit и увидь, что это экономит и чем при этом рискуешь.
    event: COMMIT_UNFLUSHED
  - id: saturate-the-pool
    title:
      en: Saturate the pool
      ru: Насыть пул
    goal:
      en: Point many services at the API at once and find out which ceiling is actually binding.
      ru: Направь много сервисов в API одновременно и выясни, какой потолок ограничивает на самом деле.
    event: POOL_SATURATED

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: improve-write-performance
    en: A service only writes to PostgreSQL, each record is about 30 MB, and many services call its API. How would you improve write performance? Give your order of work and say why.
    ru: Сервис только пишет в PostgreSQL, каждая запись около 30 МБ, и много сервисов вызывают его API. Как ты улучшишь производительность записи? Назови порядок работ и объясни почему.
  - id: what-happens-to-a-30mb-value
    en: What does PostgreSQL physically do with a 30 MB value in a bytea column? Walk the write from the client statement to the disk.
    ru: Что физически делает PostgreSQL со значением в 30 МБ в колонке bytea? Пройди путь записи от statement клиента до диска.
  - id: why-batching-disappoints
    en: You batch the inserts and throughput barely moves. Explain why, and what that tells you about the next thing to try.
    ru: Ты собрал вставки в батч, а пропускная способность почти не изменилась. Объясни почему и что это говорит о следующем шаге.
  - id: wal-amplification
    en: How much disk does one 30 MB record actually consume, counting the WAL, replicas and the archive? Why does that matter for write throughput?
    ru: Сколько диска реально потребляет одна запись в 30 МБ с учётом WAL, реплик и архива? Почему это важно для пропускной способности записи?
  - id: blob-in-db-vs-object-storage
    en: When is storing a large blob in PostgreSQL the right call, and when does it have to go to object storage? What do you give up either way?
    ru: Когда хранить большой blob в PostgreSQL правильно, а когда его обязательно выносить в объектное хранилище? Чем приходится жертвовать в обоих случаях?
  - id: keeping-blob-and-row-consistent
    en: The payload is in object storage and the row is in PostgreSQL. How do you keep them consistent when one of the two writes fails?
    ru: Нагрузка в объектном хранилище, а строка в PostgreSQL. Как обеспечить их согласованность, когда одна из двух записей падает?
  - id: synchronous-commit-tradeoff
    en: What exactly do you lose with synchronous_commit = off, and what do you NOT lose? Would you enable it here?
    ru: Что именно теряется при synchronous_commit = off и что НЕ теряется? Включил бы ты его здесь?
  - id: index-cost-on-writes
    en: How do indexes slow down inserts, and how would you decide which ones to drop on a write-heavy table?
    ru: Как индексы замедляют вставки и как ты решишь, какие из них удалить на таблице с интенсивной записью?
  - id: copy-vs-batched-insert
    en: When would you use COPY instead of batched INSERTs, and what does COPY not solve?
    ru: Когда применять COPY вместо батча INSERT и чего COPY не решает?
  - id: pool-size-reasoning
    en: Many services hammer this API and the connection pool is always full. How do you decide whether a bigger pool is the answer?
    ru: Много сервисов долбят этот API, и пул соединений всегда полон. Как ты решишь, является ли ответом увеличение пула?
  - id: async-write-path
    en: Would you make the write endpoint asynchronous — accept, queue, persist later? What does that buy and what does it break?
    ru: 'Сделал бы ты эндпоинт записи асинхронным: принять, положить в очередь, сохранить позже? Что это даёт и что ломает?'
  - id: partitioning-for-writes
    en: Does partitioning make writes faster? Explain what it actually helps with on a write-only table.
    ru: Ускоряет ли партиционирование запись? Объясни, чему оно на самом деле помогает на таблице только для записи.
  - id: unlogged-and-other-shortcuts
    en: Someone suggests UNLOGGED tables, fsync = off and a bigger shared_buffers. Which of those would you accept and which would you refuse?
    ru: Кто-то предлагает UNLOGGED-таблицы, fsync = off и больший shared_buffers. Что из этого ты примешь, а что отвергнешь?
  - id: when-to-shard-or-scale-out
    en: A single PostgreSQL primary cannot take the write volume any more. What are your options before and after sharding?
    ru: Один primary PostgreSQL больше не тянет объём записи. Какие варианты есть до шардирования и после?
  - id: proving-the-improvement
    en: How would you prove your change actually improved write performance, and what would you watch in production afterwards?
    ru: Как ты докажешь, что твоё изменение действительно улучшило запись, и за чем будешь следить в проде после него?
  - id: migrating-existing-blobs
    en: The table already holds terabytes of 30 MB rows. How do you migrate the payloads out without downtime?
    ru: В таблице уже лежат терабайты строк по 30 МБ. Как вынести нагрузку наружу без простоя?
