kind: practice
order: 1
title:
  en: |-
    The route that vanishes
  ru: |-
    Маршрут, который исчезает
statement:
  en: |-
    A route cache maps `RouteKey` to a computed price. `equals()` and `hashCode()` are correct, and the class looks immutable: its field is `private final`. Still, entries disappear from the cache. Nothing removes them, and `map.size()` does not change.

    The callers do this:

    ```java
    List<String> stops = new ArrayList<>(List.of("A", "B"));
    cache.put(new RouteKey(stops), 7);
    stops.add("C");                     // reused for the next route
    cache.get(new RouteKey(List.of("A", "B")));  // null
    ```

    Others get at the list through `key.stops()`.

    Fix `RouteKey` so that nothing a caller does after creating a key can change that key. The order of stops matters.
  ru: |-
    Кэш маршрутов отображает `RouteKey` на посчитанную цену. `equals()` и `hashCode()` написаны верно, а класс выглядит неизменяемым: поле `private final`. И всё же записи пропадают из кэша. Никто их не удаляет, и `map.size()` не меняется.

    Вызывающий код делает так:

    ```java
    List<String> stops = new ArrayList<>(List.of("A", "B"));
    cache.put(new RouteKey(stops), 7);
    stops.add("C");                     // список используется для следующего маршрута
    cache.get(new RouteKey(List.of("A", "B")));  // null
    ```

    Другие добираются до списка через `key.stops()`.

    Почини `RouteKey` так, чтобы после создания ключа вызывающий код никак не мог его изменить. Порядок остановок важен.
hints:
  - en: |-
      `final` protects the reference. What does it say about the object behind the reference?
    ru: |-
      `final` защищает ссылку. А что он говорит об объекте за этой ссылкой?
  - en: |-
      There are two doors into the key: the list passed to the constructor and the list returned by `stops()`. Both have to be closed.
    ru: |-
      В ключ ведут две двери: список, переданный в конструктор, и список, который возвращает `stops()`. Закрыть надо обе.
  - en: |-
      `Collections.unmodifiableList(stops)` is only a view: changes to the original still show through it. You need a real copy that is also unmodifiable.
    ru: |-
      `Collections.unmodifiableList(stops)` это только обёртка: изменения исходного списка видны сквозь неё. Нужна настоящая копия, которую к тому же нельзя изменить.
debrief:
  en: |-
    The entry never left the map. The key's hash changed after the insert, so `get()` looks in another bucket, and even in the right bucket `equals()` would fail. The entry stays there, unreachable, which is a memory leak as well as a bug.

    `final` does not make an object immutable. A key needs a defensive copy on the way in and no writable reference on the way out, and `List.copyOf` gives both at once. The two traps to name in an interview: `new ArrayList<>(stops)` still leaks through the getter, and `Collections.unmodifiableList` is a view of the caller's list, not a copy.
  ru: |-
    Запись из мапы никуда не делась. Хэш ключа изменился после вставки, поэтому `get()` ищет в другом бакете, а даже в правильном не сработал бы `equals()`. Запись остаётся в мапе недостижимой: это не только баг, но и утечка памяти.

    `final` не делает объект неизменяемым. Ключу нужна защитная копия на входе и отсутствие изменяемой ссылки на выходе, и `List.copyOf` даёт сразу оба. Две ловушки, которые стоит назвать на собеседовании: `new ArrayList<>(stops)` всё ещё течёт через геттер, а `Collections.unmodifiableList` это обёртка над списком вызывающего кода, а не копия.
