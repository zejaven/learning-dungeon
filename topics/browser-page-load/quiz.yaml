# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: turn-a-string-into-a-url
    title:
      en: Turn a typed string into a URL
      ru: Преврати набранную строку в URL
    goal:
      en: Type a bare host name and find the three things the browser filled in that you never typed.
      ru: Набери голое имя хоста и найди три вещи, которые браузер дописал за тебя.
    event: URL_TYPED
  - id: check-the-local-caches-first
    title:
      en: Miss three caches before sending anything
      ru: Промахнись мимо трёх кэшей до отправки
    goal:
      en: Start a cold lookup and name the three local places that are checked before a DNS packet leaves the machine.
      ru: Начни холодное разрешение имени и назови три локальных места, которые проверяются до отправки DNS-пакета.
    event: DNS_CACHE_MISS
  - id: walk-down-the-dns-tree
    title:
      en: Walk down the DNS tree
      ru: Спустись по дереву DNS
    goal:
      en: Follow one hop of the recursive walk and say what a root or TLD server actually knows.
      ru: Пройди один шаг рекурсивного обхода и скажи, что на самом деле знает корневой сервер или сервер зоны.
    event: DNS_QUERY
  - id: get-an-a-record
    title:
      en: Get an address and a TTL
      ru: Получи адрес и TTL
    goal:
      en: Finish a cold lookup and work out how many round trips one four-byte answer cost.
      ru: Заверши холодное разрешение имени и посчитай, во сколько round trip обошёлся один четырёхбайтный ответ.
    event: DNS_RESOLVED
  - id: skip-dns-entirely
    title:
      en: Skip DNS entirely
      ru: Пропусти DNS целиком
    goal:
      en: Look the same name up twice and see the second lookup cost nothing — then explain what TTL has to do with a migration.
      ru: Разреши одно и то же имя дважды и увидь, что второй раз стоит нуля, — затем объясни, при чём тут TTL во время переезда.
    event: DNS_CACHE_HIT
  - id: open-a-tcp-connection
    title:
      en: Spend a round trip on nothing
      ru: Потрать round trip ни на что
    goal:
      en: Perform the three-way handshake and check how many bytes of your request were sent during it.
      ru: Выполни трёхстороннее рукопожатие и проверь, сколько байт твоего запроса при этом ушло.
    event: TCP_HANDSHAKE
  - id: negotiate-tls
    title:
      en: Negotiate the encryption
      ru: Согласуй шифрование
    goal:
      en: Run the TLS handshake and find SNI and ALPN in the ClientHello — say what each is for.
      ru: Проведи рукопожатие TLS и найди SNI и ALPN в ClientHello — скажи, зачем нужен каждый.
    event: TLS_HANDSHAKE
  - id: verify-the-certificate
    title:
      en: Verify the certificate
      ru: Проверь сертификат
    goal:
      en: Reach the encrypted state and list what the browser checked — and what an observer can still see.
      ru: Дойди до зашифрованного состояния и перечисли, что проверил браузер и что всё ещё видит наблюдатель.
    event: TLS_ESTABLISHED
  - id: send-the-request-at-last
    title:
      en: Send the request at last
      ru: Наконец отправь запрос
    goal:
      en: Get to the first HTTP request and count the layers that had to finish before it could exist.
      ru: Дойди до первого HTTP-запроса и посчитай слои, которые должны были завершиться, чтобы он появился.
    event: HTTP_REQUEST
  - id: measure-time-to-first-byte
    title:
      en: Measure time to first byte
      ru: Измерь время до первого байта
    goal:
      en: Receive the response and break TTFB into the parts a backend engineer can change and the parts they cannot.
      ru: Получи ответ и разложи TTFB на части, которые бэкендер может изменить, и на те, которые не может.
    event: HTTP_RESPONSE
  - id: pay-for-a-redirect
    title:
      en: Pay for a redirect
      ru: Заплати за редирект
    goal:
      en: Ask an https-only site over http and add up what the 301 cost before the real request even started.
      ru: Обратись по http к сайту, живущему только на https, и сложи, во что обошёлся 301 ещё до настоящего запроса.
    event: HTTP_REDIRECT
  - id: delete-the-redirect
    title:
      en: Delete that redirect
      ru: Убери этот редирект
    goal:
      en: Repeat the navigation with the host on the HSTS list and explain which attack the rewrite prevents.
      ru: Повтори навигацию с хостом в списке HSTS и объясни, какую атаку предотвращает эта замена.
    event: HSTS_UPGRADED
  - id: discover-what-else-is-needed
    title:
      en: Discover what else the page needs
      ru: Узнай, что ещё нужно странице
    goal:
      en: Parse the document and say why receiving the HTML is not the same as loading the page.
      ru: Разбери документ и скажи, почему получить HTML — не то же самое, что загрузить страницу.
    event: HTML_PARSED
  - id: reuse-the-open-connection
    title:
      en: Fetch on the connection you already have
      ru: Загрузи по уже открытому соединению
    goal:
      en: Fetch a subresource and compare its cost with the first request on the same connection.
      ru: Загрузи подресурс и сравни его цену с ценой первого запроса по тому же соединению.
    event: RESOURCE_FETCHED
  - id: paint-the-page
    title:
      en: Finally paint something
      ru: Наконец нарисуй что-нибудь
    goal:
      en: Reach first paint and work out which part of the total time no backend optimisation can touch.
      ru: Дойди до первой отрисовки и определи, какую часть общего времени не трогает никакая оптимизация бэкенда.
    event: PAGE_RENDERED
  - id: come-back-a-second-time
    title:
      en: Come back a second time
      ru: Вернись во второй раз
    goal:
      en: Load the same page again and find the step where no handshake happens at all.
      ru: Загрузи ту же страницу ещё раз и найди шаг, на котором рукопожатия не происходит вовсе.
    event: TCP_REUSED
  - id: never-ask-the-server
    title:
      en: Do not ask the server at all
      ru: Не спрашивай сервер вовсе
    goal:
      en: Serve a subresource from the HTTP cache and explain how that differs from a 304 Not Modified.
      ru: Отдай подресурс из HTTP-кэша и объясни, чем это отличается от 304 Not Modified.
    event: RESOURCE_FROM_CACHE
  - id: read-the-bill
    title:
      en: Read the bill
      ru: Прочитай итоговый счёт
    goal:
      en: Finish a navigation and read where its milliseconds, round trips and requests actually went.
      ru: Заверши навигацию и посмотри, куда на самом деле ушли её миллисекунды, round trip и запросы.
    event: PAGE_LOAD_AUDIT
  - id: price-the-starting-conditions
    title:
      en: Price the five starting conditions
      ru: Оцени пять стартовых условий
    goal:
      en: Compare a cold load with a warm one and name the optimisation that deletes each row of the table.
      ru: Сравни холодную загрузку с тёплой и назови оптимизацию, которая вычёркивает каждую строку таблицы.
    event: ROUND_TRIPS_COMPARED

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: end-to-end-walkthrough
    en: You type google.com and press Enter. Walk me through everything that happens until the page is on screen.
    ru: Ты вводишь google.com и нажимаешь Enter. Проведи меня по всему, что происходит, пока страница не окажется на экране.
  - id: before-the-first-packet
    en: What does the browser do before a single packet leaves your machine?
    ru: Что делает браузер до того, как из машины уйдёт хоть один пакет?
  - id: how-dns-resolution-works
    en: How does a host name become an IP address? Who is asked, in what order, and what does each of them know?
    ru: Как имя хоста превращается в IP-адрес? Кого спрашивают, в каком порядке и что знает каждый из них?
  - id: dns-caching-and-ttl
    en: Where are DNS answers cached, and what does TTL mean for a migration to a new server?
    ru: Где кэшируются DNS-ответы и что означает TTL при переезде на новый сервер?
  - id: dns-transport-and-privacy
    en: 'What transport and port does DNS use, and who can see your lookups? What do DoH and DoT change?'
    ru: 'Какой транспорт и порт использует DNS и кто видит твои запросы? Что меняют DoH и DoT?'
  - id: tcp-handshake-purpose
    en: What is the TCP three-way handshake for, and what does it cost you before your request is even sent?
    ru: Зачем нужно трёхстороннее рукопожатие TCP и во что оно обходится ещё до отправки запроса?
  - id: what-a-connection-is
    en: 'What physically exists once a TCP connection is "established"? Does TCP know the host name?'
    ru: 'Что физически существует, когда TCP-соединение «установлено»? Знает ли TCP имя хоста?'
  - id: tls-handshake-steps
    en: Walk me through the TLS handshake. What is in the ClientHello and what does the server send back?
    ru: Проведи меня по рукопожатию TLS. Что лежит в ClientHello и что присылает сервер в ответ?
  - id: what-sni-is-for
    en: What is SNI, why is it needed, and what does it leak?
    ru: Что такое SNI, зачем он нужен и что он раскрывает?
  - id: certificate-verification
    en: What exactly does the browser check about a certificate, and what does a valid certificate actually prove?
    ru: Что именно браузер проверяет в сертификате и что действительный сертификат на самом деле доказывает?
  - id: tls12-vs-tls13-round-trips
    en: How many round trips does a TLS handshake take, and what changed in TLS 1.3?
    ru: Сколько round trip занимает рукопожатие TLS и что изменилось в TLS 1.3?
  - id: what-is-encrypted-and-what-is-not
    en: On an https:// page load, what can an observer on the network still see?
    ru: Что при загрузке https-страницы всё ещё видит наблюдатель в сети?
  - id: anatomy-of-the-request
    en: What is in the HTTP request the browser finally sends, and what is each header for?
    ru: Что лежит в HTTP-запросе, который браузер наконец отправляет, и зачем нужен каждый заголовок?
  - id: ttfb-breakdown
    en: 'TTFB for your page is 800 ms. Break that number down — which parts can you change, and how?'
    ru: 'TTFB твоей страницы — 800 мс. Разложи это число: на какие части ты можешь повлиять и как?'
  - id: document-is-not-the-page
    en: The HTML has arrived. Why is the page still not visible, and what happens next?
    ru: HTML пришёл. Почему страница ещё не видна и что происходит дальше?
  - id: render-blocking-resources
    en: Which resources block rendering and which do not? How do you keep a script from delaying first paint?
    ru: Какие ресурсы блокируют отрисовку, а какие нет? Как не дать скрипту задержать первую отрисовку?
  - id: http-versus-https-typed
    en: You type http:// for a site that only serves https. What happens, what does it cost, and how do you remove it?
    ru: Ты набираешь http:// для сайта, который отдаёт только https. Что произойдёт, во что это обойдётся и как это убрать?
  - id: what-hsts-does
    en: What does Strict-Transport-Security do, and what is the HSTS preload list for?
    ru: Что делает Strict-Transport-Security и зачем нужен preload-список HSTS?
  - id: second-visit-difference
    en: You reload the same page a second later. Which of those steps happen again and which do not?
    ru: Ты перезагружаешь ту же страницу секундой позже. Какие из этих шагов повторятся, а какие нет?
  - id: keep-alive-and-http2
    en: Why is the first request to a host so much more expensive than the next hundred? What makes that possible?
    ru: Почему первый запрос к хосту настолько дороже следующей сотни? Благодаря чему это работает?
  - id: browser-cache-vs-304
    en: What is the difference between a resource served from the browser cache and one that returns 304 Not Modified?
    ru: В чём разница между ресурсом, отданным из кэша браузера, и ресурсом, на который приходит 304 Not Modified?
  - id: why-round-trips-not-bandwidth
    en: 'Why is a page slow from another continent even on a fast connection? What actually scales with distance?'
    ru: 'Почему страница медленная с другого континента даже на быстром канале? Что на самом деле растёт с расстоянием?'
  - id: what-a-cdn-changes
    en: Which of these steps does a CDN make faster, and how does the request reach the nearest node at all?
    ru: Какие из этих шагов ускоряет CDN и как запрос вообще попадает на ближайший узел?
  - id: http2-and-http3
    en: What did HTTP/2 change about this sequence, and what does HTTP/3 over QUIC change again?
    ru: Что HTTP/2 изменил в этой последовательности и что снова меняет HTTP/3 поверх QUIC?
  - id: page-does-not-load-diagnosis
    en: A user says "the site does not open" for them only. How do you find which layer is broken?
    ru: Пользователь говорит, что «сайт не открывается» только у него. Как понять, какой слой сломан?
  - id: load-balancer-in-the-path
    en: Where do a load balancer and a reverse proxy fit into this sequence, and where does TLS terminate?
    ru: Где в этой последовательности находятся балансировщик и обратный прокси и где завершается TLS?
