# Theory topic: no missions (there is no practice editor) - only a Boss Fight.
bossFight:
  - id: what-makes-a-module
    en: What makes a piece of code a module rather than just a folder? Name the properties it must have.
    ru: Что делает кусок кода модулем, а не просто папкой? Назовите свойства, которыми он обязан обладать.
  - id: list-modularity-options
    en: What options exist for modular architecture in Java? Order them from the weakest to the strongest boundary.
    ru: Какие есть варианты модульной архитектуры в Java? Расположите их от самой слабой границы к самой сильной.
  - id: enforcement-question
    en: 'For any modularity option, the key question is: when someone violates a boundary, what happens and how soon do they find out? Answer it for packages, for build modules, and for services.'
    ru: 'Ключевой вопрос к любому варианту модульности: что произойдёт при нарушении границы и как быстро об этом узнают? Ответьте на него для пакетов, для модулей сборки и для сервисов.'
  - id: package-visibility-limits
    en: Why is package-private visibility not enough to enforce module boundaries in a real Java application?
    ru: Почему package-private видимости недостаточно, чтобы соблюдать границы модулей в реальном Java-приложении?
  - id: architecture-tests
    en: How would you enforce module boundaries with ArchUnit or Spring Modulith, and what can such a test not catch?
    ru: Как вы обеспечите соблюдение границ модулей с помощью ArchUnit или Spring Modulith и что такой тест поймать не сможет?
  - id: build-modules-tradeoffs
    en: What do you gain by splitting a project into Gradle or Maven modules, and what does it cost you?
    ru: Что вы получаете, разделив проект на модули Gradle или Maven, и чего это вам стоит?
  - id: jpms-in-practice
    en: What does JPMS add over build modules, and why is it still rare in application code?
    ru: Что JPMS добавляет поверх модулей сборки и почему он всё ещё редко встречается в прикладном коде?
  - id: runtime-plugin-modules
    en: When would you choose a runtime plugin architecture such as OSGi or ServiceLoader over compile-time modules?
    ru: Когда вы выберете runtime-архитектуру плагинов вроде OSGi или ServiceLoader вместо модулей времени компиляции?
  - id: layer-vs-feature
    en: Should top-level modules be layers (controllers, services, repositories) or features (orders, payments, shipping)? Defend your answer.
    ru: Модулями верхнего уровня должны быть слои (controllers, services, repositories) или фичи (orders, payments, shipping)? Обоснуйте ответ.
  - id: module-api-and-internals
    en: How do you structure a single module internally so that other modules cannot depend on its implementation?
    ru: Как устроить один модуль внутри так, чтобы другие модули не могли зависеть от его реализации?
  - id: breaking-a-cycle
    en: Module A needs something from module B, but B already depends on A. How do you resolve the cycle without a helper module?
    ru: Модулю A нужно что-то из модуля B, но B уже зависит от A. Как разорвать цикл без вспомогательного модуля?
  - id: calls-vs-events
    en: When should one module call another module's API directly, and when should it publish an event instead?
    ru: Когда один модуль должен вызывать API другого напрямую, а когда вместо этого публиковать событие?
  - id: module-data-ownership
    en: How should modules share a database? What does it mean for a module to own its data, and why does it decide whether extraction is possible?
    ru: Как модули должны делить базу данных? Что значит «модуль владеет своими данными» и почему это решает, возможен ли вынос модуля?
  - id: common-module-trap
    en: Why does a shared 'common' module so often ruin a module graph, and what rules keep it healthy?
    ru: Почему общий модуль common так часто разрушает граф модулей и какие правила удерживают его в здоровом состоянии?
  - id: module-granularity
    en: How big should a module be? What goes wrong when modules are too small, and when they are too large?
    ru: Насколько большим должен быть модуль? Что ломается, когда модули слишком мелкие, и когда они слишком крупные?
  - id: modular-monolith-to-services
    en: Which modularity would you pick for a new medium-sized system, and what would have to change before you extracted a module into a separate service?
    ru: Какую модульность вы выберете для новой системы среднего размера и что должно измениться, прежде чем вы вынесете модуль в отдельный сервис?
