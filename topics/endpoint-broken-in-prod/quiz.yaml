# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: turn-a-sentence-into-a-fact
    title:
      en: 'Ask before you type'
      ru: 'Спроси, прежде чем печатать'
    goal:
      en: 'Put a question to the reporter and get an answer: which request, who, since when, what comes back, how often.'
      ru: 'Задай сообщившему вопрос и получи ответ: какой запрос, у кого, с какого момента, что возвращается, как часто.'
    event: CLAIM_CLARIFIED
  - id: write-down-what-nobody-knows
    title:
      en: 'Record an unknown'
      ru: 'Запиши неизвестное'
    goal:
      en: Ask something nobody can answer yet and see why an open question is a fork rather than a dead end.
      ru: Задай вопрос, на который пока никто не отвечает, и пойми, почему открытый вопрос — это развилка, а не тупик.
    event: QUESTION_UNANSWERED
  - id: works-on-my-machine
    title:
      en: 'Answer the wrong question'
      ru: 'Ответь не на тот вопрос'
    goal:
      en: Tell the reporter the tests passed, and see what that costs besides half an hour.
      ru: Скажи сообщившему, что тесты прошли, и посмотри, во что это обходится помимо получаса.
    event: REPORT_DISMISSED
  - id: make-it-fail-in-front-of-you
    title:
      en: 'Reproduce the failure'
      ru: 'Воспроизведи сбой'
    goal:
      en: Send the failing request yourself and turn the report into something you can re-run later.
      ru: Отправь падающий запрос сам и преврати сообщение в то, что можно перезапустить потом.
    event: REPRODUCED
  - id: it-works-for-me-now-what
    title:
      en: 'Fail to reproduce'
      ru: 'Не сумей воспроизвести'
    goal:
      en: Send a request that succeeds and read what that narrows down — who, what, where or when.
      ru: Отправь запрос, который проходит, и прочитай, что это сужает — кто, что, где или когда.
    event: NOT_REPRODUCED
  - id: read-the-boring-graph
    title:
      en: 'Read a signal'
      ru: 'Прочитай сигнал'
    goal:
      en: Read a rate or a latency the system already records, and see which half of the search space it removes.
      ru: Прочитай долю ошибок или задержку, которые система уже пишет, и посмотри, какую половину области поиска это убирает.
    event: SIGNAL_READ
  - id: the-graph-that-does-not-exist
    title:
      en: 'Name a blind spot'
      ru: 'Назови слепое пятно'
    goal:
      en: Look for a signal that was never set up, and see why the report arrived by human and a day late.
      ru: Поищи сигнал, который никто не настроил, и пойми, почему сообщил человек и на сутки позже.
    event: SIGNAL_MISSING
  - id: how-wide-is-it
    title:
      en: 'Measure the blast radius'
      ru: 'Измерь радиус поражения'
    goal:
      en: Measure who and how much is affected, and let the severity fall out of the number instead of the adjective.
      ru: Измерь, кого и сколько задело, и выведи критичность из числа, а не из прилагательного.
    event: BLAST_RADIUS_SET
  - id: restore-before-you-understand
    title:
      en: 'Stop the bleeding'
      ru: 'Останови кровотечение'
    goal:
      en: 'Restore service without knowing the cause: roll back, flip the flag, drain the instance.'
      ru: 'Восстанови работу, не зная причины: откати, выключи флаг, выведи инстанс.'
    event: MITIGATED
  - id: what-is-different
    title:
      en: 'Name a suspect'
      ru: 'Назови подозреваемого'
    goal:
      en: Raise a hypothesis about what changed around the code — deploy, config, data, dependency, platform or client.
      ru: Выдвини гипотезу о том, что изменилось вокруг кода, — деплой, конфигурация, данные, зависимость, платформа или клиент.
    event: SUSPECT_RAISED
  - id: evidence-not-a-feeling
    title:
      en: 'Eliminate with evidence'
      ru: 'Исключи с уликой'
    goal:
      en: Close a hypothesis with the fact that killed it, so it cannot quietly come back at hour three.
      ru: Закрой гипотезу фактом, который её убил, чтобы она тихо не вернулась на третьем часу.
    event: SUSPECT_RULED_OUT
  - id: a-cause-explains-the-timing
    title:
      en: 'Confirm a root cause'
      ru: 'Подтверди корневую причину'
    goal:
      en: Confirm a cause that explains the timing and the affected callers, not just the error message.
      ru: Подтверди причину, которая объясняет и время, и то, каких вызывающих задело, а не только текст ошибки.
    event: ROOT_CAUSE_CONFIRMED
  - id: why-was-it-green
    title:
      en: 'Explain the green suite'
      ru: 'Объясни зелёный прогон'
    goal:
      en: Name what production has that the tests did not — data, concurrency, config, auth, scale or a real client.
      ru: Назови, что есть в проде и чего не было в тестах, — данные, конкурентность, конфигурация, аутентификация, масштаб или настоящий клиент.
    event: TEST_GAP_NAMED
  - id: guess-straight-onto-prod
    title:
      en: 'Push a guess'
      ru: 'Выкати догадку'
    goal:
      en: Change production before anything is confirmed, and count what that costs you in evidence.
      ru: Измени прод до того, как что-то подтверждено, и посчитай, во что это обходится в уликах.
    event: BLIND_FIX
  - id: smallest-change-that-works
    title:
      en: 'Fix a confirmed cause'
      ru: 'Исправь подтверждённую причину'
    goal:
      en: Ship the smallest change that addresses the confirmed cause and nothing else.
      ru: Выкати минимальное изменение, закрывающее подтверждённую причину и больше ничего.
    event: FIX_APPLIED
  - id: the-fix-that-did-not
    title:
      en: 'Watch a fix fail'
      ru: 'Посмотри, как исправление не помогло'
    goal:
      en: Re-run the failing request after a fix that misses, and see why the reproduction was worth keeping.
      ru: Перезапусти падающий запрос после мимо бьющего исправления и пойми, зачем стоило сохранить воспроизведение.
    event: FIX_UNVERIFIED
  - id: prove-it-where-it-broke
    title:
      en: 'Verify the fix'
      ru: 'Проверь исправление'
    goal:
      en: Make the exact request that failed succeed, in the environment it failed in.
      ru: Добейся, чтобы тот самый упавший запрос прошёл — в том окружении, где он падал.
    event: FIX_VERIFIED
  - id: make-the-next-one-shorter
    title:
      en: 'Leave a guard behind'
      ru: 'Оставь после себя защиту'
    goal:
      en: Add the test, the alert or the guardrail that would have caught this before a human did.
      ru: Добавь тест, алерт или ограничитель, который поймал бы это раньше человека.
    event: GUARD_ADDED
  - id: read-the-worksheet-back
    title:
      en: 'Review the triage'
      ru: 'Разбери разбор'
    goal:
      en: Read the whole worksheet back — what is known, which phases were skipped, and what the clock says.
      ru: Прочитай весь лист обратно — что известно, какие фазы пропущены и что показывают часы.
    event: TRIAGE_REVIEW

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: first-hour-walkthrough
    en: An endpoint you shipped yesterday passed all its tests. This morning the Product Owner says nothing works. Walk me through your first hour.
    ru: Эндпоинт, который ты выкатил вчера, прошёл все тесты. Сегодня утром владелец продукта говорит, что ничего не работает. Проведи меня по своему первому часу.
  - id: questions-you-ask-first
    en: What exactly do you ask the person who reported it, and why those questions rather than opening the code?
    ru: Что именно ты спросишь у того, кто сообщил, и почему именно эти вопросы, а не открыть код?
  - id: mitigate-versus-fix
    en: What is the difference between mitigating and fixing, and how do you decide which one you are doing right now?
    ru: В чём разница между смягчением и исправлением и как ты решаешь, что именно делаешь прямо сейчас?
  - id: when-to-roll-back
    en: When do you roll back immediately, and when is rolling back the wrong move?
    ru: Когда ты откатываешь немедленно, а когда откат — неверный шаг?
  - id: cannot-reproduce
    en: You send the same request and it works. What does that tell you, and what do you do next?
    ru: Ты отправляешь тот же запрос, и он работает. О чём это говорит и что ты сделаешь дальше?
  - id: which-signals-first
    en: Which dashboards or logs do you open first, and what does each one rule in or out?
    ru: Какие дашборды или логи ты откроешь первыми и что каждый из них подтверждает или исключает?
  - id: what-changed-shortlist
    en: The code passed its tests, so what could possibly be different in production? Give me your shortlist.
    ru: Код прошёл тесты — что тогда вообще может отличаться в проде? Назови свой короткий список.
  - id: why-a-day-later
    en: It broke a day after the release, not at the release. What does that delay tell you about the cause?
    ru: Сломалось через сутки после релиза, а не в момент релиза. Что эта задержка говорит о причине?
  - id: why-tests-were-green
    en: How can a suite be green and the endpoint still be broken? Name the specific gaps.
    ru: Как прогон может быть зелёным, а эндпоинт при этом сломанным? Назови конкретные пробелы.
  - id: is-it-even-your-service
    en: How do you tell whether the problem is in your endpoint, in the client, in the gateway, or in a dependency?
    ru: Как ты поймёшь, где проблема — в твоём эндпоинте, в клиенте, в шлюзе или в зависимости?
  - id: measuring-severity
    en: 'The Product Owner says «nothing works». How do you establish how bad it actually is, without contradicting them?'
    ru: 'Владелец продукта говорит «ничего не работает». Как ты установишь, насколько всё плохо на самом деле, не споря с ним?'
  - id: proving-the-fix
    en: What does «verified» mean to you? What would you refuse to accept as proof that it is fixed?
    ru: Что для тебя значит «проверено»? Что ты откажешься принять как доказательство того, что починено?
  - id: no-logs-no-metrics
    en: You open the dashboards and there is nothing useful there. What do you do during this incident, and after it?
    ru: Ты открываешь дашборды, а там нет ничего полезного. Что ты сделаешь во время этого инцидента и после него?
  - id: communication-during-incident
    en: Who do you tell what, and how often, while you are still working on it?
    ru: Кому, что и как часто ты сообщаешь, пока ещё разбираешься?
  - id: pressure-to-just-push-something
    en: Someone senior tells you to just push a hotfix now. How do you answer?
    ru: 'Кто-то старший говорит: просто выкати хотфикс сейчас. Что ты ответишь?'
  - id: prod-only-data-problem
    en: How would you find out whether the failure depends on specific production data, and how do you investigate that safely?
    ru: Как ты выяснишь, зависит ли сбой от конкретных данных прода, и как безопасно это исследовать?
  - id: what-goes-in-the-postmortem
    en: What goes into the write-up afterwards, and what makes a follow-up action actually get done?
    ru: Что попадёт в разбор после инцидента и что делает последующую задачу действительно выполненной?
  - id: preventing-the-class
    en: What would you change so that this whole class of «passed tests, broke in prod» gets caught before a user notices?
    ru: Что ты изменишь, чтобы весь класс «прошло тесты, сломалось в проде» ловился раньше, чем заметит пользователь?
