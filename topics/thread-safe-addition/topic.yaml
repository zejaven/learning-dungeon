id: thread-safe-addition
title:
  en: Thread Safety of Numeric Addition
  ru: Потокобезопасность сложения чисел
category:
  en: Java Core / Concurrency
  ru: Java Core / Многопоточность
type: CONCURRENCY
mode: trace
summary:
  en: >
    Why `x = x + 1` is a read-modify-write sequence, when numeric addition is safe,
    how lost updates happen on shared mutable counters, and which Java tools make
    the update atomic.
  ru: >
    Почему `x = x + 1` является последовательностью read-modify-write, когда
    сложение чисел безопасно, как возникают потерянные обновления у общего
    изменяемого counter и какие инструменты Java делают обновление атомарным.
categoryId: concurrency
difficulty: 2
catalogId: concurrency-6
style: Real world
aiProvider: codex
aiModel: gpt-5.5

primitives:
  - ArrayGrid
  - LinkedNodes
  - EventLog

defaultExample: read-compute-write

examples:
  - id: local-addition
    title:
      en: Local addition
      ru: Локальное сложение
    file: 01-local-addition.java
    explanation:
      en: >
        A value that belongs to one thread's stack is not shared, so another
        thread cannot interleave with this addition.
      ru: >
        Значение, которое принадлежит stack одного thread, не является общим,
        поэтому другой thread не может вклиниться в это сложение.
  - id: read-compute-write
    title:
      en: Read-compute-write
      ru: Read-compute-write
    file: 02-read-compute-write.java
    explanation:
      en: >
        Even one increment is split into reading the old value, computing the new
        value, and writing it back.
      ru: >
        Даже один increment разбивается на чтение старого значения, вычисление
        нового значения и запись обратно.
  - id: lost-update
    title:
      en: Lost update
      ru: Потерянное обновление
    file: 03-lost-update.java
    explanation:
      en: >
        Two threads read the same old counter value and both write the same next
        value, so one increment disappears.
      ru: >
        Два threads читают одно и то же старое значение counter и оба записывают
        одно и то же следующее значение, поэтому один increment исчезает.
  - id: protected-addition
    title:
      en: Protected addition
      ru: Защищённое сложение
    file: 04-protected-addition.java
    explanation:
      en: >
        A lock turns the read-compute-write sequence into a protected critical
        section for the shared counter.
      ru: >
        Lock превращает последовательность read-compute-write в защищённую
        critical section для общего counter.
  - id: waiting-for-lock
    title:
      en: Waiting for the lock
      ru: Ожидание lock
    file: 05-waiting-for-lock.java
    explanation:
      en: >
        When T1 owns the lock, T2 must wait instead of reading a half-finished
        shared update.
      ru: >
        Когда T1 владеет lock, T2 должен ждать, а не читать наполовину
        завершённое общее обновление.
  - id: small-critical-section
    title:
      en: Small critical section
      ru: Короткая critical section
    file: 06-small-critical-section.java
    explanation:
      en: >
        Work that does not touch shared state stays outside the lock; only the
        shared addition is protected.
      ru: >
        Работа, которая не трогает общее состояние, остаётся вне lock; защищается
        только сложение общего значения.

assistantExample:
  en: 'e.g. Is `count = count + 1` thread-safe if `count` is shared between threads?'
  ru: 'например: Является ли `count = count + 1` потокобезопасной, если `count` общий для threads?'

missionsFile: quiz.yaml
