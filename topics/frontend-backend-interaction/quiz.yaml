# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: watch-one-round-trip
    title:
      en: Watch one round trip
      ru: Проследи один обмен
    goal:
      en: Run any call and find the moment the router maps the text of a request onto a handler method.
      ru: Запусти любой вызов и найди момент, когда маршрутизатор сопоставляет текст запроса с методом-обработчиком.
    event: ROUTE_MATCHED
  - id: see-the-loading-state
    title:
      en: Catch the pending state
      ru: Поймай состояние ожидания
    goal:
      en: Find the step where the answer does not exist yet and the screen still has to render something.
      ru: Найди шаг, на котором ответа ещё нет, а экрану уже нужно что-то нарисовать.
    event: CALL_PENDING
  - id: cross-the-serialization-boundary
    title:
      en: Cross the serialization boundary
      ru: Пересеки границу сериализации
    goal:
      en: Inspect a payload and see what each Java type became by the time JavaScript got it.
      ru: Разбери полезную нагрузку и посмотри, чем стал каждый тип Java к моменту, когда его получил JavaScript.
    event: PAYLOAD_INSPECTED
  - id: get-rejected
    title:
      en: Get a write rejected
      ru: Добейся отказа в записи
    goal:
      en: Send a write without a valid token and see the server refuse a caller it knows nothing about.
      ru: Отправь запись без действующего токена и увидь, как сервер отказывает тому, о ком ничего не знает.
    event: AUTH_REJECTED
  - id: store-a-token
    title:
      en: Sign in without a session
      ru: Войди без сессии
    goal:
      en: Sign in and confirm the server issued a token and stored nothing at all.
      ru: Выполни вход и убедись, что сервер выдал токен и при этом ничего не сохранил.
    event: TOKEN_STORED
  - id: create-a-resource
    title:
      en: Learn an id you did not choose
      ru: Узнай идентификатор, который выбрал не ты
    goal:
      en: Create an employee and read back the id and Location the server invented for it.
      ru: Создай сотрудника и прочитай идентификатор и Location, которые придумал для него сервер.
    event: RESOURCE_CREATED
  - id: fail-validation
    title:
      en: 'Get a machine-readable 400'
      ru: 'Получи машиночитаемый 400'
    goal:
      en: Send a body with a required field missing and look at the shape of the error the frontend gets.
      ru: Отправь тело без обязательного поля и посмотри на форму ошибки, которую получает фронтенд.
    event: VALIDATION_FAILED
  - id: break-the-server
    title:
      en: 'Get a 500 back'
      ru: 'Получи в ответ 500'
    goal:
      en: Call the endpoint whose handler throws and confirm a 5xx is still a completed round trip.
      ru: Вызови эндпоинт, обработчик которого падает, и убедись, что 5xx — это всё равно состоявшийся обмен.
    event: SERVER_ERROR
  - id: lose-the-network
    title:
      en: Lose the network
      ru: Потеряй сеть
    goal:
      en: Make a call with no connection and see an outcome that has no status code at all.
      ru: Сделай вызов без связи и увидь исход, у которого вообще нет кода состояния.
    event: NETWORK_FAILED
  - id: lose-the-answer
    title:
      en: Lose only the answer
      ru: Потеряй только ответ
    goal:
      en: Let a write reach the server and lose its response, then check whether the row was written.
      ru: Дай записи дойти до сервера и потеряй ответ, а затем проверь, была ли записана строка.
    event: RESPONSE_LOST
  - id: create-a-duplicate
    title:
      en: Duplicate a write by retrying
      ru: Продублируй запись повтором
    goal:
      en: Retry a create whose answer was lost and end up with two records where one was meant.
      ru: Повтори создание, ответ на которое потерялся, и получи две записи там, где нужна была одна.
    event: DUPLICATE_CREATED
  - id: make-the-retry-safe
    title:
      en: Make the retry safe
      ru: Сделай повтор безопасным
    goal:
      en: Give the write an Idempotency-Key and watch the server replay the first result instead of writing again.
      ru: Дай записи Idempotency-Key и посмотри, как сервер повторяет первый результат вместо новой записи.
    event: IDEMPOTENT_REPLAY
  - id: reload-the-page
    title:
      en: Reload the page
      ru: Перезагрузи страницу
    goal:
      en: Wipe the frontend's memory and confirm the server did not lose anything, because it kept nothing.
      ru: Сотри память фронтенда и убедись, что сервер ничего не потерял, потому что ничего и не хранил.
    event: PAGE_RELOADED
  - id: fail-to-push
    title:
      en: Try to push to a closed tab
      ru: Попробуй отправить в закрытое соединение
    goal:
      en: Have the server send news before any connection is open and see why it cannot.
      ru: Заставь сервер отправить новость до того, как открыто соединение, и увидь, почему у него не выходит.
    event: PUSH_IMPOSSIBLE
  - id: let-the-server-speak
    title:
      en: Let the server speak first
      ru: Дай серверу заговорить первым
    goal:
      en: Open a WebSocket and receive a message nobody asked for.
      ru: Открой WebSocket и получи сообщение, которого никто не запрашивал.
    event: SERVER_PUSHED
  - id: break-the-contract
    title:
      en: 'Break the contract silently'
      ru: 'Сломай контракт незаметно'
    goal:
      en: Rename a response field and read it from the already-deployed frontend, with the call still returning 200.
      ru: Переименуй поле ответа и прочитай его из уже задеплоенного фронтенда, при том что вызов по-прежнему возвращает 200.
    event: FIELD_MISSING

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: how-do-they-talk
    en: How does interaction between the frontend and the backend happen? Walk through one request from a button click to the updated screen.
    ru: Как происходит взаимодействие между фронтендом и бэкендом? Проведи по одному запросу от нажатия кнопки до обновлённого экрана.
  - id: anatomy-of-a-request
    en: What are the parts of an HTTP request and of an HTTP response, and what belongs in each?
    ru: Из каких частей состоят HTTP-запрос и HTTP-ответ и что в каждой из них должно лежать?
  - id: why-json
    en: Why is data exchanged as JSON rather than as objects? What is lost when an entity is serialized?
    ru: Почему данные передаются в JSON, а не объектами? Что теряется при сериализации сущности?
  - id: null-vs-missing
    en: 'In a JSON response, what is the difference between a field set to null and a field that is not there at all?'
    ru: 'В JSON-ответе: чем поле со значением null отличается от поля, которого нет вовсе?'
  - id: statelessness
    en: What does it mean that HTTP is stateless, and how does a user stay signed in across requests?
    ru: Что означает, что HTTP не хранит состояние, и как пользователь остаётся авторизованным между запросами?
  - id: token-vs-session
    en: Compare a server-side session with a token stored in the browser. What does each cost you when you scale out?
    ru: Сравни серверную сессию и токен, хранимый в браузере. Чего стоит каждый вариант при масштабировании?
  - id: status-codes
    en: Which status code would you return for a failed validation, a missing record, a bad token, and a crashed handler? Why?
    ru: Какой код состояния ты вернёшь при неуспешной валидации, отсутствующей записи, плохом токене и упавшем обработчике? Почему?
  - id: error-body-shape
    en: How should an API error body be shaped so a frontend can show a useful message in its own language?
    ru: Как должно быть устроено тело ошибки API, чтобы фронтенд мог показать полезное сообщение на своём языке?
  - id: async-ui-states
    en: Why does every screen that talks to a backend need at least three states? What happens if you skip one?
    ru: Почему у каждого экрана, который ходит в бэкенд, минимум три состояния? Что будет, если одно пропустить?
  - id: no-response-vs-500
    en: A call ends with no status code at all. How is that different from a 500, and what may the client safely do next?
    ru: Вызов завершился вообще без кода состояния. Чем это отличается от 500 и что клиент может после этого безопасно сделать?
  - id: retry-duplicates
    en: A POST times out and the user presses the button again. How do you stop that from creating two records?
    ru: POST завис по таймауту, и пользователь нажал кнопку ещё раз. Как не дать этому создать две записи?
  - id: validation-on-both-sides
    en: The frontend already validates the form. Why does the backend validate it again?
    ru: Фронтенд уже проверяет форму. Почему бэкенд проверяет её ещё раз?
  - id: server-push
    en: The backend needs to notify an open page about an event. What are the options, and how do they differ?
    ru: Бэкенду нужно уведомить открытую страницу о событии. Какие есть варианты и чем они отличаются?
  - id: polling-cost
    en: What does polling every few seconds actually cost, and when is it still the right choice?
    ru: Во что на самом деле обходится опрос раз в несколько секунд и когда он всё же правильный выбор?
  - id: contract-changes
    en: Which changes to a response body are safe to deploy, and which break a frontend that is already running?
    ru: Какие изменения тела ответа можно безопасно выкатывать, а какие ломают уже работающий фронтенд?
  - id: two-copies-of-state
    en: After a successful call, both sides hold data. How do they drift apart, and how do you keep them in step?
    ru: После успешного вызова данные есть у обеих сторон. Как они расходятся и как их держать в согласии?
  - id: local-vs-remote-call
    en: What can go wrong with a network call that can never go wrong with a local method call?
    ru: Что может пойти не так с сетевым вызовом из того, что никогда не случается с локальным вызовом метода?
  - id: browser-boundary
    en: Why can nothing the browser sends ever be trusted, and what does that mean for where you put checks?
    ru: Почему ничему, что присылает браузер, нельзя доверять, и что это значит для того, где ставить проверки?
  - id: rest-alternatives
    en: 'Besides a REST/JSON API over HTTP, how else can a frontend and a backend talk — GraphQL, gRPC, server rendering? When would you pick each?'
    ru: 'Кроме REST/JSON поверх HTTP, как ещё могут общаться фронтенд и бэкенд — GraphQL, gRPC, серверный рендеринг? Когда выбрать каждый?'
  - id: debugging-an-interaction
    en: A button does nothing in production. How do you find out whether the problem is in the frontend, the network, or the backend?
    ru: Кнопка в проде ничего не делает. Как ты выяснишь, где проблема — во фронтенде, в сети или в бэкенде?
