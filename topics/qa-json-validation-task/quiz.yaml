  ru: Как быстро находить незакрытые скобки в большом JSON и какой симптом выдаёт такая ошибка при парсинге?
- id: json-syntax-rules
  ru: 'Перечислите базовые правила синтаксиса JSON: как записываются строки, ключи, числа, литералы true/false/null и почему в JSON нет комментариев.'
- id: json-validation-in-practice
  ru: 'Как на практике проверить, что ответ API — валидный JSON: какие инструменты и приёмы вы используете?'
