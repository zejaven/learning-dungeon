# Challenge mission: passes when every test case in the hidden harness is green.
missions:
  - id: all-tests
    type: challenge
    title:
      en: Pass all tests
      ru: Пройди все тесты
    goal:
      en: Implement TwoStackQueue so enqueue, dequeue, peek, isEmpty, and size behave like a FIFO queue.
      ru: Реализуй TwoStackQueue, чтобы enqueue, dequeue, peek, isEmpty и size работали как FIFO queue.
    requires:
      - kind: tests

bossFight:
  - id: core-idea
    en: How can you implement a FIFO queue using only two stacks?
    ru: Как реализовать FIFO queue, используя только два stack?
  - id: transfer-rule
    en: Why should values move from the input stack to the output stack only when the output stack is empty?
    ru: Почему значения нужно переносить из input stack в output stack только когда output stack пуст?
  - id: amortized-cost
    en: What are the amortized costs of enqueue, dequeue, and peek in the two-stack queue?
    ru: Какова амортизированная стоимость enqueue, dequeue и peek в очереди на двух stack?
  - id: worst-case-cost
    en: What is the worst-case cost of a single dequeue, and why does that not contradict amortized O(1)?
    ru: Какова стоимость одного dequeue в худшем случае и почему это не противоречит амортизированному O(1)?
  - id: empty-queue
    en: What should dequeue and peek do when the queue is empty?
    ru: Что должны делать dequeue и peek, когда queue пуста?
  - id: java-deque
    en: Why is ArrayDeque usually a better stack container than java.util.Stack in modern Java?
    ru: Почему ArrayDeque обычно лучше подходит как stack-контейнер, чем java.util.Stack в современном Java?
