# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: overwrite-the-balance
    title:
      en: Overwrite the balance
      ru: Перезапиши баланс
    goal:
      en: Apply an operation to an in-place balance and watch the previous value stop existing.
      ru: Проведи операцию по балансу, хранимому «на месте», и посмотри, как прежнее значение перестаёт существовать.
    event: OPERATION_APPLIED
  - id: append-instead
    title:
      en: Append instead of overwrite
      ru: Добавь вместо перезаписи
    goal:
      en: Record the same operation as an immutable entry and let the balance be derived from it.
      ru: Запиши ту же операцию неизменяемой записью и позволь балансу выводиться из неё.
    event: ENTRY_APPENDED
  - id: lose-an-operation
    title:
      en: Lose an operation
      ru: Потеряй операцию
    goal:
      en: Send two operations at once against an in-place balance and let one read-modify-write overwrite the other.
      ru: Отправь две операции одновременно по балансу «на месте» и дай одному read-modify-write перезаписать другой.
    event: LOST_UPDATE
  - id: ask-the-number-why
    title:
      en: 'Ask the balance "why?"'
      ru: 'Спроси у баланса «почему?»'
    goal:
      en: Ask an in-place balance to justify itself and see that the answer was never stored.
      ru: Попроси баланс «на месте» обосновать себя и убедись, что ответ никогда не сохранялся.
    event: HISTORY_UNAVAILABLE
  - id: itemize-the-balance
    title:
      en: Itemize the balance
      ru: Разложи баланс по строкам
    goal:
      en: Ask the same question of a ledger and get every operation, in order, with its reason.
      ru: Задай тот же вопрос журналу и получи все операции по порядку и с причинами.
    event: HISTORY_EXPLAINED
  - id: correct-without-deleting
    title:
      en: Correct without deleting
      ru: Исправь, ничего не удаляя
    goal:
      en: Fix a wrong posting in a ledger by appending a reversal and the right entry, keeping the mistake visible.
      ru: Исправь ошибочную проводку в журнале, добавив сторно и правильную запись, оставив ошибку видимой.
    event: CORRECTION_APPENDED
  - id: bound-the-fold
    title:
      en: Bound the read cost
      ru: Ограничь стоимость чтения
    goal:
      en: Take a snapshot so a balance read stops folding the entire history.
      ru: Сделай снимок, чтобы чтение баланса перестало сворачивать всю историю.
    event: SNAPSHOT_TAKEN
  - id: catch-the-drift
    title:
      en: Catch the cached balance drifting
      ru: Поймай расхождение кэшированного баланса
    goal:
      en: Write the entry and the denormalized balance in two transactions, then let an audit compare them.
      ru: Запиши запись и денормализованный баланс в двух транзакциях, а затем дай сверке их сравнить.
    event: DRIFT_DETECTED
  - id: overdraw-an-append-only-account
    title:
      en: Overdraw an append-only account
      ru: Уведи append-only-счёт в минус
    goal:
      en: Send two concurrent withdrawals that each pass the floor check and let both entries land.
      ru: Отправь два одновременных списания, каждое из которых проходит проверку порога, и дай обеим записям пройти.
    event: INVARIANT_VIOLATED

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: choose-the-storage-model
    en: For a balance service, would you store the current balance and update it in place, or append immutable operations and compute the balance? Defend your default.
    ru: Для сервиса балансов ты бы хранил текущий баланс и обновлял его на месте или добавлял неизменяемые операции и вычислял баланс? Обоснуй выбор по умолчанию.
  - id: what-in-place-destroys
    en: What information does an in-place UPDATE destroy, and name a concrete situation where you need exactly that information.
    ru: Какую информацию уничтожает UPDATE на месте и назови конкретную ситуацию, где нужна именно она.
  - id: ledger-costs
    en: What does an append-only ledger actually cost you? Go past "reads are slower".
    ru: Во что на самом деле обходится append-only-журнал? Не ограничивайся ответом «чтения медленнее».
  - id: read-cost-and-snapshots
    en: The fold over the entries gets slower every year. What are your options, and what does each one give up?
    ru: Свёртка по записям с каждым годом медленнее. Какие есть варианты и чем жертвует каждый?
  - id: denormalized-balance-safety
    en: You keep both entries and a balance column. Under what exact conditions is that safe, and how do you detect it going wrong?
    ru: Ты хранишь и записи, и колонку баланса. При каких именно условиях это безопасно и как обнаружить, что что-то пошло не так?
  - id: concurrency-difference
    en: How does each model behave when two operations on the same account overlap? Which race does append-only remove and which does it not?
    ru: Как ведёт себя каждая модель, когда две операции по одному счёту пересекаются? Какую гонку append-only убирает, а какую нет?
  - id: enforcing-a-non-negative-balance
    en: Enforce "the balance never goes below zero" in an append-only design. What mechanisms would you use and what do they cost?
    ru: Обеспечь правило «баланс никогда не уходит ниже нуля» в append-only-схеме. Какие механизмы применишь и во что они обойдутся?
  - id: fixing-a-wrong-operation
    en: An operation was recorded with the wrong amount. How do you fix it in each model, and what does the auditor see afterwards?
    ru: Операция записана с неверной суммой. Как исправить её в каждой модели и что после этого увидит аудитор?
  - id: immutability-is-a-policy
    en: What actually stops anyone from running UPDATE or DELETE on your "immutable" entries table?
    ru: Что на самом деле мешает кому-нибудь выполнить UPDATE или DELETE по твоей «неизменяемой» таблице записей?
  - id: event-sourcing-vs-ledger
    en: Is an accounting ledger the same thing as event sourcing? Where do the two ideas differ in practice?
    ru: Бухгалтерский журнал — это то же самое, что event sourcing? Чем эти две идеи различаются на практике?
  - id: schema-evolution
    en: The meaning of a recorded operation type changes a year later. What does that do to a system that replays history, and how do you handle it?
    ru: Смысл записанного типа операции меняется через год. Что это делает с системой, которая проигрывает историю, и как с этим быть?
  - id: retention-and-growth
    en: The entries table reaches hundreds of millions of rows. What is your plan, given that you are not allowed to delete financial history?
    ru: Таблица записей дорастает до сотен миллионов строк. Каков твой план, если удалять финансовую историю нельзя?
  - id: migrating-to-a-ledger
    en: A live system stores balances in place. How would you migrate it to a ledger without stopping it?
    ru: Работающая система хранит балансы «на месте». Как перевести её на журнал, не останавливая?
  - id: when-in-place-is-right
    en: Give a case where updating in place is the correct choice, and explain what makes it correct there.
    ru: Приведи случай, когда обновление на месте — правильный выбор, и объясни, что делает его правильным именно там.
  - id: idempotency-of-entries
    en: A retried request must not append the same entry twice. How do you guarantee that, and where does the guarantee live?
    ru: Повторённый запрос не должен добавить ту же запись дважды. Как это гарантировать и где живёт эта гарантия?
