summary:
  en: >
    Learn what JOIN does and when to use INNER JOIN, LEFT JOIN, RIGHT JOIN,
    FULL OUTER JOIN, CROSS JOIN, and SELF JOIN. The SQL playground uses a small
    office-style dataset so you can see matched rows, missing departments,
    manager relationships, and Cartesian products directly in the result table.
  ru: >
    Разберитесь, что делает JOIN и когда применять INNER JOIN, LEFT JOIN,
    RIGHT JOIN, FULL OUTER JOIN, CROSS JOIN и SELF JOIN. SQL-песочница использует
    небольшой офисный набор данных, чтобы вы прямо в таблице результата увидели
    совпавшие строки, отсутствующие отделы, связи с наставниками и декартовы
    произведения.

