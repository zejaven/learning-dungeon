id: builder
languages: [en, ru]
title:
  en: Builder Pattern
  ru: Паттерн Builder
category:
  en: Design Patterns / Creational
  ru: Паттерны проектирования / Порождающие
type: DESIGN_PATTERN
mode: structural
aiProvider: codex
aiModel: gpt-5.5
categoryId: design-patterns
difficulty: 2
catalogId: design-patterns-4
style: Real world
summary:
  en: >
    Builder solves the problem of constructing objects with many optional parts,
    validation rules, or step-by-step setup. In this structural practice you
    keep an Order product separate from an OrderBuilder contract, add a
    DefaultOrderBuilder implementation, and make OrderService depend on the
    builder instead of hard-coding a long constructor call.
  ru: >
    Builder решает проблему создания объектов с множеством необязательных
    частей, правилами валидации или пошаговой настройкой. В этой структурной
    практике вы отделяете продукт Order от контракта OrderBuilder, добавляете
    реализацию DefaultOrderBuilder и заставляете OrderService зависеть от
    builder вместо жёстко заданного вызова длинного конструктора.

assistantExample:
  en: 'e.g. When should I use Builder instead of a constructor or Factory Method?'
  ru: 'например: Когда стоит использовать Builder вместо конструктора или Factory Method?'

