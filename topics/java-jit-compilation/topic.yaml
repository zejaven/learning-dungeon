id: java-jit-compilation
title:
  en: Why Java Is Often Faster Than Python and How JIT Works
  ru: Почему Java часто быстрее Python и как работает JIT
category:
  en: Java Core / JVM
  ru: Java Core / JVM
type: JVM_MEMORY
mode: trace
aiProvider: codex
aiModel: gpt-5.5
categoryId: java-core
difficulty: 2
catalogId: java-core-19
style: Real world
summary:
  en: >
    Why Java often outperforms Python on CPU-bound code, how the JVM starts by
    interpreting bytecode, profiles real execution, compiles hot methods with
    JIT, applies optimizations such as inlining and escape analysis, and can
    deoptimize when a speculative assumption breaks.
  ru: >
    Почему Java часто быстрее Python в CPU-bound коде, как JVM сначала
    интерпретирует bytecode, профилирует реальное выполнение, компилирует hot
    methods через JIT, применяет оптимизации вроде inlining и escape analysis и
    может выполнить deoptimization, если спекулятивное предположение ломается.

primitives:
  - ArrayGrid
  - LinkedNodes
  - EventLog

defaultExample: warmup-compile

examples:
  - id: warmup-compile
    title:
      en: Warm up and compile
      ru: Прогрев и компиляция
    file: 01-warmup-compile.java
    explanation:
      en: >
        Repeated calls make one method hot. The model shows interpreted calls,
        a hot-profile event, JIT compilation, and then an optimized call.
      ru: >
        Повторные вызовы делают один метод hot. Модель показывает
        интерпретируемые вызовы, событие hot-profile, JIT compilation и затем
        optimized call.
  - id: cold-code
    title:
      en: Cold code stays interpreted
      ru: Холодный код остается интерпретируемым
    file: 02-cold-code.java
    explanation:
      en: >
        Rare methods do not reach the compile threshold. They keep running in
        the interpreter, which explains why warmup matters.
      ru: >
        Редкие методы не достигают compile threshold. Они продолжают
        выполняться в интерпретаторе, поэтому прогрев важен.
  - id: loop-hotspot
    title:
      en: Hot loop path
      ru: Горячий путь цикла
    file: 03-hot-loop.java
    explanation:
      en: >
        A tight loop-like method quickly becomes hot. Later calls skip repeated
        bytecode interpretation and use optimized machine code.
      ru: >
        Метод, похожий на плотный цикл, быстро становится hot. Следующие вызовы
        обходят повторную интерпретацию bytecode и используют optimized machine
        code.
  - id: inlining
    title:
      en: Inline a small method
      ru: Встроить маленький метод
    file: 04-inlining.java
    explanation:
      en: >
        After the caller is compiled, JIT can inline a tiny helper method and
        remove part of the method-call overhead.
      ru: >
        После компиляции вызывающего метода JIT может встроить маленький helper
        method и убрать часть накладных расходов method call.
  - id: escape-analysis
    title:
      en: Remove local allocation
      ru: Убрать локальную аллокацию
    file: 05-escape-analysis.java
    explanation:
      en: >
        Escape analysis can prove a temporary object stays inside one method.
        The compiled version may remove the allocation completely.
      ru: >
        Escape analysis может доказать, что временный объект остается внутри
        одного метода. Скомпилированная версия может полностью убрать
        аллокацию.
  - id: deoptimization
    title:
      en: Deoptimization
      ru: Deoptimization
    file: 06-deoptimization.java
    explanation:
      en: >
        JIT optimizes using runtime assumptions. When a new situation breaks an
        assumption, the JVM can discard optimized code and return to the
        interpreter.
      ru: >
        JIT оптимизирует код с опорой на runtime assumptions. Когда новая
        ситуация ломает предположение, JVM может отбросить optimized code и
        вернуться к интерпретатору.

assistantExample:
  en: 'e.g. Why can Java get faster after a warmup period?'
  ru: 'например: Почему Java может ускоряться после периода прогрева?'

