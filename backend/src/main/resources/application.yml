server:
  # Local single-user app: loopback only. The run endpoint executes arbitrary
  # user code, so listening on 0.0.0.0 would expose it to the whole LAN.
  address: 127.0.0.1
  port: 18080

spring:
  application:
    name: interview-learning-backend

  # In a packaged (single-process) run the backend also serves the built
  # frontend. `frontend/dist` is read from disk relative to the working
  # directory, which the tray launcher sets to the repo root (same convention
  # as the optional config import below). In dev the folder is absent and this
  # location is simply skipped; you keep using the Vite dev server on :15173.
  web:
    resources:
      static-locations: 'classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,file:./frontend/dist/'

  # DB credentials (username/password) live in config/secret.yml, which is
  # git-ignored. Copy config/secret.example.yml to config/secret.yml locally.
  config:
    import: optional:file:./config/secret.yml

  datasource:
    url: jdbc:postgresql://localhost:5432/java-interview-dungeon
    username: ${db.username:postgres}
    password: ${db.password:}
    # The progress tables are created/migrated on startup by DbInitializer
    # (not spring.sql.init, which can't parse the PL/pgSQL migration block).

app:
  # Repository root. bootRun sets this system property; otherwise the process
  # working directory is used. The topics/ folder and the built visual-runtime
  # jar are resolved relative to this.
  repo-root: ${app.repo-root:}
  runner:
    timeout-seconds: 5
    max-heap: 128m
  ai:
    claude:
      command: claude
      # Aliases, not pinned ids: the Claude CLI resolves `sonnet`/`opus`/`haiku`
      # to the latest release of that tier, so a new model needs no config edit.
      # The concrete id the alias resolved to is learned from the CLI stream and
      # is what gets recorded as `aiModel` in generated content.
      assistant-model: sonnet
      generate-model: opus
      generate-permission-mode: bypassPermissions
    codex:
      command: codex
      assistant-model: gpt-5.4-mini
      generate-model: gpt-5.5
      assistant-effort: medium
      generate-effort: xhigh
    kimi:
      command: kimi
      assistant-model: kimi-k2.7-code-highspeed
      generate-model: kimi-k2.7-code
  # Self-update / restart (settings gear). The tray launcher sets app.launcher=tray
  # and app.repo-root; only then can the app rebuild+restart itself. The backend
  # periodically fetches to report how many commits the upstream is ahead.
  update:
    git-command: git
    fetch-interval-ms: 3600000
  usage:
    # Header meter/status for the selected AI provider. Claude has session/weekly
    # usage bars; Codex/Kimi currently expose CLI availability only.
    enabled: true
    refresh-seconds: 180
    # Sent as User-Agent; must start with "claude-code/" to avoid instant 429s.
    user-agent: claude-code/2.1.177
    # To point at a non-default credentials file, set app.usage.credentials-file
    # via env/system property; it defaults to ~/.claude/.credentials.json.

logging:
  level:
    com.interviewlearning: INFO
