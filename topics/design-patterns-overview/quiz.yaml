# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: what-are-patterns
    en: What are design patterns and why are they useful?
    ru: Что такое шаблоны проектирования и чем они полезны?
  - id: gof-categories
    en: What are the three GoF categories of patterns and how do they differ?
    ru: Какие есть три категории паттернов GoF и чем они отличаются?
  - id: creational-example
    en: Name a creational pattern and a situation where you'd use it.
    ru: Назовите порождающий паттерн и ситуацию, где он уместен.
  - id: structural-example
    en: Name a structural pattern and what problem it solves.
    ru: Назовите структурный паттерн и какую проблему он решает.
  - id: behavioral-example
    en: Name a behavioral pattern and a real use case for it.
    ru: Назовите поведенческий паттерн и реальный сценарий его использования.
  - id: overuse
    en: What is the risk of overusing design patterns?
    ru: В чём опасность чрезмерного использования паттернов?
