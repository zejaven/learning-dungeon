id: qa-json-validation-task
domainId: qa
languages: [ru]
title: 'Задача: найди ошибки в JSON'
category: Задачи с собеседований
type: THEORY
mode: theory
aiProvider: kimi
categoryId: qa-practice
difficulty: 2
summary: >
  Эталонный разбор задачи «найди ошибки в JSON»: битый блок конфигурации
  с посаженными ошибками (значение без кавычек, ведущий ноль 01, запятая
  вместо точки в числе, ключ без кавычек, булево строкой, висячие запятые,
  незакрытая фигурная скобка), таблица «ошибка -> почему невалидно -> как
  исправить», свод правил синтаксиса JSON и способы валидации на практике:
  линтеры, парсеры, проверка ответа API.

assistantExample:
  'например: Чем число 01 нарушает спецификацию JSON и какие значения вместо него пройдут валидацию?'

missionsFile: quiz.yaml
