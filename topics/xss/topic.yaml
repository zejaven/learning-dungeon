id: xss
languages: [en, ru]
title:
  en: 'Cross-Site Scripting (XSS)'
  ru: 'Межсайтовый скриптинг (XSS)'
category:
  en: Security & Authentication
  ru: Безопасность и аутентификация
type: HTTP
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: security
difficulty: 1
catalogId: security-1
summary:
  en: >
    XSS is what happens when a value somebody else typed ends up in a page as
    code instead of as data: the browser cannot tell the attacker's characters
    from the template's, so it obeys them, and the resulting script runs on your
    origin with your user's session. It comes in three shapes — reflected
    (echoed back from the request), stored (saved once, served to every reader)
    and DOM-based (the page's own JavaScript writes it, and the server never
    sees it). The fix is output encoding chosen by the sink, because the same
    payload is inert between tags and executable inside a script block or a
    'javascript:' link; where the value must stay HTML, an allowlist sanitizer
    replaces the encoder. A Content-Security-Policy and 'HttpOnly' cookies limit
    the damage but do not fix the bug, and input validation on its own never
    does — the same string is safe in one sink and fatal in the next.
  ru: >
    XSS — это то, что происходит, когда значение, напечатанное посторонним,
    попадает в страницу как код, а не как данные: браузер не отличает символы
    злоумышленника от символов шаблона, поэтому подчиняется им, и полученный
    скрипт выполняется на вашем origin с сессией вашего пользователя. Бывает
    трёх видов — отражённый (возвращается из запроса), хранимый (сохранён один
    раз, отдаётся каждому читателю) и DOM-based (записывается собственным
    JavaScript страницы, и сервер его вообще не видит). Чинится экранированием
    вывода, выбранным по месту вывода, потому что одна и та же нагрузка между
    тегами безобидна, а внутри блока script или в ссылке 'javascript:'
    исполняется; там, где значение обязано остаться HTML, вместо экранирования
    берут санитайзер с белым списком. Content-Security-Policy и куки 'HttpOnly'
    уменьшают ущерб, но не чинят ошибку, а одна лишь валидация ввода не чинит
    её никогда — одна и та же строка безопасна в одном месте вывода и
    смертельна в соседнем.

# Visual primitives this topic's visualizer composes (frontend).
primitives:
  - BoxGroup

defaultExample: what-xss-is

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: what-xss-is
    title:
      en: 'Data that turns into code'
      ru: 'Данные, которые становятся кодом'
    file: 01-what-xss-is.java
    explanation:
      en: >
        The whole vulnerability in one page. The template does not change, the
        endpoint does not change, the code path does not change — only the
        characters do, and one of the two inputs contains characters the HTML
        parser treats as structure. From that point on the attacker's script is
        part of your page, with your origin and your user's cookies.
      ru: >
        Вся уязвимость на одной странице. Шаблон не меняется, эндпоинт не
        меняется, путь исполнения не меняется — меняются только символы, и в
        одном из двух вводов есть символы, которые HTML-парсер считает
        структурой. С этого момента скрипт злоумышленника — часть вашей
        страницы, с вашим origin и куками вашего пользователя.
  - id: encoding-fixes-it
    title:
      en: 'The fix is on the way out'
      ru: 'Чинится на выводе'
    file: 02-encoding-fixes-it.java
    explanation:
      en: >
        Encoding does not remove anything and does not validate anything: it
        replaces the characters that would have meant something to the parser
        with characters that only mean themselves. The user sees exactly what
        they typed, and the browser builds a text node. Note the second payload
        — no script tag at all, because an event handler on any element runs
        just as well.
      ru: >
        Экранирование ничего не удаляет и ничего не проверяет: оно заменяет
        символы, которые что-то значили бы для парсера, символами, которые
        значат только самих себя. Пользователь видит ровно то, что напечатал, а
        браузер строит текстовый узел. Обратите внимание на вторую нагрузку —
        тега script в ней нет вовсе, потому что обработчик события на любом
        элементе выполняется ничуть не хуже.
  - id: stored-xss
    title:
      en: 'Stored: one submission, many victims'
      ru: 'Хранимый: одна отправка, много жертв'
    file: 03-stored-xss.java
    explanation:
      en: >
        The expensive kind. The attacker posts once and leaves; the site then
        serves the payload to every reader, with no link to click and nothing
        suspicious to notice. Look at where the bug is: saving the string was
        harmless, and the same stored value is dangerous only at the moment it
        is printed into a page.
      ru: >
        Самый дорогой вид. Злоумышленник отправляет один раз и уходит; дальше
        сайт сам отдаёт нагрузку каждому читателю — ни ссылки, по которой надо
        кликнуть, ни чего-либо подозрительного. Посмотрите, где именно ошибка:
        сохранение строки было безобидным, и то же самое сохранённое значение
        опасно только в момент печати в страницу.
  - id: dom-xss
    title:
      en: 'DOM-based: the server never sees it'
      ru: 'DOM-based: сервер его не видит'
    file: 04-dom-xss.java
    explanation:
      en: >
        Server-side encoding is on and correct, and the page is still
        vulnerable, because this payload never reaches the server: the fragment
        after '#' is not sent. Nothing appears in the access log, nothing goes
        through the template, and the fix has to live in the browser code —
        assign to textContent instead of innerHTML.
      ru: >
        Серверное экранирование включено и работает правильно, а страница всё
        равно уязвима, потому что эта нагрузка до сервера не доходит: фрагмент
        после «#» не отправляется. В логе доступа ничего нет, через шаблон
        ничего не проходит, и чинить приходится в коде браузера — присваивать в
        textContent вместо innerHTML.
  - id: context-matters
    title:
      en: 'Why "we escape input" is not enough'
      ru: 'Почему «мы экранируем ввод» — мало'
    file: 05-context-matters.java
    explanation:
      en: >
        One escaper, four sinks. Replacing the four HTML characters is right
        between tags and right in a quoted attribute — and inside a script block
        the metacharacter is the single quote, while in a link the danger is the
        scheme and there is nothing to escape at all. Escaping is one operation
        per context, not one operation.
      ru: >
        Одно экранирование, четыре места вывода. Замена четырёх HTML-символов
        верна между тегами и верна в атрибуте в кавычках — а внутри блока script
        значащий символ это одинарная кавычка, в ссылке же опасна схема, и
        экранировать там вообще нечего. Экранирование — это по одной операции на
        каждый контекст, а не одна операция.
  - id: sanitizing-rich-text
    title:
      en: 'When the value must stay HTML'
      ru: 'Когда значение обязано остаться HTML'
    file: 06-sanitizing-rich-text.java
    explanation:
      en: >
        Encoding a formatted review would show the tags instead of applying
        them, so this is the one case where you sanitize: parse the HTML, keep
        the few tags and attributes on the allowlist, drop the rest. It must be
        an allowlist — and note that dropping dangerous tags is not enough,
        because the dangerous part of the second value is an attribute.
      ru: >
        Экранирование форматированного отзыва показало бы теги вместо того,
        чтобы их применить, — это единственный случай, когда нужен санитайзер:
        разобрать HTML, оставить те немногие теги и атрибуты, что в белом
        списке, остальное выбросить. Список должен быть именно белым — и учтите,
        что выбрасывать опасные теги мало, потому что опасная часть второго
        значения это атрибут.
  - id: csp-safety-net
    title:
      en: 'CSP: a net, not a fix'
      ru: 'CSP: страховка, а не починка'
    file: 07-csp-safety-net.java
    explanation:
      en: >
        A Content-Security-Policy does not stop the injection — the document is
        still wrong — it stops the injected script from running, which is
        exactly what you want from a second line of defence. The second half
        shows how that line is usually erased: 'unsafe-inline' permits precisely
        the kind of script an injection produces.
      ru: >
        Content-Security-Policy не предотвращает внедрение — документ всё равно
        неправильный, — она не даёт внедрённому скрипту выполниться, а это ровно
        то, что нужно от второй линии обороны. Вторая половина показывает, как
        эту линию обычно стирают: 'unsafe-inline' разрешает как раз тот вид
        скриптов, который и получается при внедрении.
  - id: httponly-is-not-a-fix
    title:
      en: 'HttpOnly limits damage, not risk'
      ru: 'HttpOnly уменьшает ущерб, а не риск'
    file: 08-httponly-is-not-a-fix.java
    explanation:
      en: >
        The cookie stays out of document.cookie, and the vulnerability is
        untouched: the script still runs on your origin, and the browser still
        attaches the session cookie to every request that script makes. It never
        needed to read the cookie to act as the user — which is why "our cookies
        are HttpOnly" is not an answer to an XSS report.
      ru: >
        Кука недоступна через document.cookie, а уязвимость не тронута: скрипт
        по-прежнему выполняется на вашем origin, и браузер по-прежнему
        прикрепляет куку сессии к каждому его запросу. Чтобы действовать от
        имени пользователя, читать куку и не требовалось, — поэтому «у нас куки
        HttpOnly» не является ответом на отчёт об XSS.

