bossFight:
- id: task-statement
  ru: Оцените время на тестирование лендинга. Что вам для этого нужно и как будете оценивать?
- id: required-inputs
  ru: Какие артефакты вы запросите перед оценкой (ТЗ, макет, прототип) и почему оценка без них — красный флаг?
- id: clarifying-questions
  ru: Какие уточняющие вопросы нужно задать до того, как называть сроки, и почему эти вопросы — часть правильного ответа?
- id: functional-scope
  ru: 'Что входит в функциональное тестирование лендинга: перечислите проверки полей ввода, чек-боксов, подписок, email, тултипов, хинтов, кнопок, линков и футера.'
- id: cross-browser-scope
  ru: Как кроссбраузерное и кроссплатформенное тестирование влияет на оценку и что нужно уточнить, прежде чем закладывать на него время?
- id: uiux-and-greybox
  ru: Как тестируется UI/UX лендинга сверкой с макетом в DevTools и что проверяется grey box-методом в админке или базе данных?
- id: smoke-flow
  ru: Зачем в оценку включают полный флоу регистрации как smoke и что он покрывает сверх функциональных кейсов?
- id: estimation-formula
  ru: 'Сформулируйте формулу эстимации по тест-кейсам: откуда берутся количество кейсов, время на кейс, зачем +20% и время на регрессию?'
- id: weak-answers
  ru: Какие ответы на вопрос «оцените время» интервьюер считает слабыми и чем отличается ответ, показывающий методику?
