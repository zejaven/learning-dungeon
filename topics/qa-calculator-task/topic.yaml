title: 'Задача: протестируй калькулятор'
category: Задачи с собеседований
type: THEORY
mode: theory
aiProvider: kimi
categoryId: qa-practice
difficulty: 1
summary: >
  Эталонная задача на системность: калькулятор, который только складывает,
  целые числа от -99 до +99, кликабельная кнопка «равно» и поле вывода.
  Уточняющие вопросы, структура проверок (позитив -> границы и классы
  эквивалентности -> негатив -> отдельно кнопка и поле вывода ->
  кроссплатформенность), разбор критериев «хорошо/плохо» и неочевидные детали:
  3 символа на ввод против 4 на вывод, единственная проверка в прод 4+5=9,
  почему X+0 и «дробь+дробь» — плохие проверки.

assistantExample:
  'например: Если бы перед релизом калькулятора можно было сделать только одну проверку, какую бы вы выбрали и почему?'

missionsFile: quiz.yaml
