id: employee-api-commands
languages: [en, ru]
title:
  en: 'Employee API: Commands'
  ru: 'API сотрудника: Команды'
category:
  en: REST / API Design
  ru: REST / Проектирование API
type: REST
# Challenge topic: implement methods, run them against hidden test cases.
mode: challenge
aiProvider: claude
categoryId: rest
difficulty: 2
summary:
  en: >
    Implement the in-memory logic behind the employee API as separate commands:
    addEmployee, changeSalary, changePassport and getCard. The point the hidden
    tests enforce is independence — changing the salary must leave the passport
    untouched and vice versa, ids must be distinct, and an unknown id must fail.
    No Spring, no HTTP: just the command logic. Pairs with the theory and the
    structural design topic.
  ru: >
    Реализуй in-memory логику за API сотрудника как отдельные команды:
    addEmployee, changeSalary, changePassport и getCard. Скрытые тесты проверяют
    независимость — изменение зарплаты не должно трогать паспорт и наоборот, id
    должны быть разными, а неизвестный id обязан падать. Без Spring и HTTP —
    только логика команд. В паре с теорией и structural-темой дизайна.

assistantExample:
  en: 'e.g. How do I make changeSalary update only the salary without disturbing the passport?'
  ru: 'например: Как сделать, чтобы changeSalary менял только зарплату, не трогая паспорт?'

missionsFile: quiz.yaml
