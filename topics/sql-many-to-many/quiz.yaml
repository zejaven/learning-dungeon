# SQL missions: the result of the user's query is compared to each mission's
# reference `expectedSql` (run against the same seed). Order-insensitive by
# default; columns are matched by position, so produce them in the stated order.
missions:
  - id: count-per-course
    type: sql
    title:
      en: Count enrolments per course
      ru: Посчитай записи по курсам
    goal:
      en: Show each course name and its number of enrolled employees (name, count).
      ru: Покажи название курса и число записанных сотрудников (name, count).
    requires:
      - kind: sqlResult
        expectedSql: >
          SELECT c.name, COUNT(*) FROM courses c
          JOIN enrollments e ON e.course_id = c.id
          GROUP BY c.name
  - id: courses-over-10
    type: sql
    title:
      en: Courses with more than 10
      ru: Курсы с более чем 10
    goal:
      en: Return the id and name of courses with more than 10 enrolled employees (id, name).
      ru: Верни id и название курсов, на которые записано более 10 сотрудников (id, name).
    requires:
      - kind: sqlResult
        expectedSql: >
          SELECT c.id, c.name FROM courses c
          JOIN enrollments e ON e.course_id = c.id
          GROUP BY c.id, c.name HAVING COUNT(*) > 10

bossFight:
  - id: many-to-many-modeling
    en: How do you model a many-to-many relationship in a relational database?
    ru: Как смоделировать связь many-to-many в реляционной базе данных?
  - id: where-vs-having
    en: What is the difference between WHERE and HAVING?
    ru: В чём разница между WHERE и HAVING?
  - id: group-by
    en: What does GROUP BY do, and what can you put in the SELECT alongside it?
    ru: Что делает GROUP BY и что можно класть в SELECT вместе с ним?
  - id: count-semantics
    en: What is the difference between COUNT(*) and COUNT(column)?
    ru: В чём разница между COUNT(*) и COUNT(column)?
