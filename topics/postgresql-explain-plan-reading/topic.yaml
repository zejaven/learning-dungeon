summary:
  en: >
    Learn how to read a PostgreSQL EXPLAIN plan from the leaves upward: what
    Seq Scan and Index Scan mean, how startup and total cost differ from real
    time, how join nodes shape the work, and which plan details are red flags
    when a query is slow.
