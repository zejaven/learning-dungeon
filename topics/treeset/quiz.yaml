missions:
  - id: sorted-add
    title:
      en: 'Insert into sorted order'
      ru: 'Вставь в отсортированный порядок'
    goal:
      en: 'Run code that adds at least one value to the TreeSet and observe the sorted slots.'
      ru: 'Запусти код, который добавляет хотя бы одно значение в TreeSet, и посмотри на отсортированные ячейки.'
    event: TREESET_ADD
  - id: duplicate-by-comparison
    title:
      en: 'Trigger a duplicate'
      ru: 'Вызови дубликат'
    goal:
      en: 'Make add(...) return false because comparison says the value is already present.'
      ru: 'Добейся, чтобы add(...) вернул false, потому что сравнение считает значение уже существующим.'
    event: TREESET_DUPLICATE
  - id: nearest-neighbor
    title:
      en: 'Ask for a neighbor'
      ru: 'Запроси соседний элемент'
    goal:
      en: 'Call lower(), floor(), ceiling(), or higher() so TreeSet returns the nearest sorted value.'
      ru: 'Вызови lower(), floor(), ceiling() или higher(), чтобы TreeSet вернул ближайшее отсортированное значение.'
    event: TREESET_NAVIGATE
  - id: sorted-range
    title:
      en: 'Select a range'
      ru: 'Выбери диапазон'
    goal:
      en: 'Request a bounded range and return values in sorted order.'
      ru: 'Запроси ограниченный диапазон и верни значения в отсортированном порядке.'
    event: TREESET_RANGE
bossFight:
  - id: main-feature
    en: 'What is the main feature of TreeSet compared with HashSet or ArrayList?'
    ru: 'В чём главная особенность TreeSet по сравнению с HashSet или ArrayList?'
  - id: ordering-source
    en: 'How does TreeSet choose the order of elements?'
    ru: 'Как TreeSet выбирает порядок элементов?'
  - id: duplicate-rule
    en: 'Why can TreeSet treat two different objects as duplicates?'
    ru: 'Почему TreeSet может считать два разных объекта дубликатами?'
  - id: complexity
    en: 'What are the usual time complexities of add, remove, and contains in TreeSet?'
    ru: 'Какая обычная сложность add, remove и contains в TreeSet?'
  - id: navigable-set
    en: 'Which NavigableSet operations make TreeSet useful for nearest-value and range queries?'
    ru: 'Какие операции NavigableSet делают TreeSet полезным для поиска ближайших значений и диапазонов?'
  - id: traps
    en: 'What are the common TreeSet traps with null, mutable elements, and inconsistent comparators?'
    ru: 'Какие частые ловушки TreeSet связаны с null, изменяемыми элементами и несогласованными Comparator?'
