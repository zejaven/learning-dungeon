bossFight:
  - id: positive-testing-definition
    en: 'What is positive testing, and why is it also called the "pass test"?'
    ru: 'Что такое позитивное тестирование и почему его ещё называют «тестом на прохождение»?'
  - id: negative-testing-definition
    en: 'What is negative testing, and what exactly do we analyse when checking how the system reacts to errors and incorrect requests?'
    ru: 'Что такое негативное тестирование и что именно мы анализируем, проверяя реакцию системы на ошибки и некорректные запросы?'
  - id: classification-basis
    en: 'Positive and negative testing belong to which classification of test types? Name other classifications you know (by level, by knowledge of the system, and so on).'
    ru: 'К какой классификации видов тестирования относятся позитивное и негативное? Назовите другие классификации, которые вы знаете (по уровню, по знанию системы и т.д.).'
  - id: input-field-pair-example
    en: 'Take a single input field, for example "Age" with an allowed range of 18–65. Give an example of a pair of positive and negative checks for it.'
    ru: 'Возьмите одно поле ввода, например «Возраст» с допустимым диапазоном 18–65. Приведите пример пары позитивной и негативной проверок для него.'
  - id: negative-test-success-criteria
    en: 'What counts as a passed negative test — that the system did not crash, or something else? What should the system do on invalid input?'
    ru: 'Что считается успешно пройденным негативным тестом — то, что система не упала, или что-то ещё? Как система должна отреагировать на невалидный ввод?'
  - id: positive-vs-negative-ratio
    en: 'Why is positive testing alone not enough? Which checks — positive or negative — should there be more of in a test suite, and why?'
    ru: 'Почему одного позитивного тестирования недостаточно? Каких проверок в наборе тестов должно быть больше — позитивных или негативных — и почему?'
  - id: negative-vs-security-testing
    en: 'Is negative testing the same thing as security testing? Where does an SQL injection fit into this picture?'
    ru: 'Негативное тестирование — это то же самое, что тестирование безопасности? Куда в эту картину вписывается SQL-инъекция?'
  - id: registration-form-negative-cases
    en: 'List several negative scenarios for a registration form (email, password, required fields). Which of them would you automate first?'
    ru: 'Перечислите несколько негативных сценариев для формы регистрации (email, пароль, обязательные поля). Какие из них вы автоматизировали бы в первую очередь?'
