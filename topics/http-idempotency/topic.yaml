# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: definition
    title:
      en: What the word means
      ru: Что означает слово
    file: 01-what-idempotency-means.java
    explanation:
      en: >
        The definition, measured instead of asserted. A read changes nothing, and
        the same PUT sent three times lands on the same representation three
        times — the server did work each time, and the state after N calls is the
        state after one.
      ru: >
        Определение, которое проверяется, а не декларируется. Чтение ничего не
        меняет, а один и тот же PUT, отправленный трижды, трижды приводит к тому
        же представлению: сервер каждый раз работал, но состояние после N вызовов
        равно состоянию после одного.
  - id: retry-after-timeout
    title:
      en: The timeout that started it all
      ru: Таймаут, с которого всё начинается
    file: 02-retry-after-timeout.java
    explanation:
      en: >
        Why the property exists. The server applies the request and the answer is
        lost on the way back, so the client cannot tell "it never arrived" from
        "the reply vanished". Idempotency is what turns that ambiguity into a
        boring retry.
      ru: >
        Зачем это свойство нужно. Сервер применяет запрос, а ответ теряется по
        пути обратно, и клиент не может отличить «не дошло» от «ответ пропал».
        Идемпотентность превращает эту неоднозначность в скучный повтор.
  - id: post-duplicates
    title:
      en: 'The same retry with POST'
      ru: 'Тот же повтор, но с POST'
    file: 03-post-is-not-idempotent.java
    explanation:
      en: >
        Identical bytes on the wire, identical timeout, identical retry — and a
        second, independent order. POST asks a collection to create something
        new, so the second call has no way of meaning the same thing as the
        first.
      ru: >
        Те же байты в проводе, тот же таймаут, тот же повтор — и второй,
        независимый заказ. POST просит коллекцию создать что-то новое, поэтому
        второй вызов никак не может означать то же самое, что первый.
  - id: delete-and-reads
    title:
      en: 'DELETE twice, and safe methods'
      ru: 'DELETE дважды и безопасные методы'
    file: 04-delete-and-safe-methods.java
    explanation:
      en: >
        Safe methods are idempotent for free — doing nothing N times is doing
        nothing. And the retried DELETE answers 404 where the first answered 204,
        which is the clearest proof that idempotency is a statement about state,
        not about the response.
      ru: >
        Безопасные методы идемпотентны даром: ничего не сделать N раз — это
        ничего не сделать. А повторный DELETE отвечает 404 там, где первый
        ответил 204: нагляднее всего видно, что идемпотентность — утверждение о
        состоянии, а не об ответе.
  - id: patch-either-way
    title:
      en: 'PATCH: it depends on the body'
      ru: 'PATCH: зависит от тела'
    file: 05-patch-goes-either-way.java
    explanation:
      en: >
        One method, two behaviours. A merge patch of absolute values repeats
        harmlessly; the same PATCH carrying "add 1 to qty" adds twice. That is
        why the spec says "not guaranteed" instead of picking a side.
      ru: >
        Один метод — два поведения. Merge patch с абсолютными значениями
        повторяется безболезненно; тот же PATCH с «прибавь 1 к qty» прибавит
        дважды. Поэтому спецификация говорит «не гарантируется», а не выбирает
        сторону.
  - id: idempotency-key
    title:
      en: Making POST retry-safe
      ru: Как сделать POST безопасным для повтора
    file: 06-idempotency-key.java
    explanation:
      en: >
        The client names its intent before sending it and repeats that name on
        every retry. The server stores the key with the response it produced and
        replays it, so the repeat costs nothing — and a genuinely new order
        carries a new key even when the body is identical.
      ru: >
        Клиент даёт имя своему намерению до отправки и повторяет это имя при
        каждом ретрае. Сервер хранит ключ вместе с выданным ответом и повторяет
        его, поэтому дубль ничего не стоит, — а по-настоящему новый заказ несёт
        новый ключ даже при том же теле.
  - id: handler-side-effects
    title:
      en: 'The handler that broke the promise (trap)'
      ru: 'Обработчик, нарушивший обещание (ловушка)'
    file: 07-handler-breaks-the-promise.java
    explanation:
      en: >
        PUT is idempotent by the spec, and the stored representation is identical
        after the retry — yet the customer got two "your order has shipped"
        mails. The verb only tells intermediaries what they may assume; keeping
        the promise is the handler's job.
      ru: >
        PUT идемпотентен по спецификации, и после повтора хранимое представление
        то же самое, — но клиенту пришло два письма «ваш заказ отправлен». Метод
        лишь сообщает посредникам, на что они вправе рассчитывать; соблюдать
        обещание — работа обработчика.

