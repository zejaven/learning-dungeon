# Missions complete when a run emits the matching trace event.
missions:
  - id: create-empty-naive-list
    title:
      en: Create the empty list
      ru: Создай пустой список
    goal:
      en: Run an example that starts with a naive list backed by an empty array.
      ru: Запусти пример, который начинается с наивного списка на пустом массиве.
    event: NAIVE_ARRAYLIST_CREATED
  - id: allocate-and-copy
    title:
      en: Allocate and copy
      ru: Выдели и скопируй
    goal:
      en: Append a value and observe a new backing array plus copies of all existing references.
      ru: Добавь значение и посмотри новый внутренний массив вместе с копированием всех существующих ссылок.
    event: NAIVE_ARRAYLIST_GROW
  - id: write-new-value
    title:
      en: Write the new value
      ru: Запиши новое значение
    goal:
      en: Reach the step where the new value is written into the new last slot.
      ru: Дойди до шага, где новое значение записывается в новую последнюю ячейку.
    event: NAIVE_ARRAYLIST_ADD
  - id: report-quadratic-total
    title:
      en: Report O(N^2) total
      ru: Покажи общий итог O(N^2)
    goal:
      en: Call reportTotalWork() and see that adding N elements copies N * (N - 1) / 2 references.
      ru: Вызови reportTotalWork() и увидь, что добавление N элементов копирует N * (N - 1) / 2 ссылок.
    event: NAIVE_ARRAYLIST_TOTAL

bossFight:
  - id: n-adds-complexity
    en: If a list reallocates to size + 1 and copies all old elements on every add, what is the complexity of adding N elements?
    ru: Если список при каждом add выделяет массив size + 1 и копирует все старые элементы, какая сложность добавления N элементов?
  - id: triangular-sum
    en: Why does the total copy count become 0 + 1 + 2 + ... + (N - 1)?
    ru: Почему общее число копирований становится 0 + 1 + 2 + ... + (N - 1)?
  - id: single-add-vs-batch
    en: What is the difference between the cost of one late append and the cost of a batch of N appends in this naive design?
    ru: В чём разница между ценой одного позднего добавления и ценой пачки из N добавлений в таком наивном дизайне?
  - id: real-arraylist-difference
    en: How does the real ArrayList avoid this O(N^2) append behavior?
    ru: Как реальный ArrayList избегает такого O(N^2) поведения при добавлении в конец?
  - id: references-not-objects
    en: During array growth, are the stored objects cloned, or are references copied?
    ru: При росте массива клонируются ли хранимые объекты или копируются ссылки?
