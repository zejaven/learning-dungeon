id: spring-transactional-event-listener
title:
  en: '@TransactionalEventListener after Commit and Rollback'
  ru: '@TransactionalEventListener после commit и rollback'
category:
  en: Spring / Transactions
  ru: Spring / Транзакции
type: TRANSACTION
mode: trace
aiProvider: codex
aiModel: gpt-5.5
categoryId: spring
difficulty: 3
catalogId: spring-11
style: Real world
summary:
  en: >
    How @TransactionalEventListener defers side effects until a transaction
    phase: AFTER_COMMIT by default, AFTER_ROLLBACK for compensation,
    BEFORE_COMMIT for pre-commit checks, AFTER_COMPLETION for cleanup, and
    fallbackExecution when no transaction exists.
  ru: >
    Как @TransactionalEventListener откладывает побочные действия до фазы
    транзакции: AFTER_COMMIT по умолчанию, AFTER_ROLLBACK для компенсации,
    BEFORE_COMMIT для проверок перед commit, AFTER_COMPLETION для очистки и
    fallbackExecution, когда транзакции нет.

primitives:
  - ArrayGrid
  - EventLog

defaultExample: after-commit

examples:
  - id: after-commit
    title:
      en: Run after commit
      ru: Запуск после commit
    file: 01-after-commit.java
    explanation:
      en: >
        Publish a domain event inside a transaction and let the default
        AFTER_COMMIT listener send the receipt only after the row is committed.
      ru: >
        Опубликуй domain event внутри транзакции и дай listener с фазой
        AFTER_COMMIT по умолчанию отправить чек только после commit строки.
  - id: after-rollback
    title:
      en: Run after rollback
      ru: Запуск после rollback
    file: 02-after-rollback.java
    explanation:
      en: >
        A rollback skips AFTER_COMMIT listeners and invokes AFTER_ROLLBACK
        listeners for compensation or audit.
      ru: >
        Rollback пропускает listeners AFTER_COMMIT и вызывает listeners
        AFTER_ROLLBACK для компенсации или аудита.
  - id: before-commit-veto
    title:
      en: BEFORE_COMMIT can veto
      ru: BEFORE_COMMIT может остановить commit
    file: 03-before-commit-veto.java
    explanation:
      en: >
        A BEFORE_COMMIT listener still runs before the final decision; if it
        throws, the transaction rolls back.
      ru: >
        Listener BEFORE_COMMIT выполняется до финального решения; если он
        бросает exception, транзакция откатывается.
  - id: after-completion
    title:
      en: Cleanup after completion
      ru: Очистка после завершения
    file: 04-after-completion.java
    explanation:
      en: >
        AFTER_COMPLETION runs after either commit or rollback, so it is useful
        for cleanup that must happen for both outcomes.
      ru: >
        AFTER_COMPLETION выполняется после commit или rollback, поэтому подходит
        для очистки, нужной при любом исходе.
  - id: fallback
    title:
      en: No transaction fallback
      ru: Fallback без транзакции
    file: 05-fallback.java
    explanation:
      en: >
        Without an active transaction, @TransactionalEventListener is skipped
        unless fallbackExecution is enabled; fallback runs immediately.
      ru: >
        Без активной транзакции @TransactionalEventListener пропускается, если
        не включён fallbackExecution; fallback выполняется сразу.
  - id: after-commit-failure
    title:
      en: Failure after commit
      ru: Ошибка после commit
    file: 06-after-commit-failure.java
    explanation:
      en: >
        If an AFTER_COMMIT listener fails, the database commit has already
        happened and the original transaction cannot be rolled back.
      ru: >
        Если listener AFTER_COMMIT падает, commit в базе уже произошёл и
        исходную транзакцию больше нельзя откатить.

assistantExample:
  en: 'e.g. How do I send an email only after a @Transactional method commits?'
  ru: 'например: Как отправить email только после commit в @Transactional методе?'

missionsFile: quiz.yaml
