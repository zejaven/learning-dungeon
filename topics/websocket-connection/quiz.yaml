# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: send-the-upgrade-request
    title:
      en: Ask an HTTP endpoint for a socket
      ru: Попроси у HTTP-эндпоинта сокет
    goal:
      en: Open a connection and read the request line by line — find the three headers that turn a GET into an upgrade request.
      ru: Открой соединение и прочитай запрос строка за строкой — найди три заголовка, которые превращают GET в запрос на апгрейд.
    event: HANDSHAKE_REQUEST
  - id: get-the-101
    title:
      en: 'Earn a 101'
      ru: 'Получи 101'
    goal:
      en: Find the step where the server answers 101 and check that Sec-WebSocket-Accept is derived from the key you sent.
      ru: Найди шаг, на котором сервер отвечает 101, и проверь, что Sec-WebSocket-Accept выведен из отправленного тобой ключа.
    event: HANDSHAKE_ACCEPTED
  - id: refuse-a-foreign-origin
    title:
      en: Refuse a handshake
      ru: Откажи в рукопожатии
    goal:
      en: Connect from an origin the server does not allow and see it answered with an ordinary HTTP status code.
      ru: Подключись с источника, который сервер не разрешает, и увидь ответ обычным HTTP-кодом состояния.
    event: HANDSHAKE_REJECTED
  - id: watch-the-container-build-one
    title:
      en: Watch an endpoint object appear
      ru: Увидь, как появляется объект эндпоинта
    goal:
      en: Open a connection to a @ServerEndpoint POJO and find the step where the container instantiates the class.
      ru: Открой соединение к POJO с @ServerEndpoint и найди шаг, на котором контейнер создаёт экземпляр класса.
    event: ENDPOINT_INSTANTIATED
  - id: let-the-server-speak-first
    title:
      en: Let the server speak first
      ru: Дай серверу заговорить первым
    goal:
      en: Make the server write a frame nobody requested — the thing plain HTTP cannot do however you arrange the requests.
      ru: Заставь сервер записать фрейм, которого никто не просил, — то, чего обычный HTTP не умеет, как ни расставляй запросы.
    event: FRAME_FROM_SERVER
  - id: count-the-bytes-of-a-message
    title:
      en: Count what a message costs
      ru: Посчитай, во что обходится сообщение
    goal:
      en: Send a short text frame and read its size on the wire — a header, a masking key and the payload, and nothing else.
      ru: 'Отправь короткий текстовый фрейм и прочитай его размер на проводе: заголовок, ключ маски и полезная нагрузка — и больше ничего.'
    event: FRAME_FROM_CLIENT
  - id: name-the-transport
    title:
      en: Name the transport
      ru: Назови транспорт
    goal:
      en: Find the step that states what the frames travel on, and what you inherit from it besides ordering.
      ru: Найди шаг, где сказано, по чему едут фреймы и что, кроме порядка, ты вместе с этим наследуешь.
    event: TRANSPORT_EXPLAINED
  - id: keep-a-quiet-socket-alive
    title:
      en: Keep a quiet socket alive
      ru: Удержи тихий сокет живым
    goal:
      en: Send a heartbeat and work out which two different problems make it mandatory rather than decorative.
      ru: Отправь heartbeat и разберись, какие две разные проблемы делают его обязательным, а не декоративным.
    event: PING_PONG
  - id: serve-two-with-one-object
    title:
      en: Serve two connections with one object
      ru: Обслужи два соединения одним объектом
    goal:
      en: Open a second connection to a shared handler and find the step where no new object is created at all.
      ru: Открой второе соединение к общему обработчику и найди шаг, на котором не создаётся вообще никакого объекта.
    event: ENDPOINT_SHARED
  - id: overwrite-someone-elses-state
    title:
      en: Overwrite another connection's state
      ru: Перезапиши состояние другого соединения
    goal:
      en: Store a user in a field on a shared handler from two connections and catch the second write landing on the first one.
      ru: Сохрани пользователя в поле общего обработчика из двух соединений и поймай момент, когда вторая запись попадает в первую.
    event: STATE_CLASHED
  - id: answer-as-the-wrong-user
    title:
      en: Answer as the wrong user
      ru: Ответь от имени не того пользователя
    goal:
      en: Read that field back while handling the first client and see whose value comes out.
      ru: Прочитай это поле, обрабатывая первого клиента, и посмотри, чьё значение вернётся.
    event: STATE_LEAKED
  - id: read-your-own-field
    title:
      en: Read your own field
      ru: Прочитай своё собственное поле
    goal:
      en: Do the same read in the per-connection model and confirm the field is as private as a local variable.
      ru: Сделай то же чтение в модели «объект на соединение» и убедись, что поле приватно, как локальная переменная.
    event: FIELD_READ
  - id: put-the-state-where-it-belongs
    title:
      en: Put the state where it belongs
      ru: Положи состояние туда, где ему место
    goal:
      en: Keep the same per-connection value on the session instead, and check that two connections stop colliding.
      ru: Сохрани то же значение соединения в сессии и убедись, что два соединения перестают сталкиваться.
    event: SESSION_STATE_STORED
  - id: fan-one-message-out
    title:
      en: Fan one message out by hand
      ru: Разошли одно сообщение вручную
    goal:
      en: Send one message to every open socket and notice what the protocol did NOT provide for you.
      ru: Отправь одно сообщение во все открытые сокеты и заметь, чего протокол за тебя НЕ сделал.
    event: BROADCAST
  - id: close-it-properly
    title:
      en: Close it on purpose
      ru: Закрой его намеренно
    goal:
      en: End a connection with a close handshake and find out why closing needs a frame in each direction.
      ru: Заверши соединение закрывающим рукопожатием и выясни, зачем при закрытии нужен фрейм в каждую сторону.
    event: CLOSE_HANDSHAKE
  - id: lose-it-improperly
    title:
      en: 'Lose one to a tunnel (1006)'
      ru: 'Потеряй соединение в тоннеле (1006)'
    goal:
      en: Drop a connection without a close frame and explain why 1006 is the one code that is never on the wire.
      ru: Оборви соединение без закрывающего фрейма и объясни, почему 1006 — единственный код, которого не бывает на проводе.
    event: CONNECTION_DROPPED
  - id: write-into-a-dead-socket
    title:
      en: Write into a socket that is gone
      ru: Запиши в исчезнувший сокет
    goal:
      en: Push a message to a closed connection and see exactly how much of it survives.
      ru: Отправь сообщение в закрытое соединение и увидь, сколько от него останется.
    event: FRAME_LOST
  - id: price-the-three-choices
    title:
      en: Price the three instancing choices
      ru: Оцени три варианта создания эндпоинта
    goal:
      en: Compare the three ways an endpoint can be created and read the last column, which says where state may live.
      ru: Сравни три способа создания эндпоинта и прочитай последнюю колонку, где сказано, где может жить состояние.
    event: INSTANCING_COMPARED
  - id: read-the-audit
    title:
      en: Read the audit
      ru: Прочитай итог
    goal:
      en: Finish a run and compare handshakes, endpoint objects, framed bytes and state collisions for that model.
      ru: Заверши прогон и сравни рукопожатия, объекты эндпоинта, байты в кадрах и коллизии состояния для этой модели.
    event: WEBSOCKET_AUDIT

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: how-a-websocket-starts
    en: How does a WebSocket connection get established? Walk me through it from the browser calling new WebSocket(...) to the first frame.
    ru: Как устанавливается WebSocket-соединение? Проведи меня от вызова new WebSocket(...) в браузере до первого фрейма.
  - id: which-headers-make-an-upgrade
    en: Which headers turn an ordinary GET into a WebSocket handshake, and what does the server put in its reply?
    ru: Какие заголовки превращают обычный GET в рукопожатие WebSocket и что сервер кладёт в свой ответ?
  - id: what-sec-websocket-key-is-for
    en: 'What is Sec-WebSocket-Key for? Is it authentication, and how is Sec-WebSocket-Accept derived from it?'
    ru: 'Зачем нужен Sec-WebSocket-Key? Это аутентификация, и как из него получается Sec-WebSocket-Accept?'
  - id: why-101-not-200
    en: Why is the successful response 101 and not 200, and what changes about the connection the moment it arrives?
    ru: Почему успешный ответ — это 101, а не 200, и что меняется в соединении в момент его получения?
  - id: which-transport
    en: What transport does a WebSocket use — TCP or UDP? What follows from that answer for your application?
    ru: Какой транспорт использует WebSocket — TCP или UDP? Что из этого ответа следует для твоего приложения?
  - id: same-connection-or-new-one
    en: After the upgrade, is the traffic on the same TCP connection as the handshake or on a new one? How many connections does one WebSocket use?
    ru: После апгрейда трафик идёт по тому же TCP-соединению, что и рукопожатие, или по новому? Сколько соединений использует один WebSocket?
  - id: what-bidirectional-means
    en: What exactly does "bidirectional" mean here, and what disappears from the protocol once you are past the handshake?
    ru: Что именно означает здесь «двусторонний» и что исчезает из протокола после рукопожатия?
  - id: frames-vs-requests
    en: What does a WebSocket message cost on the wire compared with an HTTP request carrying the same payload, and why?
    ru: Во что обходится сообщение WebSocket на проводе по сравнению с HTTP-запросом с той же полезной нагрузкой, и почему?
  - id: why-client-frames-are-masked
    en: Why must client-to-server frames be masked while server-to-client frames must not be?
    ru: Почему фреймы от клиента к серверу обязаны маскироваться, а от сервера к клиенту — нет?
  - id: endpoint-per-connection-or-shared
    en: Is a new endpoint instance created for every WebSocket connection, or is one instance shared? Answer for Jakarta WebSocket and for Spring.
    ru: Создаётся ли новый экземпляр эндпоинта на каждое WebSocket-соединение или он один общий? Ответь для Jakarta WebSocket и для Spring.
  - id: field-on-a-handler
    en: A colleague stores the current user in a field of a Spring WebSocketHandler. What happens, and when does it start happening?
    ru: Коллега хранит текущего пользователя в поле Spring WebSocketHandler. Что произойдёт и когда это начнёт происходить?
  - id: where-per-connection-state-lives
    en: Where should per-connection state live so that the code is correct regardless of how the endpoint is instantiated?
    ru: Где должно жить состояние соединения, чтобы код был корректен независимо от того, как создаётся эндпоинт?
  - id: injection-into-an-endpoint
    en: Why does @Autowired often come back null in a @ServerEndpoint class, and how do you fix it?
    ru: Почему в классе с @ServerEndpoint поля с @Autowired часто оказываются null и как это чинится?
  - id: concurrency-on-an-endpoint
    en: Which parts of a WebSocket endpoint can be entered by several threads at once, and what must be thread-safe as a result?
    ru: В какие части WebSocket-эндпоинта могут одновременно зайти несколько потоков и что в результате обязано быть потокобезопасным?
  - id: concurrent-sends-on-one-session
    en: Two threads call session.sendText(...) on the same session at the same time. What happens, and how do you prevent it?
    ru: Два потока одновременно вызывают session.sendText(...) на одной сессии. Что произойдёт и как это предотвратить?
  - id: broadcasting-to-everyone
    en: How do you send one message to all connected clients? What do you have to keep, and where does it break with two instances?
    ru: Как отправить одно сообщение всем подключённым клиентам? Что для этого приходится хранить и где это ломается на двух экземплярах?
  - id: authentication-on-a-socket
    en: How do you authenticate a WebSocket connection, given that a browser cannot set headers on it and there are no per-message status codes?
    ru: Как аутентифицировать WebSocket-соединение, если браузер не может задать ему заголовки, а кодов состояния на каждое сообщение нет?
  - id: origin-and-cors
    en: Does CORS protect a WebSocket endpoint? What is cross-site WebSocket hijacking and how do you stop it?
    ru: Защищает ли CORS WebSocket-эндпоинт? Что такое cross-site WebSocket hijacking и как его предотвратить?
  - id: closing-and-1006
    en: What does a clean close look like, and what does close code 1006 tell you that 1000 does not?
    ru: Как выглядит штатное закрытие и что код 1006 говорит такого, чего не говорит 1000?
  - id: heartbeats-and-idle-timeouts
    en: Your sockets die after about a minute of silence in production but never locally. What is happening and what do you do?
    ru: В продакшене твои сокеты умирают примерно через минуту тишины, а локально — никогда. Что происходит и что делать?
  - id: scaling-across-instances
    en: You add a second instance behind a load balancer and half the notifications stop arriving. Why, and what do you change?
    ru: Ты добавляешь второй экземпляр за балансировщиком, и половина уведомлений перестаёт приходить. Почему и что нужно изменить?
  - id: reliability-of-frames
    en: A message was written into an open socket and the client never saw it. How is that possible, and what do you build to make delivery reliable?
    ru: Сообщение записали в открытый сокет, а клиент его не увидел. Как это возможно и что нужно построить, чтобы доставка была надёжной?
  - id: websocket-vs-sse
    en: When would you choose SSE over a WebSocket, and what do you give up either way?
    ru: Когда выбрать SSE вместо WebSocket и чем придётся пожертвовать в каждом случае?
  - id: cost-per-connection
    en: What does one idle WebSocket connection cost a server, and how many can one node realistically hold?
    ru: Во что обходится серверу одно простаивающее WebSocket-соединение и сколько их реально может держать один узел?
  - id: proxies-and-gateways
    en: What has to be configured on the reverse proxy, load balancer or API gateway for WebSockets to work through them?
    ru: Что нужно настроить на обратном прокси, балансировщике или API-шлюзе, чтобы WebSocket через них работал?
