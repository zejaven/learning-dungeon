# Theory topic: no missions (there is no practice editor) - only a Boss Fight.
bossFight:
  - id: clarify-domain
    en: 'What clarifying questions would you ask before designing tables for requests, products and services?'
    ru: 'Какие уточняющие вопросы ты задашь перед проектированием таблиц для заявок, продуктов и сервисов?'
  - id: core-tables
    en: 'What core tables would you create for this system, and what belongs in each one?'
    ru: 'Какие основные таблицы ты создашь для такой системы и что будет храниться в каждой?'
  - id: cardinalities
    en: 'How would you model a request that can contain many products and many services?'
    ru: 'Как смоделировать заявку, которая может содержать много продуктов и много сервисов?'
  - id: avoid-nullable-foreign-keys
    en: 'Why is a request table with nullable product_id and service_id usually a weak design?'
    ru: 'Почему таблица заявок с nullable product_id и service_id обычно является слабым дизайном?'
  - id: constraints-and-indexes
    en: 'Which constraints and indexes would you add first for this schema?'
    ru: 'Какие ограничения и индексы ты добавишь в первую очередь для такой схемы?'
  - id: history-and-snapshots
    en: 'How would you preserve old request history when a product name, price or service definition changes?'
    ru: 'Как сохранить историю старых заявок, если название продукта, цена или описание сервиса изменились?'
  - id: transaction-boundaries
    en: 'Which operations should be done in one transaction when creating or updating a request?'
    ru: 'Какие операции нужно выполнять в одной транзакции при создании или обновлении заявки?'
