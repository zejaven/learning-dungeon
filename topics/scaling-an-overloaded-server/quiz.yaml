# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: watch-the-surplus-accumulate
    title:
      en: Find where the surplus goes
      ru: Найди, куда девается излишек
    goal:
      en: Send more requests per tick than the server can serve and find the step where a queue starts forming.
      ru: Отправь в тик больше запросов, чем сервер способен обслужить, и найди шаг, на котором начинает расти очередь.
    event: QUEUE_GROWING
  - id: latency-that-is-not-slow-code
    title:
      en: Prove the code did not get slower
      ru: Докажи, что код не стал медленнее
    goal:
      en: Keep the overload going until average latency is several times the service time, and read where the extra time is spent.
      ru: Продолжай перегрузку, пока средняя задержка не станет в разы больше времени работы, и прочитай, на что уходит лишнее время.
    event: LATENCY_CLIMBING
  - id: make-the-server-say-no
    title:
      en: Make the server say no
      ru: Заставь сервер сказать «нет»
    goal:
      en: Fill the queue completely and see what a bounded queue does with the requests that no longer fit.
      ru: Заполни очередь целиком и посмотри, что ограниченная очередь делает с запросами, которые больше не помещаются.
    event: REQUESTS_REJECTED
  - id: busy-and-useless
    title:
      en: Be 100% busy and 0% useful
      ru: Будь на 100% занят и на 0% полезен
    goal:
      en: Make the queue deeper than the client timeout, and find the requests the server finishes for clients who already left.
      ru: Сделай очередь глубже клиентского таймаута и найди запросы, которые сервер доделывает для уже ушедших клиентов.
    event: WASTED_WORK
  - id: buy-a-bigger-box
    title:
      en: Buy a bigger box
      ru: Купи коробку побольше
    goal:
      en: Scale the single instance up and read how much capacity that bought and what it did not change.
      ru: Отмасштабируй единственный экземпляр вверх и прочитай, сколько мощности это дало и чего не изменило.
    event: SCALED_UP
  - id: lose-the-only-machine
    title:
      en: Lose the only machine
      ru: Потеряй единственную машину
    goal:
      en: Kill the one instance serving the traffic and see what the failure domain of vertical scaling actually is.
      ru: Убей единственный экземпляр, обслуживающий трафик, и увидь, каков на самом деле домен отказа вертикального масштабирования.
    event: OUTAGE
  - id: add-a-replica
    title:
      en: Add a replica instead
      ru: Добавь реплику вместо этого
    goal:
      en: Scale the same overloaded service horizontally and watch capacity change while it keeps serving.
      ru: Отмасштабируй тот же перегруженный сервис горизонтально и посмотри, как мощность меняется прямо во время работы.
    event: NODE_ADDED
  - id: clear-the-backlog
    title:
      en: Clear the backlog
      ru: Разбери накопившееся
    goal:
      en: Get arrivals back under capacity and find the step where the queue reaches zero and latency returns to service time.
      ru: Верни приход ниже мощности и найди шаг, на котором очередь обнуляется, а задержка возвращается ко времени работы.
    event: QUEUE_DRAINED
  - id: balanced-but-not-balanced
    title:
      en: Balance traffic onto an unequal fleet
      ru: Сбалансируй трафик на неравные узлы
    goal:
      en: Slow one replica down under round robin and find the step where it queues while its neighbours have free slots.
      ru: Замедли одну реплику при round robin и найди шаг, где у неё очередь, а у соседей свободные слоты.
    event: HOTSPOT
  - id: route-into-a-hole
    title:
      en: Route requests into a hole
      ru: Отправь запросы в пустоту
    goal:
      en: Kill a replica behind a balancer that has no health checks, and see what fraction of traffic keeps going to it.
      ru: Убей реплику за балансировщиком без health-check'ов и увидь, какая доля трафика продолжает уходить на неё.
    event: BLACKHOLED
  - id: take-the-corpse-out
    title:
      en: Take the corpse out of the rotation
      ru: Выведи труп из ротации
    goal:
      en: Run the same failure with health checks on, and measure how long real users paid for the detection window.
      ru: Повтори тот же отказ с включёнными health-check'ами и измерь, сколько настоящие пользователи платили за окно обнаружения.
    event: NODE_EVICTED
  - id: land-on-the-wrong-replica
    title:
      en: Land on the wrong replica
      ru: Попади не на ту реплику
    goal:
      en: Keep sessions in a replica's heap, send the same client twice, and find the request that sees an empty cart.
      ru: Держи сессии в куче реплики, отправь одного клиента дважды и найди запрос, который видит пустую корзину.
    event: SESSION_MISS
  - id: move-the-bottleneck
    title:
      en: Move the bottleneck instead of removing it
      ru: Перемести узкое место вместо того, чтобы убрать
    goal:
      en: Put one shared database behind the replicas, add another replica, and find the step where extra capacity buys nothing.
      ru: Поставь за репликами одну общую базу, добавь ещё реплику и найди шаг, на котором лишняя мощность не даёт ничего.
    event: BOTTLENECK_SATURATED
  - id: price-every-topology
    title:
      en: Price every topology
      ru: Оцени каждую топологию
    goal:
      en: Run the same traffic through all four topologies and find the column that decides between a bigger box and more boxes.
      ru: Прогони один и тот же трафик через все четыре топологии и найди колонку, которая решает спор между большой коробкой и несколькими.
    event: TOPOLOGIES_COMPARED

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: what-breaks-first
    en: A single server is being overwhelmed by requests. What actually breaks first, and in what order do the symptoms appear?
    ru: Один сервер захлёбывается от запросов. Что ломается первым и в каком порядке появляются симптомы?
  - id: compute-the-capacity
    en: How would you work out how many requests per second one instance of your service can handle? What numbers do you need?
    ru: Как посчитать, сколько запросов в секунду выдерживает один экземпляр вашего сервиса? Какие числа для этого нужны?
  - id: why-latency-explodes
    en: Why does latency rise non-linearly as a server approaches full utilisation, rather than degrading smoothly?
    ru: Почему задержка растёт нелинейно по мере приближения сервера к полной загрузке, а не деградирует плавно?
  - id: queue-or-reject
    en: 'Under overload, is it better to queue requests or to reject them? Defend your answer with what happens to the client.'
    ru: 'При перегрузке лучше ставить запросы в очередь или отвергать их? Обоснуй ответ тем, что происходит у клиента.'
  - id: retry-storms
    en: Clients time out and retry. What does that do to a server that is already overloaded, and how do you stop the spiral?
    ru: Клиенты упираются в таймаут и повторяют запрос. Что это делает с уже перегруженным сервером и как остановить эту спираль?
  - id: vertical-vs-horizontal
    en: Vertical or horizontal scaling — how do you choose? Give the case where vertical is genuinely the better answer.
    ru: Вертикальное или горизонтальное масштабирование — как выбрать? Приведи случай, когда вертикальное действительно лучше.
  - id: what-a-balancer-does
    en: What does a load balancer actually do, and at which layer? What changes for clients once one is in front of your service?
    ru: Что на самом деле делает балансировщик и на каком уровне? Что меняется для клиентов, когда он встаёт перед сервисом?
  - id: balancing-algorithms
    en: Round robin, least connections, weighted, hash-based — when does the choice of algorithm actually matter?
    ru: Round robin, least connections, взвешенный, по хэшу — когда выбор алгоритма действительно начинает играть роль?
  - id: health-checks-design
    en: How should a load balancer decide a replica is unhealthy? What makes a good health check and what makes a dangerous one?
    ru: Как балансировщик должен решать, что реплика нездорова? Что делает health-check хорошим, а что — опасным?
  - id: what-stops-horizontal-scaling
    en: You add a second instance of a service and things start failing intermittently. What kinds of state cause that?
    ru: Ты добавил второй экземпляр сервиса, и начались плавающие ошибки. Какие виды состояния это вызывают?
  - id: sticky-sessions-tradeoff
    en: Are sticky sessions a solution or a workaround? What do you give up by turning them on?
    ru: Sticky-сессии — это решение или обходной путь? Чем приходится жертвовать, включая их?
  - id: sizing-for-node-loss
    en: You run three replicas at 70% utilisation each. One dies. What happens, and how should you have sized the fleet?
    ru: У тебя три реплики, каждая загружена на 70%. Одна умирает. Что произойдёт и как надо было считать размер парка машин?
  - id: bottleneck-moves
    en: You scaled the application tier from three instances to ten and throughput barely improved. How do you find out why?
    ru: Ты увеличил слой приложения с трёх экземпляров до десяти, а пропускная способность почти не выросла. Как выяснить почему?
  - id: scaling-the-database
    en: The database turns out to be the limit. What are your options, and in what order would you try them?
    ru: Ограничением оказалась база данных. Какие есть варианты и в каком порядке ты бы их пробовал?
  - id: load-shedding-and-backpressure
    en: What are load shedding and backpressure, and where in the stack would you implement them?
    ru: Что такое сброс нагрузки (load shedding) и обратное давление (backpressure) и где в стеке ты бы их реализовал?
  - id: autoscaling-signals
    en: What metric would you autoscale on, and why is CPU usually a poor choice on its own?
    ru: По какой метрике ты бы включал автомасштабирование и почему CPU сам по себе обычно плохой выбор?
  - id: balancer-is-a-spof
    en: 'Someone points out that the load balancer is now a single point of failure. Are they right? What do you do about it?'
    ru: 'Кто-то замечает, что балансировщик сам стал единой точкой отказа. Он прав? Что с этим делать?'
  - id: sessions-and-connections
    en: How do long-lived connections — WebSockets, SSE, long polling — complicate load balancing and scaling out?
    ru: Как долгоживущие соединения — WebSocket, SSE, длинный опрос — усложняют балансировку и масштабирование вширь?
  - id: measuring-before-scaling
    en: Before you add a single instance, what would you measure to be sure capacity is the real problem?
    ru: Прежде чем добавить хотя бы один экземпляр, что ты измеришь, чтобы убедиться, что проблема действительно в мощности?
  - id: caching-instead-of-scaling
    en: When is the right answer not to scale at all? Give two changes that remove load rather than adding capacity.
    ru: Когда правильный ответ — вообще не масштабировать? Приведи два изменения, которые убирают нагрузку, а не добавляют мощность.
