missions:
  - id: inspect-stack-budget
    title:
      en: Inspect the stack budget
      ru: Посмотри бюджет стека
    goal:
      en: Run any example and find the simulated thread stack size in bytes.
      ru: Запусти любой пример и найди смоделированный размер стека потока в байтах.
    event: STACK_BUDGET_SCENE
  - id: push-sized-frame
    title:
      en: Push a sized frame
      ru: Добавь кадр с размером
    goal:
      en: Make a recursive call add a frame with its own byte cost.
      ru: Сделай рекурсивный вызов, который добавляет кадр со своей стоимостью в байтах.
    event: STACK_FRAME_PUSH
  - id: overflow-with-fewer-calls
    title:
      en: Overflow with fewer calls
      ru: Переполни меньшим числом вызовов
    goal:
      en: Run the large-frame or smaller-budget example so one more frame no longer fits.
      ru: Запусти пример с крупным кадром или меньшим бюджетом, чтобы очередной кадр уже не поместился.
    event: STACK_FRAME_OVERFLOW
  - id: separate-heap-object
    title:
      en: Keep the big object on heap
      ru: Оставь большой объект в heap
    goal:
      en: Run the array example and see that recursive frames store references, not full heap objects.
      ru: Запусти пример с массивом и увидь, что рекурсивные кадры хранят ссылки, а не полные heap-объекты.
    event: HEAP_OBJECT_ALLOCATED
  - id: reuse-after-return
    title:
      en: Reuse stack space
      ru: Переиспользуй место в стеке
    goal:
      en: Run the iterative example so a helper returns and its frame is removed before the next call.
      ru: Запусти итеративный пример, чтобы helper вернулся и его кадр был удалён перед следующим вызовом.
    event: STACK_FRAME_POP

bossFight:
  - id: fewer-calls-main-reason
    en: How can StackOverflowError happen after fewer recursive calls than usual?
    ru: Как StackOverflowError может случиться после меньшего числа рекурсивных вызовов, чем обычно?
  - id: xss-effect
    en: What does reducing -Xss change, and why does it make overflow appear faster?
    ru: Что меняет уменьшение -Xss и почему переполнение появляется быстрее?
  - id: frame-size-effect
    en: What parts of a method can make one stack frame larger?
    ru: Какие части метода могут сделать один кадр стека крупнее?
  - id: heap-object-trap
    en: If a recursive method receives a huge array, is that whole array copied into each stack frame?
    ru: Если рекурсивный метод получает огромный массив, копируется ли весь массив в каждый кадр стека?
  - id: production-fix
    en: In production code, should you usually fix StackOverflowError by shrinking -Xss, increasing -Xss, or changing the algorithm?
    ru: В production-коде StackOverflowError обычно стоит чинить уменьшением -Xss, увеличением -Xss или изменением алгоритма?
  - id: tail-call-trap
    en: Does Java guarantee tail-call optimization that turns deep recursion into a loop?
    ru: Гарантирует ли Java tail-call optimization, которая превращает глубокую рекурсию в цикл?
