# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: declare-primitive
    title:
      en: Declare a primitive
      ru: Объяви примитив
    goal:
      en: Run an example that declares a primitive so you see its size and range.
      ru: Запусти пример, который объявляет примитив, чтобы увидеть его размер и диапазон.
    event: TYPE_PRIMITIVE
  - id: trigger-overflow
    title:
      en: Overflow an int
      ru: Переполни int
    goal:
      en: Add 1 to Integer.MAX_VALUE and watch it wrap around to the minimum.
      ru: Прибавь 1 к Integer.MAX_VALUE и увидь, как оно заворачивается в минимум.
    event: TYPE_OVERFLOW
  - id: char-as-number
    title:
      en: See char as a number
      ru: Увидь char как число
    goal:
      en: Run the char example so 'A' reveals its numeric code 65.
      ru: Запусти пример с char, чтобы 'A' показал свой числовой код 65.
    event: TYPE_CHAR
  - id: float-imprecision
    title:
      en: Catch floating-point error
      ru: Поймай ошибку плавающей точки
    goal:
      en: Compute 0.1 + 0.2 and see why it is not exactly 0.3.
      ru: Вычисли 0.1 + 0.2 и увидь, почему это не ровно 0.3.
    event: TYPE_FLOAT
  - id: autobox
    title:
      en: Autobox a primitive
      ru: Упакуй примитив
    goal:
      en: Box an int into an Integer object and see it move to the heap.
      ru: Упакуй int в объект Integer и увидь, как он переезжает в кучу.
    event: TYPE_BOX
  - id: integer-cache
    title:
      en: Hit the Integer cache
      ru: Поймай кэш Integer
    goal:
      en: Compare boxed values with == and see why 127 and 200 behave differently.
      ru: Сравни упакованные значения через == и увидь, почему 127 и 200 ведут себя по-разному.
    event: TYPE_CACHE
  - id: default-value
    title:
      en: Find a default value
      ru: Найди значение по умолчанию
    goal:
      en: Run the defaults example to see fields start at zero/false/null.
      ru: Запусти пример со значениями по умолчанию и увидь, что поля начинаются с нуля/false/null.
    event: TYPE_DEFAULT

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: two-families
    en: What are the two families of data types in Java, and how does each store its value?
    ru: Какие два семейства типов данных есть в Java и как каждое хранит своё значение?
  - id: list-primitives
    en: Name the eight primitive types and roughly their sizes. Which is the odd one out?
    ru: Назови восемь примитивных типов и примерно их размеры. Какой из них стоит особняком?
  - id: overflow-behaviour
    en: What happens when you add 1 to Integer.MAX_VALUE, and why?
    ru: Что происходит, когда ты прибавляешь 1 к Integer.MAX_VALUE, и почему?
  - id: char-nature
    en: Is char a number or a letter? What is the result and type of 'A' + 1?
    ru: char — это число или буква? Каков результат и тип выражения 'A' + 1?
  - id: float-money
    en: Why is 0.1 + 0.2 not 0.3, and what should you use for money instead of double?
    ru: Почему 0.1 + 0.2 не равно 0.3 и что использовать для денег вместо double?
  - id: widening-narrowing
    en: What is the difference between a widening and a narrowing conversion? Which needs a cast?
    ru: В чём разница между расширяющим и сужающим преобразованием? Какое требует приведения?
  - id: autoboxing-cost
    en: What is autoboxing, and what is one performance or correctness trap it brings?
    ru: Что такое автоупаковка и какую ловушку производительности или корректности она несёт?
  - id: integer-cache-equals
    en: Why can == return true for Integer 127 but false for Integer 200? How should you compare them?
    ru: Почему == может вернуть true для Integer 127, но false для Integer 200? Как их правильно сравнивать?
  - id: defaults-and-null
    en: What default value does an unassigned field get? Can a primitive be null?
    ru: Какое значение по умолчанию получает неинициализированное поле? Может ли примитив быть null?
