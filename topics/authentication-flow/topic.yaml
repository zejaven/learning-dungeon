id: authentication-flow
title:
  en: 'How Authentication Works in a System'
  ru: 'Как работает аутентификация в системе'
category:
  en: Security & Authentication
  ru: Безопасность и аутентификация
type: HTTP
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: security
difficulty: 1
catalogId: security-3
summary:
  en: >
    Authentication answers one question — who is calling — and it is a lifecycle,
    not a checkbox. A secret is enrolled once, stored as a salted slow hash so the
    server can check a password it never keeps; the user proves it once at login,
    optionally with a second factor of a different kind; the server issues a
    credential, because nobody re-checks a password on every request; every later
    request presents that credential and is verified from scratch; and the whole
    thing has to end — by expiry, by refresh, or by logging out. The one design
    choice that shapes everything else is where the truth lives: a server-side
    session (the server remembers, revocation is a DELETE, every request costs a
    lookup) or a stateless signed token (the client carries the claims, nothing is
    stored, and logging out is suddenly hard). The traps are the same everywhere —
    plaintext or fast-hashed passwords, an unthrottled login endpoint, treating a
    half-finished MFA login as a login, and forgetting that a credential is a
    bearer credential: whoever holds it is the user.
  ru: >
    Аутентификация отвечает на один вопрос — кто вызывает — и это жизненный цикл,
    а не галочка. Секрет заводят один раз и хранят как солёный медленный хеш,
    чтобы сервер мог проверять пароль, никогда его не сохраняя; пользователь
    доказывает его один раз при входе, при желании со вторым фактором другого
    типа; сервер выдаёт учётные данные, потому что пароль не проверяют на каждом
    запросе; каждый следующий запрос предъявляет эти учётные данные и проверяется
    заново; и всё это должно уметь заканчиваться — по сроку, по обновлению или по
    выходу из системы. Главное проектное решение — где живёт истина: серверная
    сессия (сервер помнит, отзыв — это DELETE, каждый запрос стоит одного
    обращения к хранилищу) или подписанный токен без состояния (клиент везёт
    факты с собой, на сервере не хранится ничего, а выход из системы внезапно
    становится сложной задачей). Ловушки везде одни и те же: пароли в открытом
    виде или под быстрым хешем, вход без ограничения попыток, недозавершённый
    вход с MFA, который считают входом, и забытое свойство предъявительских
    учётных данных: кто их держит, тот и есть пользователь.

# Visual primitives this topic's visualizer composes (frontend).
primitives:
  - BoxGroup

defaultExample: the-whole-flow

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: the-whole-flow
    title:
      en: 'The whole flow'
      ru: 'Весь поток целиком'
    file: 01-the-whole-flow.java
    explanation:
      en: >
        The complete picture in one run: a password enrolled, an anonymous request
        that the server cannot attribute to anyone, one login where the password
        is actually used, a credential handed back, and then every following
        request authenticated again from scratch. Notice that the password appears
        exactly once — everything after it works off the credential.
      ru: >
        Полная картина за один прогон: пароль заведён, анонимный запрос, который
        сервер не может никому приписать, один вход, где пароль действительно
        используется, выданные учётные данные — и дальше каждый следующий запрос
        аутентифицируется заново. Обратите внимание: пароль встречается ровно
        один раз, всё остальное работает с учётными данными.
  - id: passwords-at-rest
    title:
      en: 'What the server actually stores'
      ru: 'Что на самом деле хранит сервер'
    file: 02-passwords-at-rest.java
    explanation:
      en: >
        The server never needs the password — only the ability to answer "could
        this person produce it", which a one-way hash does without keeping the
        answer. Two users with the same password get different rows because each
        has its own salt. Then the table leaks, and the difference between the two
        systems stops being theoretical.
      ru: >
        Серверу не нужен пароль — нужна лишь возможность ответить на вопрос «мог
        ли этот человек его назвать», а односторонний хеш отвечает на него, не
        сохраняя ответа. У двух пользователей с одинаковым паролем получаются
        разные строки, потому что у каждого своя соль. А потом таблица утекает —
        и разница между двумя системами перестаёт быть теоретической.
  - id: when-the-proof-fails
    title:
      en: 'Wrong password, and guessing'
      ru: 'Неверный пароль и подбор'
    file: 03-when-the-proof-fails.java
    explanation:
      en: >
        A failed login hands out nothing, so there is no half-authenticated state
        to leak — the caller simply stays anonymous. The interesting part is the
        attack no single request looks like: guessing, where every attempt is
        perfectly valid and only the rate gives it away. Watch the throttle refuse
        the correct password too; locking an account also locks its owner out.
      ru: >
        Неудачный вход не выдаёт ничего, поэтому и утекать нечему: вызывающий
        просто остаётся анонимным. Интереснее атака, которая не видна ни в одном
        отдельном запросе, — подбор, где каждая попытка совершенно корректна и
        выдаёт её только частота. Обратите внимание, что ограничитель отклоняет и
        правильный пароль: блокируя аккаунт, вы блокируете и его владельца.
  - id: a-second-factor
    title:
      en: 'A second factor'
      ru: 'Второй фактор'
    file: 04-a-second-factor.java
    explanation:
      en: >
        The password is right and the user is still not logged in. Two factors
        only help when they are two different kinds of proof — something you know
        plus something you have — so that a password leaked from another site,
        guessed or phished is no longer enough. The credential from a
        half-finished login must identify nobody, or the second factor is advice.
      ru: >
        Пароль верный, а пользователь всё ещё не вошёл. Два фактора помогают
        только тогда, когда это два разных типа доказательства — то, что ты
        знаешь, плюс то, чем ты владеешь, — чтобы пароля, утёкшего с другого
        сайта, подобранного или выуженного, стало недостаточно. Учётные данные
        недозавершённого входа не должны никого идентифицировать, иначе второй
        фактор — просто совет.
  - id: sessions-vs-tokens
    title:
      en: 'Sessions or tokens'
      ru: 'Сессии или токены'
    file: 05-sessions-vs-tokens.java
    explanation:
      en: >
        The same five phases twice, with one thing different: where the truth
        lives. A server-side session means an opaque id plus a lookup on every
        request, and the server can change its mind at any moment. A signed token
        means the claims travel with the client and no lookup happens at all —
        watch the server store stay empty, and remember what that will cost at
        logout.
      ru: >
        Те же пять фаз дважды, различие ровно одно: где живёт истина. Серверная
        сессия — это непрозрачный идентификатор плюс обращение к хранилищу на
        каждом запросе, и сервер в любой момент может передумать. Подписанный
        токен — это факты, которые едут с клиентом, и полное отсутствие
        обращений к хранилищу: посмотрите, как серверное хранилище остаётся
        пустым, и вспомните, чего это будет стоить при выходе.
  - id: expiry-and-refresh
    title:
      en: 'Expiry and refresh'
      ru: 'Срок действия и обновление'
    file: 06-expiry-and-refresh.java
    explanation:
      en: >
        Nothing is called and nothing changes on the server — only the clock
        moves, and the credential is worthless. That is the main thing limiting
        the damage of a stolen one: it stops working on its own, without anyone
        having to notice the theft. Refresh is how a 15-minute credential still
        means a user who stays signed in all day.
      ru: >
        Никто ничего не вызывает и на сервере ничего не меняется — движутся
        только часы, и учётные данные становятся бесполезны. Это главное, что
        ограничивает ущерб от кражи: они перестают работать сами, и никому не
        нужно замечать кражу. Обновление — это то, как пятнадцатиминутные учётные
        данные всё же означают пользователя, который весь день остаётся в
        системе.
  - id: logging-out
    title:
      en: 'What "log out" costs'
      ru: 'Чего стоит «выйти»'
    file: 07-logging-out.java
    explanation:
      en: >
        With a session, logging out is a DELETE and it takes effect on the very
        next request — that lookup you pay for every time is exactly what you are
        buying. With a stateless token there is nothing to delete: the client
        drops its copy, and a copy made anywhere else keeps working until it
        expires. This is the single best question to ask about any token design.
      ru: >
        С сессией выход — это DELETE, и он действует уже на следующем запросе:
        именно за это вы и платите обращением к хранилищу каждый раз. С токеном
        без состояния удалять нечего: клиент выбрасывает свою копию, а копия,
        сделанная где-то ещё, работает до истечения срока. Это лучший вопрос,
        который можно задать про любую схему с токенами.
  - id: whoever-holds-it
    title:
      en: 'Whoever holds it is you'
      ru: 'Кто держит — тот и ты'
    file: 08-whoever-holds-it.java
    explanation:
      en: >
        Mallory breaks nothing: they copy a value — off an open network, out of a
        log, or with a script on the page — and send it. The server serves the
        request as alice, correctly, by its own rules, and nothing in the logs
        looks wrong. That is why credentials travel over HTTPS only, live in
        HttpOnly cookies, and expire quickly.
      ru: >
        Mallory ничего не взламывает: он копирует значение — из открытой сети, из
        лога или скриптом на странице — и отправляет его. Сервер обслуживает
        запрос как alice, совершенно по своим правилам, и в логах ничто не
        выглядит подозрительно. Поэтому учётные данные ходят только по HTTPS,
        лежат в HttpOnly-куках и быстро протухают.

