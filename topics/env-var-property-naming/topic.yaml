id: env-var-property-naming
title:
  en: 'What Environment Variable Overrides job.timeout'
  ru: 'Какая переменная окружения переопределяет job.timeout'
category:
  en: DevOps / Configuration
  ru: DevOps / Конфигурация
type: SPRING
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: devops
difficulty: 2
catalogId: devops-3
summary:
  en: >
    JOB_TIMEOUT. The rule behind that one word is three lines long and it only
    ever runs in one direction, from the property name to the variable name:
    replace every dot with an underscore, DELETE every dash, uppercase the
    result. So 'job.timeout' is 'JOB_TIMEOUT', 'job.read-timeout' is
    'JOB_READTIMEOUT' (not 'JOB_READ_TIMEOUT' — the dash disappears, it does not
    become an underscore), and a list element 'job.targets[0].url' is
    'JOB_TARGETS_0_URL'. The dot cannot survive because a shell variable name may
    contain only letters, digits and underscores; the capitals are a convention
    rather than a requirement. Your code keeps asking for the dotted name and
    never learns that a variable exists — Spring converts the key it is asked
    for, which is exactly why 'System.getenv("job.timeout")' returns null in the
    same process where the property resolves. The details worth knowing are that
    a wrong name is silent (it is indistinguishable from no variable at all), that
    the value is passed as a plain string and converted afterwards, that
    overriding one element of a list replaces the whole list, and that '-Djob.timeout'
    and '--job.timeout' are not environment variables and so keep their dots.
  ru: >
    JOB_TIMEOUT. Правило за этим одним словом занимает три строки и работает
    только в одну сторону — от имени свойства к имени переменной: каждую точку
    заменить подчёркиванием, каждый дефис УДАЛИТЬ, результат перевести в верхний
    регистр. Поэтому 'job.timeout' — это 'JOB_TIMEOUT', 'job.read-timeout' — это
    'JOB_READTIMEOUT' (а не 'JOB_READ_TIMEOUT': дефис исчезает, а не превращается
    в подчёркивание), а элемент списка 'job.targets[0].url' — это
    'JOB_TARGETS_0_URL'. Точка уцелеть не может: имя переменной оболочки состоит
    только из букв, цифр и подчёркиваний; верхний регистр же — соглашение, а не
    требование. Код продолжает запрашивать имя с точками и никогда не узнаёт, что
    существует какая-то переменная: Spring преобразует запрошенный ключ — именно
    поэтому 'System.getenv("job.timeout")' возвращает null в том же процессе, где
    свойство успешно разрешается. Знать стоит и то, что неверное имя молчит (оно
    неотличимо от полного отсутствия переменной), что значение передаётся простой
    строкой и преобразуется уже потом, что переопределение одного элемента списка
    заменяет список целиком, и что '-Djob.timeout' и '--job.timeout' — не
    переменные окружения и поэтому сохраняют точки.

# Visual primitives this topic's visualizer composes (frontend).
primitives:
  - BoxGroup

defaultExample: the-answer

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: the-answer
    title:
      en: 'job.timeout becomes JOB_TIMEOUT'
      ru: 'job.timeout становится JOB_TIMEOUT'
    file: 01-the-answer.java
    explanation:
      en: >
        The question and its answer in six lines. Watch the direction of the
        arrow: the property name is converted into the variable name, never the
        other way round, and the code goes on asking for 'job.timeout' as if
        nothing had happened. The file value is not edited and not deleted — it
        is shadowed, and unsetting the variable brings it straight back.
      ru: >
        Вопрос и ответ на него в шести строках. Обратите внимание на направление
        стрелки: имя свойства преобразуется в имя переменной, и никогда наоборот,
        а код как ни в чём не бывало продолжает запрашивать 'job.timeout'.
        Значение из файла не правится и не удаляется — оно затеняется, и стоит
        убрать переменную, как оно возвращается.
  - id: dashes-are-deleted
    title:
      en: 'The dash disappears, it does not become _'
      ru: 'Дефис исчезает, а не становится _'
    file: 02-dashes-are-deleted.java
    explanation:
      en: >
        Four keys through the same three rules, chosen so that the second rule
        is the only difference between them. This is the step that costs people
        an afternoon: 'read-timeout' becomes 'READTIMEOUT', because an underscore
        already means "there was a dot here" and reusing it for a dash would make
        the name ambiguous. Say the rule out loud once and every key in Spring
        Boot follows from it.
      ru: >
        Четыре ключа через одни и те же три правила, подобранные так, чтобы
        различало их только второе. Именно на этом шаге теряют по полдня:
        'read-timeout' превращается в 'READTIMEOUT', потому что подчёркивание уже
        означает «здесь была точка», и если использовать его ещё и для дефиса,
        имя станет двусмысленным. Достаточно один раз проговорить правило вслух —
        и из него следует любой ключ Spring Boot.
  - id: where-you-set-it
    title:
      en: 'The same name in five places'
      ru: 'Одно имя в пяти местах'
    file: 03-where-you-set-it.java
    explanation:
      en: >
        The interviewer asking what the variable "looks like" usually wants to
        see it written down, so here it is in a shell, in a one-off run, in
        'docker run', in Compose and in a Kubernetes manifest. Notice what never
        changes between them — the name — and notice the two spellings at the end
        that keep their dots because they are not environment variables at all.
      ru: >
        Интервьюер, спрашивающий, как переменная «выглядит», обычно хочет увидеть
        её записанной, — вот она: в оболочке, в разовом запуске, в 'docker run',
        в Compose и в манифесте Kubernetes. Обратите внимание, что между ними не
        меняется никогда, — имя; и на два написания в конце, которые сохраняют
        точки, потому что переменными окружения не являются вовсе.
  - id: a-typo-is-silent
    title:
      en: 'A wrong name does nothing, quietly'
      ru: 'Неверное имя молча ничего не делает'
    file: 04-a-typo-is-silent.java
    explanation:
      en: >
        Two names that a human reads as correct and Spring reads as absent:
        'JOBTIMEOUT' lost the dot instead of converting it, 'TIMEOUT' lost the
        prefix. Nothing fails, nothing is logged, nothing is validated — the
        application simply keeps the value from the file, which is what "my
        override is being ignored" almost always turns out to mean.
      ru: >
        Два имени, которые человек читает как правильные, а Spring — как
        отсутствующие: 'JOBTIMEOUT' потерял точку вместо того, чтобы её
        преобразовать, а 'TIMEOUT' потерял префикс. Ничто не падает, ничто не
        пишется в лог, ничто не проверяется — приложение просто оставляет
        значение из файла, и почти всегда именно это и означает «моё
        переопределение игнорируется».
  - id: lists-and-indexes
    title:
      en: 'A list index is _0_'
      ru: 'Индекс списка — это _0_'
    file: 05-lists-and-indexes.java
    explanation:
      en: >
        The index gets an underscore on each side, so 'job.targets[0].url' is
        'JOB_TARGETS_0_URL'. Then comes the expensive part: lists are replaced,
        never merged. One variable does not patch one element — it makes the
        environment the owner of the whole list, and the sibling entries the file
        defined disappear. Override an element and you must set every element you
        still need.
      ru: >
        Индекс получает подчёркивание с обеих сторон, поэтому
        'job.targets[0].url' — это 'JOB_TARGETS_0_URL'. Дальше начинается дорогая
        часть: списки заменяются целиком, а не сливаются. Одна переменная не
        правит один элемент — она делает владельцем всего списка окружение, и
        соседние записи, заданные файлом, исчезают. Переопределили элемент —
        задавайте все элементы, которые вам ещё нужны.
  - id: spellings-that-work-anyway
    title:
      en: 'Three spellings that work but should not be written'
      ru: 'Три написания, которые работают, но так не пишут'
    file: 06-spellings-that-work-anyway.java
    explanation:
      en: >
        A literal 'job.timeout' (Kubernetes allows the name, bash cannot export
        it), a lowercase 'job_readtimeout' (the lookup folds case) and the older
        'JOB_WRITE_TIMEOUT' with the dash spelled as an underscore all resolve.
        Knowing that they work is what lets you debug someone else's manifest;
        writing them yourself only costs the next person time. The canonical name
        is checked first, so it wins when both are present.
      ru: >
        Буквальное 'job.timeout' (Kubernetes такое имя разрешает, а bash его не
        экспортирует), 'job_readtimeout' в нижнем регистре (поиск не различает
        регистр) и старое 'JOB_WRITE_TIMEOUT' с дефисом, записанным
        подчёркиванием, — все они разрешаются. Знание, что они работают, помогает
        разбираться в чужом манифесте; писать так самому — значит отнимать время
        у следующего. Каноническое имя проверяется первым и побеждает, когда
        заданы оба.
  - id: not-the-jvm
    title:
      en: 'Why System.getenv sees nothing'
      ru: 'Почему System.getenv ничего не видит'
    file: 07-not-the-jvm.java
    explanation:
      en: >
        The same process answers differently depending on who is asked. Spring
        converts the key before looking, so the dotted name resolves; the JVM
        converts nothing, so 'System.getenv("job.timeout")' is null and only the
        exact name works. That is the whole reason to read configuration through
        the Environment rather than through 'System.getenv' — the latter
        hard-codes the shouty name into every caller and silently loses every
        other property source.
      ru: >
        Один и тот же процесс отвечает по-разному в зависимости от того, кого
        спросили. Spring преобразует ключ перед поиском, поэтому имя с точками
        разрешается; JVM не преобразует ничего, поэтому
        'System.getenv("job.timeout")' — это null, и работает только точное имя.
        Ровно поэтому конфигурацию читают через Environment, а не через
        'System.getenv': второй вариант зашивает имя капсом в каждого
        вызывающего и молча теряет все остальные источники свойств.
  - id: one-image-two-environments
    title:
      en: 'One jar, three keys, two of them overridden'
      ru: 'Один jar, три ключа, два переопределены'
    file: 08-one-image-two-environments.java
    explanation:
      en: >
        What this rule is FOR. The jar carries defaults that make the application
        start anywhere; production supplies two variables and gets two different
        values, while the third key stays exactly as it was built. The report at
        the end is the table worth drawing on a whiteboard during the interview:
        one property name, one canonical variable name, one place the value came
        from.
      ru: >
        Ради чего это правило и существует. В jar лежат значения по умолчанию, с
        которыми приложение поднимется где угодно; прод подаёт две переменные и
        получает два других значения, а третий ключ остаётся ровно таким, каким
        его собрали. Отчёт в конце — та самая таблица, которую стоит нарисовать
        на доске на собеседовании: имя свойства, каноническое имя переменной и
        место, откуда пришло значение.

