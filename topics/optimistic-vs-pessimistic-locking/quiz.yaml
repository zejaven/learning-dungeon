# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: optimistic-vs-pessimistic-difference
    en: What is the core difference between optimistic and pessimistic locking, and when does each check for a conflict?
    ru: В чём основное различие между оптимистичной и пессимистичной блокировкой и когда каждая проверяет конфликт?
  - id: optimistic-mechanism
    en: How does optimistic locking work with a version column, and what SQL does the update run?
    ru: Как работает оптимистичная блокировка с версионным столбцом и какой SQL выполняет обновление?
  - id: optimistic-lock-exception
    en: What happens when an optimistic update finds zero matching rows, and how should the application react?
    ru: Что происходит, когда оптимистичное обновление находит ноль совпавших строк, и как должно реагировать приложение?
  - id: pessimistic-sql
    en: What SQL does pessimistic locking generate, and how do PESSIMISTIC_WRITE and PESSIMISTIC_READ differ?
    ru: Какой SQL генерирует пессимистичная блокировка и чем отличаются PESSIMISTIC_WRITE и PESSIMISTIC_READ?
  - id: for-update-vs-for-share
    en: What is the difference between FOR UPDATE and FOR SHARE, and which transactions block on each?
    ru: В чём разница между FOR UPDATE и FOR SHARE и какие транзакции блокируются на каждой?
  - id: when-to-use-which
    en: Given a hot inventory row versus a long user-edited form, which locking strategy would you choose and why?
    ru: Для горячей строки склада против долго редактируемой пользователем формы — какую стратегию блокировки вы выберете и почему?
  - id: nowait-skip-locked
    en: What do NOWAIT and SKIP LOCKED do, and when would you use SKIP LOCKED?
    ru: Что делают NOWAIT и SKIP LOCKED и когда вы бы применили SKIP LOCKED?
  - id: pessimistic-risks
    en: What are the downsides and risks of pessimistic locking?
    ru: Каковы недостатки и риски пессимистичной блокировки?
