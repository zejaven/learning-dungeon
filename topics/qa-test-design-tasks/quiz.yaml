bossFight:
- id: input-19-98-classes
  ru: Есть поле ввода, принимающее значения от 19 до 98 включительно. Разбейте входные значения на классы эквивалентности.
- id: input-19-98-boundaries
  ru: Какие граничные значения вы проверите для поля, принимающего числа от 19 до 98 включительно, и почему именно их?
- id: input-19-98-min-step
  ru: В задаче про поле 19-98 нужно уточнить минимальный шаг значений. Почему этот вопрос критичен и как он меняет набор тестов?
- id: input-19-98-extra-checks
  ru: 'Помимо числовых границ, что ещё стоит проверить у поля ввода 19-98: буквы, дробные числа, пустое значение, пробелы, вставку из буфера?'
- id: discount-requirement-hole
  ru: 'Требование: "до 18 лет — 15%, от 19 до 35 — 15%, от 35 — 20%". Какой главный дефект этого требования вы назовёте первым?'
- id: discount-clarifying-questions
  ru: Перечислите уточняющие вопросы, которые вы зададите по функции скидки "до 18 — 15%, от 19 до 35 — 15%, от 35 — 20%", прежде чем писать тесты.
- id: discount-boundary-values
  ru: 'Предположим, границы скидки уточнили: до 18 включительно — 15%, от 19 до 35 включительно — 15%, строго старше 35 — 20%. Какие граничные возрасты возьмёте в тесты?'
- id: discount-date-of-birth-issues
  ru: Почему для скидки по возрасту важно уточнить, считается ли возраст по дню или по времени рождения и в каком часовом поясе? Приведите пример дефекта, который это ловит.
- id: why-clarify-requirements
  ru: Почему на задачах по тест-дизайну интервьюер ждёт от кандидата уточняющих вопросов, а не мгновенного списка тестов? Что он этим проверяет?
