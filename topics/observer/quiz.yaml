missions:
  - id: concrete-subscribers
    type: structure
    title:
      en: Add concrete subscribers
      ru: Добавь конкретных subscribers
    goal:
      en: Create EmailSubscriber and SmsSubscriber classes that implement Subscriber.
      ru: Создай классы EmailSubscriber и SmsSubscriber, которые реализуют Subscriber.
    requires:
      - { kind: nodeExists, nodeKind: class, name: EmailSubscriber }
      - { kind: edge, relation: implements, from: EmailSubscriber, to: Subscriber }
      - { kind: nodeExists, nodeKind: class, name: SmsSubscriber }
      - { kind: edge, relation: implements, from: SmsSubscriber, to: Subscriber }
  - id: publisher-keeps-subscribers
    type: structure
    title:
      en: Publisher stores subscribers
      ru: Publisher хранит subscribers
    goal:
      en: Give NewsPublisher a field of type Subscriber, List<Subscriber>, or another collection of Subscriber.
      ru: Дай NewsPublisher поле типа Subscriber, List<Subscriber> или другую коллекцию Subscriber.
    requires:
      - { kind: edge, relation: association, from: NewsPublisher, to: Subscriber }
  - id: observer-assembled
    type: structure
    title:
      en: Observer structure assembled
      ru: Структура Observer собрана
    goal:
      en: EmailSubscriber and SmsSubscriber implement Subscriber, and NewsPublisher keeps subscribers through the Subscriber interface.
      ru: EmailSubscriber и SmsSubscriber реализуют Subscriber, а NewsPublisher хранит subscribers через интерфейс Subscriber.
    requires:
      - { kind: edge, relation: implements, from: EmailSubscriber, to: Subscriber }
      - { kind: edge, relation: implements, from: SmsSubscriber, to: Subscriber }
      - { kind: edge, relation: association, from: NewsPublisher, to: Subscriber }

bossFight:
  - id: observer-definition
    en: What is the Observer pattern, and what problem does it solve?
    ru: Что такое паттерн Observer и какую проблему он решает?
  - id: observer-roles
    en: Name the main roles in Observer and explain how a notification flows through them.
    ru: Назови основные роли в Observer и объясни, как через них проходит уведомление.
  - id: publisher-dependency
    en: Why should the publisher depend on an observer interface instead of concrete observer classes?
    ru: Почему publisher должен зависеть от интерфейса observer, а не от конкретных классов observer?
  - id: sync-vs-async
    en: Is the Observer pattern always asynchronous? Explain the difference between the pattern and an event bus implementation.
    ru: Всегда ли паттерн Observer асинхронный? Объясни разницу между паттерном и реализацией event bus.
  - id: observer-pitfalls
    en: What production problems can Observer introduce if subscriptions, errors, or slow observers are not handled carefully?
    ru: Какие production-проблемы может создать Observer, если неаккуратно работать с подписками, ошибками или медленными observers?
