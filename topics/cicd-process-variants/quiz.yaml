# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: ci-cd-terms
    en: 'What do CI, continuous delivery and continuous deployment each mean, and how do the last two differ?'
    ru: 'Что означают CI, continuous delivery и continuous deployment и чем два последних отличаются друг от друга?'
  - id: pipeline-stages
    en: 'Walk me through the stages of a typical CI/CD pipeline, from a commit to running in production.'
    ru: 'Проведите меня по стадиям типичного пайплайна CI/CD — от коммита до работы в production.'
  - id: trigger-variants
    en: 'What can trigger a pipeline run, and which trigger would you use for a release build?'
    ru: 'Что может запускать прогон пайплайна и какой триггер вы возьмёте для релизной сборки?'
  - id: single-build-vs-chain
    en: 'When would you split one long build into a chain of smaller build configurations, and what do you gain?'
    ru: 'Когда стоит разбить одну длинную сборку на цепочку небольших конфигураций и что это даёт?'
  - id: teamcity-dependencies
    en: 'In TeamCity, what is the difference between a snapshot dependency and an artifact dependency?'
    ru: 'Чем в TeamCity snapshot-зависимость отличается от artifact-зависимости?'
  - id: build-once-promote
    en: 'What does "build once, promote many" mean, and what breaks if the production stage rebuilds from source?'
    ru: 'Что значит «собрать один раз и продвигать дальше» и что ломается, если стадия production пересобирает из исходников?'
  - id: branching-and-pipeline
    en: 'How do trunk-based development and GitFlow change the shape of the pipeline you build?'
    ru: 'Как trunk-based development и GitFlow меняют форму пайплайна, который вы строите?'
  - id: push-vs-gitops
    en: 'Compare a push deploy driven by the pipeline with a pull-based GitOps deploy. When would you pick each?'
    ru: 'Сравните push-деплой, которым управляет пайплайн, и pull-деплой в стиле GitOps. Когда выбрать каждый?'
  - id: deployment-strategies
    en: 'Explain rolling, blue-green and canary deployments and what each one costs you.'
    ru: 'Объясните rolling, blue-green и canary-развёртывания и чего стоит каждое из них.'
  - id: deploy-vs-release
    en: 'How do feature flags let you separate deploying from releasing, and why is that useful?'
    ru: 'Как feature-флаги позволяют разделить деплой и релиз и зачем это нужно?'
  - id: continuous-deployment-prereqs
    en: 'What has to be in place before you can safely remove the manual approval before production?'
    ru: 'Что должно быть готово, прежде чем можно безопасно убрать ручное подтверждение перед production?'
  - id: quality-gates
    en: 'Which quality gates would you put in a pipeline, and how do you keep a slow pipeline from being bypassed?'
    ru: 'Какие проверки качества вы поставите в пайплайн и как не дать медленному пайплайну превратиться в то, что все обходят?'
  - id: pipeline-as-code
    en: 'Why keep the pipeline definition in the repository as code rather than configured in the CI server UI?'
    ru: 'Зачем хранить описание пайплайна в репозитории как код, а не настраивать его в UI CI-сервера?'
  - id: secrets-in-pipeline
    en: 'How would you handle production credentials in a pipeline that deploys to several environments?'
    ru: 'Как вы будете обращаться с учётными данными production в пайплайне, который деплоит в несколько окружений?'
  - id: rollback-plan
    en: 'A release goes bad in production. What does rollback look like, and when is redeploying the previous version not enough?'
    ru: 'Релиз в production оказался плохим. Как выглядит откат и когда развернуть предыдущую версию недостаточно?'
  - id: slow-pipeline-diagnosis
    en: 'Your pipeline takes 40 minutes from merge to staging. How would you find and cut that time?'
    ru: 'Ваш пайплайн занимает 40 минут от слияния до staging. Как вы будете искать и сокращать это время?'
