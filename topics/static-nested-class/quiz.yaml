missions:
  - id: create-static-nested
    title:
      en: Create a static nested object
      ru: Создай объект static nested class
    goal:
      en: Run an example that creates a static nested object without first creating an outer object.
      ru: Запусти пример, где объект static nested class создаётся без предварительного создания объекта внешнего класса.
    event: STATIC_NESTED_CREATED
  - id: compare-with-inner
    title:
      en: Compare with inner class
      ru: Сравни с inner class
    goal:
      en: Run an example that creates a regular inner object tied to a specific outer object.
      ru: Запусти пример, где обычный inner object связан с конкретным объектом внешнего класса.
    event: INNER_CLASS_CREATED
  - id: access-static-member
    title:
      en: Access class state
      ru: Обратись к состоянию класса
    goal:
      en: Access a static field through the nested type name and observe that it is shared class state.
      ru: Обратись к static field через имя вложенного типа и посмотри, что это общее состояние класса.
    event: STATIC_MEMBER_ACCESS

bossFight:
  - id: what-is-static-class
    en: What does "static class" mean in Java, and why is that wording imprecise?
    ru: Что означает «static-класс» в Java и почему такая формулировка неточная?
  - id: top-level-static
    en: Can a top-level Java class be static?
    ru: Может ли top-level class в Java быть static?
  - id: outer-reference
    en: What hidden reference does a non-static inner class have, and why does a static nested class not have it?
    ru: Какая скрытая ссылка есть у non-static inner class и почему у static nested class её нет?
  - id: access-rules
    en: Can a static nested class access private fields of the outer class?
    ru: Может ли static nested class обращаться к private полям внешнего класса?
  - id: when-use
    en: When would you choose a static nested class in production code?
    ru: Когда в production-коде стоит выбрать static nested class?
