id: arraylist-internals
languages: [en, ru]
title:
  en: ArrayList Growth Internals
  ru: Как растёт ArrayList
category:
  en: Java Core / Collections
  ru: Java Core / Коллекции
type: DATA_STRUCTURE
mode: trace
aiProvider: codex
aiModel: gpt-5.5
summary:
  en: >
    How ArrayList stores data in a backing Object[] array, what add(value) does
    when there is free capacity, how grow-and-copy works when the array is full,
    and why this design gives fast index access with amortized O(1) append.
  ru: >
    Как ArrayList хранит данные во внутреннем массиве Object[], что делает
    add(value), когда есть свободная ёмкость, как работает grow-and-copy при
    заполненном массиве и почему такая реализация даёт быстрый доступ по индексу
    и амортизированное O(1) добавление в конец.
categoryId: java-collections
difficulty: 1
catalogId: java-collections-6
style: Real world

primitives:
  - ArrayGrid
  - EventLog

defaultExample: append-free-slot

examples:
  - id: append-free-slot
    title:
      en: Append into free slots
      ru: Добавление в свободные ячейки
    file: 01-append-free-slot.java
    explanation:
      en: >
        add(value) writes to elementData[size] and then increments size while
        the backing array still has free capacity.
      ru: >
        add(value) записывает в elementData[size], а затем увеличивает size,
        пока во внутреннем массиве ещё есть свободная ёмкость.
  - id: grow-and-copy
    title:
      en: Grow and copy
      ru: Рост и копирование
    file: 02-grow-and-copy.java
    explanation:
      en: >
        When the backing array is full, ArrayList allocates a larger array and
        copies all existing elements before writing the new one.
      ru: >
        Когда внутренний массив заполнен, ArrayList выделяет массив большего
        размера и копирует все существующие элементы перед записью нового.
  - id: direct-get
    title:
      en: Direct get(i)
      ru: Прямой get(i)
    file: 03-direct-get.java
    explanation:
      en: >
        get(i) jumps straight to the array slot, which is why random access is
        O(1).
      ru: >
        get(i) сразу переходит к ячейке массива, поэтому произвольный доступ
        выполняется за O(1).
  - id: insert-shifts
    title:
      en: Insert shifts right
      ru: Вставка сдвигает вправо
    file: 04-insert-shifts.java
    explanation:
      en: >
        add(index, value) must move the elements after index one slot to the
        right, so insertion in the middle is O(n).
      ru: >
        add(index, value) должен сдвинуть элементы после index на одну ячейку
        вправо, поэтому вставка в середину стоит O(n).
  - id: remove-clears-tail
    title:
      en: Remove shifts and clears
      ru: Удаление сдвигает и очищает
    file: 05-remove-clears-tail.java
    explanation:
      en: >
        remove(index) shifts following elements left and clears the old tail
        slot so the removed object can be garbage-collected.
      ru: >
        remove(index) сдвигает следующие элементы влево и очищает старую
        хвостовую ячейку, чтобы удалённый объект мог быть собран GC.

assistantExample:
  en: "e.g. What exactly happens inside ArrayList when add(value) triggers a resize?"
  ru: "например: Что именно происходит внутри ArrayList, когда add(value) вызывает resize?"

