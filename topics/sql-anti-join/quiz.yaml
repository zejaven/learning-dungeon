# SQL missions: the result of the user's query is compared to each mission's
# reference `expectedSql` (run against the same seed). Order-insensitive by
# default; columns are matched by position, so produce them in the stated order.
missions:
  - id: customers-without-orders
    type: sql
    title:
      en: Customers with no orders
      ru: Клиенты без заказов
    goal:
      en: Return the id and name of customers who never placed an order (id, name).
      ru: Верни id и имя клиентов, которые не сделали ни одного заказа (id, name).
    requires:
      - kind: sqlResult
        expectedSql: >
          SELECT c.id, c.name FROM customers c
          LEFT JOIN orders o ON o.customer_id = c.id
          WHERE o.customer_id IS NULL
  - id: products-never-ordered
    type: sql
    title:
      en: Products never ordered
      ru: Товары, которые не заказывали
    goal:
      en: Return the id and name of products that appear in no order (id, name).
      ru: Верни id и название товаров, которых нет ни в одном заказе (id, name).
    requires:
      - kind: sqlResult
        expectedSql: >
          SELECT p.id, p.name FROM products p
          LEFT JOIN orders o ON o.product_id = p.id
          WHERE o.product_id IS NULL
  - id: customers-without-book
    type: sql
    title:
      en: Customers who never ordered the Book
      ru: Клиенты, не заказывавшие Book
    goal:
      en: >
        Return the id and name of customers who never ordered the 'Book'
        (product id 1). Put the product filter in the ON clause, not WHERE (id, name).
      ru: >
        Верни id и имя клиентов, которые ни разу не заказывали 'Book'
        (товар с id 1). Условие по товару должно быть в ON, а не в WHERE (id, name).
    requires:
      - kind: sqlResult
        expectedSql: >
          SELECT c.id, c.name FROM customers c
          LEFT JOIN orders o ON o.customer_id = c.id AND o.product_id = 1
          WHERE o.id IS NULL

bossFight:
  - id: anti-join-how
    en: How do you find rows in one table that have no related rows in another, using LEFT JOIN and IS NULL?
    ru: Как найти строки одной таблицы, у которых нет связанных строк в другой, с помощью LEFT JOIN и IS NULL?
  - id: which-column-is-null
    en: Which column should you test with IS NULL in an anti-join, and why does it matter that it can't be NULL for matched rows?
    ru: Какой столбец проверять через IS NULL в anti-join и почему важно, чтобы для сопоставленных строк он не был NULL?
  - id: on-vs-where-anti-join
    en: In an anti-join with an extra condition (e.g. only 'Book' orders), why must that condition go in the ON clause and not in WHERE?
    ru: В anti-join с дополнительным условием (например, только заказы 'Book') почему это условие должно быть в ON, а не в WHERE?
  - id: not-in-null-trap
    en: What are the alternatives to a LEFT JOIN anti-join (NOT IN, NOT EXISTS), and what is the NULL trap with NOT IN?
    ru: Какие есть альтернативы anti-join через LEFT JOIN (NOT IN, NOT EXISTS) и в чём ловушка с NULL у NOT IN?
