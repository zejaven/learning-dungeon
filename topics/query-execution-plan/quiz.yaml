# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: who-decides-plan
    en: SQL is declarative, so who decides how a query is actually executed, and why?
    ru: SQL декларативен, так кто решает, как запрос реально выполняется, и почему?
  - id: planning-stages
    en: Walk through the stages a query goes through before rows are returned.
    ru: Опишите этапы, через которые проходит запрос, прежде чем вернутся строки.
  - id: planner-choices
    en: What are the main choices the planner makes when building a plan?
    ru: Какие основные решения принимает планировщик при построении плана?
  - id: cost-and-statistics
    en: What does cost-based optimization mean, and what role do statistics and cardinality play?
    ru: Что значит стоимостная оптимизация и какую роль играют статистика и кардинальность?
  - id: join-methods
    en: Compare nested loop, hash join, and merge join — when is each preferred?
    ru: Сравните nested loop, hash join и merge join — когда предпочтителен каждый?
  - id: index-not-used
    en: Why might the planner choose a sequential scan even when a usable index exists?
    ru: Почему планировщик может выбрать последовательное сканирование, даже когда есть подходящий индекс?
  - id: explain-vs-analyze
    en: What is the difference between EXPLAIN and EXPLAIN ANALYZE, and what do you look for?
    ru: В чём разница между EXPLAIN и EXPLAIN ANALYZE и на что вы смотрите?
  - id: plan-changes-over-time
    en: Why can the same query get a different (or suddenly slow) plan over time?
    ru: Почему один и тот же запрос со временем может получить другой (или внезапно медленный) план?
