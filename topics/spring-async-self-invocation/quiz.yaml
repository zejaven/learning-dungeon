# Theory topic: no missions because there is no practice editor.
bossFight:
  - id: enable-async-purpose
    en: 'What does @EnableAsync add to a Spring application?'
    ru: 'Что добавляет @EnableAsync в Spring-приложение?'
  - id: async-execution-flow
    en: 'What happens when an external bean calls a method annotated with @Async?'
    ru: 'Что происходит, когда внешний bean вызывает метод, помеченный @Async?'
  - id: self-invocation-trap
    en: 'Why can @Async fail to switch threads when the method is called from another method of the same class?'
    ru: 'Почему @Async может не переключить поток, если метод вызывается из другого метода того же класса?'
  - id: proxy-mode-limits
    en: 'Which proxy-mode limitations commonly affect @Async methods?'
    ru: 'Какие ограничения proxy mode часто влияют на @Async-методы?'
  - id: return-types-and-errors
    en: 'How should an @Async method return a result or report an exception?'
    ru: 'Как @Async-метод должен возвращать результат или сообщать об исключении?'
  - id: executor-choice
    en: 'How does Spring choose the Executor for @Async, and why should production code configure one explicitly?'
    ru: 'Как Spring выбирает Executor для @Async и почему в production-коде его стоит настраивать явно?'
  - id: fixing-self-invocation
    en: 'Name two clean ways to avoid the @Async self-invocation problem.'
    ru: 'Назовите два чистых способа избежать проблемы self-invocation с @Async.'
