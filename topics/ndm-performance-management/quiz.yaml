bossFight:
  # I. Foundational Concepts and the Performance Triad
  - id: scientific-discipline-assurance
    en: 'Why is performance management described as a "scientific discipline," and how does it map to the Assurance component of the FAB model?'
    ru: 'Почему управление производительностью называют «научной дисциплиной» и как оно соответствует компоненту Assurance модели FAB?'
  - id: water-tap-analogy
    en: 'Using the "Water Tap" analogy, explain why Throughput is always lower than theoretical Bandwidth in a real-world enterprise environment.'
    ru: 'Используя аналогию «водопроводного крана», объясните, почему Throughput всегда ниже теоретической Bandwidth в реальной корпоративной среде.'
  - id: deconstructing-latency
    en: 'Total latency is a composite of four distinct delays. Which of these is bound strictly by physics, and which can be mitigated through better hardware or software?'
    ru: 'Суммарная задержка складывается из четырёх различных компонентов. Какой из них жёстко ограничен физикой, а какие можно уменьшить лучшим железом или софтом?'
  - id: triad-interaction
    en: 'Why is understanding the complex interaction between Bandwidth, Throughput, and Latency more critical for high-speed design than simply monitoring "up/down" status?'
    ru: 'Почему понимание сложного взаимодействия Bandwidth, Throughput и Latency важнее для проектирования высокоскоростных сетей, чем простой мониторинг статуса «работает/не работает»?'
  - id: jitter-impact
    en: 'Why is Jitter (delay variation) specifically destructive to real-time applications like voice or video, and how do Jitter Buffers help mitigate this?'
    ru: 'Почему Jitter (вариация задержки) особенно разрушителен для приложений реального времени вроде голоса и видео, и как Jitter Buffer помогает это смягчить?'
  # II. Measurement Metrics and Mathematical Modelling
  - id: bdp-tcp-window
    en: 'How does the BDP formula help engineers determine the volume of a "network pipe" to properly tune TCP window sizes?'
    ru: 'Как формула BDP помогает инженерам определить объём «сетевой трубы» для правильной настройки размеров окна TCP?'
  - id: tail-drop-tcp-udp
    en: 'Describe the "Tail Drop" phenomenon. How does this event trigger different reactions in TCP versus UDP applications?'
    ru: 'Опишите явление «Tail Drop». Как это событие вызывает разные реакции в приложениях TCP и UDP?'
  - id: bufferbloat-problem
    en: 'How do overly large memory buffers lead to inflated round-trip latency even when links are not fully utilised?'
    ru: 'Как чрезмерно большие буферы памяти приводят к раздутой задержке RTT даже при неполной загрузке линков?'
  - id: aqm-purposeful-drops
    en: 'Why do algorithms like CoDel or RED purposely drop packets to force host computers to slow down their transmission rates?'
    ru: 'Почему алгоритмы вроде CoDel или RED намеренно отбрасывают пакеты, чтобы заставить хосты снизить скорость передачи?'
  - id: microbursts-100g
    en: 'In 100G environments, why can short traffic spikes instantly overflow shallow buffers even if the average utilisation appears low?'
    ru: 'Почему в средах 100G короткие всплески трафика могут мгновенно переполнить неглубокие буферы, даже если средняя утилизация выглядит низкой?'
  # III. Monitoring Strategies and Tooling
  - id: snmp-vs-flow-analysis
    en: 'Contrast the basic monitoring provided by SNMP with the deeper application-specific visibility offered by NetFlow/IPFIX.'
    ru: 'Сопоставьте базовый мониторинг через SNMP с более глубокой видимостью на уровне приложений, которую дают NetFlow/IPFIX.'
  - id: active-vs-passive-monitoring
    en: 'In what scenarios would an engineer choose to inject synthetic test packets (Active) rather than simply analysing existing natural traffic (Passive)?'
    ru: 'В каких сценариях инженер выберет внедрение синтетических тестовых пакетов (активный мониторинг) вместо простого анализа существующего естественного трафика (пассивный)?'
  - id: metrics-vs-kpis
    en: 'What distinguishes a raw metric from a Key Performance Indicator (KPI), and why are KPIs essential for driving infrastructure investment?'
    ru: 'Чем сырая метрика отличается от ключевого показателя эффективности (KPI) и почему KPI необходимы для обоснования инвестиций в инфраструктуру?'
  - id: snmpv3-encryption
    en: 'Why did SNMP v3 introduce encryption, and why is this critical for protecting the data transmitted between the NMS and network devices?'
    ru: 'Почему в SNMP v3 появилось шифрование и почему это критично для защиты данных, передаваемых между NMS и сетевыми устройствами?'
  - id: voip-mos-cdr
    en: 'Discuss the use of Mean Opinion Scores (MOS) and Call Detail Records (CDRs) in tracking subjective user experience in voice networks.'
    ru: 'Обсудите использование Mean Opinion Score (MOS) и Call Detail Record (CDR) для отслеживания субъективного пользовательского опыта в голосовых сетях.'
  # IV. Optimization and Quality of Service (QoS)
  - id: dscp-classification-marking
    en: 'Because "infinite bandwidth is impossible," how does Classification and Marking (DSCP) allow a network to support diverse applications on shared hardware?'
    ru: 'Поскольку «бесконечная полоса невозможна», как Classification and Marking (DSCP) позволяет сети обслуживать разнообразные приложения на общем оборудовании?'
  - id: pq-vs-wfq
    en: 'Contrast Priority Queuing (PQ), which always empties high-priority packets first, with Weighted Fair Queuing (WFQ), which prevents standard traffic from being choked out.'
    ru: 'Сопоставьте Priority Queuing (PQ), при котором высокоприоритетные пакеты всегда обрабатываются первыми, и Weighted Fair Queuing (WFQ), не дающий полностью «задушить» обычный трафик.'
  - id: troubleshooting-decision-order
    en: 'Why should teams investigate Latency and Queue Depth before concluding that a performance issue requires a Bandwidth upgrade?'
    ru: 'Почему команды должны исследовать Latency и глубину очередей, прежде чем заключить, что проблема производительности требует расширения Bandwidth?'
  # V. Strategic Design and Future Trends
  - id: proactive-thresholds-sla
    en: 'How do performance thresholds and trend analysis allow administrators to address bottlenecks before they violate Service Level Agreements (SLAs)?'
    ru: 'Как пороги производительности и трендовый анализ позволяют администраторам устранять узкие места до нарушения Service Level Agreement (SLA)?'
  - id: low-latency-architecture
    en: 'How do flattened topologies and multipath technologies (like LACP) reduce hops and prevent any single link from becoming a bottleneck?'
    ru: 'Как «уплощённые» топологии и multipath-технологии (например, LACP) сокращают число хопов и не дают ни одному линку стать узким местом?'
