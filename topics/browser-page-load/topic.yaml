id: browser-page-load
title:
  en: 'What Happens When You Type a URL'
  ru: 'Что происходит, когда вы вводите URL'
category:
  en: Networking / HTTP
  ru: Сети / HTTP
type: HTTP
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: networking
difficulty: 2
catalogId: networking-5
summary:
  en: >
    The question is really about layers, and each one only exists because the one
    below it finished. What you typed is not a URL: the browser decides
    search-vs-navigation and fills in the scheme, the port and the path. A name is
    not an address: three local caches are checked, then a recursive resolver walks
    root, TLD and authoritative servers over UDP and gets back an A record with a
    TTL. An address is not a connection: SYN, SYN-ACK, ACK is a full round trip
    before a byte of your request may be sent, and TCP never sees the host name. A
    connection is not a secure connection: ClientHello with SNI and ALPN, the
    certificate chain verified against the trust store, session keys — one round
    trip on TLS 1.3, two on TLS 1.2. Only then is there an HTTP request, and the
    first response byte is one more round trip plus the server's own thinking time.
    And the document is not the page: the parser finds stylesheets, scripts and
    images, each a further request, and "loaded" means those finished and the paint
    happened. Add it up and the fixed cost is measured in round trips, not
    megabits, which is why the real fixes are a CDN, keep-alive and HTTP/2, HSTS
    instead of a redirect, and caching so the request never happens at all.
  ru: >
    Этот вопрос на самом деле про слои, и каждый следующий существует только
    потому, что закончился предыдущий. То, что вы набрали, — ещё не URL: браузер
    решает, поиск это или навигация, и дописывает схему, порт и путь. Имя — ещё не
    адрес: проверяются три локальных кэша, затем рекурсивный резолвер по UDP
    обходит корневые, доменные и авторитативные серверы и получает A-запись с TTL.
    Адрес — ещё не соединение: SYN, SYN-ACK, ACK — это целый round trip до того,
    как можно отправить хоть байт запроса, и имени хоста TCP не видит вовсе.
    Соединение — ещё не защищённое соединение: ClientHello с SNI и ALPN, цепочка
    сертификатов, проверенная по хранилищу доверия, сеансовые ключи — один round
    trip на TLS 1.3 и два на TLS 1.2. И только тогда появляется HTTP-запрос, а
    первый байт ответа — это ещё один round trip плюс время, которое думает сам
    сервер. А документ — ещё не страница: парсер находит стили, скрипты и
    картинки, каждый из них — очередной запрос, и «загрузилось» означает, что они
    пришли и произошла отрисовка. Сложите всё вместе — и окажется, что
    фиксированная цена измеряется в round trip, а не в мегабитах; поэтому
    настоящие решения — это CDN, keep-alive и HTTP/2, HSTS вместо редиректа и
    кэширование, при котором запроса не происходит вовсе.

# Visual primitives this topic's visualizer composes (frontend).
primitives:
  - BoxGroup
  - ArrayGrid

defaultExample: the-whole-trip

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: the-whole-trip
    title:
      en: 'Enter to painted page'
      ru: 'От Enter до отрисованной страницы'
    file: 01-the-whole-trip.java
    explanation:
      en: >
        The entire answer in one run — step through it and watch the pipeline strip
        fill in from left to right. Two things are worth noticing on the first pass.
        The layers are strictly ordered: nothing about HTTP can happen until DNS,
        TCP and TLS have each finished, which is exactly the order to say them in at
        an interview. And the document arriving is not the end — the parser then
        finds three more things it needs, each one another request, and only after
        those does anything appear on screen.
      ru: >
        Весь ответ за один прогон: пройдите его по шагам и посмотрите, как полоса
        конвейера заполняется слева направо. На первом проходе стоит заметить две
        вещи. Слои строго упорядочены: ничего из HTTP не может произойти, пока не
        закончились DNS, TCP и TLS, — и именно в этом порядке об этом и рассказывают
        на собеседовании. И приход документа — ещё не конец: дальше парсер находит
        ещё три нужные ему вещи, каждая из которых — очередной запрос, и только
        после них на экране что-то появляется.
  - id: a-name-is-not-an-address
    title:
      en: 'DNS: root, TLD, authoritative'
      ru: 'DNS: корень, TLD, авторитативный'
    file: 02-a-name-is-not-an-address.java
    explanation:
      en: >
        Read the DNS panel top to bottom. Three local caches are consulted before a
        packet leaves the machine — the browser's, the OS resolver's and the hosts
        file — and only then does one UDP datagram go to the recursive resolver,
        which walks down the tree: the root knows who runs .com, .com knows who runs
        google.com, and only the authoritative server has the address. Then run the
        same name again: the second lookup costs nothing, because everyone on the
        way back cached the answer for its TTL.
      ru: >
        Прочитайте панель DNS сверху вниз. Прежде чем из машины уйдёт пакет,
        опрашиваются три локальных кэша — браузера, системного резолвера и файл
        hosts, — и только потом одна UDP-датаграмма уходит рекурсивному резолверу,
        который спускается по дереву: корень знает, кто заведует .com, .com знает,
        кто заведует google.com, и только авторитативный сервер знает адрес. Затем
        запросите то же имя ещё раз: второй запрос стоит нуля, потому что все на
        обратном пути закэшировали ответ на время TTL.
  - id: an-address-is-not-a-connection
    title:
      en: 'TCP: SYN, SYN-ACK, ACK'
      ru: 'TCP: SYN, SYN-ACK, ACK'
    file: 03-an-address-is-not-a-connection.java
    explanation:
      en: >
        Three segments, one round trip, and still not a single byte of your request.
        The wire panel is the whole lesson: the browser and the server exchange
        sequence numbers and window sizes so that both kernels can allocate a socket
        with buffers — that is what a connection physically is. Note the peer in the
        header: an IP and a port. TCP has never heard of google.com, which is why the
        host name has to be repeated inside TLS (as SNI) and inside HTTP (as Host).
      ru: >
        Три сегмента, один round trip — и по-прежнему ни байта вашего запроса.
        Панель провода здесь и есть весь урок: браузер и сервер обмениваются
        номерами последовательности и размерами окна, чтобы ядра на обоих концах
        выделили сокет с буферами, — вот что такое соединение физически. Обратите
        внимание на собеседника в шапке: адрес и порт. О google.com TCP не слышал
        никогда, поэтому имя хоста приходится повторять внутри TLS (как SNI) и
        внутри HTTP (как Host).
  - id: the-tls-handshake
    title:
      en: 'TLS 1.3 vs TLS 1.2'
      ru: 'TLS 1.3 против TLS 1.2'
    file: 04-the-tls-handshake.java
    explanation:
      en: >
        The same page, two TLS versions, and the difference is a whole round trip on
        every new connection. Read the ClientHello line: SNI is the host name in
        plaintext (which is how one address serves thousands of certificates, and the
        one field an observer can still read), and ALPN is where HTTP/2 gets chosen
        without an extra exchange. Then read what the browser verifies — chain,
        dates, and that the certificate actually covers this name, which is the check
        that gives the padlock its meaning.
      ru: >
        Одна и та же страница и две версии TLS, а разница — целый round trip на
        каждом новом соединении. Прочитайте строку ClientHello: SNI — это имя хоста
        открытым текстом (благодаря ему один адрес обслуживает тысячи сертификатов, и
        это единственное поле, которое наблюдатель по-прежнему читает), а ALPN — то
        место, где выбирается HTTP/2 без лишнего обмена. Затем прочитайте, что именно
        проверяет браузер: цепочку, даты и то, что сертификат действительно покрывает
        это имя, — именно эта проверка придаёт замочку смысл.
  - id: request-and-response
    title:
      en: 'The request, at last'
      ru: 'Наконец-то сам запрос'
    file: 05-request-and-response.java
    explanation:
      en: >
        Everything before this step was preparation; this is the first moment the
        thing you wanted exists on the wire. Watch TTFB appear in the milestones —
        one round trip plus the server's own thinking time, on top of everything the
        lower layers already spent. Then watch the document turn out not to be the
        page: the parser queues a stylesheet and a script, each of which is a further
        request, and only when they are in does anything get painted.
      ru: >
        Всё, что было до этого шага, — подготовка; сейчас впервые на проводе
        появляется то, что вы хотели. Посмотрите, как в вехах возникает TTFB: один
        round trip плюс время, которое думает сам сервер, поверх всего, что уже
        потратили нижние слои. Затем посмотрите, как документ оказывается не
        страницей: парсер ставит в очередь стиль и скрипт, каждый из которых —
        очередной запрос, и только когда они пришли, что-то отрисовывается.
  - id: the-redirect-you-can-delete
    title:
      en: 'The 301 you should not need'
      ru: 'Редирект 301, которого не должно быть'
    file: 06-the-redirect-you-can-delete.java
    explanation:
      en: >
        Typing http:// to an https-only site costs a full DNS lookup, a TCP handshake
        and a request — all to receive one header saying "start over" — and then the
        connection to port 80 is thrown away and the pipeline restarts from DNS. The
        second run does the same navigation with the host on the HSTS list: the
        rewrite happens locally, before any socket is opened, so the redirect
        disappears and so does the one unencrypted request an attacker could have
        rewritten.
      ru: >
        Набрать http:// для сайта, живущего только на https, стоит полного
        DNS-запроса, рукопожатия TCP и запроса — и всё ради одного заголовка «начни
        сначала», — после чего соединение с портом 80 выбрасывается, а конвейер
        стартует заново с DNS. Второй прогон делает ту же навигацию, но хост есть в
        списке HSTS: замена происходит локально, до открытия сокета, поэтому исчезает
        и редирект, и тот единственный незашифрованный запрос, который атакующий мог
        бы переписать.
  - id: the-second-visit
    title:
      en: 'The same page, one second later'
      ru: 'Та же страница секундой позже'
    file: 07-the-second-visit.java
    explanation:
      en: >
        One browser, two navigations, and the second one skips almost the entire
        pipeline: the name is still in the DNS cache, the connection is still open so
        there is no TCP and no TLS handshake at all, and every subresource is already
        in the HTTP cache. Compare the two audits — this is why the first request to
        an origin is dramatically more expensive than the next hundred, and why
        anything that keeps closing connections quietly pays for the setup again and
        again.
      ru: >
        Один браузер, две навигации, и вторая пропускает почти весь конвейер: имя
        всё ещё в DNS-кэше, соединение всё ещё открыто, поэтому рукопожатий TCP и
        TLS нет вовсе, а каждый подресурс уже лежит в HTTP-кэше. Сравните два итога:
        именно поэтому первый запрос к origin намного дороже следующей сотни и
        именно поэтому всё, что постоянно рвёт соединения, незаметно оплачивает
        настройку снова и снова.
  - id: where-the-time-goes
    title:
      en: 'Priced in round trips'
      ru: 'Цена в round trip'
    file: 08-where-the-time-goes.java
    explanation:
      en: >
        The same document under five starting conditions, counted in round trips
        instead of milliseconds. A cold load on TLS 1.2 pays eight before the first
        byte; TLS 1.3 removes one, a warm DNS cache four more, an open connection
        everything except the request, and a fresh cache entry even that. Read it as a
        checklist: every row you can delete is a real optimisation — CDN, HSTS,
        keep-alive, HTTP/2, cache-control — and none of them is "buy more bandwidth".
      ru: >
        Один и тот же документ при пяти стартовых условиях, посчитанный в round trip,
        а не в миллисекундах. Холодная загрузка на TLS 1.2 платит восемь до первого
        байта; TLS 1.3 убирает один, тёплый DNS-кэш — ещё четыре, открытое соединение
        — всё, кроме запроса, а свежая запись в кэше — и его тоже. Читайте это как
        чек-лист: каждая вычеркнутая строка — настоящая оптимизация (CDN, HSTS,
        keep-alive, HTTP/2, cache-control), и ни одна из них не называется «купить
        канал пошире».

