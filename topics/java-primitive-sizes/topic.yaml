id: java-primitive-sizes
languages: [en, ru]
title:
  en: Primitive Type Sizes in Java
  ru: Размеры примитивных типов в Java
category:
  en: Java Core
  ru: Java Core
type: JVM_MEMORY
mode: trace
aiProvider: codex
aiModel: gpt-5.5
categoryId: java-core
difficulty: 1
catalogId: java-core-10
style: Real world
summary:
  en: >
    A focused reference for how many bytes Java primitive values occupy:
    byte is 1, short and char are 2, int and float are 4, long and double are 8,
    while boolean has no portable byte size guaranteed by the Java language.
  ru: >
    Краткий справочник по тому, сколько байт занимают значения примитивных типов
    Java: byte - 1, short и char - 2, int и float - 4, long и double - 8, а для
    boolean язык Java не гарантирует переносимый размер в байтах.

primitives:
  - ArrayGrid
  - BoxGroup

defaultExample: size-table

examples:
  - id: size-table
    title:
      en: Full size table
      ru: Полная таблица размеров
    file: 01-size-table.java
    explanation:
      en: >
        Shows the baseline interview table for all eight primitive types,
        including the boolean caveat.
      ru: >
        Показывает базовую таблицу для собеседования по всем восьми примитивным
        типам, включая оговорку про boolean.
  - id: integral-sizes
    title:
      en: Integer widths
      ru: Ширина целых типов
    file: 02-integral-sizes.java
    explanation:
      en: >
        Focuses on byte, short, int, and long: 1, 2, 4, and 8 bytes.
      ru: >
        Фокусируется на byte, short, int и long: 1, 2, 4 и 8 байт.
  - id: floating-sizes
    title:
      en: float and double
      ru: float и double
    file: 03-floating-sizes.java
    explanation:
      en: >
        Shows that float uses 4 bytes and double uses 8 bytes.
      ru: >
        Показывает, что float занимает 4 байта, а double - 8 байт.
  - id: char-size
    title:
      en: char is 2 bytes
      ru: char занимает 2 байта
    file: 04-char-size.java
    explanation:
      en: >
        Highlights char as a 16-bit UTF-16 code unit, not a full Unicode character.
      ru: >
        Подсвечивает char как 16-битную кодовую единицу UTF-16, а не целый символ
        Unicode.
  - id: boolean-caveat
    title:
      en: boolean caveat
      ru: Оговорка про boolean
    file: 05-boolean-caveat.java
    explanation:
      en: >
        Explains why boolean should not be answered as a guaranteed one-byte
        primitive in portable Java.
      ru: >
        Объясняет, почему в переносимой Java не стоит отвечать, что boolean
        гарантированно занимает один байт.
  - id: storage-context
    title:
      en: Value size vs footprint
      ru: Размер значения и след в памяти
    file: 06-storage-context.java
    explanation:
      en: >
        Separates the primitive value width from object layout, array headers,
        padding, and JVM local-variable slots.
      ru: >
        Отделяет ширину значения примитива от раскладки объекта, заголовков
        массивов, выравнивания и JVM slots для локальных переменных.

assistantExample:
  en: 'e.g. Is boolean always one byte in Java, or is that JVM-specific?'
  ru: 'например: boolean всегда занимает один байт в Java или это зависит от JVM?'

missionsFile: quiz.yaml
