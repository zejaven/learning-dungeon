# Theory topic: no missions (there is no practice editor) - only a Boss Fight.
bossFight:
  - id: main-collection-families
    en: What are the main families in the Java Collections Framework, and what problem does each solve?
    ru: Какие основные семейства есть в Java Collections Framework и какую задачу решает каждое?
  - id: list-set-map-choice
    en: How would you choose between List, Set and Map for a new feature?
    ru: Как бы вы выбрали между List, Set и Map для новой функциональности?
  - id: arraylist-linkedlist-default
    en: Why is ArrayList usually the default List implementation instead of LinkedList?
    ru: Почему ArrayList обычно выбирают как реализацию List по умолчанию вместо LinkedList?
  - id: ordering-guarantees
    en: Which common collections preserve insertion order, which sort elements or keys, and which give no order guarantee?
    ru: Какие распространённые коллекции сохраняют порядок вставки, какие сортируют элементы или ключи, а какие не дают гарантии порядка?
  - id: hashmap-vs-treemap
    en: When would you choose HashMap, LinkedHashMap or TreeMap?
    ru: Когда вы выберете HashMap, LinkedHashMap или TreeMap?
  - id: thread-safety
    en: Are ArrayList, HashMap and HashSet thread-safe, and what should you use when several threads modify a collection?
    ru: Являются ли ArrayList, HashMap и HashSet потокобезопасными, и что использовать, если несколько потоков изменяют коллекцию?
