# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: allocate
    title:
      en: Be born in Eden
      ru: Родиться в Eden
    goal:
      en: Run the code and allocate at least one object into Eden.
      ru: Запусти код и размести хотя бы один объект в Eden.
    event: OBJECT_ALLOCATED
  - id: minor-gc
    title:
      en: Trigger a minor GC
      ru: Вызови minor GC
    goal:
      en: Fill Eden (or call gc()) so a minor GC collects the young generation.
      ru: Заполни Eden (или вызови gc()), чтобы minor GC собрал молодое поколение.
    event: MINOR_GC
  - id: promotion
    title:
      en: Tenure an object to Old
      ru: Продвинь объект в Old
    goal:
      en: Keep an object alive across enough minor GCs so it is promoted to Old.
      ru: Сохрани объект живым через достаточно minor GC, чтобы он попал в Old.
    event: PROMOTION
  - id: major-gc
    title:
      en: Run a major GC
      ru: Запусти major GC
    goal:
      en: Call fullGc() to collect dead objects from the Old generation.
      ru: Вызови fullGc(), чтобы собрать мёртвые объекты из Old-поколения.
    event: MAJOR_GC

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: why-split
    en: Why is the heap split into Eden, Survivor and Old at all?
    ru: Зачем куча вообще делится на Eden, Survivor и Old?
  - id: generational-hypothesis
    en: What is the generational hypothesis and why does it make GC cheaper?
    ru: Что такое гипотеза о поколениях и почему она удешевляет GC?
  - id: two-survivors
    en: Why are there TWO survivor spaces instead of one?
    ru: Почему Survivor-пространства ДВА, а не одно?
  - id: tenuring-threshold
    en: What is the tenuring threshold and when is an object promoted to Old?
    ru: Что такое порог продвижения (tenuring threshold) и когда объект попадает в Old?
  - id: minor-vs-major
    en: What is the difference between a minor GC and a major (full) GC?
    ru: В чём разница между minor GC и major (full) GC?
  - id: premature-promotion
    en: What is premature promotion and why is it bad?
    ru: Что такое преждевременное продвижение и чем оно плохо?
