atomId: broken-contract-symptoms
order: 1
title:
  en: |-
    A cache that never hits
  ru: |-
    Кэш, в который никогда не попадаешь
statement:
  en: |-
    The price cache is keyed by `PriceKey`. In production its hit rate is zero:

    - a price stored under a key cannot be read back with a new, equal key;
    - a `HashSet<PriceKey>` keeps several copies of the same key;
    - nothing throws, and `equals()` has its own unit tests, which pass.

    Fix `PriceKey` so both collections treat equal keys as one key. Two keys differing only in `note` are the same key. The cache will hold thousands of keys, so lookups must stay fast.
  ru: |-
    Кэш цен использует ключ `PriceKey`. В продакшене его hit rate равен нулю:

    - цену, сохранённую под ключом, не прочитать новым равным ключом;
    - `HashSet<PriceKey>` хранит несколько копий одного ключа;
    - исключений нет, а у `equals()` есть свои юнит-тесты, и они проходят.

    Почини `PriceKey`, чтобы обе коллекции считали равные ключи одним ключом. Ключи, отличающиеся только полем `note`, это один и тот же ключ. В кэше будут тысячи ключей, поэтому поиск должен оставаться быстрым.
hints:
  - en: |-
      Follow the path of `map.get(key)`. What does `HashMap` compute before it ever calls `equals()`?
    ru: |-
      Пройди по пути `map.get(key)`. Что `HashMap` вычисляет ещё до вызова `equals()`?
  - en: |-
      `PriceKey` inherits `hashCode()` from `Object`, so two equal keys get unrelated hash codes and land in different buckets. `equals()` is never even reached.
    ru: |-
      `PriceKey` наследует `hashCode()` от `Object`, поэтому у двух равных ключей несвязанные хэши и разные бакеты. До `equals()` дело не доходит.
  - en: |-
      Override `hashCode()` over exactly the fields `equals()` compares. A field outside `equals()` breaks the contract, and a constant makes every lookup a walk through one bucket.
    ru: |-
      Переопредели `hashCode()` ровно по тем полям, которые сравнивает `equals()`. Поле вне `equals()` ломает контракт, а константа превращает каждый поиск в обход одного бакета.
debrief:
  en: |-
    `equals()` alone is never enough for a hash-based collection: the hash picks the bucket first, and `equals()` only runs inside that bucket. That is why the symptom is a silent miss and not an exception.

    The interview version of this question is the follow-up: `return 1;` is legal by the contract, but it collapses the map into a single bucket. And adding `note` to the hash breaks the contract, because equal keys get different hashes.
  ru: |-
    Для коллекции на хэшах одного `equals()` не хватает: сначала хэш выбирает бакет, и `equals()` работает только внутри него. Поэтому симптом выглядит как тихий промах, а не как исключение.

    На собеседовании важен следующий вопрос: `return 1;` контракт не нарушает, но схлопывает мапу в один бакет. А добавление `note` в хэш контракт ломает: у равных ключей будут разные хэши.
