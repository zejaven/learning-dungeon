id: java-static-keyword
title:
  en: static in Java
  ru: static в Java
category:
  en: Java Core / Classes
  ru: Java Core / Классы
type: OTHER
mode: trace
aiProvider: codex
aiModel: gpt-5.5
categoryId: java-core
difficulty: 1
catalogId: java-core-11
style: Real world
summary:
  en: >
    What static means in Java: class-level fields and methods, one-time class
    initialization, static final constants, static nested classes, static import,
    and the traps around shared mutable state and methods that have no this.
  ru: >
    Что означает static в Java: поля и методы уровня класса, однократная
    инициализация класса, static final константы, static nested classes,
    static import и ловушки вокруг общего изменяемого состояния и методов без this.

primitives:
  - BoxGroup

defaultExample: class-initialization

examples:
  - id: class-initialization
    title:
      en: Class initializes once
      ru: Класс инициализируется один раз
    file: 01-class-initialization.java
    explanation:
      en: >
        The first active use initializes the class. Later uses reuse the already
        prepared static area instead of running static initialization again.
      ru: >
        Первое активное использование инициализирует класс. Последующие
        обращения переиспользуют уже подготовленную static-область, а не запускают
        static-инициализацию заново.
  - id: shared-static-field
    title:
      en: Shared static field
      ru: Общее static-поле
    file: 02-shared-static-field.java
    explanation:
      en: >
        A static field belongs to the class, so every object observes the same
        shared value. Each Ticket object has its own number, but nextNumber is
        stored once for Ticket.
      ru: >
        Static-поле принадлежит классу, поэтому все объекты видят одно и то же
        общее значение. У каждого объекта Ticket свой number, но nextNumber
        хранится один раз для Ticket.
  - id: instance-fields
    title:
      en: Instance fields stay separate
      ru: Instance-поля остаются отдельными
    file: 03-instance-fields.java
    explanation:
      en: >
        Objects share the class's static area, but each object keeps its own
        instance fields. Changing one Session object's status does not rewrite
        the other Session object.
      ru: >
        Объекты разделяют static-область класса, но каждый объект хранит свои
        instance-поля. Изменение status у одного объекта Session не переписывает
        другой объект Session.
  - id: static-method
    title:
      en: Static method has no this
      ru: У static-метода нет this
    file: 04-static-method.java
    explanation:
      en: >
        A static method is called through the class and has no this. An instance
        method is called on a particular object and receives this for that object.
      ru: >
        Static-метод вызывается через класс и не имеет this. Instance-метод
        вызывается на конкретном объекте и получает this для этого объекта.
  - id: constants
    title:
      en: static final constants
      ru: static final константы
    file: 05-constants.java
    explanation:
      en: >
        A primitive or String static final compile-time constant is a class-level
        value that callers may inline. Reading only such a constant does not
        necessarily initialize the class.
      ru: >
        Static final константа времени компиляции с примитивом или String — это
        значение уровня класса, которое вызывающий код может встроить. Чтение
        только такой константы не обязательно инициализирует класс.
  - id: static-nested-class
    title:
      en: Static nested class
      ru: Static nested class
    file: 06-static-nested-class.java
    explanation:
      en: >
        A static nested class is grouped under the outer class name but does not
        carry an implicit outer this and does not need an outer object.
      ru: >
        Static nested class сгруппирован под именем внешнего класса, но не несёт
        скрытый outer this и не требует внешнего объекта.

assistantExample:
