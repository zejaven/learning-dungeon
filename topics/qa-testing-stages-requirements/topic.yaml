summary:
  en: >
    The classic seven stages of software testing — from analysing business
    requirements and functional specs through estimation, test design,
    execution, reporting, release support and maintenance — plus the six
    quality criteria every requirement must satisfy (completeness,
    unambiguity, consistency, necessity, feasibility, testability), each
    illustrated with an example of a "bad" requirement.
  ru: >
    Классические семь этапов тестирования ПО — от анализа бизнес-требований
    и функциональных спецификаций через оценку, разработку сценариев,
    выполнение тестов, подведение итогов до поддержки релиза и сопровождения
    продукта, — а также шесть критериев качества требований (полнота,
    однозначность, непротиворечивость, необходимость, осуществимость,
    тестируемость), каждый с примером «плохого» требования.

assistantExample:
  en: 'e.g. Name the stages of software testing in order and explain what happens at each one.'
  ru: 'например: Назовите этапы тестирования ПО по порядку и объясните, что происходит на каждом.'

