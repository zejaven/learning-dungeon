summary:
  en: >
    Why a non-transactional method calling a @Transactional method of the same
    bean usually does not start a transaction: the internal this.method() call
    bypasses the Spring AOP proxy, so the transaction interceptor never runs.
    Includes clean fixes and the trade-offs of self-injection, TransactionTemplate,
    and AspectJ weaving.
  ru: >
    Почему нетранзакционный метод, который вызывает @Transactional-метод того же
    bean, обычно не запускает транзакцию: внутренний вызов this.method() обходит
    Spring AOP proxy, поэтому transaction interceptor не выполняется. Разбирает
    чистые исправления и компромиссы self-injection, TransactionTemplate и AspectJ
    weaving.

assistantExample:
