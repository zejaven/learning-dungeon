bossFight:
- id: how-came-to-testing
  ru: Как вы пришли в тестирование и чем оно вас привлекает? Что в этом ответе важно для интервьюера?
- id: experience-story-structure
  ru: Расскажите кратко про ваш опыт работы. Из каких частей вы построите ответ и в каком порядке?
- id: project-specifics-and-platforms
  ru: Что тестировали — какие платформы, тип приложения? В чём была специфика проекта и как она влияла на тестирование?
- id: planning-testing-process
  ru: Как вы планируете процесс тестирования на проекте? Какие этапы тестирования включаете и как определяете, какие тесты нужны (smoke, regression, exploratory)?
- id: release-cycle-and-testing-role
  ru: Как был устроен релизный цикл на вашем проекте и какова была роль тестирования в нём?
- id: test-model-documentation-reports
  ru: Как была построена тестовая модель и работа с документацией? Какие отчёты вы готовили по результатам тестирования?
- id: task-distribution-bug-backlog
  ru: Как на проекте распределялись задачи и кто следил за бэклогом багов? Что ваш ответ говорит интервьюеру о зрелости процессов?
- id: tools-stack
  ru: Какие инструменты для тестирования вы использовали (Jira, TestRail, Postman, Charles Proxy, Xcode, Android Studio и т.д.)? Как правильно рассказывать о стеке?
- id: why-changing-jobs
  ru: Почему меняете работу? Чего ждёте от нового проекта и новой компании? Какие у вас критерии выбора нового места?
