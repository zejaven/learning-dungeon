bossFight:
  - id: test-documentation-types
    en: 'What kinds of test documentation do you know, and why does a team need them at all?'
    ru: 'Какие виды тестовой документации ты знаешь и зачем они вообще нужны команде?'
  - id: test-plan-contents
    en: 'What is a test plan and what sections does it typically contain?'
    ru: 'Что такое тест-план и какие разделы он обычно содержит?'
  - id: entry-exit-criteria
    en: 'What are entry and exit criteria in a test plan? Give examples of each.'
    ru: 'Что такое критерии входа и выхода в тест-плане? Приведи примеры каждого.'
  - id: test-case-structure
    en: 'Describe the structure of a well-written test case. What makes a test case good?'
    ru: 'Опиши структуру хорошо написанного тест-кейса. Что делает тест-кейс хорошим?'
  - id: checklist-vs-test-case
    en: 'What is the difference between a check-list and a test case, and when would you use each?'
    ru: 'Чем чек-лист отличается от тест-кейса и когда что использовать?'
  - id: test-suite-definition
    en: 'What is a test suite and how does it relate to test cases? Give examples of how suites are grouped.'
    ru: 'Что такое тест-сьют и как он связан с тест-кейсами? Приведи примеры, по каким признакам группируют сьюты.'
  - id: test-report-contents
    en: 'What does a test report contain, who reads it, and what decision is made based on it?'
    ru: 'Что содержит тест-репорт, кто его читает и какое решение принимается на его основе?'
  - id: test-plan-vs-strategy
    en: 'How does a test plan differ from a test strategy?'
    ru: 'Чем тест-план отличается от тестовой стратегии?'
