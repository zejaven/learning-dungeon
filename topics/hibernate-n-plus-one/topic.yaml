id: hibernate-n-plus-one
title:
  en: The N+1 Select Problem
  ru: Проблема N+1 запросов
category:
  en: Hibernate / Performance
  ru: Hibernate / Производительность
type: TRANSACTION
aiProvider: claude
aiModel: claude-opus-4-8
categoryId: hibernate
difficulty: 2
catalogId: hibernate-5
style: Real world
summary:
  en: >
    Why lazily reading a collection for each of N loaded entities fires N extra
    SELECTs on top of the first one (1 + N), and how JOIN FETCH, an entity graph
    or a batch size collapse those queries back down.
  ru: >
    Почему ленивое чтение коллекции у каждой из N загруженных сущностей вызывает
    N дополнительных SELECT поверх первого (1 + N) и как JOIN FETCH, entity graph
    или batch size сворачивают эти запросы обратно.

primitives:
  - ArrayGrid
  - EventLog

defaultExample: n-plus-one-problem

examples:
  - id: n-plus-one-problem
    title:
      en: The N+1 problem
      ru: Проблема N+1
    file: 01-n-plus-one-problem.java
    explanation:
      en: >
        One root query loads 3 orders, then touching each order's lazy `lines`
        collection fires one SELECT per order: 1 + 3 = 4 statements.
      ru: >
        Один корневой запрос загружает 3 заказа, затем обращение к ленивой
        коллекции `lines` у каждого заказа вызывает по одному SELECT: 1 + 3 = 4.
  - id: join-fetch
    title:
      en: Fix with JOIN FETCH
      ru: Решение через JOIN FETCH
    file: 02-join-fetch.java
    explanation:
      en: >
        A single JOIN FETCH loads orders and lines together, so touching the
        collections afterwards adds no query — 4 statements become 1.
      ru: >
        Один JOIN FETCH загружает заказы и строки вместе, поэтому последующее
        обращение к коллекциям не добавляет запросов — 4 запроса становятся 1.
  - id: entity-graph
    title:
      en: Fix with an entity graph
      ru: Решение через entity graph
    file: 03-entity-graph.java
    explanation:
      en: >
        An @EntityGraph declares which associations to fetch for this query
        without changing the mapping — also a single statement.
      ru: >
        @EntityGraph объявляет, какие связи подгрузить для этого запроса, не меняя
        маппинг — тоже один запрос.
  - id: batch-size
    title:
      en: Reduce with batch size
      ru: Смягчение через batch size
    file: 04-batch-size.java
    explanation:
      en: >
        @BatchSize keeps lazy loading but groups child selects with IN (...):
        5 orders at batch size 2 need ceil(5/2) = 3 child queries, not 5.
      ru: >
        @BatchSize сохраняет ленивую загрузку, но группирует запросы детей через
        IN (...): 5 заказам при batch size 2 нужно ceil(5/2) = 3 запроса, а не 5.

assistantExample:
  en: "e.g. Why is JOIN FETCH usually better than making the association EAGER?"
  ru: "например: Почему JOIN FETCH обычно лучше, чем сделать связь EAGER?"

missionsFile: quiz.yaml
