summary:
  en: >
    Modular architecture is two decisions, not one: which mechanism holds a
    boundary in place, and along which lines the code is cut. The mechanisms
    form a ladder of rising enforcement and rising cost - packages plus
    package-private visibility, architecture tests such as ArchUnit or Spring
    Modulith, build modules in Gradle or Maven, JPMS with module-info.java,
    runtime plugin systems such as OSGi or ServiceLoader, and finally separate
    services, where the boundary becomes a process and a network hop. How to
    organise modules is largely independent of which mechanism you pick: cut by
    business capability rather than by technical layer, give each module a
    narrow public API and hidden internals, keep the dependency graph acyclic,
    invert a dependency through a port when the natural arrow points the wrong
    way, call directly for queries but publish events for reactions, let each
    module own its own tables, keep the shared common module tiny, and check
    every rule in CI - a boundary nothing verifies is a suggestion.
  ru: >
    Модульная архитектура - это два решения, а не одно: какой механизм удерживает
    границу и по каким линиям код вообще разрезан. Механизмы образуют лестницу с
    растущей строгостью и растущей ценой - пакеты и package-private видимость,
    архитектурные тесты вроде ArchUnit или Spring Modulith, модули сборки в
    Gradle или Maven, JPMS с module-info.java, runtime-системы плагинов вроде
    OSGi или ServiceLoader и, наконец, отдельные сервисы, где границей
    становятся процесс и сетевой вызов. Как организовать модули - вопрос почти
    независимый от выбранного механизма: резать по бизнес-возможностям, а не по
    техническим слоям, давать каждому модулю узкий публичный API и скрытые
    внутренности, держать граф зависимостей ациклическим, инвертировать
    зависимость через порт, когда естественная стрелка смотрит не туда, вызывать
    напрямую для запросов и публиковать события для реакций, отдавать каждому
    модулю свои таблицы, держать общий common-модуль крошечным и проверять
    каждое правило в CI - граница, которую никто не проверяет, это пожелание.

