id: exceptions-out-of-memory
languages: [en, ru]
title:
  en: Exceptions and OutOfMemoryError
  ru: Исключения и OutOfMemoryError
category:
  en: Java Core / Exceptions
  ru: Java Core / Исключения
type: JVM_MEMORY
mode: trace
aiProvider: codex
aiModel: gpt-5.5
categoryId: exceptions
difficulty: 2
catalogId: exceptions-5
style: Real world
summary:
  en: >
    How Java separates Exception and Error, when checked and unchecked exceptions
    are useful, why OutOfMemoryError is not a normal business failure, and what a
    production service should do when heap memory is exhausted.
  ru: >
    Как Java разделяет Exception и Error, когда полезны checked и unchecked
    исключения, почему OutOfMemoryError не является обычной бизнес-ошибкой и что
    должен делать production-сервис, когда закончилась память heap.

primitives:
  - ArrayGrid

defaultExample: catch-exception-misses-error

examples:
  - id: hierarchy-and-oom
    title:
      en: Throwable hierarchy
      ru: Иерархия Throwable
    file: 01-hierarchy-and-oom.java
    explanation:
      en: >
        Classifies IOException, NullPointerException, and OutOfMemoryError so you
        can see checked Exception, unchecked RuntimeException, and Error side by side.
      ru: >
        Классифицирует IOException, NullPointerException и OutOfMemoryError, чтобы
        рядом увидеть checked Exception, unchecked RuntimeException и Error.
  - id: catch-runtime-finally
    title:
      en: Catch a runtime failure
      ru: Поймать runtime-сбой
    file: 02-catch-runtime-finally.java
    explanation:
      en: >
        A NumberFormatException is a RuntimeException. A matching catch handles it,
        and finally still runs for cleanup.
      ru: >
        NumberFormatException является RuntimeException. Подходящий catch его
        обрабатывает, а finally всё равно выполняется для очистки.
  - id: catch-exception-misses-error
    title:
      en: catch Exception misses Error
      ru: catch Exception не ловит Error
    file: 03-catch-exception-misses-error.java
    explanation:
      en: >
        Simulates heap exhaustion under catch (Exception). OutOfMemoryError is an
        Error, so catch (Exception) does not catch it.
      ru: >
        Симулирует исчерпание heap внутри catch (Exception). OutOfMemoryError —
        это Error, поэтому catch (Exception) его не ловит.
  - id: release-cache-before-oom
    title:
      en: Release optional cache
      ru: Освободить необязательный cache
    file: 04-release-cache-before-oom.java
    explanation:
      en: >
        Shows a safe mitigation before the process is broken: release optional
        cache memory and retry bounded work.
      ru: >
        Показывает безопасную меру до поломки процесса: освободить необязательную
        cache-память и повторить ограниченную работу.
  - id: boundary-catch-fail-fast
    title:
      en: Boundary catch and fail fast
      ru: Граничный catch и fail fast
    file: 05-boundary-catch-fail-fast.java
    explanation:
      en: >
        A top-level boundary catches Throwable only to run cleanup and record the
        decision to terminate or restart, not to keep serving requests.
      ru: >
        Верхняя граница ловит Throwable только для cleanup и фиксации решения
        завершить или перезапустить процесс, а не продолжать обслуживать запросы.

assistantExample:
  en: "e.g. What should a Java service do after OutOfMemoryError?"
  ru: "например: Что должен сделать Java-сервис после OutOfMemoryError?"

missionsFile: quiz.yaml
