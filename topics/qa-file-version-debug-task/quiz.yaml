bossFight:
- id: task-statement
  ru: Три девайса одновременно скачивают http://test.com/test.exe через Chrome (iOS/Android). На двух версия v2, на одном — v1. Почему такое могло произойти?
- id: hypothesis-map
  ru: 'Разложите гипотезы по слоям: какие причины могут быть на стороне ресурса, какие — на локальной машине, а какие — в сети между ними?'
- id: request-headers
  ru: Что такого может быть в заголовках запроса за файлом, что заставит сервер отдать другую версию? Назовите конкретные заголовки.
- id: server-side-causes
  ru: 'Объясните сценарий «новая версия выложена не везде»: как за одним доменом могут оказаться серверы с разными версиями файла и почему девайсы попадают на разные?'
- id: network-causes
  ru: Как VPN и разница между Wi-Fi и LTE могут привести к скачиванию разных версий одного файла?
- id: local-causes
  ru: Какие причины на стороне самого девайса могут дать «старую версию» файла, даже если сервер отдал новую?
- id: investigation-tools
  ru: Какими инструментами вы будете исследовать проблему и что именно посмотрите в первую очередь?
- id: verify-hashes
  ru: Как объективно подтвердить, что скачанные файлы действительно различаются, и какие заголовки ответа помогут понять, откуда пришла старая версия?
- id: interview-focus
  ru: Что на самом деле оценивает интервьюер в этой задаче и какие ответы кандидата считаются слабыми?
