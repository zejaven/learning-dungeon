# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: main-difference
    en: What is the core difference between the default and protected access modifiers?
    ru: В чём ключевая разница между модификаторами доступа default и protected?
  - id: default-scope
    en: What exactly is the scope of a member with default (no-modifier) access?
    ru: Какова в точности область видимости члена с доступом default (без модификатора)?
  - id: protected-subclass
    en: How can a subclass in a different package access a protected member of its parent?
    ru: Как подкласс в другом пакете может обратиться к protected-члену родителя?
  - id: protected-cross-package-trap
    en: >
      Inside a subclass in another package, can you read a protected field through
      any reference of the parent type? Explain.
    ru: >
      Внутри подкласса в другом пакете можно ли прочитать protected-поле через любую
      ссылку родительского типа? Поясните.
  - id: ordering
    en: Order private, default, protected and public from most to least restrictive.
    ru: Расположите private, default, protected и public от самого строгого к самому открытому.
  - id: when-protected-over-default
    en: When would you choose protected over default, and what does that decision signal about the design?
    ru: Когда вы выберете protected вместо default и о чём говорит это решение в дизайне?
