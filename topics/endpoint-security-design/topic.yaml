id: endpoint-security-design
languages: [en, ru]
title:
  en: 'Designing a Security Scheme for Your Endpoints'
  ru: 'Проектирование схемы безопасности эндпоинтов'
category:
  en: REST / API Design
  ru: REST / Проектирование API
type: HTTP
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: rest
difficulty: 2
catalogId: rest-7
summary:
  en: >
    A security scheme for endpoints is two things: an ordered rule list that says
    what each endpoint requires, and a chain of checks every request walks before
    a handler runs. The chain has a fixed order — TLS, rate limiting, rule
    matching, authentication ('who are you', answered only by a verified
    credential), authorization ('may this caller and this token use this
    endpoint', roles plus scopes), object-level authorization ('may they touch
    THIS record'), then the handler, with every decision written to an audit log.
    The design decisions that matter are the default stance (deny, so a forgotten
    endpoint fails closed), where identity comes from (a verified token, never a
    header the client can type), and the difference between 401 and 403. The
    classic failures are an endpoint nobody wrote a rule for, a strict rule
    shadowed by a broader one above it, a token decoded but never verified, and a
    role check with no ownership check behind it — the most common API
    vulnerability there is.
  ru: >
    Схема безопасности эндпоинтов — это две вещи: упорядоченный список правил,
    который говорит, что требуется на каждом эндпоинте, и цепочка проверок,
    через которую проходит каждый запрос до обработчика. Порядок в цепочке
    фиксирован: TLS, ограничение частоты, подбор правила, аутентификация («кто
    ты» — отвечает только проверенный токен), авторизация («можно ли этому
    вызывающему и этому токену пользоваться эндпоинтом» — роли плюс scope),
    авторизация на уровне объекта («можно ли ему трогать ЭТУ запись»), затем
    обработчик, и каждое решение попадает в журнал аудита. Значимые проектные
    решения — позиция по умолчанию (запрет, чтобы забытый эндпоинт ломался
    безопасно), источник личности (проверенный токен, а не заголовок, который
    клиент впишет сам) и разница между 401 и 403. Классические провалы: эндпоинт,
    про который не написали правила; строгое правило, перекрытое более широким
    выше; токен, который декодировали, но не проверили; и проверка роли без
    проверки владельца — самая частая уязвимость API.

