id: race-condition-avoidance
title:
  en: Avoiding Race Conditions
  ru: Как избежать состояния гонки
category:
  en: Java Core / Concurrency
  ru: Java Core / Многопоточность
type: CONCURRENCY
mode: trace
summary:
  en: >
    How race conditions appear around shared mutable state, how to remove shared
    state when possible, and how to protect compound operations with one clear
    synchronization strategy.
  ru: >
    Как состояния гонки появляются вокруг общего изменяемого состояния, как по
    возможности убрать общее состояние и как защищать составные операции одной
    понятной стратегией синхронизации.
categoryId: concurrency
difficulty: 2
catalogId: concurrency-8
style: Real world
aiProvider: codex
aiModel: gpt-5.5

primitives:
  - ArrayGrid
  - LinkedNodes

defaultExample: lost-update-race

examples:
  - id: lost-update-race
    title:
      en: Lost update race
      ru: Гонка с потерянным обновлением
    file: 01-lost-update-race.java
    explanation:
      en: >
        Two threads read the same old value and write back the same next value,
        so one update disappears.
      ru: >
        Два threads читают одно и то же старое значение и записывают одно и то
        же следующее значение, поэтому одно обновление исчезает.
  - id: confine-state
    title:
      en: Confine local state
      ru: Изолируй локальное состояние
    file: 02-confine-state.java
    explanation:
      en: >
        Work kept in thread-local variables cannot be raced over by another
        thread because it is not shared.
      ru: >
        Работа в thread-local переменных не может стать предметом гонки с другим
        thread, потому что она не является общей.
  - id: guard-with-lock
    title:
      en: Guard with one lock
      ru: Защити одним lock
    file: 03-guard-with-lock.java
    explanation:
      en: >
        The read-modify-write operation happens while the thread owns the lock,
        so no other thread can interleave inside the update.
      ru: >
        Операция read-modify-write выполняется, пока thread владеет lock, поэтому
        другой thread не может вклиниться внутрь обновления.
  - id: same-lock-for-all
    title:
      en: Same lock for all
      ru: Один lock для всех
    file: 04-same-lock-for-all.java
    explanation:
      en: >
        T2 must wait while T1 owns the same lock, then it continues from the
        latest shared value.
      ru: >
        T2 должен ждать, пока T1 владеет тем же lock, а затем продолжает с
        актуального общего значения.
  - id: keep-lock-small
    title:
      en: Keep the lock small
      ru: Держи lock коротким
    file: 05-keep-lock-small.java
    explanation:
      en: >
        Only the shared update is protected; unrelated work stays outside the
        critical section.
      ru: >
        Защищается только общее обновление; несвязанная работа остаётся вне
        critical section.

assistantExample:
  en: 'e.g. What practical steps do you use to avoid race conditions in Java?'
  ru: 'например: Какие практические шаги помогают избежать состояния гонки в Java?'

missionsFile: quiz.yaml
