summary:
  en: >
    Why Spring AOP usually does not apply advice to private methods, static
    methods, constructors, fields, or calls made inside the same class: proxy-based
    AOP only sees calls that enter a Spring-managed bean through its proxy.
  ru: >
    Почему Spring AOP обычно не применяет advice к private methods, static
    methods, constructors, fields или вызовам внутри того же класса: proxy-based
    AOP видит только вызовы, которые входят в Spring-managed bean через его proxy.

