summary:
  en: >
    Configuration Management as the network's "source of truth": baseline
    configurations and configuration drift, the automated remediation
    lifecycle, the structured patch management framework, physical vs logical
    documentation and "living" network diagrams, CM vs Change Management, the
    CMDB and TMN hierarchy, management protocols (SNMP, CLI, Netconf), and the
    operational metrics of an effective CM system.
  ru: >
    Управление конфигурациями как «источник истины» сети: базовые конфигурации
    (baseline) и configuration drift, автоматизированный цикл ремедиации,
    структурированный каркас управления патчами, физическая и логическая
    документация и «живые» схемы сети, CM против Change Management, CMDB и
    иерархия TMN, протоколы управления (SNMP, CLI, Netconf) и операционные
    метрики эффективной системы CM.

assistantExample:
