id: lock-alternatives
languages: [en, ru]
title:
  en: 'Alternatives to synchronized: Locks'
  ru: 'Альтернативы synchronized: Locks'
category:
  en: Java Core / Concurrency
  ru: Java Core / Многопоточность
type: CONCURRENCY
mode: trace
summary:
  en: >
    How ReentrantLock, ReentrantReadWriteLock and StampedLock differ from
    synchronized, what extra control they provide, and when each one is worth
    the additional complexity.
  ru: >
    Чем ReentrantLock, ReentrantReadWriteLock и StampedLock отличаются от
    synchronized, какой дополнительный контроль они дают и когда каждый из них
    оправдывает дополнительную сложность.
categoryId: concurrency
difficulty: 3
catalogId: concurrency-16
style: Real world
aiProvider: codex
aiModel: gpt-5.5

primitives:
  - ArrayGrid
  - LinkedNodes
  - BoxGroup
  - EventLog

defaultExample: reentrant-try-lock

examples:
  - id: reentrant-try-lock
    title:
      en: tryLock instead of waiting
      ru: tryLock вместо ожидания
    file: 01-reentrant-try-lock.java
    explanation:
      en: >
        ReentrantLock can fail fast with tryLock(), so a thread can choose a
        fallback instead of blocking behind the owner.
      ru: >
        ReentrantLock может быстро отказаться через tryLock(), поэтому thread
        может выбрать запасной путь вместо блокировки за владельцем.
  - id: reentrant-hold-count
    title:
      en: Reentrant hold count
      ru: Reentrant hold count
    file: 02-reentrant-hold-count.java
    explanation:
      en: >
        The same thread may enter the same ReentrantLock again, but it must call
        unlock() the same number of times to release it fully.
      ru: >
        Один и тот же thread может повторно войти в тот же ReentrantLock, но для
        полного освобождения он должен вызвать unlock() столько же раз.
  - id: readwrite-shared-read
    title:
      en: Shared reads, exclusive write
      ru: Общие reads, эксклюзивный write
    file: 03-readwrite-shared-read.java
    explanation:
      en: >
        ReentrantReadWriteLock allows multiple readers at once while a writer
        waits until every reader leaves.
      ru: >
        ReentrantReadWriteLock допускает нескольких readers одновременно, а
        writer ждёт, пока выйдут все readers.
  - id: readwrite-upgrade-risk
    title:
      en: Read-to-write upgrade risk
      ru: Риск upgrade с read на write
    file: 04-readwrite-upgrade-risk.java
    explanation:
      en: >
        A thread that already holds a read lock should not simply wait for a
        write lock, because it may be waiting for itself to leave.
      ru: >
        Thread, который уже держит read lock, не должен просто ждать write lock,
        потому что он может ждать самого себя.
  - id: stamped-optimistic-read
    title:
      en: Optimistic read validation
      ru: Validate для optimistic read
    file: 05-stamped-optimistic-read.java
    explanation:
      en: >
        StampedLock lets a reader take an optimistic stamp, but the reader must
        validate it after reading because a writer may have changed the data.
      ru: >
        StampedLock позволяет reader взять optimistic stamp, но после чтения его
        нужно validate, потому что writer мог изменить данные.
  - id: stamped-convert
    title:
      en: Convert read to write
      ru: Convert read в write
    file: 06-stamped-convert.java
    explanation:
      en: >
        StampedLock can convert the only read stamp into a write stamp, avoiding
        a release-and-reacquire gap.
      ru: >
        StampedLock может convert единственный read stamp в write stamp, избегая
        промежутка между release и повторным acquire.

assistantExample:
  en: 'e.g. When would you choose ReentrantReadWriteLock or StampedLock instead of synchronized?'
  ru: 'например: Когда выбрать ReentrantReadWriteLock или StampedLock вместо synchronized?'

missionsFile: quiz.yaml
