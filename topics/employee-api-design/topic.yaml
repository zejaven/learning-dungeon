id: employee-api-design
title:
  en: 'Employee API: Design'
  ru: 'API сотрудника: Дизайн'
category:
  en: REST / API Design
  ru: REST / Проектирование API
type: REST
# Structural topic: a multi-file project analyzed into a class diagram (no run).
mode: structural
aiProvider: claude
categoryId: rest
difficulty: 2
summary:
  en: >
    Design the classes behind the employee API so that the department split from
    the task shows up in the structure: salary changes and passport changes live
    in SEPARATE services, a read side returns the card, and the controller wires
    them together. You build the services in the file tree, press Analyze, and the
    class diagram + missions confirm the separation of responsibility. Pairs with
    the theory and the implementation challenge.
  ru: >
    Спроектируй классы за API сотрудника так, чтобы разнесение по отделам из
    задачи проявилось в структуре: изменение зарплаты и паспорта живёт в РАЗНЫХ
    сервисах, сторона чтения возвращает карточку, а контроллер связывает их
    вместе. Ты собираешь сервисы в дереве файлов, жмёшь Analyze, и диаграмма
    классов + миссии подтверждают разделение ответственности. В паре с теорией и
    challenge на реализацию.

assistantExample:
  en: 'e.g. Why put salary and passport changes in two services instead of one EmployeeService?'
  ru: 'например: Зачем класть изменение зарплаты и паспорта в два сервиса, а не в один EmployeeService?'

missionsFile: quiz.yaml
