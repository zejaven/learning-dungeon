# Theory topic: no missions, only Boss Fight questions.
bossFight:
  - id: choose-storage-type
    en: 'How would you choose between BIGINT, NUMERIC/DECIMAL, text, binary storage, and split columns for a very large number?'
    ru: 'Как выбрать между BIGINT, NUMERIC/DECIMAL, текстом, бинарным хранением и разбиением на колонки для очень большого числа?'
  - id: fixed-scale-amounts
    en: 'How would you store an amount with 18 decimals so arithmetic stays exact?'
    ru: 'Как хранить сумму с 18 decimals, чтобы арифметика оставалась точной?'
  - id: uint256-precision
    en: 'How many decimal digits can a uint256 need, and why do database DECIMAL limits matter?'
    ru: 'Сколько десятичных цифр может потребовать uint256 и почему важны ограничения DECIMAL в конкретной БД?'
  - id: text-sorting-bug
    en: 'What goes wrong when numeric values are stored as text and sorted with ORDER BY?'
    ru: 'Что ломается, когда числовые значения хранятся как текст и сортируются через ORDER BY?'
  - id: text-index-range-scan
    en: 'Why can a text index be fast but still wrong for numeric range queries?'
    ru: 'Почему текстовый индекс может быть быстрым, но всё равно неправильным для числовых диапазонов?'
  - id: cast-expression-index
    en: 'When can casting text to NUMERIC in a query help, and what are the indexing risks?'
    ru: 'Когда приведение текста к NUMERIC в запросе может помочь и какие риски для индексов оно создаёт?'
  - id: production-validation
    en: 'Which constraints and validation rules would you add for very large stored numbers in production?'
    ru: 'Какие ограничения и правила валидации ты добавишь для очень больших чисел в production?'
