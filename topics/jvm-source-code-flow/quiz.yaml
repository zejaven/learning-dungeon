missions:
  - id: reject-raw-source
    title:
      en: Prove source is not executable
      ru: Докажи, что source не выполняется напрямую
    goal:
      en: Run code that tries to hand a .java file to the JVM before compilation.
      ru: Запусти код, который пытается передать .java файл JVM до компиляции.
    event: JVM_SOURCE_REJECTED
  - id: compile-bytecode
    title:
      en: Produce bytecode
      ru: Получи bytecode
    goal:
      en: Compile Java source with javac so a .class bytecode artifact appears.
      ru: Скомпилируй Java source через javac, чтобы появился .class artifact с bytecode.
    event: JAVAC_COMPILED
  - id: verify-bytecode
    title:
      en: Pass verification
      ru: Пройди verification
    goal:
      en: Load and verify the .class file before the program is allowed to run.
      ru: Загрузи и проверь .class файл до того, как программе разрешат выполняться.
    event: BYTECODE_VERIFIED
  - id: interpret-method
    title:
      en: Execute bytecode
      ru: Выполни bytecode
    goal:
      en: Initialize the class and execute a method through the bytecode interpreter.
      ru: Инициализируй класс и выполни метод через bytecode interpreter.
    event: BYTECODE_INTERPRETED
  - id: trigger-jit
    title:
      en: Trigger JIT compilation
      ru: Вызови JIT compilation
    goal:
      en: Make a method hot enough that the JIT compiler emits native code.
      ru: Сделай метод достаточно hot, чтобы JIT compiler создал native code.
    event: METHOD_JIT_COMPILED

bossFight:
  - id: does-jvm-read-source
    en: Does the JVM execute Java source code directly? Explain the real path from .java to running code.
    ru: Выполняет ли JVM Java source code напрямую? Объясни реальный путь от .java до работающего кода.
  - id: javac-vs-jvm
    en: What is the difference between javac and the JVM?
    ru: В чем разница между javac и JVM?
  - id: bytecode-portability
    en: Why is Java bytecode portable across operating systems and CPUs?
    ru: Почему Java bytecode переносим между операционными системами и CPU?
  - id: load-verify-initialize
    en: What happens during class loading, bytecode verification and class initialization?
    ru: Что происходит при class loading, bytecode verification и class initialization?
  - id: interpreter-vs-jit
    en: Why does the JVM use both an interpreter and a JIT compiler?
    ru: Почему JVM использует и interpreter, и JIT compiler?
  - id: runtime-memory-areas
    en: Which JVM memory areas are involved when bytecode starts running?
    ru: Какие JVM memory areas участвуют, когда bytecode начинает выполняться?
