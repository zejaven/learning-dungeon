# Theory topic: no missions because there is no practice editor.
bossFight:
  - id: core-difference
    en: 'What is the core difference between @Repository and @Service?'
    ru: 'В чём основное отличие между @Repository и @Service?'
  - id: component-specialization
    en: 'How are @Repository and @Service related to @Component and component scanning?'
    ru: 'Как @Repository и @Service связаны с @Component и component scanning?'
  - id: exception-translation
    en: 'What does persistence exception translation mean for a @Repository bean?'
    ru: 'Что означает трансляция persistence exceptions для bean, помеченного @Repository?'
  - id: service-runtime-behavior
    en: 'Does @Service add special runtime behavior by itself? Explain what it mainly communicates.'
    ru: 'Добавляет ли @Service особое runtime-поведение сам по себе? Объясните, что он в основном сообщает.'
  - id: layering-choice
    en: 'Where would you place business orchestration code and where would you place database access code?'
    ru: 'Куда вы поместите код бизнес-оркестрации, а куда код доступа к базе данных?'
  - id: transactions-vs-translation
    en: 'How is @Transactional different from @Repository exception translation?'
    ru: 'Чем @Transactional отличается от трансляции исключений через @Repository?'
  - id: common-misuse
    en: 'Why is it a mistake to mark every class as @Repository just to get DataAccessException?'
    ru: 'Почему ошибочно помечать каждый класс как @Repository только ради DataAccessException?'
