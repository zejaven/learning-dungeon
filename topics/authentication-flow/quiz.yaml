# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: prove-a-password
    title:
      en: Prove a password
      ru: Докажи пароль
    goal:
      en: Register a user and log in with the right password, so the server checks a secret it never stored.
      ru: Зарегистрируй пользователя и войди с верным паролем, чтобы сервер проверил секрет, которого он никогда не хранил.
    event: PASSWORD_VERIFIED
  - id: get-a-credential
    title:
      en: Get a credential
      ru: Получи учётные данные
    goal:
      en: Complete a login and watch the server hand back the thing every later request will carry.
      ru: Заверши вход и увидь, как сервер отдаёт то, что будет нести каждый следующий запрос.
    event: CREDENTIAL_ISSUED
  - id: be-recognised
    title:
      en: Be recognised
      ru: Будь узнан
    goal:
      en: Send a request presenting a valid credential and see the server work out who is calling.
      ru: Отправь запрос с корректными учётными данными и увидь, как сервер устанавливает, кто вызывает.
    event: IDENTITY_ESTABLISHED
  - id: knock-anonymously
    title:
      en: Knock with nothing
      ru: Постучись без всего
    goal:
      en: Send a request that presents no credential at all and see what the server can say about the caller.
      ru: Отправь запрос вообще без учётных данных и посмотри, что сервер может сказать о вызывающем.
    event: ANONYMOUS_REQUEST
  - id: fail-a-login
    title:
      en: Fail a login
      ru: Провали вход
    goal:
      en: Offer the wrong password and confirm that nothing at all is handed out.
      ru: Предъяви неверный пароль и убедись, что не выдаётся вообще ничего.
    event: LOGIN_FAILED
  - id: hit-the-throttle
    title:
      en: Run into the throttle
      ru: Упрись в ограничитель
    goal:
      en: Guess repeatedly against a rate-limited login until the attempts themselves are refused.
      ru: Подбирай пароль к входу с ограничением попыток, пока сами попытки не начнут отклоняться.
    event: LOGIN_RATE_LIMITED
  - id: store-a-password-badly
    title:
      en: Store a password badly
      ru: Сохрани пароль плохо
    goal:
      en: Register a user on a system that keeps passwords as typed, and see what ends up in the row.
      ru: Зарегистрируй пользователя в системе, которая хранит пароли как есть, и посмотри, что окажется в строке.
    event: PLAINTEXT_PASSWORD_STORED
  - id: leak-the-store
    title:
      en: Leak the user table
      ru: Слей таблицу пользователей
    goal:
      en: Hand the user store to an attacker and compare what they get from hashes and from plaintext.
      ru: Отдай хранилище пользователей злоумышленнику и сравни, что он получит из хешей и из открытых паролей.
    event: USER_STORE_LEAKED
  - id: demand-a-second-factor
    title:
      en: Demand a second factor
      ru: Потребуй второй фактор
    goal:
      en: Turn on a second factor and log in with the correct password, which is now not enough.
      ru: Включи второй фактор и войди с верным паролем, которого теперь недостаточно.
    event: MFA_REQUIRED
  - id: refuse-half-a-login
    title:
      en: Refuse half a login
      ru: Отклони половину входа
    goal:
      en: Send a request with the credential of a login that stopped at the second factor.
      ru: Отправь запрос с учётными данными входа, который остановился на втором факторе.
    event: CREDENTIAL_REJECTED
  - id: finish-the-login
    title:
      en: Finish the login
      ru: Заверши вход
    goal:
      en: Submit the right code and watch the second factor complete the authentication.
      ru: Отправь верный код и увидь, как второй фактор завершает аутентификацию.
    event: MFA_PASSED
  - id: outlive-a-credential
    title:
      en: Outlive a credential
      ru: Переживи учётные данные
    goal:
      en: Move the clock past the expiry and use the credential again, without touching the server in between.
      ru: Переведи часы за срок действия и снова используй учётные данные, ничего между этим не трогая на сервере.
    event: CREDENTIAL_EXPIRED
  - id: renew-without-the-password
    title:
      en: Renew without the password
      ru: Продли без пароля
    goal:
      en: Exchange an expired credential for a fresh one and see why a short lifetime is not a nuisance.
      ru: Обменяй просроченные учётные данные на свежие и пойми, почему короткий срок жизни — не неудобство.
    event: CREDENTIAL_REFRESHED
  - id: log-out-for-real
    title:
      en: Log out
      ru: Выйди из системы
    goal:
      en: End a login and watch what the server has to do about it in each credential style.
      ru: Заверши вход и посмотри, что при этом приходится делать серверу в каждом стиле учётных данных.
    event: LOGGED_OUT
  - id: survive-a-logout
    title:
      en: Survive a logout
      ru: Переживи выход из системы
    goal:
      en: Log out of a stateless token system and use the very same token afterwards.
      ru: Выйди из системы с токеном без состояния и воспользуйся тем же самым токеном после этого.
    event: REVOKED_TOKEN_STILL_VALID
  - id: steal-a-credential
    title:
      en: Use somebody else's credential
      ru: Воспользуйся чужими учётными данными
    goal:
      en: Send a request as a different actor while presenting a credential issued to someone else.
      ru: Отправь запрос от другого действующего лица, предъявив учётные данные, выданные кому-то другому.
    event: STOLEN_CREDENTIAL_ACCEPTED

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: picture-authentication
    en: How do you picture authentication working in a system? Walk through it from registration to a request being served.
    ru: Как ты представляешь себе работу аутентификации в системе? Пройди путь от регистрации до обслуженного запроса.
  - id: authn-vs-authz
    en: What is the difference between authentication and authorization? Which one comes first and why?
    ru: В чём разница между аутентификацией и авторизацией? Что идёт первым и почему?
  - id: password-storage
    en: How do you store passwords, and why is a salted slow hash better than a fast one?
    ru: Как ты хранишь пароли и почему солёный медленный хеш лучше быстрого?
  - id: why-issue-a-credential
    en: Why does the server issue a credential at login instead of asking for the password on every request?
    ru: Почему сервер выдаёт учётные данные при входе, а не спрашивает пароль на каждом запросе?
  - id: session-vs-token
    en: Server-side session or stateless token? What does each give you and what does it cost?
    ru: Серверная сессия или токен без состояния? Что даёт каждый вариант и чего он стоит?
  - id: revoking-access
    en: A user presses "log out", or you need to cut off a compromised account right now. What happens in each of the two credential styles?
    ru: Пользователь нажимает «выйти», или нужно прямо сейчас отрезать скомпрометированный аккаунт. Что происходит в каждом из двух стилей учётных данных?
  - id: what-is-in-a-jwt
    en: What is inside a JWT, and what exactly does the server check before it trusts a single claim?
    ru: Что находится внутри JWT и что именно сервер проверяет, прежде чем поверить хоть одному полю?
  - id: access-and-refresh
    en: Why is there both an access token and a refresh token? What lifetimes would you pick and where would you keep each?
    ru: Зачем нужны и access-, и refresh-токен? Какие сроки жизни ты бы выбрал и где хранил бы каждый?
  - id: where-to-store-credentials
    en: Where should a browser keep the credential — an HttpOnly cookie or localStorage? What does each choice expose you to?
    ru: Где браузеру хранить учётные данные — в HttpOnly-куке или в localStorage? Чему подставляет каждый вариант?
  - id: bearer-semantics
    en: What does it mean that a session id or token is a "bearer" credential, and what follows from that for transport and lifetime?
    ru: Что означает, что идентификатор сессии или токен — предъявительские учётные данные, и что из этого следует для транспорта и срока жизни?
  - id: brute-force
    en: How do you protect a login endpoint from password guessing and credential stuffing? What are the downsides of account lockout?
    ru: Как защитить эндпоинт входа от подбора паролей и credential stuffing? В чём минусы блокировки аккаунта?
  - id: mfa-design
    en: What makes a second factor actually a second factor? Compare SMS codes, TOTP apps and hardware keys.
    ru: Что делает второй фактор действительно вторым фактором? Сравни SMS-коды, TOTP-приложения и аппаратные ключи.
  - id: error-messages
    en: What should the login endpoint answer when the user does not exist, and why?
    ru: Что эндпоинт входа должен отвечать, когда пользователя не существует, и почему?
  - id: microservice-authentication
    en: In a system of several services, where does authentication happen and what does each service still have to check for itself?
    ru: В системе из нескольких сервисов где происходит аутентификация и что каждый сервис всё равно обязан проверять сам?
  - id: sso-and-oauth
    en: What does an identity provider add — OAuth 2.0, OIDC, "log in with Google"? Who authenticates whom in that flow?
    ru: Что добавляет провайдер идентификации — OAuth 2.0, OIDC, «войти через Google»? Кто кого аутентифицирует в этом потоке?
  - id: service-to-service
    en: How does one service authenticate to another? Compare mTLS, a service token and a shared secret.
    ru: Как один сервис аутентифицируется перед другим? Сравни mTLS, сервисный токен и общий секрет.
  - id: session-fixation
    en: Why must the session id be regenerated right after a successful login?
    ru: Почему идентификатор сессии нужно перевыпускать сразу после успешного входа?
  - id: password-reset
    en: How would you design "forgot my password" so it does not become a way in?
    ru: Как спроектировать восстановление пароля так, чтобы оно не стало способом войти?
  - id: what-to-log
    en: What do you log about authentication, and what must never appear in those logs?
    ru: Что ты логируешь про аутентификацию и что в этих логах не должно оказаться никогда?
  - id: testing-authentication
    en: How would you test the authentication of a system? What would you assert so a regression cannot ship?
    ru: Как бы ты тестировал аутентификацию системы? Что бы ты проверял, чтобы регрессия не уехала в прод?
