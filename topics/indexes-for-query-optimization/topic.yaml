style: Real world
summary:
  en: >
    Choosing indexes starts from the queries, not the table. Read each slow
    query for the columns it filters, joins, sorts, and groups on, then design
    the narrowest index that covers them. Learn the equality-before-range column
    order, why selectivity and leftmost-prefix matter, when a covering or partial
    index pays off, and how to confirm the plan actually uses the index.
  ru: >
    Подбор индексов начинается с запросов, а не с таблицы. Прочитай каждый
    медленный запрос и найди колонки, по которым он фильтрует, джойнит, сортирует
    и группирует, затем спроектируй самый узкий индекс, который их покрывает.
    Разбери порядок колонок (равенство перед диапазоном), почему важны
    селективность и левый префикс, когда окупается covering или частичный индекс,
    и как убедиться, что план действительно использует индекс.

assistantExample:
  en: 'e.g. For "WHERE tenant_id = ? AND status = ? ORDER BY created_at", what index would you create?'
  ru: 'например: Для "WHERE tenant_id = ? AND status = ? ORDER BY created_at" какой индекс ты создашь?'

