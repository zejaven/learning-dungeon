id: hashmap-lookup-complexity
languages: [en, ru]
title:
  en: 'HashMap: Lookup Speed'
  ru: 'HashMap: скорость выборки'
category:
  en: Java Core / Collections
  ru: Java Core / Коллекции
type: DATA_STRUCTURE
mode: trace
summary:
  en: >
    Why HashMap lookup is usually O(1), what actually happens during get(),
    how collisions can degrade lookup to O(n), and what Java 8 tree bins change
    in the worst collision cases.
  ru: >
    Почему выборка из HashMap обычно имеет сложность O(1), что реально
    происходит при get(), как коллизии могут ухудшить поиск до O(n), и что
    меняют tree bins в Java 8 в худших случаях с коллизиями.
categoryId: java-collections
difficulty: 1
catalogId: java-collections-3
style: Real world
aiProvider: codex
aiModel: gpt-5.5

primitives:
  - ArrayGrid
  - LinkedNodes
  - EventLog

defaultExample: average-get

examples:
  - id: average-get
    title:
      en: Average get()
      ru: Обычный get()
    file: 01-average-get.java
    explanation:
      en: >
        A normal lookup recomputes the bucket index and checks a short bucket
        chain, which is why the average case is treated as O(1).
      ru: >
        Обычная выборка заново вычисляет индекс бакета и проверяет короткую
        цепочку в этом бакете, поэтому средний случай считают O(1).
  - id: missing-key
    title:
      en: Missing key
      ru: Отсутствующий ключ
    file: 02-missing-key.java
    explanation:
      en: >
        get() still checks only the bucket where the key should be. If no equal
        key is found there, it returns null.
      ru: >
        get() всё равно проверяет только бакет, где должен лежать ключ. Если
        равного ключа там нет, он возвращает null.
  - id: collision-chain
    title:
      en: Collision chain
      ru: Цепочка коллизии
    file: 03-collision-chain.java
    explanation:
      en: >
        Several keys can land in one bucket. Lookup then compares keys inside
        that chain, so the constant-time promise depends on short chains.
      ru: >
        Несколько ключей могут попасть в один бакет. Тогда поиск сравнивает
        ключи внутри цепочки, поэтому обещание O(1) зависит от коротких цепочек.
  - id: resize-then-get
    title:
      en: Resize then get()
      ru: Resize и get()
    file: 04-resize-then-get.java
    explanation:
      en: >
        Resize is paid during insertion, not during an ordinary get(). After
        rehashing, lookup again goes straight to the recomputed bucket.
      ru: >
        Resize оплачивается во время вставки, а не при обычном get(). После
        перераспределения поиск снова идёт прямо в заново вычисленный бакет.
  - id: mutable-key
    title:
      en: Mutable key trap
      ru: Ловушка изменяемого ключа
    file: 05-mutable-key.java
    explanation:
      en: >
        If a key changes its hashCode after insertion, get() may look in the
        wrong bucket. The lookup is fast but wrong.
      ru: >
        Если ключ меняет hashCode после вставки, get() может искать не в том
        бакете. Поиск остаётся быстрым, но становится неправильным.

assistantExample:
  en: 'e.g. Is HashMap.get() always O(1), and when can it become slower?'
  ru: 'например: HashMap.get() всегда O(1), и когда он может стать медленнее?'

missionsFile: quiz.yaml
