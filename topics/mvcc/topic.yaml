id: mvcc
title:
  en: 'MVCC: Multi-Version Concurrency Control'
  ru: 'MVCC: многоверсионное управление параллельным доступом'
category:
  en: Databases / Transactions
  ru: Базы данных / Транзакции
type: TRANSACTION
mode: theory
aiProvider: codex
aiModel: gpt-5.5
categoryId: databases
difficulty: 2
catalogId: manual-9
style: Real world
summary:
  en: >
    MVCC is the database technique that lets readers see a consistent snapshot
    while writers create newer row versions. Learn how snapshots choose visible
    versions, why readers usually do not block writers, how MVCC supports
    isolation, and why old row versions must eventually be cleaned up.
  ru: >
    MVCC - это прием базы данных, который позволяет читателям видеть согласованный
    snapshot, пока писатели создают новые версии строк. Разбери, как snapshot
    выбирает видимые версии, почему читатели обычно не блокируют писателей, как
    MVCC поддерживает isolation и почему старые версии строк нужно со временем
    очищать.

assistantExample:
  en: 'e.g. How can MVCC let a SELECT run while another transaction updates the same row?'
  ru: 'например: Как MVCC позволяет SELECT выполняться, пока другая транзакция обновляет ту же строку?'

