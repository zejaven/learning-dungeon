# Theory topic: no missions (there is no practice editor) - only a Boss Fight.
bossFight:
  - id: source-of-truth
    en: 'For generated business codes, why should PostgreSQL usually be the source of truth for uniqueness?'
    ru: 'Для сгенерированных бизнес-кодов почему PostgreSQL обычно должен быть источником истины для уникальности?'
  - id: redis-good-fit
    en: 'When is Redis a good fit for uniqueness checks or reservations?'
    ru: 'Когда Redis хорошо подходит для проверок уникальности или резервирования?'
  - id: race-condition
    en: 'Why is SELECT-before-INSERT unsafe for checking uniqueness under concurrent requests?'
    ru: 'Почему SELECT перед INSERT небезопасен для проверки уникальности при параллельных запросах?'
  - id: set-nx-ex
    en: 'What does SET key value NX EX seconds give you in Redis, and what does it not guarantee?'
    ru: 'Что дает SET key value NX EX seconds в Redis и чего эта команда не гарантирует?'
  - id: hybrid-design
    en: 'Describe a design that uses Redis for speed but PostgreSQL for final correctness.'
    ru: 'Опиши дизайн, где Redis используется для скорости, а PostgreSQL для финальной корректности.'
  - id: permanent-duplicates
    en: 'What can go wrong if Redis is the only place that prevents permanent duplicate coupon codes?'
    ru: 'Что может пойти не так, если только Redis предотвращает постоянные дубликаты промокодов?'
