summary:
  en: >
    Three Java terms that sound alike but are completely unrelated: 'final' is a
    keyword (a modifier for variables, methods and classes), 'finally' is a block
    that always runs after try/catch, and 'finalize()' is a deprecated Object
    method the garbage collector might call before reclaiming an object. The only
    thing they share is the first four letters.
  ru: >
    Три термина Java, которые похоже звучат, но не связаны друг с другом: 'final' —
    это ключевое слово (модификатор для переменных, методов и классов), 'finally' —
    блок, который всегда выполняется после try/catch, а 'finalize()' — устаревший
    метод класса Object, который сборщик мусора может вызвать перед удалением
    объекта. Общего у них только первые четыре буквы.

assistantExample:
