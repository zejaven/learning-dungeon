# Challenge mission: passes when every test case in the hidden harness is green.
missions:
  - id: all-tests
    type: challenge
    title:
      en: Pass all tests
      ru: Пройди все тесты
    goal:
      en: Implement addEmployee, changeSalary, changePassport and getCard so every hidden test passes.
      ru: Реализуй addEmployee, changeSalary, changePassport и getCard, чтобы прошёл каждый скрытый тест.
    requires:
      - kind: tests

bossFight:
  - id: independence
    en: How do you make changeSalary update only the salary, leaving the passport fields untouched?
    ru: Как сделать, чтобы changeSalary менял только зарплату, не трогая паспортные поля?
  - id: command-separation
    en: Why is it valuable to model these as separate commands instead of one updateEmployee method?
    ru: Чем ценно моделировать это как отдельные команды вместо одного метода updateEmployee?
  - id: unknown-id
    en: How should a command behave when given an id that was never added, and why?
    ru: Как команда должна вести себя при id, которого никогда не добавляли, и почему?
  - id: card-vs-state
    en: getCard returns a formatted card, not the stored object. Why separate the response shape from internal state?
    ru: getCard возвращает форматированную карточку, а не хранимый объект. Зачем отделять форму ответа от внутреннего состояния?
  - id: id-generation
    en: How are ids generated here, and what would change if many threads added employees at once?
    ru: Как здесь генерируются id, и что изменилось бы, если бы много потоков добавляли сотрудников одновременно?
