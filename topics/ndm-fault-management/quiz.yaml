bossFight:
  # I. Fundamentals and the FCAPS Framework
  - id: defining-network-management
    en: 'Defining Success: According to the sources, what are the primary functions and processes that define "Network Management," and why is it critical in modern domains like IoT and big data?'
    ru: 'Определение успеха: согласно источникам, какие основные функции и процессы определяют «управление сетью» и почему оно критично в современных областях вроде IoT и больших данных?'
  - id: fcaps-interconnected-pillars
    en: 'The Interconnected Pillars: How does the FCAPS model (ISO X.700) provide a holistic approach to management, and can you provide an example of how Fault Management might rely on Configuration Management records?'
    ru: 'Взаимосвязанные столпы: как модель FCAPS (ISO X.700) обеспечивает целостный подход к управлению, и можете ли вы привести пример того, как Fault Management может опираться на записи Configuration Management?'
  - id: fault-vs-performance
    en: 'Fault vs. Performance: Discuss the key distinction between a network fault (e.g., a severed cable) and a performance issue (e.g., sluggishness due to streaming). Why does this matter for troubleshooting?'
    ru: 'Сбой против производительности: обсудите ключевое различие между сетевым сбоем (например, перерезанным кабелем) и проблемой производительности (например, медлительностью из-за стриминга). Почему это важно для поиска неисправностей?'
  - id: errors-vs-faults-propagation
    en: 'The Impact of Network Errors: Contrast "Faults" as the root cause with "Errors" as the resulting discrepancies. How can an error propagate through a network if left unchecked?'
    ru: 'Влияние сетевых ошибок: сопоставьте «сбои» (faults) как первопричину с «ошибками» (errors) как результирующими расхождениями. Как ошибка может распространяться по сети, если её не остановить?'
  # II. Taxonomy and Lifecycle of Faults
  - id: hard-vs-soft-faults
    en: 'Hard vs. Soft Faults: Compare Hard Faults (total failure) with Soft Faults (abnormal operation). Which do you believe is more difficult for an automated system to detect?'
    ru: 'Hard против Soft: сравните hard faults (полный отказ) и soft faults (аномальную работу). Какие из них, по вашему мнению, сложнее обнаружить автоматизированной системе?'
  - id: temporal-fault-categories
    en: 'Temporal Categorisation: How do Permanent, Transient, and Intermittent faults differ in their requirements for technician intervention?'
    ru: 'Временная категоризация: чем постоянные (Permanent), кратковременные (Transient) и перемежающиеся (Intermittent) сбои различаются по требованиям к вмешательству техника?'
  - id: six-stage-lifecycle
    en: 'The Six-Stage Lifecycle: Walk through the FM Lifecycle from detection to reporting. Why is the "Verification" stage essential before closing a trouble ticket?'
    ru: 'Шестиэтапный жизненный цикл: пройдите по жизненному циклу FM от обнаружения до отчётности. Почему этап «Verification» (проверка) необходим перед закрытием заявки?'
  - id: proactive-fm-business-case
    en: 'The Business Case for Proactive FM: The sources suggest proactive fault management can reduce outage costs by 40–60%. Beyond direct costs, what are the intangible benefits to customer trust and legal compliance?'
    ru: 'Бизнес-обоснование проактивного FM: источники утверждают, что проактивное управление сбоями может сократить стоимость простоев на 40–60%. Помимо прямых затрат, каковы нематериальные выгоды для доверия клиентов и соблюдения правовых норм?'
  # III. Detection and Monitoring Strategies
  - id: passive-vs-active-monitoring
    en: 'Passive vs. Active Monitoring: Contrast Event-Driven monitoring (SNMP Traps/Syslog) with Polling-based monitoring (ICMP/Ping). What are the bandwidth trade-offs for each?'
    ru: 'Пассивный против активного мониторинга: сопоставьте событийный мониторинг (SNMP traps/syslog) с мониторингом на основе опроса (ICMP/Ping). Каковы компромиссы по полосе пропускания у каждого?'
  - id: polling-formula
    en: 'The Polling Formula: Discuss the mathematical factors that determine Time to Detection. How does adjusting the polling interval impact the speed of discovery versus network overhead?'
    ru: 'Формула опроса: обсудите математические факторы, определяющие Time to Detection. Как изменение интервала опроса влияет на скорость обнаружения по сравнению с сетевыми накладными расходами?'
  - id: managing-alarm-storms
    en: 'Managing "Alarm Storms": What is an Alarm Storm, and how can severity filtering (Critical vs. Low) help prevent a technician from being overwhelmed by a single fault?'
    ru: 'Управление «alarm storms»: что такое Alarm Storm и как фильтрация по серьёзности (Critical против Low) помогает не дать одному сбою завалить техника оповещениями?'
  - id: rmon-advantages
    en: 'Remote Monitoring (RMON) Advantages: How does RMON allow devices to monitor themselves against set thresholds, and why is this more efficient than traditional central polling?'
    ru: 'Преимущества Remote Monitoring (RMON): как RMON позволяет устройствам самостоятельно отслеживать себя относительно заданных порогов и почему это эффективнее традиционного центрального опроса?'
  - id: role-of-mibs
    en: 'The Role of MIBs: Explain the importance of Management Information Bases (MIBs) in ensuring that a Network Management System (NMS) can interpret alerts from diverse hardware vendors.'
    ru: 'Роль MIB: объясните важность Management Information Base (MIB) для того, чтобы система управления сетью (NMS) могла интерпретировать оповещения от оборудования разных производителей.'
  # IV. Isolation, Diagnosis, and Root Cause Analysis (RCA)
  - id: structured-rca-frameworks
    en: 'Structured RCA Frameworks: Compare the use of the "Five Whys" iterative questioning with Fishbone Diagrams for investigating the primary origin of a problem.'
    ru: 'Структурированные каркасы RCA: сравните использование итеративных вопросов «Пять почему» с диаграммами Исикавы («рыбья кость») для исследования первичного источника проблемы.'
  - id: split-half-vs-hop-by-hop
    en: 'Technical Isolation Tactics: In what specific scenarios would Split-Half Troubleshooting be more effective than a Hop-by-Hop Trace Analysis?'
    ru: 'Тактики технической изоляции: в каких конкретных сценариях метод половинного деления (Split-Half Troubleshooting) эффективнее пошагового анализа трассы (hop-by-hop)?'
  - id: dependency-graph-approaches
    en: 'Dependency Graph-Based Approaches: How does modelling a network as a graph with weighted edges help determine the conditional probability that one device''s failure caused another''s?'
    ru: 'Подходы на основе графов зависимостей: как моделирование сети в виде графа со взвешенными рёбрами помогает определить условную вероятность того, что отказ одного устройства вызвал отказ другого?'
  - id: pattern-mining-alarms
    en: 'Pattern Mining: How do Association Rule Mining and Sequential Pattern Mining help discover relationships between alarms that precede a major failure?'
    ru: 'Pattern mining: как association rule mining и sequential pattern mining помогают обнаруживать связи между аварийными сигналами, предшествующими крупному отказу?'
  # V. Resolution, Metrics, and Future Trends
  - id: mitigation-vs-permanent-fix
    en: 'Immediate Mitigation vs. Permanent Fix: How do protocols like OSPF or VRRP provide immediate fault mitigation, and how does this differ from permanent procedures like hardware replacement?'
    ru: 'Немедленная митигация против постоянного исправления: как протоколы вроде OSPF или VRRP обеспечивают немедленную митигацию сбоя и чем это отличается от постоянных процедур вроде замены оборудования?'
  - id: mttr-vs-mttd
    en: 'Key Performance Metrics: Why is MTTR (Mean Time to Repair) considered the primary metric to minimise, and how does it differ from MTTD (Mean Time to Detection)?'
    ru: 'Ключевые метрики: почему MTTR (Mean Time to Repair) считается главной метрикой для минимизации и чем он отличается от MTTD (Mean Time to Detection)?'
  - id: shift-to-aiops
    en: 'The Shift to AIOps: How are Artificial Neural Networks and Bayesian Networks being used to create self-healing networks, and how might SDN change the "Isolate" phase of fault management?'
    ru: 'Сдвиг к AIOps: как искусственные нейронные сети и байесовские сети используются для создания самовосстанавливающихся сетей и как SDN может изменить фазу «изоляции» в управлении сбоями?'
