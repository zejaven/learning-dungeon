id: exception-basics
languages: [en, ru]
title:
  en: Exceptions in Java and Their Types
  ru: Исключения в Java и их типы
category:
  en: Java Core / Exceptions
  ru: Java Core / Исключения
type: OTHER
aiProvider: claude
aiModel: claude-opus-4-8
categoryId: exceptions
difficulty: 1
catalogId: exceptions-3
style: Real world
summary:
  en: >
    How Java exceptions are structured: the Throwable hierarchy (Error, checked
    Exception, unchecked RuntimeException), how a thrown exception unwinds the
    call stack until a matching catch handles it, how finally runs on the way out,
    and what an uncaught exception means.
  ru: >
    Как устроены исключения в Java: иерархия Throwable (Error, проверяемое
    Exception, непроверяемое RuntimeException), как брошенное исключение
    раскручивает стек вызовов до подходящего catch, как finally выполняется при
    выходе и что означает непойманное исключение.

primitives:
  - ArrayGrid
  - EventLog

defaultExample: catch-and-propagate

examples:
  - id: checked-vs-unchecked
    title:
      en: Tour of the type hierarchy
      ru: Тур по иерархии типов
    file: 01-checked-vs-unchecked.java
    explanation:
      en: >
        Classifies common types without throwing them. NullPointerException is
        unchecked (RuntimeException), IOException is checked, OutOfMemoryError is
        an Error you are not meant to catch.
      ru: >
        Классифицирует распространённые типы, не бросая их. NullPointerException —
        непроверяемое (RuntimeException), IOException — проверяемое, а
        OutOfMemoryError — это Error, который ловить не принято.
  - id: uncaught
    title:
      en: Uncaught exception
      ru: Непойманное исключение
    file: 02-uncaught.java
    explanation:
      en: >
        No frame catches the exception, so it unwinds the whole stack and the
        thread terminates with a stack trace.
      ru: >
        Ни один фрейм не ловит исключение, поэтому оно раскручивает весь стек, и
        поток завершается со стектрейсом.
  - id: catch-and-propagate
    title:
      en: Propagate then catch
      ru: Распространение и catch
    file: 03-catch-and-propagate.java
    explanation:
      en: >
        The exception is thrown deep in parsePort(), propagates up one frame, and
        is caught by main's catch (RuntimeException).
      ru: >
        Исключение бросается глубоко в parsePort(), поднимается на один фрейм и
        ловится в main с помощью catch (RuntimeException).
  - id: finally
    title:
      en: finally on the way out
      ru: finally при выходе
    file: 04-finally.java
    explanation:
      en: >
        withResource() has a finally but no catch: its finally still runs while
        the exception unwinds, then main catches the exception.
      ru: >
        У withResource() есть finally, но нет catch: его finally всё равно
        выполняется при раскрутке, а затем main ловит исключение.
  - id: checked-exception
    title:
      en: Checked exception
      ru: Проверяемое исключение
    file: 05-checked-exception.java
    explanation:
      en: >
        FileNotFoundException is a checked IOException: the compiler forces
        loadFile() to declare it (throws) and the caller to handle it.
      ru: >
        FileNotFoundException — проверяемое IOException: компилятор заставляет
        loadFile() объявить его (throws), а вызывающий код — обработать.

assistantExample:
  en: "e.g. What is the difference between checked and unchecked exceptions?"
  ru: "например: В чём разница между проверяемыми и непроверяемыми исключениями?"

missionsFile: quiz.yaml
