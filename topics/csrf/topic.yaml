id: csrf
languages: [en, ru]
title:
  en: 'Cross-Site Request Forgery (CSRF)'
  ru: 'Межсайтовая подделка запроса (CSRF)'
category:
  en: Security & Authentication
  ru: Безопасность и аутентификация
type: HTTP
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: security
difficulty: 1
catalogId: security-2
summary:
  en: >
    CSRF is what happens when another site makes your user's browser send a
    request to you, and the browser attaches the session cookie because the
    request is addressed to you. The server then receives a perfectly
    authenticated action nobody asked for: the session is real, the IP is the
    user's, and the audit row says the user did it. The root cause is that a
    cookie is 'ambient' authority — applied by destination, not by intent — so
    stronger login, MFA or HTTPS change nothing. The fixes work by proving the
    request was assembled by a page of yours: a synchronizer token the attacker
    cannot read, an 'Origin' check the attacker cannot forge, and 'SameSite'
    cookies the browser enforces before the request leaves. Note that
    'SameSite=Lax' still permits a top-level GET, that a cross-site form can
    POST without any permission, and that once a site has XSS every CSRF token
    on it can simply be read off the page.
  ru: >
    CSRF — это когда чужой сайт заставляет браузер вашего пользователя отправить
    запрос вам, а браузер прикрепляет к нему cookie сессии, потому что запрос
    адресован вам. Сервер получает полностью аутентифицированное действие, о
    котором никто не просил: сессия настоящая, IP пользовательский, и в журнале
    аудита написано, что это сделал пользователь. Корень проблемы в том, что
    cookie — это ambient-полномочия, применяемые по адресу назначения, а не по
    намерению, поэтому более строгий вход, MFA и HTTPS тут ничего не меняют.
    Защиты работают тем, что доказывают: запрос собрала ваша же страница —
    синхронизирующий токен, который злоумышленнику не прочитать, проверка
    'Origin', которую ему не подделать, и cookie 'SameSite', которые браузер
    применяет ещё до отправки запроса. Учтите, что 'SameSite=Lax' по-прежнему
    пропускает переход методом GET, что кросс-сайтовая форма может делать POST
    вообще без разрешения и что при наличии XSS любой CSRF-токен просто
    считывается со страницы.

# Visual primitives this topic's visualizer composes (frontend).
primitives:
  - BoxGroup

defaultExample: what-csrf-is

# Examples shown as buttons. `file` is relative to examples/.
examples:
  - id: what-csrf-is
    title:
      en: 'A request the user never made'
      ru: 'Запрос, которого пользователь не делал'
    file: 01-what-csrf-is.java
    explanation:
      en: >
        Two requests arrive at the same endpoint, in the same session, and the
        server cannot tell them apart — because there is nothing to tell apart.
        Only one of them was wanted. Watch the step where the browser attaches
        the cookie: nobody wrote that line, and it is the entire vulnerability.
      ru: >
        На один и тот же эндпоинт в одной и той же сессии приходят два запроса,
        и сервер не может их различить — потому что различать нечего. Хотели
        только один из них. Обратите внимание на шаг, где браузер прикрепляет
        cookie: этой строки никто не писал, и в ней вся уязвимость.
  - id: no-click-needed
    title:
      en: 'A GET that changes things'
      ru: 'GET, который что-то меняет'
    file: 02-no-click-needed.java
    explanation:
      en: >
        If a state change is reachable by GET, an <img> tag is the whole attack:
        it needs no form, no JavaScript and no click, and it works from an email
        or a forum post. Keeping GET read-only removes that class of delivery —
        and the second half shows why 'we only accept POST' is not the answer.
      ru: >
        Если изменение состояния достижимо через GET, целой атакой становится
        тег <img>: ему не нужны ни форма, ни JavaScript, ни клик, и он работает
        из письма или сообщения на форуме. Запрет менять состояние по GET
        убирает этот класс доставки — а вторая половина показывает, почему «мы
        принимаем только POST» ответом не является.
  - id: samesite-cookies
    title:
      en: 'SameSite: the browser decides'
      ru: 'SameSite: решает браузер'
    file: 03-samesite-cookies.java
    explanation:
      en: >
        The only defence here that runs before the request is sent, and the
        cheapest one to deploy. Look closely at the second attempt: Lax blocks
        the cross-site POST and deliberately allows a top-level GET navigation,
        so the gap it leaves is exactly the endpoint that changes state on a GET.
      ru: >
        Единственная здесь защита, которая срабатывает до отправки запроса, и
        самая дешёвая во внедрении. Присмотритесь ко второй попытке: Lax
        блокирует кросс-сайтовый POST и намеренно разрешает переход верхнего
        уровня методом GET, поэтому оставленная им дыра — ровно тот эндпоинт,
        который меняет состояние по GET.
  - id: csrf-token
    title:
      en: 'The synchronizer token'
      ru: 'Синхронизирующий токен'
    file: 04-csrf-token.java
    explanation:
      en: >
        The classic server-side fix, and it is worth being precise about why it
        works: not because the value is secret from the user, but because the
        same-origin policy stops the attacker's page from reading the HTML that
        contains it. The legitimate flow does not notice the defence at all.
      ru: >
        Классическая серверная починка, и стоит точно понимать, почему она
        работает: не потому, что значение секретно от пользователя, а потому,
        что правило одного источника не даёт странице злоумышленника прочитать
        HTML, в котором оно лежит. Легальный сценарий защиты вообще не замечает.
  - id: origin-check
    title:
      en: 'Check the Origin header'
      ru: 'Проверка заголовка Origin'
    file: 05-origin-check.java
    explanation:
      en: >
        The stateless alternative for an API with no pages to embed a token in.
        It works because Origin is a forbidden header name: page JavaScript
        cannot set it and the browser fills it in honestly. Notice that the
        session is accepted first and the request is refused anyway.
      ru: >
        Вариант без хранения состояния — для API, у которого нет страниц, чтобы
        встроить в них токен. Работает потому, что Origin — запрещённое для
        скрипта имя заголовка: JavaScript страницы его не выставит, а браузер
        заполняет честно. Заметьте, что сессия сначала принимается, а запрос всё
        равно отклоняется.
  - id: preflight-and-cors
    title:
      en: 'What CORS does and does not do'
      ru: 'Что делает CORS, а чего не делает'
    file: 06-preflight-and-cors.java
    explanation:
      en: >
        A JSON content type is not a shape an HTML form can produce, so the
        browser asks permission first and the request never leaves. A form asks
        nobody. The last step is the misconfiguration that undoes it: reflecting
        any Origin with credentials allowed gives the attacker the permission.
      ru: >
        JSON-тип содержимого — не та форма запроса, которую может выдать
        HTML-форма, поэтому браузер сначала спрашивает разрешение, и запрос не
        уходит вовсе. Форма не спрашивает никого. Последний шаг — та самая
        неверная настройка, которая всё отменяет: отражение любого Origin с
        разрешёнными учётными данными выдаёт разрешение злоумышленнику.
  - id: credentials-not-ambient
    title:
      en: 'Take away the ambient credential'
      ru: 'Убрать ambient-полномочия'
    file: 07-credentials-that-are-not-ambient.java
    explanation:
      en: >
        Every other defence detects the forgery; this one removes the material
        it is made of. If the credential is attached by your own JavaScript
        rather than by the browser, another site's page has nothing to borrow.
        The trade is real, though: what JavaScript can attach, XSS can read.
      ru: >
        Все прочие защиты распознают подделку — эта убирает материал, из
        которого она делается. Если учётные данные прикрепляет ваш собственный
        JavaScript, а не браузер, странице чужого сайта нечего позаимствовать.
        Но обмен настоящий: то, что может прикрепить JavaScript, может прочитать
        XSS.
  - id: xss-defeats-the-token
    title:
      en: 'XSS beats every CSRF defence'
      ru: 'XSS побеждает любую защиту от CSRF'
    file: 08-xss-defeats-the-token.java
    explanation:
      en: >
        With the token on and the cookie Strict, the cross-site attempt dies
        immediately. Then a script running on the bank's own origin does the
        same transfer, and every check agrees with it: it is same-site by
        definition and it can read the token off the page.
      ru: >
        С включённым токеном и cookie Strict кросс-сайтовая попытка умирает
        сразу. А затем тот же перевод делает скрипт, выполняющийся на origin
        самого банка, — и все проверки с ним соглашаются: он по определению
        same-site и может прочитать токен прямо со страницы.

