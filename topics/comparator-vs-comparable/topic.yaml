id: comparator-vs-comparable
title:
  en: 'Comparator vs Comparable'
  ru: 'Comparator и Comparable'
category:
  en: 'Java Core / Ordering'
  ru: 'Java Core / сортировка'
type: OTHER
mode: trace
aiProvider: codex
aiModel: gpt-5.5
summary:
  en: >
    Learn when natural ordering belongs inside Comparable, when an external
    Comparator is better, what negative/zero/positive comparison results mean,
    and how to implement compareTo() without overflow or accidental equality.
  ru: >
    Разберись, когда natural ordering должен жить внутри Comparable, когда лучше
    внешний Comparator, что означают отрицательный, нулевой и положительный
    результаты сравнения, и как реализовать compareTo() без overflow и
    случайного равенства.
categoryId: java-core
difficulty: 2
catalogId: java-core-22
style: Real world
primitives:
  - ArrayGrid
  - BoxGroup
defaultExample: comparable-natural-order
examples:
  - id: comparable-natural-order
    title:
      en: 'Comparable natural order'
      ru: 'Natural order через Comparable'
    file: 01-comparable-natural-order.java
    explanation:
      en: 'A class implements Comparable when it has one obvious default order.'
      ru: 'Класс реализует Comparable, когда у него есть один очевидный порядок по умолчанию.'
  - id: comparator-external-order
    title:
      en: 'Comparator external order'
      ru: 'Внешний порядок через Comparator'
    file: 02-comparator-external-order.java
    explanation:
      en: 'A Comparator keeps an alternative order outside the class, so the same objects can be sorted differently.'
      ru: 'Comparator держит альтернативный порядок снаружи класса, поэтому одни и те же объекты можно сортировать по-разному.'
  - id: zero-result
    title:
      en: 'Result 0 trap'
      ru: 'Ловушка результата 0'
    file: 03-zero-result.java
    explanation:
      en: 'A comparison result of 0 means the same sort position, which sorted sets treat like a duplicate.'
      ru: 'Результат сравнения 0 означает одну позицию сортировки, а отсортированные множества считают это дубликатом.'
  - id: same-class-many-orders
    title:
      en: 'One class, many orders'
      ru: 'Один класс, много порядков'
    file: 04-same-class-many-orders.java
    explanation:
      en: 'Comparable gives the domain default; Comparator gives a one-off view such as sorting employees by name.'
      ru: 'Comparable задаёт доменный порядок по умолчанию; Comparator даёт разовый взгляд, например сортировку сотрудников по имени.'
  - id: safe-compareto
    title:
      en: 'Safe compareTo()'
      ru: 'Безопасный compareTo()'
    file: 05-safe-compareto.java
    explanation:
      en: 'Integer.compare(a, b) preserves the sign even when subtraction would overflow.'
      ru: 'Integer.compare(a, b) сохраняет правильный знак даже там, где вычитание даёт overflow.'
  - id: nulls-last
    title:
      en: 'Nulls with Comparator'
      ru: 'null через Comparator'
    file: 06-nulls-last.java
    explanation:
      en: 'Comparator.nullsLast(...) explicitly defines where null values go.'
      ru: 'Comparator.nullsLast(...) явно задаёт, куда должны попасть значения null.'
assistantExample:
  en: 'e.g. Why is returning this.age - other.age risky in compareTo()?'
  ru: 'например: Почему return this.age - other.age опасен в compareTo()?'
missionsFile: quiz.yaml
