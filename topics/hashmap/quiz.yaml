# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: first-put
    title: Store your first entry
    goal: Run the code and put at least one entry into the map.
    event: HASHMAP_PUT
  - id: collision
    title: Create a collision
    goal: Make two keys land in the same bucket (try keys "Aa" and "BB").
    event: HASHMAP_COLLISION
  - id: resize
    title: Trigger a resize
    goal: Insert more than 12 entries so the map doubles its capacity.
    event: HASHMAP_RESIZE

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - How does HashMap turn a key into a bucket index?
  - What happens on a collision, and what changed in Java 8?
  - Why is a mutable key a bad idea?
  - When and how does a HashMap resize?
  - Why is HashMap not thread-safe, and what would you use instead?
