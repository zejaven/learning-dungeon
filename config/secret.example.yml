# Template for config/secret.yml (which is git-ignored).
# Copy this file to config/secret.yml and fill in your local DB credentials.
db:
  username: postgres
  password: your-password-here

# Access from other devices (e.g. your phone). Leave it out entirely to keep the
# app loopback-only, which is the default. `launcher\remote.ps1 -Setup` writes
# this block for you, generates the token and prints the URL to open.
#
#   mode: direct   — the server listens on the LAN; also set app.bind-address below
#   mode: proxied  — Tailscale Serve (or the Vite dev server) forwards to 127.0.0.1;
#                    keep the server on loopback in this mode
#
# remote:
#   mode: proxied
#   token: 'at-least-16-characters'
#   # /api/run, /api/sql, /api/challenge, /api/analyze compile and execute what
#   # the caller sends. The phone UI does not use them; leave this off.
#   allow-code-execution: false
#
# Only for mode: direct — otherwise the server stays on 127.0.0.1.
# app:
#   bind-address: 0.0.0.0
