id: jvm-memory-areas
title:
  en: 'How Java Memory Is Organized: Stack vs Heap'
  ru: 'Как устроена память в Java: стек и куча'
category:
  en: JVM / Memory & GC
  ru: JVM / Память и GC
type: JVM_MEMORY
mode: trace
aiProvider: claude
aiModel: claude-opus-4-8
categoryId: memory-gc
difficulty: 2
catalogId: memory-gc-5
style: Real world
summary:
  en: >
    How the JVM splits runtime memory into areas and what the two you are asked
    about most actually do: the stack holds one frame per method call (locals and
    primitive values) and is private to each thread, while the heap holds every
    object and is shared by all threads and managed by the garbage collector.
  ru: >
    Как JVM делит память на области во время выполнения и что на самом деле делают
    две из них, о которых спрашивают чаще всего: стек хранит по одному кадру на
    каждый вызов метода (локальные переменные и значения примитивов) и приватен
    для каждого потока, а куча хранит все объекты, общая для всех потоков и
    управляется сборщиком мусора.

primitives:
  - BoxGroup

defaultExample: stack-holds-locals

examples:
  - id: stack-holds-locals
    title:
      en: Stack holds locals
      ru: Стек хранит локальные переменные
    file: 01-stack-holds-locals.java
    explanation:
      en: >
        Primitive locals live directly in the current method's stack frame. Each
        slot holds the value itself, and copying one copies the value.
      ru: >
        Примитивные локальные переменные живут прямо в кадре текущего метода на
        стеке. Каждый слот хранит само значение, и копирование копирует значение.
  - id: heap-holds-objects
    title:
      en: Heap holds objects
      ru: Куча хранит объекты
    file: 02-heap-holds-objects.java
    explanation:
      en: >
        new puts the object on the heap; the variable on the stack only holds a
        reference (a handle) to it. The object and the handle live in different
        areas.
      ru: >
        new кладёт объект в кучу; переменная на стеке хранит лишь ссылку
        (указатель) на него. Объект и ссылка живут в разных областях.
  - id: stack-is-per-call
    title:
      en: Stack is per call
      ru: Стек — на каждый вызов
    file: 03-stack-is-per-call.java
    explanation:
      en: >
        Calling a method pushes a new frame; returning pops it and discards its
        locals. The heap object survives only while something still references it.
      ru: >
        Вызов метода добавляет новый кадр; возврат снимает его и выбрасывает его
        локальные переменные. Объект в куче выживает, только пока на него есть
        ссылка.
  - id: heap-is-shared
    title:
      en: Heap is shared
      ru: Куча общая
    file: 04-heap-is-shared.java
    explanation:
      en: >
        Two references can point at the SAME heap object. A change through one is
        visible through the other — heap objects are shared, stack slots are not.
      ru: >
        Две ссылки могут указывать на ОДИН объект в куче. Изменение через одну
        видно через другую — объекты в куче общие, слоты стека — нет.
  - id: heap-needs-gc
    title:
      en: Heap needs GC
      ru: Куче нужен GC
    file: 05-heap-needs-gc.java
    explanation:
      en: >
        Repointing or nulling a reference can leave a heap object unreachable.
        The stack is freed automatically on return; unreachable heap objects wait
        for the garbage collector.
      ru: >
        Переприсваивание или обнуление ссылки может оставить объект в куче
        недостижимым. Стек освобождается автоматически при возврате; недостижимые
        объекты в куче ждут сборщик мусора.

