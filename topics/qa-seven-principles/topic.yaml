summary:
  en: >
    The seven classic ISTQB testing principles every QA interview starts with:
    testing shows the presence of defects, exhaustive testing is impossible,
    early testing saves money, defects cluster together, the pesticide paradox,
    testing is context dependent, and the absence-of-errors fallacy
    (verification is not validation) — with the canonical examples for each.
  ru: >
    Семь классических принципов тестирования ISTQB, с которых начинается
    почти любое QA-собеседование: тестирование показывает наличие дефектов,
    исчерпывающее тестирование невозможно, раннее тестирование экономит деньги,
    скопление дефектов, парадокс пестицидов, зависимость тестирования от
    контекста и заблуждение об отсутствии ошибок (верификация — это не
    валидация) — с каноническими примерами к каждому.

assistantExample:
  en: "e.g. Name the seven testing principles and explain why exhaustive testing is impossible."
  ru: "например: Перечислите 7 принципов тестирования и объясните, почему исчерпывающее тестирование невозможно."

