categoryId: qa-process
categoryName: 'QA Process'
difficulty: 1
summary:
  en: >
    The core artifacts of QA documentation and why teams write them: the test
    plan (scope, strategy, resources, schedule, risks, entry and exit
    criteria), the test suite as a named collection of test cases, the test
    case with preconditions, steps and expected results, the lightweight
    check-list as its one-line counterpart, and test reports that summarize
    execution results for stakeholders. How these artifacts differ, when each
    is appropriate, and how documentation keeps testing reproducible and
    transparent.
  ru: >
    Основные артефакты тестовой документации и зачем они нужны: тест-план
    (объём работ, стратегия, ресурсы, расписание, риски, критерии входа и
    выхода), тест-сьют как именованный набор тест-кейсов, тест-кейс с
    предусловиями, шагами и ожидаемым результатом, облегчённый чек-лист как
    его однострочная альтернатива и тест-репорты, подводящие итоги прогона
    для стейкхолдеров. Чем артефакты отличаются, когда какой уместен и как
    документация делает тестирование воспроизводимым и прозрачным.

assistantExample:
  en: "e.g. What is the difference between a check-list and a test case, and when would you use each?"
  ru: "например: Чем чек-лист отличается от тест-кейса и когда что использовать?"

