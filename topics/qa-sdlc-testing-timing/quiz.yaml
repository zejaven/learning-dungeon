bossFight:
  - id: sdlc-definition-stages
    en: 'What is the software development life cycle (SDLC)? Name its main stages from start to finish.'
    ru: 'Что такое жизненный цикл ПО (SDLC)? Назовите его основные этапы от начала до конца.'
  - id: testing-place-in-sdlc
    en: 'Is testing a single stage of the SDLC? Explain where testing activities actually appear across the life cycle.'
    ru: 'Является ли тестирование одним из этапов SDLC? Объясните, где на самом деле возникают активности тестирования в жизненном цикле.'
  - id: when-start-testing
    en: 'When should testing start in a project, and why is "as soon as possible" the economically right answer?'
    ru: 'Когда следует начинать тестирование в проекте и почему ответ «как можно раньше» экономически правильный?'
  - id: static-before-software
    en: 'How can testing begin before the software itself exists? What is static testing and what does it catch?'
    ru: 'Как тестирование может начаться до появления самого ПО? Что такое статическое тестирование и какие ошибки оно находит?'
  - id: static-vs-dynamic
    en: 'Explain the difference between static and dynamic testing. Which defects found dynamically could have been caught statically?'
    ru: 'Объясните разницу между статическим и динамическим тестированием. Какие дефекты, найденные динамически, можно было поймать статически?'
  - id: stop-vs-finish
    en: 'What is the difference between stopping testing and finishing it? Give examples of reasons for each.'
    ru: 'В чём разница между остановкой тестирования и его завершением? Приведите примеры причин для каждого случая.'
  - id: exit-criteria
    en: 'What are exit criteria? Describe the conditions under which testing is considered complete.'
    ru: 'Что такое критерии выхода (exit criteria)? Опишите условия, при которых тестирование считается завершённым.'
  - id: time-up-bugs-left
    en: 'Follow-up: the testing time is up, but critical bugs remain. Is testing finished, and who decides about the release?'
    ru: 'Follow-up: время на тестирование вышло, а критические баги остались. Завершено ли тестирование и кто принимает решение о релизе?'
