summary:
  en: >
    Database indexes are auxiliary lookup structures that help the database find
    rows without scanning the whole table. Learn how B-tree indexes work, why
    selectivity and composite column order matter, and what trade-offs indexes
    add to writes and storage.
  ru: >
    Индексы в базе данных - это вспомогательные структуры поиска, которые помогают
    базе находить строки без полного просмотра таблицы. Разбери, как работают
    B-tree индексы, почему важны селективность и порядок колонок в составном
    индексе, и какие издержки индексы добавляют к записи и хранению.

