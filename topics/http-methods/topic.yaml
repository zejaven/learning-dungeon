id: http-methods
languages: [en, ru]
title:
  en: 'HTTP and Its Methods'
  ru: 'HTTP и его методы'
category:
  en: Networking / HTTP
  ru: Сети / HTTP
type: HTTP
mode: trace
aiProvider: claude
aiModel: claude-opus-5
categoryId: networking
difficulty: 1
catalogId: networking-7
summary:
  en: >
    HTTP is a stateless text-based request/response protocol: the client sends a
    method, a path and headers (sometimes a body), the server answers with a
    status line, headers and an optional body. The methods all travel the same
    way — what separates them is the promise each one makes. GET, HEAD and
    OPTIONS are safe (they must not change server state), so anything on the
    path may cache, prefetch or repeat them. GET, HEAD, OPTIONS, PUT and DELETE
    are idempotent: N identical calls leave the same state as one, which is what
    makes a retry after a timeout tolerable. POST and PATCH are neither, so
    repeating them creates or applies something twice. The traps are treating a
    GET handler as a place to write, believing idempotent means "the same
    response", and reaching for POST when the client already knows the URL.
  ru: >
    HTTP — это текстовый протокол «запрос-ответ» без состояния: клиент
    отправляет метод, путь и заголовки (иногда тело), сервер отвечает строкой
    статуса, заголовками и необязательным телом. Все методы идут по проводу
    одинаково — различает их обещание, которое даёт каждый. GET, HEAD и OPTIONS
    безопасны (не должны менять состояние сервера), поэтому любой участник на
    пути вправе их кэшировать, предзагружать и повторять. GET, HEAD, OPTIONS,
    PUT и DELETE идемпотентны: N одинаковых вызовов оставляют то же состояние,
    что и один, — именно это делает повтор после таймаута терпимым. POST и PATCH
    не дают ни того, ни другого, поэтому их повтор создаёт или применяет
    изменение дважды. Ловушки: писать в обработчике GET, считать, что
    идемпотентность — это «одинаковый ответ», и брать POST там, где клиент уже
    знает URL.

# Visual primitives this topic's visualizer composes (frontend).
primitives:
