bossFight:
- id: stressful-situations
  ru: Какие рабочие ситуации вызывают у вас наибольшее напряжение и как вы с этим справляетесь? Что проверяет этот вопрос?
  en: Какие рабочие ситуации вызывают у вас наибольшее напряжение и как вы с этим справляетесь? Что проверяет этот вопрос?
- id: dev-rejects-bug-no-comments
  ru: Разработчик без комментариев отклоняет ваш баг. Ваши действия? На какие объективные артефакты вы будете опираться?
  en: Разработчик без комментариев отклоняет ваш баг. Ваши действия? На какие объективные артефакты вы будете опираться?
- id: development-plans
  ru: 'Расскажите о своих планах по развитию: на ближайшее время и в долгосрочной перспективе (от года). Как построить ответ, чтобы он не звучал как клише?'
  en: 'Расскажите о своих планах по развитию: на ближайшее время и в долгосрочной перспективе (от года). Как построить ответ, чтобы он не звучал как клише?'
- id: qa-motivation
  ru: Какая у вас основная мотивация на работе сейчас? Что больше всего нравится в работе QA-инженера?
  en: Какая у вас основная мотивация на работе сейчас? Что больше всего нравится в работе QA-инженера?
- id: mentoring-and-knowledge-sources
  ru: Есть ли у вас опыт менторства или обучения новых QA-инженеров? Что важно при обучении нового сотрудника и откуда вы получаете актуальные знания в тестировании?
  en: Есть ли у вас опыт менторства или обучения новых QA-инженеров? Что важно при обучении нового сотрудника и откуда вы получаете актуальные знания в тестировании?
- id: critical-bug-hour-before-release
  ru: После ухода программиста вы находите критический баг, а релиз через час. Что будете делать? Кто принимает финальное решение о релизе?
  en: После ухода программиста вы находите критический баг, а релиз через час. Что будете делать? Кто принимает финальное решение о релизе?
- id: friday-evening-three-tasks
  ru: 'Пятница, вечер. Одновременно приходят: саппорт просит воспроизвести жалобу пользователей, программист предлагает выкатить хотфикс, менеджер — проверить и выкатить новую фичу «на миллионы». Как поступите с тремя задачами?'
  en: 'Пятница, вечер. Одновременно приходят: саппорт просит воспроизвести жалобу пользователей, программист предлагает выкатить хотфикс, менеджер — проверить и выкатить новую фичу «на миллионы». Как поступите с тремя задачами?'
- id: prioritization-with-deadlines
  ru: Несколько срочных задач, в дедлайны не успеваете. Как расставите приоритеты и что сделаете помимо перестановки задач?
  en: Несколько срочных задач, в дедлайны не успеваете. Как расставите приоритеты и что сделаете помимо перестановки задач?
- id: missed-bug-and-unclear-task
  ru: Были ли случаи, когда вы пропускали баг? Что сделали, чтобы это не повторилось? И что будете делать, если задача описана непонятно или документации нет вовсе?
  en: Были ли случаи, когда вы пропускали баг? Что сделали, чтобы это не повторилось? И что будете делать, если задача описана непонятно или документации нет вовсе?
