summary:
  en: >
    A query plan is the step-by-step strategy the database optimizer chooses to
    execute your SQL: which scans, joins, sorts and index lookups to run, and in
    what order. Learn how to read an EXPLAIN plan, why the optimizer is cost-based
    and statistics-driven, and what the common operators (Seq Scan, Index Scan,
    Nested Loop, Hash Join) mean.
  ru: >
    План запроса - это пошаговая стратегия, которую оптимизатор базы выбирает для
    выполнения вашего SQL: какие сканирования, соединения, сортировки и обращения
    к индексам выполнить и в каком порядке. Разбери, как читать план EXPLAIN,
    почему оптимизатор стоимостный и опирается на статистику, и что означают
    типовые операторы (Seq Scan, Index Scan, Nested Loop, Hash Join).

