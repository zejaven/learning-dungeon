summary:
  en: >
    The programming minimum a QA engineer is expected to know at an interview:
    variables and constants in C#, core data types and how they appear in JSON,
    loops and the structure of an algorithm, design patterns and anti-patterns,
    plus the everyday toolchain — Git (clone, push, branches, Git Flow), CI/CD,
    GUI vs CLI interfaces, and sniffers vs browser DevTools. This topic is the
    bridge from manual testing to test automation.
  ru: >
    Минимум программирования, который ждут от QA-инженера на собеседовании:
    переменные и константы в C#, основные типы данных и как они выглядят в JSON,
    циклы и структура алгоритма, паттерны и антипаттерны, а также рабочий
    инструментарий — Git (clone, push, ветки, Git Flow), CI/CD, интерфейсы
    GUI и CLI, снифферы и DevTools. Эта тема — мостик от ручного тестирования
    к автоматизации.

assistantExample:
