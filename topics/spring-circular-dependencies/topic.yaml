id: spring-circular-dependencies
title:
  en: Spring Circular Bean Dependencies
  ru: Циклические зависимости бинов Spring
category:
  en: Spring / Core Container
  ru: Spring / Core Container
type: SPRING
mode: trace
aiProvider: codex
aiModel: gpt-5.5
categoryId: spring
difficulty: 2
catalogId: spring-8
style: Real world
summary:
  en: >
    What happens when Spring tries to create beans in a cycle such as A -> B ->
    C -> A, why constructor cycles fail, how to avoid the cycle by changing the
    design, and when a deferred reference such as @Lazy or ObjectProvider is an
    acceptable last resort.
  ru: >
    Что происходит, когда Spring пытается создать beans в цикле A -> B -> C ->
    A, почему constructor cycles ломают startup, как убрать цикл изменением
    дизайна и когда отложенная ссылка вроде @Lazy или ObjectProvider допустима
    как крайний вариант.

primitives:
  - ArrayGrid
  - LinkedNodes
  - EventLog

defaultExample: constructor-cycle

examples:
  - id: constructor-cycle
    title:
      en: Constructor cycle fails
      ru: Constructor cycle падает
    file: 01-constructor-cycle.java
    explanation:
      en: >
        A needs B, B needs C, and C immediately needs A again. The creation stack
        already contains A, so the simulated container emits a cycle detection
        event and startup fails.
      ru: >
        A нужен B, B нужен C, а C сразу снова нужен A. Creation stack уже содержит
        A, поэтому учебный container выдаёт событие обнаружения цикла и startup
        падает.
  - id: acyclic-refactor
    title:
      en: Refactor to acyclic graph
      ru: Рефакторинг в ацикличный graph
    file: 02-acyclic-refactor.java
    explanation:
      en: >
        The shared rule is extracted into a separate bean. Dependencies now point
        in one direction, so every bean can be created before the next one needs
        it.
      ru: >
        Общая rule вынесена в отдельный bean. Dependencies теперь направлены в
        одну сторону, поэтому каждый bean можно создать до того, как он понадобится
        следующему.
  - id: lazy-back-reference
    title:
      en: Break with @Lazy
      ru: Разрыв через @Lazy
    file: 03-lazy-back-reference.java
    explanation:
      en: >
        C receives a @Lazy proxy for A instead of forcing A to be created while
        A is still on the stack. After startup, the first use of that proxy
        resolves the real A.
      ru: >
        C получает @Lazy proxy для A вместо того, чтобы заставлять Spring создавать
        A, пока A ещё находится в stack. После startup первое обращение к proxy
        находит настоящий A.
  - id: provider-lookup
    title:
      en: Use ObjectProvider
      ru: Использовать ObjectProvider
    file: 04-provider-lookup.java
    explanation:
      en: >
        ObjectProvider makes the deferred dependency explicit. Startup injects a
        provider object, and C asks for A later only when the method really needs
        it.
      ru: >
        ObjectProvider делает отложенную dependency явной. На startup внедряется
        provider object, а C запрашивает A позже, только когда методу он действительно
        нужен.

assistantExample:
  en: 'e.g. Why does A -> B -> C -> A fail with constructor injection, and when would @Lazy be acceptable?'
  ru: 'например: Почему A -> B -> C -> A падает при constructor injection и когда @Lazy допустим?'

