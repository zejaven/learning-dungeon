bossFight:
  - id: what-is-load-testing
    en: 'What is load testing and what goals does it serve? How does it differ from functional testing?'
    ru: 'Что такое нагрузочное тестирование и для каких целей оно проводится? Чем оно отличается от функционального?'
  - id: load-vs-stress
    en: 'Explain the difference between load, stress, spike, and soak testing. What question does each type answer?'
    ru: 'Объясните разницу между load, stress, spike и soak тестированием. На какой вопрос отвечает каждый вид?'
  - id: load-testing-experience
    en: 'Have you ever run load testing yourself? Walk us through how you organized it.'
    ru: 'Приходилось ли вам проводить нагрузочное тестирование? Расскажите, как вы его организовывали.'
  - id: load-testing-tools
    en: 'Which load testing tools have you used? How would you choose between JMeter, k6, Gatling, and Locust?'
    ru: 'Какие инструменты нагрузочного тестирования вы использовали? Как бы вы выбирали между JMeter, k6, Gatling и Locust?'
  - id: percentiles-over-average
    en: 'Why do we look at latency percentiles (p95, p99) instead of the average response time?'
    ru: 'Почему мы смотрим на перцентили latency (p95, p99), а не на среднее время ответа?'
  - id: users-vs-rps
    en: 'What is the difference between concurrent virtual users and RPS? Can 1000 VU produce only 100 RPS?'
    ru: 'В чём разница между количеством виртуальных пользователей и RPS? Могут ли 1000 VU давать всего 100 RPS?'
  - id: finding-bottleneck
    en: 'Metrics degrade under load: p99 latency is climbing. How do you localize the bottleneck?'
    ru: 'Под нагрузкой метрики деградируют: растёт p99 latency. Как вы будете локализовать узкое место?'
  - id: load-profile
    en: 'Where do you get the numbers for a load profile if the system has not launched yet?'
    ru: 'Откуда взять числа для профиля нагрузки, если система ещё не запущена в прод?'
