summary:
  en: >
    Designing networks that are easy to monitor, maintain, and troubleshoot:
    the four pillars of manageability (visibility via SNMP vs streaming
    telemetry, standardisation and golden images, automation with SDN and IaC,
    fault isolation), in-band vs out-of-band management, the FCAPS model, the
    hierarchical Cisco model, the 80/20 rule, deterministic routing, design
    anti-patterns, and documentation.
  ru: >
    Проектирование сетей, которые легко мониторить, обслуживать и
    диагностировать: четыре столпа управляемости (видимость через SNMP и
    streaming telemetry, стандартизация и golden images, автоматизация через
    SDN и IaC, изоляция сбоев), in-band и out-of-band управление, модель FCAPS,
    иерархическая модель Cisco, правило 80/20, детерминированная маршрутизация,
    анти-паттерны дизайна и документация.

assistantExample:
