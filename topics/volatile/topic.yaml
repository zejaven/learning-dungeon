id: volatile
title:
  en: The volatile Keyword
  ru: Ключевое слово volatile
category:
  en: Java Core / Concurrency
  ru: Java Core / Многопоточность
type: CONCURRENCY
mode: trace
summary:
  en: >
    What volatile guarantees in Java: visibility of the latest write, ordering
    through a happens-before edge, and why it still does not make compound
    operations like count++ atomic.
  ru: >
    Что гарантирует volatile в Java: visibility последней записи, ordering через
    happens-before связь и почему он всё равно не делает составные операции вроде
    count++ атомарными.
categoryId: concurrency
difficulty: 2
catalogId: concurrency-10
style: Real world
aiProvider: codex
aiModel: gpt-5.5

primitives:
  - ArrayGrid
  - EventLog

defaultExample: volatile-flag

examples:
  - id: volatile-flag
    title:
      en: Volatile publication
      ru: Публикация через volatile
    file: 01-volatile-flag.java
    explanation:
      en: >
        A writer stores plain data first, then writes a volatile ready flag.
        The reader's volatile read refreshes the published data.
      ru: >
        Writer сначала сохраняет обычное data, затем записывает volatile ready.
        Volatile-чтение у Reader обновляет опубликованное data.
  - id: plain-flag-stale
    title:
      en: Plain flag can be stale
      ru: Обычный flag может устареть
    file: 02-plain-flag-stale.java
    explanation:
      en: >
        With a non-volatile ready flag, the reader can keep seeing its old local
        value even after the writer updated main memory.
      ru: >
        С не-volatile ready flag Reader может продолжать видеть старое локальное
        значение даже после обновления main memory Writer.
  - id: acquire-refresh
    title:
      en: Acquire refresh
      ru: Acquire-обновление
    file: 03-acquire-refresh.java
    explanation:
      en: >
        Reading plain data before the volatile flag can be stale. Reading the
        volatile flag creates the acquire side and refreshes the data view.
      ru: >
        Чтение обычного data до volatile flag может быть устаревшим. Чтение
        volatile flag создаёт acquire-сторону и обновляет вид data.
  - id: volatile-counter
    title:
      en: Volatile counter trap
      ru: Ловушка volatile counter
    file: 04-volatile-counter.java
    explanation:
      en: >
        Two threads both see the latest volatile counter value, but count++ is
        still read, compute, write, so one update can disappear.
      ru: >
        Два threads оба видят последнее значение volatile counter, но count++ всё
        равно состоит из read, compute, write, поэтому одно обновление может исчезнуть.
  - id: stop-flag
    title:
      en: Stop flag
      ru: Stop flag
    file: 05-stop-flag.java
    explanation:
      en: >
        A volatile boolean is a good fit for a simple one-writer stop signal that
        many readers poll.
      ru: >
        Volatile boolean хорошо подходит для простого stop-сигнала с одним writer,
        который проверяют многие readers.

assistantExample:
  en: 'e.g. What does volatile guarantee in Java, and what does it not guarantee?'
  ru: 'например: Что гарантирует volatile в Java и чего он не гарантирует?'

missionsFile: quiz.yaml
