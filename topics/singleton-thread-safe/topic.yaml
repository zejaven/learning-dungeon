id: singleton-thread-safe
title:
  en: Thread-Safe Singleton
  ru: Потокобезопасный Singleton
category:
  en: Design Patterns / Creational
  ru: Паттерны проектирования / Порождающие
type: DESIGN_PATTERN
mode: trace
summary:
  en: >
    How Singleton restricts construction to one shared instance, why naive lazy
    initialization can create two objects under concurrency, and how
    synchronized access, double-checked locking with volatile, and enum
    Singleton solve the thread-safety problem.
  ru: >
    Как Singleton ограничивает создание одним общим экземпляром, почему наивная
    lazy initialization может создать два объекта при concurrency, и как
    synchronized доступ, double-checked locking с volatile и enum Singleton
    решают проблему thread-safety.
categoryId: design-patterns
difficulty: 2
catalogId: design-patterns-2
style: Real world
aiProvider: codex
aiModel: gpt-5.5

primitives:
  - ArrayGrid

defaultExample: basic-lazy

examples:
  - id: basic-lazy
    title:
      en: Basic lazy instance
      ru: Базовый lazy-экземпляр
    file: 01-basic-lazy.java
    explanation:
      en: >
        A lazy Singleton creates the instance on first access and returns the
        same object later, but this version has no thread-safety yet.
      ru: >
        Lazy Singleton создаёт экземпляр при первом обращении и потом возвращает
        тот же объект, но в этой версии ещё нет thread-safety.
  - id: unsafe-race
    title:
      en: Unsafe race
      ru: Небезопасная race
    file: 02-unsafe-race.java
    explanation:
      en: >
        Two simulated threads both observe null before either write is visible,
        so both construct an instance.
      ru: >
        Два смоделированных threads оба видят null до того, как запись стала
        видимой, поэтому оба создают экземпляр.
  - id: synchronized-get
    title:
      en: synchronized getInstance()
      ru: synchronized getInstance()
    file: 03-synchronized-get.java
    explanation:
      en: >
        A synchronized accessor serializes all callers, so only one thread can
        run the lazy construction path at a time.
      ru: >
        synchronized accessor выстраивает всех вызывающих по очереди, поэтому
        только один thread может выполнять lazy construction path за раз.
  - id: double-checked-locking
    title:
      en: Double-checked locking
      ru: Double-checked locking
    file: 04-double-checked-locking.java
    explanation:
      en: >
        DCL checks before the lock, checks again inside the lock, and needs a
        volatile field to publish a fully constructed object.
      ru: >
        DCL проверяет поле до lock, проверяет ещё раз внутри lock и требует
        volatile поле, чтобы опубликовать полностью созданный объект.
  - id: enum-singleton
    title:
      en: enum Singleton
      ru: enum Singleton
    file: 05-enum-singleton.java
    explanation:
      en: >
        An enum constant is initialized once by the JVM and is naturally safe
        against serialization and reflection surprises.
      ru: >
        Enum-константа инициализируется JVM один раз и естественно защищена от
        сюрпризов serialization и reflection.

assistantExample:
  en: 'e.g. Why does double-checked locking require volatile in Java?'
  ru: 'например: Почему double-checked locking в Java требует volatile?'

missionsFile: quiz.yaml
