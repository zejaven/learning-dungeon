bossFight:
  - id: when-to-automate
    en: 'When does it make sense to automate testing of an application, and what should stay manual? What is the payback logic?'
    ru: 'Когда и зачем стоит автоматизировать тестирование приложения, а что лучше оставить ручным? Какова логика окупаемости?'
  - id: page-object-pattern
    en: 'What is the PageObject pattern, where is it applied, and what concrete problems does it solve in UI test maintenance?'
    ru: 'Что такое паттерн PageObject, где он применяется и какие конкретные проблемы решает при поддержке UI-тестов?'
  - id: ci-problem-solved
    en: 'What is CI, what problem does it solve, and how are automated tests typically wired into the pipeline?'
    ru: 'Что такое CI, какую проблему он решает и как автотесты обычно встроены в pipeline?'
  - id: appium-vs-native
    en: 'Compare Appium with native mobile frameworks (Espresso, XCUITest): what are the pros and cons of each approach, and how would you choose?'
    ru: 'Сравните Appium с нативными мобильными фреймворками (Espresso, XCUITest): плюсы и минусы каждого подхода и как бы вы выбирали?'
  - id: good-autotest-checklist
    en: 'From a technical standpoint, what should a good automated test look like? List the key properties.'
    ru: 'Каким должен быть хороший автотест с технической точки зрения? Перечислите ключевые свойства.'
  - id: pizzeria-night-mocking
    en: 'Your automated tests run at night on a clean database, but ordering a pizza requires an open pizzeria and all of them are closed at night. What do you do?'
    ru: 'Автотесты запускаются ночью на чистой базе, но для заказа пиццы нужна открытая пиццерия, а ночью все закрыты. Что будете делать?'
  - id: flaky-tests-handling
    en: 'What is a flaky test, what causes it, and what should a team do with such tests?'
    ru: 'Что такое flaky-тест, каковы его причины и что команде следует с ним делать?'
  - id: parallel-vs-distributed
    en: 'How do you speed up a test run, and what is the difference between a parallel and a distributed run? What is a reasonable duration for a UI test run in CI?'
    ru: 'Как ускорить прогон тестов и чем параллельный прогон отличается от распределённого? Какое время UI-прогона в CI вы считаете разумным?'
