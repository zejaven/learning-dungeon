summary:
  en: >
    A many-to-many relationship (employees ↔ courses) modelled with a join table,
    then queried: JOIN across the three tables, GROUP BY to aggregate per course,
    and HAVING to filter on the aggregate. You write the queries against a seeded
    database and see the result table; missions check the result is correct.
  ru: >
    Связь many-to-many (сотрудники ↔ курсы) через промежуточную таблицу и запросы к
    ней: JOIN по трём таблицам, GROUP BY для агрегации по курсам и HAVING для
    фильтра по агрегату. Вы пишете запросы к засеянной базе и видите таблицу
    результата; миссии проверяют, что результат верный.

assistantExample:
  en: "e.g. What is the difference between WHERE and HAVING?"
  ru: "например: В чём разница между WHERE и HAVING?"

