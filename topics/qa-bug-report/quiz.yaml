bossFight:
  # Structure of a bug report
  - id: bug-report-definition
    en: 'What is a bug report and what role does it play in the development process?'
    ru: 'Что такое баг-репорт и какую роль он играет в процессе разработки?'
  - id: bug-report-structure
    en: 'What fields does a good bug report consist of? Walk through each of them.'
    ru: 'Из каких полей состоит хороший баг-репорт? Пройдись по каждому из них.'
  - id: expected-vs-actual
    en: 'Why must a bug report always contain both the expected and the actual result?'
    ru: 'Почему в баг-репорте обязательно должны быть и ожидаемый, и фактический результат?'
  - id: attachments-value
    en: 'Which attachments (screenshots, screencasts, logs, stack traces) would you add to a bug report and why? Which are most valuable for backend errors?'
    ru: 'Какие вложения (скриншоты, скринкасты, логи, стектрейсы) ты добавишь в баг-репорт и зачем? Какие наиболее ценны для backend-ошибок?'
  - id: good-vs-bad-summary
    en: 'Rewrite the summary "Button doesn''t work" as a proper bug report title. What makes a summary good?'
    ru: 'Перепиши заголовок «Не работает кнопка» в виде правильного summary баг-репорта. Что делает заголовок хорошим?'
  # Prioritization and life cycle
  - id: severity-vs-priority
    en: 'How do severity and priority differ in a bug report, and who typically sets each of them? Give an example where they diverge.'
    ru: 'Чем severity отличается от priority в баг-репорте и кто обычно выставляет каждое из них? Приведи пример, когда они расходятся.'
  - id: bug-life-cycle
    en: 'Describe the life cycle of a bug from New to Closed. What do Reopened and Rejected mean, and who moves the bug between statuses?'
    ru: 'Опиши жизненный цикл бага от New до Closed. Что означают статусы Reopened и Rejected и кто переводит баг между статусами?'
  # Situational
  - id: critical-bug-on-prod
    en: 'A critical bug reached production. Who is to blame and what should be done? Lay out the expected answer model.'
    ru: 'На прод ушёл критический баг. Кто виноват и что делать? Изложи ожидаемую модель ответа.'
