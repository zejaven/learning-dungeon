bossFight:
- id: motivation-how-came-to-qa
  ru: Как вы пришли в тестирование и почему именно оно? Как построить честный и при этом сильный ответ?
- id: motivation-reason-to-leave
  ru: Как отвечать на вопрос о причине смены работы, не скатываясь в негатив о предыдущем работодателе?
- id: motivation-expectations-new-job
  ru: Чего вы ждёте от нового места работы? Как ответить конкретно, а не общими словами?
- id: motivation-motivates-demotivates
  ru: Что вас мотивирует в работе и что будет неприемлемым и демотивирующим? Зачем интервьюер задаёт этот вопрос?
- id: motivation-dislike-in-testing
  ru: Что вам не нравится в тестировании? Как ответить честно, не подставив себя?
- id: motivation-career-direction
  ru: Куда хотите двигаться в профессии — автотесты, управление, разработка? Как отвечать, если ещё не определились?
- id: motivation-dream-project
  ru: Опишите проект мечты. Что интервьюер хочет услышать этим вопросом?
- id: motivation-self-grade
  ru: Как вы оцениваете себя сейчас — junior, middle, senior? И чего вам не хватает до следующей ступени?
