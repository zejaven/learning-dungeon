# Theory topic: no missions (there is no practice editor) - only a Boss Fight.
bossFight:
  - id: what-besides-the-url
    en: Another team wants to call your service. Besides the URL, what do you have to give them?
    ru: Другая команда хочет вызывать ваш сервис. Что, кроме URL, вы обязаны им передать?
  - id: openapi-in-spring
    en: What is OpenAPI, and how would you publish it from a Spring Boot service?
    ru: Что такое OpenAPI и как вы опубликуете его из Spring Boot сервиса?
  - id: code-first-vs-contract-first
    en: Code-first or contract-first? When would you choose each?
    ru: Code-first или contract-first? Когда вы выберете каждый из подходов?
  - id: docs-drift
    en: How do you stop the published documentation from drifting away from the implementation?
    ru: Как не дать опубликованной документации разойтись с реализацией?
  - id: discovery-in-a-large-org
    en: In a company with fifty services, how does a team find an API that already exists?
    ru: В компании с полусотней сервисов - как команде найти API, который уже существует?
  - id: breaking-change-rollout
    en: You need to make a breaking change to an API three other teams already call. How do you roll it out?
    ru: Нужно внести ломающее изменение в API, который уже вызывают три другие команды. Как вы это выкатите?
  - id: async-and-grpc-contracts
    en: How would you share the contract for a Kafka event or a gRPC service rather than a REST endpoint?
    ru: Как поделиться контрактом события Kafka или gRPC-сервиса, а не REST-эндпоинта?
  - id: sharing-security-traps
    en: What are the security traps in sharing an API - Swagger UI, Postman collections, internal-only endpoints?
    ru: Какие есть риски безопасности при шаринге API - Swagger UI, Postman-коллекции, внутренние эндпоинты?
  - id: db-access-instead-of-api
    en: A colleague asks for read access to your database instead of using the API. What do you answer?
    ru: Коллега просит read-доступ к вашей базе вместо использования API. Что вы ответите?
