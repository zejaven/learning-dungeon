summary:
  en: >
    The basics of mobile QA: web, hybrid, and native apps; how emulators,
    simulators, and real devices differ and when to use each; how to pick the
    device matrix for testing; mobile-specific bugs and interrupt testing
    (calls, SMS, pushes, network switching, backgrounding); how to install
    test builds on Android and iOS (adb, Android Studio, TestFlight, Xcode,
    Firebase/App Center); and the key platform differences between iOS and
    Android.
  ru: >
    База мобильного тестирования: веб-, гибридные и нативные приложения; чем
    отличаются эмуляторы, симуляторы и реальные девайсы и когда что
    использовать; по какому принципу выбирать устройства для тестирования;
    мобильно-специфичные баги и тестирование на прерывания (звонки, SMS,
    пуши, переключение сети, сворачивание); как установить тестовую сборку на
    Android и iOS (adb, Android Studio, TestFlight, Xcode, Firebase/App
    Center); ключевые различия платформ iOS и Android.

