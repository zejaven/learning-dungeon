# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: pay-for-an-answer-of-nothing
    title:
      en: 'Pay for an answer of ''nothing'''
      ru: 'Заплати за ответ «ничего»'
    goal:
      en: Send a request to the regular endpoint while nothing has happened, and see that it is answered anyway.
      ru: Отправь запрос обычному эндпоинту, когда ничего не произошло, и увидь, что он всё равно получает ответ.
    event: ANSWERED_EMPTY
  - id: measure-how-late-it-is
    title:
      en: Measure how late the news is
      ru: Измерь опоздание новости
    goal:
      en: Let an event happen between two requests and read how many ticks it waited for the next one.
      ru: Дай событию произойти между двумя запросами и прочитай, сколько тиков оно ждало следующего.
    event: ANSWERED_NOW
  - id: news-with-nowhere-to-go
    title:
      en: Find the news with nowhere to go
      ru: Найди новость, которой некуда идти
    goal:
      en: Make something happen while there is no unanswered request, and see it sit in the server's log.
      ru: Сделай так, чтобы событие произошло, когда нет неотвеченного запроса, и увидь, как оно остаётся в журнале сервера.
    event: NO_ONE_LISTENING
  - id: park-a-request
    title:
      en: Park a request on the server
      ru: Припаркуй запрос на сервере
    goal:
      en: Find the step where the client has asked and the handler deliberately did not write a response.
      ru: Найди шаг, на котором клиент спросил, а обработчик намеренно не записал ответ.
    event: REQUEST_PARKED
  - id: answer-the-instant-it-happens
    title:
      en: Answer the instant it happens
      ru: Ответь в момент события
    goal:
      en: Make an event arrive while a request is parked and confirm the delay is zero.
      ru: Сделай так, чтобы событие пришло, пока запрос припаркован, и убедись, что задержка нулевая.
    event: PARKED_COMPLETED
  - id: expire-the-hold-on-purpose
    title:
      en: Let the hold expire on purpose
      ru: Дай удержанию истечь намеренно
    goal:
      en: Leave a parked request quiet long enough that the server answers empty, and find out why it must.
      ru: Оставь припаркованный запрос без новостей достаточно надолго, чтобы сервер ответил пустым, и выясни, почему он обязан это сделать.
    event: HOLD_EXPIRED
  - id: run-out-of-worker-threads
    title:
      en: Run the thread pool dry
      ru: Опустоши пул потоков
    goal:
      en: Park more blocking long polls than there are workers and see what happens to the next request.
      ru: Припаркуй больше блокирующих длинных опросов, чем есть воркеров, и посмотри, что случится со следующим запросом.
    event: POOL_EXHAUSTED
  - id: release-the-worker
    title:
      en: Hold the request, release the thread
      ru: Придержи запрос, отпусти поток
    goal:
      en: Park a request asynchronously and find the step where the worker goes back to the pool.
      ru: Припаркуй запрос асинхронно и найди шаг, на котором воркер возвращается в пул.
    event: WORKER_RELEASED
  - id: catch-up-with-a-cursor
    title:
      en: Catch up with a cursor
      ru: Догони по курсору
    goal:
      en: Open a poll whose since= is behind the log and watch it be answered without being parked.
      ru: Открой опрос, у которого since= отстаёт от журнала, и посмотри, как он получает ответ без парковки.
    event: POLL_CATCHES_UP
  - id: lose-an-event-in-the-gap
    title:
      en: Lose an event in the gap
      ru: Потеряй событие в промежутке
    goal:
      en: Drop the cursor, let an event land between two polls, and see it disappear with no error at all.
      ru: Убери курсор, дай событию попасть между двумя опросами и увидь, как оно исчезает вообще без ошибок.
    event: EVENT_MISSED
  - id: price-all-three-styles
    title:
      en: Price all three styles
      ru: Оцени все три стиля
    goal:
      en: Run one timeline through the regular endpoint and both long polls, and find the column that decides.
      ru: Прогони одну шкалу времени через обычный эндпоинт и оба длинных опроса и найди колонку, которая решает.
    event: STYLES_COMPARED
  - id: read-the-bill
    title:
      en: Read the bill
      ru: Прочитай счёт
    goal:
      en: Finish a run and compare requests, empty answers, delay and worker-ticks for that style.
      ru: Заверши прогон и сравни запросы, пустые ответы, задержку и воркер-тики для этого стиля.
    event: ENDPOINT_AUDIT

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: what-is-long-polling
    en: What is long polling, and how does it differ from a regular HTTP request?
    ru: Что такое длинный опрос (long polling) и чем он отличается от обычного HTTP-запроса?
  - id: what-changes-on-the-wire
    en: What actually changes on the wire when you switch an endpoint from regular responses to long polling?
    ru: Что на самом деле меняется на проводе, когда эндпоинт переводят с обычных ответов на длинный опрос?
  - id: long-polling-vs-short-polling
    en: How is long polling different from just polling every second? Which one is cheaper, and in what sense?
    ru: Чем длинный опрос отличается от опроса раз в секунду? Что дешевле и в каком смысле?
  - id: why-the-hold-is-bounded
    en: Why does the server answer an idle long poll after a while instead of holding the request indefinitely?
    ru: Почему сервер через некоторое время отвечает на простаивающий длинный опрос вместо того, чтобы держать запрос бесконечно?
  - id: timeout-ladder
    en: Which timeouts have to be ordered correctly for long polling to work — server, client, proxy — and in which direction?
    ru: Какие таймауты должны быть согласованы, чтобы длинный опрос работал, — серверный, клиентский, на прокси, — и в каком порядке?
  - id: server-side-cost
    en: What does a parked request cost the server? Answer for a blocking handler and for an async one.
    ru: Во что припаркованный запрос обходится серверу? Ответь для блокирующего обработчика и для асинхронного.
  - id: how-to-implement-in-spring
    en: How would you implement a long-poll endpoint in Spring so it does not exhaust the thread pool?
    ru: Как реализовать long-poll эндпоинт в Spring так, чтобы он не исчерпал пул потоков?
  - id: the-gap-between-polls
    en: A response ends its request. What happens to an event that occurs before the client opens the next one?
    ru: Ответ завершает свой запрос. Что происходит с событием, которое случилось до того, как клиент открыл следующий?
  - id: cursor-design
    en: How do you make a long-poll endpoint safe against missed events? What does the client have to send?
    ru: Как сделать long-poll эндпоинт защищённым от пропущенных событий? Что должен присылать клиент?
  - id: duplicates-and-ordering
    en: Can a long poll deliver the same event twice or out of order? What do you do about that on the client?
    ru: Может ли длинный опрос доставить одно событие дважды или не по порядку? Что с этим делать на клиенте?
  - id: status-code-for-empty
    en: What do you return when the hold expires with nothing to report, and why does the choice matter?
    ru: Что вернуть, когда удержание истекло и сообщать нечего, и почему выбор здесь важен?
  - id: browser-connection-limit
    en: A tab has a long poll open. What does that cost the browser, and what breaks if the page needs six other requests?
    ru: Во вкладке открыт длинный опрос. Чего это стоит браузеру и что ломается, если странице нужны ещё шесть запросов?
  - id: load-balancer-and-scaling
    en: You run three instances behind a load balancer. Does long polling need sticky sessions or a shared bus? Why?
    ru: У тебя три экземпляра за балансировщиком. Нужны ли длинному опросу sticky-сессии или общая шина? Почему?
  - id: long-polling-vs-sse-websocket
    en: When would you choose long polling over SSE or a WebSocket, and what would make you switch?
    ru: Когда выбрать длинный опрос вместо SSE или WebSocket и что заставит поменять решение?
  - id: high-message-rate
    en: Message volume rises to several events per second per client. What happens to long polling, and why?
    ru: Поток сообщений вырос до нескольких событий в секунду на клиента. Что происходит с длинным опросом и почему?
  - id: authentication-and-caching
    en: How do auth, cookies, caching and CORS behave on a long-poll endpoint compared with a normal one?
    ru: Как ведут себя авторизация, куки, кэширование и CORS на long-poll эндпоинте по сравнению с обычным?
  - id: observability
    en: Your dashboards now show a p99 latency of thirty seconds on one endpoint. Is that a bug? How do you monitor long polling properly?
    ru: На дашбордах у одного эндпоинта p99 стал тридцать секунд. Это баг? Как правильно мониторить длинный опрос?
  - id: client-side-loop
    en: Write the client side of a long poll. What has to be right about the retry loop for it not to hammer the server?
    ru: Опиши клиентскую часть длинного опроса. Что должно быть правильно в цикле повторов, чтобы он не долбил сервер?
  - id: is-it-push
    en: 'Someone calls long polling a "push" technology. Is that accurate? Defend your answer.'
    ru: 'Кто-то называет длинный опрос «push»-технологией. Насколько это верно? Обоснуй ответ.'
  - id: when-to-use-it-today
    en: With SSE and WebSockets widely supported, is there any reason to build long polling in a new system today?
    ru: SSE и WebSocket поддерживаются повсеместно — есть ли смысл строить длинный опрос в новой системе сегодня?
