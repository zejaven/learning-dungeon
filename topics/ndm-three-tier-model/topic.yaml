summary:
  en: >
    The Cisco three-layer hierarchical model for campus networks: Access,
    Distribution, and Core layer roles and technical functions, edge security
    (port security, 802.1X, DHCP snooping/DAI), HSRP/VRRP, route summarisation,
    the lean core rule, high-availability mechanisms (SSO/NSF, EtherChannel,
    StackWise, ISSU), the two-tier collapsed core, and the shift to Leaf-Spine.
  ru: >
    Трёхуровневая иерархическая модель Cisco для кампусных сетей: роли и
    технические функции уровней Access, Distribution и Core, безопасность края
    (port security, 802.1X, DHCP snooping/DAI), HSRP/VRRP, суммаризация
    маршрутов, правило «лёгкого» ядра, механизмы высокой доступности (SSO/NSF,
    EtherChannel, StackWise, ISSU), двухуровневый collapsed core и переход к
    Leaf-Spine.

assistantExample:
