missions:
  - id: factory-method-products
    type: structure
    title:
      en: Create Factory Method products
      ru: Создай продукты Factory Method
    goal:
      en: Add at least two classes that implement Document, for example PdfDocument and HtmlDocument.
      ru: Добавь минимум два класса, которые реализуют Document, например PdfDocument и HtmlDocument.
    requires:
      - { kind: interfaceWithImpls, name: Document, minImplementations: 2 }
  - id: factory-method-creators
    type: structure
    title:
      en: Add concrete creators
      ru: Добавь конкретные creators
    goal:
      en: Add PdfDocumentCreator and HtmlDocumentCreator, and make both extend DocumentCreator.
      ru: Добавь PdfDocumentCreator и HtmlDocumentCreator и сделай так, чтобы оба наследовали DocumentCreator.
    requires:
      - { kind: nodeExists, nodeKind: class, name: PdfDocumentCreator }
      - { kind: edge, relation: extends, from: PdfDocumentCreator, to: DocumentCreator }
      - { kind: nodeExists, nodeKind: class, name: HtmlDocumentCreator }
      - { kind: edge, relation: extends, from: HtmlDocumentCreator, to: DocumentCreator }
  - id: abstract-factory-products
    type: structure
    title:
      en: Create product families
      ru: Создай семейства продуктов
    goal:
      en: Add at least two Button implementations and at least two Dialog implementations.
      ru: Добавь минимум две реализации Button и минимум две реализации Dialog.
    requires:
      - { kind: interfaceWithImpls, name: Button, minImplementations: 2 }
      - { kind: interfaceWithImpls, name: Dialog, minImplementations: 2 }
  - id: abstract-factory-implementations
    type: structure
    title:
      en: Add concrete factories
      ru: Добавь конкретные factories
    goal:
      en: Add LightUiFactory and DarkUiFactory, and make both implement UiFactory.
      ru: Добавь LightUiFactory и DarkUiFactory и сделай так, чтобы оба реализовывали UiFactory.
    requires:
      - { kind: nodeExists, nodeKind: class, name: LightUiFactory }
      - { kind: edge, relation: implements, from: LightUiFactory, to: UiFactory }
      - { kind: nodeExists, nodeKind: class, name: DarkUiFactory }
      - { kind: edge, relation: implements, from: DarkUiFactory, to: UiFactory }
  - id: client-uses-abstract-factory
    type: structure
    title:
      en: Client depends on UiFactory
      ru: Client зависит от UiFactory
    goal:
      en: Give Application a field of type UiFactory, not LightUiFactory or DarkUiFactory.
      ru: Дай Application поле типа UiFactory, а не LightUiFactory или DarkUiFactory.
    requires:
      - { kind: edge, relation: association, from: Application, to: UiFactory }
  - id: compare-both-factory-shapes
    type: structure
    title:
      en: Compare both factory shapes
      ru: Сравни обе формы фабрик
    goal:
      en: Assemble both structures so the graph shows Factory Method creators and Abstract Factory family factories.
      ru: Собери обе структуры так, чтобы граф показывал creators для Factory Method и factories семейств для Abstract Factory.
    requires:
      - { kind: interfaceWithImpls, name: Document, minImplementations: 2 }
      - { kind: edge, relation: extends, from: PdfDocumentCreator, to: DocumentCreator }
      - { kind: edge, relation: extends, from: HtmlDocumentCreator, to: DocumentCreator }
      - { kind: edge, relation: implements, from: LightUiFactory, to: UiFactory }
      - { kind: edge, relation: implements, from: DarkUiFactory, to: UiFactory }
      - { kind: edge, relation: association, from: Application, to: UiFactory }

bossFight:
  - id: core-difference
    en: 'What is the core difference between Factory Method and Abstract Factory?'
    ru: 'В чём главное различие между Factory Method и Abstract Factory?'
  - id: extension-point
    en: 'Where is the extension point in Factory Method, and where is it in Abstract Factory?'
    ru: 'Где находится точка расширения в Factory Method и где она находится в Abstract Factory?'
  - id: one-product-vs-family
    en: 'Why is Factory Method usually about one product, while Abstract Factory is about a family of related products?'
    ru: 'Почему Factory Method обычно связан с одним продуктом, а Abstract Factory с семейством связанных продуктов?'
  - id: client-coupling
    en: 'How do both patterns reduce coupling to concrete classes?'
    ru: 'Как оба паттерна уменьшают связанность с конкретными классами?'
  - id: java-example
    en: 'Give a Java example where Abstract Factory is a better fit than Factory Method.'
    ru: 'Приведи Java-пример, где Abstract Factory подходит лучше, чем Factory Method.'
