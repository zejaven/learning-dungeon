id: stackoverflow-error
title:
  en: StackOverflowError and the Simplest Way to Cause It
  ru: StackOverflowError и простейший способ его получить
category:
  en: Java Core / Exceptions
  ru: Java Core / Исключения
type: JVM_MEMORY
mode: trace
aiProvider: claude
aiModel: claude-opus-4-8
categoryId: exceptions
difficulty: 1
catalogId: exceptions-2
style: Real world
summary:
  en: >
    What StackOverflowError is and the simplest method that triggers it: every
    method call pushes a frame onto the thread's fixed-size call stack, and a
    recursion that never reaches its base case keeps pushing frames until the
    stack is full — at which point the JVM throws StackOverflowError. The classic
    one-liner is a method that simply calls itself.
  ru: >
    Что такое StackOverflowError и какой простейший метод его вызывает: каждый
    вызов метода кладёт кадр в стек вызовов потока фиксированного размера, и
    рекурсия, которая никогда не доходит до базового случая, продолжает добавлять
    кадры, пока стек не заполнится — тогда JVM бросает StackOverflowError.
    Классический однострочник — метод, который просто вызывает сам себя.

primitives:
  - ArrayGrid
  - EventLog

defaultExample: infinite-recursion

examples:
  - id: infinite-recursion
    title:
      en: The classic one-liner
      ru: Классический однострочник
    file: 01-infinite-recursion.java
    explanation:
      en: >
        A method that calls itself with no base case — void overflow() {
        overflow(); }. Each call pushes a frame and never returns, so the stack
        fills and the JVM throws StackOverflowError.
      ru: >
        Метод, который вызывает сам себя без базового случая — void overflow() {
        overflow(); }. Каждый вызов кладёт кадр и не возвращается, поэтому стек
        заполняется и JVM бросает StackOverflowError.
  - id: missing-base-case
    title:
      en: Base case never reached
      ru: Базовый случай недостижим
    file: 02-missing-base-case.java
    explanation:
      en: >
        The recursion looks finite but the base case n == 0 is skipped forever
        (odd n steps by 2). A wrong base case overflows just like no base case.
      ru: >
        Рекурсия выглядит конечной, но базовый случай n == 0 пропускается навсегда
        (нечётное n шагает на 2). Неверный базовый случай переполняет так же, как
        и его отсутствие.
  - id: mutual-recursion
    title:
      en: Two methods bouncing
      ru: Два метода-пинг-понг
    file: 03-mutual-recursion.java
    explanation:
      en: >
        Recursion need not be a single self-call: ping() calls pong() calls
        ping() ... The alternating frames still pile up until the stack overflows.
      ru: >
        Рекурсия не обязана быть одиночным самовызовом: ping() вызывает pong()
        вызывает ping() ... Чередующиеся кадры всё равно копятся до переполнения
        стека.
  - id: bounded-recursion-ok
    title:
      en: Correct recursion (no overflow)
      ru: Корректная рекурсия (без переполнения)
    file: 04-bounded-recursion-ok.java
    explanation:
      en: >
        factorial(3) reaches its base case, so each frame returns and is popped.
        The stack never fills — the contrast that shows what a base case buys you.
      ru: >
        factorial(3) доходит до базового случая, поэтому каждый кадр возвращается
        и снимается. Стек не заполняется — контраст, показывающий, что даёт базовый
        случай.
  - id: too-deep-but-finite
    title:
      en: Correct but too deep
      ru: Корректная, но слишком глубокая
    file: 05-too-deep-but-finite.java
    explanation:
      en: >
        Even a valid base case overflows if the recursion simply goes too deep for
        the stack size (sum(1_000_000)). The fix is an iterative loop, not a bigger
        stack.
      ru: >
        Даже корректный базовый случай переполняет стек, если рекурсия просто
        слишком глубока для его размера (sum(1_000_000)). Лечится итеративным
        циклом, а не увеличением стека.

