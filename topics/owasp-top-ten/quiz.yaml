# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: what-is-owasp
    en: What is OWASP? What kind of organisation is it and what does it publish besides the Top 10?
    ru: Что такое OWASP? Что это за организация и что она публикует, кроме Top 10?
  - id: top-ten-purpose
    en: What is the OWASP Top 10 for, and what is it explicitly NOT?
    ru: Для чего нужен OWASP Top 10 и чем он явно НЕ является?
  - id: how-list-is-built
    en: How is the Top 10 assembled? Why are two of the ten categories chosen from a survey instead of from data?
    ru: Как собирается Top 10? Почему две категории из десяти выбираются по опросу, а не по данным?
  - id: name-the-ten
    en: Name the main risks in the OWASP Top 10 and say in one sentence what each one means.
    ru: Назовите основные риски из OWASP Top 10 и скажите одним предложением, что означает каждый.
  - id: broken-access-control
    en: Why is Broken Access Control number one? Give an example of IDOR and explain how you would prevent it.
    ru: Почему Broken Access Control занимает первое место? Приведите пример IDOR и объясните, как его предотвратить.
  - id: authn-vs-authz
    en: What is the difference between A01 Broken Access Control and A07 Identification and Authentication Failures?
    ru: В чём разница между A01 Broken Access Control и A07 Identification and Authentication Failures?
  - id: injection-fix
    en: What does the Injection category cover, and why is 'we validate and escape all input' the wrong answer to it?
    ru: Что покрывает категория Injection и почему «мы валидируем и экранируем весь ввод» - неверный ответ на неё?
  - id: crypto-failures
    en: What falls under Cryptographic Failures? How should passwords be stored, and why not with SHA-256?
    ru: Что попадает под Cryptographic Failures? Как надо хранить пароли и почему не через SHA-256?
  - id: insecure-design
    en: What is Insecure Design, and how does it differ from an implementation bug? Give an example and say how you would find such a flaw.
    ru: Что такое Insecure Design и чем он отличается от ошибки реализации? Приведите пример и скажите, как такой дефект находят.
  - id: misconfiguration-examples
    en: Give three examples of Security Misconfiguration in a Spring Boot service and how you would prevent them.
    ru: Приведите три примера Security Misconfiguration в сервисе на Spring Boot и как их предотвратить.
  - id: vulnerable-components
    en: How do you keep Vulnerable and Outdated Components under control? What did Log4Shell demonstrate?
    ru: Как держать под контролем уязвимые и устаревшие компоненты? Что показал Log4Shell?
  - id: integrity-deserialization
    en: What are Software and Data Integrity Failures? Why is deserializing untrusted data with Java native serialization dangerous?
    ru: Что такое Software and Data Integrity Failures? Почему опасно десериализовать недоверенные данные родной сериализацией Java?
  - id: logging-monitoring
    en: Why is a logging and monitoring gap on the list at all, and what exactly should a service log for security purposes?
    ru: Почему пробел в логировании и мониторинге вообще попал в список и что именно сервис должен логировать ради безопасности?
  - id: ssrf-explained
    en: Explain SSRF. Why is a server-side fetch of a user-supplied URL dangerous, and why is a denylist of internal addresses a weak defence?
    ru: Объясните SSRF. Почему опасно загружать на сервере URL, переданный пользователем, и почему чёрный список внутренних адресов - слабая защита?
  - id: xss-csrf-position
    en: Where are XSS and CSRF in the current Top 10, and what does their movement on the list actually mean?
    ru: Где в текущем Top 10 находятся XSS и CSRF и что на самом деле означает их перемещение по списку?
  - id: top-ten-vs-asvs
    en: Your manager says 'we've fixed the whole OWASP Top 10, we're secure.' How do you respond, and what would you use instead as a verification target?
    ru: 'Руководитель говорит: «мы закрыли весь OWASP Top 10, мы защищены». Что вы ответите и что возьмёте вместо него как цель для проверки?'
  - id: applying-in-practice
    en: Which of these risks can be caught automatically in CI, and which need a human? How would you build that into a team's process?
    ru: Какие из этих рисков ловятся автоматически в CI, а для каких нужен человек? Как встроить это в процесс команды?
