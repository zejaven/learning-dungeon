bossFight:
- id: how-used-postman
  ru: 'Расскажите, как вы пользовались Postman: просто тестировали бэкенд, настраивали проверку ответа или автоматизировали? Опишите ваш уровень.'
- id: why-variables
  ru: Что такое переменные в Postman и для чего они нужны? Какой у них синтаксис в запросе?
- id: variable-scopes
  ru: Какие уровни переменных есть в Postman (глобальные, окружения, коллекции, локальные)? Когда какие применять?
- id: variable-priority
  ru: Глобальная, коллекционная и локальная переменные имеют одинаковое имя — какая будет использована? Расставьте приоритеты.
- id: first-executed-on-collection-run
  ru: 'Что выполняется в первую очередь при запуске коллекции в Postman: тесты или что-то другое? Почему?'
- id: pre-request-vs-tests
  ru: Чем отличаются pre-request скрипты от post-response (Tests)? Приведите по примеру задачи для каждого.
- id: chaining-requests
  ru: 'Как связать запросы в сценарий: передать id из ответа одного запроса в следующий? Какие механизмы Postman для этого есть?'
- id: newman-ci
  ru: Как автоматизировать прогон коллекции Postman? Что такое Collection Runner и Newman и как их встроить в CI?
