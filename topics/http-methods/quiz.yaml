# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: read-without-changing
    title:
      en: Read without changing anything
      ru: Прочитай, ничего не изменив
    goal:
      en: Send a GET and confirm the server holds exactly what it held before the request.
      ru: Отправь GET и убедись, что на сервере осталось ровно то же, что было до запроса.
    event: SAFE_READ
  - id: ask-for-headers-only
    title:
      en: Ask for the headers only
      ru: Запроси только заголовки
    goal:
      en: Use HEAD to get the status and headers of a resource without downloading its body.
      ru: Получи через HEAD статус и заголовки ресурса, не скачивая его тело.
    event: HEAD_NO_BODY
  - id: discover-the-methods
    title:
      en: Ask what a URL supports
      ru: Спроси, что поддерживает URL
    goal:
      en: Send OPTIONS and read the Allow header instead of guessing which methods exist.
      ru: Отправь OPTIONS и прочитай заголовок Allow вместо того, чтобы гадать, какие методы есть.
    event: OPTIONS_ALLOW
  - id: reuse-the-answer
    title:
      en: Answer without asking the server
      ru: Ответь, не спрашивая сервер
    goal:
      en: Send the same GET twice and have the second one served from the client cache.
      ru: Отправь один и тот же GET дважды и добейся, чтобы второй ответил из клиентского кэша.
    event: CACHE_HIT
  - id: create-a-resource
    title:
      en: Create a resource
      ru: Создай ресурс
    goal:
      en: Make the server create a new resource and report its URL in a Location header.
      ru: Добейся, чтобы сервер создал новый ресурс и вернул его URL в заголовке Location.
    event: RESOURCE_CREATED
  - id: create-it-twice
    title:
      en: Create the same thing twice
      ru: Создай одно и то же дважды
    goal:
      en: Repeat one POST body and watch a second independent resource appear from the same intent.
      ru: Повтори одно и то же тело POST и увидь, как из одного намерения появляется второй независимый ресурс.
    event: DUPLICATE_CREATED
  - id: repeat-without-effect
    title:
      en: Repeat without effect
      ru: Повтори без последствий
    goal:
      en: Send a request twice so the second call leaves the server in exactly the state the first one did.
      ru: Отправь запрос дважды так, чтобы второй вызов оставил сервер ровно в том же состоянии, что и первый.
    event: IDEMPOTENT_REPEAT
  - id: wrong-method-for-the-url
    title:
      en: 'Use the wrong method'
      ru: 'Используй не тот метод'
    goal:
      en: Aim a method at a URL that does not support it and read the Allow header in the 405.
      ru: Направь метод на URL, который его не поддерживает, и прочитай заголовок Allow в ответе 405.
    event: METHOD_NOT_ALLOWED
  - id: break-the-safe-promise
    title:
      en: Break the safety promise
      ru: Нарушь обещание безопасности
    goal:
      en: Run a GET whose handler writes, and see who repeats it for you.
      ru: Выполни GET, обработчик которого пишет, и посмотри, кто повторит его за тебя.
    event: UNSAFE_GET

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: what-is-http
    en: What is HTTP? Describe the protocol and what one request and one response consist of.
    ru: Что такое HTTP? Опиши протокол и из чего состоят один запрос и один ответ.
  - id: methods-list
    en: Which HTTP methods exist, and what is each one for?
    ru: Какие существуют HTTP-методы и для чего нужен каждый?
  - id: safe-vs-idempotent
    en: What do "safe" and "idempotent" mean, and which methods are which?
    ru: Что означают «безопасный» и «идемпотентный» и какие методы к ним относятся?
  - id: get-vs-post
    en: What is the difference between GET and POST beyond "parameters in the URL versus in the body"?
    ru: Чем GET отличается от POST, кроме «параметры в URL против параметров в теле»?
  - id: post-vs-put-creation
    en: Both POST and PUT can create a resource. When do you use which, and what status code comes back?
    ru: И POST, и PUT могут создать ресурс. Когда использовать какой и какой статус вернётся?
  - id: put-vs-patch-short
    en: How do PUT and PATCH differ, and why is PATCH not guaranteed to be idempotent?
    ru: Чем PUT отличается от PATCH и почему для PATCH идемпотентность не гарантируется?
  - id: head-and-options
    en: What are HEAD and OPTIONS for? Give a realistic use for each.
    ru: Зачем нужны HEAD и OPTIONS? Приведи реалистичный сценарий для каждого.
  - id: stateless-protocol
    en: 'HTTP is called a stateless protocol. What does that mean, and how do sessions and authentication work then?'
    ru: 'HTTP называют протоколом без состояния. Что это значит и как тогда работают сессии и аутентификация?'
  - id: status-code-classes
    en: What are the HTTP status code classes, and which codes would a well-behaved CRUD endpoint return?
    ru: Какие есть классы кодов состояния HTTP и какие коды вернёт корректный CRUD-эндпоинт?
  - id: 404-vs-405
    en: When does a server answer 404, when 405, and when 501?
    ru: Когда сервер отвечает 404, когда 405, а когда 501?
  - id: unsafe-get-consequences
    en: A team exposes GET /orders/1/cancel because it is easy to put behind a link. What goes wrong?
    ru: Команда сделала GET /orders/1/cancel, потому что так удобно повесить ссылку. Что пойдёт не так?
  - id: retry-after-timeout
    en: A request times out and the client does not know whether it arrived. Which methods can it retry blindly, and what do you do about the rest?
    ru: Запрос завис по таймауту, и клиент не знает, дошёл ли он. Какие методы можно повторить вслепую и что делать с остальными?
  - id: caching-rules
    en: Which responses may be cached, and what does a GET have to look like for caching to be safe?
    ru: Какие ответы можно кэшировать и как должен выглядеть GET, чтобы кэширование было безопасным?
  - id: body-in-get
    en: Can a GET request have a body? Where do you put parameters and what are the limits of a URL?
    ru: Может ли GET-запрос иметь тело? Где размещать параметры и какие есть ограничения у URL?
  - id: http-versions
    en: How do HTTP/1.1, HTTP/2 and HTTP/3 differ, and does any of it change the meaning of the methods?
    ru: Чем различаются HTTP/1.1, HTTP/2 и HTTP/3 и меняется ли от этого смысл методов?
  - id: designing-an-endpoint
    en: You are designing an API for orders — creating, reading, changing status, cancelling. Which methods and URLs do you pick, and why?
    ru: Ты проектируешь API заказов — создание, чтение, смена статуса, отмена. Какие методы и URL выберешь и почему?
