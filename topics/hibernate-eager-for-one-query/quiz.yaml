# Theory topic: no missions (there is no practice editor) — only a Boss Fight.
bossFight:
  - id: eager-for-one-query
    en: If LAZY is the default, how do you load an association eagerly for one specific query?
    ru: Если по умолчанию стоит LAZY, как загрузить связь жадно для одного конкретного запроса?
  - id: join-fetch
    en: What does JOIN FETCH do, and how is it different from a plain JOIN?
    ru: Что делает JOIN FETCH и чем он отличается от обычного JOIN?
  - id: entity-graph
    en: What is a JPA entity graph and how do you use it to fetch eagerly?
    ru: Что такое граф сущности JPA и как с его помощью загрузить связь жадно?
  - id: fetchgraph-vs-loadgraph
    en: What is the difference between the fetchgraph and loadgraph hints?
    ru: В чём разница между хинтами fetchgraph и loadgraph?
  - id: why-not-eager-mapping
    en: Why prefer per-query eager fetching over setting FetchType.EAGER on the mapping?
    ru: Почему загрузка на уровне запроса предпочтительнее, чем FetchType.EAGER в маппинге?
  - id: multiple-bag-fetch
    en: What is MultipleBagFetchException and how do you work around it?
    ru: Что такое MultipleBagFetchException и как его обойти?
  - id: join-fetch-pagination
    en: Why is paginating a query that JOIN FETCHes a collection problematic?
    ru: Почему пагинация запроса с JOIN FETCH коллекции вызывает проблемы?
