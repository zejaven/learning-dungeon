# Theory topic: no missions (there is no practice editor) - only a Boss Fight.
bossFight:
  - id: planner-choice
    en: Why can PostgreSQL choose Seq Scan even when a matching index exists?
    ru: Почему PostgreSQL может выбрать Seq Scan, даже если подходящий индекс существует?
  - id: selectivity
    en: What is selectivity, and why does a low-selectivity predicate often make an index unattractive?
    ru: Что такое селективность и почему предикат с низкой селективностью часто делает индекс невыгодным?
  - id: non-index-friendly-predicate
    en: Give examples of predicates that prevent a normal B-tree index from being used effectively.
    ru: Приведите примеры предикатов, которые мешают эффективно использовать обычный B-tree индекс.
  - id: stale-statistics
    en: How can stale or incomplete statistics lead PostgreSQL to ignore a useful index?
    ru: Как устаревшая или неполная статистика может привести к тому, что PostgreSQL проигнорирует полезный индекс?
  - id: composite-index-order
    en: How can the column order in a composite index explain why the planner does not use it?
    ru: Как порядок колонок в составном индексе может объяснить, почему planner его не использует?
  - id: partial-expression-indexes
    en: When would you use a partial or expression index to fix an index-not-used problem?
    ru: Когда для исправления проблемы неиспользуемого индекса стоит применять частичный индекс или expression index?
  - id: index-only-scan
    en: Why can an index-only scan still require heap access in PostgreSQL?
    ru: Почему Index Only Scan в PostgreSQL всё равно может требовать обращения к heap?
  - id: safe-remediation
    en: What safe sequence of checks would you follow before adding or changing an index in production?
    ru: Какую безопасную последовательность проверок вы выполните перед добавлением или изменением индекса в production?
