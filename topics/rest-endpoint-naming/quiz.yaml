# Missions are checked on the frontend: a mission is complete when a run
# produces a trace event whose `event` field matches.
missions:
  - id: route-a-request
    title:
      en: Let the path pick the thing
      ru: Пусть путь выберет вещь
    goal:
      en: Expose a resource URL and send a request that lands on it, so the path picks the thing and the method picks the action.
      ru: Выстави URL ресурса и отправь запрос, который в него попадёт, чтобы путь выбрал вещь, а метод — действие.
    event: REQUEST_ROUTED
  - id: spot-a-verb-in-the-path
    title:
      en: Catch a verb in the path
      ru: Поймай глагол в пути
    goal:
      en: Expose an endpoint whose path spells out the action and see the naming rule it breaks.
      ru: Выстави эндпоинт, чей путь называет действие, и посмотри, какое правило именования он нарушает.
    event: NAMING_SMELL
  - id: move-the-verb-into-the-method
    title:
      en: Move the verb into the method
      ru: Перенеси глагол в метод
    goal:
      en: Rename an RPC-style endpoint into resource plus method and watch the URLs collapse into one.
      ru: Переименуй RPC-эндпоинт в «ресурс плюс метод» и посмотри, как URL схлопываются в один.
    event: ENDPOINT_RENAMED
  - id: filter-in-the-query-string
    title:
      en: Filter without a new URL
      ru: Отфильтруй без нового URL
    goal:
      en: Send a request that filters, sorts or pages a collection through the query string instead of the path.
      ru: Отправь запрос, который фильтрует, сортирует или разбивает коллекцию на страницы через query string, а не через путь.
    event: QUERY_FILTERED
  - id: one-url-many-methods
    title:
      en: 'Right noun, wrong verb'
      ru: 'Существительное верное, глагол нет'
    goal:
      en: Send a method that a registered URL does not answer and get the 405 that lists the ones it does.
      ru: Отправь метод, на который зарегистрированный URL не отвечает, и получи 405 со списком тех, на которые он отвечает.
    event: METHOD_NOT_ALLOWED
  - id: miss-by-one-letter
    title:
      en: Miss by one letter
      ru: Промахнись на одну букву
    goal:
      en: Ask for a URL that differs from a registered one only in case or in singular vs plural, and see it fail.
      ru: Запроси URL, который отличается от зарегистрированного только регистром или числом, и увидь отказ.
    event: NO_ROUTE
  - id: a-get-that-changes-data
    title:
      en: 'Write behind a GET'
      ru: 'Запись под видом GET'
    goal:
      en: Expose a GET whose path names a change, and see why a method defined as safe must not modify anything.
      ru: Выстави GET, чей путь называет изменение, и пойми, почему метод, объявленный безопасным, ничего не должен менять.
    event: UNSAFE_GET
  - id: a-read-behind-post
    title:
      en: 'Read behind a POST'
      ru: 'Чтение под видом POST'
    goal:
      en: Expose a read-only operation as POST and see what the surface gives up by hiding it behind a write method.
      ru: Выстави операцию только для чтения как POST и посмотри, что теряет поверхность, пряча её за методом записи.
    event: READ_BEHIND_POST

# Boss fight questions are surfaced to the AI assistant / interview practice.
bossFight:
  - id: naming-rule-core
    en: How would you name the endpoints for getting and changing data? State the rule you follow and show it on one resource.
    ru: Как ты назовёшь эндпоинты для получения и изменения данных? Сформулируй правило и покажи его на одном ресурсе.
  - id: crud-to-endpoints
    en: Map the five operations on an employee — list, read one, create, update, delete — onto concrete URLs and methods.
    ru: Разложи пять операций над сотрудником — список, чтение одного, создание, изменение, удаление — на конкретные URL и методы.
  - id: why-not-get-employee
    en: What exactly is wrong with 'GET /getEmployeeById?id=42'? It works, so name the concrete costs.
    ru: Что именно не так с 'GET /getEmployeeById?id=42'? Он работает — назови конкретные издержки.
  - id: singular-or-plural
    en: Singular or plural for a collection, and does it matter which one you pick as long as you are consistent?
    ru: Единственное или множественное число для коллекции и важно ли, что именно выбрать, если делать это последовательно?
  - id: path-vs-query
    en: What goes in the path and what goes in the query string? Where do a filter, a sort order and a page number belong?
    ru: Что помещают в путь, а что — в query string? Где место фильтру, порядку сортировки и номеру страницы?
  - id: filtering-many-parameters
    en: A screen filters employees by department, status and hire date, sorted and paged. How do you design that endpoint?
    ru: Экран фильтрует сотрудников по отделу, статусу и дате найма, с сортировкой и постраничностью. Как спроектировать этот эндпоинт?
  - id: safe-idempotent-methods
    en: Which HTTP methods are safe and which are idempotent, and how does that shape which method you pick for an endpoint?
    ru: Какие HTTP-методы безопасны, а какие идемпотентны, и как это влияет на выбор метода для эндпоинта?
  - id: get-that-modifies
    en: A colleague exposes 'GET /users/42/delete' because a link can only issue a GET. What do you tell them, and what do you propose instead?
    ru: Коллега выставляет 'GET /users/42/delete', потому что ссылка умеет только GET. Что ты ему скажешь и что предложишь взамен?
  - id: post-for-reads
    en: When is 'POST /search' with a filter body defensible, and what do you lose by not making it a GET?
    ru: Когда 'POST /search' с телом-фильтром оправдан и что теряется от того, что это не GET?
  - id: non-crud-actions
    en: How do you name an operation that is not CRUD — approve an order, cancel a booking, recalculate a salary?
    ru: Как назвать операцию, которая не является CRUD, — подтвердить заказ, отменить бронь, пересчитать зарплату?
  - id: sub-resources-and-nesting
    en: When do you nest a URL under another resource, and how deep is too deep?
    ru: Когда вкладывать URL внутрь другого ресурса и какая вложенность уже чрезмерна?
  - id: status-code-404-405
    en: What is the difference between 404 and 405 for the same request, and why can a well-named API tell them apart?
    ru: В чём разница между 404 и 405 для одного и того же запроса и почему хорошо названный API может их различить?
  - id: update-method-choice
    en: For changing data, would you expose PUT, PATCH, or POST on the item URL? Justify the choice.
    ru: Для изменения данных ты выставишь PUT, PATCH или POST по URL элемента? Обоснуй выбор.
  - id: versioning-endpoints
    en: Where does the API version go in an endpoint, and what are the trade-offs of putting it in the path?
    ru: Где в эндпоинте место версии API и каковы компромиссы размещения её в пути?
  - id: naming-conventions-details
    en: Lower case or camelCase, hyphens or underscores, trailing slash or not, file extension or Accept header — what do you standardise on?
    ru: Нижний регистр или camelCase, дефисы или подчёркивания, слэш в конце или нет, расширение файла или заголовок Accept — что ты стандартизируешь?
  - id: bulk-and-relationships
    en: How would you name endpoints for a bulk update and for the link between two resources, such as an employee's documents?
    ru: Как назвать эндпоинты для массового обновления и для связи двух ресурсов — например, документов сотрудника?
